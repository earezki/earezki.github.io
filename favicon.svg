<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Background with squircle-like radius -->
  <rect width="100" height="100" rx="24" fill="#121a2b" />
  
  <!-- Left Chevron -->
  <path d="M 36 31 L 17 50 L 36 69" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="10" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
        
  <!-- Center Pill -->
  <rect x="45" y="15" width="10" height="70" rx="5" fill="#ffffff" />
  
  <!-- Right Chevron -->
  <path d="M 64 31 L 83 50 L 64 69" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="10" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
</svg>