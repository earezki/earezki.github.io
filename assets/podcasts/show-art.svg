<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#0F172A" stop-opacity="1"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="1"/>
    </radialGradient>
    
    <!-- Metallic & Neon Gradients for Graphics -->
    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>
    
    <linearGradient id="neonMint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05FEB1"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    
    <linearGradient id="glassLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="glassRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="goldCoins" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Text Brand Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#05FEB1"/>
    </linearGradient>

    <!-- Filters for Neon Glow Effects -->
    <filter id="neonGlowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="15" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="neonGlowMint" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur1"/>
      <feGaussianBlur stdDeviation="20" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Cyber Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.7" stroke-opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="1000" fill="url(#bgGlow)" />
  
  <!-- Overlay Cyber Grid -->
  <rect width="1000" height="1000" fill="url(#grid)" />

  <!-- Abstract Design Accents (Tech circuit curves in background) -->
  <g opacity="0.15">
    <path d="M-100,200 Q200,150 400,350 T900,200" fill="none" stroke="#00F2FE" stroke-width="2" stroke-dasharray="10 15"/>
    <path d="M1100,800 Q800,850 600,650 T100,800" fill="none" stroke="#05FEB1" stroke-width="2" stroke-dasharray="5 10"/>
    <circle cx="400" cy="350" r="4" fill="#00F2FE"/>
    <circle cx="600" cy="650" r="4" fill="#05FEB1"/>
  </g>

  <!-- CENTRAL GRAPHIC: THE ISOMETRIC DEV JOURNAL -->
  <g transform="translate(0, 30)">
    
    <!-- Soft Backlight Under the Journal -->
    <ellipse cx="500" cy="460" rx="220" ry="80" fill="#00F2FE" filter="blur(40px)" opacity="0.25"/>
    <ellipse cx="500" cy="460" rx="120" ry="45" fill="#05FEB1" filter="blur(30px)" opacity="0.2"/>

    <!-- Journal Outer Cover / Shadow Base (3D Depth) -->
    <path d="M 500,555 L 290,438 L 290,452 L 500,569 L 710,452 L 710,438 Z" fill="#090D16" />
    <path d="M 500,559 L 290,442 L 290,458 L 500,575 L 710,458 L 710,442 Z" fill="#020617" />

    <!-- Left Page - Development Panel (Glassmorphic) -->
    <path d="M 500,550 L 300,435 L 300,225 L 500,340 Z" fill="url(#glassLeft)" stroke="#00F2FE" stroke-width="1.5" stroke-opacity="0.6"/>
    <path d="M 495,547 L 305,432 L 305,232 L 495,347 Z" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.1"/>

    <!-- Right Page - Finance Panel (Glassmorphic) -->
    <path d="M 500,550 L 700,435 L 700,225 L 500,340 Z" fill="url(#glassRight)" stroke="#05FEB1" stroke-width="1.5" stroke-opacity="0.6"/>
    <path d="M 505,547 L 695,432 L 695,232 L 505,347 Z" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.1"/>

    <!-- Book Spine Glow Highlight -->
    <line x1="500" y1="340" x2="500" y2="550" stroke="#FFFFFF" stroke-dasharray="3 6" stroke-opacity="0.4" stroke-width="2"/>

    <!-- LEFT PAGE CONTENT: DEVELOPMENT / CODE (Sloped to match isometric grid) -->
    <g transform="matrix(0.866, 0.5, 0, 1, 0, 0)">
      <!-- Note: Isometric mapping adjusted visually inside 3D space -->
      <!-- Terminal Prompt Console Graphic -->
      <path d="M 390,140 L 415,155 L 390,170" fill="none" stroke="url(#cyberCyan)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlowCyan)"/>
      <rect x="425" y="163" width="25" height="5" rx="2.5" fill="#00F2FE" filter="url(#neonGlowCyan)"/>

      <!-- Glowing Code Braces Structure -->
      <path d="M 370,210 L 340,210 L 340,320 L 370,320" fill="none" stroke="#1E293B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Mock Syntax Lines -->
      <rect x="360" y="225" width="90" height="6" rx="3" fill="#38BDF8" opacity="0.8"/>
      <rect x="360" y="242" width="130" height="6" rx="3" fill="url(#cyberCyan)" filter="url(#neonGlowCyan)"/>
      <rect x="380" y="259" width="75" height="6" rx="3" fill="#1E293B"/>
      <rect x="380" y="276" width="105" height="6" rx="3" fill="#38BDF8" opacity="0.6"/>
      <rect x="360" y="293" width="60" height="6" rx="3" fill="#00F2FE" filter="url(#neonGlowCyan)"/>
    </g>

    <!-- RIGHT PAGE CONTENT: FINANCE / MARKET TRENDS (Sloped to match isometric grid) -->
    <g transform="matrix(0.866, -0.5, 0, 1, 67, 500)">
      <!-- Bullish Candlestick Charts -->
      <!-- Candle 1 -->
      <line x1="390" y1="50" x2="390" y2="100" stroke="#05FEB1" stroke-width="1.5" opacity="0.5"/>
      <rect x="385" y="60" width="10" height="25" rx="1" fill="#05FEB1" opacity="0.8"/>
      
      <!-- Candle 2 -->
      <line x1="420" y1="-10" x2="420" y2="60" stroke="#05FEB1" stroke-width="1.5" opacity="0.5"/>
      <rect x="415" y="10" width="10" height="40" rx="1" fill="url(#neonMint)" filter="url(#neonGlowMint)"/>

      <!-- Candle 3 (Bearish pull) -->
      <line x1="450" y1="15" x2="450" y2="75" stroke="#F43F5E" stroke-width="1.5" opacity="0.4"/>
      <rect x="445" y="25" width="10" height="25" rx="1" fill="#F43F5E" opacity="0.6"/>

      <!-- Candle 4 (Massive breakout) -->
      <line x1="480" y1="-80" x2="480" y2="10" stroke="#05FEB1" stroke-width="1.5" opacity="0.5"/>
      <rect x="475" y="-55" width="10" height="50" rx="1" fill="url(#neonMint)" filter="url(#neonGlowMint)"/>

      <!-- Trending Growth Overlay Line -->
      <path d="M 360,110 L 390,75 L 420,30 L 450,40 L 480,-30 L 510,-70" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="drop-shadow(0px 4px 8px rgba(5, 254, 177, 0.5))"/>
      
      <!-- Hotspots on Chart -->
      <circle cx="480" cy="-30" r="4" fill="#05FEB1" filter="url(#neonGlowMint)"/>
      <circle cx="510" cy="-70" r="6" fill="#FFFFFF" filter="url(#neonGlowMint)"/>
    </g>

    <!-- Floating Graphic Accents (Linking Tech & Wealth) -->
    <!-- Floating Binary Node -->
    <g transform="translate(230, 240)" filter="url(#neonGlowCyan)">
      <circle cx="0" cy="0" r="16" fill="#0F172A" stroke="#00F2FE" stroke-width="2"/>
      <text x="0" y="5" font-family="monospace" font-size="14" font-weight="bold" fill="#00F2FE" text-anchor="middle">&lt;/&gt;</text>
    </g>

    <!-- Floating Currency/Finance Node -->
    <g transform="translate(770, 240)" filter="url(#neonGlowMint)">
      <circle cx="0" cy="0" r="16" fill="#0F172A" stroke="#05FEB1" stroke-width="2"/>
      <text x="0" y="6" font-family="sans-serif" font-size="18" font-weight="bold" fill="#05FEB1" text-anchor="middle">$</text>
    </g>

    <!-- Connecting digital light beam curving over the top -->
    <path d="M 246,240 Q 500,90 754,240" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.7"/>
  </g>

  <!-- PODCAST TYPOGRAPHY & BRANDING SECTION -->
  <g transform="translate(500, 715)">
    <!-- Subtitle Banner -->
    <rect x="-140" y="-38" width="280" height="26" rx="13" fill="#1E293B" opacity="0.6" stroke="#334155" stroke-width="1"/>
    <text y="-21" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" font-weight="bold" fill="#05FEB1" letter-spacing="4" text-anchor="middle">TECH &amp; FINANCE</text>

    <!-- Main Title: THE DEV JOURNAL -->
    <text y="40" font-family="'Inter', 'Montserrat', -apple-system, sans-serif" font-weight="900" font-size="64" fill="url(#textGrad)" letter-spacing="1" text-anchor="middle">
      THE <tspan fill="url(#accentGrad)">DEV</tspan> JOURNAL
    </text>

    <!-- Elegant separator line -->
    <g transform="translate(0, 70)">
      <line x1="-150" y1="0" x2="150" y2="0" stroke="url(#accentGrad)" stroke-width="2" opacity="0.8"/>
      <circle cx="0" cy="0" r="5" fill="#1E293B" stroke="#FFFFFF" stroke-width="2"/>
    </g>

    <!-- Hosts Signature -->
    <text y="115" font-family="'Inter', 'Montserrat', -apple-system, sans-serif" font-weight="600" font-size="18" fill="#94A3B8" letter-spacing="12" text-anchor="middle">
      SLOANE <tspan fill="#F1F5F9" font-weight="700">&amp;</tspan> VANCE
    </text>
  </g>
  
</svg>