<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 760" preserveAspectRatio="xMidYMid meet">
  <style>
    svg {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: transparent;
    }
    .title-main { font-size: 18px; font-weight: 800; fill: #f8fafc; letter-spacing: 1px; }
    .title-sub  { font-size: 11px; fill: #64748b; letter-spacing: 1px; }

    /* Column headers */
    .col-box { fill: #1e293b; stroke: #334155; stroke-width: 2; rx: 10; }
    .col-label { font-size: 14px; font-weight: 700; fill: #f8fafc; text-anchor: middle; }
    .col-sub   { font-size: 10px; fill: #64748b; text-anchor: middle; }

    /* Key boxes */
    .key-priv { fill: #2d1810; stroke: #ef4444; stroke-width: 1.5; rx: 8; }
    .key-pub  { fill: #0f2030; stroke: #0ea5e9; stroke-width: 1.5; rx: 8; }
    .key-shared { fill: #14302a; stroke: #10b981; stroke-width: 2; rx: 8; }
    .key-cert { fill: #1c1a08; stroke: #f59e0b; stroke-width: 1.5; rx: 8; }

    .key-label { font-size: 11px; font-weight: 700; text-anchor: middle; }
    .key-sub   { font-size: 10px; fill: #94a3b8; text-anchor: middle; }

    /* Session rows */
    .session-label { font-size: 12px; font-weight: 700; fill: #f8fafc; }
    .session-row { fill: #1e293b; stroke: #334155; stroke-width: 1; rx: 8; }
    .session-row-compromised { fill: #2d1810; stroke: #ef4444; stroke-width: 1; stroke-dasharray: 4 3; rx: 8; }
    .session-safe { fill: #14302a; stroke: #10b981; stroke-width: 1; rx: 8; }

    /* Animated key generation */
    .gen-pulse { animation: key-gen 3s ease-in-out infinite; }
    .gen-pulse-delay { animation: key-gen 3s 1.5s ease-in-out infinite; }
    @keyframes key-gen {
      0%, 20%  { opacity: 0.4; }
      40%, 60% { opacity: 1; filter: drop-shadow(0 0 8px rgba(14,165,233,0.7)); }
      80%, 100%{ opacity: 0.4; filter: none; }
    }

    /* ECDH math animation */
    .math-show { animation: appear 6s ease-in-out infinite; }
    @keyframes appear {
      0%, 10%  { opacity: 0; }
      20%, 80% { opacity: 1; }
      90%, 100%{ opacity: 0; }
    }

    /* Shared secret glow */
    .secret-glow { animation: secret-pulse 2.5s ease-in-out infinite; }
    @keyframes secret-pulse {
      0%, 100%{ filter: drop-shadow(0 0 4px rgba(16,185,129,0.3)); }
      50%     { filter: drop-shadow(0 0 16px rgba(16,185,129,0.9)); }
    }

    /* Exchange arrow */
    .xchg-arrow { fill: none; stroke-width: 2.5; stroke-dasharray: 8 5; animation: xchg-flow 2s linear infinite; }
    .xchg-blue   { stroke: #0ea5e9; }
    .xchg-purple { stroke: #8b5cf6; }
    @keyframes xchg-flow {
      from { stroke-dashoffset: 52; }
      to   { stroke-dashoffset: 0; }
    }

    /* Old session lock icon  */
    .lock-safe   { font-size: 16px; fill: #10b981; }
    .lock-broken { font-size: 16px; fill: #ef4444; }

    /* Attack scenario */
    .attacker-box { fill: #1e0a0a; stroke: #ef4444; stroke-width: 2; rx: 10; stroke-dasharray: 6 4; }
    .attacker-text { font-size: 12px; font-weight: 700; fill: #fca5a5; text-anchor: middle; }
    .attacker-sub  { font-size: 10px; fill: #f87171; text-anchor: middle; }

    .vs-label { font-size: 13px; font-weight: 800; fill: #475569; text-anchor: middle; }

    .dim-text { fill: #475569; }

    .footnote { font-size: 10px; fill: #475569; text-anchor: middle; }
  </style>
  <defs>
    <marker id="arr-blue-pfs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0ea5e9" />
    </marker>
    <marker id="arr-purple-pfs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b5cf6" />
    </marker>
    <marker id="arr-green-pfs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981" />
    </marker>
    <marker id="arr-red-pfs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444" />
    </marker>
    <marker id="arr-gray-pfs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="860" height="760" fill="#0f172a" rx="16" />

  <!-- Title -->
  <text x="430" y="38" class="title-main" text-anchor="middle">Perfect Forward Secrecy via ECDHE</text>
  <text x="430" y="56" class="title-sub" text-anchor="middle">EPHEMERAL KEYS · DISCARDED AFTER SESSION · PAST SESSIONS SAFE EVEN IF LONG-TERM KEY IS COMPROMISED</text>

  <!-- ═══ ECDH KEY EXCHANGE ═══ -->
  <text x="430" y="80" font-size="11" font-weight="700" fill="#64748b" text-anchor="middle" letter-spacing="1.5px">SINGLE SESSION KEY DERIVATION (X25519)</text>

  <!-- Client side -->
  <rect x="40" y="90" width="180" height="50" rx="10" class="col-box" />
  <text x="130" y="113" class="col-label">CLIENT</text>
  <text x="130" y="130" class="col-sub">Ephemeral keypair per session</text>

  <!-- Server side -->
  <rect x="640" y="90" width="180" height="50" rx="10" class="col-box" />
  <text x="730" y="113" class="col-label">SERVER</text>
  <text x="730" y="130" class="col-sub">Ephemeral keypair per session</text>

  <!-- Client private key -->
  <rect x="50" y="158" width="160" height="50" rx="8" class="key-priv gen-pulse" />
  <text x="130" y="180" class="key-label" fill="#fca5a5">priv_c</text>
  <text x="130" y="196" class="key-sub">random scalar, never leaves client</text>

  <!-- Client public key -->
  <rect x="50" y="220" width="160" height="50" rx="8" class="key-pub gen-pulse" />
  <text x="130" y="242" class="key-label" fill="#38bdf8">pub_c = priv_c × G</text>
  <text x="130" y="258" class="key-sub">G = curve base point (X25519)</text>

  <!-- Server private key -->
  <rect x="650" y="158" width="160" height="50" rx="8" class="key-priv gen-pulse-delay" />
  <text x="730" y="180" class="key-label" fill="#fca5a5">priv_s</text>
  <text x="730" y="196" class="key-sub">random scalar, never leaves server</text>

  <!-- Server public key -->
  <rect x="650" y="220" width="160" height="50" rx="8" class="key-pub gen-pulse-delay" />
  <text x="730" y="242" class="key-label" fill="#38bdf8">pub_s = priv_s × G</text>
  <text x="730" y="258" class="key-sub">G = same curve base point</text>

  <!-- Exchange arrows: pub_c → server, pub_s → client -->
  <line x1="212" y1="245" x2="648" y2="245" class="xchg-arrow xchg-blue" marker-end="url(#arr-blue-pfs)" />
  <text x="430" y="238" font-size="10" fill="#38bdf8" text-anchor="middle">pub_c sent in ClientHello key_share</text>

  <line x1="648" y1="265" x2="212" y2="265" class="xchg-arrow xchg-purple" marker-end="url(#arr-purple-pfs)" />
  <text x="430" y="280" font-size="10" fill="#a78bfa" text-anchor="middle">pub_s sent in ServerHello key_share</text>

  <!-- Math derivation -->
  <g class="math-show">
    <rect x="250" y="298" width="360" height="70" rx="10" fill="#0f1f0f" stroke="#10b981" stroke-width="1.5" />
    <text x="430" y="318" font-size="11" fill="#6ee7b7" text-anchor="middle">Client: shared = priv_c × pub_s</text>
    <text x="430" y="335" font-size="11" fill="#6ee7b7" text-anchor="middle">Server: shared = priv_s × pub_c</text>
    <text x="430" y="356" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">= priv_c × priv_s × G  →  same point on curve ✓</text>
  </g>

  <!-- Shared secret -->
  <rect x="270" y="380" width="320" height="66" rx="10" class="key-shared secret-glow" />
  <text x="430" y="403" font-size="13" font-weight="800" fill="#34d399" text-anchor="middle">Shared Secret</text>
  <text x="430" y="420" font-size="10" fill="#6ee7b7" text-anchor="middle">Input to HKDF · derives unique session keys</text>
  <text x="430" y="434" font-size="10" fill="#6ee7b7" text-anchor="middle">Ephemeral keys discarded immediately. Not stored anywhere.</text>

  <!-- Certificate / long-term key (separate) -->
  <rect x="50" y="380" width="200" height="56" rx="8" class="key-cert" />
  <text x="150" y="399" font-size="11" font-weight="700" fill="#fbbf24" text-anchor="middle">Server's Long-Term Key</text>
  <text x="150" y="415" font-size="10" fill="#92400e" text-anchor="middle">Auth only — signs handshake</text>
  <text x="150" y="429" font-size="10" fill="#92400e" text-anchor="middle">transcript. NOT session key material.</text>

  <!-- ═══ FORWARD SECRECY SCENARIOS ═══ -->
  <text x="430" y="480" font-size="11" font-weight="700" fill="#64748b" text-anchor="middle" letter-spacing="1.5px">WHAT HAPPENS WHEN THE LONG-TERM PRIVATE KEY IS LEAKED?</text>

  <!-- Without PFS (TLS 1.2 RSA) -->
  <rect x="40" y="492" width="370" height="216" rx="10" class="attacker-box" />
  <text x="225" y="514" class="attacker-text">WITHOUT PFS (TLS 1.2 RSA key exchange)</text>
  <text x="225" y="530" class="attacker-sub">Session key = RSA_decrypt(priv_s, ClientKeyExchange)</text>

  <rect x="60" y="540" width="330" height="35" rx="6" fill="#1a0a0a" stroke="#ef4444" stroke-width="1" />
  <text x="225" y="553" font-size="10" fill="#94a3b8" text-anchor="middle">2 years ago: traffic captured, stored by attacker</text>
  <text x="225" y="567" font-size="10" fill="#94a3b8" text-anchor="middle">(sessions from 2024, 2025, 2026...)</text>

  <rect x="60" y="584" width="330" height="35" rx="6" fill="#1a0a0a" stroke="#ef4444" stroke-width="1" />
  <text x="225" y="597" font-size="10" fill="#fca5a5" text-anchor="middle">Today: long-term priv_s leaked via breach</text>
  <text x="225" y="611" font-size="10" fill="#fca5a5" text-anchor="middle">→ Attacker decrypts ALL stored sessions 🔓</text>

  <text x="225" y="648" font-size="11" font-weight="700" fill="#ef4444" text-anchor="middle">🔴 "Collect now, decrypt later" attack succeeds</text>
  <text x="225" y="664" font-size="10" fill="#f87171" text-anchor="middle">NSA and others document they do exactly this</text>
  <text x="225" y="679" font-size="9" fill="#7f1d1d" text-anchor="middle">Every past session: COMPROMISED</text>

  <!-- With PFS (TLS 1.3) -->
  <rect x="450" y="492" width="370" height="216" rx="10" fill="#0a1a10" stroke="#10b981" stroke-width="2" />
  <text x="635" y="514" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">WITH PFS (TLS 1.3 ECDHE)</text>
  <text x="635" y="530" font-size="10" fill="#6ee7b7" text-anchor="middle">Session keys from ephemeral ECDH, not from priv_s</text>

  <rect x="470" y="540" width="330" height="35" rx="6" fill="#0a1a10" stroke="#10b981" stroke-width="1" />
  <text x="635" y="553" font-size="10" fill="#94a3b8" text-anchor="middle">2 years ago: traffic captured, stored by attacker</text>
  <text x="635" y="567" font-size="10" fill="#94a3b8" text-anchor="middle">(ephemeral keys were destroyed after each session)</text>

  <rect x="470" y="584" width="330" height="35" rx="6" fill="#0a1a10" stroke="#10b981" stroke-width="1" />
  <text x="635" y="597" font-size="10" fill="#6ee7b7" text-anchor="middle">Today: long-term priv_s leaked via breach</text>
  <text x="635" y="611" font-size="10" fill="#6ee7b7" text-anchor="middle">→ Attacker can impersonate server going forward 🔓</text>

  <text x="635" y="648" font-size="11" font-weight="700" fill="#10b981" text-anchor="middle">🟢 Past sessions remain encrypted</text>
  <text x="635" y="664" font-size="10" fill="#34d399" text-anchor="middle">Ephemeral keys gone. Nothing to recover.</text>
  <text x="635" y="679" font-size="9" fill="#166534" text-anchor="middle">Every past session: SAFE</text>

  <!-- Footnote -->
  <text x="430" y="730" class="footnote">* TLS 1.3 mandates ephemeral key exchange. There is no cipher suite in TLS 1.3 without forward secrecy. Not optional.</text>
</svg>
