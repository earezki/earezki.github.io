<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 680" preserveAspectRatio="xMidYMid meet">
    <style>
        svg {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: transparent;
        }
        .text-bold { font-weight: 700; }
        
        /* Animation for the flow */
        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        
        @keyframes pathFlow {
            0% { stroke-dashoffset: 800; }
            100% { stroke-dashoffset: 0; }
        }
        
        .flow-arrow {
            stroke-dasharray: 10 5;
            animation: pathFlow 3s linear infinite;
        }
        
        .step-1 { animation: pulse 6s ease-in-out infinite; animation-delay: 0s; }
        .step-2 { animation: pulse 6s ease-in-out infinite; animation-delay: 1s; }
        .step-3 { animation: pulse 6s ease-in-out infinite; animation-delay: 2s; }
        .step-4 { animation: pulse 6s ease-in-out infinite; animation-delay: 3s; }
        .step-5 { animation: pulse 6s ease-in-out infinite; animation-delay: 4.5s; }
    </style>

    <defs>
        <marker id="arrow-anim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6" />
        </marker>
    </defs>

    <!-- Title -->
    <text x="350" y="35" text-anchor="middle" fill="#f8fafc" font-size="20" class="text-bold">Agent Loop (ReAct Pattern)</text>
    <text x="350" y="60" text-anchor="middle" fill="#94a3b8" font-size="14">The continuous cycle of reasoning and action</text>

    <!-- Main Container -->
    <rect x="50" y="90" width="600" height="550" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2" />

    <!-- Start Node -->
    <g class="step-1">
        <rect x="250" y="120" width="200" height="45" rx="8" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2" />
        <text x="350" y="148" text-anchor="middle" fill="#bfdbfe" font-size="15" class="text-bold">START</text>
    </g>
    <path d="M 350 165 L 350 195" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrow-anim)" class="flow-arrow" />

    <!-- Call LLM -->
    <g class="step-2">
        <rect x="200" y="195" width="300" height="55" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="2" />
        <text x="350" y="220" text-anchor="middle" fill="#6ee7b7" font-size="14" class="text-bold">Call LLM</text>
        <text x="350" y="238" text-anchor="middle" fill="#d1fae5" font-size="12">with prompt</text>
    </g>
    <path d="M 350 250 L 350 280" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrow-anim)" class="flow-arrow" />

    <!-- Decision Diamond -->
    <g class="step-3">
        <polygon points="350,280 480,340 350,400 220,340" fill="#422006" stroke="#f59e0b" stroke-width="2" />
        <text x="350" y="335" text-anchor="middle" fill="#fbbf24" font-size="14" class="text-bold">Tool calls?</text>
        <text x="350" y="352" text-anchor="middle" fill="#fde68a" font-size="12">(decision point)</text>
    </g>

    <!-- Yes Arrow to Execute Tools -->
    <path d="M 480 340 L 540 340" stroke="#10b981" stroke-width="3" marker-end="url(#arrow-anim)" class="flow-arrow" />
    <text x="510" y="330" text-anchor="middle" fill="#6ee7b7" font-size="12" class="text-bold">Yes</text>

    <!-- Execute Tools -->
    <g class="step-4">
        <rect x="540" y="310" width="80" height="60" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="2" />
        <text x="580" y="335" text-anchor="middle" fill="#6ee7b7" font-size="13" class="text-bold">Execute</text>
        <text x="580" y="352" text-anchor="middle" fill="#d1fae5" font-size="12">Tools</text>
    </g>

    <!-- Loop back arrow -->
    <path d="M 580 310 L 580 220 L 500 220" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrow-anim)" class="flow-arrow" />
    <text x="590" y="265" fill="#94a3b8" font-size="11">loop</text>

    <!-- No Arrow to Return -->
    <path d="M 350 400 L 350 465" stroke="#8b5cf6" stroke-width="3" marker-end="url(#arrow-anim)" class="flow-arrow" />
    <text x="330" y="420" text-anchor="middle" fill="#a78bfa" font-size="12" class="text-bold">No</text>

    <!-- Return Response -->
    <g class="step-5">
        <rect x="200" y="465" width="300" height="55" rx="8" fill="#2e1065" stroke="#8b5cf6" stroke-width="2" />
        <text x="350" y="490" text-anchor="middle" fill="#a78bfa" font-size="14" class="text-bold">Return</text>
        <text x="350" y="508" text-anchor="middle" fill="#ede9fe" font-size="12">Response</text>
    </g>
    <path d="M 350 520 L 350 550" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrow-anim)" />

    <!-- Done -->
    <rect x="250" y="550" width="200" height="45" rx="8" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2" />
    <text x="350" y="578" text-anchor="middle" fill="#bfdbfe" font-size="15" class="text-bold">DONE</text>

    <!-- Legend -->
    <g>
        <rect x="70" y="550" width="140" height="70" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="80" y="570" fill="#cbd5e1" font-size="11" class="text-bold">Key Points:</text>
        <text x="80" y="587" fill="#94a3b8" font-size="10">• LLM decides when to stop</text>
        <text x="80" y="602" fill="#94a3b8" font-size="10">• Loop until task complete</text>
        <text x="80" y="615" fill="#94a3b8" font-size="10">• Tool results feed back</text>
    </g>

</svg>
