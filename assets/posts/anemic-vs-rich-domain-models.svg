<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" preserveAspectRatio="xMidYMid meet">
  <style>
    svg { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .title { font-size: 18px; font-weight: 700; fill: #f8fafc; text-anchor: middle; }
    .label { font-size: 12px; font-weight: 600; fill: #f8fafc; text-anchor: middle; }
    .sublabel { font-size: 10px; fill: #94a3b8; text-anchor: middle; }
    .code { font-size: 10px; font-family: 'JetBrains Mono', monospace; fill: #e2e8f0; }
    .vs { font-size: 24px; font-weight: 800; fill: #64748b; text-anchor: middle; }
  </style>
  <rect width="800" height="450" rx="16" fill="#0f172a"/>

  <!-- Title -->
  <text x="400" y="38" class="title">Anemic vs Rich Domain Models</text>

  <!-- VS divider -->
  <text x="400" y="245" class="vs">VS</text>
  <line x1="400" y1="60" x2="400" y2="210" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="400" y1="260" x2="400" y2="430" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Anemic (left) -->
  <rect x="30" y="55" width="340" height="380" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <text x="200" y="82" class="label" fill="#fca5a5">Anemic Domain Model</text>

  <!-- DTO box -->
  <rect x="50" y="95" width="300" height="80" rx="8" fill="#292524" stroke="#78716c" stroke-width="1"/>
  <text x="60" y="115" class="code" fill="#94a3b8">// Data holder only</text>
  <text x="60" y="132" class="code">class AccountDto {</text>
  <text x="60" y="148" class="code">  private balance;</text>
  <text x="60" y="164" class="code">  getBalance() / setBalance()</text>

  <!-- Service box -->
  <rect x="50" y="190" width="300" height="100" rx="8" fill="#292524" stroke="#ef4444" stroke-width="1"/>
  <text x="60" y="210" class="code" fill="#ef4444">// Logic in separate service</text>
  <text x="60" y="227" class="code">class AccountService {</text>
  <text x="60" y="244" class="code">  withdraw(id, amount) {</text>
  <text x="60" y="261" class="code">    a = repo.load(id)</text>
  <text x="60" y="278" class="code">    a.setBalance(a.getBalance()-amt)</text>

  <!-- Issues -->
  <rect x="50" y="305" width="300" height="115" rx="8" fill="#292524" stroke="#78716c" stroke-width="1"/>
  <text x="200" y="325" class="label" fill="#fca5a5">Issues</text>
  <text x="60" y="345" class="code" fill="#94a3b8">• Business logic scattered</text>
  <text x="60" y="362" class="code" fill="#94a3b8">• Invariants easily bypassed</text>
  <text x="60" y="379" class="code" fill="#94a3b8">• Tests require service setup</text>
  <text x="60" y="396" class="code" fill="#94a3b8">• Multiple callers = duplication</text>
  <text x="60" y="413" class="code" fill="#94a3b8">• OK for simple CRUD</text>

  <!-- Rich (right) -->
  <rect x="430" y="55" width="340" height="380" rx="12" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
  <text x="600" y="82" class="label" fill="#86efac">Rich Domain Model</text>

  <!-- Aggregate box -->
  <rect x="450" y="95" width="300" height="130" rx="8" fill="#292524" stroke="#22c55e" stroke-width="1"/>
  <text x="460" y="115" class="code" fill="#22c55e">// Encapsulates behavior</text>
  <text x="460" y="132" class="code">class Account {</text>
  <text x="460" y="149" class="code">  withdraw(amount) {</text>
  <text x="460" y="166" class="code">    if (balance &lt; amount)</text>
  <text x="460" y="183" class="code">      throw InsufficientFunds</text>
  <text x="460" y="200" class="code">    balance = balance - amount</text>
  <text x="460" y="217" class="code">  }</text>

  <!-- Value Object -->
  <rect x="450" y="240" width="300" height="60" rx="8" fill="#292524" stroke="#22c55e" stroke-width="1"/>
  <text x="460" y="260" class="code" fill="#22c55e">// Value Object</text>
  <text x="460" y="277" class="code">class Money { minus(other) {...} }</text>
  <text x="460" y="292" class="code" fill="#94a3b8">// Immutable, domain concept</text>

  <!-- Benefits -->
  <rect x="450" y="315" width="300" height="105" rx="8" fill="#292524" stroke="#78716c" stroke-width="1"/>
  <text x="600" y="335" class="label" fill="#86efac">Benefits</text>
  <text x="460" y="355" class="code" fill="#94a3b8">• Invariants enforced internally</text>
  <text x="460" y="372" class="code" fill="#94a3b8">• Unit tests on domain objects</text>
  <text x="460" y="389" class="code" fill="#94a3b8">• Behavior discoverable</text>
  <text x="460" y="406" class="code" fill="#94a3b8">• Strong encapsulation</text>
</svg>
