<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <style>
    svg { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .title { font-weight: 800; font-size: 20px; fill: #cdd6f4; letter-spacing: 1.5px; }
    .box-title { font-weight: 700; font-size: 14px; fill: #cdd6f4; }
    .box-sub { font-weight: 500; font-size: 11px; fill: #a6adc8; }
    .event { font-weight: 600; font-size: 11px; fill: #f9e2af; font-family: 'Fira Code', monospace; }
  </style>
  <defs>
    <marker id="arr7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6c7086"/>
    </marker>
  </defs>
  <rect width="900" height="480" rx="16" fill="#1e1e2e"/>
  <text x="450" y="38" text-anchor="middle" class="title">SERVER-SENT EVENTS PROTOCOL</text>

  <!-- FastAPI Server -->
  <rect x="50" y="70" width="350" height="380" rx="12" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <text x="225" y="98" text-anchor="middle" class="box-title">FastAPI Server</text>
  <line x1="70" y1="108" x2="380" y2="108" stroke="#45475a" stroke-width="1"/>

  <!-- Events inside server -->
  <rect x="80" y="125" width="290" height="40" rx="8" fill="#1e1e2e" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="225" y="145" text-anchor="middle" class="event">event: status</text>
  <text x="225" y="158" text-anchor="middle" class="box-sub">data: {"step": "searching"}</text>

  <rect x="80" y="180" width="290" height="40" rx="8" fill="#1e1e2e" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="225" y="200" text-anchor="middle" class="event">event: sources</text>
  <text x="225" y="213" text-anchor="middle" class="box-sub">data: {"urls": [...]}</text>

  <rect x="80" y="235" width="290" height="40" rx="8" fill="#1e1e2e" stroke="#f9e2af" stroke-width="1.5"/>
  <text x="225" y="255" text-anchor="middle" class="event">event: token</text>
  <text x="225" y="268" text-anchor="middle" class="box-sub">data: {"text": "The"}</text>

  <rect x="80" y="290" width="290" height="40" rx="8" fill="#1e1e2e" stroke="#f9e2af" stroke-width="1.5"/>
  <text x="225" y="310" text-anchor="middle" class="event">event: token</text>
  <text x="225" y="323" text-anchor="middle" class="box-sub">data: {"text": " answer"}</text>

  <rect x="80" y="345" width="290" height="40" rx="8" fill="#1e1e2e" stroke="#f9e2af" stroke-width="1.5"/>
  <text x="225" y="365" text-anchor="middle" class="event">event: token</text>
  <text x="225" y="378" text-anchor="middle" class="box-sub">data: {"text": " is..."}</text>

  <rect x="80" y="400" width="290" height="30" rx="8" fill="#1e1e2e" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="225" y="420" text-anchor="middle" class="event">event: done</text>

  <!-- Client -->
  <rect x="530" y="70" width="330" height="380" rx="12" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
  <text x="695" y="98" text-anchor="middle" class="box-title">Client (EventSource)</text>
  <line x1="550" y1="108" x2="840" y2="108" stroke="#45475a" stroke-width="1"/>

  <text x="695" y="150" text-anchor="middle" class="box-sub">GET /search?q=...</text>
  <text x="695" y="170" text-anchor="middle" class="box-sub">Accept: text/event-stream</text>

  <rect x="560" y="200" width="270" height="100" rx="8" fill="#1e1e2e" stroke="#cba6f7" stroke-width="1.5"/>
  <text x="695" y="225" text-anchor="middle" class="box-title">Progressive Display</text>
  <text x="695" y="248" text-anchor="middle" class="box-sub">1. Show "Searching..."</text>
  <text x="695" y="266" text-anchor="middle" class="box-sub">2. Show source cards</text>
  <text x="695" y="284" text-anchor="middle" class="box-sub">3. Stream answer tokens</text>

  <rect x="560" y="330" width="270" height="60" rx="8" fill="#1e1e2e" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="695" y="355" text-anchor="middle" class="box-title">Connection: keep-alive</text>
  <text x="695" y="375" text-anchor="middle" class="box-sub">Auto-reconnect on failure</text>

  <!-- Arrows between server and client -->
  <line x1="400" y1="145" x2="528" y2="230" stroke="#a6e3a1" stroke-width="2" marker-end="url(#arr7)"/>
  <line x1="400" y1="255" x2="528" y2="255" stroke="#f9e2af" stroke-width="2" marker-end="url(#arr7)"/>
  <line x1="400" y1="365" x2="528" y2="300" stroke="#f9e2af" stroke-width="2" marker-end="url(#arr7)"/>
</svg>