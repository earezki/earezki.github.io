<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" preserveAspectRatio="xMidYMid meet">
    <style>
        svg {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: transparent;
        }
        .text-bold { font-weight: 700; }
        .text-mono { font-family: 'Fira Code', 'Courier New', Courier, monospace; font-size: 11px; }
    </style>

    <defs>
        <marker id="arrow-bi-white" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#cbd5e1" />
        </marker>
    </defs>

    <!-- Title -->
    <text x="450" y="35" text-anchor="middle" fill="#f8fafc" font-size="20" class="text-bold">Research Report Generator Architecture</text>
    <text x="450" y="60" text-anchor="middle" fill="#94a3b8" font-size="14">Complete system showing all components working together</text>

    <!-- Main Container -->
    <rect x="50" y="90" width="800" height="630" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <text x="450" y="120" text-anchor="middle" fill="#64748b" font-size="12" class="text-bold" letter-spacing="2">RESEARCH REPORT GENERATOR</text>

    <!-- Layer 1: TOOLS -->
    <g>
        <rect x="100" y="150" width="700" height="90" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
        <text x="120" y="175" fill="#60a5fa" font-size="14" class="text-bold">TOOLS (Part 2)</text>
        <text x="120" y="193" fill="#94a3b8" font-size="11">Agent capabilities for interacting with the world</text>
        
        <!-- Tool boxes -->
        <rect x="130" y="205" width="140" height="25" rx="4" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1" />
        <text x="200" y="222" text-anchor="middle" fill="#93c5fd" font-size="11" class="text-mono">web_search</text>
        
        <rect x="285" y="205" width="140" height="25" rx="4" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1" />
        <text x="355" y="222" text-anchor="middle" fill="#93c5fd" font-size="11" class="text-mono">fetch_webpage</text>
        
        <rect x="440" y="205" width="140" height="25" rx="4" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1" />
        <text x="510" y="222" text-anchor="middle" fill="#93c5fd" font-size="11" class="text-mono">save_file</text>
        
        <rect x="595" y="205" width="140" height="25" rx="4" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1" />
        <text x="665" y="222" text-anchor="middle" fill="#93c5fd" font-size="11" class="text-mono">read_file</text>
    </g>

    <!-- Bidirectional arrow -->
    <path d="M 450 248 L 450 282" stroke="#cbd5e1" stroke-width="2" marker-start="url(#arrow-bi-white)" marker-end="url(#arrow-bi-white)" />

    <!-- Layer 2: AGENT LOOP -->
    <g>
        <rect x="100" y="290" width="700" height="90" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2" />
        <text x="120" y="315" fill="#6ee7b7" font-size="14" class="text-bold">AGENT LOOP (Part 5)</text>
        <text x="120" y="333" fill="#94a3b8" font-size="11">The ReAct pattern in action</text>
        
        <!-- Loop visualization -->
        <rect x="130" y="345" width="640" height="25" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1" />
        <text x="450" y="362" text-anchor="middle" fill="#d1fae5" font-size="12" class="text-bold">Think → Act → Observe → Repeat</text>
    </g>

    <!-- Bidirectional arrow -->
    <path d="M 450 388 L 450 422" stroke="#cbd5e1" stroke-width="2" marker-start="url(#arrow-bi-white)" marker-end="url(#arrow-bi-white)" />

    <!-- Layer 3: STATE & MEMORY -->
    <g>
        <rect x="100" y="430" width="700" height="100" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="2" />
        <text x="120" y="455" fill="#a78bfa" font-size="14" class="text-bold">STATE &amp; MEMORY (Part 3)</text>
        <text x="120" y="473" fill="#94a3b8" font-size="11">Remembering what has been done</text>
        
        <!-- Memory boxes -->
        <rect x="130" y="485" width="310" height="35" rx="4" fill="#2e1065" stroke="#8b5cf6" stroke-width="1" />
        <text x="285" y="503" text-anchor="middle" fill="#c4b5fd" font-size="11" class="text-bold">Short-term (messages)</text>
        <text x="285" y="517" text-anchor="middle" fill="#a78bfa" font-size="9">Context window ~128K tokens</text>
        
        <rect x="460" y="485" width="310" height="35" rx="4" fill="#2e1065" stroke="#8b5cf6" stroke-width="1" />
        <text x="615" y="503" text-anchor="middle" fill="#c4b5fd" font-size="11" class="text-bold">Long-term (JSON file)</text>
        <text x="615" y="517" text-anchor="middle" fill="#a78bfa" font-size="9">Disk storage, unlimited</text>
    </g>

    <!-- Bidirectional arrow -->
    <path d="M 450 538 L 450 572" stroke="#cbd5e1" stroke-width="2" marker-start="url(#arrow-bi-white)" marker-end="url(#arrow-bi-white)" />

    <!-- Layer 4: HUMAN CHECKPOINTS -->
    <g>
        <rect x="100" y="580" width="700" height="110" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
        <text x="120" y="605" fill="#fbbf24" font-size="14" class="text-bold">HUMAN CHECKPOINTS (Part 4)</text>
        <text x="120" y="623" fill="#94a3b8" font-size="11">Keeping humans in control at critical decision points</text>
        
        <!-- Checkpoint flow -->
        <g>
            <circle cx="150" cy="650" r="18" fill="#422006" stroke="#f59e0b" stroke-width="1" />
            <text x="150" y="655" text-anchor="middle" fill="#fbbf24" font-size="10" class="text-bold">1</text>
            <text x="150" y="680" text-anchor="middle" fill="#94a3b8" font-size="9">Plan</text>

            <circle cx="260" cy="650" r="18" fill="#422006" stroke="#f59e0b" stroke-width="1" />
            <text x="260" y="655" text-anchor="middle" fill="#fbbf24" font-size="10" class="text-bold">2</text>
            <text x="260" y="680" text-anchor="middle" fill="#94a3b8" font-size="9">Sources</text>

            <circle cx="370" cy="650" r="18" fill="#422006" stroke="#f59e0b" stroke-width="1" />
            <text x="370" y="655" text-anchor="middle" fill="#fbbf24" font-size="10" class="text-bold">3</text>
            <text x="370" y="680" text-anchor="middle" fill="#94a3b8" font-size="9">Facts</text>

            <circle cx="480" cy="650" r="18" fill="#422006" stroke="#f59e0b" stroke-width="1" />
            <text x="480" y="655" text-anchor="middle" fill="#fbbf24" font-size="10" class="text-bold">4</text>
            <text x="480" y="680" text-anchor="middle" fill="#94a3b8" font-size="9">Outline</text>

            <circle cx="590" cy="650" r="18" fill="#422006" stroke="#f59e0b" stroke-width="1" />
            <text x="590" y="655" text-anchor="middle" fill="#fbbf24" font-size="10" class="text-bold">5</text>
            <text x="590" y="680" text-anchor="middle" fill="#94a3b8" font-size="9">Draft</text>

            <circle cx="700" cy="650" r="18" fill="#064e3b" stroke="#10b981" stroke-width="2" />
            <text x="700" y="655" text-anchor="middle" fill="#6ee7b7" font-size="10" class="text-bold">✓</text>
            <text x="700" y="680" text-anchor="middle" fill="#94a3b8" font-size="9">Final</text>

            <!-- Arrows between checkpoints -->
            <path d="M 168 650 L 242 650" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-bi-white)" />
            <path d="M 278 650 L 352 650" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-bi-white)" />
            <path d="M 388 650 L 462 650" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-bi-white)" />
            <path d="M 498 650 L 572 650" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-bi-white)" />
            <path d="M 608 650 L 682 650" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-bi-white)" />
        </g>
    </g>

</svg>