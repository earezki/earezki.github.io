<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 600" preserveAspectRatio="xMidYMid meet">
  <style>
    svg { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .title { font-size: 16px; font-weight: 700; fill: #f8fafc; text-anchor: middle; }
    .label { font-size: 11px; font-weight: 600; fill: #f8fafc; text-anchor: middle; }
    .sublabel { font-size: 9px; fill: #94a3b8; text-anchor: middle; }
    .section { font-size: 13px; font-weight: 700; fill: #f8fafc; text-anchor: middle; letter-spacing: 1px; }
  </style>
  <rect width="860" height="600" rx="16" fill="#0f172a"/>

  <!-- Title -->
  <text x="430" y="32" class="title">Eric Evans — Domain-Driven Design Reference</text>

  <!-- Strategic Design -->
  <rect x="20" y="50" width="400" height="260" rx="12" fill="#1e293b" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="220" y="72" class="section" fill="#a78bfa">STRATEGIC DESIGN</text>

  <rect x="40" y="85" width="170" height="45" rx="8" fill="#7c3aed" opacity="0.7"/>
  <text x="125" y="105" class="label">Bounded Context</text>
  <text x="125" y="120" class="sublabel">Explicit model boundary</text>

  <rect x="230" y="85" width="170" height="45" rx="8" fill="#7c3aed" opacity="0.7"/>
  <text x="315" y="105" class="label">Context Map</text>
  <text x="315" y="120" class="sublabel">Relationships between BCs</text>

  <rect x="40" y="145" width="170" height="45" rx="8" fill="#6d28d9" opacity="0.7"/>
  <text x="125" y="165" class="label">Shared Kernel</text>
  <text x="125" y="180" class="sublabel">Agreed shared subset</text>

  <rect x="230" y="145" width="170" height="45" rx="8" fill="#6d28d9" opacity="0.7"/>
  <text x="315" y="165" class="label">Anti-Corruption Layer</text>
  <text x="315" y="180" class="sublabel">Translation between BCs</text>

  <rect x="40" y="205" width="170" height="45" rx="8" fill="#5b21b6" opacity="0.7"/>
  <text x="125" y="225" class="label">Upstream/Downstream</text>
  <text x="125" y="240" class="sublabel">Influence direction</text>

  <rect x="230" y="205" width="170" height="45" rx="8" fill="#5b21b6" opacity="0.7"/>
  <text x="315" y="225" class="label">Conformist</text>
  <text x="315" y="240" class="sublabel">Follow upstream model</text>

  <rect x="40" y="265" width="170" height="30" rx="8" fill="#4c1d95" opacity="0.7"/>
  <text x="125" y="285" class="label">Published Language</text>

  <rect x="230" y="265" width="170" height="30" rx="8" fill="#4c1d95" opacity="0.7"/>
  <text x="315" y="285" class="label">Open Host Service</text>

  <!-- Tactical Design -->
  <rect x="440" y="50" width="400" height="260" rx="12" fill="#1e293b" stroke="#2563eb" stroke-width="1.5"/>
  <text x="640" y="72" class="section" fill="#60a5fa">TACTICAL DESIGN</text>

  <rect x="460" y="85" width="170" height="45" rx="8" fill="#2563eb" opacity="0.7"/>
  <text x="545" y="105" class="label">Entities</text>
  <text x="545" y="120" class="sublabel">Identity + lifecycle</text>

  <rect x="650" y="85" width="170" height="45" rx="8" fill="#2563eb" opacity="0.7"/>
  <text x="735" y="105" class="label">Value Objects</text>
  <text x="735" y="120" class="sublabel">Immutable, equality by value</text>

  <rect x="460" y="145" width="170" height="45" rx="8" fill="#1d4ed8" opacity="0.7"/>
  <text x="545" y="165" class="label">Aggregates</text>
  <text x="545" y="180" class="sublabel">Transactional boundary</text>

  <rect x="650" y="145" width="170" height="45" rx="8" fill="#1d4ed8" opacity="0.7"/>
  <text x="735" y="165" class="label">Repositories</text>
  <text x="735" y="180" class="sublabel">Collection-like persistence</text>

  <rect x="460" y="205" width="170" height="45" rx="8" fill="#1e40af" opacity="0.7"/>
  <text x="545" y="225" class="label">Domain Services</text>
  <text x="545" y="240" class="sublabel">Stateless operations</text>

  <rect x="650" y="205" width="170" height="45" rx="8" fill="#1e40af" opacity="0.7"/>
  <text x="735" y="225" class="label">Domain Events</text>
  <text x="735" y="240" class="sublabel">Something occurred</text>

  <rect x="460" y="265" width="170" height="30" rx="8" fill="#1e3a8a" opacity="0.7"/>
  <text x="545" y="285" class="label">Factories</text>

  <rect x="650" y="265" width="170" height="30" rx="8" fill="#1e3a8a" opacity="0.7"/>
  <text x="735" y="285" class="label">Specifications</text>

  <!-- Model Integrity -->
  <rect x="20" y="330" width="820" height="100" rx="12" fill="#1e293b" stroke="#059669" stroke-width="1.5"/>
  <text x="430" y="352" class="section" fill="#34d399">MODEL INTEGRITY &amp; UBIQUITOUS LANGUAGE</text>

  <rect x="40" y="365" width="150" height="50" rx="8" fill="#059669" opacity="0.7"/>
  <text x="115" y="387" class="label">Ubiquitous</text>
  <text x="115" y="403" class="label">Language</text>

  <rect x="210" y="365" width="150" height="50" rx="8" fill="#047857" opacity="0.7"/>
  <text x="285" y="387" class="label">Continuous</text>
  <text x="285" y="403" class="label">Integration</text>

  <rect x="380" y="365" width="150" height="50" rx="8" fill="#065f46" opacity="0.7"/>
  <text x="455" y="387" class="label">Model-Driven</text>
  <text x="455" y="403" class="label">Design</text>

  <rect x="550" y="365" width="150" height="50" rx="8" fill="#064e3b" opacity="0.7"/>
  <text x="625" y="387" class="label">Hands-on</text>
  <text x="625" y="403" class="label">Modelers</text>

  <rect x="720" y="365" width="100" height="50" rx="8" fill="#022c22" opacity="0.7" stroke="#059669" stroke-width="1"/>
  <text x="770" y="395" class="label">Refactoring</text>

  <!-- Distillation -->
  <rect x="20" y="450" width="820" height="130" rx="12" fill="#1e293b" stroke="#d97706" stroke-width="1.5"/>
  <text x="430" y="472" class="section" fill="#fbbf24">DISTILLATION</text>

  <rect x="40" y="490" width="140" height="70" rx="8" fill="#d97706" opacity="0.6"/>
  <text x="110" y="517" class="label">Core Domain</text>
  <text x="110" y="535" class="sublabel">Highest business value</text>
  <text x="110" y="548" class="sublabel">Invest most here</text>

  <rect x="200" y="490" width="140" height="70" rx="8" fill="#b45309" opacity="0.6"/>
  <text x="270" y="517" class="label">Supporting</text>
  <text x="270" y="535" class="sublabel">Necessary but not</text>
  <text x="270" y="548" class="sublabel">competitive advantage</text>

  <rect x="360" y="490" width="140" height="70" rx="8" fill="#92400e" opacity="0.6"/>
  <text x="430" y="517" class="label">Generic</text>
  <text x="430" y="535" class="sublabel">Off-the-shelf or</text>
  <text x="430" y="548" class="sublabel">outsourced</text>

  <rect x="530" y="490" width="150" height="70" rx="8" fill="#78350f" opacity="0.6"/>
  <text x="605" y="517" class="label">Domain Vision</text>
  <text x="605" y="535" class="label">Statement</text>
  <text x="605" y="550" class="sublabel">Short doc of core value</text>

  <rect x="700" y="490" width="120" height="70" rx="8" fill="#451a03" opacity="0.6" stroke="#d97706" stroke-width="1"/>
  <text x="760" y="517" class="label">Highlighted</text>
  <text x="760" y="535" class="label">Core</text>
  <text x="760" y="550" class="sublabel">Flag the important</text>
</svg>
