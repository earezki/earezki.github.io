<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" preserveAspectRatio="xMidYMid meet">
  <style>
    svg { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .title { font-size: 18px; font-weight: 700; fill: #f8fafc; text-anchor: middle; }
    .label { font-size: 11px; font-weight: 600; fill: #f8fafc; text-anchor: middle; }
    .sublabel { font-size: 9px; fill: #94a3b8; text-anchor: middle; }
    .icon { font-size: 20px; text-anchor: middle; }
  </style>
  <rect width="700" height="450" rx="16" fill="#0f172a"/>

  <!-- Title -->
  <text x="350" y="35" class="title">Full Stack Developer — Responsibilities</text>

  <!-- Central developer node -->
  <circle cx="350" cy="240" r="45" fill="#7c3aed" opacity="0.9"/>
  <text x="350" y="235" class="label">Full Stack</text>
  <text x="350" y="252" class="label">Developer</text>

  <!-- Skill nodes around the center -->
  <!-- Frontend (top-left) -->
  <rect x="80" y="70" width="140" height="65" rx="10" fill="#2563eb" opacity="0.85"/>
  <text x="150" y="95" class="icon">🖥️</text>
  <text x="150" y="115" class="label">Frontend</text>
  <text x="150" y="130" class="sublabel">Web, Mobile, Desktop UI</text>
  <line x1="220" y1="115" x2="310" y2="210" stroke="#2563eb" stroke-width="1.5" opacity="0.6"/>

  <!-- Backend (top-right) -->
  <rect x="480" y="70" width="140" height="65" rx="10" fill="#059669" opacity="0.85"/>
  <text x="550" y="95" class="icon">⚙️</text>
  <text x="550" y="115" class="label">Backend</text>
  <text x="550" y="130" class="sublabel">APIs, Services, Logic</text>
  <line x1="480" y1="115" x2="390" y2="210" stroke="#059669" stroke-width="1.5" opacity="0.6"/>

  <!-- Database (right) -->
  <rect x="530" y="200" width="140" height="65" rx="10" fill="#d97706" opacity="0.85"/>
  <text x="600" y="225" class="icon">🗄️</text>
  <text x="600" y="245" class="label">Database</text>
  <text x="600" y="260" class="sublabel">Schema, SQL, NoSQL</text>
  <line x1="530" y1="235" x2="395" y2="240" stroke="#d97706" stroke-width="1.5" opacity="0.6"/>

  <!-- Infrastructure (bottom-right) -->
  <rect x="480" y="340" width="140" height="65" rx="10" fill="#dc2626" opacity="0.85"/>
  <text x="550" y="365" class="icon">☁️</text>
  <text x="550" y="385" class="label">Infrastructure</text>
  <text x="550" y="400" class="sublabel">Servers, CI/CD, Network</text>
  <line x1="480" y1="370" x2="390" y2="270" stroke="#dc2626" stroke-width="1.5" opacity="0.6"/>

  <!-- Project Management (bottom-left) -->
  <rect x="80" y="340" width="140" height="65" rx="10" fill="#0891b2" opacity="0.85"/>
  <text x="150" y="365" class="icon">📋</text>
  <text x="150" y="385" class="label">Project Mgmt</text>
  <text x="150" y="400" class="sublabel">Agile, Planning, Stakeholders</text>
  <line x1="220" y1="370" x2="310" y2="270" stroke="#0891b2" stroke-width="1.5" opacity="0.6"/>

  <!-- Security (left) -->
  <rect x="30" y="200" width="140" height="65" rx="10" fill="#9333ea" opacity="0.85"/>
  <text x="100" y="225" class="icon">🔒</text>
  <text x="100" y="245" class="label">Security</text>
  <text x="100" y="260" class="sublabel">Network, Auth, Encryption</text>
  <line x1="170" y1="235" x2="305" y2="240" stroke="#9333ea" stroke-width="1.5" opacity="0.6"/>

  <!-- Bottom note -->
  <rect x="150" y="420" width="400" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="350" y="436" class="sublabel" fill="#94a3b8">Depth varies — everyone has preferences and specializations</text>
</svg>
