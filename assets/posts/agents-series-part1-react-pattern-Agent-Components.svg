<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet">
    <style>
        svg {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            border-radius: 16px;
        }

        /* Typography */
        .title { font-weight: 800; font-size: 24px; fill: #f8fafc; letter-spacing: 2px; }
        .box-title { font-weight: 700; font-size: 16px; fill: #f8fafc; }
        .box-sub { font-weight: 500; font-size: 12px; fill: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
        .loop-text { font-weight: 600; font-size: 14px; fill: #e2e8f0; }
        
        /* Elements */
        .agent-container { fill: transparent; stroke: #334155; stroke-width: 2; rx: 16; }
        .module-box { fill: #1e293b; stroke: #475569; stroke-width: 2; rx: 12; }
        
        /* Accents */
        .accent-state { stroke: #3b82f6; }
        .accent-llm { stroke: #a855f7; }
        .accent-tools { stroke: #10b981; }
        .accent-loop { stroke: #f59e0b; }
        .accent-hitl { stroke: #ef4444; stroke-dasharray: 6 6; }
    </style>

    <defs>
        <!-- Arrow Marker for Loop -->
        <marker id="arrow-loop" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
        </marker>
    </defs>

    <!-- Main Agent Container -->
    <rect x="20" y="20" width="760" height="560" class="agent-container" />
    <rect x="20" y="20" width="760" height="60" fill="#1e293b" rx="16" stroke="#334155" stroke-width="2" />
    <rect x="20" y="60" width="760" height="20" fill="#1e293b" /> <!-- flatten bottom corners of header -->
    <text x="400" y="58" text-anchor="middle" class="title">AGENT SYSTEM</text>

    <!-- TOP ROW: Core Modules -->
    
    <!-- State (Memory) -->
    <g transform="translate(60, 110)">
        <rect x="0" y="0" width="200" height="115" class="module-box accent-state" />
        <path d="M 100 25 C 120 25 130 30 130 35 C 130 40 120 45 100 45 C 80 45 70 40 70 35 C 70 30 80 25 100 25 Z" fill="none" stroke="#3b82f6" stroke-width="2"/>
        <path d="M 70 35 L 70 55 C 70 60 80 65 100 65 C 120 65 130 60 130 55 L 130 35" fill="none" stroke="#3b82f6" stroke-width="2"/>
        <text x="100" y="85" text-anchor="middle" class="box-title">State</text>
        <text x="100" y="105" text-anchor="middle" class="box-sub">(Memory)</text>
    </g>

    <!-- LLM (Brain) -->
    <g transform="translate(300, 110)">
        <rect x="0" y="0" width="200" height="115" class="module-box accent-llm" />
        <path d="M 90 25 L 100 15 L 110 25 M 100 15 L 100 40 M 80 45 C 80 35 120 35 120 45 C 130 55 115 65 100 65 C 85 65 70 55 80 45 Z" fill="none" stroke="#a855f7" stroke-width="2" stroke-linejoin="round"/>
        <text x="100" y="85" text-anchor="middle" class="box-title">LLM</text>
        <text x="100" y="105" text-anchor="middle" class="box-sub">(Brain)</text>
    </g>

    <!-- Tools (Capabilities) -->
    <g transform="translate(540, 110)">
        <rect x="0" y="0" width="200" height="115" class="module-box accent-tools" />
        <path d="M 90 45 L 110 25 C 115 20 120 23 125 20 C 130 15 130 5 125 0 C 120 -5 110 -5 105 0 C 102 5 105 10 100 15 L 80 35 C 75 40 85 50 90 45 Z" fill="none" stroke="#10b981" stroke-width="2" stroke-linejoin="round" transform="translate(-5, 15)"/>
        <text x="100" y="85" text-anchor="middle" class="box-title">Tools</text>
        <text x="100" y="105" text-anchor="middle" class="box-sub">(Capabilities)</text>
    </g>

    <!-- MIDDLE ROW: Agent Loop -->
    <g transform="translate(60, 260)">
        <rect x="0" y="0" width="680" height="140" class="module-box accent-loop" />
        <text x="340" y="30" text-anchor="middle" class="box-title" fill="#f59e0b">Agent Loop</text>
        
        <!-- Loop Sequence Background -->
        <rect x="30" y="55" width="620" height="50" fill="#0f172a" rx="8" stroke="#334155" stroke-width="1" />
        
        <!-- Nodes & Arrows -->
        <!-- Observe -->
        <text x="80" y="85" text-anchor="middle" class="loop-text">Observe</text>
        <line x1="120" y1="80" x2="160" y2="80" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-loop)"/>
        
        <!-- Think -->
        <text x="200" y="85" text-anchor="middle" class="loop-text">Think</text>
        <line x1="235" y1="80" x2="275" y2="80" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-loop)"/>
        
        <!-- Decide -->
        <text x="320" y="85" text-anchor="middle" class="loop-text">Decide</text>
        <line x1="360" y1="80" x2="400" y2="80" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-loop)"/>
        
        <!-- Act -->
        <text x="435" y="85" text-anchor="middle" class="loop-text">Act</text>
        <line x1="465" y1="80" x2="505" y2="80" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-loop)"/>
        
        <!-- Validate -->
        <text x="550" y="85" text-anchor="middle" class="loop-text">Validate</text>
        
        <!-- Return Loop Line -->
        <path d="M 550 105 L 550 115 L 80 115 L 80 105" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-loop)"/>
        <text x="315" y="112" text-anchor="middle" class="box-sub" fill="#64748b" font-size="10" transform="translate(0, 14)">Loop</text>
    </g>

    <!-- BOTTOM ROW: Human in the Loop -->
    <g transform="translate(60, 440)">
        <rect x="0" y="0" width="680" height="80" class="module-box accent-hitl" />
        <!-- User Icon -->
        <circle cx="340" cy="30" r="10" fill="none" stroke="#ef4444" stroke-width="2" />
        <path d="M 325 55 C 325 45 355 45 355 55" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" />
        <text x="340" y="70" text-anchor="middle" class="box-title" fill="#fca5a5">Human-in-the-Loop Interface</text>
    </g>

</svg>