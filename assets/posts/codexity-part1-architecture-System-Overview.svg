<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="900" height="550">
  <style>
    svg { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .title { font-weight: 800; font-size: 22px; fill: #cdd6f4; letter-spacing: 1.5px; }
    .box-title { font-weight: 700; font-size: 15px; fill: #cdd6f4; }
    .box-sub { font-weight: 500; font-size: 11px; fill: #a6adc8; }
    .label { font-weight: 600; font-size: 12px; fill: #bac2de; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6c7086"/>
    </marker>
  </defs>
  <rect width="900" height="550" rx="16" fill="#1e1e2e"/>
  <text x="450" y="42" text-anchor="middle" class="title">CODEXITY ARCHITECTURE</text>

  <!-- User Query -->
  <rect x="50" y="80" width="160" height="70" rx="12" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <text x="130" y="110" text-anchor="middle" class="box-title">User Query</text>
  <text x="130" y="130" text-anchor="middle" class="box-sub">Natural language input</text>

  <!-- Query Rewriter -->
  <rect x="280" y="80" width="160" height="70" rx="12" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
  <text x="360" y="110" text-anchor="middle" class="box-title">Query Rewriter</text>
  <text x="360" y="130" text-anchor="middle" class="box-sub">LLM decomposition</text>

  <!-- Web Search -->
  <rect x="510" y="80" width="160" height="70" rx="12" fill="#313244" stroke="#f9e2af" stroke-width="2"/>
  <text x="590" y="110" text-anchor="middle" class="box-title">Web Search</text>
  <text x="590" y="130" text-anchor="middle" class="box-sub">DuckDuckGo async</text>

  <!-- Web Scraper -->
  <rect x="740" y="80" width="130" height="70" rx="12" fill="#313244" stroke="#f38ba8" stroke-width="2"/>
  <text x="805" y="110" text-anchor="middle" class="box-title">Scraper</text>
  <text x="805" y="130" text-anchor="middle" class="box-sub">Playwright / httpx</text>

  <!-- Arrows top row -->
  <line x1="210" y1="115" x2="278" y2="115" stroke="#6c7086" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="440" y1="115" x2="508" y2="115" stroke="#6c7086" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="670" y1="115" x2="738" y2="115" stroke="#6c7086" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Content Processor -->
  <rect x="280" y="220" width="200" height="80" rx="12" fill="#313244" stroke="#cba6f7" stroke-width="2"/>
  <text x="380" y="252" text-anchor="middle" class="box-title">Content Processor</text>
  <text x="380" y="272" text-anchor="middle" class="box-sub">Strip HTML, chunk, rank</text>

  <!-- LLM Synthesizer -->
  <rect x="560" y="220" width="200" height="80" rx="12" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <text x="660" y="252" text-anchor="middle" class="box-title">LLM Synthesizer</text>
  <text x="660" y="272" text-anchor="middle" class="box-sub">Generate cited answer</text>

  <!-- Arrow down from scraper to processor -->
  <path d="M 805 150 L 805 190 L 380 190 L 380 218" fill="none" stroke="#6c7086" stroke-width="2" marker-end="url(#arr)"/>
  <!-- Arrow processor to synthesizer -->
  <line x1="480" y1="260" x2="558" y2="260" stroke="#6c7086" stroke-width="2" marker-end="url(#arr)"/>

  <!-- SSE Stream -->
  <rect x="350" y="370" width="200" height="70" rx="12" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
  <text x="450" y="398" text-anchor="middle" class="box-title">SSE Stream</text>
  <text x="450" y="418" text-anchor="middle" class="box-sub">Token-by-token response</text>

  <!-- Arrow from synthesizer to SSE -->
  <path d="M 660 300 L 660 340 L 450 340 L 450 368" fill="none" stroke="#6c7086" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Client -->
  <rect x="350" y="470" width="200" height="55" rx="12" fill="#313244" stroke="#f9e2af" stroke-width="2"/>
  <text x="450" y="503" text-anchor="middle" class="box-title">Client (curl / httpie)</text>

  <line x1="450" y1="440" x2="450" y2="468" stroke="#6c7086" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Small Models box -->
  <rect x="50" y="230" width="160" height="60" rx="12" fill="#313244" stroke="#f38ba8" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="130" y="255" text-anchor="middle" class="box-title">Small Models</text>
  <text x="130" y="275" text-anchor="middle" class="box-sub">Phi / Qwen / Mistral</text>

  <!-- Dashed lines from small models -->
  <line x1="210" y1="250" x2="278" y2="255" stroke="#6c7086" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arr)"/>
  <line x1="210" y1="260" x2="558" y2="260" stroke="#6c7086" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arr)"/>
</svg>