<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 720" preserveAspectRatio="xMidYMid meet">
    <style>
        svg {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: transparent;
        }
        .text-bold { font-weight: 700; }
        .text-mono { font-family: 'Fira Code', 'Courier New', Courier, monospace; }
        .text-italic { font-style: italic; }
    </style>

    <defs>
        <marker id="arrow-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6" />
        </marker>
    </defs>

    <!-- Title -->
    <text x="400" y="35" text-anchor="middle" fill="#f8fafc" font-size="20" class="text-bold">Tool Flow</text>
    <text x="400" y="60" text-anchor="middle" fill="#94a3b8" font-size="14">How agents interact with tools through the LLM</text>

    <!-- Main Container -->
    <rect x="50" y="90" width="700" height="580" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2" />

    <!-- Step 1: LLM sees -->
    <g>
        <rect x="100" y="120" width="600" height="60" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="120" y="145" fill="#60a5fa" font-size="14" class="text-bold">1. LLM sees:</text>
        <text x="280" y="145" fill="#e2e8f0" font-size="14">Available tools + descriptions</text>
        <text x="280" y="165" fill="#94a3b8" font-size="12" class="text-mono">{tools: ["web_search", "fetch_webpage", ...]}</text>
    </g>

    <!-- Arrow -->
    <path d="M 400 180 L 400 210" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrow-blue)" />

    <!-- Step 2: LLM outputs -->
    <g>
        <rect x="100" y="210" width="600" height="70" rx="8" fill="#082f49" stroke="#0ea5e9" stroke-width="2" />
        <text x="120" y="235" fill="#60a5fa" font-size="14" class="text-bold">2. LLM outputs:</text>
        <text x="280" y="235" fill="#e2e8f0" font-size="14">Tool request (JSON)</text>
        <text x="280" y="255" fill="#38bdf8" font-size="12" class="text-mono">{"tool": "web_search",</text>
        <text x="280" y="270" fill="#38bdf8" font-size="12" class="text-mono"> "args": {"query": "..."}}</text>
    </g>

    <!-- Arrow -->
    <path d="M 400 280 L 400 310" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrow-blue)" />

    <!-- Step 3: Your code executes -->
    <g>
        <rect x="100" y="310" width="600" height="60" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="2" />
        <text x="120" y="335" fill="#34d399" font-size="14" class="text-bold">3. Your code:</text>
        <text x="280" y="335" fill="#d1fae5" font-size="14">Execute the tool</text>
        <text x="280" y="355" fill="#6ee7b7" font-size="12" class="text-mono">tool.execute(**args)</text>
    </g>

    <!-- Arrow -->
    <path d="M 400 370 L 400 400" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrow-blue)" />

    <!-- Step 4: Result -->
    <g>
        <rect x="100" y="400" width="600" height="70" rx="8" fill="#2e1065" stroke="#8b5cf6" stroke-width="2" />
        <text x="120" y="425" fill="#a78bfa" font-size="14" class="text-bold">4. Result:</text>
        <text x="280" y="425" fill="#ede9fe" font-size="14">Structured data returned</text>
        <text x="280" y="445" fill="#c4b5fd" font-size="12" class="text-mono">{"query": "...",</text>
        <text x="280" y="460" fill="#c4b5fd" font-size="12" class="text-mono"> "results": [...]}</text>
    </g>

    <!-- Arrow -->
    <path d="M 400 470 L 400 500" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrow-blue)" />

    <!-- Step 5: Back to LLM -->
    <g>
        <rect x="100" y="500" width="600" height="60" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="120" y="525" fill="#60a5fa" font-size="14" class="text-bold">5. Back to LLM:</text>
        <text x="280" y="525" fill="#e2e8f0" font-size="14">Tool result added to context</text>
        <text x="280" y="545" fill="#94a3b8" font-size="12" class="text-italic">LLM sees the results for next decision</text>
    </g>

    <!-- Arrow -->
    <path d="M 400 560 L 400 590" stroke="#3b82f6" stroke-width="3" marker-end="url(#arrow-blue)" />

    <!-- Step 6: LLM decides -->
    <g>
        <rect x="100" y="590" width="600" height="60" rx="8" fill="#422006" stroke="#f59e0b" stroke-width="2" />
        <text x="120" y="615" fill="#fbbf24" font-size="14" class="text-bold">6. LLM decides:</text>
        <text x="280" y="615" fill="#fef3c7" font-size="14">Call another tool OR respond with text</text>
        <text x="280" y="635" fill="#fde68a" font-size="12" class="text-italic">Loop continues until task complete</text>
    </g>

</svg>
