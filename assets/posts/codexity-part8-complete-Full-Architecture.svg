<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620">
  <style>
    svg { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .title { font-weight: 800; font-size: 20px; fill: #cdd6f4; letter-spacing: 1.5px; }
    .box-title { font-weight: 700; font-size: 13px; fill: #cdd6f4; }
    .box-sub { font-weight: 500; font-size: 10px; fill: #a6adc8; }
    .phase { font-weight: 800; font-size: 12px; fill: #89b4fa; text-transform: uppercase; letter-spacing: 1px; }
    .time { font-weight: 600; font-size: 10px; fill: #a6e3a1; }
  </style>
  <defs>
    <marker id="arr8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6c7086"/>
    </marker>
  </defs>
  <rect width="960" height="620" rx="16" fill="#1e1e2e"/>
  <text x="480" y="35" text-anchor="middle" class="title">CODEXITY: COMPLETE REQUEST LIFECYCLE</text>

  <!-- Phase 1 -->
  <text x="30" y="72" class="phase">Phase 1: Understand</text>
  <text x="250" y="72" class="time">~200ms</text>
  <rect x="30" y="82" width="150" height="55" rx="10" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <text x="105" y="106" text-anchor="middle" class="box-title">User Query</text>
  <text x="105" y="122" text-anchor="middle" class="box-sub">raw input</text>

  <rect x="210" y="82" width="150" height="55" rx="10" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
  <text x="285" y="106" text-anchor="middle" class="box-title">Query Rewriter</text>
  <text x="285" y="122" text-anchor="middle" class="box-sub">LLM decompose</text>

  <line x1="180" y1="109" x2="208" y2="109" stroke="#6c7086" stroke-width="1.5" marker-end="url(#arr8)"/>

  <!-- Phase 2 -->
  <text x="30" y="172" class="phase">Phase 2: Search</text>
  <text x="250" y="172" class="time">~1.5s</text>
  <rect x="30" y="182" width="150" height="55" rx="10" fill="#313244" stroke="#f9e2af" stroke-width="2"/>
  <text x="105" y="206" text-anchor="middle" class="box-title">DuckDuckGo</text>
  <text x="105" y="222" text-anchor="middle" class="box-sub">async parallel search</text>

  <rect x="210" y="182" width="150" height="55" rx="10" fill="#313244" stroke="#f9e2af" stroke-width="2"/>
  <text x="285" y="206" text-anchor="middle" class="box-title">Dedup + Filter</text>
  <text x="285" y="222" text-anchor="middle" class="box-sub">10-20 unique URLs</text>

  <line x1="180" y1="209" x2="208" y2="209" stroke="#6c7086" stroke-width="1.5" marker-end="url(#arr8)"/>

  <!-- SSE: searching event -->
  <rect x="430" y="182" width="160" height="35" rx="8" fill="#1e1e2e" stroke="#a6e3a1" stroke-width="1"/>
  <text x="510" y="204" text-anchor="middle" class="box-sub">SSE: event: status</text>

  <line x1="360" y1="200" x2="428" y2="200" stroke="#a6e3a1" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr8)"/>

  <!-- Phase 3 -->
  <text x="30" y="272" class="phase">Phase 3: Scrape</text>
  <text x="250" y="272" class="time">~3s</text>
  <rect x="30" y="282" width="150" height="55" rx="10" fill="#313244" stroke="#f38ba8" stroke-width="2"/>
  <text x="105" y="306" text-anchor="middle" class="box-title">httpx / Playwright</text>
  <text x="105" y="322" text-anchor="middle" class="box-sub">tiered scraping</text>

  <rect x="210" y="282" width="150" height="55" rx="10" fill="#313244" stroke="#cba6f7" stroke-width="2"/>
  <text x="285" y="306" text-anchor="middle" class="box-title">HTML Strip</text>
  <text x="285" y="322" text-anchor="middle" class="box-sub">clean text extraction</text>

  <line x1="180" y1="309" x2="208" y2="309" stroke="#6c7086" stroke-width="1.5" marker-end="url(#arr8)"/>

  <!-- SSE: sources event -->
  <rect x="430" y="282" width="160" height="35" rx="8" fill="#1e1e2e" stroke="#a6e3a1" stroke-width="1"/>
  <text x="510" y="304" text-anchor="middle" class="box-sub">SSE: event: sources</text>

  <line x1="360" y1="300" x2="428" y2="300" stroke="#a6e3a1" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr8)"/>

  <!-- Phase 4 -->
  <text x="30" y="372" class="phase">Phase 4: Process</text>
  <text x="250" y="372" class="time">~500ms</text>
  <rect x="30" y="382" width="150" height="55" rx="10" fill="#313244" stroke="#cba6f7" stroke-width="2"/>
  <text x="105" y="406" text-anchor="middle" class="box-title">Chunk + Score</text>
  <text x="105" y="422" text-anchor="middle" class="box-sub">BM25 relevance</text>

  <rect x="210" y="382" width="150" height="55" rx="10" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <text x="285" y="406" text-anchor="middle" class="box-title">Context Build</text>
  <text x="285" y="422" text-anchor="middle" class="box-sub">top-K with citations</text>

  <line x1="180" y1="409" x2="208" y2="409" stroke="#6c7086" stroke-width="1.5" marker-end="url(#arr8)"/>

  <!-- Phase 5 -->
  <text x="30" y="472" class="phase">Phase 5: Synthesize</text>
  <text x="250" y="472" class="time">~2-8s streaming</text>
  <rect x="30" y="482" width="150" height="55" rx="10" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
  <text x="105" y="506" text-anchor="middle" class="box-title">LLM Generate</text>
  <text x="105" y="522" text-anchor="middle" class="box-sub">Qwen / Mistral</text>

  <rect x="210" y="482" width="150" height="55" rx="10" fill="#313244" stroke="#f9e2af" stroke-width="2"/>
  <text x="285" y="506" text-anchor="middle" class="box-title">Citation Inject</text>
  <text x="285" y="522" text-anchor="middle" class="box-sub">[1], [2] references</text>

  <line x1="180" y1="509" x2="208" y2="509" stroke="#6c7086" stroke-width="1.5" marker-end="url(#arr8)"/>

  <!-- SSE: tokens -->
  <rect x="430" y="482" width="160" height="35" rx="8" fill="#1e1e2e" stroke="#f9e2af" stroke-width="1"/>
  <text x="510" y="504" text-anchor="middle" class="box-sub">SSE: event: token (x N)</text>

  <line x1="360" y1="500" x2="428" y2="500" stroke="#f9e2af" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr8)"/>

  <!-- Done -->
  <rect x="430" y="540" width="160" height="35" rx="8" fill="#1e1e2e" stroke="#f38ba8" stroke-width="1"/>
  <text x="510" y="562" text-anchor="middle" class="box-sub">SSE: event: done</text>

  <line x1="510" y1="517" x2="510" y2="538" stroke="#6c7086" stroke-width="1.5" marker-end="url(#arr8)"/>

  <!-- Client column -->
  <rect x="660" y="70" width="270" height="520" rx="12" fill="#313244" stroke="#89b4fa" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="795" y="95" text-anchor="middle" class="box-title">Client Terminal</text>
  <line x1="680" y1="105" x2="910" y2="105" stroke="#45475a" stroke-width="1"/>

  <text x="695" y="200" class="box-sub">$ Searching for sources...</text>
  <text x="695" y="305" class="box-sub">$ Found 12 sources</text>
  <text x="695" y="500" class="box-sub">$ The answer is that...</text>
  <text x="695" y="520" class="box-sub">$ PostgreSQL offers [1]...</text>
  <text x="695" y="560" class="box-sub">$ [Done in 7.2s]</text>

  <!-- SSE arrows to client -->
  <line x1="590" y1="200" x2="658" y2="200" stroke="#a6e3a1" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr8)"/>
  <line x1="590" y1="300" x2="658" y2="300" stroke="#a6e3a1" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr8)"/>
  <line x1="590" y1="500" x2="658" y2="500" stroke="#f9e2af" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr8)"/>
</svg>