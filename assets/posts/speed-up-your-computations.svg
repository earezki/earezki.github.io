<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 510" preserveAspectRatio="xMidYMid meet">
  <style>
    svg { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .title { font-size: 18px; font-weight: 700; fill: #f8fafc; text-anchor: middle; }
    .label { font-size: 12px; font-weight: 600; fill: #f8fafc; text-anchor: middle; }
    .sublabel { font-size: 10px; fill: #94a3b8; text-anchor: middle; }
    .cycles { font-size: 11px; font-weight: 700; fill: #38bdf8; text-anchor: middle; }
  </style>
  <rect width="800" height="510" rx="16" fill="#0f172a"/>

  <!-- Title -->
  <text x="400" y="40" class="title">CPU Cache Hierarchy &amp; Data Locality</text>

  <!-- CPU Core -->
  <rect x="300" y="70" width="200" height="60" rx="10" fill="#7c3aed" opacity="0.9"/>
  <text x="400" y="97" class="label">CPU Core</text>
  <text x="400" y="115" class="sublabel">ALU + Registers</text>

  <!-- L1 Cache -->
  <rect x="250" y="155" width="300" height="50" rx="10" fill="#2563eb" opacity="0.85"/>
  <text x="400" y="178" class="label">L1 Cache (64 KB)</text>
  <text x="400" y="195" class="cycles">~4 cycles</text>

  <!-- L2 Cache -->
  <rect x="200" y="225" width="400" height="50" rx="10" fill="#0891b2" opacity="0.8"/>
  <text x="400" y="248" class="label">L2 Cache (256 KB)</text>
  <text x="400" y="265" class="cycles">~12 cycles</text>

  <!-- L3 Cache -->
  <rect x="150" y="295" width="500" height="50" rx="10" fill="#059669" opacity="0.75"/>
  <text x="400" y="318" class="label">L3 Cache (8 MB - Shared)</text>
  <text x="400" y="335" class="cycles">~40 cycles</text>

  <!-- Main Memory -->
  <rect x="100" y="365" width="600" height="50" rx="10" fill="#d97706" opacity="0.7"/>
  <text x="400" y="388" class="label">Main Memory (RAM)</text>
  <text x="400" y="405" class="cycles">~120 cycles</text>

  <!-- Cache Line illustration -->
  <rect x="80" y="430" width="640" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <!-- Header row -->
  <text x="400" y="447" class="sublabel" fill="#94a3b8">Cache Line (64 bytes) — all loaded together on memory access</text>
  <!-- Cache line blocks -->
  <rect x="90"  y="453" width="82" height="28" rx="4" fill="#38bdf8" opacity="0.8"/>
  <rect x="178" y="453" width="82" height="28" rx="4" fill="#38bdf8" opacity="0.8"/>
  <rect x="266" y="453" width="82" height="28" rx="4" fill="#38bdf8" opacity="0.8"/>
  <rect x="354" y="453" width="82" height="28" rx="4" fill="#38bdf8" opacity="0.8"/>
  <rect x="442" y="453" width="82" height="28" rx="4" fill="#38bdf8" opacity="0.8"/>
  <rect x="530" y="453" width="82" height="28" rx="4" fill="#38bdf8" opacity="0.8"/>
  <rect x="618" y="453" width="82" height="28" rx="4" fill="#38bdf8" opacity="0.8"/>
  <text x="131" y="471" class="sublabel" fill="#0f172a">amount[0]</text>
  <text x="219" y="471" class="sublabel" fill="#0f172a">amount[1]</text>
  <text x="307" y="471" class="sublabel" fill="#0f172a">amount[2]</text>
  <text x="395" y="471" class="sublabel" fill="#0f172a">amount[3]</text>
  <text x="483" y="471" class="sublabel" fill="#0f172a">amount[4]</text>
  <text x="571" y="471" class="sublabel" fill="#0f172a">amount[5]</text>
  <text x="659" y="471" class="sublabel" fill="#0f172a">amount[6]</text>

  <!-- Arrows between layers -->
  <line x1="400" y1="130" x2="400" y2="155" stroke="#475569" stroke-width="2" marker-end="url(#arrowDown)"/>
  <line x1="400" y1="205" x2="400" y2="225" stroke="#475569" stroke-width="2" marker-end="url(#arrowDown)"/>
  <line x1="400" y1="275" x2="400" y2="295" stroke="#475569" stroke-width="2" marker-end="url(#arrowDown)"/>
  <line x1="400" y1="345" x2="400" y2="365" stroke="#475569" stroke-width="2" marker-end="url(#arrowDown)"/>

  <defs>
    <marker id="arrowDown" markerWidth="8" markerHeight="6" refX="4" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#475569"/>
    </marker>
  </defs>
</svg>
