<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <style>
    svg { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .title { font-weight: 800; font-size: 20px; fill: #cdd6f4; letter-spacing: 1.5px; }
    .box-title { font-weight: 700; font-size: 14px; fill: #cdd6f4; }
    .box-sub { font-weight: 500; font-size: 11px; fill: #a6adc8; }
    .num { font-weight: 800; font-size: 16px; fill: #89b4fa; }
  </style>
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6c7086"/>
    </marker>
  </defs>
  <rect width="900" height="500" rx="16" fill="#1e1e2e"/>
  <text x="450" y="38" text-anchor="middle" class="title">ASYNC SEARCH PIPELINE</text>

  <!-- Step 1 -->
  <text x="60" y="92" class="num">1</text>
  <rect x="80" y="70" width="200" height="65" rx="12" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <text x="180" y="96" text-anchor="middle" class="box-title">Rewritten Queries</text>
  <text x="180" y="114" text-anchor="middle" class="box-sub">2-4 search terms</text>

  <!-- Step 2 -->
  <text x="60" y="197" class="num">2</text>
  <rect x="80" y="175" width="200" height="65" rx="12" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
  <text x="180" y="201" text-anchor="middle" class="box-title">asyncio.gather()</text>
  <text x="180" y="219" text-anchor="middle" class="box-sub">Parallel DuckDuckGo calls</text>

  <!-- Parallel branches -->
  <rect x="370" y="160" width="170" height="45" rx="10" fill="#313244" stroke="#f9e2af" stroke-width="1.5"/>
  <text x="455" y="188" text-anchor="middle" class="box-sub">search("query 1")</text>

  <rect x="370" y="215" width="170" height="45" rx="10" fill="#313244" stroke="#f9e2af" stroke-width="1.5"/>
  <text x="455" y="243" text-anchor="middle" class="box-sub">search("query 2")</text>

  <rect x="370" y="270" width="170" height="45" rx="10" fill="#313244" stroke="#f9e2af" stroke-width="1.5"/>
  <text x="455" y="298" text-anchor="middle" class="box-sub">search("query 3")</text>

  <line x1="280" y1="195" x2="368" y2="183" stroke="#6c7086" stroke-width="1.5" marker-end="url(#arr3)"/>
  <line x1="280" y1="207" x2="368" y2="237" stroke="#6c7086" stroke-width="1.5" marker-end="url(#arr3)"/>
  <line x1="280" y1="215" x2="368" y2="292" stroke="#6c7086" stroke-width="1.5" marker-end="url(#arr3)"/>

  <!-- Step 3: Deduplicate -->
  <text x="60" y="372" class="num">3</text>
  <rect x="80" y="350" width="200" height="65" rx="12" fill="#313244" stroke="#cba6f7" stroke-width="2"/>
  <text x="180" y="376" text-anchor="middle" class="box-title">Deduplicate URLs</text>
  <text x="180" y="394" text-anchor="middle" class="box-sub">Remove duplicates by domain</text>

  <!-- Step 4: Rate Limit -->
  <text x="350" y="372" class="num">4</text>
  <rect x="370" y="350" width="200" height="65" rx="12" fill="#313244" stroke="#f38ba8" stroke-width="2"/>
  <text x="470" y="376" text-anchor="middle" class="box-title">Rate Limiter</text>
  <text x="470" y="394" text-anchor="middle" class="box-sub">asyncio.Semaphore(5)</text>

  <!-- Step 5: Results -->
  <text x="640" y="372" class="num">5</text>
  <rect x="660" y="350" width="200" height="65" rx="12" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
  <text x="760" y="376" text-anchor="middle" class="box-title">Search Results</text>
  <text x="760" y="394" text-anchor="middle" class="box-sub">title + url + snippet</text>

  <!-- Vertical arrows -->
  <line x1="180" y1="135" x2="180" y2="173" stroke="#6c7086" stroke-width="2" marker-end="url(#arr3)"/>
  <line x1="180" y1="240" x2="180" y2="348" stroke="#6c7086" stroke-width="2" marker-end="url(#arr3)"/>
  <line x1="280" y1="382" x2="368" y2="382" stroke="#6c7086" stroke-width="2" marker-end="url(#arr3)"/>
  <line x1="570" y1="382" x2="658" y2="382" stroke="#6c7086" stroke-width="2" marker-end="url(#arr3)"/>

  <!-- Merge arrow -->
  <path d="M 540 183 L 600 183 L 600 237 L 540 237" fill="none" stroke="#6c7086" stroke-width="1.5"/>
  <path d="M 540 292 L 600 292 L 600 237" fill="none" stroke="#6c7086" stroke-width="1.5"/>
  <path d="M 600 237 L 600 340 L 180 340 L 180 348" fill="none" stroke="#6c7086" stroke-width="1.5" marker-end="url(#arr3)"/>
</svg>