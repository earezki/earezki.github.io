<svg width="720" height="380" viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg"
  role="img" aria-label="Architecture diagram: GlobalMiniPlayer on each page reads and writes audio state to localStorage, creating persistent playback across full-page navigations in an Astro MPA">
  <defs>
    <marker id="arrowY" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f59e0b"/>
    </marker>
    <marker id="arrowP" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#818cf8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="380" rx="14" fill="#0f172a"/>

  <!-- ── Page A ───────────────────────────────────── -->
  <rect x="20" y="20" width="300" height="210" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="34" y="44" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="13" font-weight="600">Page A</text>
  <text x="170" y="64" text-anchor="middle" fill="#475569" font-family="ui-monospace,monospace" font-size="10">BaseLayout.astro (every page)</text>

  <!-- GlobalMiniPlayer A -->
  <rect x="40" y="74" width="260" height="110" rx="6" fill="#0f172a" stroke="#6366f1" stroke-width="1.5"/>
  <text x="170" y="97" text-anchor="middle" fill="#818cf8" font-family="ui-monospace,monospace" font-size="12" font-weight="700">GlobalMiniPlayer</text>
  <text x="170" y="115" text-anchor="middle" fill="#4f46e5" font-family="ui-monospace,monospace" font-size="10">client:only="preact"</text>
  <text x="170" y="135" text-anchor="middle" fill="#475569" font-family="ui-monospace,monospace" font-size="10">Audio playing ♪</text>
  <text x="170" y="153" text-anchor="middle" fill="#475569" font-family="ui-monospace,monospace" font-size="10">writes currentTime every 1 s</text>
  <text x="170" y="171" text-anchor="middle" fill="#475569" font-family="ui-monospace,monospace" font-size="10">getAudioEngine() → HTMLAudioElement</text>

  <!-- ── Navigate arrow ─────────────────────────── -->
  <line x1="325" y1="125" x2="393" y2="125" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowY)"/>
  <text x="359" y="116" text-anchor="middle" fill="#f59e0b" font-family="ui-monospace,monospace" font-size="10" font-weight="600">navigate</text>
  <text x="359" y="140" text-anchor="middle" fill="#78716c" font-family="ui-monospace,monospace" font-size="9">(full reload)</text>

  <!-- ── Page B ───────────────────────────────────── -->
  <rect x="398" y="20" width="302" height="210" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="412" y="44" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="13" font-weight="600">Page B</text>
  <text x="549" y="64" text-anchor="middle" fill="#475569" font-family="ui-monospace,monospace" font-size="10">BaseLayout.astro (every page)</text>

  <!-- GlobalMiniPlayer B -->
  <rect x="418" y="74" width="262" height="110" rx="6" fill="#0f172a" stroke="#6366f1" stroke-width="1.5"/>
  <text x="549" y="97" text-anchor="middle" fill="#818cf8" font-family="ui-monospace,monospace" font-size="12" font-weight="700">GlobalMiniPlayer</text>
  <text x="549" y="115" text-anchor="middle" fill="#4f46e5" font-family="ui-monospace,monospace" font-size="10">client:only="preact"</text>
  <text x="549" y="135" text-anchor="middle" fill="#475569" font-family="ui-monospace,monospace" font-size="10">reads store on mount</text>
  <text x="549" y="153" text-anchor="middle" fill="#475569" font-family="ui-monospace,monospace" font-size="10">new HTMLAudioElement</text>
  <text x="549" y="171" text-anchor="middle" fill="#475569" font-family="ui-monospace,monospace" font-size="10">seeks to saved position → resumes</text>

  <!-- ── localStorage ───────────────────────────── -->
  <rect x="150" y="278" width="420" height="84" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="360" y="302" text-anchor="middle" fill="#34d399" font-family="ui-monospace,monospace" font-size="13" font-weight="700">localStorage  (persists across navigations)</text>
  <text x="360" y="322" text-anchor="middle" fill="#475569" font-family="ui-monospace,monospace" font-size="10">"global-player" → { song, currentTime, isPlaying, playbackSpeed, … }</text>
  <text x="360" y="342" text-anchor="middle" fill="#475569" font-family="ui-monospace,monospace" font-size="10">"audio_progress:{url}" → "142.5"  (per-episode resume key)</text>

  <!-- Arrow Page A → localStorage -->
  <line x1="185" y1="186" x2="240" y2="275" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowP)"/>
  <text x="174" y="235" text-anchor="end" fill="#818cf8" font-family="ui-monospace,monospace" font-size="9">writes</text>
  <text x="174" y="247" text-anchor="end" fill="#818cf8" font-family="ui-monospace,monospace" font-size="9">(Zustand persist)</text>

  <!-- Arrow localStorage → Page B -->
  <line x1="480" y1="275" x2="535" y2="186" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowP)"/>
  <text x="546" y="235" text-anchor="start" fill="#818cf8" font-family="ui-monospace,monospace" font-size="9">reads</text>
  <text x="546" y="247" text-anchor="start" fill="#818cf8" font-family="ui-monospace,monospace" font-size="9">(on mount)</text>
</svg>
