<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <style>
    svg { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .title { font-weight: 800; font-size: 20px; fill: #cdd6f4; letter-spacing: 1.5px; }
    .box-title { font-weight: 700; font-size: 14px; fill: #cdd6f4; }
    .box-sub { font-weight: 500; font-size: 11px; fill: #a6adc8; }
    .metric { font-weight: 700; font-size: 13px; fill: #a6e3a1; }
  </style>
  <defs>
    <marker id="arr5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6c7086"/>
    </marker>
  </defs>
  <rect width="900" height="480" rx="16" fill="#1e1e2e"/>
  <text x="450" y="38" text-anchor="middle" class="title">CONTENT PROCESSING PIPELINE</text>

  <!-- Raw pages -->
  <rect x="50" y="70" width="180" height="65" rx="12" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <text x="140" y="96" text-anchor="middle" class="box-title">Raw Pages</text>
  <text x="140" y="116" text-anchor="middle" class="box-sub">10-15 scraped documents</text>

  <!-- Clean text -->
  <rect x="50" y="175" width="180" height="65" rx="12" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
  <text x="140" y="201" text-anchor="middle" class="box-title">Clean Text</text>
  <text x="140" y="221" text-anchor="middle" class="box-sub">Markdown extraction</text>

  <!-- Chunker -->
  <rect x="300" y="175" width="180" height="65" rx="12" fill="#313244" stroke="#f9e2af" stroke-width="2"/>
  <text x="390" y="201" text-anchor="middle" class="box-title">Chunker</text>
  <text x="390" y="221" text-anchor="middle" class="box-sub">512 tokens, 50 overlap</text>

  <!-- Relevance Scorer -->
  <rect x="550" y="175" width="180" height="65" rx="12" fill="#313244" stroke="#cba6f7" stroke-width="2"/>
  <text x="640" y="201" text-anchor="middle" class="box-title">Relevance Scorer</text>
  <text x="640" y="221" text-anchor="middle" class="box-sub">BM25 + semantic similarity</text>

  <!-- Top-K Selector -->
  <rect x="550" y="300" width="180" height="65" rx="12" fill="#313244" stroke="#f38ba8" stroke-width="2"/>
  <text x="640" y="326" text-anchor="middle" class="box-title">Top-K Selector</text>
  <text x="640" y="346" text-anchor="middle" class="box-sub">Keep best 8-12 chunks</text>

  <!-- Context Builder -->
  <rect x="300" y="300" width="180" height="65" rx="12" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <text x="390" y="326" text-anchor="middle" class="box-title">Context Builder</text>
  <text x="390" y="346" text-anchor="middle" class="box-sub">Format with [source] tags</text>

  <!-- LLM ready -->
  <rect x="300" y="400" width="180" height="55" rx="12" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
  <text x="390" y="428" text-anchor="middle" class="box-title">LLM-Ready Context</text>
  <text x="390" y="444" text-anchor="middle" class="metric">~4000 tokens</text>

  <!-- Arrows -->
  <line x1="140" y1="135" x2="140" y2="173" stroke="#6c7086" stroke-width="2" marker-end="url(#arr5)"/>
  <line x1="230" y1="207" x2="298" y2="207" stroke="#6c7086" stroke-width="2" marker-end="url(#arr5)"/>
  <line x1="480" y1="207" x2="548" y2="207" stroke="#6c7086" stroke-width="2" marker-end="url(#arr5)"/>
  <path d="M 640 240 L 640 298" fill="none" stroke="#6c7086" stroke-width="2" marker-end="url(#arr5)"/>
  <line x1="550" y1="332" x2="482" y2="332" stroke="#6c7086" stroke-width="2" marker-end="url(#arr5)"/>
  <line x1="390" y1="365" x2="390" y2="398" stroke="#6c7086" stroke-width="2" marker-end="url(#arr5)"/>
</svg>