<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 415" preserveAspectRatio="xMidYMid meet">
  <style>
    svg { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .title { font-size: 18px; font-weight: 700; fill: #f8fafc; text-anchor: middle; }
    .label { font-size: 12px; font-weight: 600; fill: #f8fafc; text-anchor: middle; }
    .sublabel { font-size: 10px; fill: #94a3b8; text-anchor: middle; }
    .debt { font-size: 10px; fill: #fbbf24; text-anchor: middle; }
  </style>
  <rect width="700" height="415" rx="16" fill="#0f172a"/>

  <!-- Title -->
  <text x="350" y="35" class="title">Technical Debt Accumulation</text>

  <!-- Timeline axis -->
  <line x1="80" y1="330" x2="620" y2="330" stroke="#475569" stroke-width="2"/>
  <text x="350" y="350" class="sublabel">Time (Sprints)</text>

  <!-- Y-axis -->
  <line x1="80" y1="80" x2="80" y2="330" stroke="#475569" stroke-width="2"/>
  <text x="40" y="200" class="sublabel" transform="rotate(-90, 40, 200)">Cost to Change</text>

  <!-- Debt growth curve -->
  <path d="M 80,310 Q 200,305 280,280 Q 360,250 420,200 Q 480,140 540,90 Q 580,65 620,55" fill="none" stroke="#ef4444" stroke-width="3"/>

  <!-- Ideal line (with refactoring) -->
  <path d="M 80,310 Q 200,305 280,295 Q 360,285 420,275 Q 480,265 540,260 Q 580,255 620,250" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-dasharray="6 4"/>

  <!-- Sprint markers -->
  <line x1="170" y1="325" x2="170" y2="335" stroke="#64748b" stroke-width="1.5"/>
  <line x1="260" y1="325" x2="260" y2="335" stroke="#64748b" stroke-width="1.5"/>
  <line x1="350" y1="325" x2="350" y2="335" stroke="#64748b" stroke-width="1.5"/>
  <line x1="440" y1="325" x2="440" y2="335" stroke="#64748b" stroke-width="1.5"/>
  <line x1="530" y1="325" x2="530" y2="335" stroke="#64748b" stroke-width="1.5"/>
  <line x1="620" y1="325" x2="620" y2="335" stroke="#64748b" stroke-width="1.5"/>

  <!-- Debt items stacking -->
  <rect x="140" y="290" width="80" height="18" rx="4" fill="#d97706" opacity="0.6"/>
  <text x="180" y="303" class="debt">Deferred refactor</text>

  <rect x="230" y="260" width="90" height="18" rx="4" fill="#d97706" opacity="0.7"/>
  <text x="275" y="273" class="debt">Legacy module</text>

  <rect x="330" y="220" width="100" height="18" rx="4" fill="#d97706" opacity="0.8"/>
  <text x="380" y="233" class="debt">Missing abstractions</text>

  <rect x="430" y="165" width="95" height="18" rx="4" fill="#ef4444" opacity="0.8"/>
  <text x="477" y="178" class="debt">Tight coupling</text>

  <rect x="520" y="105" width="85" height="18" rx="4" fill="#ef4444" opacity="0.9"/>
  <text x="562" y="118" class="debt">Can't ship fast</text>

  <!-- Legend (stacked vertically) -->
  <line x1="80" y1="368" x2="115" y2="368" stroke="#ef4444" stroke-width="3"/>
  <text x="122" y="372" class="sublabel" text-anchor="start" fill="#fca5a5">Without paying debt (interest compounds)</text>

  <line x1="80" y1="384" x2="115" y2="384" stroke="#22c55e" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="122" y="388" class="sublabel" text-anchor="start" fill="#86efac">With regular refactoring</text>

  <!-- Quote box -->
  <rect x="100" y="60" width="280" height="50" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1" opacity="0.9"/>
  <text x="240" y="80" class="sublabel" fill="#fbbf24" font-style="italic">"A little debt speeds development</text>
  <text x="240" y="95" class="sublabel" fill="#fbbf24" font-style="italic">so long as it is paid back promptly"</text>
  <text x="240" y="108" class="sublabel" fill="#94a3b8">— Ward Cunningham, 1992</text>
</svg>
