<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#1e1e2e" rx="8"/>
  <text x="400" y="35" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">BeanPostProcessor Intervention Points</text>

  <!-- Timeline arrow -->
  <line x1="80" y1="80" x2="720" y2="80" stroke="#585b70" stroke-width="2"/>
  <polygon points="720,75 730,80 720,85" fill="#585b70"/>
  <text x="735" y="84" fill="#585b70" font-family="system-ui, sans-serif" font-size="10">time</text>

  <!-- Phase labels -->
  <text x="150" y="70" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Bean Definition</text>
  <text x="350" y="70" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Instantiation</text>
  <text x="550" y="70" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Initialization</text>

  <!-- Phase separators -->
  <line x1="250" y1="60" x2="250" y2="100" stroke="#585b70" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="450" y1="60" x2="450" y2="100" stroke="#585b70" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Bean lifecycle flow -->
  <g transform="translate(80, 120)">
    <!-- BeanDefinition phase -->
    <rect x="0" y="0" width="180" height="80" rx="6" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
    <text x="90" y="25" fill="#a6e3a1" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">BeanFactoryPostProcessor</text>
    <text x="90" y="45" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Modifies BeanDefinition</text>
    <text x="90" y="60" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">metadata (scope, lazy,</text>
    <text x="90" y="73" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">properties, qualifiers)</text>

    <!-- Arrow -->
    <line x1="180" y1="40" x2="220" y2="40" stroke="#585b70" stroke-width="1.5"/>
    <polygon points="220,36 228,40 220,44" fill="#585b70"/>

    <!-- Constructor -->
    <rect x="230" y="10" width="120" height="50" rx="6" fill="#45475a" stroke="#cdd6f4" stroke-width="1"/>
    <text x="290" y="32" fill="#cdd6f4" font-family="monospace" font-size="11" text-anchor="middle">new Bean()</text>
    <text x="290" y="48" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Constructor</text>

    <!-- Arrow -->
    <line x1="350" y1="35" x2="380" y2="35" stroke="#585b70" stroke-width="1.5"/>
    <polygon points="380,31 388,35 380,39" fill="#585b70"/>

    <!-- BPP Before -->
    <rect x="390" y="0" width="240" height="80" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
    <text x="510" y="22" fill="#89b4fa" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">postProcessBeforeInitialization()</text>
    <text x="510" y="42" fill="#f9e2af" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">@Autowired injection happens here</text>
    <text x="510" y="58" fill="#f9e2af" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">via AutowiredAnnotationBPP</text>
    <text x="510" y="73" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">CommonAnnotationBPP for @Resource</text>
  </g>

  <!-- Second row -->
  <g transform="translate(80, 230)">
    <!-- Arrow down from BPP Before -->
    <line x1="510" y1="-25" x2="510" y2="0" stroke="#585b70" stroke-width="1.5"/>
    <polygon points="506,-1 510,7 514,-1" fill="#585b70"/>

    <!-- @PostConstruct -->
    <rect x="370" y="10" width="280" height="55" rx="6" fill="#45475a" stroke="#f9e2af" stroke-width="2"/>
    <text x="510" y="32" fill="#f9e2af" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">@PostConstruct</text>
    <text x="510" y="52" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">InitializingBean.afterPropertiesSet()</text>

    <!-- Arrow -->
    <line x1="510" y1="65" x2="510" y2="90" stroke="#585b70" stroke-width="1.5"/>
    <polygon points="506,89 510,97 514,89" fill="#585b70"/>

    <!-- BPP After -->
    <rect x="370" y="100" width="280" height="80" rx="6" fill="#313244" stroke="#f38ba8" stroke-width="2"/>
    <text x="510" y="122" fill="#f38ba8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">postProcessAfterInitialization()</text>
    <text x="510" y="142" fill="#f9e2af" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">AOP proxies created here</text>
    <text x="510" y="158" fill="#f9e2af" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">by AbstractAutoProxyCreator</text>
    <text x="510" y="172" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Returns bean OR proxy wrapping bean</text>

    <!-- Left side: what BFPP can do -->
    <rect x="0" y="30" width="200" height="130" rx="6" fill="#2a2a3d" stroke="#a6e3a1" stroke-width="1"/>
    <text x="100" y="50" fill="#a6e3a1" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">BFPP Can:</text>
    <text x="15" y="70" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="10">• Add bean definitions</text>
    <text x="15" y="86" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="10">• Remove bean definitions</text>
    <text x="15" y="102" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="10">• Change scope/lazy/primary</text>
    <text x="15" y="118" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="10">• Modify property values</text>
    <text x="15" y="138" fill="#f38ba8" font-family="system-ui, sans-serif" font-size="10">✗ Cannot access bean instances</text>
    <text x="15" y="152" fill="#f38ba8" font-family="system-ui, sans-serif" font-size="10">✗ Cannot use @Autowired</text>
  </g>

  <!-- Final state -->
  <g transform="translate(80, 440)">
    <line x1="510" y1="-20" x2="510" y2="5" stroke="#585b70" stroke-width="1.5"/>
    <polygon points="506,4 510,12 514,4" fill="#585b70"/>

    <rect x="370" y="15" width="280" height="50" rx="6" fill="#313244" stroke="#cdd6f4" stroke-width="2"/>
    <text x="510" y="38" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Ready Bean (or Proxy)</text>
    <text x="510" y="55" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Stored in singletonObjects map</text>

    <!-- Key insight -->
    <rect x="0" y="90" width="640" height="35" rx="6" fill="#2a2a3d" stroke="#f9e2af" stroke-width="1"/>
    <text x="320" y="112" fill="#f9e2af" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Key: What you inject is the proxy, not the original bean. The proxy wraps the bean after @PostConstruct.</text>
  </g>
</svg>
