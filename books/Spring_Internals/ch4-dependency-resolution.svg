<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520">
  <rect width="800" height="520" fill="#1e1e2e" rx="8"/>
  <text x="400" y="35" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Dependency Resolution &amp; Circular Dependency Detection</text>

  <!-- Bean creation flow -->
  <g transform="translate(30, 55)">
    <text x="170" y="15" fill="#89b4fa" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Constructor Injection (default)</text>

    <!-- Step 1 -->
    <rect x="30" y="25" width="280" height="40" rx="4" fill="#313244" stroke="#89b4fa" stroke-width="1"/>
    <text x="45" y="42" fill="#f9e2af" font-family="monospace" font-size="10">1</text>
    <text x="60" y="42" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="10">getBean("orderService")</text>
    <text x="60" y="57" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="9">Not in singletonObjects → create</text>

    <line x1="170" y1="65" x2="170" y2="80" stroke="#585b70" stroke-width="1"/>
    <polygon points="166,79 170,87 174,79" fill="#585b70"/>

    <!-- Step 2 -->
    <rect x="30" y="85" width="280" height="40" rx="4" fill="#313244" stroke="#89b4fa" stroke-width="1"/>
    <text x="45" y="102" fill="#f9e2af" font-family="monospace" font-size="10">2</text>
    <text x="60" y="102" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="10">Add to singletonsCurrentlyInCreation</text>
    <text x="60" y="117" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="9">Mark as "being created"</text>

    <line x1="170" y1="125" x2="170" y2="140" stroke="#585b70" stroke-width="1"/>
    <polygon points="166,139 170,147 174,139" fill="#585b70"/>

    <!-- Step 3 -->
    <rect x="30" y="145" width="280" height="40" rx="4" fill="#313244" stroke="#89b4fa" stroke-width="1"/>
    <text x="45" y="162" fill="#f9e2af" font-family="monospace" font-size="10">3</text>
    <text x="60" y="162" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="10">Resolve constructor args</text>
    <text x="60" y="177" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="9">Needs PaymentService → getBean("paymentService")</text>

    <line x1="170" y1="185" x2="170" y2="200" stroke="#585b70" stroke-width="1"/>
    <polygon points="166,199 170,207 174,199" fill="#585b70"/>

    <!-- Step 4 -->
    <rect x="30" y="205" width="280" height="40" rx="4" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
    <text x="45" y="222" fill="#f9e2af" font-family="monospace" font-size="10">4</text>
    <text x="60" y="222" fill="#a6e3a1" font-family="system-ui, sans-serif" font-size="10">PaymentService resolved ✓</text>
    <text x="60" y="237" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="9">No circular → instantiate OrderService</text>
  </g>

  <!-- Circular dependency scenario -->
  <g transform="translate(420, 55)">
    <text x="170" y="15" fill="#f38ba8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Circular Dependency (fails)</text>

    <rect x="30" y="25" width="310" height="40" rx="4" fill="#313244" stroke="#f38ba8" stroke-width="1"/>
    <text x="45" y="42" fill="#f9e2af" font-family="monospace" font-size="10">1</text>
    <text x="60" y="42" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="10">getBean("orderService")</text>
    <text x="60" y="57" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="9">Add to currentlyInCreation set</text>

    <line x1="170" y1="65" x2="170" y2="80" stroke="#585b70" stroke-width="1"/>

    <rect x="30" y="85" width="310" height="40" rx="4" fill="#313244" stroke="#f38ba8" stroke-width="1"/>
    <text x="45" y="102" fill="#f9e2af" font-family="monospace" font-size="10">2</text>
    <text x="60" y="102" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="10">Constructor needs NotificationService</text>
    <text x="60" y="117" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="9">→ getBean("notificationService")</text>

    <line x1="170" y1="125" x2="170" y2="140" stroke="#585b70" stroke-width="1"/>

    <rect x="30" y="145" width="310" height="40" rx="4" fill="#313244" stroke="#f38ba8" stroke-width="1"/>
    <text x="45" y="162" fill="#f9e2af" font-family="monospace" font-size="10">3</text>
    <text x="60" y="162" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="10">NotificationService needs OrderService</text>
    <text x="60" y="177" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="9">→ getBean("orderService")</text>

    <line x1="170" y1="185" x2="170" y2="200" stroke="#f38ba8" stroke-width="2"/>

    <rect x="30" y="205" width="310" height="40" rx="4" fill="#313244" stroke="#f38ba8" stroke-width="2"/>
    <text x="45" y="222" fill="#f38ba8" font-family="monospace" font-size="10">4</text>
    <text x="60" y="222" fill="#f38ba8" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">BeanCurrentlyInCreationException ✗</text>
    <text x="60" y="237" fill="#f38ba8" font-family="system-ui, sans-serif" font-size="9">"orderService" found in currentlyInCreation set</text>
  </g>

  <!-- Three-level cache -->
  <g transform="translate(50, 320)">
    <text x="350" y="15" fill="#f9e2af" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">DefaultSingletonBeanRegistry — Three-Level Cache</text>

    <rect x="0" y="30" width="220" height="55" rx="4" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
    <text x="110" y="50" fill="#a6e3a1" font-family="monospace" font-size="10" text-anchor="middle">singletonObjects</text>
    <text x="110" y="65" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Level 1: Fully initialized beans</text>
    <text x="110" y="78" fill="#585b70" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">ConcurrentHashMap</text>

    <rect x="240" y="30" width="220" height="55" rx="4" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
    <text x="350" y="50" fill="#89b4fa" font-family="monospace" font-size="10" text-anchor="middle">earlySingletonObjects</text>
    <text x="350" y="65" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Level 2: Early refs (no BPP yet)</text>
    <text x="350" y="78" fill="#585b70" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">ConcurrentHashMap</text>

    <rect x="480" y="30" width="220" height="55" rx="4" fill="#313244" stroke="#f38ba8" stroke-width="1.5"/>
    <text x="590" y="50" fill="#f38ba8" font-family="monospace" font-size="10" text-anchor="middle">singletonFactories</text>
    <text x="590" y="65" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Level 3: ObjectFactory lambdas</text>
    <text x="590" y="78" fill="#585b70" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Used only with field/setter injection</text>
  </g>

  <!-- Bottom notes -->
  <rect x="50" y="425" width="700" height="30" rx="4" fill="#2a2a3d" stroke="#a6e3a1" stroke-width="1"/>
  <text x="400" y="445" fill="#a6e3a1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Spring 6 default: Constructor injection. Circular dependencies fail fast. This is correct behavior.</text>

  <rect x="50" y="465" width="700" height="30" rx="4" fill="#2a2a3d" stroke="#f38ba8" stroke-width="1"/>
  <text x="400" y="485" fill="#f38ba8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">spring.main.allow-circular-references=true re-enables three-level cache. Do not use this in production.</text>
</svg>
