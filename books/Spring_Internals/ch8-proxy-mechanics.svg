<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" width="800" height="700">
  <rect width="800" height="700" fill="#1e1e2e" rx="8"/>
  <text x="400" y="35" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">JDK Dynamic Proxy vs CGLIB Proxy</text>

  <!-- Left side: JDK Dynamic Proxy -->
  <g transform="translate(30, 60)">
    <rect x="0" y="0" width="350" height="35" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
    <text x="175" y="23" fill="#89b4fa" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">JDK Dynamic Proxy</text>

    <!-- Interface -->
    <rect x="75" y="55" width="200" height="40" rx="4" fill="#45475a" stroke="#a6e3a1" stroke-width="1.5"/>
    <text x="175" y="72" fill="#a6e3a1" font-family="monospace" font-size="11" text-anchor="middle">«interface»</text>
    <text x="175" y="88" fill="#a6e3a1" font-family="monospace" font-size="12" text-anchor="middle">NotificationGateway</text>

    <!-- implements arrows -->
    <line x1="120" y1="95" x2="120" y2="130" stroke="#a6e3a1" stroke-width="1" stroke-dasharray="4,4"/>
    <polygon points="116,131 120,139 124,131" fill="#a6e3a1"/>
    <line x1="230" y1="95" x2="230" y2="130" stroke="#a6e3a1" stroke-width="1" stroke-dasharray="4,4"/>
    <polygon points="226,131 230,139 234,131" fill="#a6e3a1"/>

    <!-- Proxy class -->
    <rect x="0" y="145" width="170" height="70" rx="4" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
    <text x="85" y="165" fill="#89b4fa" font-family="monospace" font-size="10" text-anchor="middle">$Proxy42</text>
    <text x="85" y="182" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">implements interface</text>
    <text x="85" y="196" fill="#f9e2af" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">InvocationHandler</text>
    <text x="85" y="208" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">dispatches calls</text>

    <!-- Target class -->
    <rect x="180" y="145" width="170" height="70" rx="4" fill="#313244" stroke="#cdd6f4" stroke-width="1"/>
    <text x="265" y="165" fill="#cdd6f4" font-family="monospace" font-size="10" text-anchor="middle">EmailNotificationGateway</text>
    <text x="265" y="182" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">implements interface</text>
    <text x="265" y="196" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">actual implementation</text>

    <!-- Call flow -->
    <rect x="0" y="235" width="350" height="110" rx="6" fill="#2a2a3d" stroke="#585b70" stroke-width="1"/>
    <text x="15" y="258" fill="#89b4fa" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Call Flow:</text>
    <text x="15" y="278" fill="#cdd6f4" font-family="monospace" font-size="10">caller.send(msg)</text>
    <text x="15" y="296" fill="#a6adc8" font-family="monospace" font-size="10">→ $Proxy42.send(msg)</text>
    <text x="15" y="314" fill="#f9e2af" font-family="monospace" font-size="10">→ InvocationHandler.invoke()</text>
    <text x="15" y="332" fill="#a6e3a1" font-family="monospace" font-size="10">→ target.send(msg)</text>

    <!-- Characteristics -->
    <rect x="0" y="360" width="350" height="95" rx="6" fill="#2a2a3d" stroke="#89b4fa" stroke-width="1"/>
    <text x="175" y="380" fill="#89b4fa" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Characteristics</text>
    <text x="15" y="398" fill="#a6e3a1" font-family="system-ui, sans-serif" font-size="10">✓ Works with interfaces only</text>
    <text x="15" y="414" fill="#a6e3a1" font-family="system-ui, sans-serif" font-size="10">✓ No subclassing required</text>
    <text x="15" y="430" fill="#f38ba8" font-family="system-ui, sans-serif" font-size="10">✗ Cannot proxy concrete classes</text>
    <text x="15" y="446" fill="#f38ba8" font-family="system-ui, sans-serif" font-size="10">✗ Cast to impl class → ClassCastException</text>
  </g>

  <!-- Right side: CGLIB Proxy -->
  <g transform="translate(420, 60)">
    <rect x="0" y="0" width="350" height="35" rx="6" fill="#313244" stroke="#f38ba8" stroke-width="2"/>
    <text x="175" y="23" fill="#f38ba8" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">CGLIB Proxy (Spring Default)</text>

    <!-- Target class -->
    <rect x="75" y="55" width="200" height="40" rx="4" fill="#45475a" stroke="#cdd6f4" stroke-width="1.5"/>
    <text x="175" y="72" fill="#cdd6f4" font-family="monospace" font-size="11" text-anchor="middle">class</text>
    <text x="175" y="88" fill="#cdd6f4" font-family="monospace" font-size="12" text-anchor="middle">OrderService</text>

    <!-- extends arrow -->
    <line x1="175" y1="95" x2="175" y2="140" stroke="#f38ba8" stroke-width="1.5"/>
    <polygon points="171,139 175,147 179,139" fill="#f38ba8"/>
    <text x="190" y="122" fill="#f38ba8" font-family="system-ui, sans-serif" font-size="9">extends</text>

    <!-- Proxy subclass -->
    <rect x="25" y="150" width="300" height="65" rx="4" fill="#313244" stroke="#f38ba8" stroke-width="1.5"/>
    <text x="175" y="170" fill="#f38ba8" font-family="monospace" font-size="10" text-anchor="middle">OrderService$$SpringCGLIB$$0</text>
    <text x="175" y="188" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">extends OrderService</text>
    <text x="175" y="204" fill="#f9e2af" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">MethodInterceptor dispatches calls</text>

    <!-- Call flow -->
    <rect x="0" y="235" width="350" height="110" rx="6" fill="#2a2a3d" stroke="#585b70" stroke-width="1"/>
    <text x="15" y="258" fill="#f38ba8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Call Flow:</text>
    <text x="15" y="278" fill="#cdd6f4" font-family="monospace" font-size="10">caller.createOrder(req)</text>
    <text x="15" y="296" fill="#a6adc8" font-family="monospace" font-size="10">→ $$SpringCGLIB$$.createOrder()</text>
    <text x="15" y="314" fill="#f9e2af" font-family="monospace" font-size="10">→ MethodInterceptor.intercept()</text>
    <text x="15" y="332" fill="#a6e3a1" font-family="monospace" font-size="10">→ super.createOrder(req)</text>

    <!-- Characteristics -->
    <rect x="0" y="360" width="350" height="95" rx="6" fill="#2a2a3d" stroke="#f38ba8" stroke-width="1"/>
    <text x="175" y="380" fill="#f38ba8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Characteristics</text>
    <text x="15" y="398" fill="#a6e3a1" font-family="system-ui, sans-serif" font-size="10">✓ Proxies concrete classes (no interface needed)</text>
    <text x="15" y="414" fill="#a6e3a1" font-family="system-ui, sans-serif" font-size="10">✓ Cast to impl class works</text>
    <text x="15" y="430" fill="#f38ba8" font-family="system-ui, sans-serif" font-size="10">✗ Cannot proxy final classes or final methods</text>
    <text x="15" y="446" fill="#f38ba8" font-family="system-ui, sans-serif" font-size="10">✗ Private methods not intercepted</text>
  </g>

  <!-- Self-invocation callout -->
  <rect x="100" y="530" width="600" height="80" rx="8" fill="#2a2a3d" stroke="#f9e2af" stroke-width="2"/>
  <text x="400" y="555" fill="#f9e2af" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">The Self-Invocation Problem (Both Proxy Types)</text>
  <text x="400" y="575" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">this.method() bypasses the proxy because this refers to the target object,</text>
  <text x="400" y="593" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">not the proxy wrapper. @Transactional, @Cacheable, @Async, @PreAuthorize all affected.</text>

  <!-- Detection -->
  <rect x="100" y="625" width="600" height="30" rx="4" fill="#313244" stroke="#a6e3a1" stroke-width="1"/>
  <text x="400" y="645" fill="#a6e3a1" font-family="monospace" font-size="11" text-anchor="middle">Detect: bean.getClass().getName() → contains "$$SpringCGLIB$$" or starts with "$Proxy"</text>
</svg>
