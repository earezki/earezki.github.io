<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <rect width="800" height="480" fill="#1e1e2e" rx="8"/>
  <text x="400" y="35" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">@LoadBalanced RestTemplate / WebClient Flow</text>

  <!-- Client call -->
  <rect x="50" y="55" width="250" height="40" rx="4" fill="#45475a" stroke="#cdd6f4" stroke-width="1.5"/>
  <text x="175" y="72" fill="#cdd6f4" font-family="monospace" font-size="10" text-anchor="middle">restTemplate.getForObject(</text>
  <text x="175" y="87" fill="#89b4fa" font-family="monospace" font-size="10" text-anchor="middle">"http://order-service/api/orders")</text>

  <line x1="300" y1="75" x2="340" y2="75" stroke="#585b70" stroke-width="1.5"/>
  <polygon points="339,71 347,75 339,79" fill="#585b70"/>

  <!-- LoadBalancerInterceptor -->
  <rect x="345" y="55" width="410" height="50" rx="6" fill="#2a2a3d" stroke="#89b4fa" stroke-width="2"/>
  <text x="550" y="75" fill="#89b4fa" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">LoadBalancerInterceptor</text>
  <text x="550" y="95" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">ClientHttpRequestInterceptor added by @LoadBalanced BPP</text>

  <line x1="550" y1="105" x2="550" y2="125" stroke="#585b70" stroke-width="1.5"/>
  <polygon points="546,124 550,132 554,124" fill="#585b70"/>

  <!-- ReactiveLoadBalancer -->
  <rect x="200" y="130" width="400" height="55" rx="6" fill="#2a2a3d" stroke="#f9e2af" stroke-width="2"/>
  <text x="400" y="150" fill="#f9e2af" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">ReactiveLoadBalancer&lt;ServiceInstance&gt;</text>
  <text x="400" y="170" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">RoundRobinLoadBalancer (default) — stateless, AtomicInteger position counter</text>
  <text x="400" y="180" fill="#585b70" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">Resolves logical name "order-service" → physical address</text>

  <!-- Discovery client -->
  <line x1="400" y1="185" x2="400" y2="210" stroke="#585b70" stroke-width="1.5"/>
  <polygon points="396,209 400,217 404,209" fill="#585b70"/>
  <text x="415" y="200" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="8">getInstances()</text>

  <rect x="100" y="215" width="600" height="65" rx="6" fill="#2a2a3d" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="400" y="235" fill="#a6e3a1" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">ServiceInstanceListSupplier (DiscoveryClient)</text>

  <rect x="120" y="245" width="170" height="25" rx="3" fill="#313244" stroke="#585b70" stroke-width="1"/>
  <text x="205" y="262" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">order-service:192.168.1.10:8080</text>

  <rect x="310" y="245" width="170" height="25" rx="3" fill="#313244" stroke="#585b70" stroke-width="1"/>
  <text x="395" y="262" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">order-service:192.168.1.11:8080</text>

  <rect x="500" y="245" width="170" height="25" rx="3" fill="#313244" stroke="#585b70" stroke-width="1"/>
  <text x="585" y="262" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">order-service:192.168.1.12:8080</text>

  <!-- Selected instance -->
  <line x1="400" y1="280" x2="400" y2="310" stroke="#a6e3a1" stroke-width="2"/>
  <polygon points="396,309 400,317 404,309" fill="#a6e3a1"/>
  <text x="415" y="298" fill="#a6e3a1" font-family="system-ui, sans-serif" font-size="9">selected</text>

  <!-- Actual HTTP call -->
  <rect x="150" y="315" width="500" height="45" rx="6" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
  <text x="400" y="335" fill="#a6e3a1" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">HTTP GET http://192.168.1.11:8080/api/orders</text>
  <text x="400" y="352" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Logical URL replaced with physical address. Standard HTTP client executes the request.</text>

  <!-- Caching note -->
  <rect x="50" y="380" width="700" height="40" rx="6" fill="#313244" stroke="#f9e2af" stroke-width="1"/>
  <text x="400" y="398" fill="#f9e2af" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Instance list cached (default 35s). CachingServiceInstanceListSupplier wraps the discovery supplier.</text>
  <text x="400" y="413" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Health-check filter: ServiceInstanceListSupplier with HealthCheckServiceInstanceListSupplier decorator.</text>

  <!-- Failure mode -->
  <rect x="50" y="430" width="700" height="35" rx="6" fill="#313244" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="400" y="448" fill="#f38ba8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Failure: @LoadBalanced on RestTemplate but no discovery client → "No instances available for order-service"</text>
  <text x="400" y="461" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Debug: actuator/loadbalancer to inspect cached instances and round-robin position.</text>
</svg>
