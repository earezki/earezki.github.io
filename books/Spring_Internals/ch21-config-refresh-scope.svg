<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 530" width="800" height="530">
  <rect width="800" height="530" fill="#1e1e2e" rx="8"/>
  <text x="400" y="35" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Config Server + @RefreshScope Lifecycle</text>

  <!-- Config Server -->
  <rect x="250" y="55" width="300" height="65" rx="6" fill="#2a2a3d" stroke="#89b4fa" stroke-width="2"/>
  <text x="400" y="78" fill="#89b4fa" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Spring Cloud Config Server</text>
  <text x="400" y="95" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Git repo / Vault / JDBC backend</text>
  <text x="400" y="110" fill="#585b70" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Serves: /{application}/{profile}/{label}</text>

  <!-- Two arrows to services -->
  <line x1="330" y1="120" x2="200" y2="160" stroke="#585b70" stroke-width="1"/>
  <line x1="470" y1="120" x2="600" y2="160" stroke="#585b70" stroke-width="1"/>
  <text x="260" y="135" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="8">bootstrap fetch</text>
  <text x="540" y="135" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="8">bootstrap fetch</text>

  <!-- Service A -->
  <rect x="50" y="162" width="300" height="70" rx="6" fill="#2a2a3d" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="200" y="182" fill="#a6e3a1" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">order-service (instance 1)</text>
  <text x="200" y="200" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">@Value("${tenant.max-per-account}")</text>
  <text x="200" y="215" fill="#585b70" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">@RefreshScope on TenantProperties bean</text>

  <!-- Service B -->
  <rect x="450" y="162" width="300" height="70" rx="6" fill="#2a2a3d" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="600" y="182" fill="#a6e3a1" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">order-service (instance 2)</text>
  <text x="600" y="200" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Same config from Config Server</text>
  <text x="600" y="215" fill="#585b70" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">@RefreshScope beans are scoped proxies</text>

  <!-- Config change event -->
  <rect x="250" y="255" width="300" height="30" rx="4" fill="#313244" stroke="#f9e2af" stroke-width="2"/>
  <text x="400" y="275" fill="#f9e2af" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Config change: tenant.max-per-account = 20</text>

  <line x1="400" y1="285" x2="400" y2="305" stroke="#f9e2af" stroke-width="1.5"/>
  <polygon points="396,304 400,312 404,304" fill="#f9e2af"/>

  <!-- Bus or actuator -->
  <rect x="100" y="310" width="600" height="55" rx="6" fill="#2a2a3d" stroke="#89b4fa" stroke-width="2"/>
  <text x="400" y="330" fill="#89b4fa" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Refresh Mechanism</text>
  
  <rect x="120" y="340" width="260" height="20" rx="3" fill="#313244" stroke="#585b70" stroke-width="1"/>
  <text x="250" y="355" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">POST /actuator/refresh (single instance)</text>

  <rect x="420" y="340" width="260" height="20" rx="3" fill="#313244" stroke="#a6e3a1" stroke-width="1"/>
  <text x="550" y="355" fill="#a6e3a1" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Spring Cloud Bus (all instances via MQ)</text>

  <line x1="400" y1="365" x2="400" y2="385" stroke="#585b70" stroke-width="1.5"/>
  <polygon points="396,384 400,392 404,384" fill="#585b70"/>

  <!-- RefreshScope internals -->
  <rect x="80" y="390" width="640" height="80" rx="6" fill="#2a2a3d" stroke="#a6e3a1" stroke-width="2"/>
  <text x="400" y="410" fill="#a6e3a1" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">RefreshScope.refreshAll()</text>

  <text x="100" y="430" fill="#f9e2af" font-family="monospace" font-size="10">1.</text>
  <text x="120" y="430" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="10">Environment re-reads PropertySources from Config Server</text>

  <text x="100" y="448" fill="#f9e2af" font-family="monospace" font-size="10">2.</text>
  <text x="120" y="448" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="10">GenericScope.destroy() clears cached beans in BeanLifecycleWrapperCache</text>

  <text x="100" y="466" fill="#f9e2af" font-family="monospace" font-size="10">3.</text>
  <text x="120" y="466" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="10">Next access to @RefreshScope proxy → re-creates bean with new property values</text>

  <!-- Warning -->
  <rect x="50" y="485" width="700" height="30" rx="4" fill="#313244" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="400" y="505" fill="#f38ba8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">@RefreshScope is a scoped proxy. Without it, @Value is bound once at startup and never updates.</text>
</svg>
