<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#1e1e2e" rx="8"/>
  <text x="400" y="35" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">ApplicationEvent System Internals</text>

  <!-- Publisher -->
  <rect x="250" y="55" width="300" height="40" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <text x="400" y="72" fill="#89b4fa" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">OrderService</text>
  <text x="400" y="88" fill="#a6adc8" font-family="monospace" font-size="9" text-anchor="middle">eventPublisher.publishEvent(new OrderCreatedEvent(order))</text>

  <line x1="400" y1="95" x2="400" y2="115" stroke="#585b70" stroke-width="1.5"/>
  <polygon points="396,114 400,122 404,114" fill="#585b70"/>

  <!-- ApplicationEventMulticaster -->
  <rect x="100" y="120" width="600" height="60" rx="6" fill="#2a2a3d" stroke="#89b4fa" stroke-width="2"/>
  <text x="400" y="142" fill="#89b4fa" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">SimpleApplicationEventMulticaster</text>
  <text x="400" y="160" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Iterates all registered ApplicationListeners. Checks event type via ResolvableType.</text>
  <text x="400" y="173" fill="#585b70" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Default: synchronous (same thread as publisher). Set taskExecutor for async.</text>

  <!-- Fan out -->
  <line x1="250" y1="180" x2="130" y2="215" stroke="#585b70" stroke-width="1"/>
  <line x1="400" y1="180" x2="400" y2="215" stroke="#585b70" stroke-width="1"/>
  <line x1="550" y1="180" x2="670" y2="215" stroke="#585b70" stroke-width="1"/>

  <!-- Listener 1: @EventListener -->
  <rect x="30" y="218" width="230" height="85" rx="6" fill="#2a2a3d" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="145" y="238" fill="#a6e3a1" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">@EventListener</text>
  <text x="145" y="258" fill="#cdd6f4" font-family="monospace" font-size="9" text-anchor="middle">AuditService.onOrderCreated</text>
  <text x="145" y="275" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">Synchronous. Runs in publisher's</text>
  <text x="145" y="288" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">thread and transaction.</text>
  <text x="145" y="300" fill="#585b70" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">ApplicationListenerMethodAdapter proxy</text>

  <!-- Listener 2: @TransactionalEventListener -->
  <rect x="285" y="218" width="230" height="85" rx="6" fill="#2a2a3d" stroke="#f9e2af" stroke-width="2"/>
  <text x="400" y="238" fill="#f9e2af" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">@TransactionalEventListener</text>
  <text x="400" y="258" fill="#cdd6f4" font-family="monospace" font-size="9" text-anchor="middle">NotificationService.onCommit</text>
  <text x="400" y="275" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">Phase: AFTER_COMMIT (default)</text>
  <text x="400" y="288" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">Deferred via TransactionSynchronization.</text>
  <text x="400" y="300" fill="#f38ba8" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">No active TX in listener!</text>

  <!-- Listener 3: @Async -->
  <rect x="540" y="218" width="230" height="85" rx="6" fill="#2a2a3d" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="655" y="238" fill="#89b4fa" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">@Async @EventListener</text>
  <text x="655" y="258" fill="#cdd6f4" font-family="monospace" font-size="9" text-anchor="middle">SearchIndexService.index</text>
  <text x="655" y="275" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">Runs on taskExecutor thread.</text>
  <text x="655" y="288" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">Separate thread, no TX context.</text>
  <text x="655" y="300" fill="#585b70" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">Requires @EnableAsync</text>

  <!-- Execution flow -->
  <rect x="50" y="320" width="700" height="75" rx="6" fill="#313244" stroke="#f9e2af" stroke-width="1.5"/>
  <text x="400" y="340" fill="#f9e2af" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Execution Timeline (synchronous default)</text>

  <rect x="70" y="350" width="140" height="20" rx="3" fill="#a6e3a1" opacity="0.3" stroke="#a6e3a1" stroke-width="1"/>
  <text x="140" y="365" fill="#a6e3a1" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">publishEvent()</text>

  <rect x="215" y="350" width="140" height="20" rx="3" fill="#a6e3a1" opacity="0.3" stroke="#a6e3a1" stroke-width="1"/>
  <text x="285" y="365" fill="#a6e3a1" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">@EventListener</text>

  <rect x="360" y="350" width="100" height="20" rx="3" fill="#89b4fa" opacity="0.3" stroke="#89b4fa" stroke-width="1"/>
  <text x="410" y="365" fill="#89b4fa" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">TX commit</text>

  <rect x="465" y="350" width="140" height="20" rx="3" fill="#f9e2af" opacity="0.3" stroke="#f9e2af" stroke-width="1"/>
  <text x="535" y="365" fill="#f9e2af" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">@TxEventListener</text>

  <rect x="215" y="375" width="100" height="15" rx="2" fill="#89b4fa" opacity="0.2" stroke="#89b4fa" stroke-width="1"/>
  <text x="265" y="387" fill="#89b4fa" font-family="system-ui, sans-serif" font-size="7" text-anchor="middle">async thread</text>

  <!-- Bottom warnings -->
  <rect x="50" y="410" width="700" height="70" rx="6" fill="#313244" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="400" y="430" fill="#f38ba8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Common Failures</text>
  <text x="70" y="448" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="10">1. @TransactionalEventListener silently swallowed when no active transaction (fallbackExecution=false default)</text>
  <text x="70" y="464" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="10">2. Synchronous @EventListener exception bubbles up and rolls back publisher's transaction</text>
  <text x="70" y="478" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="10">3. @Async listener on @EventListener needs @EnableAsync — without it, runs synchronously (silent)</text>
</svg>
