<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520">
  <rect width="800" height="520" fill="#1e1e2e" rx="8"/>
  <text x="400" y="35" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">@ConfigurationProperties Binding Pipeline</text>

  <!-- Source layer -->
  <text x="400" y="65" fill="#89b4fa" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Property Sources (ordered by priority)</text>
  
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="140" height="30" rx="4" fill="#313244" stroke="#f38ba8" stroke-width="1"/>
    <text x="70" y="20" fill="#f38ba8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Command-line args</text>

    <rect x="150" y="0" width="140" height="30" rx="4" fill="#313244" stroke="#f9e2af" stroke-width="1"/>
    <text x="220" y="20" fill="#f9e2af" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Env variables</text>

    <rect x="300" y="0" width="140" height="30" rx="4" fill="#313244" stroke="#a6e3a1" stroke-width="1"/>
    <text x="370" y="20" fill="#a6e3a1" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">application.yml</text>

    <rect x="450" y="0" width="140" height="30" rx="4" fill="#313244" stroke="#89b4fa" stroke-width="1"/>
    <text x="520" y="20" fill="#89b4fa" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">@PropertySource</text>

    <rect x="600" y="0" width="100" height="30" rx="4" fill="#313244" stroke="#585b70" stroke-width="1"/>
    <text x="650" y="20" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Defaults</text>
  </g>

  <!-- Arrow down -->
  <line x1="400" y1="120" x2="400" y2="145" stroke="#585b70" stroke-width="1.5"/>
  <polygon points="396,144 400,152 404,144" fill="#585b70"/>

  <!-- Binder -->
  <rect x="150" y="150" width="500" height="45" rx="6" fill="#2a2a3d" stroke="#89b4fa" stroke-width="2"/>
  <text x="400" y="172" fill="#89b4fa" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Binder</text>
  <text x="400" y="189" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">ConfigurationPropertiesBindingPostProcessor triggers binding at BPP phase</text>

  <line x1="400" y1="195" x2="400" y2="215" stroke="#585b70" stroke-width="1.5"/>
  <polygon points="396,214 400,222 404,214" fill="#585b70"/>

  <!-- Relaxed binding -->
  <rect x="100" y="220" width="600" height="80" rx="6" fill="#2a2a3d" stroke="#f9e2af" stroke-width="1.5"/>
  <text x="400" y="242" fill="#f9e2af" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Relaxed Binding Rules</text>
  
  <text x="120" y="265" fill="#cdd6f4" font-family="monospace" font-size="10">tenant.max-tenants-per-account</text>
  <text x="370" y="265" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="10">→ kebab-case (canonical form)</text>
  
  <text x="120" y="282" fill="#cdd6f4" font-family="monospace" font-size="10">TENANT_MAXTENANTSPERACCOUNT</text>
  <text x="370" y="282" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="10">→ env variable (remove separators, uppercase)</text>
  
  <text x="120" y="295" fill="#cdd6f4" font-family="monospace" font-size="10">tenant.maxTenantsPerAccount</text>
  <text x="370" y="295" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="10">→ camelCase (Java fields)</text>

  <line x1="400" y1="300" x2="400" y2="320" stroke="#585b70" stroke-width="1.5"/>
  <polygon points="396,319 400,327 404,319" fill="#585b70"/>

  <!-- Target bean -->
  <rect x="120" y="325" width="560" height="100" rx="6" fill="#2a2a3d" stroke="#a6e3a1" stroke-width="2"/>
  <text x="400" y="347" fill="#a6e3a1" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">@ConfigurationProperties(prefix = "tenant")</text>
  
  <text x="140" y="370" fill="#cdd6f4" font-family="monospace" font-size="10">public class TenantProperties {</text>
  <text x="160" y="387" fill="#89b4fa" font-family="monospace" font-size="10">private int maxTenantsPerAccount = 5;</text>
  <text x="160" y="404" fill="#89b4fa" font-family="monospace" font-size="10">private Duration sessionTimeout = Duration.ofMinutes(30);</text>
  <text x="160" y="418" fill="#89b4fa" font-family="monospace" font-size="10">private List&lt;String&gt; allowedDomains = List.of();</text>

  <!-- Validation note -->
  <rect x="50" y="440" width="700" height="55" rx="6" fill="#313244" stroke="#f38ba8" stroke-width="1"/>
  <text x="400" y="460" fill="#f38ba8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">@Validated + JSR-380 constraints are evaluated AFTER binding</text>
  <text x="400" y="478" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">BindValidationException at startup if constraints fail — no silent misconfiguration</text>
  <text x="400" y="492" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Use constructor binding (record classes) for immutable properties — bound once, fail-fast</text>
</svg>
