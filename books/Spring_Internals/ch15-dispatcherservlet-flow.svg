<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#1e1e2e" rx="8"/>
  <text x="400" y="35" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">DispatcherServlet Request Processing Flow</text>

  <!-- Request -->
  <rect x="300" y="55" width="200" height="30" rx="4" fill="#45475a" stroke="#cdd6f4" stroke-width="1"/>
  <text x="400" y="75" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">HTTP Request</text>

  <line x1="400" y1="85" x2="400" y2="100" stroke="#585b70" stroke-width="1.5"/>
  <polygon points="396,99 400,107 404,99" fill="#585b70"/>

  <!-- DispatcherServlet -->
  <rect x="50" y="105" width="700" height="440" rx="8" fill="#2a2a3d" stroke="#89b4fa" stroke-width="2"/>
  <text x="400" y="128" fill="#89b4fa" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">DispatcherServlet.doDispatch(request, response)</text>

  <!-- Step 1: HandlerMapping -->
  <rect x="80" y="140" width="640" height="50" rx="6" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="95" y="158" fill="#f9e2af" font-family="monospace" font-size="11" font-weight="bold">1</text>
  <text x="115" y="158" fill="#a6e3a1" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">HandlerMapping.getHandler(request)</text>
  <text x="115" y="178" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="9">RequestMappingHandlerMapping matches @RequestMapping. Returns HandlerExecutionChain (handler + interceptors).</text>

  <line x1="400" y1="190" x2="400" y2="203" stroke="#585b70" stroke-width="1"/>

  <!-- Step 2: HandlerAdapter -->
  <rect x="80" y="205" width="640" height="50" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="95" y="223" fill="#f9e2af" font-family="monospace" font-size="11" font-weight="bold">2</text>
  <text x="115" y="223" fill="#89b4fa" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">HandlerAdapter.supports(handler)</text>
  <text x="115" y="243" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="9">RequestMappingHandlerAdapter handles @Controller methods. Resolves @RequestBody, @PathVariable, etc.</text>

  <line x1="400" y1="255" x2="400" y2="268" stroke="#585b70" stroke-width="1"/>

  <!-- Step 3: Interceptors preHandle -->
  <rect x="80" y="270" width="640" height="35" rx="6" fill="#313244" stroke="#f9e2af" stroke-width="1"/>
  <text x="95" y="292" fill="#f9e2af" font-family="monospace" font-size="11" font-weight="bold">3</text>
  <text x="115" y="292" fill="#f9e2af" font-family="system-ui, sans-serif" font-size="11">HandlerInterceptor.preHandle() — each interceptor in order. Short-circuits on false.</text>

  <line x1="400" y1="305" x2="400" y2="318" stroke="#585b70" stroke-width="1"/>

  <!-- Step 4: Handler execution -->
  <rect x="80" y="320" width="640" height="50" rx="6" fill="#313244" stroke="#cdd6f4" stroke-width="2"/>
  <text x="95" y="338" fill="#f9e2af" font-family="monospace" font-size="11" font-weight="bold">4</text>
  <text x="115" y="338" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">handler.invoke() → ModelAndView</text>
  <text x="115" y="358" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="9">InvocableHandlerMethod resolves args via ArgumentResolvers, invokes @Controller method, wraps return with ReturnValueHandlers.</text>

  <line x1="400" y1="370" x2="400" y2="383" stroke="#585b70" stroke-width="1"/>

  <!-- Step 5: Interceptors postHandle -->
  <rect x="80" y="385" width="640" height="35" rx="6" fill="#313244" stroke="#f9e2af" stroke-width="1"/>
  <text x="95" y="407" fill="#f9e2af" font-family="monospace" font-size="11" font-weight="bold">5</text>
  <text x="115" y="407" fill="#f9e2af" font-family="system-ui, sans-serif" font-size="11">HandlerInterceptor.postHandle() — reverse order. Can modify ModelAndView.</text>

  <line x1="400" y1="420" x2="400" y2="433" stroke="#585b70" stroke-width="1"/>

  <!-- Step 6: View resolution / Message converter -->
  <rect x="80" y="435" width="640" height="50" rx="6" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="95" y="453" fill="#f9e2af" font-family="monospace" font-size="11" font-weight="bold">6</text>
  <text x="115" y="453" fill="#a6e3a1" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">HttpMessageConverter.write() or ViewResolver.resolve()</text>
  <text x="115" y="473" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="9">@ResponseBody → MappingJackson2HttpMessageConverter serializes to JSON. No view resolution needed.</text>

  <!-- Step 7: afterCompletion -->
  <rect x="80" y="495" width="640" height="35" rx="6" fill="#313244" stroke="#585b70" stroke-width="1"/>
  <text x="95" y="517" fill="#f9e2af" font-family="monospace" font-size="11" font-weight="bold">7</text>
  <text x="115" y="517" fill="#585b70" font-family="system-ui, sans-serif" font-size="11">HandlerInterceptor.afterCompletion() — always runs (even on exception). Cleanup.</text>

  <!-- Bottom -->
  <rect x="50" y="555" width="700" height="30" rx="4" fill="#313244" stroke="#f9e2af" stroke-width="1"/>
  <text x="400" y="575" fill="#f9e2af" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">One DispatcherServlet, multiple strategies. The doDispatch() template method orchestrates everything.</text>
</svg>
