<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <rect width="800" height="480" fill="#1e1e2e" rx="8"/>
  <text x="400" y="35" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Method Security: Proxy-Based Authorization</text>

  <!-- Controller call -->
  <rect x="280" y="55" width="240" height="30" rx="4" fill="#45475a" stroke="#cdd6f4" stroke-width="1"/>
  <text x="400" y="75" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Controller.handle(request)</text>

  <line x1="400" y1="85" x2="400" y2="105" stroke="#585b70" stroke-width="1.5"/>
  <polygon points="396,104 400,112 404,104" fill="#585b70"/>

  <!-- Proxy -->
  <rect x="80" y="110" width="640" height="280" rx="8" fill="#2a2a3d" stroke="#89b4fa" stroke-width="2"/>
  <text x="400" y="132" fill="#89b4fa" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">OrderService$$SpringCGLIB$$0 (Proxy)</text>

  <!-- PreAuthorize interceptor -->
  <rect x="110" y="145" width="580" height="65" rx="6" fill="#313244" stroke="#f38ba8" stroke-width="2"/>
  <text x="400" y="165" fill="#f38ba8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">AuthorizationManagerBeforeMethodInterceptor (@PreAuthorize)</text>
  
  <text x="130" y="185" fill="#cdd6f4" font-family="monospace" font-size="10">@PreAuthorize("hasRole('ADMIN') and #tenantId == authentication.principal.tenantId")</text>
  <text x="130" y="200" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="9">SpEL evaluated against SecurityContext. Throws AccessDeniedException if false.</text>

  <line x1="400" y1="210" x2="400" y2="228" stroke="#a6e3a1" stroke-width="1.5"/>
  <polygon points="396,227 400,235 404,227" fill="#a6e3a1"/>
  <text x="415" y="223" fill="#a6e3a1" font-family="system-ui, sans-serif" font-size="9">authorized ✓</text>

  <!-- Actual method -->
  <rect x="150" y="235" width="500" height="40" rx="4" fill="#45475a" stroke="#cdd6f4" stroke-width="1.5"/>
  <text x="400" y="255" fill="#cdd6f4" font-family="monospace" font-size="11" text-anchor="middle">deleteOrder(tenantId, orderId)</text>
  <text x="400" y="270" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Business logic executes. Returns result.</text>

  <line x1="400" y1="275" x2="400" y2="293" stroke="#585b70" stroke-width="1.5"/>
  <polygon points="396,292 400,300 404,292" fill="#585b70"/>

  <!-- PostAuthorize interceptor -->
  <rect x="110" y="298" width="580" height="55" rx="6" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="400" y="318" fill="#a6e3a1" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">AuthorizationManagerAfterMethodInterceptor (@PostAuthorize)</text>
  <text x="130" y="340" fill="#cdd6f4" font-family="monospace" font-size="10">@PostAuthorize("returnObject.tenantId == authentication.principal.tenantId")</text>

  <!-- Result -->
  <line x1="400" y1="360" x2="400" y2="380" stroke="#585b70" stroke-width="1.5"/>

  <!-- PostFilter -->
  <rect x="110" y="355" width="580" height="28" rx="4" fill="#313244" stroke="#585b70" stroke-width="1"/>
  <text x="400" y="374" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">@PostFilter("filterObject.tenantId == authentication.principal.tenantId") — filters collections</text>

  <!-- Key points -->
  <rect x="50" y="405" width="700" height="55" rx="6" fill="#313244" stroke="#f9e2af" stroke-width="1"/>
  <text x="400" y="425" fill="#f9e2af" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">All method security annotations are proxy-based (CH8). Self-invocation bypasses them.</text>
  <text x="400" y="443" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">@PreAuthorize ≠ filter-level security. It's AOP advice on the service bean's proxy.</text>
  <text x="400" y="455" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Enabled by @EnableMethodSecurity → registers MethodSecurityAdvisor → creates proxy via AbstractAutoProxyCreator</text>
</svg>
