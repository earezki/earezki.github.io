<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="800" height="650">
  <rect width="800" height="650" fill="#1e1e2e" rx="8"/>
  <text x="400" y="35" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Auto-Configuration Condition Evaluation</text>

  <!-- Entry point -->
  <rect x="250" y="55" width="300" height="40" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <text x="400" y="80" fill="#89b4fa" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">@EnableAutoConfiguration</text>

  <line x1="400" y1="95" x2="400" y2="115" stroke="#585b70" stroke-width="1.5"/>
  <polygon points="396,114 400,122 404,114" fill="#585b70"/>

  <!-- AutoConfigurationImportSelector -->
  <rect x="200" y="125" width="400" height="45" rx="6" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
  <text x="400" y="145" fill="#a6e3a1" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">AutoConfigurationImportSelector</text>
  <text x="400" y="162" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Reads META-INF/spring/...AutoConfiguration.imports</text>

  <line x1="400" y1="170" x2="400" y2="195" stroke="#585b70" stroke-width="1.5"/>
  <polygon points="396,194 400,202 404,194" fill="#585b70"/>

  <!-- Phase 1: PARSE_CONFIGURATION -->
  <rect x="100" y="205" width="600" height="140" rx="8" fill="#2a2a3d" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="400" y="228" fill="#89b4fa" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Phase 1: PARSE_CONFIGURATION</text>
  <text x="400" y="245" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Evaluated BEFORE bean definitions are loaded</text>

  <!-- @ConditionalOnClass -->
  <rect x="130" y="260" width="250" height="35" rx="4" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="255" y="282" fill="#a6e3a1" font-family="monospace" font-size="11" text-anchor="middle">@ConditionalOnClass</text>

  <rect x="420" y="260" width="250" height="35" rx="4" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="545" y="282" fill="#a6e3a1" font-family="monospace" font-size="11" text-anchor="middle">@ConditionalOnProperty</text>

  <text x="400" y="315" fill="#f9e2af" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Uses ASM ClassReader (no class loading). Checks classpath without initializing classes.</text>
  <text x="400" y="330" fill="#f9e2af" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">If condition fails → entire @Configuration class is skipped</text>

  <!-- Arrow between phases -->
  <line x1="400" y1="345" x2="400" y2="375" stroke="#585b70" stroke-width="1.5"/>
  <polygon points="396,374 400,382 404,374" fill="#585b70"/>
  <text x="415" y="365" fill="#a6e3a1" font-family="system-ui, sans-serif" font-size="10">pass</text>

  <!-- Phase 2: REGISTER_BEAN -->
  <rect x="100" y="385" width="600" height="140" rx="8" fill="#2a2a3d" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="400" y="408" fill="#f38ba8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Phase 2: REGISTER_BEAN</text>
  <text x="400" y="425" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Evaluated AFTER bean definitions are registered (on individual @Bean methods)</text>

  <!-- @ConditionalOnBean -->
  <rect x="130" y="440" width="250" height="35" rx="4" fill="#313244" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="255" y="462" fill="#f38ba8" font-family="monospace" font-size="11" text-anchor="middle">@ConditionalOnBean</text>

  <rect x="420" y="440" width="250" height="35" rx="4" fill="#313244" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="545" y="462" fill="#f38ba8" font-family="monospace" font-size="11" text-anchor="middle">@ConditionalOnMissingBean</text>

  <text x="400" y="500" fill="#f9e2af" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Searches existing BeanDefinition registry. Order-dependent: depends on which beans</text>
  <text x="400" y="514" fill="#f9e2af" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">are already registered. @AutoConfigureBefore/@AutoConfigureAfter control order.</text>

  <!-- Result -->
  <line x1="400" y1="525" x2="400" y2="555" stroke="#585b70" stroke-width="1.5"/>
  <polygon points="396,554 400,562 404,554" fill="#585b70"/>

  <rect x="200" y="565" width="400" height="40" rx="6" fill="#313244" stroke="#cdd6f4" stroke-width="2"/>
  <text x="400" y="590" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Bean Registered (or Skipped)</text>

  <!-- Debugging note -->
  <rect x="100" y="615" width="600" height="25" rx="4" fill="#2a2a3d" stroke="#f9e2af" stroke-width="1"/>
  <text x="400" y="632" fill="#f9e2af" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Debug: --debug flag or /actuator/conditions shows full ConditionEvaluationReport</text>
</svg>
