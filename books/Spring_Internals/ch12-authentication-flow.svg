<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" width="800" height="580">
  <rect width="800" height="580" fill="#1e1e2e" rx="8"/>
  <text x="400" y="35" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Authentication Flow: ProviderManager Chain</text>

  <!-- Request -->
  <rect x="300" y="55" width="200" height="30" rx="4" fill="#45475a" stroke="#cdd6f4" stroke-width="1"/>
  <text x="400" y="75" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">HTTP Request (credentials)</text>

  <line x1="400" y1="85" x2="400" y2="105" stroke="#585b70" stroke-width="1.5"/>
  <polygon points="396,104 400,112 404,104" fill="#585b70"/>

  <!-- AuthenticationFilter -->
  <rect x="200" y="108" width="400" height="40" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="400" y="125" fill="#89b4fa" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">UsernamePasswordAuthenticationFilter</text>
  <text x="400" y="142" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Creates UsernamePasswordAuthenticationToken (unauthenticated)</text>

  <line x1="400" y1="148" x2="400" y2="168" stroke="#585b70" stroke-width="1.5"/>
  <polygon points="396,167 400,175 404,167" fill="#585b70"/>
  <text x="415" y="162" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="8">authenticate()</text>

  <!-- ProviderManager -->
  <rect x="100" y="172" width="600" height="200" rx="8" fill="#2a2a3d" stroke="#89b4fa" stroke-width="2"/>
  <text x="400" y="195" fill="#89b4fa" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">ProviderManager (AuthenticationManager)</text>

  <!-- Provider 1 -->
  <rect x="130" y="210" width="240" height="65" rx="4" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="250" y="230" fill="#a6e3a1" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">DaoAuthenticationProvider</text>
  <text x="250" y="247" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">supports(UsernamePassword...) → true</text>
  <text x="250" y="262" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">UserDetailsService → PasswordEncoder</text>

  <!-- Provider 2 -->
  <rect x="430" y="210" width="240" height="65" rx="4" fill="#313244" stroke="#585b70" stroke-width="1"/>
  <text x="550" y="230" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">JwtAuthenticationProvider</text>
  <text x="550" y="247" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">supports(BearerToken...) → true</text>
  <text x="550" y="262" fill="#585b70" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Skipped for this token type</text>

  <!-- Iteration logic -->
  <text x="400" y="300" fill="#f9e2af" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Iterates providers. First provider.supports(token) == true → delegate. Stop on success.</text>
  <text x="400" y="318" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">If all providers reject → check parent ProviderManager. If none → ProviderNotFoundException.</text>

  <!-- Parent chain -->
  <rect x="250" y="340" width="300" height="25" rx="4" fill="#313244" stroke="#585b70" stroke-width="1"/>
  <text x="400" y="357" fill="#585b70" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">parent: ProviderManager (optional chain)</text>

  <!-- Success path -->
  <line x1="400" y1="375" x2="400" y2="400" stroke="#a6e3a1" stroke-width="1.5"/>
  <polygon points="396,399 400,407 404,399" fill="#a6e3a1"/>

  <!-- Authenticated token -->
  <rect x="150" y="405" width="500" height="45" rx="6" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
  <text x="400" y="425" fill="#a6e3a1" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">UsernamePasswordAuthenticationToken (authenticated=true)</text>
  <text x="400" y="442" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Principal: UserDetails | Authorities: [ROLE_ADMIN, ROLE_USER]</text>

  <line x1="400" y1="450" x2="400" y2="470" stroke="#a6e3a1" stroke-width="1.5"/>
  <polygon points="396,469 400,477 404,469" fill="#a6e3a1"/>

  <!-- SecurityContextHolder -->
  <rect x="200" y="475" width="400" height="35" rx="6" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="400" y="497" fill="#a6e3a1" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">SecurityContextHolder.getContext().setAuthentication(token)</text>

  <!-- Event note -->
  <rect x="50" y="525" width="700" height="35" rx="4" fill="#2a2a3d" stroke="#f9e2af" stroke-width="1"/>
  <text x="400" y="543" fill="#f9e2af" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Publishes AuthenticationSuccessEvent (or AuthenticationFailureBadCredentialsEvent on failure).</text>
  <text x="400" y="556" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">ProviderManager erases credentials from token after successful authentication (security hygiene).</text>
</svg>
