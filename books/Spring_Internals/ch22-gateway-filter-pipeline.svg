<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#1e1e2e" rx="8"/>
  <text x="400" y="35" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Spring Cloud Gateway Filter Pipeline</text>

  <!-- Client -->
  <rect x="50" y="60" width="130" height="30" rx="4" fill="#45475a" stroke="#cdd6f4" stroke-width="1"/>
  <text x="115" y="80" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Client Request</text>

  <line x1="180" y1="75" x2="220" y2="75" stroke="#585b70" stroke-width="1.5"/>
  <polygon points="219,71 227,75 219,79" fill="#585b70"/>

  <!-- Gateway -->
  <rect x="225" y="50" width="540" height="400" rx="8" fill="#2a2a3d" stroke="#89b4fa" stroke-width="2"/>
  <text x="495" y="72" fill="#89b4fa" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Spring Cloud Gateway (WebFlux-based)</text>

  <!-- Route predicate -->
  <rect x="250" y="85" width="490" height="40" rx="4" fill="#313244" stroke="#f9e2af" stroke-width="1.5"/>
  <text x="495" y="103" fill="#f9e2af" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">RoutePredicateHandlerMapping</text>
  <text x="495" y="119" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Path=/api/orders/** → route to "order-service" | Path=/api/users/** → route to "user-service"</text>

  <line x1="495" y1="125" x2="495" y2="140" stroke="#585b70" stroke-width="1"/>

  <!-- Global filters -->
  <text x="495" y="155" fill="#89b4fa" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Filter Chain (ordered by @Order)</text>

  <rect x="260" y="165" width="480" height="28" rx="3" fill="#313244" stroke="#a6e3a1" stroke-width="1"/>
  <text x="275" y="183" fill="#f9e2af" font-family="monospace" font-size="9">-2</text>
  <text x="300" y="183" fill="#a6e3a1" font-family="system-ui, sans-serif" font-size="10">RemoveCachedBodyFilter (global)</text>

  <rect x="260" y="198" width="480" height="28" rx="3" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="275" y="216" fill="#f9e2af" font-family="monospace" font-size="9"> 0</text>
  <text x="300" y="216" fill="#89b4fa" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">AddRequestHeader: X-Tenant-Id (route-specific)</text>

  <rect x="260" y="231" width="480" height="28" rx="3" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="275" y="249" fill="#f9e2af" font-family="monospace" font-size="9"> 1</text>
  <text x="300" y="249" fill="#89b4fa" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">CircuitBreaker: Resilience4j (route-specific)</text>

  <rect x="260" y="264" width="480" height="28" rx="3" fill="#313244" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="275" y="282" fill="#f9e2af" font-family="monospace" font-size="9"> 2</text>
  <text x="300" y="282" fill="#f38ba8" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">RequestRateLimiter: Redis-based (route-specific)</text>

  <rect x="260" y="297" width="480" height="28" rx="3" fill="#313244" stroke="#585b70" stroke-width="1"/>
  <text x="275" y="315" fill="#f9e2af" font-family="monospace" font-size="9"> 5</text>
  <text x="300" y="315" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="10">ReactiveLoadBalancerClientHttpConnectorFactory</text>

  <rect x="260" y="330" width="480" height="28" rx="3" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="275" y="348" fill="#f9e2af" font-family="monospace" font-size="9">10</text>
  <text x="300" y="348" fill="#a6e3a1" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">NettyRoutingFilter — makes actual downstream call</text>

  <rect x="260" y="363" width="480" height="28" rx="3" fill="#313244" stroke="#585b70" stroke-width="1"/>
  <text x="275" y="381" fill="#f9e2af" font-family="monospace" font-size="9">11</text>
  <text x="300" y="381" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="10">ForwardRoutingFilter (for local forward: routes)</text>

  <!-- Modify response on return -->
  <rect x="260" y="396" width="480" height="28" rx="3" fill="#313244" stroke="#f9e2af" stroke-width="1.5"/>
  <text x="275" y="414" fill="#f9e2af" font-family="monospace" font-size="9">←</text>
  <text x="300" y="414" fill="#f9e2af" font-family="system-ui, sans-serif" font-size="10">ModifyResponseBody: strip internal headers (post-filter on return)</text>

  <!-- Downstream -->
  <line x1="495" y1="450" x2="495" y2="470" stroke="#a6e3a1" stroke-width="1.5"/>
  <polygon points="491,469 495,477 499,469" fill="#a6e3a1"/>

  <rect x="350" y="460" width="290" height="25" rx="4" fill="#45475a" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="495" y="478" fill="#a6e3a1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Downstream: order-service:8080/api/orders</text>
</svg>
