<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="800" height="550">
  <rect width="800" height="550" fill="#1e1e2e" rx="8"/>
  <text x="400" y="35" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">AOP Advice Chain / Interceptor Stack</text>

  <!-- Caller -->
  <rect x="300" y="55" width="200" height="35" rx="6" fill="#45475a" stroke="#cdd6f4" stroke-width="1.5"/>
  <text x="400" y="77" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">caller.createOrder(req)</text>

  <line x1="400" y1="90" x2="400" y2="110" stroke="#585b70" stroke-width="1.5"/>
  <polygon points="396,109 400,117 404,109" fill="#585b70"/>

  <!-- Proxy wrapper -->
  <rect x="50" y="120" width="700" height="360" rx="10" fill="#2a2a3d" stroke="#89b4fa" stroke-width="2"/>
  <text x="400" y="142" fill="#89b4fa" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">OrderService$$SpringCGLIB$$0 (Proxy)</text>

  <!-- Interceptor 1: Security -->
  <rect x="80" y="155" width="640" height="55" rx="6" fill="#313244" stroke="#f38ba8" stroke-width="2"/>
  <text x="100" y="175" fill="#f38ba8" font-family="monospace" font-size="11" font-weight="bold">@Order(1)</text>
  <text x="240" y="175" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="12">AuthorizationManagerBeforeMethodInterceptor</text>
  <text x="100" y="198" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="10">Evaluates @PreAuthorize("hasRole('ADMIN')"). Throws AccessDeniedException if denied.</text>

  <line x1="400" y1="210" x2="400" y2="225" stroke="#585b70" stroke-width="1"/>
  <text x="415" y="220" fill="#a6e3a1" font-family="system-ui, sans-serif" font-size="9">proceed()</text>

  <!-- Interceptor 2: Audit -->
  <rect x="110" y="230" width="580" height="55" rx="6" fill="#313244" stroke="#f9e2af" stroke-width="2"/>
  <text x="130" y="250" fill="#f9e2af" font-family="monospace" font-size="11" font-weight="bold">@Order(2)</text>
  <text x="240" y="250" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="12">AuditAspect (@Around)</text>
  <text x="130" y="273" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="10">Logs method entry, calls proceed(), logs method exit with timing.</text>

  <line x1="400" y1="285" x2="400" y2="300" stroke="#585b70" stroke-width="1"/>
  <text x="415" y="295" fill="#a6e3a1" font-family="system-ui, sans-serif" font-size="9">proceed()</text>

  <!-- Interceptor 3: Transaction -->
  <rect x="140" y="305" width="520" height="55" rx="6" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
  <text x="160" y="325" fill="#a6e3a1" font-family="monospace" font-size="11" font-weight="bold">@Order(3)</text>
  <text x="270" y="325" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="12">TransactionInterceptor</text>
  <text x="160" y="348" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="10">Begins transaction, calls proceed(), commits or rolls back.</text>

  <line x1="400" y1="360" x2="400" y2="375" stroke="#585b70" stroke-width="1"/>
  <text x="415" y="370" fill="#a6e3a1" font-family="system-ui, sans-serif" font-size="9">proceed()</text>

  <!-- Actual method -->
  <rect x="170" y="380" width="460" height="45" rx="6" fill="#45475a" stroke="#cdd6f4" stroke-width="2"/>
  <text x="400" y="400" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">OrderService.createOrder(req)</text>
  <text x="400" y="418" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Actual business logic executes here</text>

  <!-- Return path -->
  <rect x="170" y="440" width="460" height="25" rx="4" fill="#2a2a3d" stroke="#585b70" stroke-width="1"/>
  <text x="400" y="457" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Return value propagates back through chain: Transaction commit → Audit log → Security check done</text>

  <!-- Ordering note -->
  <rect x="50" y="495" width="700" height="40" rx="6" fill="#2a2a3d" stroke="#f9e2af" stroke-width="1"/>
  <text x="400" y="515" fill="#f9e2af" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Lower @Order = higher priority = outermost wrapper. Security (1) wraps Audit (2) wraps Transaction (3).</text>
  <text x="400" y="530" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">One proxy, multiple interceptors. ReflectiveMethodInvocation.proceed() drives the chain.</text>
</svg>
