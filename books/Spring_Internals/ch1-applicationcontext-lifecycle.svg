<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="800" height="900">
  <rect width="800" height="900" fill="#1e1e2e" rx="8"/>
  <text x="400" y="40" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">ApplicationContext Refresh Lifecycle</text>

  <!-- Phase boxes -->
  <g transform="translate(50, 70)">
    <!-- Step 1 -->
    <rect x="0" y="0" width="700" height="45" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
    <text x="20" y="28" fill="#89b4fa" font-family="monospace" font-size="13" font-weight="bold">1</text>
    <text x="50" y="22" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="13">prepareRefresh()</text>
    <text x="50" y="38" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="11">Set active flag, validate required properties</text>

    <!-- Step 2 -->
    <rect x="0" y="55" width="700" height="45" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
    <text x="20" y="83" fill="#89b4fa" font-family="monospace" font-size="13" font-weight="bold">2</text>
    <text x="50" y="77" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="13">obtainFreshBeanFactory()</text>
    <text x="50" y="93" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="11">Load bean definitions from annotations, XML, imports</text>

    <!-- Step 3 -->
    <rect x="0" y="110" width="700" height="45" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
    <text x="20" y="138" fill="#89b4fa" font-family="monospace" font-size="13" font-weight="bold">3</text>
    <text x="50" y="132" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="13">prepareBeanFactory(beanFactory)</text>
    <text x="50" y="148" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="11">Register environment, systemProperties, systemEnvironment beans</text>

    <!-- Step 4 -->
    <rect x="0" y="165" width="700" height="45" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
    <text x="20" y="193" fill="#89b4fa" font-family="monospace" font-size="13" font-weight="bold">4</text>
    <text x="50" y="187" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="13">postProcessBeanFactory(beanFactory)</text>
    <text x="50" y="203" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="11">Subclass hook: web contexts register request/session scopes</text>

    <!-- Step 5 - highlighted -->
    <rect x="0" y="220" width="700" height="55" rx="6" fill="#2a2a3d" stroke="#a6e3a1" stroke-width="2.5"/>
    <text x="20" y="250" fill="#a6e3a1" font-family="monospace" font-size="13" font-weight="bold">5</text>
    <text x="50" y="242" fill="#a6e3a1" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">invokeBeanFactoryPostProcessors(beanFactory)</text>
    <text x="50" y="260" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="11">BeanDefinitionRegistryPostProcessor → BeanFactoryPostProcessor</text>
    <text x="50" y="272" fill="#f9e2af" font-family="system-ui, sans-serif" font-size="10">ConfigurationClassPostProcessor runs here</text>

    <!-- Step 6 - highlighted -->
    <rect x="0" y="285" width="700" height="55" rx="6" fill="#2a2a3d" stroke="#a6e3a1" stroke-width="2.5"/>
    <text x="20" y="315" fill="#a6e3a1" font-family="monospace" font-size="13" font-weight="bold">6</text>
    <text x="50" y="307" fill="#a6e3a1" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">registerBeanPostProcessors(beanFactory)</text>
    <text x="50" y="325" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="11">Register BPPs (not invoked yet): AutowiredAnnotationBPP, AbstractAutoProxyCreator</text>
    <text x="50" y="337" fill="#f9e2af" font-family="system-ui, sans-serif" font-size="10">BPPs registered in PriorityOrdered → Ordered → unordered sequence</text>

    <!-- Steps 7-8 -->
    <rect x="0" y="350" width="340" height="40" rx="6" fill="#313244" stroke="#585b70" stroke-width="1"/>
    <text x="20" y="375" fill="#585b70" font-family="monospace" font-size="12" font-weight="bold">7</text>
    <text x="40" y="375" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="12">initMessageSource()</text>

    <rect x="360" y="350" width="340" height="40" rx="6" fill="#313244" stroke="#585b70" stroke-width="1"/>
    <text x="380" y="375" fill="#585b70" font-family="monospace" font-size="12" font-weight="bold">8</text>
    <text x="400" y="375" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="12">initApplicationEventMulticaster()</text>

    <!-- Step 9 -->
    <rect x="0" y="400" width="700" height="45" rx="6" fill="#313244" stroke="#f38ba8" stroke-width="1.5"/>
    <text x="20" y="428" fill="#f38ba8" font-family="monospace" font-size="13" font-weight="bold">9</text>
    <text x="50" y="422" fill="#f38ba8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">onRefresh()</text>
    <text x="50" y="438" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="11">Embedded web server created and started (Tomcat/Netty/Jetty)</text>

    <!-- Step 10 -->
    <rect x="0" y="455" width="700" height="40" rx="6" fill="#313244" stroke="#585b70" stroke-width="1"/>
    <text x="20" y="480" fill="#585b70" font-family="monospace" font-size="12" font-weight="bold">10</text>
    <text x="45" y="480" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="12">registerListeners() — Register ApplicationListener beans with multicaster</text>

    <!-- Step 11 - highlighted -->
    <rect x="0" y="505" width="700" height="75" rx="6" fill="#2a2a3d" stroke="#f38ba8" stroke-width="2.5"/>
    <text x="20" y="535" fill="#f38ba8" font-family="monospace" font-size="13" font-weight="bold">11</text>
    <text x="50" y="527" fill="#f38ba8" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">finishBeanFactoryInitialization(beanFactory)</text>
    <text x="50" y="545" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="11">Instantiate all non-lazy singletons. BeanPostProcessors fire on each bean.</text>
    <text x="50" y="560" fill="#f9e2af" font-family="system-ui, sans-serif" font-size="10">@PostConstruct fires here per bean. SmartInitializingSingleton fires after ALL beans.</text>
    <text x="50" y="575" fill="#f9e2af" font-family="system-ui, sans-serif" font-size="10">AOP proxies created here by AbstractAutoProxyCreator</text>

    <!-- Step 12 -->
    <rect x="0" y="590" width="700" height="45" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
    <text x="20" y="618" fill="#89b4fa" font-family="monospace" font-size="13" font-weight="bold">12</text>
    <text x="50" y="612" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="13">finishRefresh()</text>
    <text x="50" y="628" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="11">Publish ContextRefreshedEvent. Start lifecycle processors.</text>

    <!-- Post-refresh events -->
    <line x1="350" y1="645" x2="350" y2="665" stroke="#585b70" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="350" y="680" fill="#585b70" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">— refresh() returns —</text>

    <rect x="0" y="695" width="700" height="40" rx="6" fill="#1e1e2e" stroke="#89b4fa" stroke-width="1" stroke-dasharray="6,3"/>
    <text x="50" y="720" fill="#89b4fa" font-family="system-ui, sans-serif" font-size="12">ApplicationStartedEvent → ApplicationRunner / CommandLineRunner → ApplicationReadyEvent</text>
  </g>

  <!-- Legend -->
  <g transform="translate(50, 825)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#2a2a3d" stroke="#a6e3a1" stroke-width="2"/>
    <text x="22" y="12" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="11">Bean definition processing</text>
    <rect x="230" y="0" width="14" height="14" rx="3" fill="#2a2a3d" stroke="#f38ba8" stroke-width="2"/>
    <text x="252" y="12" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="11">Bean instance creation</text>
    <rect x="440" y="0" width="14" height="14" rx="3" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
    <text x="462" y="12" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="11">Infrastructure setup</text>
  </g>
</svg>
