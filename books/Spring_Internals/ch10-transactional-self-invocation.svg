<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#1e1e2e" rx="8"/>
  <text x="400" y="35" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">@Transactional Self-Invocation Problem</text>

  <!-- Left: BROKEN -->
  <g transform="translate(30, 60)">
    <rect x="0" y="0" width="350" height="30" rx="4" fill="#313244" stroke="#f38ba8" stroke-width="2"/>
    <text x="175" y="21" fill="#f38ba8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">// BROKEN: Self-Invocation</text>

    <!-- Caller -->
    <rect x="100" y="45" width="150" height="30" rx="4" fill="#45475a" stroke="#cdd6f4" stroke-width="1"/>
    <text x="175" y="65" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Controller</text>

    <line x1="175" y1="75" x2="175" y2="95" stroke="#a6e3a1" stroke-width="1.5"/>
    <polygon points="171,94 175,102 179,94" fill="#a6e3a1"/>
    <text x="185" y="90" fill="#a6e3a1" font-family="system-ui, sans-serif" font-size="9">via proxy ✓</text>

    <!-- Proxy -->
    <rect x="20" y="105" width="310" height="55" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
    <text x="175" y="125" fill="#89b4fa" font-family="monospace" font-size="10" text-anchor="middle">OrderService$$SpringCGLIB$$0</text>
    <text x="175" y="145" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">TransactionInterceptor: BEGIN TX</text>

    <line x1="175" y1="160" x2="175" y2="180" stroke="#585b70" stroke-width="1.5"/>
    <polygon points="171,179 175,187 179,179" fill="#585b70"/>

    <!-- Target: processOrder -->
    <rect x="20" y="190" width="310" height="45" rx="6" fill="#45475a" stroke="#cdd6f4" stroke-width="1"/>
    <text x="175" y="210" fill="#cdd6f4" font-family="monospace" font-size="11" text-anchor="middle">processOrder()</text>
    <text x="175" y="228" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">@Transactional(REQUIRED)</text>

    <!-- Self-invocation -->
    <line x1="175" y1="235" x2="175" y2="260" stroke="#f38ba8" stroke-width="2"/>
    <polygon points="171,259 175,267 179,259" fill="#f38ba8"/>
    <text x="185" y="252" fill="#f38ba8" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">this.validate() ✗</text>

    <!-- Target: validatePayment -->
    <rect x="20" y="270" width="310" height="55" rx="6" fill="#45475a" stroke="#f38ba8" stroke-width="2"/>
    <text x="175" y="290" fill="#cdd6f4" font-family="monospace" font-size="11" text-anchor="middle">validatePayment()</text>
    <text x="175" y="310" fill="#f38ba8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">@Transactional(REQUIRES_NEW) ← IGNORED</text>
    <text x="175" y="322" fill="#f38ba8" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">No new transaction created!</text>

    <!-- Explanation -->
    <rect x="0" y="345" width="350" height="55" rx="4" fill="#2a2a3d" stroke="#f38ba8" stroke-width="1"/>
    <text x="175" y="365" fill="#f38ba8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">this refers to the target object,</text>
    <text x="175" y="380" fill="#f38ba8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">not the proxy. The call bypasses</text>
    <text x="175" y="395" fill="#f38ba8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">TransactionInterceptor entirely.</text>
  </g>

  <!-- Right: CORRECT -->
  <g transform="translate(420, 60)">
    <rect x="0" y="0" width="350" height="30" rx="4" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
    <text x="175" y="21" fill="#a6e3a1" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">// CORRECT: Separate Bean</text>

    <!-- Caller -->
    <rect x="100" y="45" width="150" height="30" rx="4" fill="#45475a" stroke="#cdd6f4" stroke-width="1"/>
    <text x="175" y="65" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Controller</text>

    <line x1="175" y1="75" x2="175" y2="95" stroke="#a6e3a1" stroke-width="1.5"/>
    <polygon points="171,94 175,102 179,94" fill="#a6e3a1"/>
    <text x="185" y="90" fill="#a6e3a1" font-family="system-ui, sans-serif" font-size="9">via proxy ✓</text>

    <!-- Proxy 1 -->
    <rect x="20" y="105" width="310" height="55" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
    <text x="175" y="125" fill="#89b4fa" font-family="monospace" font-size="10" text-anchor="middle">OrderService$$SpringCGLIB$$0</text>
    <text x="175" y="145" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">TransactionInterceptor: BEGIN TX (REQUIRED)</text>

    <line x1="175" y1="160" x2="175" y2="180" stroke="#585b70" stroke-width="1.5"/>
    <polygon points="171,179 175,187 179,179" fill="#585b70"/>

    <!-- Target: processOrder -->
    <rect x="20" y="190" width="310" height="35" rx="6" fill="#45475a" stroke="#cdd6f4" stroke-width="1"/>
    <text x="175" y="212" fill="#cdd6f4" font-family="monospace" font-size="11" text-anchor="middle">processOrder()</text>

    <!-- Cross-bean call -->
    <line x1="175" y1="225" x2="175" y2="250" stroke="#a6e3a1" stroke-width="2"/>
    <polygon points="171,249 175,257 179,249" fill="#a6e3a1"/>
    <text x="185" y="242" fill="#a6e3a1" font-family="system-ui, sans-serif" font-size="9" font-weight="bold">via proxy ✓</text>

    <!-- Proxy 2 -->
    <rect x="20" y="260" width="310" height="55" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
    <text x="175" y="280" fill="#89b4fa" font-family="monospace" font-size="10" text-anchor="middle">PaymentValidationService$$CGLIB$$</text>
    <text x="175" y="300" fill="#a6e3a1" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">TransactionInterceptor: BEGIN TX (REQUIRES_NEW) ✓</text>

    <line x1="175" y1="315" x2="175" y2="330" stroke="#585b70" stroke-width="1"/>
    <polygon points="171,329 175,337 179,329" fill="#585b70"/>

    <!-- Target: validate -->
    <rect x="20" y="340" width="310" height="35" rx="6" fill="#45475a" stroke="#a6e3a1" stroke-width="1.5"/>
    <text x="175" y="362" fill="#a6e3a1" font-family="monospace" font-size="11" text-anchor="middle">validatePayment() — New TX ✓</text>

    <!-- Explanation -->
    <rect x="0" y="395" width="350" height="40" rx="4" fill="#2a2a3d" stroke="#a6e3a1" stroke-width="1"/>
    <text x="175" y="412" fill="#a6e3a1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Cross-bean call goes through the proxy.</text>
    <text x="175" y="428" fill="#a6e3a1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">TransactionInterceptor creates new TX.</text>
  </g>

  <!-- Bottom note -->
  <rect x="50" y="480" width="700" height="50" rx="6" fill="#2a2a3d" stroke="#f9e2af" stroke-width="1.5"/>
  <text x="400" y="500" fill="#f9e2af" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">This same problem affects @Cacheable, @Async, @PreAuthorize, and any proxy-based feature.</text>
  <text x="400" y="518" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">The rule: if the feature is proxy-based (CH8), internal this.method() calls bypass it.</text>

  <!-- Detection tip -->
  <rect x="50" y="540" width="700" height="25" rx="4" fill="#313244" stroke="#a6e3a1" stroke-width="1"/>
  <text x="400" y="557" fill="#a6e3a1" font-family="monospace" font-size="10" text-anchor="middle">Detect: enable SQL logging (spring.jpa.show-sql=true) and verify transaction boundaries</text>
</svg>
