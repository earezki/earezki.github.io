<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" width="800" height="700">
  <rect width="800" height="700" fill="#1e1e2e" rx="8"/>
  <text x="400" y="35" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">SecurityFilterChain Request Flow</text>

  <!-- HTTP Request -->
  <rect x="300" y="55" width="200" height="35" rx="6" fill="#45475a" stroke="#cdd6f4" stroke-width="1.5"/>
  <text x="400" y="77" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">HTTP Request</text>

  <line x1="400" y1="90" x2="400" y2="110" stroke="#585b70" stroke-width="1.5"/>
  <polygon points="396,109 400,117 404,109" fill="#585b70"/>

  <!-- Servlet Container -->
  <rect x="250" y="115" width="300" height="35" rx="4" fill="#313244" stroke="#585b70" stroke-width="1"/>
  <text x="400" y="137" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Servlet Container (Tomcat)</text>

  <line x1="400" y1="150" x2="400" y2="165" stroke="#585b70" stroke-width="1.5"/>
  <polygon points="396,164 400,172 404,164" fill="#585b70"/>

  <!-- DelegatingFilterProxy -->
  <rect x="200" y="170" width="400" height="40" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="400" y="188" fill="#89b4fa" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">DelegatingFilterProxy</text>
  <text x="400" y="204" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Delegates to Spring bean "springSecurityFilterChain"</text>

  <line x1="400" y1="210" x2="400" y2="225" stroke="#585b70" stroke-width="1.5"/>
  <polygon points="396,224 400,232 404,224" fill="#585b70"/>

  <!-- FilterChainProxy -->
  <rect x="150" y="230" width="500" height="40" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <text x="400" y="248" fill="#89b4fa" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">FilterChainProxy</text>
  <text x="400" y="264" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Matches request to SecurityFilterChain by SecurityMatcher, first match wins</text>

  <!-- Two chains -->
  <line x1="300" y1="270" x2="200" y2="295" stroke="#585b70" stroke-width="1"/>
  <line x1="500" y1="270" x2="600" y2="295" stroke="#585b70" stroke-width="1"/>

  <!-- Chain 1: API -->
  <g transform="translate(30, 300)">
    <rect x="0" y="0" width="350" height="30" rx="4" fill="#2a2a3d" stroke="#a6e3a1" stroke-width="1.5"/>
    <text x="175" y="20" fill="#a6e3a1" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">SecurityFilterChain: /api/** (JWT)</text>

    <rect x="10" y="40" width="330" height="28" rx="3" fill="#313244" stroke="#585b70" stroke-width="1"/>
    <text x="25" y="58" fill="#f9e2af" font-family="monospace" font-size="9">1.</text>
    <text x="40" y="58" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="10">SecurityContextHolderFilter</text>

    <rect x="10" y="73" width="330" height="28" rx="3" fill="#313244" stroke="#585b70" stroke-width="1"/>
    <text x="25" y="91" fill="#f9e2af" font-family="monospace" font-size="9">2.</text>
    <text x="40" y="91" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="10">HeaderWriterFilter</text>

    <rect x="10" y="106" width="330" height="28" rx="3" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
    <text x="25" y="124" fill="#f9e2af" font-family="monospace" font-size="9">3.</text>
    <text x="40" y="124" fill="#89b4fa" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">BearerTokenAuthenticationFilter</text>

    <rect x="10" y="139" width="330" height="28" rx="3" fill="#313244" stroke="#585b70" stroke-width="1"/>
    <text x="25" y="157" fill="#f9e2af" font-family="monospace" font-size="9">4.</text>
    <text x="40" y="157" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="10">RequestCacheAwareFilter</text>

    <rect x="10" y="172" width="330" height="28" rx="3" fill="#313244" stroke="#f38ba8" stroke-width="1.5"/>
    <text x="25" y="190" fill="#f9e2af" font-family="monospace" font-size="9">5.</text>
    <text x="40" y="190" fill="#f38ba8" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">ExceptionTranslationFilter</text>

    <rect x="10" y="205" width="330" height="28" rx="3" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
    <text x="25" y="223" fill="#f9e2af" font-family="monospace" font-size="9">6.</text>
    <text x="40" y="223" fill="#a6e3a1" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">AuthorizationFilter</text>
  </g>

  <!-- Chain 2: Admin -->
  <g transform="translate(420, 300)">
    <rect x="0" y="0" width="350" height="30" rx="4" fill="#2a2a3d" stroke="#f38ba8" stroke-width="1.5"/>
    <text x="175" y="20" fill="#f38ba8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">SecurityFilterChain: /admin/** (Form)</text>

    <rect x="10" y="40" width="330" height="28" rx="3" fill="#313244" stroke="#585b70" stroke-width="1"/>
    <text x="25" y="58" fill="#f9e2af" font-family="monospace" font-size="9">1.</text>
    <text x="40" y="58" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="10">SecurityContextHolderFilter</text>

    <rect x="10" y="73" width="330" height="28" rx="3" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
    <text x="25" y="91" fill="#f9e2af" font-family="monospace" font-size="9">2.</text>
    <text x="40" y="91" fill="#89b4fa" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">CsrfFilter</text>

    <rect x="10" y="106" width="330" height="28" rx="3" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
    <text x="25" y="124" fill="#f9e2af" font-family="monospace" font-size="9">3.</text>
    <text x="40" y="124" fill="#89b4fa" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">UsernamePasswordAuthenticationFilter</text>

    <rect x="10" y="139" width="330" height="28" rx="3" fill="#313244" stroke="#585b70" stroke-width="1"/>
    <text x="25" y="157" fill="#f9e2af" font-family="monospace" font-size="9">4.</text>
    <text x="40" y="157" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="10">DefaultLoginPageGeneratingFilter</text>

    <rect x="10" y="172" width="330" height="28" rx="3" fill="#313244" stroke="#f38ba8" stroke-width="1.5"/>
    <text x="25" y="190" fill="#f9e2af" font-family="monospace" font-size="9">5.</text>
    <text x="40" y="190" fill="#f38ba8" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">ExceptionTranslationFilter</text>

    <rect x="10" y="205" width="330" height="28" rx="3" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
    <text x="25" y="223" fill="#f9e2af" font-family="monospace" font-size="9">6.</text>
    <text x="40" y="223" fill="#a6e3a1" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">AuthorizationFilter</text>
  </g>

  <!-- Legend -->
  <g transform="translate(50, 560)">
    <rect x="0" y="0" width="700" height="25" rx="4" fill="#313244" stroke="#f9e2af" stroke-width="1"/>
    <text x="350" y="17" fill="#f9e2af" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Inspect filter chain: /actuator/mappings or programmatically via SecurityFilterChain.getFilters()</text>
  </g>

  <!-- Note about ordering -->
  <rect x="50" y="600" width="700" height="45" rx="6" fill="#2a2a3d" stroke="#89b4fa" stroke-width="1"/>
  <text x="400" y="618" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Use @Order on SecurityFilterChain beans. Lower number = checked first.</text>
  <text x="400" y="636" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">API chain (@Order(1)) must be more specific than admin chain (@Order(2)).</text>
</svg>
