<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <rect width="800" height="480" fill="#1e1e2e" rx="8"/>
  <text x="400" y="35" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">@SpringBootTest Context Caching</text>

  <!-- Test classes -->
  <g transform="translate(30, 55)">
    <text x="120" y="15" fill="#f9e2af" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Test Classes</text>

    <rect x="0" y="25" width="240" height="50" rx="4" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
    <text x="120" y="45" fill="#a6e3a1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">OrderServiceTest</text>
    <text x="120" y="62" fill="#a6adc8" font-family="monospace" font-size="8" text-anchor="middle">@SpringBootTest</text>
    <text x="120" y="72" fill="#585b70" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">key: {classes, properties, contextCustomizer}</text>

    <rect x="0" y="85" width="240" height="50" rx="4" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
    <text x="120" y="105" fill="#a6e3a1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">PaymentServiceTest</text>
    <text x="120" y="122" fill="#a6adc8" font-family="monospace" font-size="8" text-anchor="middle">@SpringBootTest (same config)</text>
    <text x="120" y="132" fill="#585b70" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">Same key → reuses context ✓</text>

    <rect x="0" y="145" width="240" height="50" rx="4" fill="#313244" stroke="#f38ba8" stroke-width="1.5"/>
    <text x="120" y="165" fill="#f38ba8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">TenantServiceTest</text>
    <text x="120" y="182" fill="#a6adc8" font-family="monospace" font-size="8" text-anchor="middle">@MockBean(OrderRepository.class)</text>
    <text x="120" y="192" fill="#f38ba8" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">Different key → new context ✗</text>

    <rect x="0" y="205" width="240" height="50" rx="4" fill="#313244" stroke="#f38ba8" stroke-width="1.5"/>
    <text x="120" y="225" fill="#f38ba8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">NotificationTest</text>
    <text x="120" y="242" fill="#a6adc8" font-family="monospace" font-size="8" text-anchor="middle">@TestPropertySource(properties="...")</text>
    <text x="120" y="252" fill="#f38ba8" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">Different key → new context ✗</text>
  </g>

  <!-- Arrow -->
  <line x1="280" y1="180" x2="340" y2="180" stroke="#585b70" stroke-width="1.5"/>
  <polygon points="339,176 347,180 339,184" fill="#585b70"/>

  <!-- Context Cache -->
  <rect x="345" y="55" width="420" height="310" rx="8" fill="#2a2a3d" stroke="#89b4fa" stroke-width="2"/>
  <text x="555" y="78" fill="#89b4fa" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">DefaultContextCache (static, shared)</text>
  <text x="555" y="95" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">MergedContextConfiguration → ApplicationContext</text>

  <!-- Cache entries -->
  <rect x="365" y="110" width="380" height="55" rx="4" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="555" y="130" fill="#a6e3a1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Context #1 (shared by 2 tests)</text>
  <text x="555" y="147" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">key={SpringBootApp.class, no mocks, default props}</text>
  <text x="555" y="160" fill="#585b70" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Started once, reused. Startup: 3.2s saved.</text>

  <rect x="365" y="175" width="380" height="55" rx="4" fill="#313244" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="555" y="195" fill="#f38ba8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Context #2 (TenantServiceTest only)</text>
  <text x="555" y="212" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">key={SpringBootApp.class, @MockBean(OrderRepository)}</text>
  <text x="555" y="225" fill="#f38ba8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">@MockBean changes context definition → cache miss</text>

  <rect x="365" y="240" width="380" height="55" rx="4" fill="#313244" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="555" y="260" fill="#f38ba8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Context #3 (NotificationTest only)</text>
  <text x="555" y="277" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">key={SpringBootApp.class, props=["x=y"]}</text>
  <text x="555" y="290" fill="#f38ba8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Different properties → different key → cache miss</text>

  <!-- Stats -->
  <rect x="365" y="305" width="380" height="40" rx="4" fill="#313244" stroke="#f9e2af" stroke-width="1"/>
  <text x="555" y="322" fill="#f9e2af" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">4 test classes, 3 contexts loaded (not 4)</text>
  <text x="555" y="338" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Max cached: spring.test.context.cache.maxSize=32 (default)</text>

  <!-- Bottom advice -->
  <rect x="50" y="380" width="700" height="80" rx="6" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
  <text x="400" y="400" fill="#a6e3a1" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Rules for Maximizing Cache Hits</text>
  <text x="70" y="420" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="10">1. Avoid @MockBean — use @TestConfiguration or constructor injection with test doubles instead</text>
  <text x="70" y="436" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="10">2. Share @TestPropertySource values across test classes that can use the same properties</text>
  <text x="70" y="452" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="10">3. Use @DirtiesContext only when absolutely necessary — it evicts the cached context</text>
</svg>
