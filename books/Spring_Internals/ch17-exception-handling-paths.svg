<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <rect width="800" height="480" fill="#1e1e2e" rx="8"/>
  <text x="400" y="35" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Exception Handling Paths: MVC vs WebFlux</text>

  <!-- MVC side -->
  <rect x="30" y="55" width="360" height="380" rx="8" fill="#2a2a3d" stroke="#89b4fa" stroke-width="2"/>
  <text x="210" y="78" fill="#89b4fa" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Spring MVC</text>

  <rect x="50" y="90" width="320" height="30" rx="4" fill="#313244" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="210" y="110" fill="#f38ba8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Controller throws OrderNotFoundException</text>

  <line x1="210" y1="120" x2="210" y2="138" stroke="#585b70" stroke-width="1"/>

  <rect x="50" y="140" width="320" height="45" rx="4" fill="#313244" stroke="#89b4fa" stroke-width="1"/>
  <text x="210" y="157" fill="#89b4fa" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">HandlerExceptionResolverComposite</text>
  <text x="210" y="175" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Iterates resolvers in order. First match wins.</text>

  <!-- Three resolvers -->
  <line x1="210" y1="185" x2="210" y2="198" stroke="#585b70" stroke-width="1"/>

  <rect x="50" y="200" width="320" height="28" rx="3" fill="#313244" stroke="#a6e3a1" stroke-width="1"/>
  <text x="65" y="218" fill="#f9e2af" font-family="monospace" font-size="9">1.</text>
  <text x="80" y="218" fill="#a6e3a1" font-family="system-ui, sans-serif" font-size="10">ExceptionHandlerExceptionResolver</text>

  <rect x="50" y="233" width="320" height="28" rx="3" fill="#313244" stroke="#585b70" stroke-width="1"/>
  <text x="65" y="251" fill="#f9e2af" font-family="monospace" font-size="9">2.</text>
  <text x="80" y="251" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="10">ResponseStatusExceptionResolver</text>

  <rect x="50" y="266" width="320" height="28" rx="3" fill="#313244" stroke="#585b70" stroke-width="1"/>
  <text x="65" y="284" fill="#f9e2af" font-family="monospace" font-size="9">3.</text>
  <text x="80" y="284" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="10">DefaultHandlerExceptionResolver</text>

  <line x1="210" y1="294" x2="210" y2="310" stroke="#a6e3a1" stroke-width="1.5"/>
  <polygon points="206,309 210,317 214,309" fill="#a6e3a1"/>

  <!-- @ControllerAdvice -->
  <rect x="50" y="315" width="320" height="55" rx="4" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
  <text x="210" y="333" fill="#a6e3a1" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">@ControllerAdvice + @ExceptionHandler</text>
  <text x="70" y="352" fill="#cdd6f4" font-family="monospace" font-size="9">@ExceptionHandler(OrderNotFoundException.class)</text>
  <text x="70" y="365" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="9">→ ResponseEntity(ProblemDetail, 404)</text>

  <rect x="50" y="380" width="320" height="30" rx="4" fill="#313244" stroke="#f9e2af" stroke-width="1"/>
  <text x="210" y="400" fill="#f9e2af" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Matched by most specific exception type in hierarchy</text>

  <!-- WebFlux side -->
  <rect x="410" y="55" width="360" height="380" rx="8" fill="#2a2a3d" stroke="#f38ba8" stroke-width="2"/>
  <text x="590" y="78" fill="#f38ba8" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Spring WebFlux</text>

  <rect x="430" y="90" width="320" height="30" rx="4" fill="#313244" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="590" y="110" fill="#f38ba8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Mono.error(new OrderNotFoundException())</text>

  <line x1="590" y1="120" x2="590" y2="138" stroke="#585b70" stroke-width="1"/>

  <rect x="430" y="140" width="320" height="45" rx="4" fill="#313244" stroke="#89b4fa" stroke-width="1"/>
  <text x="590" y="157" fill="#89b4fa" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">WebExceptionHandler chain</text>
  <text x="590" y="175" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Ordered list. Each handler can resolve or propagate.</text>

  <line x1="590" y1="185" x2="590" y2="198" stroke="#585b70" stroke-width="1"/>

  <rect x="430" y="200" width="320" height="28" rx="3" fill="#313244" stroke="#a6e3a1" stroke-width="1"/>
  <text x="445" y="218" fill="#f9e2af" font-family="monospace" font-size="9">1.</text>
  <text x="460" y="218" fill="#a6e3a1" font-family="system-ui, sans-serif" font-size="10">DefaultErrorWebExceptionHandler</text>

  <rect x="430" y="233" width="320" height="28" rx="3" fill="#313244" stroke="#585b70" stroke-width="1"/>
  <text x="445" y="251" fill="#f9e2af" font-family="monospace" font-size="9">2.</text>
  <text x="460" y="251" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="10">ResponseStatusExceptionHandler</text>

  <line x1="590" y1="261" x2="590" y2="278" stroke="#a6e3a1" stroke-width="1.5"/>
  <polygon points="586,277 590,285 594,277" fill="#a6e3a1"/>

  <!-- @ControllerAdvice for WebFlux -->
  <rect x="430" y="283" width="320" height="55" rx="4" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
  <text x="590" y="301" fill="#a6e3a1" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">@ControllerAdvice + @ExceptionHandler</text>
  <text x="450" y="320" fill="#cdd6f4" font-family="monospace" font-size="9">Same annotations, different resolver:</text>
  <text x="450" y="333" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="9">ControllerMethodResolver (not ExceptionHandlerER)</text>

  <!-- ResponseStatusException -->
  <rect x="430" y="348" width="320" height="40" rx="4" fill="#313244" stroke="#f9e2af" stroke-width="1.5"/>
  <text x="590" y="363" fill="#f9e2af" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">ResponseStatusException</text>
  <text x="590" y="380" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Preferred in WebFlux — carries status + reason directly</text>

  <rect x="430" y="395" width="320" height="30" rx="4" fill="#313244" stroke="#f9e2af" stroke-width="1"/>
  <text x="590" y="415" fill="#f9e2af" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">RFC 9457 ProblemDetail: Spring 6 default error format</text>

  <!-- Bottom -->
  <rect x="50" y="445" width="700" height="25" rx="4" fill="#313244" stroke="#cdd6f4" stroke-width="1"/>
  <text x="400" y="462" fill="#cdd6f4" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Both stacks: @ControllerAdvice works. Different internal resolution. Test both error paths explicitly.</text>
</svg>
