<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="850" height="420">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="850" height="420" rx="12" fill="#1e1e2e"/>

  <!-- Title -->
  <text x="425" y="35" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#cdd6f4">Clock Skew Between Three Nodes</text>
  <text x="425" y="55" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#585b70">Wall clock timestamps produce incorrect event ordering</text>

  <!-- Timeline axis -->
  <line x1="120" y1="90" x2="800" y2="90" stroke="#585b70" stroke-width="1.5"/>
  <text x="90" y="94" text-anchor="end" font-family="sans-serif" font-size="11" fill="#585b70">Physical time</text>

  <!-- Time ticks -->
  <g font-family="monospace" font-size="9" fill="#585b70">
    <line x1="200" y1="85" x2="200" y2="95" stroke="#585b70" stroke-width="1"/>
    <text x="200" y="108" text-anchor="middle">T+0ms</text>
    <line x1="350" y1="85" x2="350" y2="95" stroke="#585b70" stroke-width="1"/>
    <text x="350" y="108" text-anchor="middle">T+50ms</text>
    <line x1="500" y1="85" x2="500" y2="95" stroke="#585b70" stroke-width="1"/>
    <text x="500" y="108" text-anchor="middle">T+100ms</text>
    <line x1="650" y1="85" x2="650" y2="95" stroke="#585b70" stroke-width="1"/>
    <text x="650" y="108" text-anchor="middle">T+150ms</text>
    <line x1="800" y1="85" x2="800" y2="95" stroke="#585b70" stroke-width="1"/>
    <text x="800" y="108" text-anchor="middle">T+200ms</text>
  </g>

  <!-- Node A: +150ms skew -->
  <g transform="translate(40, 130)">
    <rect x="0" y="0" width="70" height="40" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="2" filter="url(#shadow)"/>
    <text x="35" y="18" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#89b4fa">Node A</text>
    <text x="35" y="34" text-anchor="middle" font-family="monospace" font-size="9" fill="#f38ba8">+150ms</text>

    <!-- Node A's clock line -->
    <line x1="80" y1="20" x2="760" y2="20" stroke="#89b4fa" stroke-width="1.5" stroke-dasharray="4,3"/>

    <!-- Event 1 on Node A at physical T+0, but its clock reads T+150 -->
    <circle cx="160" cy="20" r="12" fill="#89b4fa" opacity="0.3" stroke="#89b4fa" stroke-width="2"/>
    <text x="160" y="24" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#1e1e2e">1</text>
    <text x="160" y="-2" text-anchor="middle" font-family="monospace" font-size="9" fill="#89b4fa">14:22:00.150</text>
  </g>

  <!-- Node B: accurate -->
  <g transform="translate(40, 210)">
    <rect x="0" y="0" width="70" height="40" rx="6" fill="#313244" stroke="#a6e3a1" stroke-width="2" filter="url(#shadow)"/>
    <text x="35" y="18" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#a6e3a1">Node B</text>
    <text x="35" y="34" text-anchor="middle" font-family="monospace" font-size="9" fill="#a6e3a1">accurate</text>

    <!-- Node B's clock line -->
    <line x1="80" y1="20" x2="760" y2="20" stroke="#a6e3a1" stroke-width="1.5" stroke-dasharray="4,3"/>

    <!-- Event 2 on Node B at physical T+50 -->
    <circle cx="310" cy="20" r="12" fill="#a6e3a1" opacity="0.3" stroke="#a6e3a1" stroke-width="2"/>
    <text x="310" y="24" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#1e1e2e">2</text>
    <text x="310" y="-2" text-anchor="middle" font-family="monospace" font-size="9" fill="#a6e3a1">14:22:00.050</text>
  </g>

  <!-- Node C: -80ms skew -->
  <g transform="translate(40, 290)">
    <rect x="0" y="0" width="70" height="40" rx="6" fill="#313244" stroke="#f9e2af" stroke-width="2" filter="url(#shadow)"/>
    <text x="35" y="18" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f9e2af">Node C</text>
    <text x="35" y="34" text-anchor="middle" font-family="monospace" font-size="9" fill="#f38ba8">-80ms</text>

    <!-- Node C's clock line -->
    <line x1="80" y1="20" x2="760" y2="20" stroke="#f9e2af" stroke-width="1.5" stroke-dasharray="4,3"/>

    <!-- Event 3 on Node C at physical T+100, but its clock reads T+20 -->
    <circle cx="460" cy="20" r="12" fill="#f9e2af" opacity="0.3" stroke="#f9e2af" stroke-width="2"/>
    <text x="460" y="24" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#1e1e2e">3</text>
    <text x="460" y="-2" text-anchor="middle" font-family="monospace" font-size="9" fill="#f9e2af">14:22:00.020</text>
  </g>

  <!-- Ordering comparison -->
  <g transform="translate(40, 355)">
    <rect x="0" y="0" width="370" height="50" rx="6" fill="#1e1e2e" stroke="#f38ba8" stroke-width="1.5"/>
    <text x="185" y="18" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f38ba8">Wall Clock Order (WRONG)</text>
    <text x="185" y="38" text-anchor="middle" font-family="monospace" font-size="12" fill="#a6adc8">3 (0.020) → 2 (0.050) → 1 (0.150)</text>
  </g>

  <g transform="translate(440, 355)">
    <rect x="0" y="0" width="370" height="50" rx="6" fill="#1e1e2e" stroke="#a6e3a1" stroke-width="1.5"/>
    <text x="185" y="18" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#a6e3a1">Physical Order (CORRECT)</text>
    <text x="185" y="38" text-anchor="middle" font-family="monospace" font-size="12" fill="#a6adc8">1 (T+0) → 2 (T+50) → 3 (T+100)</text>
  </g>

  <!-- Vertical dashed lines from events to timeline -->
  <line x1="200" y1="95" x2="200" y2="150" stroke="#89b4fa" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <line x1="390" y1="95" x2="390" y2="230" stroke="#a6e3a1" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <line x1="540" y1="95" x2="540" y2="310" stroke="#f9e2af" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
</svg>