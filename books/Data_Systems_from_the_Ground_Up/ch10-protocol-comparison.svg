<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 460" width="850" height="460">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="850" height="460" rx="12" fill="#1e1e2e"/>

  <!-- Title -->
  <text x="425" y="35" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#cdd6f4">Protocol Comparison: JSON/HTTP vs Protobuf/gRPC</text>
  <text x="425" y="55" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#585b70">50-package lookup request + response</text>

  <!-- JSON / HTTP/1.1 side -->
  <g transform="translate(40, 80)">
    <text x="170" y="0" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#f38ba8">JSON over HTTP/1.1</text>

    <!-- Request -->
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="340" height="140" rx="6" fill="#313244" stroke="#f38ba8" stroke-width="2" filter="url(#shadow)"/>
      <text x="170" y="20" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f38ba8">Request</text>

      <!-- HTTP headers -->
      <rect x="10" y="30" width="320" height="40" rx="3" fill="#1e1e2e" stroke="#585b70" stroke-width="1"/>
      <text x="170" y="44" text-anchor="middle" font-family="monospace" font-size="9" fill="#a6adc8">POST /api/v1/packages/lookup HTTP/1.1</text>
      <text x="170" y="58" text-anchor="middle" font-family="monospace" font-size="9" fill="#585b70">Content-Type, Authorization, Accept...</text>
      <text x="320" y="64" text-anchor="end" font-family="sans-serif" font-size="9" font-weight="bold" fill="#f38ba8">~320 bytes</text>

      <!-- JSON body -->
      <rect x="10" y="78" width="320" height="50" rx="3" fill="#1e1e2e" stroke="#585b70" stroke-width="1"/>
      <text x="20" y="94" font-family="monospace" font-size="9" fill="#a6adc8">{"package_ids": ["pkg-001", "pkg-002",</text>
      <text x="20" y="108" font-family="monospace" font-size="9" fill="#a6adc8"> "pkg-003", ... "pkg-050"]}</text>
      <text x="320" y="122" text-anchor="end" font-family="sans-serif" font-size="9" font-weight="bold" fill="#f38ba8">~850 bytes</text>
    </g>

    <!-- Response -->
    <g transform="translate(0, 175)">
      <rect x="0" y="0" width="340" height="110" rx="6" fill="#313244" stroke="#f38ba8" stroke-width="2" filter="url(#shadow)"/>
      <text x="170" y="20" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f38ba8">Response</text>

      <rect x="10" y="30" width="320" height="65" rx="3" fill="#1e1e2e" stroke="#585b70" stroke-width="1"/>
      <text x="20" y="46" font-family="monospace" font-size="9" fill="#a6adc8">{"packages": [{"id": "pkg-001",</text>
      <text x="20" y="60" font-family="monospace" font-size="9" fill="#a6adc8">  "status": "IN_TRANSIT",</text>
      <text x="20" y="74" font-family="monospace" font-size="9" fill="#a6adc8">  "weight_kg": 2.4, ...}, ... ]}</text>
      <text x="320" y="88" text-anchor="end" font-family="sans-serif" font-size="9" font-weight="bold" fill="#f38ba8">~14,000 bytes</text>
    </g>

    <!-- Total -->
    <g transform="translate(0, 300)">
      <rect x="0" y="0" width="340" height="35" rx="6" fill="#f38ba8" opacity="0.15" stroke="#f38ba8" stroke-width="1.5"/>
      <text x="170" y="22" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f38ba8">Total: ~15,170 bytes on wire</text>
    </g>
  </g>

  <!-- Protobuf / gRPC side -->
  <g transform="translate(460, 80)">
    <text x="170" y="0" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#a6e3a1">Protobuf over gRPC (HTTP/2)</text>

    <!-- Request -->
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="340" height="140" rx="6" fill="#313244" stroke="#a6e3a1" stroke-width="2" filter="url(#shadow)"/>
      <text x="170" y="20" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#a6e3a1">Request</text>

      <!-- HTTP/2 frame -->
      <rect x="10" y="30" width="320" height="40" rx="3" fill="#1e1e2e" stroke="#585b70" stroke-width="1"/>
      <text x="170" y="44" text-anchor="middle" font-family="monospace" font-size="9" fill="#a6adc8">HTTP/2 HEADERS frame (HPACK compressed)</text>
      <text x="170" y="58" text-anchor="middle" font-family="monospace" font-size="9" fill="#585b70">:path, content-type, te: trailers</text>
      <text x="320" y="64" text-anchor="end" font-family="sans-serif" font-size="9" font-weight="bold" fill="#a6e3a1">~40 bytes</text>

      <!-- Protobuf body -->
      <rect x="10" y="78" width="320" height="50" rx="3" fill="#1e1e2e" stroke="#585b70" stroke-width="1"/>
      <text x="20" y="94" font-family="monospace" font-size="9" fill="#a6adc8">PackageLookupRequest {</text>
      <text x="20" y="108" font-family="monospace" font-size="9" fill="#a6adc8">  repeated string ids = 1; // varint+bytes</text>
      <text x="320" y="122" text-anchor="end" font-family="sans-serif" font-size="9" font-weight="bold" fill="#a6e3a1">~420 bytes</text>
    </g>

    <!-- Response -->
    <g transform="translate(0, 175)">
      <rect x="0" y="0" width="340" height="110" rx="6" fill="#313244" stroke="#a6e3a1" stroke-width="2" filter="url(#shadow)"/>
      <text x="170" y="20" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#a6e3a1">Response</text>

      <rect x="10" y="30" width="320" height="65" rx="3" fill="#1e1e2e" stroke="#585b70" stroke-width="1"/>
      <text x="20" y="46" font-family="monospace" font-size="9" fill="#a6adc8">PackageLookupResponse {</text>
      <text x="20" y="60" font-family="monospace" font-size="9" fill="#a6adc8">  repeated Package packages = 1;</text>
      <text x="20" y="74" font-family="monospace" font-size="9" fill="#a6adc8">  // varint fields, no key names</text>
      <text x="320" y="88" text-anchor="end" font-family="sans-serif" font-size="9" font-weight="bold" fill="#a6e3a1">~3,200 bytes</text>
    </g>

    <!-- Total -->
    <g transform="translate(0, 300)">
      <rect x="0" y="0" width="340" height="35" rx="6" fill="#a6e3a1" opacity="0.15" stroke="#a6e3a1" stroke-width="1.5"/>
      <text x="170" y="22" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#a6e3a1">Total: ~3,660 bytes on wire</text>
    </g>
  </g>

  <!-- Comparison bar -->
  <g transform="translate(40, 400)">
    <rect x="0" y="0" width="770" height="45" rx="6" fill="#313244" stroke="#585b70" stroke-width="1"/>
    <text x="385" y="18" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#cdd6f4">Reduction: 4.1x fewer bytes on wire</text>
    <text x="385" y="36" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a6adc8">JSON: human-readable keys repeated per object. Protobuf: field numbers (1-2 bytes) + varint encoding. No key names on wire.</text>
  </g>
</svg>