<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 380" width="850" height="380">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#89b4fa"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#a6e3a1"/>
    </marker>
    <marker id="arrowYellow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#f9e2af"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="850" height="380" rx="12" fill="#1e1e2e"/>

  <!-- Title -->
  <text x="425" y="35" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#cdd6f4">Debezium CDC Pipeline</text>

  <!-- PostgreSQL -->
  <g transform="translate(30, 100)">
    <rect x="0" y="0" width="160" height="120" rx="8" fill="#313244" stroke="#89b4fa" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="80" y="25" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#89b4fa">PostgreSQL</text>

    <!-- WAL inside PG -->
    <rect x="15" y="40" width="130" height="35" rx="4" fill="#1e1e2e" stroke="#a6e3a1" stroke-width="1.5"/>
    <text x="80" y="55" text-anchor="middle" font-family="monospace" font-size="10" fill="#a6e3a1">WAL</text>
    <text x="80" y="68" text-anchor="middle" font-family="monospace" font-size="8" fill="#585b70">pg_wal/</text>

    <!-- Replication slot -->
    <rect x="15" y="82" width="130" height="28" rx="4" fill="#1e1e2e" stroke="#f9e2af" stroke-width="1"/>
    <text x="80" y="100" text-anchor="middle" font-family="monospace" font-size="9" fill="#f9e2af">slot: debezium</text>
  </g>

  <!-- Arrow: PG -> Debezium -->
  <line x1="190" y1="160" x2="270" y2="160" stroke="#a6e3a1" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="230" y="148" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#a6e3a1">WAL stream</text>
  <text x="230" y="178" text-anchor="middle" font-family="monospace" font-size="9" fill="#585b70">logical replication</text>

  <!-- Debezium Connector -->
  <g transform="translate(280, 95)">
    <rect x="0" y="0" width="180" height="130" rx="8" fill="#313244" stroke="#a6e3a1" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="90" y="25" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#a6e3a1">Debezium</text>
    <text x="90" y="42" text-anchor="middle" font-family="monospace" font-size="10" fill="#a6adc8">Kafka Connect</text>

    <!-- Processing steps -->
    <text x="15" y="65" font-family="monospace" font-size="9" fill="#a6adc8">1. Read WAL changes</text>
    <text x="15" y="80" font-family="monospace" font-size="9" fill="#a6adc8">2. Decode to JSON</text>
    <text x="15" y="95" font-family="monospace" font-size="9" fill="#a6adc8">3. Add metadata</text>
    <text x="15" y="110" font-family="monospace" font-size="9" fill="#a6adc8">4. Publish to Kafka</text>
    <text x="15" y="123" font-family="monospace" font-size="9" fill="#585b70">5. Commit offset</text>
  </g>

  <!-- Arrow: Debezium -> Kafka -->
  <line x1="460" y1="160" x2="540" y2="160" stroke="#a6e3a1" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="500" y="148" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#a6e3a1">publish</text>

  <!-- Kafka -->
  <g transform="translate(550, 70)">
    <rect x="0" y="0" width="250" height="185" rx="8" fill="#313244" stroke="#f9e2af" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="125" y="25" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f9e2af">Kafka</text>

    <!-- Topic 1 -->
    <g transform="translate(15, 40)">
      <rect x="0" y="0" width="220" height="30" rx="4" fill="#1e1e2e" stroke="#89b4fa" stroke-width="1"/>
      <text x="110" y="13" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#89b4fa">dbserver.public.packages</text>
      <text x="110" y="25" text-anchor="middle" font-family="monospace" font-size="8" fill="#585b70">INSERT, UPDATE, DELETE events</text>
    </g>

    <!-- Topic 2 -->
    <g transform="translate(15, 78)">
      <rect x="0" y="0" width="220" height="30" rx="4" fill="#1e1e2e" stroke="#89b4fa" stroke-width="1"/>
      <text x="110" y="13" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#89b4fa">dbserver.public.orders</text>
      <text x="110" y="25" text-anchor="middle" font-family="monospace" font-size="8" fill="#585b70">INSERT, UPDATE, DELETE events</text>
    </g>

    <!-- Topic 3 -->
    <g transform="translate(15, 116)">
      <rect x="0" y="0" width="220" height="30" rx="4" fill="#1e1e2e" stroke="#89b4fa" stroke-width="1"/>
      <text x="110" y="13" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#89b4fa">dbserver.public.inventory</text>
      <text x="110" y="25" text-anchor="middle" font-family="monospace" font-size="8" fill="#585b70">INSERT, UPDATE, DELETE events</text>
    </g>

    <!-- Key note -->
    <text x="125" y="170" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#585b70">One topic per table. Key = primary key.</text>
  </g>

  <!-- CDC event structure -->
  <g transform="translate(30, 270)">
    <rect x="0" y="0" width="790" height="90" rx="6" fill="#313244" stroke="#585b70" stroke-width="1"/>
    <text x="395" y="20" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#cdd6f4">CDC Event Structure</text>

    <text x="20" y="42" font-family="monospace" font-size="10" fill="#a6adc8">{"op": "u",</text>
    <text x="130" y="42" font-family="monospace" font-size="10" fill="#a6e3a1">"before": {"pkg_id": "001", "status": "SCANNED"},</text>
    <text x="20" y="58" font-family="monospace" font-size="10" fill="#89b4fa"> "after":  {"pkg_id": "001", "status": "IN_TRANSIT"},</text>
    <text x="20" y="74" font-family="monospace" font-size="10" fill="#f9e2af"> "source": {"lsn": 234567, "txId": 105, "table": "packages"}}</text>
    <text x="530" y="42" font-family="sans-serif" font-size="9" fill="#585b70">op: c=create, u=update, d=delete, r=read(snapshot)</text>
    <text x="530" y="58" font-family="sans-serif" font-size="9" fill="#585b70">before/after: row state before and after the change</text>
    <text x="530" y="74" font-family="sans-serif" font-size="9" fill="#585b70">source: WAL position for exactly-once delivery</text>
  </g>
</svg>