<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="850" height="420">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#89b4fa"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#a6e3a1"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#f38ba8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="850" height="420" rx="12" fill="#1e1e2e"/>

  <!-- Title -->
  <text x="425" y="35" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#cdd6f4">WAL Flush Cycle</text>

  <!-- Step 1: Client write -->
  <g transform="translate(40, 70)">
    <rect x="0" y="0" width="120" height="50" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="2" filter="url(#shadow)"/>
    <text x="60" y="22" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#89b4fa">Client</text>
    <text x="60" y="40" text-anchor="middle" font-family="monospace" font-size="11" fill="#a6adc8">INSERT</text>
  </g>

  <!-- Arrow 1: Client to WAL -->
  <line x1="160" y1="95" x2="210" y2="95" stroke="#89b4fa" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="185" y="85" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#a6adc8">1</text>

  <!-- Step 2: WAL Buffer -->
  <g transform="translate(220, 60)">
    <rect x="0" y="0" width="140" height="70" rx="6" fill="#313244" stroke="#a6e3a1" stroke-width="2" filter="url(#shadow)"/>
    <text x="70" y="22" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#a6e3a1">WAL Buffer</text>
    <text x="70" y="42" text-anchor="middle" font-family="monospace" font-size="10" fill="#a6adc8">shared_buffers</text>
    <text x="70" y="58" text-anchor="middle" font-family="monospace" font-size="10" fill="#585b70">(in memory)</text>
  </g>

  <!-- Arrow 2: WAL Buffer to WAL on disk -->
  <line x1="360" y1="95" x2="420" y2="95" stroke="#a6e3a1" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="390" y="85" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#a6adc8">2 fsync</text>

  <!-- Step 3: WAL on Disk -->
  <g transform="translate(430, 60)">
    <rect x="0" y="0" width="150" height="70" rx="6" fill="#313244" stroke="#f9e2af" stroke-width="2" filter="url(#shadow)"/>
    <text x="75" y="22" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f9e2af">WAL on Disk</text>
    <text x="75" y="42" text-anchor="middle" font-family="monospace" font-size="10" fill="#a6adc8">pg_wal/</text>
    <text x="75" y="58" text-anchor="middle" font-family="monospace" font-size="10" fill="#a6e3a1">sequential writes</text>
  </g>

  <!-- Arrow 3: ACK back to client -->
  <line x1="505" y1="60" x2="505" y2="50" stroke="#a6e3a1" stroke-width="1.5"/>
  <line x1="505" y1="50" x2="100" y2="50" stroke="#a6e3a1" stroke-width="1.5"/>
  <line x1="100" y1="50" x2="100" y2="65" stroke="#a6e3a1" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="300" y="45" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#a6e3a1">3 COMMIT ACK (durable)</text>

  <!-- Dirty Pages in Shared Buffers -->
  <g transform="translate(100, 180)">
    <rect x="0" y="0" width="250" height="80" rx="6" fill="#313244" stroke="#f38ba8" stroke-width="2" filter="url(#shadow)"/>
    <text x="125" y="22" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f38ba8">Shared Buffers</text>
    <text x="125" y="42" text-anchor="middle" font-family="monospace" font-size="11" fill="#a6adc8">Dirty pages (modified data)</text>
    <text x="125" y="60" text-anchor="middle" font-family="monospace" font-size="10" fill="#585b70">not yet written to data files</text>

    <!-- Dirty page indicators -->
    <rect x="15" y="66" width="20" height="8" rx="2" fill="#f38ba8" opacity="0.6"/>
    <rect x="40" y="66" width="20" height="8" rx="2" fill="#f38ba8" opacity="0.6"/>
    <rect x="65" y="66" width="20" height="8" rx="2" fill="#f38ba8" opacity="0.6"/>
    <rect x="90" y="66" width="20" height="8" rx="2" fill="#a6e3a1" opacity="0.4"/>
    <rect x="115" y="66" width="20" height="8" rx="2" fill="#f38ba8" opacity="0.6"/>
    <rect x="140" y="66" width="20" height="8" rx="2" fill="#a6e3a1" opacity="0.4"/>
  </g>

  <!-- Arrow from WAL buffer to dirty pages -->
  <line x1="290" y1="130" x2="260" y2="180" stroke="#89b4fa" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="295" y="155" font-family="sans-serif" font-size="10" fill="#585b70">modify in memory</text>

  <!-- CHECKPOINT box -->
  <g transform="translate(430, 180)">
    <rect x="0" y="0" width="180" height="80" rx="6" fill="#313244" stroke="#cba6f7" stroke-width="2" filter="url(#shadow)"/>
    <text x="90" y="22" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#cba6f7">CHECKPOINT</text>
    <text x="90" y="42" text-anchor="middle" font-family="monospace" font-size="10" fill="#a6adc8">Flush dirty pages</text>
    <text x="90" y="58" text-anchor="middle" font-family="monospace" font-size="10" fill="#a6adc8">to data files</text>
    <text x="90" y="74" text-anchor="middle" font-family="monospace" font-size="10" fill="#585b70">(periodic or triggered)</text>
  </g>

  <!-- Arrow from dirty pages to checkpoint -->
  <line x1="350" y1="220" x2="425" y2="220" stroke="#cba6f7" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="388" y="210" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#a6adc8">4</text>

  <!-- Data Files on Disk -->
  <g transform="translate(430, 300)">
    <rect x="0" y="0" width="180" height="60" rx="6" fill="#313244" stroke="#f9e2af" stroke-width="2" filter="url(#shadow)"/>
    <text x="90" y="22" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f9e2af">Data Files</text>
    <text x="90" y="42" text-anchor="middle" font-family="monospace" font-size="10" fill="#a6adc8">base/ (table data, indexes)</text>
    <text x="90" y="56" text-anchor="middle" font-family="monospace" font-size="10" fill="#585b70">random I/O writes</text>
  </g>

  <!-- Arrow from checkpoint to data files -->
  <line x1="520" y1="260" x2="520" y2="295" stroke="#cba6f7" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="540" y="280" font-family="sans-serif" font-size="10" fill="#a6adc8">5 fsync</text>

  <!-- Crash recovery note -->
  <g transform="translate(50, 310)">
    <rect x="0" y="0" width="310" height="70" rx="6" fill="#1e1e2e" stroke="#f38ba8" stroke-width="1.5" stroke-dasharray="6,3"/>
    <text x="155" y="20" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f38ba8">On Crash Recovery</text>
    <text x="155" y="38" text-anchor="middle" font-family="monospace" font-size="10" fill="#a6adc8">Replay WAL from last checkpoint</text>
    <text x="155" y="54" text-anchor="middle" font-family="monospace" font-size="10" fill="#a6adc8">Dirty pages are rebuilt from WAL records</text>
    <text x="155" y="66" text-anchor="middle" font-family="monospace" font-size="10" fill="#a6e3a1">No data loss (WAL was fsync'd)</text>
  </g>

  <!-- Timeline label -->
  <g transform="translate(650, 140)">
    <text x="0" y="0" font-family="sans-serif" font-size="11" fill="#585b70">Write path:</text>
    <text x="0" y="18" font-family="monospace" font-size="10" fill="#89b4fa">1. Buffer WAL</text>
    <text x="0" y="34" font-family="monospace" font-size="10" fill="#a6e3a1">2. fsync WAL</text>
    <text x="0" y="50" font-family="monospace" font-size="10" fill="#a6e3a1">3. ACK client</text>
    <text x="0" y="66" font-family="monospace" font-size="10" fill="#cba6f7">4. Checkpoint</text>
    <text x="0" y="82" font-family="monospace" font-size="10" fill="#cba6f7">5. Flush data</text>
  </g>
</svg>