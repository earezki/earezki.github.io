<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <marker id="arrowDown" markerWidth="8" markerHeight="6" refX="4" refY="6" orient="auto">
      <path d="M0,0 L8,0 L4,6 Z" fill="#89b4fa"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="12" fill="#1e1e2e"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#cdd6f4">B-Tree Structure (Order 3)</text>

  <!-- Root Node -->
  <g transform="translate(300, 60)">
    <rect x="0" y="0" width="200" height="50" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="2" filter="url(#shadow)"/>
    <text x="50" y="20" text-anchor="middle" font-family="monospace" font-size="12" fill="#585b70">ptr</text>
    <line x1="80" y1="0" x2="80" y2="50" stroke="#585b70" stroke-width="1"/>
    <text x="100" y="35" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#89b4fa">42</text>
    <line x1="120" y1="0" x2="120" y2="50" stroke="#585b70" stroke-width="1"/>
    <text x="160" y="20" text-anchor="middle" font-family="monospace" font-size="12" fill="#585b70">ptr</text>
    <text x="100" y="-8" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a6adc8">Root (page 1)</text>
  </g>

  <!-- Lines from root to internal nodes -->
  <line x1="340" y1="110" x2="200" y2="170" stroke="#89b4fa" stroke-width="1.5"/>
  <line x1="460" y1="110" x2="600" y2="170" stroke="#89b4fa" stroke-width="1.5"/>

  <!-- Internal Node Left -->
  <g transform="translate(70, 175)">
    <rect x="0" y="0" width="260" height="50" rx="6" fill="#313244" stroke="#a6e3a1" stroke-width="2" filter="url(#shadow)"/>
    <text x="35" y="20" text-anchor="middle" font-family="monospace" font-size="12" fill="#585b70">ptr</text>
    <line x1="60" y1="0" x2="60" y2="50" stroke="#585b70" stroke-width="1"/>
    <text x="85" y="35" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#a6e3a1">15</text>
    <line x1="110" y1="0" x2="110" y2="50" stroke="#585b70" stroke-width="1"/>
    <text x="140" y="20" text-anchor="middle" font-family="monospace" font-size="12" fill="#585b70">ptr</text>
    <line x1="170" y1="0" x2="170" y2="50" stroke="#585b70" stroke-width="1"/>
    <text x="195" y="35" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#a6e3a1">28</text>
    <line x1="220" y1="0" x2="220" y2="50" stroke="#585b70" stroke-width="1"/>
    <text x="240" y="20" text-anchor="middle" font-family="monospace" font-size="12" fill="#585b70">ptr</text>
    <text x="130" y="-8" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a6adc8">Internal (page 2)</text>
  </g>

  <!-- Internal Node Right -->
  <g transform="translate(470, 175)">
    <rect x="0" y="0" width="260" height="50" rx="6" fill="#313244" stroke="#a6e3a1" stroke-width="2" filter="url(#shadow)"/>
    <text x="35" y="20" text-anchor="middle" font-family="monospace" font-size="12" fill="#585b70">ptr</text>
    <line x1="60" y1="0" x2="60" y2="50" stroke="#585b70" stroke-width="1"/>
    <text x="85" y="35" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#a6e3a1">56</text>
    <line x1="110" y1="0" x2="110" y2="50" stroke="#585b70" stroke-width="1"/>
    <text x="140" y="20" text-anchor="middle" font-family="monospace" font-size="12" fill="#585b70">ptr</text>
    <line x1="170" y1="0" x2="170" y2="50" stroke="#585b70" stroke-width="1"/>
    <text x="195" y="35" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#a6e3a1">78</text>
    <line x1="220" y1="0" x2="220" y2="50" stroke="#585b70" stroke-width="1"/>
    <text x="240" y="20" text-anchor="middle" font-family="monospace" font-size="12" fill="#585b70">ptr</text>
    <text x="130" y="-8" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a6adc8">Internal (page 5)</text>
  </g>

  <!-- Lines from internal to leaf nodes -->
  <line x1="105" y1="225" x2="60" y2="290" stroke="#a6e3a1" stroke-width="1"/>
  <line x1="210" y1="225" x2="200" y2="290" stroke="#a6e3a1" stroke-width="1"/>
  <line x1="290" y1="225" x2="340" y2="290" stroke="#a6e3a1" stroke-width="1"/>
  <line x1="505" y1="225" x2="480" y2="290" stroke="#a6e3a1" stroke-width="1"/>
  <line x1="610" y1="225" x2="600" y2="290" stroke="#a6e3a1" stroke-width="1"/>
  <line x1="690" y1="225" x2="720" y2="290" stroke="#a6e3a1" stroke-width="1"/>

  <!-- Leaf Nodes -->
  <g transform="translate(10, 295)">
    <rect x="0" y="0" width="100" height="45" rx="5" fill="#313244" stroke="#f9e2af" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="50" y="18" text-anchor="middle" font-family="monospace" font-size="13" fill="#f9e2af">3, 8, 12</text>
    <text x="50" y="36" text-anchor="middle" font-family="monospace" font-size="10" fill="#585b70">page 3</text>
  </g>

  <g transform="translate(140, 295)">
    <rect x="0" y="0" width="120" height="45" rx="5" fill="#313244" stroke="#f9e2af" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="60" y="18" text-anchor="middle" font-family="monospace" font-size="13" fill="#f9e2af">15, 19, 24</text>
    <text x="60" y="36" text-anchor="middle" font-family="monospace" font-size="10" fill="#585b70">page 4</text>
  </g>

  <g transform="translate(290, 295)">
    <rect x="0" y="0" width="120" height="45" rx="5" fill="#313244" stroke="#f9e2af" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="60" y="18" text-anchor="middle" font-family="monospace" font-size="13" fill="#f9e2af">28, 33, 40</text>
    <text x="60" y="36" text-anchor="middle" font-family="monospace" font-size="10" fill="#585b70">page 6</text>
  </g>

  <g transform="translate(430, 295)">
    <rect x="0" y="0" width="110" height="45" rx="5" fill="#313244" stroke="#f9e2af" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="55" y="18" text-anchor="middle" font-family="monospace" font-size="13" fill="#f9e2af">42, 49, 53</text>
    <text x="55" y="36" text-anchor="middle" font-family="monospace" font-size="10" fill="#585b70">page 7</text>
  </g>

  <g transform="translate(555, 295)">
    <rect x="0" y="0" width="110" height="45" rx="5" fill="#313244" stroke="#f9e2af" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="55" y="18" text-anchor="middle" font-family="monospace" font-size="13" fill="#f9e2af">56, 61, 72</text>
    <text x="55" y="36" text-anchor="middle" font-family="monospace" font-size="10" fill="#585b70">page 8</text>
  </g>

  <g transform="translate(680, 295)">
    <rect x="0" y="0" width="110" height="45" rx="5" fill="#313244" stroke="#f9e2af" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="55" y="18" text-anchor="middle" font-family="monospace" font-size="13" fill="#f9e2af">78, 85, 92</text>
    <text x="55" y="36" text-anchor="middle" font-family="monospace" font-size="10" fill="#585b70">page 9</text>
  </g>

  <!-- Sibling pointers between leaves -->
  <g stroke="#585b70" stroke-width="1" stroke-dasharray="4,3">
    <line x1="110" y1="317" x2="140" y2="317"/>
    <line x1="260" y1="317" x2="290" y2="317"/>
    <line x1="410" y1="317" x2="430" y2="317"/>
    <line x1="540" y1="317" x2="555" y2="317"/>
    <line x1="665" y1="317" x2="680" y2="317"/>
  </g>

  <!-- Search path highlight -->
  <g transform="translate(40, 380)">
    <text x="0" y="0" font-family="sans-serif" font-size="13" fill="#f38ba8">Search for key 49:</text>
    <text x="140" y="0" font-family="monospace" font-size="12" fill="#a6adc8">Root (49 &gt; 42 → right)</text>
    <text x="370" y="0" font-family="monospace" font-size="12" fill="#a6adc8">→ Page 5 (49 &lt; 56 → left)</text>
    <text x="600" y="0" font-family="monospace" font-size="12" fill="#a6adc8">→ Page 7 ✓</text>
  </g>

  <!-- Legend -->
  <g transform="translate(40, 460)">
    <rect x="0" y="0" width="14" height="14" rx="2" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
    <text x="22" y="12" font-family="sans-serif" font-size="12" fill="#a6adc8">Root</text>
    <rect x="100" y="0" width="14" height="14" rx="2" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
    <text x="122" y="12" font-family="sans-serif" font-size="12" fill="#a6adc8">Internal</text>
    <rect x="220" y="0" width="14" height="14" rx="2" fill="#313244" stroke="#f9e2af" stroke-width="1.5"/>
    <text x="242" y="12" font-family="sans-serif" font-size="12" fill="#a6adc8">Leaf (data)</text>
    <text x="380" y="12" font-family="sans-serif" font-size="12" fill="#a6adc8">Depth = 3 → O(log n) lookups</text>
  </g>
</svg>