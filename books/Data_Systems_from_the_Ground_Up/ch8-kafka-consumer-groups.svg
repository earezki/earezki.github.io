      <text x="130" y="40" text-anchor="middle" font-family="monospace" font-size="10" fill="#a6adc8">Assigned: P0, P2</text>
      <text x="130" y="55" text-anchor="middle" font-family="monospace" font-size="9" fill="#585b70">processing 2 partitions</text>
    </g>

    <!-- Consumer 2 -->
    <g transform="translate(30, 105)">
      <rect x="0" y="0" width="260" height="65" rx="6" fill="#313244" stroke="#f9e2af" stroke-width="2" filter="url(#shadow)"/>
      <text x="130" y="20" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f9e2af">Consumer 2</text>
      <text x="130" y="40" text-anchor="middle" font-family="monospace" font-size="10" fill="#a6adc8">Assigned: P1, P3</text>
      <text x="130" y="55" text-anchor="middle" font-family="monospace" font-size="9" fill="#585b70">processing 2 partitions</text>
    </g>

