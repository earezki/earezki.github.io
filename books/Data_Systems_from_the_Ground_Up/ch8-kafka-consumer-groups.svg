  <!-- Partition-to-consumer assignment arrows -->
  <line x1="355" y1="97" x2="525" y2="97" stroke="#89b4fa" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="355" y1="181" x2="525" y2="97" stroke="#89b4fa" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowBlue)"/>

  <line x1="355" y1="139" x2="525" y2="182" stroke="#f9e2af" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="355" y1="223" x2="525" y2="182" stroke="#f9e2af" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowGreen)"/>

  <line x1="355" y1="265" x2="525" y2="267" stroke="#f38ba8" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="355" y1="307" x2="525" y2="267" stroke="#f38ba8" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowBlue)"/>

  <!-- Committed Offsets (bottom section) -->
  <g transform="translate(40, 350)">
    <rect x="0" y="0" width="770" height="75" rx="6" fill="#313244" stroke="#585b70" stroke-width="1"/>
    <text x="385" y="20" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#cdd6f4">__consumer_offsets (internal topic)</text>

    <text x="30" y="42" font-family="monospace" font-size="10" fill="#89b4fa">C1: P0=3, P2=1</text>
    <text x="230" y="42" font-family="monospace" font-size="10" fill="#f9e2af">C2: P1=2, P3=4</text>
    <text x="430" y="42" font-family="monospace" font-size="10" fill="#f38ba8">C3: P4=1, P5=2</text>

    <text x="385" y="62" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#585b70">Each partition has exactly one consumer. Each consumer tracks its own committed offset per partition.</text>
  </g>
