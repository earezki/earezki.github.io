<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#89b4fa"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#f38ba8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="380" rx="12" fill="#1e1e2e"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#cdd6f4">Append-Only Log</text>

  <!-- Log file (sequence of records) -->
  <g transform="translate(60, 70)">
    <!-- File outline -->
    <rect x="0" y="0" width="680" height="80" rx="6" fill="#313244" stroke="#585b70" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="340" y="-10" text-anchor="middle" font-family="monospace" font-size="13" fill="#a6adc8">database.log</text>

    <!-- Record 1 -->
    <rect x="10" y="10" width="120" height="60" rx="4" fill="#1e1e2e" stroke="#a6e3a1" stroke-width="1.5"/>
    <text x="70" y="32" text-anchor="middle" font-family="monospace" font-size="11" fill="#a6e3a1">SET key1</text>
    <text x="70" y="50" text-anchor="middle" font-family="monospace" font-size="11" fill="#a6adc8">"value1"</text>

    <!-- Record 2 -->
    <rect x="140" y="10" width="120" height="60" rx="4" fill="#1e1e2e" stroke="#a6e3a1" stroke-width="1.5"/>
    <text x="200" y="32" text-anchor="middle" font-family="monospace" font-size="11" fill="#a6e3a1">SET key2</text>
    <text x="200" y="50" text-anchor="middle" font-family="monospace" font-size="11" fill="#a6adc8">"value2"</text>

    <!-- Record 3 -->
    <rect x="270" y="10" width="120" height="60" rx="4" fill="#1e1e2e" stroke="#a6e3a1" stroke-width="1.5"/>
    <text x="330" y="32" text-anchor="middle" font-family="monospace" font-size="11" fill="#a6e3a1">SET key1</text>
    <text x="330" y="50" text-anchor="middle" font-family="monospace" font-size="11" fill="#a6adc8">"value3"</text>

    <!-- Record 4 -->
    <rect x="400" y="10" width="120" height="60" rx="4" fill="#1e1e2e" stroke="#a6e3a1" stroke-width="1.5"/>
    <text x="460" y="32" text-anchor="middle" font-family="monospace" font-size="11" fill="#a6e3a1">DEL key2</text>
    <text x="460" y="50" text-anchor="middle" font-family="monospace" font-size="11" fill="#a6adc8"></text>

    <!-- New record being appended -->
    <rect x="530" y="10" width="140" height="60" rx="4" fill="#1e1e2e" stroke="#89b4fa" stroke-width="2" stroke-dasharray="6,3"/>
    <text x="600" y="32" text-anchor="middle" font-family="monospace" font-size="11" fill="#89b4fa">SET key3</text>
    <text x="600" y="50" text-anchor="middle" font-family="monospace" font-size="11" fill="#a6adc8">"value4"</text>
  </g>

  <!-- Write arrow -->
  <line x1="660" y1="60" x2="660" y2="72" stroke="#89b4fa" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="660" y="52" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#89b4fa">WRITE (append)</text>

  <!-- Offset labels -->
  <g font-family="monospace" font-size="10" fill="#585b70">
    <text x="130" y="168" text-anchor="middle">offset 0</text>
    <text x="260" y="168" text-anchor="middle">offset 1</text>
    <text x="390" y="168" text-anchor="middle">offset 2</text>
    <text x="520" y="168" text-anchor="middle">offset 3</text>
    <text x="650" y="168" text-anchor="middle">offset 4</text>
  </g>

  <!-- Read arrow (full scan) -->
  <g transform="translate(60, 200)">
    <text x="340" y="0" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f38ba8">READ: Full scan to find key1</text>

    <line x1="20" y1="25" x2="640" y2="25" stroke="#f38ba8" stroke-width="2" marker-end="url(#arrowRed)"/>

    <!-- Scan indicators -->
    <text x="80" y="55" text-anchor="middle" font-family="monospace" font-size="11" fill="#a6adc8">key1?</text>
    <text x="80" y="70" text-anchor="middle" font-family="monospace" font-size="11" fill="#a6e3a1">match</text>

    <text x="210" y="55" text-anchor="middle" font-family="monospace" font-size="11" fill="#a6adc8">key1?</text>
    <text x="210" y="70" text-anchor="middle" font-family="monospace" font-size="11" fill="#585b70">skip</text>

    <text x="340" y="55" text-anchor="middle" font-family="monospace" font-size="11" fill="#a6adc8">key1?</text>
    <text x="340" y="70" text-anchor="middle" font-family="monospace" font-size="11" fill="#a6e3a1">match (latest)</text>

    <text x="470" y="55" text-anchor="middle" font-family="monospace" font-size="11" fill="#a6adc8">key1?</text>
    <text x="470" y="70" text-anchor="middle" font-family="monospace" font-size="11" fill="#585b70">skip</text>
  </g>

  <!-- Legend -->
  <g transform="translate(60, 340)">
    <rect x="0" y="0" width="14" height="14" rx="2" fill="#1e1e2e" stroke="#a6e3a1" stroke-width="1.5"/>
    <text x="22" y="12" font-family="sans-serif" font-size="12" fill="#a6adc8">Committed record</text>

    <rect x="200" y="0" width="14" height="14" rx="2" fill="#1e1e2e" stroke="#89b4fa" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="222" y="12" font-family="sans-serif" font-size="12" fill="#a6adc8">New append</text>

    <line x1="400" y1="7" x2="430" y2="7" stroke="#f38ba8" stroke-width="2" marker-end="url(#arrowRed)"/>
    <text x="438" y="12" font-family="sans-serif" font-size="12" fill="#a6adc8">Linear scan (O(n))</text>
  </g>
</svg>