<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500">
  <rect width="880" height="500" rx="8" fill="#1e1e2e"/>

  <!-- Title -->
  <text x="440" y="36" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#cdd6f4">Cache Stampede: Without vs With Protection</text>

  <!-- Divider line -->
  <line x1="440" y1="50" x2="440" y2="480" stroke="#45475a" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- LEFT PANEL: Without Protection -->
  <text x="220" y="70" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#f38ba8">Without Protection</text>

  <!-- Cache box (expired) -->
  <rect x="150" y="90" width="140" height="45" rx="6" fill="#313244" stroke="#f38ba8" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="220" y="110" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f38ba8">Cache</text>
  <text x="220" y="126" text-anchor="middle" font-family="monospace" font-size="10" fill="#f38ba8">TTL EXPIRED</text>

  <!-- 1000 requests label -->
  <rect x="30" y="170" width="100" height="36" rx="4" fill="#313244" stroke="#cdd6f4" stroke-width="1"/>
  <text x="80" y="185" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#cdd6f4">1,000</text>
  <text x="80" y="199" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#cdd6f4">Requests</text>

  <!-- Many arrows from requests to DB -->
  <line x1="130" y1="180" x2="185" y2="180" stroke="#f38ba8" stroke-width="1.5"/>
  <line x1="130" y1="184" x2="185" y2="184" stroke="#f38ba8" stroke-width="1.5"/>
  <line x1="130" y1="188" x2="185" y2="188" stroke="#f38ba8" stroke-width="1.5"/>
  <line x1="130" y1="192" x2="185" y2="192" stroke="#f38ba8" stroke-width="1.5"/>
  <line x1="130" y1="196" x2="185" y2="196" stroke="#f38ba8" stroke-width="1.5"/>

  <!-- Arrow bundle going down to DB -->
  <text x="220" y="175" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#f38ba8">MISS!</text>

  <!-- Multiple arrows from cache miss to DB -->
  <path d="M190,188 L190,260" stroke="#f38ba8" stroke-width="1.5"/>
  <path d="M205,188 L205,260" stroke="#f38ba8" stroke-width="1.5"/>
  <path d="M220,188 L220,260" stroke="#f38ba8" stroke-width="1.5"/>
  <path d="M235,188 L235,260" stroke="#f38ba8" stroke-width="1.5"/>
  <path d="M250,188 L250,260" stroke="#f38ba8" stroke-width="1.5"/>

  <text x="280" y="230" font-family="sans-serif" font-size="10" fill="#f38ba8">×1,000</text>
  <text x="280" y="244" font-family="sans-serif" font-size="10" fill="#f38ba8">queries!</text>

  <!-- DB box (overwhelmed) -->
  <rect x="150" y="265" width="140" height="55" rx="6" fill="#313244" stroke="#f38ba8" stroke-width="3"/>
  <text x="220" y="288" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f38ba8">PostgreSQL</text>
  <text x="220" y="305" text-anchor="middle" font-family="monospace" font-size="10" fill="#f38ba8">CPU: 100%</text>

  <!-- Explosion/crash indicator -->
  <text x="220" y="345" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f38ba8">⚠ DB OVERWHELMED</text>
  <text x="220" y="365" text-anchor="middle" font-family="monospace" font-size="10" fill="#f38ba8">p99: 12,000ms</text>
  <text x="220" y="380" text-anchor="middle" font-family="monospace" font-size="10" fill="#f38ba8">Errors: 34%</text>

  <!-- Result boxes (failures) -->
  <rect x="80" y="400" width="280" height="36" rx="4" fill="#45475a" stroke="#f38ba8" stroke-width="1"/>
  <text x="220" y="415" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#f38ba8">340 timeouts · 660 slow responses (8-12s)</text>
  <text x="220" y="430" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6c7086">Users see errors or loading spinners</text>

  <!-- RIGHT PANEL: With Mutex Lock -->
  <text x="660" y="70" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#a6e3a1">With Mutex Lock</text>

  <!-- Cache box (expired) -->
  <rect x="590" y="90" width="140" height="45" rx="6" fill="#313244" stroke="#f9e2af" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="660" y="110" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f9e2af">Cache</text>
  <text x="660" y="126" text-anchor="middle" font-family="monospace" font-size="10" fill="#f9e2af">TTL EXPIRED</text>

  <!-- 1000 requests -->
  <rect x="470" y="155" width="100" height="36" rx="4" fill="#313244" stroke="#cdd6f4" stroke-width="1"/>
  <text x="520" y="170" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#cdd6f4">1,000</text>
  <text x="520" y="184" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#cdd6f4">Requests</text>

  <!-- Lock icon / box -->
  <rect x="620" y="155" width="80" height="36" rx="4" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <text x="660" y="171" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#89b4fa">🔒 Lock</text>
  <text x="660" y="184" text-anchor="middle" font-family="monospace" font-size="9" fill="#89b4fa">SETNX</text>

  <!-- Arrow from requests to lock -->
  <line x1="570" y1="173" x2="618" y2="173" stroke="#89b4fa" stroke-width="2" marker-end="url(#arrowBlueR)"/>

  <!-- 1 request gets lock → queries DB -->
  <text x="660" y="210" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#a6e3a1">1 request wins lock</text>
  <line x1="660" y1="215" x2="660" y2="248" stroke="#a6e3a1" stroke-width="2" marker-end="url(#arrowGreenR)"/>

  <!-- DB box (calm) -->
  <rect x="590" y="250" width="140" height="45" rx="6" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
  <text x="660" y="270" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#a6e3a1">PostgreSQL</text>
  <text x="660" y="286" text-anchor="middle" font-family="monospace" font-size="10" fill="#a6e3a1">1 query · 45ms</text>

  <!-- 999 wait -->
  <rect x="760" y="155" width="90" height="60" rx="4" fill="#313244" stroke="#45475a" stroke-width="1"/>
  <text x="805" y="175" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#cdd6f4">999</text>
  <text x="805" y="191" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6c7086">wait on</text>
  <text x="805" y="205" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6c7086">lock...</text>

  <!-- Arrow from lock to wait -->
  <line x1="700" y1="173" x2="758" y2="180" stroke="#45475a" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Arrow: DB result → Populate Cache -->
  <line x1="660" y1="295" x2="660" y2="325" stroke="#a6e3a1" stroke-width="2" marker-end="url(#arrowGreenR)"/>

  <!-- Cache repopulated -->
  <rect x="590" y="328" width="140" height="40" rx="6" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
  <text x="660" y="346" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#a6e3a1">Cache</text>
  <text x="660" y="360" text-anchor="middle" font-family="monospace" font-size="10" fill="#a6e3a1">REPOPULATED</text>

  <!-- Arrow from waiting 999 down to cache -->
  <path d="M805,215 L805,348 L732,348" stroke="#a6e3a1" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#arrowGreenR)"/>
  <text x="780" y="290" font-family="sans-serif" font-size="10" fill="#a6e3a1" transform="rotate(90,780,290)">lock released</text>

  <!-- All served from cache -->
  <rect x="530" y="395" width="260" height="40" rx="4" fill="#45475a" stroke="#a6e3a1" stroke-width="1"/>
  <text x="660" y="413" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a6e3a1">1,000 served · 1 DB query · p99: 95ms</text>
  <text x="660" y="428" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6c7086">999 served from fresh cache</text>

  <!-- Bottom comparison -->
  <rect x="60" y="450" width="320" height="30" rx="4" fill="#1e1e2e" stroke="#f38ba8" stroke-width="1"/>
  <text x="220" y="470" text-anchor="middle" font-family="monospace" font-size="11" fill="#f38ba8">1,000 DB queries · 34% errors</text>

  <rect x="500" y="450" width="320" height="30" rx="4" fill="#1e1e2e" stroke="#a6e3a1" stroke-width="1"/>
  <text x="660" y="470" text-anchor="middle" font-family="monospace" font-size="11" fill="#a6e3a1">1 DB query · 0% errors</text>

  <defs>
    <marker id="arrowBlueR" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#89b4fa"/>
    </marker>
    <marker id="arrowGreenR" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#a6e3a1"/>
    </marker>
  </defs>
</svg>