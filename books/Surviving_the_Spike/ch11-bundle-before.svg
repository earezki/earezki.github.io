  <text x="92" y="403" font-family="sans-serif" font-size="11" fill="#f38ba8">lodash — 71 KB (uses only debounce)</text>

  <!-- other: 239KB -->
  <rect x="60" y="424" width="81" height="36" rx="4" fill="#585b70"/>
  <text x="68" y="447" font-family="monospace" font-size="12" fill="#cdd6f4">other — 239 KB</text>

