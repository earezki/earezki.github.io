  <rect x="60" y="292" width="61" height="36" rx="4" fill="#f38ba8"/>
  <text x="68" y="315" font-family="monospace" font-size="12" fill="#1e1e2e" font-weight="bold">analytics</text>
  <text x="130" y="315" font-family="sans-serif" font-size="11" fill="#f38ba8"> 180 KB — full SDK, uses 2 calls</text>

  <!-- react-dom: 130KB -->
  <rect x="60" y="336" width="44" height="36" rx="4" fill="#89b4fa"/>
  <text x="68" y="359" font-family="monospace" font-size="12" fill="#1e1e2e" font-weight="bold">react</text>
  <text x="116" y="359" font-family="sans-serif" font-size="11" fill="#89b4fa"> react-dom — 130 KB</text>

