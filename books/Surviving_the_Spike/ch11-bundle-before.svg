  <rect x="500" y="160" width="120" height="36" rx="4" fill="#a6e3a1"/>
  <text x="508" y="183" font-family="monospace" font-size="11" fill="#1e1e2e" font-weight="bold">BookingFlow 220KB</text>

  <rect x="500" y="204" width="95" height="36" rx="4" fill="#fab387"/>
  <text x="508" y="227" font-family="monospace" font-size="11" fill="#1e1e2e" font-weight="bold">TripHistory 180KB</text>

  <rect x="500" y="248" width="55" height="36" rx="4" fill="#fab387"/>
  <text x="508" y="271" font-family="monospace" font-size="11" fill="#1e1e2e" font-weight="bold">Tracking</text>
  <text x="563" y="271" font-family="sans-serif" font-size="11" fill="#fab387"> 95 KB</text>

  <rect x="500" y="292" width="60" height="36" rx="4" fill="#a6e3a1"/>
  <text x="508" y="315" font-family="monospace" font-size="11" fill="#1e1e2e" font-weight="bold">shared</text>
  <text x="573" y="315" font-family="sans-serif" font-size="11" fill="#a6e3a1"> 105 KB</text>

