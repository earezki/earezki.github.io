  <rect x="500" y="424" width="340" height="36" rx="4" fill="#f38ba8" opacity="0.15" stroke="#f38ba8" stroke-width="1"/>
  <text x="670" y="447" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f38ba8">Total: 2.3 MB — TTI: 11.4s on 3G</text>

  <!-- Waste summary -->
  <text x="440" y="500" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#f38ba8">▲ 751 KB of unnecessary dependencies shipped to every rider</text>
