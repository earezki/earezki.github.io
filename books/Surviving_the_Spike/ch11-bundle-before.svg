  <rect x="580" y="120" width="14" height="14" rx="2" fill="#fab387"/>
  <text x="600" y="132" font-family="sans-serif" font-size="12" fill="#cdd6f4">Lazy-loadable</text>

  <!-- Individual package bars -->
  <!-- mapbox-gl: 580KB -->
  <rect x="60" y="160" width="197" height="36" rx="4" fill="#89b4fa"/>
  <text x="68" y="183" font-family="monospace" font-size="12" fill="#1e1e2e" font-weight="bold">@mapbox/mapbox-gl — 580 KB</text>

