  <text x="351" y="55" text-anchor="middle" font-family="monospace" font-size="10" fill="#6c7086">1s</text>
  <text x="422" y="55" text-anchor="middle" font-family="monospace" font-size="10" fill="#6c7086">2s</text>
  <text x="493" y="55" text-anchor="middle" font-family="monospace" font-size="10" fill="#6c7086">3s</text>
  <text x="564" y="55" text-anchor="middle" font-family="monospace" font-size="10" fill="#6c7086">4s</text>
  <text x="635" y="55" text-anchor="middle" font-family="monospace" font-size="10" fill="#6c7086">5s</text>
  <text x="706" y="55" text-anchor="middle" font-family="monospace" font-size="10" fill="#6c7086">6s</text>
  <text x="777" y="55" text-anchor="middle" font-family="monospace" font-size="10" fill="#6c7086">7s</text>
  <text x="848" y="55" text-anchor="middle" font-family="monospace" font-size="10" fill="#6c7086">8s</text>
  <!-- Grid lines -->
  <line x1="351" y1="60" x2="351" y2="460" stroke="#313244" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="422" y1="60" x2="422" y2="460" stroke="#313244" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="493" y1="60" x2="493" y2="460" stroke="#313244" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="564" y1="60" x2="564" y2="460" stroke="#313244" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="635" y1="60" x2="635" y2="460" stroke="#313244" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="706" y1="60" x2="706" y2="460" stroke="#313244" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="777" y1="60" x2="777" y2="460" stroke="#313244" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- scale: 570px = 8.1s, so 1s = 70.37px -->

  <!-- Row 1: POST /api/rides/request  8.1s -->
  <text x="270" y="92" text-anchor="end" font-family="monospace" font-size="11" fill="#cdd6f4">POST /api/rides/request</text>
  <rect x="280" y="78" width="570" height="22" rx="4" fill="#89b4fa" opacity="0.25"/>
  <rect x="280" y="78" width="570" height="22" rx="4" fill="none" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="565" y="93" text-anchor="middle" font-family="monospace" font-size="10" fill="#cdd6f4">8.1s</text>

  <!-- Row 2: fare.calculate.full  7.6s  (7.6/8.1 * 570 = 535) -->
  <text x="270" y="130" text-anchor="end" font-family="monospace" font-size="11" fill="#cdd6f4">fare.calculate.full</text>
  <rect x="285" y="116" width="535" height="22" rx="4" fill="#89b4fa" opacity="0.15"/>
  <rect x="285" y="116" width="535" height="22" rx="4" fill="none" stroke="#89b4fa" stroke-width="1"/>
  <text x="550" y="131" text-anchor="middle" font-family="monospace" font-size="10" fill="#89b4fa">7.6s</text>

  <!-- Row 3: r2dbc.query SELECT pricing_rules  7.5s  BOTTLENECK (7.5/8.1*570 = 528) -->
  <text x="270" y="168" text-anchor="end" font-family="monospace" font-size="11" fill="#f38ba8" font-weight="bold">r2dbc.query</text>
  <rect x="290" y="154" width="528" height="24" rx="4" fill="#f38ba8" opacity="0.25"/>
  <rect x="290" y="154" width="528" height="24" rx="4" fill="none" stroke="#f38ba8" stroke-width="2"/>
  <text x="550" y="170" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#f38ba8">SELECT pricing_rules — 7.5s</text>
  <!-- Bottleneck annotation -->
  <rect x="540" y="182" width="180" height="20" rx="4" fill="#f38ba8" opacity="0.15"/>
  <text x="630" y="196" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#f38ba8">&#x26A0; pool wait: 7,485ms</text>

  <!-- Connection pool attributes -->
  <rect x="30" y="155" width="220" height="52" rx="4" fill="#313244" stroke="#f38ba8" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="40" y="172" font-family="monospace" font-size="9" fill="#f38ba8">pool.active: 10 / max: 10</text>
  <text x="40" y="186" font-family="monospace" font-size="9" fill="#f38ba8">pool.wait_time: 7,485ms</text>
  <text x="40" y="200" font-family="monospace" font-size="9" fill="#6c7086">query exec time: 15ms</text>

  <!-- Row 4: fare.surge_pricing  45ms -->
  <text x="270" y="228" text-anchor="end" font-family="monospace" font-size="11" fill="#cdd6f4">fare.surge_pricing</text>
  <rect x="818" y="214" width="4" height="20" rx="2" fill="#a6e3a1"/>
  <text x="828" y="228" text-anchor="start" font-family="monospace" font-size="10" fill="#a6e3a1">45ms</text>

  <!-- Row 5: fare.apply_promotions  12ms -->
  <text x="270" y="262" text-anchor="end" font-family="monospace" font-size="11" fill="#cdd6f4">fare.apply_promotions</text>
  <rect x="818" y="248" width="2" height="20" rx="1" fill="#a6e3a1"/>
  <text x="828" y="262" text-anchor="start" font-family="monospace" font-size="10" fill="#a6e3a1">12ms</text>

  <!-- Row 6: driver.matching.find_nearest  380ms (380/8100*570 = 26.7) starts at ~7.6s -->
  <text x="270" y="300" text-anchor="end" font-family="monospace" font-size="11" fill="#cdd6f4">driver.matching</text>
  <rect x="820" y="286" width="27" height="20" rx="4" fill="#89b4fa" opacity="0.4"/>
  <rect x="820" y="286" width="27" height="20" rx="4" fill="none" stroke="#89b4fa" stroke-width="1"/>
  <text x="833" y="320" text-anchor="middle" font-family="monospace" font-size="10" fill="#89b4fa">380ms</text>

  <!-- Row 7: driver.matching.score_candidates  210ms (nested, starts in matching) -->
  <text x="270" y="345" text-anchor="end" font-family="monospace" font-size="10" fill="#6c7086">score_candidates</text>
  <rect x="825" y="333" width="15" height="18" rx="3" fill="#89b4fa" opacity="0.3"/>
  <rect x="825" y="333" width="15" height="18" rx="3" fill="none" stroke="#89b4fa" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="845" y="345" text-anchor="start" font-family="monospace" font-size="9" fill="#89b4fa">210ms</text>

  <!-- Row 8: redis.GET surge:zone:manhattan  8ms -->
  <text x="270" y="380" text-anchor="end" font-family="monospace" font-size="11" fill="#cdd6f4">redis.GET</text>
  <rect x="280" y="368" width="2" height="18" rx="1" fill="#a6e3a1"/>
  <text x="290" y="380" text-anchor="start" font-family="monospace" font-size="10" fill="#a6e3a1">8ms</text>

  <!-- Row 9: kafka.produce ride-events  22ms -->
  <text x="270" y="415" text-anchor="end" font-family="monospace" font-size="11" fill="#cdd6f4">kafka.produce</text>
  <rect x="846" y="403" width="4" height="18" rx="2" fill="#a6e3a1"/>
  <text x="856" y="415" text-anchor="start" font-family="monospace" font-size="10" fill="#a6e3a1">22ms</text>

  <!-- Nesting indicators -->
  <line x1="282" y1="105" x2="282" y2="270" stroke="#45475a" stroke-width="1" stroke-dasharray="2,3"/>
  <line x1="287" y1="143" x2="287" y2="270" stroke="#45475a" stroke-width="1" stroke-dasharray="2,3"/>

  <!-- Legend -->
  <rect x="30" y="470" width="400" height="40" rx="6" fill="#313244" stroke="#45475a" stroke-width="1"/>
  <rect x="45" y="484" width="12" height="12" rx="2" fill="#f38ba8"/>
  <text x="63" y="494" font-family="sans-serif" font-size="11" fill="#f38ba8">Bottleneck (pool exhaustion)</text>
  <rect x="225" y="484" width="12" height="12" rx="2" fill="#89b4fa"/>
  <text x="243" y="494" font-family="sans-serif" font-size="11" fill="#89b4fa">Normal</text>
  <rect x="300" y="484" width="12" height="12" rx="2" fill="#a6e3a1"/>
  <text x="318" y="494" font-family="sans-serif" font-size="11" fill="#a6e3a1">Fast (&lt;50ms)</text>
</svg>