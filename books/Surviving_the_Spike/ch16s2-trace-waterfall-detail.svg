<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 530" width="880" height="530">
  <rect width="880" height="530" rx="8" fill="#1e1e2e"/>
  <text x="440" y="35" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#cdd6f4">Detailed Trace — POST /api/rides/request (8.1s)</text>

  <!-- Time axis -->
