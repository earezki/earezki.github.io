<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 580" width="850" height="580">
  <defs>
    <marker id="arr5" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#89b4fa"/>
    </marker>
    <marker id="arr5g" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#a6e3a1"/>
    </marker>
    <marker id="arr5d" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#cdd6f4"/>
    </marker>
    <filter id="sh5">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="850" height="580" rx="12" fill="#1e1e2e"/>

  <!-- Title -->
  <text x="425" y="35" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#cdd6f4">Three-Layer Cache Architecture (Cache-Aside Pattern)</text>

  <!-- Request entry -->
  <g filter="url(#sh5)">
    <rect x="345" y="55" width="160" height="40" rx="8" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
    <text x="425" y="80" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#cdd6f4">Incoming Request</text>
  </g>

  <!-- Arrow down to L1 -->
  <line x1="425" y1="95" x2="425" y2="125" stroke="#89b4fa" stroke-width="2" marker-end="url(#arr5)"/>

  <!-- L1: Caffeine -->
  <g filter="url(#sh5)">
    <rect x="250" y="130" width="350" height="65" rx="10" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
    <text x="295" y="158" font-family="sans-serif" font-size="14" font-weight="bold" fill="#a6e3a1">L1: Caffeine</text>
    <text x="295" y="178" font-family="sans-serif" font-size="11" fill="#6c7086">In-process JVM cache</text>
    <rect x="490" y="140" width="90" height="22" rx="4" fill="#a6e3a1" opacity="0.15"/>
    <text x="535" y="156" text-anchor="middle" font-family="monospace" font-size="12" fill="#a6e3a1">~1ms</text>
    <rect x="490" y="165" width="90" height="22" rx="4" fill="#45475a"/>
    <text x="535" y="181" text-anchor="middle" font-family="monospace" font-size="10" fill="#6c7086">10K entries</text>
  </g>

  <!-- Decision diamond L1 -->
  <polygon points="425,215 465,240 425,265 385,240" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="425" y="244" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#cdd6f4">HIT?</text>

  <!-- L1 Hit arrow (right) -->
  <line x1="465" y1="240" x2="700" y2="240" stroke="#a6e3a1" stroke-width="2" marker-end="url(#arr5g)"/>
  <rect x="700" y="225" width="110" height="30" rx="6" fill="#a6e3a1" opacity="0.15" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="755" y="245" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#a6e3a1">Return ✓</text>
  <text x="580" y="233" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#a6e3a1">HIT</text>

  <!-- L1 Miss arrow (down) -->
  <line x1="425" y1="265" x2="425" y2="295" stroke="#f38ba8" stroke-width="2" marker-end="url(#arr5)"/>
  <text x="445" y="285" font-family="sans-serif" font-size="10" fill="#f38ba8">MISS</text>

  <!-- L2: Redis -->
  <g filter="url(#sh5)">
    <rect x="250" y="300" width="350" height="65" rx="10" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
    <text x="295" y="328" font-family="sans-serif" font-size="14" font-weight="bold" fill="#89b4fa">L2: Redis</text>
    <text x="295" y="348" font-family="sans-serif" font-size="11" fill="#6c7086">Distributed cache cluster</text>
    <rect x="490" y="310" width="90" height="22" rx="4" fill="#89b4fa" opacity="0.15"/>
    <text x="535" y="326" text-anchor="middle" font-family="monospace" font-size="12" fill="#89b4fa">~5ms</text>
    <rect x="490" y="335" width="90" height="22" rx="4" fill="#45475a"/>
    <text x="535" y="351" text-anchor="middle" font-family="monospace" font-size="10" fill="#6c7086">shared</text>
  </g>

  <!-- Decision diamond L2 -->
  <polygon points="425,385 465,410 425,435 385,410" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="425" y="414" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#cdd6f4">HIT?</text>

  <!-- L2 Hit arrow (right) -->
  <line x1="465" y1="410" x2="700" y2="410" stroke="#a6e3a1" stroke-width="2" marker-end="url(#arr5g)"/>
  <rect x="700" y="395" width="110" height="30" rx="6" fill="#a6e3a1" opacity="0.15" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="755" y="415" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#a6e3a1">Return ✓</text>
  <text x="580" y="403" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#a6e3a1">HIT</text>

  <!-- Populate L1 on L2 hit -->
  <path d="M700,410 Q720,410 720,340 Q720,200 620,165" fill="none" stroke="#f9e2af" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="738" y="300" font-family="sans-serif" font-size="9" fill="#f9e2af" transform="rotate(-90, 738, 300)">populate L1</text>

  <!-- L2 Miss arrow (down) -->
  <line x1="425" y1="435" x2="425" y2="465" stroke="#f38ba8" stroke-width="2" marker-end="url(#arr5)"/>
  <text x="445" y="455" font-family="sans-serif" font-size="10" fill="#f38ba8">MISS</text>

  <!-- L3: Database -->
  <g filter="url(#sh5)">
    <rect x="250" y="470" width="350" height="65" rx="10" fill="#313244" stroke="#f38ba8" stroke-width="2"/>
    <text x="295" y="498" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f38ba8">L3: PostgreSQL</text>
    <text x="295" y="518" font-family="sans-serif" font-size="11" fill="#6c7086">Source of truth</text>
    <rect x="490" y="480" width="90" height="22" rx="4" fill="#f38ba8" opacity="0.15"/>
    <text x="535" y="496" text-anchor="middle" font-family="monospace" font-size="12" fill="#f38ba8">~50ms</text>
    <rect x="490" y="505" width="90" height="22" rx="4" fill="#45475a"/>
    <text x="535" y="521" text-anchor="middle" font-family="monospace" font-size="10" fill="#6c7086">persistent</text>
  </g>

  <!-- DB result arrow (right) -->
  <line x1="600" y1="502" x2="700" y2="502" stroke="#a6e3a1" stroke-width="2" marker-end="url(#arr5g)"/>
  <rect x="700" y="487" width="110" height="30" rx="6" fill="#a6e3a1" opacity="0.15" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="755" y="507" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#a6e3a1">Return ✓</text>

  <!-- Populate L1 + L2 on DB hit -->
  <path d="M700,502 Q740,502 740,420 Q740,200 620,165" fill="none" stroke="#f9e2af" stroke-width="1.5" stroke-dasharray="4,3"/>
  <path d="M740,420 Q740,340 620,335" fill="none" stroke="#f9e2af" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="758" y="460" font-family="sans-serif" font-size="9" fill="#f9e2af" transform="rotate(-90, 758, 460)">populate L1 + L2</text>

  <!-- Left side latency summary -->
  <g transform="translate(40, 140)">
    <rect x="0" y="0" width="170" height="120" rx="6" fill="#45475a" opacity="0.5"/>
    <text x="85" y="22" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#cdd6f4">Cache Hit Rates</text>
    <text x="15" y="45" font-family="monospace" font-size="11" fill="#a6e3a1">L1 hit: 60-80%</text>
    <text x="15" y="65" font-family="monospace" font-size="11" fill="#89b4fa">L2 hit: 15-30%</text>
    <text x="15" y="85" font-family="monospace" font-size="11" fill="#f38ba8">L3 hit:  5-10%</text>
    <line x1="15" y1="95" x2="155" y2="95" stroke="#585b70" stroke-width="1"/>
    <text x="15" y="112" font-family="monospace" font-size="11" fill="#f9e2af">Avg:    ~4ms</text>
  </g>
</svg>