<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" width="880" height="580">
  <rect width="880" height="580" rx="8" fill="#1e1e2e"/>

  <text x="440" y="32" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#cdd6f4">L7 Load Balancer — Health Checks and Connection Draining</text>

  <!-- Internet cloud -->
  <ellipse cx="440" cy="75" rx="110" ry="32" fill="#313244" stroke="#585b70" stroke-width="1.5"/>
  <text x="440" y="80" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#cdd6f4">Internet Traffic</text>

  <!-- Arrows from internet to LB -->
  <line x1="380" y1="107" x2="370" y2="155" stroke="#89b4fa" stroke-width="2" marker-end="url(#lbArrowBlue)"/>
  <line x1="440" y1="107" x2="440" y2="155" stroke="#89b4fa" stroke-width="2" marker-end="url(#lbArrowBlue)"/>
  <line x1="500" y1="107" x2="510" y2="155" stroke="#89b4fa" stroke-width="2" marker-end="url(#lbArrowBlue)"/>

  <!-- Load Balancer box -->
  <rect x="280" y="160" width="320" height="60" rx="8" fill="#89b4fa" opacity="0.2" stroke="#89b4fa" stroke-width="2"/>
  <text x="440" y="185" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#89b4fa">L7 Load Balancer</text>
  <text x="440" y="205" text-anchor="middle" font-family="monospace" font-size="11" fill="#585b70">least_conn | deep health checks | no sticky sessions</text>

  <!-- Health check probes -->
  <text x="170" y="175" text-anchor="end" font-family="sans-serif" font-size="11" fill="#a6e3a1">Health probes</text>
  <line x1="175" y1="172" x2="210" y2="185" stroke="#a6e3a1" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="175" y1="185" x2="210" y2="195" stroke="#a6e3a1" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Arrows from LB to pods -->
  <!-- Pod 1 -->
  <line x1="320" y1="220" x2="160" y2="300" stroke="#a6e3a1" stroke-width="2.5" marker-end="url(#lbArrowGreen)"/>
  <!-- Pod 2 -->
  <line x1="400" y1="220" x2="370" y2="300" stroke="#a6e3a1" stroke-width="2.5" marker-end="url(#lbArrowGreen)"/>
  <!-- Pod 3 -->
  <line x1="480" y1="220" x2="580" y2="300" stroke="#a6e3a1" stroke-width="2.5" marker-end="url(#lbArrowGreen)"/>
  <!-- Pod 4 (unhealthy - no arrow or dashed) -->
  <line x1="560" y1="220" x2="760" y2="300" stroke="#f38ba8" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.4"/>

  <!-- Pod 1 - healthy -->
  <rect x="100" y="305" width="120" height="80" rx="8" fill="#a6e3a1" opacity="0.15" stroke="#a6e3a1" stroke-width="2"/>
  <text x="160" y="335" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#a6e3a1">Pod 1</text>
  <text x="160" y="355" text-anchor="middle" font-family="monospace" font-size="10" fill="#a6e3a1">✓ DB ✓ Redis</text>
  <text x="160" y="375" text-anchor="middle" font-family="monospace" font-size="10" fill="#585b70">430 RPS</text>

  <!-- Pod 2 - healthy -->
  <rect x="310" y="305" width="120" height="80" rx="8" fill="#a6e3a1" opacity="0.15" stroke="#a6e3a1" stroke-width="2"/>
  <text x="370" y="335" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#a6e3a1">Pod 2</text>
  <text x="370" y="355" text-anchor="middle" font-family="monospace" font-size="10" fill="#a6e3a1">✓ DB ✓ Redis</text>
  <text x="370" y="375" text-anchor="middle" font-family="monospace" font-size="10" fill="#585b70">430 RPS</text>

  <!-- Pod 3 - healthy -->
  <rect x="520" y="305" width="120" height="80" rx="8" fill="#a6e3a1" opacity="0.15" stroke="#a6e3a1" stroke-width="2"/>
  <text x="580" y="335" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#a6e3a1">Pod 3</text>
  <text x="580" y="355" text-anchor="middle" font-family="monospace" font-size="10" fill="#a6e3a1">✓ DB ✓ Redis</text>
  <text x="580" y="375" text-anchor="middle" font-family="monospace" font-size="10" fill="#585b70">430 RPS</text>

  <!-- Pod 4 - unhealthy -->
  <rect x="700" y="305" width="120" height="80" rx="8" fill="#f38ba8" opacity="0.1" stroke="#f38ba8" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="760" y="335" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f38ba8">Pod 4</text>
  <text x="760" y="355" text-anchor="middle" font-family="monospace" font-size="10" fill="#f38ba8">✗ DB pool exhausted</text>
  <text x="760" y="375" text-anchor="middle" font-family="monospace" font-size="10" fill="#585b70">0 RPS (removed)</text>

  <!-- Red X on pod 4 -->
  <line x1="790" y1="295" x2="810" y2="315" stroke="#f38ba8" stroke-width="4"/>
  <line x1="810" y1="295" x2="790" y2="315" stroke="#f38ba8" stroke-width="4"/>

  <!-- Connection draining annotation on pod 4 -->
  <rect x="688" y="395" width="144" height="50" rx="6" fill="#f9e2af" opacity="0.12" stroke="#f9e2af" stroke-width="1"/>
  <text x="760" y="413" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f9e2af">Connection Draining</text>
  <text x="760" y="430" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#f9e2af">12 in-flight requests</text>
  <text x="760" y="443" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#f9e2af">finishing (30s grace)</text>

  <!-- Arrow from pod 4 to draining -->
  <line x1="760" y1="385" x2="760" y2="395" stroke="#f9e2af" stroke-width="1.5"/>

  <!-- Deep health check detail -->
  <rect x="80" y="420" width="540" height="65" rx="6" fill="#313244"/>
  <text x="95" y="440" font-family="sans-serif" font-size="12" font-weight="bold" fill="#cdd6f4">Deep Health Check (/health/ready)</text>
  <text x="95" y="460" font-family="monospace" font-size="11" fill="#a6e3a1">✓ PostgreSQL: SELECT 1 (timeout: 3s)</text>
  <text x="95" y="476" font-family="monospace" font-size="11" fill="#a6e3a1">✓ Redis: PING → PONG (timeout: 2s)</text>
  <text x="430" y="460" font-family="monospace" font-size="11" fill="#f38ba8">✗ Shallow: GET /health → 200</text>
  <text x="430" y="476" font-family="sans-serif" font-size="10" fill="#f38ba8">  would miss DB failure!</text>

  <!-- Key insight -->
  <rect x="120" y="505" width="640" height="36" rx="6" fill="#89b4fa" opacity="0.1" stroke="#89b4fa" stroke-width="1"/>
  <text x="440" y="528" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#89b4fa">Least-connections + deep health checks = traffic avoids unhealthy pods automatically</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="lbArrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#89b4fa"/>
    </marker>
    <marker id="lbArrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a6e3a1"/>
    </marker>
  </defs>
</svg>