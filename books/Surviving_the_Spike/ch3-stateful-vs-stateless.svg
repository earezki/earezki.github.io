<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="900" height="550">
  <defs>
    <marker id="arr3" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#89b4fa"/>
    </marker>
    <marker id="arr3g" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#a6e3a1"/>
    </marker>
    <marker id="arr3r" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#f38ba8"/>
    </marker>
    <filter id="sh3">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="550" rx="12" fill="#1e1e2e"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#cdd6f4">Stateful vs Stateless Architecture</text>

  <!-- Divider line -->
  <line x1="450" y1="55" x2="450" y2="500" stroke="#585b70" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- LEFT SIDE: Stateful -->
  <text x="225" y="70" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#f38ba8">Stateful (Sticky Sessions)</text>
  <text x="225" y="88" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#f38ba8" opacity="0.7">✗ Uneven load, failover breaks sessions</text>

  <!-- Load Balancer Left -->
  <g filter="url(#sh3)">
    <rect x="155" y="105" width="140" height="45" rx="8" fill="#313244" stroke="#f38ba8" stroke-width="2"/>
    <text x="225" y="132" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#cdd6f4">Load Balancer</text>
  </g>

  <!-- Sticky arrows left -->
  <line x1="185" y1="150" x2="100" y2="210" stroke="#f38ba8" stroke-width="2" marker-end="url(#arr3r)"/>
  <line x1="225" y1="150" x2="225" y2="210" stroke="#f38ba8" stroke-width="2" marker-end="url(#arr3r)"/>
  <line x1="265" y1="150" x2="350" y2="210" stroke="#f38ba8" stroke-width="2" marker-end="url(#arr3r)"/>

  <!-- Sticky labels -->
  <text x="130" y="185" text-anchor="middle" font-family="monospace" font-size="9" fill="#f38ba8">sticky</text>
  <text x="238" y="185" text-anchor="middle" font-family="monospace" font-size="9" fill="#f38ba8">sticky</text>
  <text x="320" y="185" text-anchor="middle" font-family="monospace" font-size="9" fill="#f38ba8">sticky</text>

  <!-- Server 1 Left -->
  <g filter="url(#sh3)">
    <rect x="45" y="210" width="120" height="90" rx="8" fill="#313244" stroke="#585b70" stroke-width="1.5"/>
    <text x="105" y="235" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#cdd6f4">Server A</text>
    <rect x="55" y="245" width="100" height="20" rx="4" fill="#f38ba8" opacity="0.2"/>
    <text x="105" y="260" text-anchor="middle" font-family="monospace" font-size="10" fill="#f38ba8">Session: User1</text>
    <rect x="55" y="270" width="100" height="20" rx="4" fill="#f38ba8" opacity="0.2"/>
    <text x="105" y="285" text-anchor="middle" font-family="monospace" font-size="10" fill="#f38ba8">Session: User4</text>
  </g>

  <!-- Server 2 Left -->
  <g filter="url(#sh3)">
    <rect x="175" y="210" width="120" height="90" rx="8" fill="#313244" stroke="#585b70" stroke-width="1.5"/>
    <text x="235" y="235" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#cdd6f4">Server B</text>
    <rect x="185" y="245" width="100" height="20" rx="4" fill="#f38ba8" opacity="0.2"/>
    <text x="235" y="260" text-anchor="middle" font-family="monospace" font-size="10" fill="#f38ba8">Session: User2</text>
    <rect x="185" y="270" width="100" height="20" rx="4" fill="#f38ba8" opacity="0.2"/>
    <text x="235" y="285" text-anchor="middle" font-family="monospace" font-size="10" fill="#f38ba8">Session: User5</text>
  </g>

  <!-- Server 3 Left -->
  <g filter="url(#sh3)">
    <rect x="305" y="210" width="120" height="90" rx="8" fill="#313244" stroke="#585b70" stroke-width="1.5"/>
    <text x="365" y="235" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#cdd6f4">Server C</text>
    <rect x="315" y="245" width="100" height="20" rx="4" fill="#f38ba8" opacity="0.2"/>
    <text x="365" y="260" text-anchor="middle" font-family="monospace" font-size="10" fill="#f38ba8">Session: User3</text>
    <rect x="315" y="270" width="100" height="20" rx="4" fill="#f38ba8" opacity="0.2"/>
    <text x="365" y="285" text-anchor="middle" font-family="monospace" font-size="10" fill="#f38ba8">Session: User6</text>
  </g>

  <!-- Problem callout left -->
  <rect x="55" y="330" width="360" height="60" rx="6" fill="#45475a" stroke="#f38ba8" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="235" y="352" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f38ba8">⚠ If Server B dies, User2 &amp; User5 lose</text>
  <text x="235" y="370" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f38ba8">their sessions. No failover.</text>

  <!-- RIGHT SIDE: Stateless -->
  <text x="675" y="70" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#a6e3a1">Stateless (Externalized State)</text>
  <text x="675" y="88" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a6e3a1" opacity="0.7">✓ Even load, any server handles any request</text>

  <!-- Load Balancer Right -->
  <g filter="url(#sh3)">
    <rect x="605" y="105" width="140" height="45" rx="8" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
    <text x="675" y="132" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#cdd6f4">Load Balancer</text>
  </g>

  <!-- Round-robin arrows right -->
  <line x1="640" y1="150" x2="555" y2="210" stroke="#a6e3a1" stroke-width="2" marker-end="url(#arr3g)"/>
  <line x1="675" y1="150" x2="675" y2="210" stroke="#a6e3a1" stroke-width="2" marker-end="url(#arr3g)"/>
  <line x1="710" y1="150" x2="795" y2="210" stroke="#a6e3a1" stroke-width="2" marker-end="url(#arr3g)"/>

  <!-- Round-robin labels -->
  <text x="584" y="185" text-anchor="middle" font-family="monospace" font-size="9" fill="#a6e3a1">any</text>
  <text x="688" y="185" text-anchor="middle" font-family="monospace" font-size="9" fill="#a6e3a1">any</text>
  <text x="766" y="185" text-anchor="middle" font-family="monospace" font-size="9" fill="#a6e3a1">any</text>

  <!-- Server 1 Right -->
  <g filter="url(#sh3)">
    <rect x="495" y="210" width="110" height="70" rx="8" fill="#313244" stroke="#585b70" stroke-width="1.5"/>
    <text x="550" y="235" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#cdd6f4">Server A</text>
    <text x="550" y="260" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a6e3a1">No local state</text>
  </g>

  <!-- Server 2 Right -->
  <g filter="url(#sh3)">
    <rect x="620" y="210" width="110" height="70" rx="8" fill="#313244" stroke="#585b70" stroke-width="1.5"/>
    <text x="675" y="235" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#cdd6f4">Server B</text>
    <text x="675" y="260" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a6e3a1">No local state</text>
  </g>

  <!-- Server 3 Right -->
  <g filter="url(#sh3)">
    <rect x="745" y="210" width="110" height="70" rx="8" fill="#313244" stroke="#585b70" stroke-width="1.5"/>
    <text x="800" y="235" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#cdd6f4">Server C</text>
    <text x="800" y="260" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a6e3a1">No local state</text>
  </g>

  <!-- Redis store -->
  <g filter="url(#sh3)">
    <rect x="590" y="330" width="170" height="65" rx="10" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
    <text x="675" y="355" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#a6e3a1">Redis</text>
    <text x="675" y="375" text-anchor="middle" font-family="monospace" font-size="10" fill="#cdd6f4">All sessions + state</text>
    <text x="675" y="388" text-anchor="middle" font-family="monospace" font-size="10" fill="#cdd6f4">User1..User6</text>
  </g>

  <!-- Arrows from servers to Redis -->
  <line x1="550" y1="280" x2="620" y2="328" stroke="#a6e3a1" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr3g)"/>
  <line x1="675" y1="280" x2="675" y2="328" stroke="#a6e3a1" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr3g)"/>
  <line x1="800" y1="280" x2="730" y2="328" stroke="#a6e3a1" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr3g)"/>

  <!-- Benefit callout right -->
  <rect x="505" y="415" width="350" height="60" rx="6" fill="#45475a" stroke="#a6e3a1" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="680" y="437" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#a6e3a1">✓ If Server B dies, requests route to A or C.</text>
  <text x="680" y="455" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#a6e3a1">Sessions persist in Redis. Zero data loss.</text>

  <!-- Bottom comparison -->
  <g transform="translate(80, 480)">
    <text x="155" y="15" text-anchor="middle" font-family="monospace" font-size="12" fill="#f38ba8">8 pods → 3.1x throughput</text>
  </g>
  <g transform="translate(480, 480)">
    <text x="195" y="15" text-anchor="middle" font-family="monospace" font-size="12" fill="#a6e3a1">8 pods → 7.2x throughput</text>
  </g>
</svg>