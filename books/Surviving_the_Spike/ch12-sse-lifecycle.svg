<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560">
  <rect width="880" height="560" rx="8" fill="#1e1e2e"/>

  <text x="440" y="32" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#cdd6f4">SSE Connection Lifecycle</text>

  <!-- Lifelines -->
  <rect x="140" y="52" width="120" height="30" rx="6" fill="#89b4fa"/>
  <text x="200" y="72" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e1e2e">Browser</text>
  <line x1="200" y1="82" x2="200" y2="530" stroke="#89b4fa" stroke-width="2" stroke-dasharray="6,4"/>

  <rect x="580" y="52" width="120" height="30" rx="6" fill="#a6e3a1"/>
  <text x="640" y="72" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e1e2e">Server</text>
  <line x1="640" y1="82" x2="640" y2="530" stroke="#a6e3a1" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Arrow 1: GET request -->
  <line x1="205" y1="110" x2="635" y2="110" stroke="#89b4fa" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="420" y="103" text-anchor="middle" font-family="monospace" font-size="11" fill="#cdd6f4">GET /api/sse/drivers/123</text>
  <text x="420" y="125" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#585b70">Accept: text/event-stream</text>

  <!-- Arrow 2: 200 OK -->
  <line x1="635" y1="150" x2="205" y2="150" stroke="#a6e3a1" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="420" y="143" text-anchor="middle" font-family="monospace" font-size="11" fill="#a6e3a1">200 OK  Content-Type: text/event-stream</text>

  <!-- Arrow 3: data event -->
  <line x1="635" y1="190" x2="205" y2="190" stroke="#a6e3a1" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="420" y="183" text-anchor="middle" font-family="monospace" font-size="11" fill="#cdd6f4">data: {"lat":40.71}</text>
  <text x="730" y="195" font-family="sans-serif" font-size="10" fill="#585b70">driver moves</text>

  <!-- Arrow 4: heartbeat -->
  <line x1="635" y1="225" x2="205" y2="225" stroke="#585b70" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowGray)"/>
  <text x="420" y="218" text-anchor="middle" font-family="monospace" font-size="11" fill="#585b70">:heartbeat (15s keep-alive)</text>

  <!-- Arrow 5: data event -->
  <line x1="635" y1="260" x2="205" y2="260" stroke="#a6e3a1" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="420" y="253" text-anchor="middle" font-family="monospace" font-size="11" fill="#cdd6f4">data: {"lat":40.72}</text>

  <!-- Network interruption -->
  <rect x="300" y="290" width="240" height="28" rx="4" fill="#f38ba8" opacity="0.15" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="335" y="309" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f38ba8">✕  Network Interruption</text>

  <!-- Break marks -->
  <line x1="195" y1="285" x2="205" y2="295" stroke="#f38ba8" stroke-width="2.5"/>
  <line x1="205" y1="285" x2="195" y2="295" stroke="#f38ba8" stroke-width="2.5"/>
  <line x1="635" y1="285" x2="645" y2="295" stroke="#f38ba8" stroke-width="2.5"/>
  <line x1="645" y1="285" x2="635" y2="295" stroke="#f38ba8" stroke-width="2.5"/>

  <!-- Arrow 6: automatic reconnect -->
  <line x1="205" y1="350" x2="635" y2="350" stroke="#89b4fa" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="420" y="343" text-anchor="middle" font-family="monospace" font-size="11" fill="#89b4fa">GET /api/sse/drivers/123</text>
  <text x="420" y="365" text-anchor="middle" font-family="monospace" font-size="11" fill="#89b4fa">Last-Event-ID: 1716480000</text>

  <rect x="60" y="338" width="130" height="24" rx="4" fill="#a6e3a1" opacity="0.15" stroke="#a6e3a1" stroke-width="1"/>
  <text x="125" y="355" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#a6e3a1">auto reconnect</text>

  <!-- Arrow 7: replay missed -->
  <line x1="635" y1="400" x2="205" y2="400" stroke="#a6e3a1" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="420" y="393" text-anchor="middle" font-family="monospace" font-size="11" fill="#cdd6f4">data: {"lat":40.73}</text>
  <text x="730" y="405" font-family="sans-serif" font-size="10" fill="#a6e3a1">replay missed</text>

  <!-- Arrow 8: resume -->
  <line x1="635" y1="435" x2="205" y2="435" stroke="#a6e3a1" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="420" y="428" text-anchor="middle" font-family="monospace" font-size="11" fill="#cdd6f4">data: {"lat":40.74}</text>
  <text x="730" y="440" font-family="sans-serif" font-size="10" fill="#a6e3a1">resume live</text>

  <!-- Key takeaway -->
  <rect x="120" y="475" width="640" height="40" rx="6" fill="#a6e3a1" opacity="0.1" stroke="#a6e3a1" stroke-width="1"/>
  <text x="440" y="500" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#a6e3a1">Browser reconnects automatically with Last-Event-ID — server replays missed events</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#89b4fa"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a6e3a1"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#585b70"/>
    </marker>
  </defs>
</svg>