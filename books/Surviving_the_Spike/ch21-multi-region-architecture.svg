<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" width="880" height="580">
  <rect width="880" height="580" rx="12" fill="#1e1e2e"/>

  <!-- Title -->
  <text x="440" y="32" font-family="sans-serif" font-size="18" font-weight="bold" fill="#cdd6f4" text-anchor="middle">Multi-Region Architecture</text>

  <!-- DNS Geo-Routing (top center) -->
  <g transform="translate(340, 48)">
    <rect x="0" y="0" width="200" height="44" rx="10" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
    <!-- Cloud icon -->
    <ellipse cx="28" cy="22" rx="12" ry="8" fill="none" stroke="#89b4fa" stroke-width="1.5"/>
    <ellipse cx="22" cy="26" rx="8" ry="6" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
    <ellipse cx="34" cy="26" rx="8" ry="6" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
    <rect x="14" y="26" width="28" height="6" fill="#313244"/>
    <ellipse cx="28" cy="22" rx="12" ry="8" fill="none" stroke="#89b4fa" stroke-width="1.5"/>
    <text x="110" y="20" font-family="sans-serif" font-size="13" font-weight="bold" fill="#89b4fa" text-anchor="middle">DNS Geo-Routing</text>
    <text x="110" y="36" font-family="monospace" font-size="11" fill="#7f849c" text-anchor="middle">(Route 53)</text>
  </g>

  <!-- Arrows from DNS down to US and EU -->
  <line x1="380" y1="92" x2="210" y2="130" stroke="#89b4fa" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="500" y1="92" x2="670" y2="130" stroke="#89b4fa" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- User labels -->
  <text x="210" y="125" font-family="sans-serif" font-size="12" fill="#cdd6f4" text-anchor="middle">US Riders</text>
  <text x="670" y="125" font-family="sans-serif" font-size="12" fill="#cdd6f4" text-anchor="middle">EU Riders</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#89b4fa"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a6e3a1"/>
    </marker>
    <marker id="arrowPink" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f38ba8"/>
    </marker>
  </defs>

  <!-- US-East Region Box -->
  <g transform="translate(60, 140)">
    <rect x="0" y="0" width="300" height="380" rx="10" fill="#181825" stroke="#89b4fa" stroke-width="2" stroke-dasharray="6,3"/>
    <text x="150" y="24" font-family="sans-serif" font-size="14" font-weight="bold" fill="#89b4fa" text-anchor="middle">US-East (Primary)</text>

    <!-- Services box -->
    <rect x="20" y="40" width="260" height="110" rx="8" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
    <text x="150" y="62" font-family="sans-serif" font-size="13" font-weight="bold" fill="#cdd6f4" text-anchor="middle">Application Services</text>
    <text x="150" y="84" font-family="monospace" font-size="12" fill="#89b4fa" text-anchor="middle">Rider API  ·  Driver API</text>
    <text x="150" y="104" font-family="monospace" font-size="12" fill="#89b4fa" text-anchor="middle">Surge Pricing  ·  Fare Service</text>
    <line x1="40" y1="118" x2="260" y2="118" stroke="#585b70" stroke-width="0.5"/>
    <text x="150" y="138" font-family="sans-serif" font-size="10" fill="#a6e3a1" text-anchor="middle">4 pods per service (HPA)</text>

    <!-- PostgreSQL box -->
    <rect x="20" y="170" width="260" height="70" rx="8" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
    <text x="40" y="195" font-family="sans-serif" font-size="13" font-weight="bold" fill="#a6e3a1">PostgreSQL</text>
    <text x="40" y="215" font-family="sans-serif" font-size="11" fill="#cdd6f4">(Primary - Read/Write)</text>
    <!-- DB icon -->
    <ellipse cx="245" cy="195" rx="18" ry="8" fill="none" stroke="#a6e3a1" stroke-width="1.5"/>
    <rect x="227" y="195" width="36" height="20" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
    <ellipse cx="245" cy="215" rx="18" ry="8" fill="none" stroke="#a6e3a1" stroke-width="1.5"/>

    <!-- Redis box -->
    <rect x="20" y="260" width="260" height="60" rx="8" fill="#313244" stroke="#f38ba8" stroke-width="1.5"/>
    <text x="40" y="285" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f38ba8">Redis (Regional)</text>
    <text x="40" y="305" font-family="sans-serif" font-size="11" fill="#cdd6f4">Surge cache + session data</text>

    <!-- Status badge -->
    <rect x="195" y="340" width="85" height="26" rx="13" fill="#a6e3a1" fill-opacity="0.15" stroke="#a6e3a1" stroke-width="1"/>
    <text x="237" y="358" font-family="sans-serif" font-size="11" font-weight="bold" fill="#a6e3a1" text-anchor="middle">PRIMARY</text>
  </g>

  <!-- EU-West Region Box -->
  <g transform="translate(520, 140)">
    <rect x="0" y="0" width="300" height="380" rx="10" fill="#181825" stroke="#89b4fa" stroke-width="2" stroke-dasharray="6,3"/>
    <text x="150" y="24" font-family="sans-serif" font-size="14" font-weight="bold" fill="#89b4fa" text-anchor="middle">EU-West (Secondary)</text>

    <!-- Services box -->
    <rect x="20" y="40" width="260" height="110" rx="8" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
    <text x="150" y="62" font-family="sans-serif" font-size="13" font-weight="bold" fill="#cdd6f4" text-anchor="middle">Application Services</text>
    <text x="150" y="84" font-family="monospace" font-size="12" fill="#89b4fa" text-anchor="middle">Rider API  ·  Driver API</text>
    <text x="150" y="104" font-family="monospace" font-size="12" fill="#89b4fa" text-anchor="middle">Surge Pricing  ·  Fare Service</text>
    <line x1="40" y1="118" x2="260" y2="118" stroke="#585b70" stroke-width="0.5"/>
    <text x="150" y="138" font-family="sans-serif" font-size="10" fill="#a6e3a1" text-anchor="middle">4 pods per service (HPA)</text>

    <!-- PostgreSQL box -->
    <rect x="20" y="170" width="260" height="70" rx="8" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
    <text x="40" y="195" font-family="sans-serif" font-size="13" font-weight="bold" fill="#a6e3a1">PostgreSQL</text>
    <text x="40" y="215" font-family="sans-serif" font-size="11" fill="#cdd6f4">(Replica - Read Only)</text>
    <!-- DB icon -->
    <ellipse cx="245" cy="195" rx="18" ry="8" fill="none" stroke="#a6e3a1" stroke-width="1.5"/>
    <rect x="227" y="195" width="36" height="20" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
    <ellipse cx="245" cy="215" rx="18" ry="8" fill="none" stroke="#a6e3a1" stroke-width="1.5"/>

    <!-- Redis box -->
    <rect x="20" y="260" width="260" height="60" rx="8" fill="#313244" stroke="#f38ba8" stroke-width="1.5"/>
    <text x="40" y="285" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f38ba8">Redis (Regional)</text>
    <text x="40" y="305" font-family="sans-serif" font-size="11" fill="#cdd6f4">Surge cache + session data</text>

    <!-- Status badge -->
    <rect x="185" y="340" width="95" height="26" rx="13" fill="#f9e2af" fill-opacity="0.15" stroke="#f9e2af" stroke-width="1"/>
    <text x="232" y="358" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f9e2af" text-anchor="middle">SECONDARY</text>
  </g>

  <!-- Async replication arrow (US PG → EU PG) -->
  <line x1="340" y1="350" x2="520" y2="350" stroke="#a6e3a1" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowGreen)"/>
  <text x="430" y="342" font-family="sans-serif" font-size="11" fill="#a6e3a1" text-anchor="middle">async replication</text>

  <!-- Kafka bus at bottom -->
  <rect x="120" y="535" width="640" height="34" rx="8" fill="#313244" stroke="#f9e2af" stroke-width="2"/>
  <text x="440" y="558" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f9e2af" text-anchor="middle">Kafka (Cross-Region Event Bus)</text>

  <!-- Arrows from regions down to Kafka -->
  <line x1="210" y1="520" x2="210" y2="535" stroke="#f9e2af" stroke-width="1.5" marker-end="url(#arrowPink)"/>
  <line x1="670" y1="520" x2="670" y2="535" stroke="#f9e2af" stroke-width="1.5" marker-end="url(#arrowPink)"/>
  <line x1="210" y1="535" x2="210" y2="520" stroke="#f9e2af" stroke-width="1.5"/>
  <line x1="670" y1="535" x2="670" y2="520" stroke="#f9e2af" stroke-width="1.5"/>
</svg>