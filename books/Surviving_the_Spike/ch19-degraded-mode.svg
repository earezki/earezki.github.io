<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560">
  <defs>
    <marker id="arrowLoad" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f9e2af"/>
    </marker>
  </defs>
  <rect width="880" height="560" rx="8" fill="#1e1e2e"/>
  <text x="440" y="35" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#cdd6f4">Feature Criticality &amp; Graceful Degradation</text>

  <!-- Outer ring: Non-critical (red when degraded) -->
  <ellipse cx="440" cy="280" rx="380" ry="220" fill="none" stroke="#f38ba8" stroke-width="2" stroke-dasharray="8,4"/>
  <ellipse cx="440" cy="280" rx="380" ry="220" fill="#f38ba8" opacity="0.05"/>

  <!-- Middle ring: Optional (yellow) -->
  <ellipse cx="440" cy="280" rx="255" ry="150" fill="none" stroke="#f9e2af" stroke-width="2"/>
  <ellipse cx="440" cy="280" rx="255" ry="150" fill="#f9e2af" opacity="0.05"/>

  <!-- Core ring (green, always on) -->
  <ellipse cx="440" cy="280" rx="130" ry="85" fill="#1e3a2a" stroke="#a6e3a1" stroke-width="3"/>

  <!-- Core labels -->
  <text x="440" y="250" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#a6e3a1">CORE</text>
  <text x="440" y="270" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#a6e3a1">Booking</text>
  <text x="440" y="288" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#a6e3a1">Fare Calculation</text>
  <text x="440" y="306" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#a6e3a1">Driver Matching</text>
  <text x="440" y="330" text-anchor="middle" font-family="monospace" font-size="10" fill="#a6e3a1">Always ON</text>

  <!-- Middle ring labels -->
  <text x="240" y="195" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f9e2af">Surge Pricing</text>
  <text x="240" y="210" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f9e2af">Display</text>
  <text x="640" y="195" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f9e2af">ETA</text>
  <text x="640" y="210" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f9e2af">Refinement</text>
  <text x="440" y="410" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f9e2af">Ride History</text>

  <!-- Ring label: OPTIONAL -->
  <rect x="575" y="385" width="115" height="22" rx="4" fill="#313244" stroke="#f9e2af" stroke-width="1"/>
  <text x="632" y="400" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f9e2af">OPTIONAL</text>

  <!-- Outer ring labels -->
  <text x="130" y="130" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f38ba8">Analytics</text>
  <text x="750" y="130" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f38ba8">Promotions</text>
  <text x="130" y="440" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f38ba8">Recommendations</text>
  <text x="750" y="440" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f38ba8">Social Features</text>

  <!-- Ring label: NON-CRITICAL -->
  <rect x="118" y="460" width="140" height="22" rx="4" fill="#313244" stroke="#f38ba8" stroke-width="1"/>
  <text x="188" y="475" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f38ba8">NON-CRITICAL</text>

  <!-- X marks on outer ring items (disabled) -->
  <text x="175" y="135" font-family="sans-serif" font-size="18" font-weight="bold" fill="#f38ba8">&#x2717;</text>
  <text x="795" y="135" font-family="sans-serif" font-size="18" font-weight="bold" fill="#f38ba8">&#x2717;</text>
  <text x="175" y="445" font-family="sans-serif" font-size="18" font-weight="bold" fill="#f38ba8">&#x2717;</text>
  <text x="795" y="445" font-family="sans-serif" font-size="18" font-weight="bold" fill="#f38ba8">&#x2717;</text>

  <!-- Simplified markers on middle ring -->
  <text x="285" y="200" font-family="sans-serif" font-size="14" fill="#f9e2af">~</text>
  <text x="685" y="200" font-family="sans-serif" font-size="14" fill="#f9e2af">~</text>
  <text x="490" y="415" font-family="sans-serif" font-size="14" fill="#f9e2af">~</text>

  <!-- "Under Load" arrow -->
  <rect x="30" y="265" width="85" height="30" rx="6" fill="#313244" stroke="#f9e2af" stroke-width="1.5"/>
  <text x="72" y="285" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f9e2af">LOAD &#x2191;</text>
  <line x1="115" y1="280" x2="155" y2="280" stroke="#f9e2af" stroke-width="2" marker-end="url(#arrowLoad)"/>

  <!-- Degradation indicator -->
  <rect x="620" y="80" width="230" height="80" rx="6" fill="#313244" stroke="#45475a" stroke-width="1"/>
  <text x="735" y="100" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#cdd6f4">Under Load:</text>
  <circle cx="640" cy="118" r="5" fill="#f38ba8"/>
  <text x="653" y="122" font-family="sans-serif" font-size="11" fill="#f38ba8">Outer ring: disabled</text>
  <circle cx="640" cy="138" r="5" fill="#f9e2af"/>
  <text x="653" y="142" font-family="sans-serif" font-size="11" fill="#f9e2af">Middle ring: simplified</text>
  <circle cx="640" cy="155" r="5" fill="#a6e3a1"/>
  <text x="653" y="159" font-family="sans-serif" font-size="11" fill="#a6e3a1">Core: fully operational</text>

  <!-- Bottom summary -->
  <rect x="250" y="510" width="380" height="30" rx="6" fill="#313244" stroke="#a6e3a1" stroke-width="1"/>
  <text x="440" y="530" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#a6e3a1">Core booking flow protected at all times</text>
</svg>