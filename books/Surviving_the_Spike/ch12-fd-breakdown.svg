<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440">
  <rect width="880" height="440" rx="8" fill="#1e1e2e"/>

  <text x="440" y="35" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#cdd6f4">File Descriptor Allocation per Pod</text>

  <!-- Y-axis labels -->
  <text x="56" y="80" text-anchor="end" font-family="monospace" font-size="11" fill="#cdd6f4">SSE connections</text>
  <text x="56" y="130" text-anchor="end" font-family="monospace" font-size="11" fill="#cdd6f4">JVM internals</text>
  <text x="56" y="180" text-anchor="end" font-family="monospace" font-size="11" fill="#cdd6f4">Ephemeral sockets</text>
  <text x="56" y="230" text-anchor="end" font-family="monospace" font-size="11" fill="#cdd6f4">Netty event loop</text>
  <text x="56" y="280" text-anchor="end" font-family="monospace" font-size="11" fill="#cdd6f4">Redis connections</text>
  <text x="56" y="330" text-anchor="end" font-family="monospace" font-size="11" fill="#cdd6f4">Log files</text>

  <!-- Scale: max ~65536, chart width 740px. 20000 → 226px -->
  <!-- Horizontal bars -->
  <rect x="65" y="66" width="226" height="24" rx="3" fill="#89b4fa"/>
  <text x="296" y="83" font-family="monospace" font-size="12" fill="#89b4fa" font-weight="bold">20,000</text>

  <rect x="65" y="116" width="2" height="24" rx="3" fill="#a6e3a1"/>
  <text x="74" y="133" font-family="monospace" font-size="12" fill="#a6e3a1">200</text>

  <rect x="65" y="166" width="1" height="24" rx="3" fill="#cba6f7"/>
  <text x="74" y="183" font-family="monospace" font-size="12" fill="#cba6f7">100</text>

  <rect x="65" y="216" width="1" height="24" rx="3" fill="#f9e2af"/>
  <text x="74" y="233" font-family="monospace" font-size="12" fill="#f9e2af">64</text>

  <rect x="65" y="266" width="1" height="24" rx="3" fill="#fab387"/>
  <text x="74" y="283" font-family="monospace" font-size="12" fill="#fab387">50</text>

  <rect x="65" y="316" width="1" height="24" rx="3" fill="#585b70"/>
  <text x="74" y="333" font-family="monospace" font-size="12" fill="#585b70">10</text>

  <!-- Soft limit line: 1024 → 11.5px -->
  <line x1="77" y1="55" x2="77" y2="350" stroke="#f38ba8" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="79" y="362" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f38ba8">Soft limit: 1,024</text>
  <text x="79" y="376" font-family="sans-serif" font-size="10" fill="#f38ba8">← default kills at 974 SSE conns!</text>

  <!-- Hard limit line: 65536 → 740px -->
  <line x1="805" y1="55" x2="805" y2="350" stroke="#a6e3a1" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="803" y="362" text-anchor="end" font-family="sans-serif" font-size="11" font-weight="bold" fill="#a6e3a1">Hard limit: 65,536</text>

  <!-- Total box -->
  <rect x="400" y="70" width="360" height="55" rx="6" fill="#89b4fa" opacity="0.1" stroke="#89b4fa" stroke-width="1"/>
  <text x="580" y="92" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#cdd6f4">Total required: 20,424 FDs</text>
  <text x="580" y="112" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#585b70">98% are SSE connections</text>

  <!-- Recommendation -->
  <rect x="120" y="393" width="640" height="34" rx="6" fill="#a6e3a1" opacity="0.1" stroke="#a6e3a1" stroke-width="1"/>
  <text x="440" y="415" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#a6e3a1">Set ulimit -n 131072 — both soft and hard — in container base image or pod securityContext</text>
</svg>