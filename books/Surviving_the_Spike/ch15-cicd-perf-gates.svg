<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#cdd6f4"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a6e3a1"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f38ba8"/>
    </marker>
  </defs>
  <rect width="880" height="520" rx="8" fill="#1e1e2e"/>
  <text x="440" y="35" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#cdd6f4">CI/CD Pipeline with Performance Gate</text>

  <!-- Code Commit -->
  <rect x="30" y="100" width="110" height="50" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="85" y="130" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#cdd6f4">Code Commit</text>

  <!-- Build -->
  <rect x="175" y="100" width="90" height="50" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="220" y="130" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#cdd6f4">Build</text>
  <text x="220" y="165" text-anchor="middle" font-family="monospace" font-size="10" fill="#6c7086">45s</text>

  <!-- Unit Tests -->
  <rect x="300" y="100" width="100" height="50" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="350" y="130" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#cdd6f4">Unit Tests</text>
  <text x="350" y="165" text-anchor="middle" font-family="monospace" font-size="10" fill="#6c7086">90s</text>

  <!-- Load Test -->
  <rect x="435" y="100" width="110" height="50" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="490" y="122" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#cdd6f4">Load Test</text>
  <text x="490" y="140" text-anchor="middle" font-family="monospace" font-size="11" fill="#89b4fa">(Locust)</text>
  <text x="490" y="165" text-anchor="middle" font-family="monospace" font-size="10" fill="#6c7086">180s</text>

  <!-- Arrows top row -->
  <line x1="140" y1="125" x2="173" y2="125" stroke="#cdd6f4" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="265" y1="125" x2="298" y2="125" stroke="#cdd6f4" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="125" x2="433" y2="125" stroke="#cdd6f4" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Performance Gate (diamond) -->
  <polygon points="630,125 700,80 770,125 700,170" fill="#313244" stroke="#f9e2af" stroke-width="2.5"/>
  <text x="700" y="118" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f9e2af">Performance</text>
  <text x="700" y="135" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f9e2af">Gate</text>

  <!-- Arrow to gate -->
  <line x1="545" y1="125" x2="628" y2="125" stroke="#cdd6f4" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="586" y="115" text-anchor="middle" font-family="monospace" font-size="10" fill="#6c7086">p99 check</text>

  <!-- GREEN PATH -->
  <text x="700" y="210" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#a6e3a1">p99 &lt; threshold</text>

  <!-- Deploy to Staging -->
  <rect x="470" y="240" width="120" height="45" rx="6" fill="#1e3a2a" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="530" y="260" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#a6e3a1">Deploy to</text>
  <text x="530" y="275" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#a6e3a1">Staging</text>

  <!-- Canary Deploy -->
  <rect x="620" y="240" width="110" height="45" rx="6" fill="#1e3a2a" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="675" y="260" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#a6e3a1">Canary</text>
  <text x="675" y="275" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#a6e3a1">Deploy</text>

  <!-- Production -->
  <rect x="760" y="240" width="100" height="45" rx="6" fill="#1e3a2a" stroke="#a6e3a1" stroke-width="2"/>
  <text x="810" y="268" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#a6e3a1">Production</text>

  <!-- Green path arrows -->
  <line x1="700" y1="170" x2="700" y2="195" stroke="#a6e3a1" stroke-width="1.5"/>
  <line x1="700" y1="195" x2="530" y2="195" stroke="#a6e3a1" stroke-width="1.5"/>
  <line x1="530" y1="195" x2="530" y2="238" stroke="#a6e3a1" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="590" y1="262" x2="618" y2="262" stroke="#a6e3a1" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="730" y1="262" x2="758" y2="262" stroke="#a6e3a1" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Checkmark in production -->
  <text x="810" y="305" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#a6e3a1">&#x2713;</text>

  <!-- RED PATH -->
  <text x="700" y="60" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f38ba8">p99 &gt; threshold</text>

  <!-- Block Deploy -->
  <rect x="470" y="350" width="120" height="45" rx="6" fill="#3a1e2a" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="530" y="370" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f38ba8">Block</text>
  <text x="530" y="385" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f38ba8">Deploy</text>

  <!-- Alert Team -->
  <rect x="620" y="350" width="110" height="45" rx="6" fill="#3a1e2a" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="675" y="370" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f38ba8">Alert Team</text>
  <text x="675" y="385" text-anchor="middle" font-family="monospace" font-size="10" fill="#f38ba8">PR Comment</text>

  <!-- Post Results -->
  <rect x="760" y="350" width="100" height="45" rx="6" fill="#3a1e2a" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="810" y="370" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#f38ba8">Regression</text>
  <text x="810" y="385" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#f38ba8">Report</text>

  <!-- Red path arrows -->
  <line x1="700" y1="80" x2="700" y2="55" stroke="#f38ba8" stroke-width="1.5"/>
  <line x1="700" y1="55" x2="830" y2="55" stroke="#f38ba8" stroke-width="1.5"/>
  <line x1="830" y1="55" x2="830" y2="320" stroke="#f38ba8" stroke-width="1.5"/>
  <line x1="830" y1="320" x2="530" y2="320" stroke="#f38ba8" stroke-width="1.5"/>
  <line x1="530" y1="320" x2="530" y2="348" stroke="#f38ba8" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <line x1="590" y1="372" x2="618" y2="372" stroke="#f38ba8" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <line x1="730" y1="372" x2="758" y2="372" stroke="#f38ba8" stroke-width="1.5" marker-end="url(#arrow-red)"/>

  <!-- X in block -->
  <text x="810" y="415" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#f38ba8">&#x2717;</text>

  <!-- Legend -->
  <rect x="30" y="440" width="240" height="60" rx="6" fill="#313244" stroke="#45475a" stroke-width="1"/>
  <text x="50" y="462" font-family="sans-serif" font-size="11" fill="#6c7086">Legend:</text>
  <line x1="50" y1="480" x2="80" y2="480" stroke="#a6e3a1" stroke-width="2"/>
  <text x="90" y="484" font-family="sans-serif" font-size="11" fill="#a6e3a1">Pass — deploy proceeds</text>
  <line x1="50" y1="495" x2="80" y2="495" stroke="#f38ba8" stroke-width="2"/>
  <text x="90" y="499" font-family="sans-serif" font-size="11" fill="#f38ba8">Fail — deploy blocked</text>
</svg>