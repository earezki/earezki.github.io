<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520">
  <rect width="880" height="520" rx="12" fill="#1e1e2e"/>

  <!-- Title -->
  <text x="440" y="35" font-family="sans-serif" font-size="18" font-weight="bold" fill="#cdd6f4" text-anchor="middle">Infrastructure Cost: Single-Region vs Multi-Region</text>

  <!-- Legend -->
  <rect x="290" y="48" width="16" height="14" rx="3" fill="#89b4fa"/>
  <text x="312" y="60" font-family="sans-serif" font-size="12" fill="#cdd6f4">Single-Region (3 AZ)</text>
  <rect x="470" y="48" width="16" height="14" rx="3" fill="#f38ba8"/>
  <text x="492" y="60" font-family="sans-serif" font-size="12" fill="#cdd6f4">Multi-Region (+ EU-West)</text>

  <!-- Chart area -->
  <!-- Y-axis -->
  <line x1="140" y1="80" x2="140" y2="430" stroke="#585b70" stroke-width="1"/>
  <!-- X-axis -->
  <line x1="140" y1="430" x2="830" y2="430" stroke="#585b70" stroke-width="1"/>

  <!-- Y-axis labels and gridlines -->
  <!-- Max value ~$8,400. Scale: 1px = ~$24. Chart height = 350px -->
  <!-- $0 -->
  <text x="130" y="434" font-family="monospace" font-size="11" fill="#7f849c" text-anchor="end">$0</text>
  <!-- $2,000 -->
  <text x="130" y="351" font-family="monospace" font-size="11" fill="#7f849c" text-anchor="end">$2K</text>
  <line x1="140" y1="348" x2="830" y2="348" stroke="#585b70" stroke-width="0.5" stroke-dasharray="3,3"/>
  <!-- $4,000 -->
  <text x="130" y="268" font-family="monospace" font-size="11" fill="#7f849c" text-anchor="end">$4K</text>
  <line x1="140" y1="265" x2="830" y2="265" stroke="#585b70" stroke-width="0.5" stroke-dasharray="3,3"/>
  <!-- $6,000 -->
  <text x="130" y="185" font-family="monospace" font-size="11" fill="#7f849c" text-anchor="end">$6K</text>
  <line x1="140" y1="182" x2="830" y2="182" stroke="#585b70" stroke-width="0.5" stroke-dasharray="3,3"/>
  <!-- $8,000 -->
  <text x="130" y="102" font-family="monospace" font-size="11" fill="#7f849c" text-anchor="end">$8K</text>
  <line x1="140" y1="99" x2="830" y2="99" stroke="#585b70" stroke-width="0.5" stroke-dasharray="3,3"/>

  <!-- Scale: $1 = 350/8500 = 0.0412px. Let's use chart bottom=430, each $1K = 41.2px -->
  <!-- Bar groups: Compute, PostgreSQL, Redis, LB, Data Xfer, Monitoring, Ops, TOTAL -->
  <!-- Group width = 80px, gap = 8px. Bar width = 30px each -->

  <!-- Compute: Single=$4,200 Multi=$8,400 -->
  <g transform="translate(165, 0)">
    <rect x="0" y="{430 - 173}" width="30" height="173" rx="3" fill="#89b4fa"/>
    <text x="15" y="{430 - 173 - 5}" font-family="monospace" font-size="10" fill="#89b4fa" text-anchor="middle">$4.2K</text>
    <rect x="0" y="257" width="30" height="173" rx="3" fill="#89b4fa"/>
    <text x="15" y="252" font-family="monospace" font-size="10" fill="#89b4fa" text-anchor="middle">$4.2K</text>
    <rect x="35" y="84" width="30" height="346" rx="3" fill="#f38ba8"/>
    <text x="50" y="79" font-family="monospace" font-size="10" fill="#f38ba8" text-anchor="middle">$8.4K</text>
    <text x="32" y="452" font-family="sans-serif" font-size="11" fill="#cdd6f4" text-anchor="middle">Compute</text>
  </g>

  <!-- PostgreSQL: Single=$2,800 Multi=$5,600 -->
  <g transform="translate(260, 0)">
    <rect x="0" y="315" width="30" height="115" rx="3" fill="#89b4fa"/>
    <text x="15" y="310" font-family="monospace" font-size="10" fill="#89b4fa" text-anchor="middle">$2.8K</text>
    <rect x="35" y="199" width="30" height="231" rx="3" fill="#f38ba8"/>
    <text x="50" y="194" font-family="monospace" font-size="10" fill="#f38ba8" text-anchor="middle">$5.6K</text>
    <text x="32" y="452" font-family="sans-serif" font-size="11" fill="#cdd6f4" text-anchor="middle">PostgreSQL</text>
  </g>

  <!-- Redis: Single=$1,200 Multi=$2,400 -->
  <g transform="translate(355, 0)">
    <rect x="0" y="381" width="30" height="49" rx="3" fill="#89b4fa"/>
    <text x="15" y="376" font-family="monospace" font-size="10" fill="#89b4fa" text-anchor="middle">$1.2K</text>
    <rect x="35" y="331" width="30" height="99" rx="3" fill="#f38ba8"/>
    <text x="50" y="326" font-family="monospace" font-size="10" fill="#f38ba8" text-anchor="middle">$2.4K</text>
    <text x="32" y="452" font-family="sans-serif" font-size="11" fill="#cdd6f4" text-anchor="middle">Redis</text>
  </g>

  <!-- Load Balancer: Single=$400 Multi=$800 -->
  <g transform="translate(450, 0)">
    <rect x="0" y="414" width="30" height="16" rx="3" fill="#89b4fa"/>
    <text x="15" y="409" font-family="monospace" font-size="10" fill="#89b4fa" text-anchor="middle">$0.4K</text>
    <rect x="35" y="397" width="30" height="33" rx="3" fill="#f38ba8"/>
    <text x="50" y="392" font-family="monospace" font-size="10" fill="#f38ba8" text-anchor="middle">$0.8K</text>
    <text x="32" y="452" font-family="sans-serif" font-size="11" fill="#cdd6f4" text-anchor="middle">LB</text>
  </g>

  <!-- Data Transfer: Single=$600 Multi=$2,100 -->
  <g transform="translate(530, 0)">
    <rect x="0" y="405" width="30" height="25" rx="3" fill="#89b4fa"/>
    <text x="15" y="400" font-family="monospace" font-size="10" fill="#89b4fa" text-anchor="middle">$0.6K</text>
    <rect x="35" y="344" width="30" height="86" rx="3" fill="#f38ba8"/>
    <text x="50" y="339" font-family="monospace" font-size="10" fill="#f38ba8" text-anchor="middle">$2.1K</text>
    <text x="32" y="452" font-family="sans-serif" font-size="11" fill="#cdd6f4" text-anchor="middle">Data Xfer</text>
  </g>

  <!-- Monitoring: Single=$300 Multi=$700 -->
  <g transform="translate(625, 0)">
    <rect x="0" y="418" width="30" height="12" rx="3" fill="#89b4fa"/>
    <text x="15" y="413" font-family="monospace" font-size="10" fill="#89b4fa" text-anchor="middle">$0.3K</text>
    <rect x="35" y="401" width="30" height="29" rx="3" fill="#f38ba8"/>
    <text x="50" y="396" font-family="monospace" font-size="10" fill="#f38ba8" text-anchor="middle">$0.7K</text>
    <text x="32" y="452" font-family="sans-serif" font-size="11" fill="#cdd6f4" text-anchor="middle">Monitoring</text>
  </g>

  <!-- Ops: Single=$0 Multi=$4,800 -->
  <g transform="translate(720, 0)">
    <rect x="0" y="429" width="30" height="1" rx="3" fill="#89b4fa"/>
    <text x="15" y="424" font-family="monospace" font-size="10" fill="#89b4fa" text-anchor="middle">$0</text>
    <rect x="35" y="232" width="30" height="198" rx="3" fill="#f38ba8"/>
    <text x="50" y="227" font-family="monospace" font-size="10" fill="#f38ba8" text-anchor="middle">$4.8K</text>
    <text x="32" y="452" font-family="sans-serif" font-size="11" fill="#cdd6f4" text-anchor="middle">Ops (FTE)</text>
  </g>

  <!-- Totals summary -->
  <rect x="200" y="472" width="480" height="40" rx="8" fill="#313244" stroke="#585b70" stroke-width="1"/>
  <text x="310" y="494" font-family="sans-serif" font-size="14" fill="#89b4fa" text-anchor="middle">Single: $9,500/mo</text>
  <text x="490" y="494" font-family="sans-serif" font-size="14" fill="#f38ba8" text-anchor="middle">Multi: $24,800/mo</text>
  <rect x="590" y="477" width="80" height="30" rx="6" fill="#f38ba8" fill-opacity="0.2" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="630" y="497" font-family="sans-serif" font-size="16" font-weight="bold" fill="#f38ba8" text-anchor="middle">2.6x</text>
</svg>