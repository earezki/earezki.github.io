<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450">
  <rect width="880" height="450" rx="8" fill="#1e1e2e"/>
  <text x="440" y="35" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#cdd6f4">Trace Waterfall — POST /api/rides/request (8.1s)</text>

  <!-- Time axis -->
  <line x1="250" y1="60" x2="850" y2="60" stroke="#45475a" stroke-width="1"/>
  <!-- Time labels -->
  <text x="250" y="55" text-anchor="middle" font-family="monospace" font-size="10" fill="#6c7086">0s</text>
  <text x="324" y="55" text-anchor="middle" font-family="monospace" font-size="10" fill="#6c7086">1s</text>
  <text x="398" y="55" text-anchor="middle" font-family="monospace" font-size="10" fill="#6c7086">2s</text>
  <text x="472" y="55" text-anchor="middle" font-family="monospace" font-size="10" fill="#6c7086">3s</text>
  <text x="546" y="55" text-anchor="middle" font-family="monospace" font-size="10" fill="#6c7086">4s</text>
  <text x="620" y="55" text-anchor="middle" font-family="monospace" font-size="10" fill="#6c7086">5s</text>
  <text x="694" y="55" text-anchor="middle" font-family="monospace" font-size="10" fill="#6c7086">6s</text>
  <text x="768" y="55" text-anchor="middle" font-family="monospace" font-size="10" fill="#6c7086">7s</text>
  <text x="842" y="55" text-anchor="middle" font-family="monospace" font-size="10" fill="#6c7086">8s</text>
  <!-- Grid lines -->
  <line x1="324" y1="60" x2="324" y2="380" stroke="#313244" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="398" y1="60" x2="398" y2="380" stroke="#313244" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="472" y1="60" x2="472" y2="380" stroke="#313244" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="546" y1="60" x2="546" y2="380" stroke="#313244" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="620" y1="60" x2="620" y2="380" stroke="#313244" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="694" y1="60" x2="694" y2="380" stroke="#313244" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="768" y1="60" x2="768" y2="380" stroke="#313244" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Row 1: rider-api POST /api/rides/request  8.1s => full width -->
  <text x="240" y="95" text-anchor="end" font-family="monospace" font-size="12" fill="#cdd6f4">rider-api</text>
  <rect x="250" y="80" width="600" height="24" rx="4" fill="#89b4fa" opacity="0.3"/>
  <rect x="250" y="80" width="600" height="24" rx="4" fill="none" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="545" y="96" text-anchor="middle" font-family="monospace" font-size="11" fill="#cdd6f4">POST /api/rides/request — 8.1s</text>

  <!-- Row 2: fare.calculate  7.6s  (starts ~0, length 7.6/8.1 * 600 = 563) -->
  <text x="240" y="140" text-anchor="end" font-family="monospace" font-size="11" fill="#cdd6f4">fare.calculate</text>
  <rect x="255" y="125" width="563" height="22" rx="4" fill="#89b4fa" opacity="0.2"/>
  <rect x="255" y="125" width="563" height="22" rx="4" fill="none" stroke="#89b4fa" stroke-width="1"/>
  <text x="530" y="140" text-anchor="middle" font-family="monospace" font-size="10" fill="#89b4fa">7.6s</text>

  <!-- Row 3: fare.surge_pricing  45ms  (tiny bar) -->
  <text x="240" y="185" text-anchor="end" font-family="monospace" font-size="11" fill="#cdd6f4">fare.surge_pricing</text>
  <rect x="260" y="170" width="6" height="22" rx="3" fill="#a6e3a1"/>
  <text x="275" y="185" text-anchor="start" font-family="monospace" font-size="10" fill="#a6e3a1">45ms</text>

  <!-- Row 4: r2dbc.query SELECT pricing_rules  7.5s  BOTTLENECK (starts after surge, length ~556) -->
  <text x="240" y="230" text-anchor="end" font-family="monospace" font-size="11" fill="#f38ba8" font-weight="bold">r2dbc.query</text>
  <rect x="266" y="215" width="556" height="24" rx="4" fill="#f38ba8" opacity="0.25"/>
  <rect x="266" y="215" width="556" height="24" rx="4" fill="none" stroke="#f38ba8" stroke-width="2"/>
  <text x="540" y="231" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#f38ba8">SELECT pricing_rules — 7.5s</text>
  <!-- Bottleneck callout -->
  <rect x="560" y="245" width="200" height="22" rx="4" fill="#f38ba8" opacity="0.15"/>
  <text x="660" y="260" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f38ba8">&#x26A0; Connection Pool Wait</text>

  <!-- Row 5: fare.apply_promotions  12ms  -->
  <text x="240" y="295" text-anchor="end" font-family="monospace" font-size="11" fill="#cdd6f4">fare.apply_promotions</text>
  <rect x="822" y="280" width="3" height="22" rx="1.5" fill="#a6e3a1"/>
  <text x="833" y="295" text-anchor="start" font-family="monospace" font-size="10" fill="#a6e3a1">12ms</text>

  <!-- Row 6: driver.matching  380ms  (starts at ~7.6s, length ~28) -->
  <text x="240" y="335" text-anchor="end" font-family="monospace" font-size="11" fill="#cdd6f4">driver.matching</text>
  <rect x="818" y="320" width="28" height="22" rx="4" fill="#89b4fa" opacity="0.5"/>
  <rect x="818" y="320" width="28" height="22" rx="4" fill="none" stroke="#89b4fa" stroke-width="1"/>
  <text x="832" y="355" text-anchor="middle" font-family="monospace" font-size="10" fill="#89b4fa">380ms</text>

  <!-- Row 7: kafka.produce  22ms  -->
  <text x="240" y="380" text-anchor="end" font-family="monospace" font-size="11" fill="#cdd6f4">kafka.produce</text>
  <rect x="846" y="365" width="4" height="22" rx="2" fill="#a6e3a1"/>
  <text x="857" y="380" text-anchor="start" font-family="monospace" font-size="10" fill="#a6e3a1">22ms</text>

  <!-- Legend -->
  <rect x="30" y="405" width="350" height="35" rx="6" fill="#313244" stroke="#45475a" stroke-width="1"/>
  <rect x="45" y="416" width="12" height="12" rx="2" fill="#f38ba8"/>
  <text x="63" y="426" font-family="sans-serif" font-size="11" fill="#f38ba8">Bottleneck (pool wait)</text>
  <rect x="200" y="416" width="12" height="12" rx="2" fill="#89b4fa"/>
  <text x="218" y="426" font-family="sans-serif" font-size="11" fill="#89b4fa">Normal span</text>
  <rect x="295" y="416" width="12" height="12" rx="2" fill="#a6e3a1"/>
  <text x="313" y="426" font-family="sans-serif" font-size="11" fill="#a6e3a1">Fast span</text>
</svg>