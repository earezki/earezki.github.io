<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" width="880" height="580">
  <rect width="880" height="580" rx="12" fill="#1e1e2e"/>

  <!-- Title -->
  <text x="440" y="32" font-family="sans-serif" font-size="18" font-weight="bold" fill="#cdd6f4" text-anchor="middle">The Strangler Fig Pattern: Incremental Extraction</text>

  <defs>
    <marker id="arrW" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#cdd6f4"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#a6e3a1"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f38ba8"/>
    </marker>
  </defs>

  <!-- ===== PHASE 1: BEFORE ===== -->
  <g transform="translate(0, 48)">
    <!-- Phase label -->
    <rect x="25" y="12" width="100" height="26" rx="6" fill="#f38ba8" fill-opacity="0.15" stroke="#f38ba8" stroke-width="1"/>
    <text x="75" y="30" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f38ba8" text-anchor="middle">1. Before</text>

    <!-- Client -->
    <rect x="155" y="55" width="80" height="40" rx="8" fill="#313244" stroke="#cdd6f4" stroke-width="1.5"/>
    <text x="195" y="80" font-family="sans-serif" font-size="13" fill="#cdd6f4" text-anchor="middle">Client</text>

    <!-- Arrow -->
    <line x1="235" y1="75" x2="310" y2="75" stroke="#cdd6f4" stroke-width="2" marker-end="url(#arrW)"/>

    <!-- Monolith (big red box) -->
    <rect x="320" y="20" width="300" height="110" rx="10" fill="#45475a" stroke="#f38ba8" stroke-width="2.5"/>
    <text x="470" y="42" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f38ba8" text-anchor="middle">Monolith</text>
    <text x="370" y="64" font-family="monospace" font-size="11" fill="#f38ba8">fare calc</text>
    <text x="370" y="80" font-family="monospace" font-size="11" fill="#f38ba8">driver matching</text>
    <text x="510" y="64" font-family="monospace" font-size="11" fill="#f38ba8">trip mgmt</text>
    <text x="510" y="80" font-family="monospace" font-size="11" fill="#f38ba8">surge pricing</text>
    <!-- Inner border -->
    <rect x="340" y="50" width="260" height="70" rx="6" fill="none" stroke="#f38ba8" stroke-width="0.5" stroke-dasharray="4,2"/>

    <!-- Arrow to DB -->
    <line x1="620" y1="75" x2="695" y2="75" stroke="#cdd6f4" stroke-width="2" marker-end="url(#arrW)"/>

    <!-- DB -->
    <g transform="translate(705, 55)">
      <ellipse cx="30" cy="8" rx="30" ry="10" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
      <rect x="0" y="8" width="60" height="25" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
      <ellipse cx="30" cy="33" rx="30" ry="10" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
      <ellipse cx="30" cy="8" rx="30" ry="10" fill="none" stroke="#a6e3a1" stroke-width="1.5"/>
      <text x="30" y="27" font-family="sans-serif" font-size="11" fill="#a6e3a1" text-anchor="middle">DB</text>
    </g>
  </g>

  <!-- Divider -->
  <line x1="40" y1="200" x2="840" y2="200" stroke="#585b70" stroke-width="0.5" stroke-dasharray="6,4"/>

  <!-- ===== PHASE 2: DURING ===== -->
  <g transform="translate(0, 210)">
    <!-- Phase label -->
    <rect x="25" y="12" width="100" height="26" rx="6" fill="#f9e2af" fill-opacity="0.15" stroke="#f9e2af" stroke-width="1"/>
    <text x="75" y="30" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f9e2af" text-anchor="middle">2. During</text>

    <!-- Client -->
    <rect x="80" y="55" width="80" height="40" rx="8" fill="#313244" stroke="#cdd6f4" stroke-width="1.5"/>
    <text x="120" y="80" font-family="sans-serif" font-size="13" fill="#cdd6f4" text-anchor="middle">Client</text>

    <!-- Arrow to Facade -->
    <line x1="160" y1="75" x2="225" y2="75" stroke="#cdd6f4" stroke-width="2" marker-end="url(#arrW)"/>

    <!-- Facade Router (yellow) -->
    <rect x="235" y="48" width="120" height="54" rx="8" fill="#313244" stroke="#f9e2af" stroke-width="2.5"/>
    <text x="295" y="72" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f9e2af" text-anchor="middle">Facade</text>
    <text x="295" y="88" font-family="sans-serif" font-size="10" fill="#f9e2af" text-anchor="middle">Router</text>

    <!-- Arrow to smaller Monolith -->
    <line x1="355" y1="60" x2="425" y2="45" stroke="#f38ba8" stroke-width="2" marker-end="url(#arrR)"/>
    <!-- Arrow to new service -->
    <line x1="355" y1="90" x2="425" y2="105" stroke="#a6e3a1" stroke-width="2" marker-end="url(#arrG)"/>

    <!-- Smaller Monolith (still red but smaller) -->
    <rect x="435" y="15" width="200" height="55" rx="8" fill="#45475a" stroke="#f38ba8" stroke-width="2"/>
    <text x="535" y="35" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f38ba8" text-anchor="middle">Monolith (shrinking)</text>
    <text x="535" y="55" font-family="monospace" font-size="10" fill="#f38ba8" text-anchor="middle">fare · trip · surge</text>

    <!-- New Driver Matching Service (green) -->
    <rect x="435" y="85" width="200" height="44" rx="8" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
    <text x="535" y="107" font-family="sans-serif" font-size="12" font-weight="bold" fill="#a6e3a1" text-anchor="middle">Driver Matching Service</text>
    <text x="535" y="122" font-family="sans-serif" font-size="9" fill="#a6e3a1" text-anchor="middle">(extracted)</text>

    <!-- Arrow from new service to own DB -->
    <line x1="635" y1="107" x2="705" y2="107" stroke="#a6e3a1" stroke-width="2" marker-end="url(#arrG)"/>

    <!-- Own DB -->
    <g transform="translate(715, 87)">
      <ellipse cx="25" cy="7" rx="25" ry="8" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
      <rect x="0" y="7" width="50" height="20" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
      <ellipse cx="25" cy="27" rx="25" ry="8" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
      <ellipse cx="25" cy="7" rx="25" ry="8" fill="none" stroke="#a6e3a1" stroke-width="1.5"/>
      <text x="25" y="22" font-family="sans-serif" font-size="9" fill="#a6e3a1" text-anchor="middle">Own DB</text>
    </g>

    <!-- Shared DB for monolith -->
    <line x1="635" y1="42" x2="705" y2="42" stroke="#f38ba8" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrR)"/>
    <g transform="translate(715, 22)">
      <ellipse cx="25" cy="7" rx="25" ry="8" fill="#313244" stroke="#f38ba8" stroke-width="1.5"/>
      <rect x="0" y="7" width="50" height="20" fill="#313244" stroke="#f38ba8" stroke-width="1.5"/>
      <ellipse cx="25" cy="27" rx="25" ry="8" fill="#313244" stroke="#f38ba8" stroke-width="1.5"/>
      <ellipse cx="25" cy="7" rx="25" ry="8" fill="none" stroke="#f38ba8" stroke-width="1.5"/>
      <text x="25" y="22" font-family="sans-serif" font-size="9" fill="#f38ba8" text-anchor="middle">DB</text>
    </g>
  </g>

  <!-- Divider -->
  <line x1="40" y1="370" x2="840" y2="370" stroke="#585b70" stroke-width="0.5" stroke-dasharray="6,4"/>

  <!-- ===== PHASE 3: AFTER ===== -->
  <g transform="translate(0, 378)">
    <!-- Phase label -->
    <rect x="25" y="8" width="100" height="26" rx="6" fill="#a6e3a1" fill-opacity="0.15" stroke="#a6e3a1" stroke-width="1"/>
    <text x="75" y="26" font-family="sans-serif" font-size="12" font-weight="bold" fill="#a6e3a1" text-anchor="middle">3. After</text>

    <!-- Client -->
    <rect x="55" y="60" width="80" height="40" rx="8" fill="#313244" stroke="#cdd6f4" stroke-width="1.5"/>
    <text x="95" y="85" font-family="sans-serif" font-size="13" fill="#cdd6f4" text-anchor="middle">Client</text>

    <!-- Arrow to Gateway -->
    <line x1="135" y1="80" x2="195" y2="80" stroke="#cdd6f4" stroke-width="2" marker-end="url(#arrW)"/>

    <!-- API Gateway -->
    <rect x="205" y="45" width="110" height="68" rx="8" fill="#313244" stroke="#89b4fa" stroke-width="2.5"/>
    <text x="260" y="72" font-family="sans-serif" font-size="12" font-weight="bold" fill="#89b4fa" text-anchor="middle">API</text>
    <text x="260" y="90" font-family="sans-serif" font-size="12" font-weight="bold" fill="#89b4fa" text-anchor="middle">Gateway</text>

    <!-- 4 services (all green) -->
    <!-- Fare Service -->
    <line x1="315" y1="58" x2="385" y2="30" stroke="#a6e3a1" stroke-width="1.5" marker-end="url(#arrG)"/>
    <rect x="395" y="14" width="145" height="32" rx="6" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
    <text x="467" y="35" font-family="sans-serif" font-size="11" fill="#a6e3a1" text-anchor="middle">Fare Service</text>

    <!-- Driver Matching -->
    <line x1="315" y1="68" x2="385" y2="60" stroke="#a6e3a1" stroke-width="1.5" marker-end="url(#arrG)"/>
    <rect x="395" y="48" width="145" height="32" rx="6" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
    <text x="467" y="69" font-family="sans-serif" font-size="11" fill="#a6e3a1" text-anchor="middle">Driver Matching</text>

    <!-- Trip Service -->
    <line x1="315" y1="88" x2="385" y2="96" stroke="#a6e3a1" stroke-width="1.5" marker-end="url(#arrG)"/>
    <rect x="395" y="82" width="145" height="32" rx="6" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
    <text x="467" y="103" font-family="sans-serif" font-size="11" fill="#a6e3a1" text-anchor="middle">Trip Service</text>

    <!-- Surge Pricing -->
    <line x1="315" y1="98" x2="385" y2="130" stroke="#a6e3a1" stroke-width="1.5" marker-end="url(#arrG)"/>
    <rect x="395" y="116" width="145" height="32" rx="6" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
    <text x="467" y="137" font-family="sans-serif" font-size="11" fill="#a6e3a1" text-anchor="middle">Surge Pricing</text>

    <!-- Each service has its own DB -->
    <line x1="540" y1="30" x2="595" y2="30" stroke="#a6e3a1" stroke-width="1" marker-end="url(#arrG)"/>
    <line x1="540" y1="64" x2="595" y2="64" stroke="#a6e3a1" stroke-width="1" marker-end="url(#arrG)"/>
    <line x1="540" y1="98" x2="595" y2="98" stroke="#a6e3a1" stroke-width="1" marker-end="url(#arrG)"/>
    <line x1="540" y1="132" x2="595" y2="132" stroke="#a6e3a1" stroke-width="1" marker-end="url(#arrG)"/>

    <!-- 4 small DBs -->
    <g transform="translate(600, 17)">
      <ellipse cx="16" cy="5" rx="16" ry="6" fill="#313244" stroke="#a6e3a1" stroke-width="1"/>
      <rect x="0" y="5" width="32" height="14" fill="#313244" stroke="#a6e3a1" stroke-width="1"/>
      <ellipse cx="16" cy="19" rx="16" ry="6" fill="#313244" stroke="#a6e3a1" stroke-width="1"/>
      <ellipse cx="16" cy="5" rx="16" ry="6" fill="none" stroke="#a6e3a1" stroke-width="1"/>
    </g>
    <g transform="translate(600, 51)">
      <ellipse cx="16" cy="5" rx="16" ry="6" fill="#313244" stroke="#a6e3a1" stroke-width="1"/>
      <rect x="0" y="5" width="32" height="14" fill="#313244" stroke="#a6e3a1" stroke-width="1"/>
      <ellipse cx="16" cy="19" rx="16" ry="6" fill="#313244" stroke="#a6e3a1" stroke-width="1"/>
      <ellipse cx="16" cy="5" rx="16" ry="6" fill="none" stroke="#a6e3a1" stroke-width="1"/>
    </g>
    <g transform="translate(600, 85)">
      <ellipse cx="16" cy="5" rx="16" ry="6" fill="#313244" stroke="#a6e3a1" stroke-width="1"/>
      <rect x="0" y="5" width="32" height="14" fill="#313244" stroke="#a6e3a1" stroke-width="1"/>
      <ellipse cx="16" cy="19" rx="16" ry="6" fill="#313244" stroke="#a6e3a1" stroke-width="1"/>
      <ellipse cx="16" cy="5" rx="16" ry="6" fill="none" stroke="#a6e3a1" stroke-width="1"/>
    </g>
    <g transform="translate(600, 119)">
      <ellipse cx="16" cy="5" rx="16" ry="6" fill="#313244" stroke="#a6e3a1" stroke-width="1"/>
      <rect x="0" y="5" width="32" height="14" fill="#313244" stroke="#a6e3a1" stroke-width="1"/>
      <ellipse cx="16" cy="19" rx="16" ry="6" fill="#313244" stroke="#a6e3a1" stroke-width="1"/>
      <ellipse cx="16" cy="5" rx="16" ry="6" fill="none" stroke="#a6e3a1" stroke-width="1"/>
    </g>

    <!-- Visual progression indicator -->
    <rect x="700" y="10" width="130" height="150" rx="8" fill="#181825" stroke="#585b70" stroke-width="1"/>
    <text x="765" y="35" font-family="sans-serif" font-size="11" font-weight="bold" fill="#cdd6f4" text-anchor="middle">Progression</text>
    <circle cx="730" cy="58" r="6" fill="#f38ba8"/>
    <text x="745" y="62" font-family="sans-serif" font-size="10" fill="#f38ba8">Monolith</text>
    <circle cx="730" cy="85" r="6" fill="#f9e2af"/>
    <text x="745" y="89" font-family="sans-serif" font-size="10" fill="#f9e2af">Extracting</text>
    <circle cx="730" cy="112" r="6" fill="#a6e3a1"/>
    <text x="745" y="116" font-family="sans-serif" font-size="10" fill="#a6e3a1">Services</text>
    <!-- Arrow down -->
    <line x1="730" y1="68" x2="730" y2="78" stroke="#585b70" stroke-width="1"/>
    <line x1="730" y1="95" x2="730" y2="105" stroke="#585b70" stroke-width="1"/>
  </g>
</svg>