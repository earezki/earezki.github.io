<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500">
  <rect width="880" height="500" rx="8" fill="#1e1e2e"/>

  <text x="440" y="32" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#cdd6f4">HPA Autoscaling During a Traffic Spike</text>

  <!-- Axes -->
  <line x1="80" y1="400" x2="830" y2="400" stroke="#585b70" stroke-width="1.5"/>
  <line x1="80" y1="400" x2="80" y2="60" stroke="#585b70" stroke-width="1.5"/>

  <!-- Y-axis labels (pods) -->
  <text x="72" y="400" text-anchor="end" font-family="monospace" font-size="11" fill="#585b70">0</text>
  <text x="72" y="355" text-anchor="end" font-family="monospace" font-size="11" fill="#585b70">3</text>
  <text x="72" y="280" text-anchor="end" font-family="monospace" font-size="11" fill="#585b70">5</text>
  <text x="72" y="205" text-anchor="end" font-family="monospace" font-size="11" fill="#585b70">8</text>
  <text x="72" y="130" text-anchor="end" font-family="monospace" font-size="11" fill="#585b70">10</text>
  <text x="30" y="230" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#cdd6f4" transform="rotate(-90,30,230)">Pod Count</text>

  <!-- Y-axis gridlines -->
  <line x1="80" y1="355" x2="830" y2="355" stroke="#313244" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="80" y1="280" x2="830" y2="280" stroke="#313244" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="80" y1="205" x2="830" y2="205" stroke="#313244" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="80" y1="130" x2="830" y2="130" stroke="#313244" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- X-axis labels (time) -->
  <text x="80" y="420" text-anchor="middle" font-family="monospace" font-size="10" fill="#585b70">0m</text>
  <text x="230" y="420" text-anchor="middle" font-family="monospace" font-size="10" fill="#585b70">2m</text>
  <text x="380" y="420" text-anchor="middle" font-family="monospace" font-size="10" fill="#585b70">5m</text>
  <text x="530" y="420" text-anchor="middle" font-family="monospace" font-size="10" fill="#585b70">10m</text>
  <text x="680" y="420" text-anchor="middle" font-family="monospace" font-size="10" fill="#585b70">15m</text>
  <text x="830" y="420" text-anchor="middle" font-family="monospace" font-size="10" fill="#585b70">20m</text>
  <text x="455" y="445" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#cdd6f4">Time</text>

  <!-- HPA threshold line (CPU > 70% at ~500 RPS/pod → triggers at ~5 pods worth of traffic on 3 pods) -->
  <!-- Show it as a horizontal dashed line at the "threshold zone" -->

  <!-- Traffic spike area (background) -->
  <path d="M80,380 L130,380 L180,360 L230,250 L280,200 L330,195 L380,195 L430,200 L480,205 L530,205 L580,250 L630,300 L680,345 L730,355 L780,355 L830,355" fill="#89b4fa" fill-opacity="0.08" stroke="none"/>

  <!-- Traffic line (RPS) -->
  <path d="M80,380 L130,380 L180,360 L230,250 L280,200 L330,195 L380,195 L430,200 L480,205 L530,205 L580,250 L630,300 L680,345 L730,355 L780,355 L830,355" fill="none" stroke="#89b4fa" stroke-width="2" stroke-dasharray="6,3" opacity="0.6"/>

  <!-- Pod count line (step function) -->
  <path d="M80,355 L155,355 L155,355 L180,355 L180,310 L230,310 L230,250 L280,250 L280,205 L330,205 L380,205 L430,205 L480,205 L530,205 L580,205 L630,205 L680,250 L730,310 L730,355 L780,355 L830,355" fill="none" stroke="#a6e3a1" stroke-width="3"/>

  <!-- Pod count area -->
  <path d="M80,355 L155,355 L180,355 L180,310 L230,310 L230,250 L280,250 L280,205 L330,205 L380,205 L430,205 L480,205 L530,205 L580,205 L630,205 L680,250 L730,310 L730,355 L830,355 L830,400 L80,400 Z" fill="#a6e3a1" fill-opacity="0.1"/>

  <!-- Phase annotations -->
  <!-- Phase 1: Baseline -->
  <rect x="82" y="66" width="80" height="22" rx="4" fill="#313244"/>
  <text x="122" y="82" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#a6e3a1">Baseline</text>

  <!-- Phase 2: Spike detected -->
  <rect x="165" y="66" width="100" height="22" rx="4" fill="#f38ba8" opacity="0.2" stroke="#f38ba8" stroke-width="1"/>
  <text x="215" y="82" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#f38ba8">Spike detected</text>

  <!-- Phase 3: Scaling up -->
  <rect x="275" y="66" width="80" height="22" rx="4" fill="#f9e2af" opacity="0.2" stroke="#f9e2af" stroke-width="1"/>
  <text x="315" y="82" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#f9e2af">Scaling up</text>

  <!-- Phase 4: Stabilized -->
  <rect x="380" y="66" width="160" height="22" rx="4" fill="#a6e3a1" opacity="0.2" stroke="#a6e3a1" stroke-width="1"/>
  <text x="460" y="82" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#a6e3a1">Stabilized at 8 pods</text>

  <!-- Phase 5: Cooldown -->
  <rect x="610" y="66" width="100" height="22" rx="4" fill="#cba6f7" opacity="0.2" stroke="#cba6f7" stroke-width="1"/>
  <text x="660" y="82" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#cba6f7">Cooldown</text>

  <!-- Phase 6: Scaled back -->
  <rect x="730" y="66" width="95" height="22" rx="4" fill="#313244"/>
  <text x="778" y="82" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#a6e3a1">Back to 3</text>

  <!-- Key data points -->
  <circle cx="180" cy="355" r="4" fill="#f38ba8"/>
  <text x="180" y="378" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#f38ba8">CPU &gt; 70%</text>

  <circle cx="280" cy="205" r="5" fill="#a6e3a1"/>
  <text x="290" y="198" font-family="monospace" font-size="11" fill="#a6e3a1" font-weight="bold">8 pods</text>

  <circle cx="730" cy="355" r="4" fill="#cba6f7"/>
  <text x="730" y="378" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#cba6f7">5m cooldown</text>

  <!-- Legend -->
  <line x1="100" y1="470" x2="130" y2="470" stroke="#a6e3a1" stroke-width="3"/>
  <text x="138" y="474" font-family="sans-serif" font-size="11" fill="#cdd6f4">Pod count</text>

  <line x1="260" y1="470" x2="290" y2="470" stroke="#89b4fa" stroke-width="2" stroke-dasharray="6,3" opacity="0.6"/>
  <text x="298" y="474" font-family="sans-serif" font-size="11" fill="#cdd6f4">Traffic (RPS)</text>

  <circle cx="430" cy="470" r="4" fill="#f38ba8"/>
  <text x="440" y="474" font-family="sans-serif" font-size="11" fill="#cdd6f4">HPA threshold trigger</text>

  <rect x="590" y="463" width="14" height="14" rx="2" fill="#cba6f7" opacity="0.3"/>
  <text x="610" y="474" font-family="sans-serif" font-size="11" fill="#cdd6f4">Cooldown period</text>
</svg>