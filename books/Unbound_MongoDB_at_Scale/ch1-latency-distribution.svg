<svg viewBox="0 0 800 400" width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#1e1e2e" rx="8"/>
  <text x="400" y="30" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="16" font-weight="bold">Latency Distribution: p50 vs p95 vs p99</text>
  <!-- Axes -->
  <line x1="80" y1="350" x2="750" y2="350" stroke="#585b70" stroke-width="1"/>
  <line x1="80" y1="50" x2="80" y2="350" stroke="#585b70" stroke-width="1"/>
  <text x="400" y="390" text-anchor="middle" fill="#a6adc8" font-family="monospace" font-size="12">Response Time (ms)</text>
  <text x="20" y="200" text-anchor="middle" fill="#a6adc8" font-family="monospace" font-size="12" transform="rotate(-90,20,200)">Request Count</text>
  <!-- X-axis labels -->
  <text x="120" y="370" text-anchor="middle" fill="#a6adc8" font-family="monospace" font-size="10">5ms</text>
  <text x="220" y="370" text-anchor="middle" fill="#a6adc8" font-family="monospace" font-size="10">50ms</text>
  <text x="350" y="370" text-anchor="middle" fill="#a6adc8" font-family="monospace" font-size="10">200ms</text>
  <text x="500" y="370" text-anchor="middle" fill="#a6adc8" font-family="monospace" font-size="10">1000ms</text>
  <text x="650" y="370" text-anchor="middle" fill="#a6adc8" font-family="monospace" font-size="10">5000ms</text>
  <!-- Distribution curve - main peak (fast reads) -->
  <path d="M100,340 Q120,340 140,300 Q160,100 180,80 Q200,100 220,280 Q240,330 260,340" fill="none" stroke="#89b4fa" stroke-width="3"/>
  <path d="M100,340 Q120,340 140,300 Q160,100 180,80 Q200,100 220,280 Q240,330 260,340" fill="#89b4fa" fill-opacity="0.15"/>
  <!-- Distribution curve - second peak (slow writes) -->
  <path d="M420,340 Q460,340 480,290 Q500,250 520,240 Q540,250 560,290 Q580,330 620,340" fill="none" stroke="#f38ba8" stroke-width="3"/>
  <path d="M420,340 Q460,340 480,290 Q500,250 520,240 Q540,250 560,290 Q580,330 620,340" fill="#f38ba8" fill-opacity="0.15"/>
  <!-- Percentile markers -->
  <line x1="180" y1="50" x2="180" y2="350" stroke="#a6e3a1" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="180" y="45" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="11" font-weight="bold">p50: 12ms</text>
  <line x1="380" y1="50" x2="380" y2="350" stroke="#fab387" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="380" y="45" text-anchor="middle" fill="#fab387" font-family="monospace" font-size="11" font-weight="bold">p95: 850ms</text>
  <line x1="600" y1="50" x2="600" y2="350" stroke="#f38ba8" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="600" y="45" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="11" font-weight="bold">p99: 3200ms</text>
  <!-- Legend -->
  <rect x="560" y="70" width="12" height="12" fill="#89b4fa" rx="2"/>
  <text x="578" y="81" fill="#cdd6f4" font-family="monospace" font-size="11">Cache hits</text>
  <rect x="560" y="90" width="12" height="12" fill="#f38ba8" rx="2"/>
  <text x="578" y="101" fill="#cdd6f4" font-family="monospace" font-size="11">Cache misses</text>
  <!-- Average line -->
  <line x1="280" y1="60" x2="280" y2="350" stroke="#f9e2af" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="280" y="68" text-anchor="middle" fill="#f9e2af" font-family="monospace" font-size="11">avg: 340ms</text>
  <text x="280" y="80" text-anchor="middle" fill="#f9e2af" font-family="monospace" font-size="9">(misleading)</text>
</svg>
