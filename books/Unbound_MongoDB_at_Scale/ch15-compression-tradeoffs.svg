<svg viewBox="0 0 800 400" width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#1e1e2e" rx="8"/>
  <text x="400" y="30" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="16" font-weight="bold">Compression Trade-offs: Snappy vs Zstd</text>
  <!-- Comparison bars -->
  <text x="400" y="60" text-anchor="middle" fill="#a6adc8" font-family="monospace" font-size="12">Telemetry Collection: 10M documents, 14.2 GB uncompressed</text>
  <!-- Storage -->
  <text x="80" y="100" text-anchor="end" fill="#a6adc8" font-family="monospace" font-size="11">Storage</text>
  <rect x="100" y="85" width="200" height="25" fill="#89b4fa" rx="3"/>
  <text x="310" y="103" fill="#89b4fa" font-family="monospace" font-size="10">Snappy: 6.8 GB (2.1x ratio)</text>
  <rect x="100" y="115" width="130" height="25" fill="#a6e3a1" rx="3"/>
  <text x="240" y="133" fill="#a6e3a1" font-family="monospace" font-size="10">Zstd: 4.3 GB (3.3x ratio)</text>
  <!-- Write throughput -->
  <text x="80" y="170" text-anchor="end" fill="#a6adc8" font-family="monospace" font-size="11">Write ops/s</text>
  <rect x="100" y="155" width="350" height="25" fill="#89b4fa" rx="3"/>
  <text x="460" y="173" fill="#89b4fa" font-family="monospace" font-size="10">Snappy: 42,000 ops/s</text>
  <rect x="100" y="185" width="280" height="25" fill="#a6e3a1" rx="3"/>
  <text x="390" y="203" fill="#a6e3a1" font-family="monospace" font-size="10">Zstd: 34,000 ops/s (-19%)</text>
  <!-- Read throughput -->
  <text x="80" y="240" text-anchor="end" fill="#a6adc8" font-family="monospace" font-size="11">Read ops/s</text>
  <rect x="100" y="225" width="320" height="25" fill="#89b4fa" rx="3"/>
  <text x="430" y="243" fill="#89b4fa" font-family="monospace" font-size="10">Snappy: 38,000 ops/s</text>
  <rect x="100" y="255" width="310" height="25" fill="#a6e3a1" rx="3"/>
  <text x="420" y="273" fill="#a6e3a1" font-family="monospace" font-size="10">Zstd: 36,500 ops/s (-4%)</text>
  <!-- CPU usage -->
  <text x="80" y="310" text-anchor="end" fill="#a6adc8" font-family="monospace" font-size="11">CPU %</text>
  <rect x="100" y="295" width="120" height="25" fill="#89b4fa" rx="3"/>
  <text x="230" y="313" fill="#89b4fa" font-family="monospace" font-size="10">Snappy: 12%</text>
  <rect x="100" y="325" width="200" height="25" fill="#a6e3a1" rx="3"/>
  <text x="310" y="343" fill="#a6e3a1" font-family="monospace" font-size="10">Zstd: 22% (+83%)</text>
  <!-- Decision rule -->
  <rect x="60" y="360" width="680" height="30" fill="#313244" stroke="#f9e2af" stroke-width="1" rx="4"/>
  <text x="400" y="380" text-anchor="middle" fill="#f9e2af" font-family="monospace" font-size="10">Snappy when CPU-bound or write-heavy. Zstd when storage-bound or IOPS-limited. Not both.</text>
</svg>
