<svg viewBox="0 0 800 380" width="800" height="380" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="380" fill="#1e1e2e" rx="8"/>
  <text x="400" y="30" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="16" font-weight="bold">Write Concern: Durability vs Latency Spectrum</text>
  <!-- Spectrum bar -->
  <rect x="80" y="60" width="640" height="30" rx="6" fill="none" stroke="#585b70" stroke-width="1"/>
  <rect x="80" y="60" width="160" height="30" rx="6" fill="#f38ba8" fill-opacity="0.3"/>
  <rect x="240" y="60" width="240" height="30" fill="#f9e2af" fill-opacity="0.3"/>
  <rect x="480" y="60" width="240" height="30" rx="6" fill="#a6e3a1" fill-opacity="0.3"/>
  <text x="160" y="80" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="10">w:0 (fire-and-forget)</text>
  <text x="360" y="80" text-anchor="middle" fill="#f9e2af" font-family="monospace" font-size="10">w:1 (primary ack)</text>
  <text x="600" y="80" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="10">w:majority + j:true</text>
  <!-- Latency labels -->
  <text x="80" y="110" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="9">FAST</text>
  <text x="720" y="110" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="9">DURABLE</text>
  <path d="M100,105 L700,105" fill="none" stroke="#585b70" stroke-width="1" marker-end="url(#arr20)"/>
  <!-- Details for each -->
  <rect x="40" y="130" width="220" height="110" fill="#313244" stroke="#f38ba8" stroke-width="1" rx="6"/>
  <text x="150" y="155" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="11">w:0</text>
  <text x="150" y="175" text-anchor="middle" fill="#a6adc8" font-family="monospace" font-size="9">Latency: 1ms</text>
  <text x="150" y="192" text-anchor="middle" fill="#a6adc8" font-family="monospace" font-size="9">No ack from server</text>
  <text x="150" y="209" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="9">Data loss: any crash</text>
  <text x="150" y="226" text-anchor="middle" fill="#a6adc8" font-family="monospace" font-size="9">Use: metrics, logs</text>
  <rect x="290" y="130" width="220" height="110" fill="#313244" stroke="#f9e2af" stroke-width="1" rx="6"/>
  <text x="400" y="155" text-anchor="middle" fill="#f9e2af" font-family="monospace" font-size="11">w:1</text>
  <text x="400" y="175" text-anchor="middle" fill="#a6adc8" font-family="monospace" font-size="9">Latency: 5ms</text>
  <text x="400" y="192" text-anchor="middle" fill="#a6adc8" font-family="monospace" font-size="9">Primary memory ack</text>
  <text x="400" y="209" text-anchor="middle" fill="#f9e2af" font-family="monospace" font-size="9">Data loss: primary crash</text>
  <text x="400" y="226" text-anchor="middle" fill="#a6adc8" font-family="monospace" font-size="9">Use: general workloads</text>
  <rect x="540" y="130" width="220" height="110" fill="#313244" stroke="#a6e3a1" stroke-width="1" rx="6"/>
  <text x="650" y="155" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="11">w:majority, j:true</text>
  <text x="650" y="175" text-anchor="middle" fill="#a6adc8" font-family="monospace" font-size="9">Latency: 25ms</text>
  <text x="650" y="192" text-anchor="middle" fill="#a6adc8" font-family="monospace" font-size="9">Majority journaled</text>
  <text x="650" y="209" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="9">Data loss: none (majority)</text>
  <text x="650" y="226" text-anchor="middle" fill="#a6adc8" font-family="monospace" font-size="9">Use: financial, critical</text>
  <!-- Benchmark -->
  <rect x="80" y="270" width="640" height="85" fill="#313244" stroke="#89b4fa" stroke-width="1" rx="6"/>
  <text x="400" y="295" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="12" font-weight="bold">k6 Benchmark: 5,000 Writes/sec Telemetry Ingestion</text>
  <text x="200" y="320" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="10">w:0 → 48,200 ops/s</text>
  <text x="400" y="320" text-anchor="middle" fill="#f9e2af" font-family="monospace" font-size="10">w:1 → 22,100 ops/s</text>
  <text x="600" y="320" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="10">w:maj → 8,400 ops/s</text>
  <text x="400" y="345" text-anchor="middle" fill="#f9e2af" font-family="monospace" font-size="10">Choose based on data criticality, not default. Most teams use w:1 for everything.</text>
  <defs><marker id="arr20" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#585b70"/></marker></defs>
</svg>
