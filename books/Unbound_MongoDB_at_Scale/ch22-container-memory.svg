<svg viewBox="0 0 800 400" width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#1e1e2e" rx="8"/>
  <text x="400" y="30" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="16" font-weight="bold">Container Memory: JVM + WiredTiger in Cgroup Limits</text>
  <!-- Container memory bar -->
  <rect x="80" y="60" width="640" height="40" fill="#313244" stroke="#585b70" stroke-width="2" rx="6"/>
  <text x="400" y="85" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="11">Container Limit: 4 GB</text>
  <!-- Allocations inside -->
  <rect x="82" y="62" width="200" height="36" fill="#89b4fa" fill-opacity="0.5" rx="4"/>
  <text x="182" y="85" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="9">JVM Heap: 2 GB</text>
  <rect x="284" y="62" width="200" height="36" fill="#a6e3a1" fill-opacity="0.5" rx="4"/>
  <text x="384" y="85" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="9">WT Cache: 1.5 GB</text>
  <rect x="486" y="62" width="80" height="36" fill="#f9e2af" fill-opacity="0.5" rx="4"/>
  <text x="526" y="85" text-anchor="middle" fill="#f9e2af" font-family="monospace" font-size="9">OS: 0.3G</text>
  <rect x="568" y="62" width="60" height="36" fill="#f38ba8" fill-opacity="0.5" rx="4"/>
  <text x="598" y="78" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="8">Off-</text>
  <text x="598" y="92" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="8">heap</text>
  <!-- Danger zones -->
  <rect x="630" y="62" width="88" height="36" fill="#f38ba8" fill-opacity="0.8" rx="4"/>
  <text x="674" y="85" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="8">OOM KILL</text>
  <!-- Problem scenarios -->
  <text x="400" y="130" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="14" font-weight="bold">Common OOM Scenarios</text>
  <rect x="50" y="145" width="220" height="100" fill="#313244" stroke="#f38ba8" stroke-width="1" rx="6"/>
  <text x="160" y="168" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="11">JVM Heap Too Large</text>
  <text x="160" y="190" text-anchor="middle" fill="#a6adc8" font-family="monospace" font-size="9">-Xmx3g in 4GB container</text>
  <text x="160" y="208" text-anchor="middle" fill="#a6adc8" font-family="monospace" font-size="9">No room for WT cache</text>
  <text x="160" y="226" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="9">mongod starved for cache</text>
  <rect x="290" y="145" width="220" height="100" fill="#313244" stroke="#f38ba8" stroke-width="1" rx="6"/>
  <text x="400" y="168" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="11">WT Cache Unbounded</text>
  <text x="400" y="190" text-anchor="middle" fill="#a6adc8" font-family="monospace" font-size="9">cacheSizeGB not set</text>
  <text x="400" y="208" text-anchor="middle" fill="#a6adc8" font-family="monospace" font-size="9">WT uses 50% of RAM</text>
  <text x="400" y="226" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="9">2GB WT + 2GB JVM = OOM</text>
  <rect x="530" y="145" width="220" height="100" fill="#313244" stroke="#f38ba8" stroke-width="1" rx="6"/>
  <text x="640" y="168" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="11">Connection Spike</text>
  <text x="640" y="190" text-anchor="middle" fill="#a6adc8" font-family="monospace" font-size="9">1000 connections x 1MB stack</text>
  <text x="640" y="208" text-anchor="middle" fill="#a6adc8" font-family="monospace" font-size="9">+1GB thread memory</text>
  <text x="640" y="226" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="9">Exceeds cgroup limit</text>
  <!-- Solution -->
  <rect x="80" y="270" width="640" height="100" fill="#313244" stroke="#a6e3a1" stroke-width="1" rx="6"/>
  <text x="400" y="295" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="12" font-weight="bold">Correct Sizing Formula</text>
  <text x="400" y="318" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="10">Container limit = JVM heap + JVM off-heap + WT cache + OS overhead + buffer</text>
  <text x="400" y="340" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="10">Example: 8 GB = 2 GB heap + 0.5 GB metaspace + 3 GB WT + 0.5 GB OS + 2 GB buffer</text>
  <text x="400" y="360" text-anchor="middle" fill="#f9e2af" font-family="monospace" font-size="10">Always set -XX:MaxRAMPercentage=50 and storage.wiredTiger.engineConfig.cacheSizeGB explicitly</text>
</svg>
