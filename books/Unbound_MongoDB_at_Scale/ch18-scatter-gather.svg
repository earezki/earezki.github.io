<svg viewBox="0 0 800 420" width="800" height="420" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="420" fill="#1e1e2e" rx="8"/>
  <text x="400" y="30" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="16" font-weight="bold">Scatter-Gather: mongos Router Query Fan-Out</text>
  <!-- Client -->
  <rect x="340" y="50" width="120" height="40" fill="#313244" stroke="#89b4fa" stroke-width="2" rx="6"/>
  <text x="400" y="75" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="11">Application</text>
  <line x1="400" y1="90" x2="400" y2="120" stroke="#585b70" stroke-width="2"/>
  <!-- mongos -->
  <rect x="330" y="120" width="140" height="40" fill="#313244" stroke="#f9e2af" stroke-width="2" rx="6"/>
  <text x="400" y="145" text-anchor="middle" fill="#f9e2af" font-family="monospace" font-size="11">mongos router</text>
  <!-- Targeted query (left) -->
  <text x="150" y="180" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="11" font-weight="bold">Targeted Query</text>
  <text x="150" y="195" text-anchor="middle" fill="#a6adc8" font-family="monospace" font-size="9">shard key in filter</text>
  <line x1="345" y1="155" x2="150" y2="220" stroke="#a6e3a1" stroke-width="2"/>
  <rect x="100" y="220" width="100" height="35" fill="#a6e3a1" fill-opacity="0.3" stroke="#a6e3a1" stroke-width="2" rx="4"/>
  <text x="150" y="242" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="10">Shard B</text>
  <text x="150" y="275" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="10">Latency: 8ms</text>
  <!-- Scatter-gather (right) -->
  <text x="600" y="180" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="11" font-weight="bold">Scatter-Gather</text>
  <text x="600" y="195" text-anchor="middle" fill="#a6adc8" font-family="monospace" font-size="9">no shard key in filter</text>
  <line x1="455" y1="155" x2="500" y2="220" stroke="#f38ba8" stroke-width="2"/>
  <line x1="455" y1="155" x2="600" y2="220" stroke="#f38ba8" stroke-width="2"/>
  <line x1="455" y1="155" x2="700" y2="220" stroke="#f38ba8" stroke-width="2"/>
  <rect x="460" y="220" width="80" height="35" fill="#f38ba8" fill-opacity="0.2" stroke="#f38ba8" stroke-width="1" rx="4"/>
  <text x="500" y="242" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="9">Shard A</text>
  <rect x="560" y="220" width="80" height="35" fill="#f38ba8" fill-opacity="0.2" stroke="#f38ba8" stroke-width="1" rx="4"/>
  <text x="600" y="242" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="9">Shard B</text>
  <rect x="660" y="220" width="80" height="35" fill="#f38ba8" fill-opacity="0.2" stroke="#f38ba8" stroke-width="1" rx="4"/>
  <text x="700" y="242" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="9">Shard C</text>
  <text x="600" y="275" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="10">Latency: max(A,B,C) + merge = 85ms</text>
  <!-- Comparison table -->
  <rect x="100" y="310" width="600" height="85" fill="#313244" stroke="#89b4fa" stroke-width="1" rx="6"/>
  <text x="400" y="335" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="12" font-weight="bold">Impact at Scale (12 shards, 10K req/sec)</text>
  <text x="250" y="360" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="10">Targeted: 12ms p99, 10K ops to 1 shard</text>
  <text x="550" y="360" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="10">Scatter: 340ms p99, 120K ops total</text>
  <text x="400" y="385" text-anchor="middle" fill="#f9e2af" font-family="monospace" font-size="10">Scatter-gather turns 1 query into N queries. With 12 shards, network cost alone is 12x.</text>
</svg>
