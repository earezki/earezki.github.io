<svg viewBox="0 0 800 500" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" fill="#1e1e2e" rx="8"/>
  <text x="400" y="30" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="16" font-weight="bold">Shard Key Selection: Cardinality and Distribution</text>
  <!-- Bad shard key: monotonic -->
  <text x="200" y="65" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="12" font-weight="bold">// SLOW: Monotonic Shard Key</text>
  <text x="200" y="83" text-anchor="middle" fill="#a6adc8" font-family="monospace" font-size="10">shardKey: {timestamp: 1}</text>
  <rect x="60" y="95" width="60" height="120" fill="#f38ba8" fill-opacity="0.8" stroke="#f38ba8" stroke-width="1" rx="4"/>
  <text x="90" y="165" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="9">Shard A</text>
  <text x="90" y="180" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="8">95%</text>
  <rect x="140" y="195" width="60" height="20" fill="#f38ba8" fill-opacity="0.2" stroke="#f38ba8" stroke-width="1" rx="4"/>
  <text x="170" y="210" text-anchor="middle" fill="#a6adc8" font-family="monospace" font-size="9">B: 3%</text>
  <rect x="220" y="200" width="60" height="15" fill="#f38ba8" fill-opacity="0.1" stroke="#f38ba8" stroke-width="1" rx="4"/>
  <text x="250" y="212" text-anchor="middle" fill="#a6adc8" font-family="monospace" font-size="9">C: 2%</text>
  <text x="200" y="240" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="10">All new writes go to one shard</text>
  <!-- Good shard key: compound -->
  <text x="600" y="65" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="12" font-weight="bold">// FAST: Hashed Compound Key</text>
  <text x="600" y="83" text-anchor="middle" fill="#a6adc8" font-family="monospace" font-size="10">shardKey: {deviceId: "hashed", timestamp: 1}</text>
  <rect x="460" y="130" width="60" height="85" fill="#a6e3a1" fill-opacity="0.6" stroke="#a6e3a1" stroke-width="1" rx="4"/>
  <text x="490" y="180" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="9">A: 34%</text>
  <rect x="540" y="125" width="60" height="90" fill="#a6e3a1" fill-opacity="0.6" stroke="#a6e3a1" stroke-width="1" rx="4"/>
  <text x="570" y="180" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="9">B: 33%</text>
  <rect x="620" y="128" width="60" height="87" fill="#a6e3a1" fill-opacity="0.6" stroke="#a6e3a1" stroke-width="1" rx="4"/>
  <text x="650" y="180" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="9">C: 33%</text>
  <text x="600" y="240" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="10">Even distribution across shards</text>
  <!-- Shard key properties -->
  <rect x="60" y="270" width="680" height="200" fill="#313244" stroke="#89b4fa" stroke-width="1" rx="6"/>
  <text x="400" y="295" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="13" font-weight="bold">Shard Key Selection Criteria</text>
  <text x="160" y="325" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="11">Property</text>
  <text x="400" y="325" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="11">Good</text>
  <text x="620" y="325" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="11">Bad</text>
  <line x1="80" y1="335" x2="720" y2="335" stroke="#585b70" stroke-width="1"/>
  <text x="160" y="355" text-anchor="middle" fill="#a6adc8" font-family="monospace" font-size="10">Cardinality</text>
  <text x="400" y="355" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="10">High (deviceId: 100K+)</text>
  <text x="620" y="355" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="10">Low (status: 3 values)</text>
  <text x="160" y="380" text-anchor="middle" fill="#a6adc8" font-family="monospace" font-size="10">Distribution</text>
  <text x="400" y="380" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="10">Even across chunks</text>
  <text x="620" y="380" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="10">Monotonically increasing</text>
  <text x="160" y="405" text-anchor="middle" fill="#a6adc8" font-family="monospace" font-size="10">Query isolation</text>
  <text x="400" y="405" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="10">Queries target 1 shard</text>
  <text x="620" y="405" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="10">Queries scatter to all</text>
  <text x="160" y="430" text-anchor="middle" fill="#a6adc8" font-family="monospace" font-size="10">Write scaling</text>
  <text x="400" y="430" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="10">Writes spread evenly</text>
  <text x="620" y="430" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="10">One shard hotspot</text>
  <text x="160" y="455" text-anchor="middle" fill="#a6adc8" font-family="monospace" font-size="10">Immutability</text>
  <text x="400" y="455" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="10">Never changes</text>
  <text x="620" y="455" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="10">Frequently updated</text>
</svg>
