<svg viewBox="0 0 800 450" width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" fill="#1e1e2e" rx="8"/>
  <text x="400" y="30" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="16" font-weight="bold">BSON Parsing: JVM Heap Allocation per Document</text>
  <!-- Memory bars -->
  <text x="80" y="75" fill="#a6adc8" font-family="monospace" font-size="11">Wire (BSON)</text>
  <rect x="200" y="60" width="120" height="30" fill="#89b4fa" rx="4"/>
  <text x="330" y="80" fill="#89b4fa" font-family="monospace" font-size="10">1.2 KB</text>
  <text x="80" y="120" fill="#a6adc8" font-family="monospace" font-size="11">Document obj</text>
  <rect x="200" y="105" width="280" height="30" fill="#f38ba8" rx="4"/>
  <text x="490" y="125" fill="#f38ba8" font-family="monospace" font-size="10">3.8 KB (3.2x bloat)</text>
  <text x="80" y="165" fill="#a6adc8" font-family="monospace" font-size="11">Spring Data</text>
  <rect x="200" y="150" width="420" height="30" fill="#fab387" rx="4"/>
  <text x="630" y="170" fill="#fab387" font-family="monospace" font-size="10">5.6 KB (4.7x bloat)</text>
  <!-- Breakdown of Spring Data overhead -->
  <text x="400" y="210" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="13" font-weight="bold">Spring Data Mapping Overhead Breakdown</text>
  <rect x="100" y="230" width="180" height="60" fill="#313244" stroke="#fab387" stroke-width="1" rx="4"/>
  <text x="190" y="255" text-anchor="middle" fill="#fab387" font-family="monospace" font-size="10">Reflection lookups</text>
  <text x="190" y="275" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="12">1.1 KB / 640μs</text>
  <rect x="310" y="230" width="180" height="60" fill="#313244" stroke="#fab387" stroke-width="1" rx="4"/>
  <text x="400" y="255" text-anchor="middle" fill="#fab387" font-family="monospace" font-size="10">Property accessors</text>
  <text x="400" y="275" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="12">0.4 KB / 280μs</text>
  <rect x="520" y="230" width="180" height="60" fill="#313244" stroke="#fab387" stroke-width="1" rx="4"/>
  <text x="610" y="255" text-anchor="middle" fill="#fab387" font-family="monospace" font-size="10">Type conversion</text>
  <text x="610" y="275" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="12">0.3 KB / 190μs</text>
  <!-- GC impact -->
  <rect x="100" y="320" width="600" height="100" fill="#313244" stroke="#f38ba8" stroke-width="1" rx="6"/>
  <text x="400" y="345" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="13" font-weight="bold">GC Impact at 10,000 docs/sec</text>
  <text x="200" y="375" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="11">Raw Driver</text>
  <text x="200" y="395" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="11">38 MB/sec alloc</text>
  <text x="400" y="375" text-anchor="middle" fill="#fab387" font-family="monospace" font-size="11">Spring Data</text>
  <text x="400" y="395" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="11">56 MB/sec alloc</text>
  <text x="600" y="375" text-anchor="middle" fill="#a6adc8" font-family="monospace" font-size="11">Delta</text>
  <text x="600" y="395" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="11">+47% GC pressure</text>
</svg>
