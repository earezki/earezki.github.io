<svg viewBox="0 0 800 380" width="800" height="380" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="380" fill="#1e1e2e" rx="8"/>
  <text x="400" y="30" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="16" font-weight="bold">Covered Query: Eliminating the FETCH Stage</text>
  <!-- Non-covered query -->
  <text x="200" y="65" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="13" font-weight="bold">// SLOW: IXSCAN + FETCH</text>
  <rect x="80" y="80" width="120" height="40" fill="#313244" stroke="#a6e3a1" stroke-width="2" rx="6"/>
  <text x="140" y="105" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="11">IXSCAN</text>
  <line x1="140" y1="120" x2="140" y2="145" stroke="#585b70" stroke-width="2"/>
  <rect x="80" y="145" width="120" height="40" fill="#313244" stroke="#f38ba8" stroke-width="2" rx="6"/>
  <text x="140" y="170" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="11">FETCH</text>
  <text x="220" y="105" fill="#a6adc8" font-family="monospace" font-size="9">Walk B-tree: fast</text>
  <text x="220" y="170" fill="#f38ba8" font-family="monospace" font-size="9">Load full doc from disk: slow</text>
  <text x="140" y="210" text-anchor="middle" fill="#a6adc8" font-family="monospace" font-size="10">Random I/O per document</text>
  <text x="140" y="228" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="10">p99: 85ms at 10K results</text>
  <!-- Covered query -->
  <text x="580" y="65" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="13" font-weight="bold">// FAST: IXSCAN Only (Covered)</text>
  <rect x="520" y="80" width="120" height="40" fill="#313244" stroke="#a6e3a1" stroke-width="2" rx="6"/>
  <text x="580" y="105" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="11">IXSCAN</text>
  <text x="660" y="105" fill="#a6adc8" font-family="monospace" font-size="9">Walk B-tree: fast</text>
  <text x="580" y="145" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="10">No disk access needed</text>
  <text x="580" y="165" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="10">All fields in the index</text>
  <text x="580" y="195" text-anchor="middle" fill="#a6adc8" font-family="monospace" font-size="10">Sequential index scan only</text>
  <text x="580" y="213" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="10">p99: 4ms at 10K results</text>
  <!-- Requirements -->
  <rect x="60" y="260" width="680" height="90" fill="#313244" stroke="#89b4fa" stroke-width="1" rx="6"/>
  <text x="400" y="285" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="13" font-weight="bold">Covered Query Requirements</text>
  <text x="400" y="310" text-anchor="middle" fill="#a6adc8" font-family="monospace" font-size="10">1. All queried fields must be in the index</text>
  <text x="400" y="328" text-anchor="middle" fill="#a6adc8" font-family="monospace" font-size="10">2. All projected fields must be in the index (use projection: {_id: 0, field1: 1, field2: 1})</text>
  <text x="400" y="346" text-anchor="middle" fill="#f9e2af" font-family="monospace" font-size="10">3. _id must be explicitly excluded from projection (it is not in the index by default)</text>
</svg>
