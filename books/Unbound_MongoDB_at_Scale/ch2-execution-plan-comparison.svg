<svg viewBox="0 0 800 500" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" fill="#1e1e2e" rx="8"/>
  <text x="400" y="30" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="16" font-weight="bold">Query Execution Plan: COLLSCAN vs IXSCAN</text>
  <!-- COLLSCAN side -->
  <text x="200" y="65" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="14" font-weight="bold">// SLOW: COLLSCAN</text>
  <rect x="100" y="80" width="200" height="40" fill="#313244" stroke="#f38ba8" stroke-width="2" rx="6"/>
  <text x="200" y="105" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="12">COLLSCAN</text>
  <line x1="200" y1="120" x2="200" y2="150" stroke="#585b70" stroke-width="2"/>
  <rect x="80" y="150" width="240" height="30" fill="#313244" stroke="#585b70" stroke-width="1" rx="4"/>
  <text x="200" y="170" text-anchor="middle" fill="#a6adc8" font-family="monospace" font-size="10">totalDocsExamined: 2,847,391</text>
  <rect x="80" y="185" width="240" height="30" fill="#313244" stroke="#585b70" stroke-width="1" rx="4"/>
  <text x="200" y="205" text-anchor="middle" fill="#a6adc8" font-family="monospace" font-size="10">nReturned: 50</text>
  <rect x="80" y="220" width="240" height="30" fill="#313244" stroke="#585b70" stroke-width="1" rx="4"/>
  <text x="200" y="240" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="10">executionTimeMs: 4,230</text>
  <rect x="80" y="260" width="240" height="30" fill="#313244" stroke="#585b70" stroke-width="1" rx="4"/>
  <text x="200" y="280" text-anchor="middle" fill="#a6adc8" font-family="monospace" font-size="10">Ratio: 56,948:1</text>
  <!-- IXSCAN side -->
  <text x="600" y="65" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="14" font-weight="bold">// FAST: IXSCAN + FETCH</text>
  <rect x="500" y="80" width="200" height="40" fill="#313244" stroke="#a6e3a1" stroke-width="2" rx="6"/>
  <text x="600" y="105" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="12">IXSCAN</text>
  <line x1="600" y1="120" x2="600" y2="140" stroke="#585b70" stroke-width="2"/>
  <rect x="500" y="140" width="200" height="40" fill="#313244" stroke="#a6e3a1" stroke-width="2" rx="6"/>
  <text x="600" y="165" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="12">FETCH</text>
  <line x1="600" y1="180" x2="600" y2="200" stroke="#585b70" stroke-width="2"/>
  <rect x="480" y="200" width="240" height="30" fill="#313244" stroke="#585b70" stroke-width="1" rx="4"/>
  <text x="600" y="220" text-anchor="middle" fill="#a6adc8" font-family="monospace" font-size="10">totalKeysExamined: 50</text>
  <rect x="480" y="235" width="240" height="30" fill="#313244" stroke="#585b70" stroke-width="1" rx="4"/>
  <text x="600" y="255" text-anchor="middle" fill="#a6adc8" font-family="monospace" font-size="10">totalDocsExamined: 50</text>
  <rect x="480" y="270" width="240" height="30" fill="#313244" stroke="#585b70" stroke-width="1" rx="4"/>
  <text x="600" y="290" text-anchor="middle" fill="#a6adc8" font-family="monospace" font-size="10">nReturned: 50</text>
  <rect x="480" y="305" width="240" height="30" fill="#313244" stroke="#585b70" stroke-width="1" rx="4"/>
  <text x="600" y="325" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="10">executionTimeMs: 2</text>
  <rect x="480" y="345" width="240" height="30" fill="#313244" stroke="#585b70" stroke-width="1" rx="4"/>
  <text x="600" y="365" text-anchor="middle" fill="#a6adc8" font-family="monospace" font-size="10">Ratio: 1:1 (perfect)</text>
  <!-- Arrow -->
  <path d="M340,180 L360,180 L360,180 L380,180" fill="none" stroke="#f9e2af" stroke-width="2"/>
  <polygon points="380,175 395,180 380,185" fill="#f9e2af"/>
  <text x="367" y="170" text-anchor="middle" fill="#f9e2af" font-family="monospace" font-size="10">2115x</text>
  <text x="367" y="195" text-anchor="middle" fill="#f9e2af" font-family="monospace" font-size="10">faster</text>
  <!-- Bottom summary -->
  <rect x="100" y="420" width="600" height="50" fill="#313244" stroke="#89b4fa" stroke-width="1" rx="6"/>
  <text x="400" y="440" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="11">The ratio that matters: totalDocsExamined / nReturned</text>
  <text x="400" y="458" text-anchor="middle" fill="#a6adc8" font-family="monospace" font-size="10">If this ratio >> 1, you are scanning documents you do not need. Add an index.</text>
</svg>
