<svg viewBox="0 0 800 400" width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#1e1e2e" rx="8"/>
  <text x="400" y="30" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="16" font-weight="bold">Connection Pool State Machine</text>
  <!-- States -->
  <rect x="50" y="80" width="140" height="50" fill="#313244" stroke="#a6e3a1" stroke-width="2" rx="8"/>
  <text x="120" y="110" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="11">IDLE</text>
  <rect x="250" y="80" width="140" height="50" fill="#313244" stroke="#89b4fa" stroke-width="2" rx="8"/>
  <text x="320" y="110" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="11">CHECKED_OUT</text>
  <rect x="450" y="80" width="140" height="50" fill="#313244" stroke="#f9e2af" stroke-width="2" rx="8"/>
  <text x="520" y="110" text-anchor="middle" fill="#f9e2af" font-family="monospace" font-size="11">WAIT_QUEUE</text>
  <rect x="650" y="80" width="120" height="50" fill="#313244" stroke="#f38ba8" stroke-width="2" rx="8"/>
  <text x="710" y="110" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="11">TIMEOUT</text>
  <!-- Arrows -->
  <path d="M190,105 L250,105" fill="none" stroke="#cdd6f4" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M320,130 Q320,160 120,160 Q50,160 50,130" fill="none" stroke="#a6e3a1" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="180" y="175" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="9">return to pool</text>
  <path d="M390,105 L450,105" fill="none" stroke="#cdd6f4" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="420" y="95" text-anchor="middle" fill="#a6adc8" font-family="monospace" font-size="8">pool exhausted</text>
  <path d="M590,105 L650,105" fill="none" stroke="#f38ba8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="620" y="95" text-anchor="middle" fill="#a6adc8" font-family="monospace" font-size="8">maxWaitTime</text>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#cdd6f4"/></marker></defs>
  <!-- Pool sizing diagram -->
  <text x="400" y="220" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="14" font-weight="bold">Pool Sizing Impact</text>
  <rect x="60" y="240" width="200" height="130" fill="#313244" stroke="#f38ba8" stroke-width="1" rx="6"/>
  <text x="160" y="265" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="12">maxPoolSize=10</text>
  <text x="160" y="290" text-anchor="middle" fill="#a6adc8" font-family="monospace" font-size="10">At 500 req/sec:</text>
  <text x="160" y="310" text-anchor="middle" fill="#a6adc8" font-family="monospace" font-size="10">Wait queue: 340 threads</text>
  <text x="160" y="330" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="10">p99 latency: 2,800ms</text>
  <text x="160" y="350" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="10">Timeout rate: 12%</text>
  <rect x="300" y="240" width="200" height="130" fill="#313244" stroke="#a6e3a1" stroke-width="1" rx="6"/>
  <text x="400" y="265" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="12">maxPoolSize=50</text>
  <text x="400" y="290" text-anchor="middle" fill="#a6adc8" font-family="monospace" font-size="10">At 500 req/sec:</text>
  <text x="400" y="310" text-anchor="middle" fill="#a6adc8" font-family="monospace" font-size="10">Wait queue: 8 threads</text>
  <text x="400" y="330" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="10">p99 latency: 45ms</text>
  <text x="400" y="350" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="10">Timeout rate: 0%</text>
  <rect x="540" y="240" width="200" height="130" fill="#313244" stroke="#f9e2af" stroke-width="1" rx="6"/>
  <text x="640" y="265" text-anchor="middle" fill="#f9e2af" font-family="monospace" font-size="12">maxPoolSize=500</text>
  <text x="640" y="290" text-anchor="middle" fill="#a6adc8" font-family="monospace" font-size="10">At 500 req/sec:</text>
  <text x="640" y="310" text-anchor="middle" fill="#a6adc8" font-family="monospace" font-size="10">Wait queue: 0 threads</text>
  <text x="640" y="330" text-anchor="middle" fill="#f9e2af" font-family="monospace" font-size="10">p99 latency: 120ms</text>
  <text x="640" y="350" text-anchor="middle" fill="#f9e2af" font-family="monospace" font-size="10">Server CPU: 94%</text>
</svg>
