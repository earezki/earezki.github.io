<svg viewBox="0 0 800 400" width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#1e1e2e" rx="8"/>
  <text x="400" y="30" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="16" font-weight="bold">BSON Type Sizes and Network Payload Impact</text>
  <!-- Type comparison bars -->
  <text x="100" y="70" text-anchor="end" fill="#a6adc8" font-family="monospace" font-size="11">String "true"</text>
  <rect x="110" y="55" width="320" height="25" fill="#f38ba8" rx="3"/>
  <text x="440" y="73" fill="#f38ba8" font-family="monospace" font-size="10">10 bytes (type + key + UTF-8 + null)</text>
  <text x="100" y="105" text-anchor="end" fill="#a6adc8" font-family="monospace" font-size="11">Boolean true</text>
  <rect x="110" y="90" width="60" height="25" fill="#a6e3a1" rx="3"/>
  <text x="180" y="108" fill="#a6e3a1" font-family="monospace" font-size="10">3 bytes (type + key + 0x01)</text>
  <text x="100" y="145" text-anchor="end" fill="#a6adc8" font-family="monospace" font-size="11">String "1234"</text>
  <rect x="110" y="130" width="280" height="25" fill="#f38ba8" rx="3"/>
  <text x="400" y="148" fill="#f38ba8" font-family="monospace" font-size="10">10 bytes (UTF-8 encoded digits)</text>
  <text x="100" y="180" text-anchor="end" fill="#a6adc8" font-family="monospace" font-size="11">Int32 1234</text>
  <rect x="110" y="165" width="120" height="25" fill="#a6e3a1" rx="3"/>
  <text x="240" y="183" fill="#a6e3a1" font-family="monospace" font-size="10">6 bytes (type + key + 4-byte int)</text>
  <text x="100" y="215" text-anchor="end" fill="#a6adc8" font-family="monospace" font-size="11">String ISO date</text>
  <rect x="110" y="200" width="500" height="25" fill="#f38ba8" rx="3"/>
  <text x="620" y="218" fill="#f38ba8" font-family="monospace" font-size="10">30 bytes</text>
  <text x="100" y="250" text-anchor="end" fill="#a6adc8" font-family="monospace" font-size="11">BSON Date</text>
  <rect x="110" y="235" width="160" height="25" fill="#a6e3a1" rx="3"/>
  <text x="280" y="253" fill="#a6e3a1" font-family="monospace" font-size="10">10 bytes (type + key + 8-byte epoch)</text>
  <!-- Impact at scale -->
  <rect x="80" y="285" width="640" height="90" fill="#313244" stroke="#89b4fa" stroke-width="1" rx="6"/>
  <text x="400" y="310" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="13" font-weight="bold">Impact at 10M documents (telemetry collection)</text>
  <text x="250" y="335" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="11">String types: 14.2 GB storage</text>
  <text x="550" y="335" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="11">Native types: 8.1 GB storage</text>
  <text x="400" y="360" text-anchor="middle" fill="#f9e2af" font-family="monospace" font-size="11">43% reduction in storage, WiredTiger cache, and network I/O</text>
</svg>
