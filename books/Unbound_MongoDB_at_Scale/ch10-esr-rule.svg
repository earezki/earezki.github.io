<svg viewBox="0 0 800 450" width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" fill="#1e1e2e" rx="8"/>
  <text x="400" y="30" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="16" font-weight="bold">ESR Rule: Equality, Sort, Range Index Ordering</text>
  <!-- Index field ordering -->
  <text x="400" y="65" text-anchor="middle" fill="#a6adc8" font-family="monospace" font-size="12">Compound Index: {deviceType: 1, timestamp: 1, temperature: 1}</text>
  <!-- Three boxes for E, S, R -->
  <rect x="80" y="85" width="200" height="80" fill="#313244" stroke="#a6e3a1" stroke-width="2" rx="8"/>
  <text x="180" y="110" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="16" font-weight="bold">E</text>
  <text x="180" y="130" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="11">Equality</text>
  <text x="180" y="150" text-anchor="middle" fill="#a6adc8" font-family="monospace" font-size="9">deviceType: "thermometer"</text>
  <rect x="300" y="85" width="200" height="80" fill="#313244" stroke="#89b4fa" stroke-width="2" rx="8"/>
  <text x="400" y="110" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="16" font-weight="bold">S</text>
  <text x="400" y="130" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="11">Sort</text>
  <text x="400" y="150" text-anchor="middle" fill="#a6adc8" font-family="monospace" font-size="9">.sort({timestamp: -1})</text>
  <rect x="520" y="85" width="200" height="80" fill="#313244" stroke="#f9e2af" stroke-width="2" rx="8"/>
  <text x="620" y="110" text-anchor="middle" fill="#f9e2af" font-family="monospace" font-size="16" font-weight="bold">R</text>
  <text x="620" y="130" text-anchor="middle" fill="#f9e2af" font-family="monospace" font-size="11">Range</text>
  <text x="620" y="150" text-anchor="middle" fill="#a6adc8" font-family="monospace" font-size="9">temperature: {$gt: 30}</text>
  <!-- Wrong order comparison -->
  <text x="400" y="200" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="13" font-weight="bold">Index Order Impact on Query Performance</text>
  <!-- Wrong: R, E, S -->
  <rect x="60" y="220" width="320" height="100" fill="#313244" stroke="#f38ba8" stroke-width="1" rx="6"/>
  <text x="220" y="245" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="11">// SLOW: {temperature, deviceType, timestamp}</text>
  <text x="220" y="268" text-anchor="middle" fill="#a6adc8" font-family="monospace" font-size="10">Range first breaks sort optimization</text>
  <text x="220" y="288" text-anchor="middle" fill="#a6adc8" font-family="monospace" font-size="10">In-memory SORT stage required</text>
  <text x="220" y="308" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="10">executionTimeMs: 2,340 | memUsage: 84MB</text>
  <!-- Right: E, S, R -->
  <rect x="420" y="220" width="320" height="100" fill="#313244" stroke="#a6e3a1" stroke-width="1" rx="6"/>
  <text x="580" y="245" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="11">// FAST: {deviceType, timestamp, temperature}</text>
  <text x="580" y="268" text-anchor="middle" fill="#a6adc8" font-family="monospace" font-size="10">Equality narrows, sort uses index order</text>
  <text x="580" y="288" text-anchor="middle" fill="#a6adc8" font-family="monospace" font-size="10">No in-memory SORT needed</text>
  <text x="580" y="308" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="10">executionTimeMs: 12 | memUsage: 0MB</text>
  <!-- Bottom note -->
  <rect x="100" y="350" width="600" height="70" fill="#313244" stroke="#89b4fa" stroke-width="1" rx="6"/>
  <text x="400" y="375" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="11">The ESR rule is not optional. A range predicate before a sort predicate in a</text>
  <text x="400" y="395" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="11">compound index forces an in-memory sort. At scale, this triggers the 100MB</text>
  <text x="400" y="410" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="11">sort memory limit and the query fails.</text>
</svg>
