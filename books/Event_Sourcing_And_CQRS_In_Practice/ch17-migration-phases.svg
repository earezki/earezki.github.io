<svg viewBox="0 0 800 420" width="800" height="420" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="420" fill="#1e1e2e" rx="8"/>
  <text x="400" y="35" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="16" font-weight="bold">CRUD to Event Sourcing: Incremental Migration</text>

  <!-- Phase 1 -->
  <rect x="30" y="55" width="170" height="160" fill="#313244" stroke="#89b4fa" stroke-width="1.5" rx="6"/>
  <text x="115" y="78" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="10" font-weight="bold">Phase 1</text>
  <text x="115" y="95" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="9">Shadow Events</text>

  <rect x="50" y="108" width="130" height="25" fill="#1e1e2e" stroke="#f9e2af" stroke-width="1" rx="3"/>
  <text x="115" y="125" text-anchor="middle" fill="#f9e2af" font-family="monospace" font-size="8">CRUD DB (source)</text>

  <line x1="115" y1="133" x2="115" y2="148" stroke="#6c7086" stroke-width="1"/>
  <polygon points="115,148 111,142 119,142" fill="#6c7086"/>
  <text x="145" y="143" fill="#6c7086" font-family="monospace" font-size="7">bridge</text>

  <rect x="50" y="150" width="130" height="25" fill="#1e1e2e" stroke="#a6e3a1" stroke-width="1" rx="3"/>
  <text x="115" y="167" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="8">Event Store (shadow)</text>

  <text x="115" y="200" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="7">CRUD = source of truth</text>

  <!-- Arrow -->
  <line x1="200" y1="135" x2="225" y2="135" stroke="#45475a" stroke-width="2"/>
  <polygon points="225,135 219,131 219,139" fill="#45475a"/>

  <!-- Phase 2 -->
  <rect x="225" y="55" width="170" height="160" fill="#313244" stroke="#f9e2af" stroke-width="1.5" rx="6"/>
  <text x="310" y="78" text-anchor="middle" fill="#f9e2af" font-family="monospace" font-size="10" font-weight="bold">Phase 2</text>
  <text x="310" y="95" text-anchor="middle" fill="#f9e2af" font-family="monospace" font-size="9">New on Events</text>

  <rect x="245" y="108" width="130" height="25" fill="#1e1e2e" stroke="#f9e2af" stroke-width="1" rx="3"/>
  <text x="310" y="125" text-anchor="middle" fill="#f9e2af" font-family="monospace" font-size="8">Old: CRUD writes</text>

  <rect x="245" y="140" width="130" height="25" fill="#1e1e2e" stroke="#a6e3a1" stroke-width="1.5" rx="3"/>
  <text x="310" y="157" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="8">New: Event reads</text>

  <text x="310" y="190" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="7">Analytics, timeline from</text>
  <text x="310" y="205" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="7">event store</text>

  <!-- Arrow -->
  <line x1="395" y1="135" x2="420" y2="135" stroke="#45475a" stroke-width="2"/>
  <polygon points="420,135 414,131 414,139" fill="#45475a"/>

  <!-- Phase 3 -->
  <rect x="420" y="55" width="170" height="160" fill="#313244" stroke="#cba6f7" stroke-width="1.5" rx="6"/>
  <text x="505" y="78" text-anchor="middle" fill="#cba6f7" font-family="monospace" font-size="10" font-weight="bold">Phase 3</text>
  <text x="505" y="95" text-anchor="middle" fill="#cba6f7" font-family="monospace" font-size="9">Backfill History</text>

  <rect x="440" y="108" width="130" height="25" fill="#1e1e2e" stroke="#6c7086" stroke-width="1" rx="3"/>
  <text x="505" y="125" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="8">Old CRUD orders</text>

  <line x1="505" y1="133" x2="505" y2="148" stroke="#cba6f7" stroke-width="1"/>
  <polygon points="505,148 501,142 509,142" fill="#cba6f7"/>
  <text x="535" y="143" fill="#cba6f7" font-family="monospace" font-size="7">backfill</text>

  <rect x="440" y="150" width="130" height="25" fill="#1e1e2e" stroke="#a6e3a1" stroke-width="1.5" rx="3"/>
  <text x="505" y="167" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="8">Synthetic events</text>

  <text x="505" y="200" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="7">Generate events from</text>
  <text x="505" y="210" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="7">existing state</text>

  <!-- Arrow -->
  <line x1="590" y1="135" x2="615" y2="135" stroke="#45475a" stroke-width="2"/>
  <polygon points="615,135 609,131 609,139" fill="#45475a"/>

  <!-- Phase 4 -->
  <rect x="615" y="55" width="155" height="160" fill="#313244" stroke="#a6e3a1" stroke-width="2" rx="6"/>
  <text x="692" y="78" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="10" font-weight="bold">Phase 4</text>
  <text x="692" y="95" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="9">Retire CRUD</text>

  <rect x="635" y="108" width="130" height="25" fill="#1e1e2e" stroke="#f38ba8" stroke-width="1" rx="3" stroke-dasharray="4"/>
  <text x="700" y="125" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="8">CRUD (read-only)</text>

  <rect x="635" y="150" width="130" height="25" fill="#1e1e2e" stroke="#a6e3a1" stroke-width="2" rx="3"/>
  <text x="700" y="167" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="8" font-weight="bold">Events = truth</text>

  <text x="692" y="200" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="7">Verify, then archive</text>
  <text x="692" y="210" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="7">CRUD tables</text>

  <!-- Verification bar -->
  <rect x="30" y="240" width="740" height="50" fill="#313244" stroke="#f38ba8" stroke-width="1.5" rx="4"/>
  <text x="400" y="260" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="11" font-weight="bold">Continuous Verification (runs throughout all phases)</text>
  <text x="400" y="280" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="9">Sample 100 orders every 5 min: compare CRUD state vs event-derived state</text>

  <!-- Key principles -->
  <rect x="30" y="310" width="360" height="90" fill="#313244" stroke="#45475a" stroke-width="1" rx="4"/>
  <text x="210" y="335" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="10" font-weight="bold">Migration Principles</text>
  <text x="50" y="355" fill="#a6e3a1" font-family="monospace" font-size="9">+ Incremental, not big-bang</text>
  <text x="50" y="373" fill="#a6e3a1" font-family="monospace" font-size="9">+ Rollback possible at every phase</text>
  <text x="50" y="391" fill="#a6e3a1" font-family="monospace" font-size="9">+ Both systems run in parallel</text>

  <rect x="410" y="310" width="360" height="90" fill="#313244" stroke="#45475a" stroke-width="1" rx="4"/>
  <text x="590" y="335" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="10" font-weight="bold">Risks</text>
  <text x="430" y="355" fill="#f38ba8" font-family="monospace" font-size="9">- Dual data paths during transition</text>
  <text x="430" y="373" fill="#f38ba8" font-family="monospace" font-size="9">- Backfilled events are synthetic</text>
  <text x="430" y="391" fill="#f38ba8" font-family="monospace" font-size="9">- Multi-month effort minimum</text>
</svg>