<svg viewBox="0 0 800 400" width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#1e1e2e" rx="8"/>
  <text x="400" y="35" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="16" font-weight="bold">Decision Framework: Do You Need Event Sourcing?</text>

  <!-- Decision tree -->
  <!-- Q1 -->
  <rect x="250" y="55" width="300" height="35" fill="#313244" stroke="#89b4fa" stroke-width="1.5" rx="4"/>
  <text x="400" y="77" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="9">Is event history a business asset?</text>

  <!-- No branch -->
  <line x1="310" y1="90" x2="150" y2="120" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="210" y="105" fill="#f38ba8" font-family="monospace" font-size="8">No</text>

  <rect x="50" y="120" width="200" height="35" fill="#313244" stroke="#f38ba8" stroke-width="1.5" rx="4"/>
  <text x="150" y="142" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="9">CRUD + audit log</text>

  <!-- Yes branch -->
  <line x1="490" y1="90" x2="550" y2="120" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="530" y="105" fill="#a6e3a1" font-family="monospace" font-size="8">Yes</text>

  <!-- Q2 -->
  <rect x="430" y="120" width="300" height="35" fill="#313244" stroke="#89b4fa" stroke-width="1.5" rx="4"/>
  <text x="580" y="142" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="9">Multiple different read models?</text>

  <!-- No branch Q2 -->
  <line x1="490" y1="155" x2="350" y2="185" stroke="#f9e2af" stroke-width="1.5"/>
  <text x="400" y="170" fill="#f9e2af" font-family="monospace" font-size="8">No</text>

  <rect x="230" y="185" width="240" height="35" fill="#313244" stroke="#f9e2af" stroke-width="1.5" rx="4"/>
  <text x="350" y="207" text-anchor="middle" fill="#f9e2af" font-family="monospace" font-size="9">CQRS without event sourcing</text>

  <!-- Yes branch Q2 -->
  <line x1="670" y1="155" x2="670" y2="185" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="685" y="175" fill="#a6e3a1" font-family="monospace" font-size="8">Yes</text>

  <!-- Q3 -->
  <rect x="540" y="185" width="270" height="35" fill="#313244" stroke="#89b4fa" stroke-width="1.5" rx="4"/>
  <text x="675" y="207" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="9">Team has distributed sys experience?</text>

  <!-- No branch Q3 -->
  <line x1="610" y1="220" x2="500" y2="250" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="540" y="235" fill="#f38ba8" font-family="monospace" font-size="8">No</text>

  <rect x="380" y="250" width="240" height="35" fill="#313244" stroke="#f38ba8" stroke-width="1.5" rx="4"/>
  <text x="500" y="272" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="9">Train first, then reconsider</text>

  <!-- Yes branch Q3 -->
  <line x1="740" y1="220" x2="740" y2="250" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="755" y="240" fill="#a6e3a1" font-family="monospace" font-size="8">Yes</text>

  <rect x="640" y="250" width="140" height="35" fill="#313244" stroke="#a6e3a1" stroke-width="2" rx="4"/>
  <text x="710" y="272" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="10" font-weight="bold">Event Source</text>

  <!-- Bottom: complexity spectrum -->
  <rect x="40" y="310" width="720" height="70" fill="#313244" stroke="#45475a" stroke-width="1" rx="4"/>
  <text x="400" y="335" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="11" font-weight="bold">Complexity Spectrum</text>

  <line x1="80" y1="360" x2="720" y2="360" stroke="#45475a" stroke-width="2"/>

  <circle cx="140" cy="360" r="6" fill="#a6e3a1"/>
  <text x="140" y="352" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="8">CRUD</text>

  <circle cx="320" cy="360" r="6" fill="#f9e2af"/>
  <text x="320" y="352" text-anchor="middle" fill="#f9e2af" font-family="monospace" font-size="8">CRUD+Audit</text>

  <circle cx="480" cy="360" r="6" fill="#89b4fa"/>
  <text x="480" y="352" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="8">CQRS only</text>

  <circle cx="660" cy="360" r="6" fill="#f38ba8"/>
  <text x="660" y="352" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="8">ES+CQRS</text>
</svg>