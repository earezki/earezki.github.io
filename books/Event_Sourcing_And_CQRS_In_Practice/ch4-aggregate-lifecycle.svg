<svg viewBox="0 0 800 380" width="800" height="380" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="380" fill="#1e1e2e" rx="8"/>
  <text x="400" y="35" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="16" font-weight="bold">Aggregate Lifecycle: Command → Validate → Events</text>

  <!-- Command input -->
  <rect x="30" y="140" width="130" height="40" fill="#313244" stroke="#f38ba8" stroke-width="1.5" rx="4"/>
  <text x="95" y="165" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="10">PlaceOrder cmd</text>

  <line x1="160" y1="160" x2="200" y2="160" stroke="#6c7086" stroke-width="1.5"/>
  <polygon points="200,160 194,156 194,164" fill="#6c7086"/>

  <!-- Aggregate box -->
  <rect x="200" y="70" width="400" height="240" fill="#313244" stroke="#f9e2af" stroke-width="2" rx="6"/>
  <text x="400" y="95" text-anchor="middle" fill="#f9e2af" font-family="monospace" font-size="13" font-weight="bold">OrderAggregate</text>

  <!-- Step 1: Load -->
  <rect x="230" y="110" width="140" height="35" fill="#1e1e2e" stroke="#89b4fa" stroke-width="1" rx="4"/>
  <text x="300" y="132" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="9">1. Load from events</text>

  <line x1="370" y1="127" x2="410" y2="127" stroke="#6c7086" stroke-width="1"/>
  <polygon points="410,127 404,123 404,131" fill="#6c7086"/>

  <!-- Step 2: Validate -->
  <rect x="410" y="110" width="160" height="35" fill="#1e1e2e" stroke="#f38ba8" stroke-width="1" rx="4"/>
  <text x="490" y="132" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="9">2. Validate invariants</text>

  <!-- Arrow down -->
  <line x1="490" y1="145" x2="490" y2="175" stroke="#6c7086" stroke-width="1"/>
  <polygon points="490,175 486,169 494,169" fill="#6c7086"/>

  <!-- Step 3: Produce events -->
  <rect x="410" y="175" width="160" height="35" fill="#1e1e2e" stroke="#a6e3a1" stroke-width="1" rx="4"/>
  <text x="490" y="197" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="9">3. Produce events</text>

  <!-- Arrow down -->
  <line x1="490" y1="210" x2="490" y2="240" stroke="#6c7086" stroke-width="1"/>
  <polygon points="490,240 486,234 494,234" fill="#6c7086"/>

  <!-- Step 4: Apply -->
  <rect x="410" y="240" width="160" height="35" fill="#1e1e2e" stroke="#cba6f7" stroke-width="1" rx="4"/>
  <text x="490" y="262" text-anchor="middle" fill="#cba6f7" font-family="monospace" font-size="9">4. Apply to state</text>

  <!-- Version tracking -->
  <rect x="230" y="190" width="140" height="60" fill="#1e1e2e" stroke="#45475a" stroke-width="1" rx="4"/>
  <text x="300" y="210" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="9">version: 4</text>
  <text x="300" y="225" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="9">status: CONFIRMED</text>
  <text x="300" y="240" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="9">total: $49.99</text>

  <!-- Output events -->
  <line x1="600" y1="200" x2="650" y2="200" stroke="#a6e3a1" stroke-width="1.5"/>
  <polygon points="650,200 644,196 644,204" fill="#a6e3a1"/>

  <rect x="650" y="130" width="120" height="30" fill="#313244" stroke="#a6e3a1" stroke-width="1" rx="4"/>
  <text x="710" y="150" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="9">OrderPlaced</text>

  <rect x="650" y="170" width="120" height="30" fill="#313244" stroke="#a6e3a1" stroke-width="1" rx="4"/>
  <text x="710" y="190" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="9">→ Event Store</text>

  <!-- Bottom note -->
  <text x="400" y="345" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="11">Aggregate = transactional consistency boundary</text>
  <text x="400" y="365" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="10">Optimistic concurrency via version checking</text>
</svg>