<svg viewBox="0 0 800 380" width="800" height="380" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="380" fill="#1e1e2e" rx="8"/>
  <text x="400" y="35" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="16" font-weight="bold">Projection Pipeline: Events → Read Models</text>

  <!-- Event Store -->
  <rect x="40" y="130" width="140" height="60" fill="#313244" stroke="#a6e3a1" stroke-width="1.5" rx="4"/>
  <text x="110" y="155" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="11" font-weight="bold">Event Store</text>
  <text x="110" y="175" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="9">global_position</text>

  <!-- Arrow to projection engine -->
  <line x1="180" y1="160" x2="240" y2="160" stroke="#a6e3a1" stroke-width="1.5"/>
  <polygon points="240,160 234,156 234,164" fill="#a6e3a1"/>
  <text x="210" y="150" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="8">poll</text>

  <!-- Projection Engine -->
  <rect x="240" y="110" width="160" height="100" fill="#313244" stroke="#89b4fa" stroke-width="2" rx="6"/>
  <text x="320" y="140" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="11" font-weight="bold">Projection</text>
  <text x="320" y="158" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="11" font-weight="bold">Engine</text>
  <text x="320" y="180" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="9">tracks position</text>
  <text x="320" y="195" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="9">idempotent apply</text>

  <!-- Arrows to read models -->
  <!-- PostgreSQL -->
  <line x1="400" y1="130" x2="500" y2="80" stroke="#f9e2af" stroke-width="1.5"/>
  <polygon points="500,80 493,81 496,88" fill="#f9e2af"/>
  <rect x="500" y="55" width="150" height="50" fill="#313244" stroke="#f9e2af" stroke-width="1" rx="4"/>
  <text x="575" y="75" text-anchor="middle" fill="#f9e2af" font-family="monospace" font-size="10" font-weight="bold">PostgreSQL</text>
  <text x="575" y="93" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="9">order_summary table</text>

  <!-- Redis -->
  <line x1="400" y1="160" x2="500" y2="160" stroke="#f38ba8" stroke-width="1.5"/>
  <polygon points="500,160 494,156 494,164" fill="#f38ba8"/>
  <rect x="500" y="135" width="150" height="50" fill="#313244" stroke="#f38ba8" stroke-width="1" rx="4"/>
  <text x="575" y="155" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="10" font-weight="bold">Redis</text>
  <text x="575" y="173" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="9">cached lookups</text>

  <!-- Elasticsearch -->
  <line x1="400" y1="190" x2="500" y2="240" stroke="#a6e3a1" stroke-width="1.5"/>
  <polygon points="500,240 493,233 497,240" fill="#a6e3a1"/>
  <rect x="500" y="215" width="150" height="50" fill="#313244" stroke="#a6e3a1" stroke-width="1" rx="4"/>
  <text x="575" y="235" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="10" font-weight="bold">Elasticsearch</text>
  <text x="575" y="253" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="9">full-text search</text>

  <!-- Position tracking -->
  <rect x="40" y="270" width="360" height="80" fill="#313244" stroke="#45475a" stroke-width="1" rx="4"/>
  <text x="220" y="295" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="10" font-weight="bold">projection_positions table</text>
  <text x="220" y="315" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="9">OrderSummary → last_processed: 4,523</text>
  <text x="220" y="335" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="9">SearchIndex → last_processed: 4,521 (2 behind)</text>

  <!-- Lag indicator -->
  <rect x="500" y="290" width="250" height="50" fill="#313244" stroke="#f38ba8" stroke-width="1" rx="4"/>
  <text x="625" y="315" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="10">Lag = store.max - projection.pos</text>
  <text x="625" y="332" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="9">Lag > 0 = eventual consistency</text>
</svg>