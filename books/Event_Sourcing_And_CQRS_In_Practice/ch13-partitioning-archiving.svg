<svg viewBox="0 0 800 350" width="800" height="350" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="350" fill="#1e1e2e" rx="8"/>
  <text x="400" y="35" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="16" font-weight="bold">Event Store Partitioning and Archiving</text>

  <!-- Timeline -->
  <line x1="40" y1="160" x2="760" y2="160" stroke="#45475a" stroke-width="2"/>
  <polygon points="760,160 754,156 754,164" fill="#45475a"/>
  <text x="770" y="165" fill="#6c7086" font-family="monospace" font-size="8">time</text>

  <!-- Archived partitions -->
  <rect x="50" y="100" width="100" height="45" fill="#313244" stroke="#6c7086" stroke-width="1" rx="4" opacity="0.5"/>
  <text x="100" y="120" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="8">2024-Q1</text>
  <text x="100" y="135" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="7">ARCHIVED</text>
  <line x1="100" y1="80" x2="100" y2="100" stroke="#6c7086" stroke-width="1" stroke-dasharray="3"/>
  <text x="100" y="75" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="7">→ S3</text>

  <rect x="160" y="100" width="100" height="45" fill="#313244" stroke="#6c7086" stroke-width="1" rx="4" opacity="0.5"/>
  <text x="210" y="120" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="8">2024-Q2</text>
  <text x="210" y="135" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="7">ARCHIVED</text>

  <rect x="270" y="100" width="100" height="45" fill="#313244" stroke="#6c7086" stroke-width="1" rx="4" opacity="0.5"/>
  <text x="320" y="120" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="8">2024-Q3</text>
  <text x="320" y="135" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="7">ARCHIVED</text>

  <!-- Active partitions -->
  <rect x="390" y="100" width="100" height="45" fill="#313244" stroke="#f9e2af" stroke-width="1.5" rx="4"/>
  <text x="440" y="120" text-anchor="middle" fill="#f9e2af" font-family="monospace" font-size="8">2025-Q4</text>
  <text x="440" y="135" text-anchor="middle" fill="#f9e2af" font-family="monospace" font-size="7">ONLINE</text>

  <rect x="500" y="100" width="100" height="45" fill="#313244" stroke="#89b4fa" stroke-width="1.5" rx="4"/>
  <text x="550" y="120" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="8">2026-Q1</text>
  <text x="550" y="135" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="7">ONLINE</text>

  <rect x="610" y="100" width="100" height="45" fill="#313244" stroke="#a6e3a1" stroke-width="2" rx="4"/>
  <text x="660" y="120" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="8" font-weight="bold">2026-Q2</text>
  <text x="660" y="135" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="7">ACTIVE</text>

  <!-- Dots on timeline -->
  <circle cx="100" cy="160" r="4" fill="#6c7086"/>
  <circle cx="210" cy="160" r="4" fill="#6c7086"/>
  <circle cx="320" cy="160" r="4" fill="#6c7086"/>
  <circle cx="440" cy="160" r="4" fill="#f9e2af"/>
  <circle cx="550" cy="160" r="4" fill="#89b4fa"/>
  <circle cx="660" cy="160" r="4" fill="#a6e3a1"/>

  <!-- Storage math -->
  <rect x="40" y="190" width="340" height="140" fill="#313244" stroke="#45475a" stroke-width="1" rx="4"/>
  <text x="210" y="215" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="11" font-weight="bold">Storage Growth Estimates</text>
  <text x="60" y="240" fill="#6c7086" font-family="monospace" font-size="9">1K orders/day: ~3 GB/year</text>
  <text x="60" y="260" fill="#6c7086" font-family="monospace" font-size="9">10K orders/day: ~30 GB/year</text>
  <text x="60" y="280" fill="#f9e2af" font-family="monospace" font-size="9">100K orders/day: ~300 GB/year</text>
  <text x="60" y="305" fill="#cdd6f4" font-family="monospace" font-size="9">Includes indexes + TOAST overhead</text>

  <!-- Partition benefits -->
  <rect x="420" y="190" width="340" height="140" fill="#313244" stroke="#45475a" stroke-width="1" rx="4"/>
  <text x="590" y="215" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="11" font-weight="bold">Why Partition?</text>
  <text x="440" y="240" fill="#a6e3a1" font-family="monospace" font-size="9">+ Queries scan only relevant months</text>
  <text x="440" y="260" fill="#a6e3a1" font-family="monospace" font-size="9">+ Archive old partitions independently</text>
  <text x="440" y="280" fill="#a6e3a1" font-family="monospace" font-size="9">+ VACUUM runs per-partition</text>
  <text x="440" y="305" fill="#f38ba8" font-family="monospace" font-size="9">Must auto-create future partitions</text>
</svg>