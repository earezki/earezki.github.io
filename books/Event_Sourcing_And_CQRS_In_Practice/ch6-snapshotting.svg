<svg viewBox="0 0 800 350" width="800" height="350" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="350" fill="#1e1e2e" rx="8"/>
  <text x="400" y="35" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="16" font-weight="bold">Snapshotting: Skip the Full Replay</text>

  <!-- Full replay (top) -->
  <text x="60" y="70" fill="#f38ba8" font-family="monospace" font-size="11" font-weight="bold">Without Snapshot: Replay all 10,000 events</text>

  <rect x="60" y="80" width="30" height="20" fill="#313244" stroke="#6c7086" stroke-width="0.5" rx="2"/>
  <rect x="95" y="80" width="30" height="20" fill="#313244" stroke="#6c7086" stroke-width="0.5" rx="2"/>
  <rect x="130" y="80" width="30" height="20" fill="#313244" stroke="#6c7086" stroke-width="0.5" rx="2"/>
  <rect x="165" y="80" width="30" height="20" fill="#313244" stroke="#6c7086" stroke-width="0.5" rx="2"/>
  <text x="210" y="95" fill="#6c7086" font-family="monospace" font-size="10">...</text>
  <rect x="230" y="80" width="30" height="20" fill="#313244" stroke="#6c7086" stroke-width="0.5" rx="2"/>
  <rect x="265" y="80" width="30" height="20" fill="#313244" stroke="#6c7086" stroke-width="0.5" rx="2"/>
  <rect x="300" y="80" width="30" height="20" fill="#313244" stroke="#6c7086" stroke-width="0.5" rx="2"/>
  <text x="345" y="95" fill="#6c7086" font-family="monospace" font-size="10">...</text>
  <rect x="365" y="80" width="30" height="20" fill="#313244" stroke="#6c7086" stroke-width="0.5" rx="2"/>
  <rect x="400" y="80" width="30" height="20" fill="#313244" stroke="#6c7086" stroke-width="0.5" rx="2"/>

  <line x1="440" y1="90" x2="500" y2="90" stroke="#f38ba8" stroke-width="1"/>
  <polygon points="500,90 494,86 494,94" fill="#f38ba8"/>
  <rect x="500" y="77" width="100" height="26" fill="#313244" stroke="#f38ba8" stroke-width="1" rx="4"/>
  <text x="550" y="95" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="9">State v10000</text>
  <text x="680" y="95" fill="#f38ba8" font-family="monospace" font-size="10">~500ms</text>

  <!-- With snapshot (bottom) -->
  <text x="60" y="160" fill="#a6e3a1" font-family="monospace" font-size="11" font-weight="bold">With Snapshot: Load snapshot + replay 100 events</text>

  <!-- Snapshot -->
  <rect x="60" y="175" width="140" height="50" fill="#313244" stroke="#89b4fa" stroke-width="2" rx="4"/>
  <text x="130" y="195" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="10" font-weight="bold">Snapshot</text>
  <text x="130" y="212" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="9">v9900 state</text>

  <line x1="200" y1="200" x2="240" y2="200" stroke="#a6e3a1" stroke-width="1.5"/>
  <polygon points="240,200 234,196 234,204" fill="#a6e3a1"/>

  <!-- Remaining events -->
  <rect x="245" y="188" width="25" height="20" fill="#313244" stroke="#a6e3a1" stroke-width="1" rx="2"/>
  <rect x="275" y="188" width="25" height="20" fill="#313244" stroke="#a6e3a1" stroke-width="1" rx="2"/>
  <rect x="305" y="188" width="25" height="20" fill="#313244" stroke="#a6e3a1" stroke-width="1" rx="2"/>
  <text x="345" y="203" fill="#6c7086" font-family="monospace" font-size="10">...</text>
  <rect x="365" y="188" width="25" height="20" fill="#313244" stroke="#a6e3a1" stroke-width="1" rx="2"/>
  <rect x="395" y="188" width="25" height="20" fill="#313244" stroke="#a6e3a1" stroke-width="1" rx="2"/>
  <text x="435" y="200" fill="#6c7086" font-family="monospace" font-size="9">100</text>

  <line x1="445" y1="198" x2="500" y2="198" stroke="#a6e3a1" stroke-width="1"/>
  <polygon points="500,198 494,194 494,202" fill="#a6e3a1"/>
  <rect x="500" y="185" width="100" height="26" fill="#313244" stroke="#a6e3a1" stroke-width="1" rx="4"/>
  <text x="550" y="203" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="9">State v10000</text>
  <text x="680" y="203" fill="#a6e3a1" font-family="monospace" font-size="10">~5ms</text>

  <!-- Key points -->
  <rect x="60" y="255" width="680" height="75" fill="#313244" stroke="#45475a" stroke-width="1" rx="4"/>
  <text x="80" y="278" fill="#cdd6f4" font-family="monospace" font-size="10">Snapshot interval: configurable (every N events, e.g., 100)</text>
  <text x="80" y="298" fill="#cdd6f4" font-family="monospace" font-size="10">Corrupt snapshot: fallback to full replay (self-healing)</text>
  <text x="80" y="318" fill="#cdd6f4" font-family="monospace" font-size="10">Snapshot = optimization, never the source of truth</text>
</svg>