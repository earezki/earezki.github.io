<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" fill="#3b82f6">
      <polygon points="0 0, 10 3.5, 0 7"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="12" fill="url(#bgGrad)" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">ML Project Architecture</text>
  <line x1="280" y1="48" x2="520" y2="48" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>

  <!-- Layer 1: Serving Layer (top) -->
  <rect x="120" y="70" width="560" height="80" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="120" y="70" width="560" height="28" rx="12" fill="#3b82f6"/>
  <rect x="120" y="86" width="560" height="12" fill="#3b82f6"/>
  <text x="400" y="89" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">Serving Layer</text>
  <text x="200" y="125" text-anchor="middle" font-size="13" fill="#475569">REST API</text>
  <text x="340" y="125" text-anchor="middle" font-size="13" fill="#475569">A/B Testing</text>
  <text x="480" y="125" text-anchor="middle" font-size="13" fill="#475569">Monitoring</text>
  <text x="610" y="125" text-anchor="middle" font-size="13" fill="#475569">Alerts</text>

  <!-- Arrow 1 -->
  <line x1="400" y1="150" x2="400" y2="180" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <rect x="420" y="155" width="70" height="20" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="455" y="169" text-anchor="middle" font-size="11" font-weight="600" fill="#3b82f6">FastAPI</text>

  <!-- Layer 2: Training Layer -->
  <rect x="120" y="182" width="560" height="80" rx="12" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <rect x="120" y="182" width="560" height="28" rx="12" fill="#10b981"/>
  <rect x="120" y="198" width="560" height="12" fill="#10b981"/>
  <text x="400" y="201" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">Training Layer</text>
  <text x="200" y="237" text-anchor="middle" font-size="13" fill="#475569">Experiments</text>
  <text x="340" y="237" text-anchor="middle" font-size="13" fill="#475569">Hyperparams</text>
  <text x="480" y="237" text-anchor="middle" font-size="13" fill="#475569">Validation</text>
  <text x="610" y="237" text-anchor="middle" font-size="13" fill="#475569">Metrics</text>

  <!-- Arrow 2 -->
  <line x1="400" y1="262" x2="400" y2="292" stroke="#10b981" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <rect x="420" y="267" width="70" height="20" rx="4" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
  <text x="455" y="281" text-anchor="middle" font-size="11" font-weight="600" fill="#10b981">MLflow</text>

  <!-- Layer 3: Feature Layer -->
  <rect x="120" y="294" width="560" height="80" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <rect x="120" y="294" width="560" height="28" rx="12" fill="#f59e0b"/>
  <rect x="120" y="310" width="560" height="12" fill="#f59e0b"/>
  <text x="400" y="313" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">Feature Layer</text>
  <text x="200" y="349" text-anchor="middle" font-size="13" fill="#475569">Transforms</text>
  <text x="340" y="349" text-anchor="middle" font-size="13" fill="#475569">Validation</text>
  <text x="480" y="349" text-anchor="middle" font-size="13" fill="#475569">Feature Store</text>
  <text x="610" y="349" text-anchor="middle" font-size="13" fill="#475569">Schemas</text>

  <!-- Arrow 3 -->
  <line x1="400" y1="374" x2="400" y2="404" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <rect x="415" y="379" width="80" height="20" rx="4" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="455" y="393" text-anchor="middle" font-size="11" font-weight="600" fill="#d97706">Pydantic</text>

  <!-- Layer 4: Data Layer (bottom) -->
  <rect x="120" y="406" width="560" height="80" rx="12" fill="#ffffff" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="120" y="406" width="560" height="28" rx="12" fill="#8b5cf6"/>
  <rect x="120" y="422" width="560" height="12" fill="#8b5cf6"/>
  <text x="400" y="425" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">Data Layer</text>
  <text x="200" y="461" text-anchor="middle" font-size="13" fill="#475569">Storage</text>
  <text x="340" y="461" text-anchor="middle" font-size="13" fill="#475569">Versioning</text>
  <text x="480" y="461" text-anchor="middle" font-size="13" fill="#475569">Ingestion</text>
  <text x="610" y="461" text-anchor="middle" font-size="13" fill="#475569">Lineage</text>

  <!-- DVC label at bottom -->
  <rect x="30" y="430" width="60" height="20" rx="4" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1"/>
  <text x="60" y="444" text-anchor="middle" font-size="11" font-weight="600" fill="#8b5cf6">DVC</text>
  <line x1="90" y1="440" x2="118" y2="446" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4,3"/>
</svg>