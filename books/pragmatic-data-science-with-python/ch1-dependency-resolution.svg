<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <marker id="arrowGray" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto" fill="#6b7280">
      <polygon points="0 0, 8 3, 0 6"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto" fill="#10b981">
      <polygon points="0 0, 8 3, 0 6"/>
    </marker>
  </defs>

  <rect width="800" height="500" rx="12" fill="url(#bgGrad)" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">Dependency Resolution: pip vs uv</text>
  <line x1="230" y1="48" x2="570" y2="48" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>

  <!-- Divider -->
  <line x1="400" y1="60" x2="400" y2="490" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- === LEFT SIDE: pip === -->
  <rect x="90" y="65" width="220" height="32" rx="8" fill="#ef4444" filter="url(#shadow)"/>
  <text x="200" y="86" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">pip (Sequential)</text>

  <!-- Diamond dependency tree -->
  <rect x="165" y="115" width="70" height="30" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="200" y="135" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">A</text>

  <line x1="180" y1="145" x2="145" y2="170" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <line x1="220" y1="145" x2="255" y2="170" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowGray)"/>

  <rect x="110" y="172" width="60" height="28" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="140" y="191" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">B</text>

  <rect x="230" y="172" width="60" height="28" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="260" y="191" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">D</text>

  <line x1="140" y1="200" x2="185" y2="225" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <line x1="260" y1="200" x2="215" y2="225" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowGray)"/>

  <rect x="170" y="227" width="60" height="28" rx="6" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
  <text x="200" y="246" text-anchor="middle" font-size="13" font-weight="600" fill="#ef4444">C ⚠</text>

  <!-- Sequential timeline -->
  <text x="200" y="280" text-anchor="middle" font-size="12" font-weight="600" fill="#6b7280">Resolution Timeline</text>

  <rect x="60" y="295" width="280" height="160" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>

  <!-- Timeline bars - sequential -->
  <text x="75" y="318" font-size="11" fill="#6b7280">t=0s</text>
  <rect x="110" y="305" width="100" height="18" rx="4" fill="#fecaca"/>
  <text x="160" y="318" text-anchor="middle" font-size="10" font-weight="600" fill="#991b1b">Download A</text>

  <text x="75" y="343" font-size="11" fill="#6b7280">t=2s</text>
  <rect x="110" y="330" width="80" height="18" rx="4" fill="#fecaca"/>
  <text x="150" y="343" text-anchor="middle" font-size="10" font-weight="600" fill="#991b1b">Resolve B</text>

  <text x="75" y="368" font-size="11" fill="#6b7280">t=4s</text>
  <rect x="110" y="355" width="80" height="18" rx="4" fill="#fecaca"/>
  <text x="150" y="368" text-anchor="middle" font-size="10" font-weight="600" fill="#991b1b">Resolve D</text>

  <text x="75" y="393" font-size="11" fill="#6b7280">t=6s</text>
  <rect x="110" y="380" width="120" height="18" rx="4" fill="#fecaca"/>
  <text x="170" y="393" text-anchor="middle" font-size="10" font-weight="600" fill="#991b1b">Resolve C conflict</text>

  <text x="75" y="418" font-size="11" fill="#6b7280">t=9s</text>
  <rect x="110" y="405" width="60" height="18" rx="4" fill="#fecaca"/>
  <text x="140" y="418" text-anchor="middle" font-size="10" font-weight="600" fill="#991b1b">Install</text>

  <!-- Total time pip -->
  <rect x="110" y="435" width="180" height="22" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
  <text x="200" y="450" text-anchor="middle" font-size="12" font-weight="700" fill="#ef4444">Total: ~10 seconds</text>

  <!-- === RIGHT SIDE: uv === -->
  <rect x="490" y="65" width="220" height="32" rx="8" fill="#10b981" filter="url(#shadow)"/>
  <text x="600" y="86" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">uv (Parallel)</text>

  <!-- Diamond dependency tree -->
  <rect x="565" y="115" width="70" height="30" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
  <text x="600" y="135" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">A</text>

  <line x1="580" y1="145" x2="545" y2="170" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="620" y1="145" x2="655" y2="170" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <rect x="510" y="172" width="60" height="28" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
  <text x="540" y="191" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">B</text>

  <rect x="630" y="172" width="60" height="28" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
  <text x="660" y="191" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">D</text>

  <line x1="540" y1="200" x2="585" y2="225" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="660" y1="200" x2="615" y2="225" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <rect x="570" y="227" width="60" height="28" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
  <text x="600" y="246" text-anchor="middle" font-size="13" font-weight="600" fill="#10b981">C ✓</text>

  <!-- Parallel timeline -->
  <text x="600" y="280" text-anchor="middle" font-size="12" font-weight="600" fill="#6b7280">Resolution Timeline</text>

  <rect x="460" y="295" width="280" height="160" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>

  <!-- Timeline bars - parallel -->
  <text x="475" y="318" font-size="11" fill="#6b7280">t=0s</text>
  <rect x="510" y="305" width="100" height="18" rx="4" fill="#d1fae5"/>
  <text x="560" y="318" text-anchor="middle" font-size="10" font-weight="600" fill="#065f46">Parse all deps</text>

  <text x="475" y="343" font-size="11" fill="#6b7280">t=0s</text>
  <rect x="510" y="330" width="70" height="18" rx="4" fill="#d1fae5"/>
  <rect x="590" y="330" width="70" height="18" rx="4" fill="#d1fae5"/>
  <text x="545" y="343" text-anchor="middle" font-size="10" font-weight="600" fill="#065f46">B ∥</text>
  <text x="625" y="343" text-anchor="middle" font-size="10" font-weight="600" fill="#065f46">D ∥</text>

  <text x="475" y="368" font-size="11" fill="#6b7280">t=1s</text>
  <rect x="510" y="355" width="80" height="18" rx="4" fill="#d1fae5"/>
  <text x="550" y="368" text-anchor="middle" font-size="10" font-weight="600" fill="#065f46">Resolve C</text>

  <text x="475" y="393" font-size="11" fill="#6b7280">t=1s</text>
  <rect x="510" y="380" width="60" height="18" rx="4" fill="#d1fae5"/>
  <text x="540" y="393" text-anchor="middle" font-size="10" font-weight="600" fill="#065f46">Install</text>

  <!-- Total time uv -->
  <rect x="510" y="435" width="180" height="22" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
  <text x="600" y="450" text-anchor="middle" font-size="12" font-weight="700" fill="#10b981">Total: ~2 seconds</text>

  <!-- Speed comparison -->
  <text x="400" y="485" text-anchor="middle" font-size="13" font-weight="700" fill="#3b82f6">⚡ uv is 5–10x faster with Rust-based parallel resolver</text>
</svg>