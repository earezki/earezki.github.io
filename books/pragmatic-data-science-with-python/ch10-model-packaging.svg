<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="880" height="540" rx="12" fill="#f8fafc"/>

  <!-- Title -->
  <text x="440" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">Model Packaging Formats Comparison</text>
  <line x1="260" y1="48" x2="620" y2="48" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Column 1: Pickle -->
  <rect x="25" y="70" width="196" height="310" rx="10" fill="#fff" stroke="#ef4444" stroke-width="2" filter="url(#shadow)"/>
  <!-- Header -->
  <rect x="25" y="70" width="196" height="50" rx="10" fill="#ef4444"/>
  <rect x="25" y="95" width="196" height="25" fill="#ef4444"/>
  <text x="123" y="100" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">Pickle</text>

  <!-- Traffic light: Red -->
  <circle cx="123" cy="140" r="14" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <circle cx="123" cy="140" r="9" fill="#ef4444"/>
  <text x="123" y="168" text-anchor="middle" font-size="10" font-weight="600" fill="#ef4444">⚠ SECURITY RISK</text>

  <line x1="45" y1="180" x2="201" y2="180" stroke="#fecaca" stroke-width="1"/>
  <text x="123" y="200" text-anchor="middle" font-size="12" fill="#475569">Python-only format</text>
  <text x="123" y="220" text-anchor="middle" font-size="12" fill="#475569">Fast serialization</text>
  <text x="123" y="240" text-anchor="middle" font-size="12" fill="#475569">Arbitrary code exec</text>
  <text x="123" y="260" text-anchor="middle" font-size="12" fill="#ef4444" font-weight="600">Untrusted data risk</text>
  <line x1="45" y1="275" x2="201" y2="275" stroke="#fecaca" stroke-width="1"/>
  <text x="123" y="295" text-anchor="middle" font-size="11" fill="#64748b">Framework: Any Python</text>
  <text x="123" y="312" text-anchor="middle" font-size="11" fill="#64748b">Runtime: CPython</text>
  <text x="123" y="329" text-anchor="middle" font-size="11" fill="#64748b">Extension: .pkl / .joblib</text>
  <rect x="45" y="345" width="156" height="22" rx="5" fill="#fef2f2"/>
  <text x="123" y="360" text-anchor="middle" font-size="11" font-weight="600" fill="#ef4444">Not recommended</text>

  <!-- Column 2: ONNX -->
  <rect x="235" y="70" width="196" height="310" rx="10" fill="#fff" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <rect x="235" y="70" width="196" height="50" rx="10" fill="#10b981"/>
  <rect x="235" y="95" width="196" height="25" fill="#10b981"/>
  <text x="333" y="100" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">ONNX</text>

  <!-- Traffic light: Green -->
  <circle cx="333" cy="140" r="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <circle cx="333" cy="140" r="9" fill="#10b981"/>
  <text x="333" y="168" text-anchor="middle" font-size="10" font-weight="600" fill="#10b981">✓ RECOMMENDED</text>

  <line x1="255" y1="180" x2="411" y2="180" stroke="#a7f3d0" stroke-width="1"/>
  <text x="333" y="200" text-anchor="middle" font-size="12" fill="#475569">Cross-platform</text>
  <text x="333" y="220" text-anchor="middle" font-size="12" fill="#475569">Optimized runtime</text>
  <text x="333" y="240" text-anchor="middle" font-size="12" fill="#475569">Broad support</text>
  <text x="333" y="260" text-anchor="middle" font-size="12" fill="#10b981" font-weight="600">Hardware acceleration</text>
  <line x1="255" y1="275" x2="411" y2="275" stroke="#a7f3d0" stroke-width="1"/>
  <text x="333" y="295" text-anchor="middle" font-size="11" fill="#64748b">Framework: Many</text>
  <text x="333" y="312" text-anchor="middle" font-size="11" fill="#64748b">Runtime: ONNX Runtime</text>
  <text x="333" y="329" text-anchor="middle" font-size="11" fill="#64748b">Extension: .onnx</text>
