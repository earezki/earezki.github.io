  <text x="753" y="220" text-anchor="middle" font-size="12" fill="#475569">TF Serving integration</text>
  <text x="753" y="240" text-anchor="middle" font-size="12" fill="#475569">Graph optimization</text>
  <text x="753" y="260" text-anchor="middle" font-size="12" fill="#d97706" font-weight="600">Locked to TF</text>
  <line x1="675" y1="275" x2="831" y2="275" stroke="#fde68a" stroke-width="1"/>
  <text x="753" y="295" text-anchor="middle" font-size="11" fill="#64748b">Framework: TensorFlow</text>
  <text x="753" y="312" text-anchor="middle" font-size="11" fill="#64748b">Runtime: TF Serving</text>
  <text x="753" y="329" text-anchor="middle" font-size="11" fill="#64748b">Extension: /saved_model</text>
  <rect x="675" y="345" width="156" height="22" rx="5" fill="#fffbeb"/>
