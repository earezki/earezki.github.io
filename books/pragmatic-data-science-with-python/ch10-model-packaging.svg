  <circle cx="543" cy="140" r="9" fill="#10b981"/>
  <text x="543" y="168" text-anchor="middle" font-size="10" font-weight="600" fill="#10b981">✓ FOR PYTORCH</text>

  <line x1="465" y1="180" x2="621" y2="180" stroke="#bfdbfe" stroke-width="1"/>
  <text x="543" y="200" text-anchor="middle" font-size="12" fill="#475569">PyTorch-native</text>
  <text x="543" y="220" text-anchor="middle" font-size="12" fill="#475569">JIT compilation</text>
  <text x="543" y="240" text-anchor="middle" font-size="12" fill="#475569">C++ deployment</text>
  <text x="543" y="260" text-anchor="middle" font-size="12" fill="#3b82f6" font-weight="600">No Python needed</text>
