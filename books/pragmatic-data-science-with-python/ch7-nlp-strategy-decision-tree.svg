<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" fill="#f8fafc" rx="8"/>

  <!-- Title -->
  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">NLP Strategy Decision Tree</text>

  <!-- Decision 1: Domain-specific knowledge? -->
  <g filter="url(#shadow)">
    <rect x="230" y="56" width="340" height="48" rx="6" fill="#f59e0b" opacity="0.15" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="400" y="84" text-anchor="middle" font-size="14" font-weight="600" fill="#92400e">Do you need domain-specific knowledge?</text>
  </g>

  <!-- No branch → Prompt Engineering -->
  <line x1="570" y1="80" x2="700" y2="80" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="635" y="73" text-anchor="middle" font-size="13" fill="#6b7280" font-weight="600">No</text>

  <g filter="url(#shadow)">
    <rect x="620" y="108" width="170" height="70" rx="10" fill="#10b981" opacity="0.18" stroke="#10b981" stroke-width="2"/>
    <text x="705" y="132" text-anchor="middle" font-size="15" font-weight="700" fill="#065f46">Prompt Engineering</text>
    <text x="705" y="152" text-anchor="middle" font-size="12" fill="#065f46">Cheapest &amp; Fastest</text>
    <text x="705" y="170" text-anchor="middle" font-size="16" font-weight="700" fill="#10b981">$</text>
  </g>
  <!-- curved connector from decision 1 right edge to outcome box -->
  <path d="M 700 80 L 705 80 L 705 108" stroke="#6b7280" stroke-width="1.5" fill="none"/>

  <!-- Yes branch down -->
  <line x1="400" y1="104" x2="400" y2="152" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="412" y="133" font-size="13" fill="#6b7280" font-weight="600">Yes</text>

  <!-- Decision 2: Knowledge in documents? -->
  <g filter="url(#shadow)">
    <rect x="220" y="158" width="360" height="48" rx="6" fill="#f59e0b" opacity="0.15" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="400" y="186" text-anchor="middle" font-size="14" font-weight="600" fill="#92400e">Is the knowledge in your documents?</text>
  </g>

  <!-- Yes branch right → RAG -->
  <line x1="580" y1="182" x2="700" y2="182" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="635" y="175" text-anchor="middle" font-size="13" fill="#6b7280" font-weight="600">Yes</text>

  <g filter="url(#shadow)">
    <rect x="620" y="210" width="170" height="70" rx="10" fill="#3b82f6" opacity="0.15" stroke="#3b82f6" stroke-width="2"/>
    <text x="705" y="234" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">RAG</text>
    <text x="705" y="252" text-anchor="middle" font-size="11" fill="#1e3a8a">Retrieval-Augmented</text>
    <text x="705" y="266" text-anchor="middle" font-size="11" fill="#1e3a8a">Generation</text>
    <text x="705" y="275" text-anchor="middle" font-size="16" font-weight="700" fill="#3b82f6">$$</text>
  </g>
  <path d="M 700 182 L 705 182 L 705 210" stroke="#6b7280" stroke-width="1.5" fill="none"/>

  <!-- No branch down -->
  <line x1="400" y1="206" x2="400" y2="260" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="412" y="238" font-size="13" fill="#6b7280" font-weight="600">No</text>

  <!-- Decision 3: Specific behavior/style? -->
  <g filter="url(#shadow)">
    <rect x="190" y="266" width="420" height="48" rx="6" fill="#f59e0b" opacity="0.15" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="400" y="294" text-anchor="middle" font-size="14" font-weight="600" fill="#92400e">Does the task require specific behavior or style?</text>
  </g>

  <!-- Yes branch → Fine-Tuning -->
  <line x1="400" y1="314" x2="400" y2="372" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="412" y="348" font-size="13" fill="#6b7280" font-weight="600">Yes</text>

  <g filter="url(#shadow)">
    <rect x="290" y="378" width="220" height="70" rx="10" fill="#8b5cf6" opacity="0.15" stroke="#8b5cf6" stroke-width="2"/>
    <text x="400" y="402" text-anchor="middle" font-size="15" font-weight="700" fill="#5b21b6">Fine-Tuning</text>
    <text x="400" y="420" text-anchor="middle" font-size="12" fill="#5b21b6">LoRA / QLoRA</text>
    <text x="400" y="440" text-anchor="middle" font-size="16" font-weight="700" fill="#8b5cf6">$$$</text>
  </g>

  <!-- No branch left → Few-shot -->
  <line x1="190" y1="290" x2="100" y2="290" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="145" y="283" text-anchor="middle" font-size="13" fill="#6b7280" font-weight="600">No</text>

  <g filter="url(#shadow)">
    <rect x="10" y="310" width="180" height="70" rx="10" fill="#10b981" opacity="0.18" stroke="#10b981" stroke-width="2"/>
    <text x="100" y="332" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">Prompt Engineering</text>
    <text x="100" y="350" text-anchor="middle" font-size="12" fill="#065f46">with few-shot examples</text>
    <text x="100" y="370" text-anchor="middle" font-size="16" font-weight="700" fill="#10b981">$</text>
  </g>
  <path d="M 100 290 L 100 310" stroke="#6b7280" stroke-width="1.5" fill="none"/>

  <!-- Legend -->
  <g transform="translate(30, 465)">
    <rect width="14" height="14" rx="3" fill="#10b981" opacity="0.5"/>
    <text x="20" y="12" font-size="12" fill="#374151">Prompt Engineering</text>
    <rect x="170" width="14" height="14" rx="3" fill="#3b82f6" opacity="0.5"/>
    <text x="190" y="12" font-size="12" fill="#374151">RAG</text>
    <rect x="280" width="14" height="14" rx="3" fill="#8b5cf6" opacity="0.5"/>
    <text x="300" y="12" font-size="12" fill="#374151">Fine-Tuning</text>
    <rect x="410" width="14" height="14" rx="3" fill="#f59e0b" opacity="0.3"/>
    <text x="430" y="12" font-size="12" fill="#374151">Decision</text>
  </g>
</svg>