<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" width="840" height="520" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="840" height="520" fill="#f8fafc" rx="8"/>

  <!-- Title -->
  <text x="420" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">Causal Inference Methods Landscape</text>

  <!-- Root -->
  <g filter="url(#shadow)">
    <rect x="280" y="55" width="280" height="44" rx="10" fill="#1e293b"/>
    <text x="420" y="82" text-anchor="middle" font-size="15" font-weight="700" fill="white">Estimating Causal Effects</text>
  </g>

  <!-- Branches down from root -->
  <line x1="350" y1="99" x2="180" y2="140" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="490" y1="99" x2="570" y2="140" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Branch 1: Experimental -->
  <g filter="url(#shadow)">
    <rect x="90" y="142" width="180" height="40" rx="8" fill="#10b981" opacity="0.15" stroke="#10b981" stroke-width="2"/>
    <text x="180" y="167" text-anchor="middle" font-size="15" font-weight="700" fill="#065f46">Experimental</text>
  </g>

  <line x1="180" y1="182" x2="180" y2="218" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- RCT -->
  <g filter="url(#shadow)">
    <rect x="90" y="222" width="180" height="60" rx="8" fill="white" stroke="#10b981" stroke-width="1.5"/>
    <text x="180" y="246" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">RCT (A/B Test)</text>
    <text x="180" y="266" text-anchor="middle" font-size="11" fill="#6b7280">Gold standard; random</text>
    <text x="180" y="278" text-anchor="middle" font-size="11" fill="#6b7280">assignment to groups</text>
  </g>

  <!-- Branch 2: Observational -->
  <g filter="url(#shadow)">
    <rect x="460" y="142" width="220" height="40" rx="8" fill="#3b82f6" opacity="0.15" stroke="#3b82f6" stroke-width="2"/>
    <text x="570" y="167" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">Observational</text>
  </g>

  <!-- Three sub-branches from Observational -->
  <line x1="480" y1="182" x2="140" y2="340" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="570" y1="182" x2="440" y2="340" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="660" y1="182" x2="720" y2="340" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Sub-branch A: Selection on Observables -->
  <g filter="url(#shadow)">
    <rect x="30" y="342" width="220" height="36" rx="8" fill="#f59e0b" opacity="0.12" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="140" y="365" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">Selection on Observables</text>
  </g>

  <!-- Leaves for Selection on Observables -->
  <line x1="90" y1="378" x2="60" y2="410" stroke="#6b7280" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="190" y1="378" x2="210" y2="410" stroke="#6b7280" stroke-width="1" marker-end="url(#arr)"/>

  <g filter="url(#shadow)">
    <rect x="0" y="414" width="130" height="56" rx="8" fill="white" stroke="#f59e0b" stroke-width="1"/>
    <text x="65" y="436" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">PSM</text>
    <text x="65" y="452" text-anchor="middle" font-size="10" fill="#6b7280">Propensity Score</text>
    <text x="65" y="464" text-anchor="middle" font-size="10" fill="#6b7280">Matching</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="145" y="414" width="130" height="56" rx="8" fill="white" stroke="#f59e0b" stroke-width="1"/>
    <text x="210" y="436" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">IPW</text>
    <text x="210" y="452" text-anchor="middle" font-size="10" fill="#6b7280">Inverse Propensity</text>
    <text x="210" y="464" text-anchor="middle" font-size="10" fill="#6b7280">Weighting</text>
  </g>

  <!-- Sub-branch B: Parallel Trends -->
  <g filter="url(#shadow)">
    <rect x="330" y="342" width="220" height="36" rx="8" fill="#8b5cf6" opacity="0.12" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="440" y="365" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">Parallel Trends</text>
  </g>

  <line x1="390" y1="378" x2="365" y2="410" stroke="#6b7280" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="490" y1="378" x2="510" y2="410" stroke="#6b7280" stroke-width="1" marker-end="url(#arr)"/>

  <g filter="url(#shadow)">
    <rect x="300" y="414" width="140" height="56" rx="8" fill="white" stroke="#8b5cf6" stroke-width="1"/>
    <text x="370" y="432" text-anchor="middle" font-size="12" font-weight="600" fill="#5b21b6">Diff-in-Diff</text>
    <text x="370" y="448" text-anchor="middle" font-size="10" fill="#6b7280">Before/after with</text>
    <text x="370" y="460" text-anchor="middle" font-size="10" fill="#6b7280">control group</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="455" y="414" width="140" height="56" rx="8" fill="white" stroke="#8b5cf6" stroke-width="1"/>
    <text x="525" y="432" text-anchor="middle" font-size="12" font-weight="600" fill="#5b21b6">Synthetic Control</text>
    <text x="525" y="448" text-anchor="middle" font-size="10" fill="#6b7280">Weighted combination</text>
    <text x="525" y="460" text-anchor="middle" font-size="10" fill="#6b7280">of control units</text>
  </g>

  <!-- Sub-branch C: Heterogeneous Effects -->
  <g filter="url(#shadow)">
    <rect x="620" y="342" width="210" height="36" rx="8" fill="#ef4444" opacity="0.12" stroke="#ef4444" stroke-width="1.5"/>
    <text x="725" y="365" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">Heterogeneous Effects</text>
  </g>

  <line x1="680" y1="378" x2="660" y2="410" stroke="#6b7280" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="770" y1="378" x2="785" y2="410" stroke="#6b7280" stroke-width="1" marker-end="url(#arr)"/>

  <g filter="url(#shadow)">
    <rect x="600" y="414" width="125" height="56" rx="8" fill="white" stroke="#ef4444" stroke-width="1"/>
    <text x="662" y="432" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">Uplift Modeling</text>
    <text x="662" y="448" text-anchor="middle" font-size="10" fill="#6b7280">Who benefits</text>
    <text x="662" y="460" text-anchor="middle" font-size="10" fill="#6b7280">most from treatment</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="740" y="414" width="95" height="56" rx="8" fill="white" stroke="#ef4444" stroke-width="1"/>
    <text x="787" y="432" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">CATE</text>
    <text x="787" y="448" text-anchor="middle" font-size="10" fill="#6b7280">Conditional</text>
    <text x="787" y="460" text-anchor="middle" font-size="10" fill="#6b7280">Avg Treatment</text>
  </g>
</svg>