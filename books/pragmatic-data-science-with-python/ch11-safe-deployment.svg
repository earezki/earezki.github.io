<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 620" width="860" height="620" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="9" markerHeight="7" orient="auto-start-auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="9" markerHeight="7" orient="auto-start-auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="9" markerHeight="7" orient="auto-start-auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10b981"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="9" markerHeight="7" orient="auto-start-auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f59e0b"/>
    </marker>
    <pattern id="diag" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#e2e8f0" stroke-width="2"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="860" height="620" rx="12" fill="#f8fafc"/>

  <!-- Title -->
  <text x="430" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">Safe Deployment Strategies</text>
  <line x1="260" y1="46" x2="600" y2="46" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>

  <!-- ============================================ -->
  <!-- Strategy 1: Shadow Deployment -->
  <!-- ============================================ -->
  <rect x="20" y="62" width="820" height="164" rx="12" fill="#fff" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Title bar -->
  <rect x="20" y="62" width="820" height="32" rx="12" fill="#8b5cf6"/>
  <rect x="20" y="80" width="820" height="14" fill="#8b5cf6"/>
  <text x="430" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Shadow Deployment</text>

  <!-- Input traffic -->
  <rect x="40" y="110" width="90" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="85" y="134" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">Requests</text>

  <!-- Arrow to router -->
  <line x1="130" y1="130" x2="175" y2="130" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Router/Load Balancer -->
  <rect x="179" y="110" width="70" height="40" rx="8" fill="#6b7280" filter="url(#shadow)"/>
  <text x="214" y="134" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Router</text>

  <!-- Arrow to production model (serves) -->
  <line x1="249" y1="120" x2="310" y2="120" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="280" y="115" text-anchor="middle" font-size="9" fill="#10b981">100%</text>

  <!-- Production Model -->
  <rect x="314" y="104" width="140" height="36" rx="8" fill="#10b981" filter="url(#shadow)"/>
  <text x="384" y="126" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Production Model</text>

  <!-- Arrow from production to response -->
  <line x1="454" y1="122" x2="510" y2="122" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- Response -->
  <rect x="514" y="104" width="80" height="36" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="554" y="126" text-anchor="middle" font-size="12" font-weight="600" fill="#059669">Response</text>

  <!-- Arrow to shadow model (parallel, no serve) -->
  <line x1="249" y1="140" x2="310" y2="160" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="268" y="158" font-size="9" fill="#8b5cf6">mirror</text>

  <!-- Shadow Model -->
  <rect x="314" y="148" width="140" height="36" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="384" y="170" text-anchor="middle" font-size="12" font-weight="600" fill="#7c3aed">Shadow Model</text>

  <!-- Arrow from shadow to log -->
  <line x1="454" y1="166" x2="510" y2="166" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>

  <!-- Log box -->
  <rect x="514" y="148" width="80" height="36" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="554" y="170" text-anchor="middle" font-size="12" font-weight="600" fill="#7c3aed">Log Only</text>

  <!-- Pros/Cons -->
  <rect x="620" y="104" width="200" height="80" rx="8" fill="#faf5ff"/>
  <text x="720" y="122" text-anchor="middle" font-size="11" font-weight="600" fill="#10b981">✓ Zero user impact</text>
  <text x="720" y="138" text-anchor="middle" font-size="11" font-weight="600" fill="#10b981">✓ Real traffic validation</text>
  <text x="720" y="158" text-anchor="middle" font-size="11" font-weight="600" fill="#ef4444">✕ 2x compute cost</text>
  <text x="720" y="174" text-anchor="middle" font-size="11" font-weight="600" fill="#ef4444">✕ Delayed feedback</text>

  <!-- ============================================ -->
  <!-- Strategy 2: Canary Release -->
  <!-- ============================================ -->
  <rect x="20" y="242" width="820" height="164" rx="12" fill="#fff" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>

  <rect x="20" y="242" width="820" height="32" rx="12" fill="#f59e0b"/>
  <rect x="20" y="260" width="820" height="14" fill="#f59e0b"/>
  <text x="430" y="264" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Canary Release</text>

  <!-- Input traffic -->
  <rect x="40" y="290" width="90" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="85" y="314" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">Requests</text>

  <!-- Arrow to LB -->
  <line x1="130" y1="310" x2="175" y2="310" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Load Balancer -->
  <rect x="179" y="290" width="70" height="40" rx="8" fill="#6b7280" filter="url(#shadow)"/>
  <text x="214" y="314" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">LB</text>

  <!-- Arrow to old model (95%) -->
  <line x1="249" y1="300" x2="310" y2="300" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="280" y="295" text-anchor="middle" font-size="9" fill="#10b981">95%</text>

  <!-- Old Model -->
  <rect x="314" y="284" width="120" height="36" rx="8" fill="#10b981" filter="url(#shadow)"/>
  <text x="374" y="306" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Old Model v1</text>

  <!-- Arrow to new model (5%) -->
  <line x1="249" y1="320" x2="310" y2="340" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="268" y="338" font-size="9" fill="#d97706">5%</text>

  <!-- New Model -->
  <rect x="314" y="328" width="120" height="36" rx="8" fill="#f59e0b" filter="url(#shadow)"/>
  <text x="374" y="350" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">New Model v2</text>

  <!-- Gradual increase visualization -->
  <text x="468" y="298" font-size="10" font-weight="600" fill="#475569">Gradual rollout:</text>

  <!-- Progress bars showing increase -->
  <rect x="468" y="306" width="130" height="14" rx="4" fill="#ecfdf5" stroke="#d1fae5" stroke-width="1"/>
  <rect x="468" y="306" width="123" height="14" rx="4" fill="#10b981" opacity="0.7"/>
  <rect x="468" y="306" width="7" height="14" rx="4" fill="#f59e0b"/>
  <text x="606" y="317" font-size="9" fill="#64748b">5%</text>

  <rect x="468" y="324" width="130" height="14" rx="4" fill="#ecfdf5" stroke="#d1fae5" stroke-width="1"/>
  <rect x="468" y="324" width="98" height="14" rx="4" fill="#10b981" opacity="0.7"/>
  <rect x="468" y="324" width="32" height="14" rx="4" fill="#f59e0b"/>
  <text x="606" y="335" font-size="9" fill="#64748b">25%</text>

  <rect x="468" y="342" width="130" height="14" rx="4" fill="#ecfdf5" stroke="#d1fae5" stroke-width="1"/>
  <rect x="468" y="342" width="65" height="14" rx="4" fill="#10b981" opacity="0.7"/>
  <rect x="468" y="342" width="65" height="14" rx="4" fill="#f59e0b"/>
  <text x="606" y="353" font-size="9" fill="#64748b">50%</text>

  <rect x="468" y="360" width="130" height="14" rx="4" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <rect x="468" y="360" width="130" height="14" rx="4" fill="#f59e0b"/>
  <text x="606" y="371" font-size="9" fill="#64748b">100%</text>

  <!-- Pros/Cons -->
  <rect x="640" y="290" width="180" height="80" rx="8" fill="#fffbeb"/>
  <text x="730" y="308" text-anchor="middle" font-size="11" font-weight="600" fill="#10b981">✓ Low blast radius</text>
  <text x="730" y="324" text-anchor="middle" font-size="11" font-weight="600" fill="#10b981">✓ Gradual validation</text>
  <text x="730" y="344" text-anchor="middle" font-size="11" font-weight="600" fill="#ef4444">✕ Slower rollout</text>
  <text x="730" y="360" text-anchor="middle" font-size="11" font-weight="600" fill="#ef4444">✕ Traffic splitting logic</text>

  <!-- ============================================ -->
  <!-- Strategy 3: Blue-Green -->
  <!-- ============================================ -->
  <rect x="20" y="422" width="820" height="180" rx="12" fill="#fff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>

  <rect x="20" y="422" width="820" height="32" rx="12" fill="#3b82f6"/>
  <rect x="20" y="440" width="820" height="14" fill="#3b82f6"/>
  <text x="430" y="444" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Blue-Green Deployment</text>

  <!-- Input traffic -->
  <rect x="40" y="472" width="90" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="85" y="496" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">Requests</text>

  <!-- Arrow to DNS/LB -->
  <line x1="130" y1="492" x2="175" y2="492" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- DNS Switch -->
  <rect x="179" y="472" width="70" height="40" rx="8" fill="#6b7280" filter="url(#shadow)"/>
  <text x="214" y="490" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">DNS /</text>
  <text x="214" y="504" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Switch</text>

  <!-- Arrow to Blue (active) -->
  <line x1="249" y1="482" x2="310" y2="482" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="280" y="477" text-anchor="middle" font-size="9" fill="#3b82f6" font-weight="600">ACTIVE</text>

  <!-- Blue Environment -->
  <rect x="314" y="462" width="140" height="44" rx="8" fill="#3b82f6" filter="url(#shadow)"/>
  <text x="384" y="482" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">Blue (v1)</text>
  <text x="384" y="498" text-anchor="middle" font-size="10" fill="#bfdbfe">Current production</text>

  <!-- Arrow to Green (standby) -->
  <line x1="249" y1="502" x2="310" y2="530" stroke="#10b981" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowGreen)"/>
  <text x="268" y="524" font-size="9" fill="#10b981">STANDBY</text>

  <!-- Green Environment -->
  <rect x="314" y="516" width="140" height="44" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="384" y="536" text-anchor="middle" font-size="13" font-weight="600" fill="#059669">Green (v2)</text>
  <text x="384" y="552" text-anchor="middle" font-size="10" fill="#6ee7b7">New version ready</text>

  <!-- Switch illustration -->
  <text x="494" y="478" font-size="12" font-weight="600" fill="#475569">Instant switch:</text>

  <!-- Before switch -->
  <rect x="494" y="486" width="110" height="28" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <circle cx="510" cy="500" r="6" fill="#3b82f6"/>
  <text x="560" y="504" text-anchor="middle" font-size="10" fill="#3b82f6">Blue = Active</text>

  <!-- Arrow -->
  <text x="551" y="526" text-anchor="middle" font-size="14" fill="#6b7280">↓</text>

  <!-- After switch -->
  <rect x="494" y="536" width="110" height="28" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
  <circle cx="510" cy="550" r="6" fill="#10b981"/>
  <text x="560" y="554" text-anchor="middle" font-size="10" fill="#059669">Green = Active</text>

  <!-- Rollback arrow -->
  <path d="M 604 550 Q 618 530 604 500" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="628" y="528" font-size="9" fill="#ef4444" font-weight="600">Instant</text>
  <text x="628" y="540" font-size="9" fill="#ef4444" font-weight="600">rollback</text>

  <!-- Pros/Cons -->
  <rect x="660" y="470" width="160" height="100" rx="8" fill="#eff6ff"/>
  <text x="740" y="490" text-anchor="middle" font-size="11" font-weight="600" fill="#10b981">✓ Zero downtime</text>
  <text x="740" y="506" text-anchor="middle" font-size="11" font-weight="600" fill="#10b981">✓ Instant rollback</text>
  <text x="740" y="522" text-anchor="middle" font-size="11" font-weight="600" fill="#10b981">✓ Full testing before</text>
  <text x="740" y="542" text-anchor="middle" font-size="11" font-weight="600" fill="#ef4444">✕ 2x infrastructure</text>
  <text x="740" y="558" text-anchor="middle" font-size="11" font-weight="600" fill="#ef4444">✕ Database migrations</text>
</svg>