<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="9" markerHeight="7" orient="auto-start-auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
    <marker id="arrowR" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="9" markerHeight="7" orient="auto-start-auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ef4444"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="9" markerHeight="7" orient="auto-start-auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10b981"/>
    </marker>
    <marker id="arrowA" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="9" markerHeight="7" orient="auto-start-auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="880" height="520" rx="12" fill="#f8fafc"/>

  <!-- Title -->
  <text x="440" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">Drift Detection Pipeline</text>
  <line x1="280" y1="46" x2="600" y2="46" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Production Data Stream -->
  <rect x="20" y="72" width="160" height="54" rx="10" fill="#3b82f6" filter="url(#shadow)"/>
  <text x="100" y="95" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">Production Data</text>
  <text x="100" y="113" text-anchor="middle" font-size="11" fill="#bfdbfe">Live request stream</text>

  <!-- Arrow to Feature Extraction -->
  <line x1="180" y1="99" x2="208" y2="99" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Feature Extraction -->
  <rect x="212" y="72" width="160" height="54" rx="10" fill="#8b5cf6" filter="url(#shadow)"/>
  <text x="292" y="95" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">Feature Extraction</text>
  <text x="292" y="113" text-anchor="middle" font-size="11" fill="#ddd6fe">Compute statistics</text>

  <!-- Baseline comparison box -->
  <rect x="212" y="140" width="160" height="42" rx="8" fill="#fff" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="5,3" filter="url(#shadow)"/>
  <text x="292" y="158" text-anchor="middle" font-size="11" font-weight="600" fill="#7c3aed">Training Data Baseline</text>
  <text x="292" y="173" text-anchor="middle" font-size="10" fill="#a78bfa">Reference statistics</text>
  <line x1="292" y1="126" x2="292" y2="140" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- Fork arrows to 3 monitors -->
  <line x1="372" y1="85" x2="430" y2="85" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="430" y1="85" x2="430" y2="230" stroke="#6b7280" stroke-width="1.5"/>
  <!-- Branch to monitor 1 -->
  <line x1="430" y1="85" x2="458" y2="85" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Branch to monitor 2 -->
  <line x1="430" y1="158" x2="458" y2="158" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Branch to monitor 3 -->
  <line x1="430" y1="230" x2="458" y2="230" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Monitor 1: Data Drift -->
  <rect x="462" y="58" width="200" height="60" rx="10" fill="#fff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="462" y="58" width="200" height="26" rx="10" fill="#3b82f6"/>
  <rect x="462" y="72" width="200" height="12" fill="#3b82f6"/>
  <text x="562" y="77" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Data Drift Monitor</text>
  <text x="562" y="100" text-anchor="middle" font-size="11" fill="#64748b">KS test · PSI · Jensen-Shannon</text>
  <text x="562" y="114" text-anchor="middle" font-size="10" fill="#94a3b8">Feature distribution shifts</text>

  <!-- Monitor 2: Concept Drift -->
  <rect x="462" y="132" width="200" height="60" rx="10" fill="#fff" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <rect x="462" y="132" width="200" height="26" rx="10" fill="#f59e0b"/>
  <rect x="462" y="146" width="200" height="12" fill="#f59e0b"/>
  <text x="562" y="151" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Concept Drift Monitor</text>
  <text x="562" y="174" text-anchor="middle" font-size="11" fill="#64748b">Performance degradation</text>
  <text x="562" y="188" text-anchor="middle" font-size="10" fill="#94a3b8">Accuracy / F1 decay over time</text>

  <!-- Monitor 3: Feature Degradation -->
  <rect x="462" y="204" width="200" height="60" rx="10" fill="#fff" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="462" y="204" width="200" height="26" rx="10" fill="#8b5cf6"/>
  <rect x="462" y="218" width="200" height="12" fill="#8b5cf6"/>
  <text x="562" y="223" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Feature Degradation</text>
  <text x="562" y="246" text-anchor="middle" font-size="11" fill="#64748b">Null rates · Variance shifts</text>
  <text x="562" y="260" text-anchor="middle" font-size="10" fill="#94a3b8">Data quality monitoring</text>

  <!-- Arrows from monitors to Alert System -->
  <line x1="662" y1="88" x2="700" y2="88" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="662" y1="162" x2="700" y2="162" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="662" y1="234" x2="700" y2="234" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="700" y1="88" x2="700" y2="234" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="700" y1="162" x2="728" y2="162" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Alert System -->
  <rect x="732" y="130" width="130" height="62" rx="10" fill="#ef4444" filter="url(#shadow)"/>
  <text x="797" y="156" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">Alert System</text>
  <text x="797" y="176" text-anchor="middle" font-size="11" fill="#fecaca">PagerDuty / Slack</text>

  <!-- Arrow from Alert to Decision Engine -->
  <line x1="797" y1="192" x2="797" y2="260" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decision Engine -->
  <rect x="100" y="280" width="700" height="46" rx="10" fill="#1e293b" filter="url(#shadow)"/>
  <text x="450" y="308" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Decision Engine</text>

  <!-- Three outcomes -->
  <!-- Green: No action -->
  <line x1="250" y1="326" x2="250" y2="360" stroke="#10b981" stroke-width="2" marker-end="url(#arrowG)"/>
  <rect x="150" y="364" width="200" height="82" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="175" cy="388" r="10" fill="#10b981"/>
  <text x="175" y="392" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">✓</text>
  <text x="265" y="392" text-anchor="middle" font-size="14" font-weight="600" fill="#065f46">No Action Needed</text>
  <text x="250" y="414" text-anchor="middle" font-size="11" fill="#64748b">All metrics within</text>
  <text x="250" y="430" text-anchor="middle" font-size="11" fill="#64748b">normal thresholds</text>

  <!-- Yellow: Investigate -->
  <line x1="450" y1="326" x2="450" y2="360" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowA)"/>
  <rect x="350" y="364" width="200" height="82" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="375" cy="388" r="10" fill="#f59e0b"/>
  <text x="375" y="392" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">!</text>
  <text x="465" y="392" text-anchor="middle" font-size="14" font-weight="600" fill="#92400e">Investigate</text>
  <text x="450" y="414" text-anchor="middle" font-size="11" fill="#64748b">Moderate drift detected</text>
  <text x="450" y="430" text-anchor="middle" font-size="11" fill="#64748b">Manual review required</text>

  <!-- Red: Trigger Retraining -->
  <line x1="650" y1="326" x2="650" y2="360" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowR)"/>
  <rect x="550" y="364" width="200" height="82" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="575" cy="388" r="10" fill="#ef4444"/>
  <text x="575" y="392" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">✕</text>
  <text x="665" y="392" text-anchor="middle" font-size="14" font-weight="600" fill="#991b1b">Trigger Retraining</text>
  <text x="650" y="414" text-anchor="middle" font-size="11" fill="#64748b">Significant drift or</text>
  <text x="650" y="430" text-anchor="middle" font-size="11" fill="#64748b">performance degradation</text>

  <!-- Feedback loop arrow from retrain back to top -->
  <path d="M 750 405 Q 830 405 838 300 Q 838 160 838 70 Q 838 55 820 55 L 180 55 Q 110 55 100 72" fill="none" stroke="#ef4444" stroke-width="1.8" stroke-dasharray="6,3" marker-end="url(#arrowR)"/>
  <text x="845" y="248" font-size="10" fill="#ef4444" font-weight="600" transform="rotate(-90 845 248)">Retrain loop</text>

  <!-- Bottom note -->
  <rect x="100" y="470" width="700" height="36" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="450" y="493" text-anchor="middle" font-size="12" fill="#64748b">Thresholds are configurable per feature and per model — tune based on business impact and retraining cost</text>
</svg>