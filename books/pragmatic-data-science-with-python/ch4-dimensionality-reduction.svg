<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540" width="860" height="540">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="860" height="540" rx="12" fill="#f8fafc"/>
  <rect x="0" y="0" width="860" height="56" rx="12" fill="url(#headerGrad)"/>
  <rect x="0" y="30" width="860" height="26" fill="url(#headerGrad)"/>
  <text x="430" y="37" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Dimensionality Reduction: PCA vs UMAP</text>

  <!-- LEFT PANEL: PCA -->
  <g filter="url(#shadow)">
    <rect x="20" y="75" width="400" height="310" rx="10" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
    <rect x="20" y="75" width="400" height="40" rx="10" fill="#3b82f6"/>
    <rect x="20" y="100" width="400" height="15" fill="#3b82f6"/>
    <text x="220" y="101" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">PCA (Principal Component Analysis)</text>
  </g>

  <!-- PCA flow -->
  <rect x="40" y="125" width="90" height="36" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="85" y="147" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1d4ed8">100-D Data</text>
  <text x="145" y="147" font-family="system-ui, sans-serif" font-size="16" fill="#6b7280">→</text>
  <rect x="160" y="125" width="110" height="36" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="215" y="141" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1d4ed8">Linear</text>
  <text x="215" y="155" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1d4ed8">Projection</text>
  <text x="285" y="147" font-family="system-ui, sans-serif" font-size="16" fill="#6b7280">→</text>
  <rect x="300" y="125" width="100" height="36" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="350" y="147" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1d4ed8">2-D Output</text>

  <!-- PCA scatter plot -->
  <rect x="45" y="175" width="350" height="190" rx="6" fill="#fafbff" stroke="#e2e8f0"/>
  <text x="220" y="193" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#475569">PCA Projection</text>

  <!-- Axes -->
  <line x1="70" y1="345" x2="370" y2="345" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="70" y1="205" x2="70" y2="345" stroke="#cbd5e1" stroke-width="1"/>
  <text x="220" y="360" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">PC1</text>
  <text x="55" y="275" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" transform="rotate(-90, 55, 275)">PC2</text>

  <!-- PCA: Overlapping clusters (global structure preserved but clusters merged) -->
  <!-- Cluster 1 (blue) - spread out -->
  <circle cx="140" cy="270" r="4" fill="#3b82f6" opacity="0.6"/>
  <circle cx="155" cy="255" r="4" fill="#3b82f6" opacity="0.6"/>
  <circle cx="135" cy="285" r="4" fill="#3b82f6" opacity="0.6"/>
  <circle cx="160" cy="275" r="4" fill="#3b82f6" opacity="0.6"/>
  <circle cx="148" cy="260" r="4" fill="#3b82f6" opacity="0.6"/>
  <circle cx="170" cy="280" r="4" fill="#3b82f6" opacity="0.6"/>
  <circle cx="145" cy="290" r="4" fill="#3b82f6" opacity="0.6"/>
  <circle cx="165" cy="265" r="4" fill="#3b82f6" opacity="0.6"/>

  <!-- Cluster 2 (green) - overlapping with blue -->
  <circle cx="180" cy="260" r="4" fill="#10b981" opacity="0.6"/>
  <circle cx="195" cy="275" r="4" fill="#10b981" opacity="0.6"/>
  <circle cx="175" cy="280" r="4" fill="#10b981" opacity="0.6"/>
  <circle cx="200" cy="250" r="4" fill="#10b981" opacity="0.6"/>
  <circle cx="185" cy="290" r="4" fill="#10b981" opacity="0.6"/>
  <circle cx="210" cy="265" r="4" fill="#10b981" opacity="0.6"/>
  <circle cx="190" cy="245" r="4" fill="#10b981" opacity="0.6"/>
  <circle cx="205" cy="285" r="4" fill="#10b981" opacity="0.6"/>

  <!-- Cluster 3 (amber) - overlapping -->
  <circle cx="240" cy="300" r="4" fill="#f59e0b" opacity="0.6"/>
  <circle cx="260" cy="285" r="4" fill="#f59e0b" opacity="0.6"/>
  <circle cx="250" cy="310" r="4" fill="#f59e0b" opacity="0.6"/>
  <circle cx="270" cy="295" r="4" fill="#f59e0b" opacity="0.6"/>
  <circle cx="235" cy="290" r="4" fill="#f59e0b" opacity="0.6"/>
  <circle cx="255" cy="275" r="4" fill="#f59e0b" opacity="0.6"/>
  <circle cx="280" cy="305" r="4" fill="#f59e0b" opacity="0.6"/>

  <!-- Cluster 4 (red) - also overlapping -->
  <circle cx="290" cy="240" r="4" fill="#ef4444" opacity="0.6"/>
  <circle cx="310" cy="255" r="4" fill="#ef4444" opacity="0.6"/>
  <circle cx="300" cy="230" r="4" fill="#ef4444" opacity="0.6"/>
  <circle cx="320" cy="245" r="4" fill="#ef4444" opacity="0.6"/>
  <circle cx="305" cy="260" r="4" fill="#ef4444" opacity="0.6"/>
  <circle cx="330" cy="235" r="4" fill="#ef4444" opacity="0.6"/>
  <circle cx="285" cy="250" r="4" fill="#ef4444" opacity="0.6"/>

  <!-- Overlap annotation -->
  <text x="220" y="335" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6b7280" font-style="italic">Clusters overlap — global variance preserved</text>

  <!-- RIGHT PANEL: UMAP -->
  <g filter="url(#shadow)">
    <rect x="440" y="75" width="400" height="310" rx="10" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
    <rect x="440" y="75" width="400" height="40" rx="10" fill="#10b981"/>
    <rect x="440" y="100" width="400" height="15" fill="#10b981"/>
    <text x="640" y="101" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">UMAP (Uniform Manifold Approx.)</text>
  </g>

  <!-- UMAP flow -->
  <rect x="460" y="125" width="90" height="36" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="505" y="147" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#166534">100-D Data</text>
  <text x="565" y="147" font-family="system-ui, sans-serif" font-size="16" fill="#6b7280">→</text>
  <rect x="580" y="125" width="110" height="36" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="635" y="141" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#166534">Non-linear</text>
  <text x="635" y="155" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#166534">Embedding</text>
  <text x="705" y="147" font-family="system-ui, sans-serif" font-size="16" fill="#6b7280">→</text>
  <rect x="720" y="125" width="100" height="36" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="770" y="147" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#166534">2-D Output</text>

  <!-- UMAP scatter plot -->
  <rect x="465" y="175" width="350" height="190" rx="6" fill="#fafffd" stroke="#e2e8f0"/>
  <text x="640" y="193" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#475569">UMAP Embedding</text>

  <!-- Axes -->
  <line x1="490" y1="345" x2="790" y2="345" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="490" y1="205" x2="490" y2="345" stroke="#cbd5e1" stroke-width="1"/>
  <text x="640" y="360" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">UMAP1</text>
  <text x="475" y="275" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" transform="rotate(-90, 475, 275)">UMAP2</text>

  <!-- UMAP: Well-separated tight clusters -->
  <!-- Cluster 1 (blue) - tight, top-left -->
  <circle cx="530" cy="225" r="4" fill="#3b82f6" opacity="0.8"/>
  <circle cx="540" cy="218" r="4" fill="#3b82f6" opacity="0.8"/>
  <circle cx="525" cy="232" r="4" fill="#3b82f6" opacity="0.8"/>
  <circle cx="538" cy="228" r="4" fill="#3b82f6" opacity="0.8"/>
  <circle cx="520" cy="220" r="4" fill="#3b82f6" opacity="0.8"/>
  <circle cx="545" cy="212" r="4" fill="#3b82f6" opacity="0.8"/>
  <circle cx="532" cy="236" r="4" fill="#3b82f6" opacity="0.8"/>
  <circle cx="518" cy="215" r="4" fill="#3b82f6" opacity="0.8"/>

  <!-- Cluster 2 (green) - tight, top-right -->
  <circle cx="720" cy="220" r="4" fill="#10b981" opacity="0.8"/>
  <circle cx="730" cy="228" r="4" fill="#10b981" opacity="0.8"/>
  <circle cx="715" cy="215" r="4" fill="#10b981" opacity="0.8"/>
  <circle cx="725" cy="232" r="4" fill="#10b981" opacity="0.8"/>
  <circle cx="735" cy="218" r="4" fill="#10b981" opacity="0.8"/>
  <circle cx="710" cy="225" r="4" fill="#10b981" opacity="0.8"/>
  <circle cx="740" cy="225" r="4" fill="#10b981" opacity="0.8"/>
  <circle cx="722" cy="210" r="4" fill="#10b981" opacity="0.8"/>

  <!-- Cluster 3 (amber) - tight, bottom-left -->
  <circle cx="540" cy="310" r="4" fill="#f59e0b" opacity="0.8"/>
  <circle cx="555" cy="318" r="4" fill="#f59e0b" opacity="0.8"/>
  <circle cx="530" cy="320" r="4" fill="#f59e0b" opacity="0.8"/>
  <circle cx="548" cy="325" r="4" fill="#f59e0b" opacity="0.8"/>
  <circle cx="560" cy="312" r="4" fill="#f59e0b" opacity="0.8"/>
  <circle cx="535" cy="328" r="4" fill="#f59e0b" opacity="0.8"/>
  <circle cx="550" cy="305" r="4" fill="#f59e0b" opacity="0.8"/>

  <!-- Cluster 4 (red) - tight, bottom-right -->
  <circle cx="710" cy="310" r="4" fill="#ef4444" opacity="0.8"/>
  <circle cx="725" cy="318" r="4" fill="#ef4444" opacity="0.8"/>
  <circle cx="700" cy="305" r="4" fill="#ef4444" opacity="0.8"/>
  <circle cx="718" cy="322" r="4" fill="#ef4444" opacity="0.8"/>
  <circle cx="730" cy="308" r="4" fill="#ef4444" opacity="0.8"/>
  <circle cx="705" cy="320" r="4" fill="#ef4444" opacity="0.8"/>
  <circle cx="735" cy="315" r="4" fill="#ef4444" opacity="0.8"/>

  <!-- Separation annotation -->
  <text x="640" y="335" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6b7280" font-style="italic">Clear cluster separation — local structure preserved</text>

  <!-- COMPARISON TABLE -->
  <g filter="url(#shadow)">
    <rect x="20" y="400" width="820" height="125" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="430" y="425" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#334155">Comparison</text>
  </g>

  <!-- Table headers -->
  <rect x="40" y="435" width="180" height="26" rx="4" fill="#f1f5f9"/>
  <rect x="225" y="435" width="290" height="26" rx="4" fill="#eff6ff"/>
  <rect x="520" y="435" width="300" height="26" rx="4" fill="#f0fdf4"/>
  <text x="130" y="453" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#334155">Property</text>
  <text x="370" y="453" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">PCA</text>
  <text x="670" y="453" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534">UMAP</text>

  <!-- Row 1 -->
  <text x="130" y="479" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Transformation</text>
  <text x="370" y="479" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#3b82f6">Linear (eigenvectors)</text>
  <text x="670" y="479" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#10b981">Non-linear (manifold)</text>

  <!-- Row 2 -->
  <rect x="40" y="487" width="780" height="18" rx="2" fill="#f8fafc"/>
  <text x="130" y="501" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Speed</text>
  <text x="370" y="501" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#3b82f6">Fast (O(n·d²))</text>
  <text x="670" y="501" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#10b981">Moderate (O(n^1.14))</text>

  <!-- Row 3 -->
  <text x="130" y="519" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Preserves</text>
  <text x="370" y="519" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#3b82f6">Global structure / variance</text>
  <text x="670" y="519" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#10b981">Local structure / clusters</text>
</svg>