<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto" fill="#3b82f6">
      <polygon points="0 0, 8 3, 0 6"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto" fill="#8b5cf6">
      <polygon points="0 0, 8 3, 0 6"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto" fill="#10b981">
      <polygon points="0 0, 8 3, 0 6"/>
    </marker>
  </defs>

  <rect width="800" height="500" rx="12" fill="url(#bgGrad)" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Title -->
  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">DVC Pipeline: Code + Data Versioning</text>
  <line x1="220" y1="46" x2="580" y2="46" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>

  <!-- Main pipeline flow -->
  <!-- Step 1: Raw Data -->
  <rect x="30" y="80" width="120" height="50" rx="10" fill="#ffffff" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
  <text x="90" y="101" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">Raw Data</text>
  <text x="90" y="118" text-anchor="middle" font-size="10" fill="#6b7280">CSV / Parquet</text>

  <line x1="150" y1="105" x2="185" y2="105" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Step 2: Preprocessing -->
  <rect x="188" y="80" width="120" height="50" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="248" y="101" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">Preprocessing</text>
  <text x="248" y="118" text-anchor="middle" font-size="10" fill="#6b7280">Clean + Transform</text>

  <line x1="308" y1="105" x2="343" y2="105" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Step 3: Training -->
  <rect x="346" y="80" width="120" height="50" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <text x="406" y="101" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">Training</text>
  <text x="406" y="118" text-anchor="middle" font-size="10" fill="#6b7280">Fit Model</text>

  <line x1="466" y1="105" x2="501" y2="105" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Step 4: Evaluation -->
  <rect x="504" y="80" width="120" height="50" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="564" y="101" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">Evaluation</text>
  <text x="564" y="118" text-anchor="middle" font-size="10" fill="#6b7280">Metrics</text>

  <line x1="624" y1="105" x2="659" y2="105" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Step 5: Model Registry -->
  <rect x="662" y="80" width="120" height="50" rx="10" fill="#ffffff" stroke="#ef4444" stroke-width="2" filter="url(#shadow)"/>
  <text x="722" y="101" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">Model</text>
  <text x="722" y="118" text-anchor="middle" font-size="10" fill="#6b7280">Registry</text>

  <!-- === Git Track (code) === -->
  <rect x="30" y="170" width="740" height="140" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="30" y="170" width="740" height="30" rx="10" fill="#3b82f6"/>
  <rect x="30" y="190" width="740" height="10" fill="#3b82f6"/>
  <text x="52" y="190" font-size="13" font-weight="700" fill="#ffffff">Git (Code Track)</text>
  <text x="690" y="190" font-size="11" fill="#dbeafe">git commit / push</text>

  <!-- Git items -->
  <rect x="50" y="215" width="130" height="35" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="115" y="237" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">preprocess.py</text>

  <rect x="200" y="215" width="130" height="35" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="265" y="237" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">train.py</text>

  <rect x="350" y="215" width="130" height="35" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="415" y="237" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">evaluate.py</text>

  <rect x="500" y="215" width="130" height="35" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="565" y="237" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">dvc.yaml</text>

  <rect x="50" y="260" width="130" height="35" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="115" y="282" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">dvc.lock</text>

  <rect x="200" y="260" width="130" height="35" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="265" y="282" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">params.yaml</text>

  <rect x="350" y="260" width="130" height="35" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="415" y="282" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">.dvc files</text>

  <rect x="500" y="260" width="130" height="35" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="565" y="282" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">metrics.json</text>

  <!-- === DVC Track (data) === -->
  <rect x="30" y="330" width="740" height="140" rx="10" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="30" y="330" width="740" height="30" rx="10" fill="#8b5cf6"/>
  <rect x="30" y="350" width="740" height="10" fill="#8b5cf6"/>
  <text x="52" y="350" font-size="13" font-weight="700" fill="#ffffff">DVC (Data Track)</text>
  <text x="680" y="350" font-size="11" fill="#e9d5ff">dvc push / pull</text>

  <!-- DVC items -->
  <rect x="50" y="375" width="150" height="35" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1"/>
  <text x="125" y="390" text-anchor="middle" font-size="11" font-weight="600" fill="#6d28d9">raw_data/</text>
  <text x="125" y="403" text-anchor="middle" font-size="9" fill="#7c3aed">100 GB dataset</text>

  <rect x="220" y="375" width="150" height="35" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1"/>
  <text x="295" y="390" text-anchor="middle" font-size="11" font-weight="600" fill="#6d28d9">processed_data/</text>
  <text x="295" y="403" text-anchor="middle" font-size="9" fill="#7c3aed">Features + labels</text>

  <rect x="390" y="375" width="150" height="35" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1"/>
  <text x="465" y="390" text-anchor="middle" font-size="11" font-weight="600" fill="#6d28d9">model.pkl</text>
  <text x="465" y="403" text-anchor="middle" font-size="9" fill="#7c3aed">Trained weights</text>

  <rect x="560" y="375" width="150" height="35" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1"/>
  <text x="635" y="390" text-anchor="middle" font-size="11" font-weight="600" fill="#6d28d9">Remote Storage</text>
  <text x="635" y="403" text-anchor="middle" font-size="9" fill="#7c3aed">S3 / GCS / Azure</text>

  <!-- Connection arrows from pipeline to tracks -->
  <line x1="90" y1="130" x2="90" y2="168" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowPurple)"/>
  <line x1="248" y1="130" x2="248" y2="168" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowBlue)"/>
  <line x1="406" y1="130" x2="406" y2="168" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowBlue)"/>
  <line x1="564" y1="130" x2="564" y2="168" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowBlue)"/>

  <!-- Key insight -->
  <rect x="50" y="425" width="700" height="28" rx="6" fill="#fefce8" stroke="#fde68a" stroke-width="1"/>
  <text x="400" y="444" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">💡 Git stores lightweight pointers (.dvc files) — DVC stores actual data in remote storage</text>

  <!-- Sync arrows -->
  <line x1="400" y1="310" x2="400" y2="328" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="430" y="322" font-size="9" font-weight="600" fill="#10b981">sync</text>
</svg>