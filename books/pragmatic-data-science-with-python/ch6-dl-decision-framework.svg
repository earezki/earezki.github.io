<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <marker id="arrowGreen" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10b981"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ef4444"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" rx="12" fill="#f8fafc"/>
  <rect x="0" y="0" width="800" height="56" rx="12" fill="url(#headerGrad)"/>
  <rect x="0" y="30" width="800" height="26" fill="url(#headerGrad)"/>
  <text x="400" y="37" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff">When to Use Deep Learning</text>

  <!-- Root decision node -->
  <g filter="url(#shadow)">
    <rect x="260" y="75" width="280" height="50" rx="12" fill="#3b82f6"/>
    <text x="400" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Is your data tabular?</text>
  </g>

  <!-- YES branch (left) -->
  <line x1="330" y1="125" x2="200" y2="170" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <rect x="275" y="140" width="42" height="20" rx="4" fill="#dcfce7"/>
  <text x="296" y="155" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534">YES</text>

  <!-- NO branch (right) -->
  <line x1="470" y1="125" x2="600" y2="170" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <rect x="485" y="140" width="36" height="20" rx="4" fill="#fef2f2"/>
  <text x="503" y="155" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#dc2626">NO</text>

  <!-- LEFT: Tabular → XGBoost -->
  <g filter="url(#shadow)">
    <rect x="60" y="178" width="280" height="60" rx="12" fill="#10b981"/>
    <text x="200" y="203" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Use XGBoost / LightGBM</text>
    <text x="200" y="222" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#bbf7d0">Best for structured/tabular data</text>
  </g>

  <!-- RIGHT: Not tabular → next question -->
  <g filter="url(#shadow)">
    <rect x="440" y="178" width="310" height="50" rx="12" fill="#8b5cf6"/>
    <text x="595" y="200" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Is it images / text / audio?</text>
    <text x="595" y="217" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#ddd6fe">(unstructured data)</text>
  </g>

  <!-- YES from right node -->
  <line x1="595" y1="228" x2="595" y2="272" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <rect x="604" y="243" width="42" height="20" rx="4" fill="#dcfce7"/>
  <text x="625" y="258" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534">YES</text>

  <!-- Deep Learning mandatory -->
  <g filter="url(#shadow)">
    <rect x="440" y="280" width="310" height="55" rx="12" fill="#ef4444"/>
    <text x="595" y="303" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Deep Learning is Mandatory</text>
    <text x="595" y="322" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#fecaca">CNNs, Transformers, RNNs</text>
  </g>

  <!-- Special branch from the "tabular YES" side -->
  <line x1="200" y1="238" x2="200" y2="280" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <!-- Special condition -->
  <g filter="url(#shadow)">
    <rect x="40" y="288" width="320" height="70" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <text x="200" y="310" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#92400e">But wait — special case:</text>
    <text x="200" y="330" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Tabular with &gt;1M rows AND</text>
    <text x="200" y="347" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">high-cardinality categoricals?</text>
  </g>

  <!-- YES from special -->
  <line x1="200" y1="358" x2="200" y2="400" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <rect x="213" y="370" width="42" height="20" rx="4" fill="#fef3c7"/>
  <text x="234" y="385" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#92400e">YES</text>

  <!-- Entity embeddings -->
  <g filter="url(#shadow)">
    <rect x="55" y="408" width="290" height="50" rx="12" fill="#f59e0b"/>
    <text x="200" y="430" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Consider Entity Embeddings</text>
    <text x="200" y="447" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#fef3c7">TabNet, FT-Transformer</text>
  </g>

  <!-- Summary boxes at bottom -->
  <g filter="url(#shadow)">
    <rect x="20" y="475" width="230" height="35" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <circle cx="37" cy="492" r="6" fill="#10b981"/>
    <text x="145" y="497" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#166534">Green = Recommended path</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="265" y="475" width="230" height="35" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
    <circle cx="282" cy="492" r="6" fill="#ef4444"/>
    <text x="390" y="497" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#dc2626">Red = DL required (no choice)</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="510" y="475" width="270" height="35" rx="8" fill="#fefce8" stroke="#fde68a"/>
    <circle cx="527" cy="492" r="6" fill="#f59e0b"/>
    <text x="655" y="497" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#92400e">Amber = Conditional, test first</text>
  </g>

  <!-- Right side annotation boxes -->
  <g filter="url(#shadow)">
    <rect x="440" y="355" width="340" height="97" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="610" y="378" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#334155">💡 Decision Summary</text>
    <text x="455" y="398" font-family="system-ui, sans-serif" font-size="12" fill="#475569">• Tabular → XGBoost (almost always wins)</text>
    <text x="455" y="416" font-family="system-ui, sans-serif" font-size="12" fill="#475569">• Images/Text/Audio → Deep Learning</text>
    <text x="455" y="434" font-family="system-ui, sans-serif" font-size="12" fill="#475569">• Huge tabular + categories → Maybe DL</text>
    <text x="455" y="448" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" font-style="italic">Benchmark XGBoost first; beat it to justify DL</text>
  </g>
</svg>