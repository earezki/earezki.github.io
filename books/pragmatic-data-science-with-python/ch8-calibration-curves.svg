<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="800" height="520" fill="#f8fafc" rx="8"/>

  <!-- Title -->
  <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">Calibration Curves: Reliability Diagrams</text>

  <!-- Plot area -->
  <g transform="translate(120, 60)">
    <!-- Axes background -->
    <rect width="460" height="380" fill="white" stroke="#e5e7eb" stroke-width="1" rx="4" filter="url(#shadow)"/>

    <!-- Grid lines -->
    <line x1="0" y1="76" x2="460" y2="76" stroke="#f3f4f6" stroke-width="1"/>
    <line x1="0" y1="152" x2="460" y2="152" stroke="#f3f4f6" stroke-width="1"/>
    <line x1="0" y1="228" x2="460" y2="228" stroke="#f3f4f6" stroke-width="1"/>
    <line x1="0" y1="304" x2="460" y2="304" stroke="#f3f4f6" stroke-width="1"/>
    <line x1="92" y1="0" x2="92" y2="380" stroke="#f3f4f6" stroke-width="1"/>
    <line x1="184" y1="0" x2="184" y2="380" stroke="#f3f4f6" stroke-width="1"/>
    <line x1="276" y1="0" x2="276" y2="380" stroke="#f3f4f6" stroke-width="1"/>
    <line x1="368" y1="0" x2="368" y2="380" stroke="#f3f4f6" stroke-width="1"/>

    <!-- Perfect calibration (diagonal) -->
    <line x1="0" y1="380" x2="460" y2="0" stroke="#6b7280" stroke-width="2" stroke-dasharray="8,4"/>
    <text x="330" y="80" font-size="12" fill="#6b7280" transform="rotate(-39, 330, 80)">Perfect Calibration</text>

    <!-- Logistic Regression (close to diagonal, slight S) -->
    <path d="M 0,380 C 46,350 92,310 138,260 S 230,180 276,140 S 368,52 460,5"
          fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Logistic Regression dots -->
    <circle cx="46" cy="348" r="4" fill="#3b82f6"/>
    <circle cx="92" cy="310" r="4" fill="#3b82f6"/>
    <circle cx="138" cy="265" r="4" fill="#3b82f6"/>
    <circle cx="184" cy="218" r="4" fill="#3b82f6"/>
    <circle cx="230" cy="175" r="4" fill="#3b82f6"/>
    <circle cx="276" cy="138" r="4" fill="#3b82f6"/>
    <circle cx="322" cy="95" r="4" fill="#3b82f6"/>
    <circle cx="368" cy="55" r="4" fill="#3b82f6"/>
    <circle cx="414" cy="25" r="4" fill="#3b82f6"/>

    <!-- Random Forest / XGBoost (S-shaped: over-confident at extremes) -->
    <path d="M 0,380 C 30,370 60,358 92,330 S 150,220 184,195 S 250,175 276,170 S 330,152 368,85 S 420,15 460,2"
          fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
    <!-- XGBoost dots -->
    <circle cx="46" cy="372" r="4" fill="#f59e0b"/>
    <circle cx="92" cy="330" r="4" fill="#f59e0b"/>
    <circle cx="138" cy="240" r="4" fill="#f59e0b"/>
    <circle cx="184" cy="195" r="4" fill="#f59e0b"/>
    <circle cx="230" cy="180" r="4" fill="#f59e0b"/>
    <circle cx="276" cy="170" r="4" fill="#f59e0b"/>
    <circle cx="322" cy="130" r="4" fill="#f59e0b"/>
    <circle cx="368" cy="85" r="4" fill="#f59e0b"/>
    <circle cx="414" cy="12" r="4" fill="#f59e0b"/>

    <!-- Axis labels -->
    <!-- Y axis -->
    <text x="-46" y="384" font-size="12" fill="#6b7280">0.0</text>
    <text x="-46" y="308" font-size="12" fill="#6b7280">0.2</text>
    <text x="-46" y="232" font-size="12" fill="#6b7280">0.4</text>
    <text x="-46" y="156" font-size="12" fill="#6b7280">0.6</text>
    <text x="-46" y="80" font-size="12" fill="#6b7280">0.8</text>
    <text x="-46" y="8" font-size="12" fill="#6b7280">1.0</text>

    <!-- X axis -->
    <text x="0" y="402" text-anchor="middle" font-size="12" fill="#6b7280">0.0</text>
    <text x="92" y="402" text-anchor="middle" font-size="12" fill="#6b7280">0.2</text>
    <text x="184" y="402" text-anchor="middle" font-size="12" fill="#6b7280">0.4</text>
    <text x="276" y="402" text-anchor="middle" font-size="12" fill="#6b7280">0.6</text>
    <text x="368" y="402" text-anchor="middle" font-size="12" fill="#6b7280">0.8</text>
    <text x="460" y="402" text-anchor="middle" font-size="12" fill="#6b7280">1.0</text>

    <!-- X-axis label -->
    <text x="230" y="430" text-anchor="middle" font-size="14" font-weight="600" fill="#374151">Predicted Probability</text>
    <!-- Y-axis label -->
    <text x="-80" y="190" text-anchor="middle" font-size="14" font-weight="600" fill="#374151" transform="rotate(-90, -80, 190)">Observed Frequency</text>

    <!-- Annotation areas -->
    <!-- Above diagonal = under-confident -->
    <g transform="translate(30, 130)">
      <rect x="-6" y="-14" width="116" height="38" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1" opacity="0.7"/>
      <text font-size="11" font-weight="600" fill="#1d4ed8">↑ Above diagonal</text>
      <text y="16" font-size="11" fill="#1d4ed8">= Under-confident</text>
    </g>

    <!-- Below diagonal = over-confident -->
    <g transform="translate(280, 280)">
      <rect x="-6" y="-14" width="116" height="38" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" opacity="0.7"/>
      <text font-size="11" font-weight="600" fill="#92400e">↓ Below diagonal</text>
      <text y="16" font-size="11" fill="#92400e">= Over-confident</text>
    </g>
  </g>

  <!-- Legend -->
  <g transform="translate(620, 140)">
    <rect x="-10" y="-20" width="170" height="124" rx="8" fill="white" stroke="#e5e7eb" stroke-width="1" filter="url(#shadow)"/>
    <text font-size="13" font-weight="700" fill="#374151">Legend</text>

    <line x1="0" y1="16" x2="30" y2="16" stroke="#6b7280" stroke-width="2" stroke-dasharray="6,3"/>
    <text x="38" y="20" font-size="12" fill="#6b7280">Perfect</text>

    <line x1="0" y1="40" x2="30" y2="40" stroke="#3b82f6" stroke-width="2.5"/>
    <circle cx="15" cy="40" r="3.5" fill="#3b82f6"/>
    <text x="38" y="44" font-size="12" fill="#3b82f6">Logistic Reg.</text>
    <text x="38" y="58" font-size="10" fill="#3b82f6">(well calibrated)</text>

    <line x1="0" y1="74" x2="30" y2="74" stroke="#f59e0b" stroke-width="2.5"/>
    <circle cx="15" cy="74" r="3.5" fill="#f59e0b"/>
    <text x="38" y="78" font-size="12" fill="#f59e0b">RF / XGBoost</text>
    <text x="38" y="92" font-size="10" fill="#f59e0b">(needs calibration)</text>
  </g>
</svg>