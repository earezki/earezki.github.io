<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <marker id="arrowAmber" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto" fill="#f59e0b">
      <polygon points="0 0, 8 3, 0 6"/>
    </marker>
    <marker id="arrowGray" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto" fill="#6b7280">
      <polygon points="0 0, 8 3, 0 6"/>
    </marker>
  </defs>

  <rect width="800" height="500" rx="12" fill="url(#bgGrad)" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Title -->
  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">DuckDB In-Process Architecture</text>
  <line x1="230" y1="46" x2="570" y2="46" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>

  <!-- Outer: Application Process -->
  <rect x="40" y="60" width="720" height="380" rx="14" fill="#ffffff" stroke="#6b7280" stroke-width="2" stroke-dasharray="8,4" filter="url(#shadow)"/>
  <text x="60" y="82" font-size="13" font-weight="700" fill="#6b7280">Application Process (Python / Node.js / R)</text>

  <!-- Highlight badge -->
  <rect x="510" y="66" width="230" height="22" rx="6" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
  <text x="625" y="81" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">⚡ No separate server process</text>

  <!-- Inner: DuckDB Engine -->
  <rect x="70" y="100" width="460" height="320" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <rect x="70" y="100" width="460" height="32" rx="12" fill="#f59e0b"/>
  <rect x="70" y="120" width="460" height="12" fill="#f59e0b"/>
  <text x="300" y="121" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">DuckDB Engine (Embedded)</text>

  <!-- SQL Parser -->
  <rect x="100" y="148" width="170" height="50" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="185" y="170" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">SQL Parser</text>
  <text x="185" y="186" text-anchor="middle" font-size="10" fill="#d97706">Parse + validate SQL</text>

  <line x1="270" y1="173" x2="315" y2="173" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <!-- Optimizer -->
  <rect x="320" y="148" width="170" height="50" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="405" y="170" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Query Optimizer</text>
  <text x="405" y="186" text-anchor="middle" font-size="10" fill="#d97706">Cost-based planning</text>

  <line x1="300" y1="198" x2="300" y2="230" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <!-- Execution Engine -->
  <rect x="100" y="232" width="400" height="55" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="300" y="255" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">Vectorized Execution Engine</text>
  <text x="300" y="273" text-anchor="middle" font-size="10" fill="#d97706">Columnar processing — batches of 2048 values — SIMD optimized</text>

  <line x1="300" y1="287" x2="300" y2="315" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <!-- Buffer Manager -->
  <rect x="100" y="318" width="400" height="45" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="300" y="340" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">Buffer Manager</text>
  <text x="300" y="354" text-anchor="middle" font-size="10" fill="#d97706">Memory management — spill to disk — cache-friendly layout</text>

  <!-- Thread pool -->
  <rect x="100" y="374" width="400" height="30" rx="6" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
  <text x="300" y="394" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">Thread Pool — Parallel pipeline execution across cores</text>

  <!-- === External Connections (right side) === -->
  <!-- Parquet -->
  <rect x="570" y="120" width="170" height="42" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="576" y="126" width="24" height="30" rx="3" fill="#dbeafe"/>
  <text x="589" y="145" text-anchor="middle" font-size="9" font-weight="700" fill="#1d4ed8">P</text>
  <text x="665" y="140" text-anchor="middle" font-size="12" font-weight="600" fill="#1d4ed8">Parquet Files</text>
  <text x="665" y="155" text-anchor="middle" font-size="9" fill="#6b7280">Columnar, compressed</text>
  <line x1="570" y1="141" x2="532" y2="165" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowAmber)"/>

  <!-- CSV -->
  <rect x="570" y="175" width="170" height="42" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="576" y="181" width="24" height="30" rx="3" fill="#d1fae5"/>
  <text x="589" y="200" text-anchor="middle" font-size="9" font-weight="700" fill="#065f46">C</text>
  <text x="665" y="195" text-anchor="middle" font-size="12" font-weight="600" fill="#065f46">CSV Files</text>
  <text x="665" y="210" text-anchor="middle" font-size="9" fill="#6b7280">Auto-detect schema</text>
  <line x1="570" y1="196" x2="532" y2="200" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowAmber)"/>

  <!-- Arrow -->
  <rect x="570" y="230" width="170" height="42" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="576" y="236" width="24" height="30" rx="3" fill="#f5f3ff"/>
  <text x="589" y="255" text-anchor="middle" font-size="9" font-weight="700" fill="#6d28d9">A</text>
  <text x="665" y="250" text-anchor="middle" font-size="12" font-weight="600" fill="#6d28d9">Arrow Tables</text>
  <text x="665" y="265" text-anchor="middle" font-size="9" fill="#6b7280">Zero-copy exchange</text>
  <line x1="570" y1="251" x2="532" y2="260" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowAmber)"/>

  <!-- Pandas -->
  <rect x="570" y="285" width="170" height="42" rx="8" fill="#ffffff" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="576" y="291" width="24" height="30" rx="3" fill="#fef2f2"/>
  <text x="589" y="310" text-anchor="middle" font-size="9" font-weight="700" fill="#991b1b">🐼</text>
  <text x="665" y="305" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">Pandas DataFrames</text>
  <text x="665" y="320" text-anchor="middle" font-size="9" fill="#6b7280">Seamless interop</text>
  <line x1="570" y1="306" x2="532" y2="310" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowAmber)"/>

  <!-- Zero-copy highlight -->
  <rect x="570" y="345" width="170" height="50" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="655" y="365" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">Zero-Copy with Arrow</text>
  <text x="655" y="382" text-anchor="middle" font-size="9" fill="#6b7280">No data serialization</text>
  <text x="655" y="394" text-anchor="middle" font-size="9" fill="#6b7280">overhead between formats</text>

  <!-- Bottom highlight -->
  <rect x="110" y="455" width="580" height="30" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
  <text x="400" y="475" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">💡 import duckdb; duckdb.sql("SELECT * FROM 'data.parquet'") — that's it, no setup needed</text>
</svg>