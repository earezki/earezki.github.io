<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>

  <rect width="800" height="520" rx="12" fill="url(#bgGrad)" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Title -->
  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">Missing Data Mechanisms</text>
  <line x1="255" y1="46" x2="545" y2="46" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>

  <!-- Column headers -->
  <text x="110" y="72" text-anchor="middle" font-size="12" font-weight="700" fill="#6b7280">MECHANISM</text>
  <text x="360" y="72" text-anchor="middle" font-size="12" font-weight="700" fill="#6b7280">DATA PATTERN</text>
  <text x="660" y="72" text-anchor="middle" font-size="12" font-weight="700" fill="#6b7280">IMPUTATION</text>

  <line x1="30" y1="80" x2="770" y2="80" stroke="#e2e8f0" stroke-width="1"/>

  <!-- === Row 1: MCAR === -->
  <rect x="25" y="90" width="750" height="130" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Label -->
  <rect x="40" y="100" width="140" height="30" rx="8" fill="#3b82f6"/>
  <text x="110" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">MCAR</text>
  <text x="110" y="148" text-anchor="middle" font-size="10" fill="#1e293b" font-weight="600">Missing Completely</text>
  <text x="110" y="162" text-anchor="middle" font-size="10" fill="#1e293b" font-weight="600">At Random</text>
  <text x="110" y="185" text-anchor="middle" font-size="9" fill="#6b7280">Missingness unrelated</text>
  <text x="110" y="198" text-anchor="middle" font-size="9" fill="#6b7280">to any variable</text>

  <!-- Data grid - random holes -->
  <g transform="translate(240, 100)">
    <!-- Grid cells: filled = #dbeafe, missing = #fecaca with ? -->
    <rect x="0" y="0" width="30" height="20" rx="3" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1"/><text x="15" y="14" text-anchor="middle" font-size="9" fill="#1d4ed8">42</text>
    <rect x="35" y="0" width="30" height="20" rx="3" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1"/><text x="50" y="14" text-anchor="middle" font-size="9" fill="#1d4ed8">M</text>
    <rect x="70" y="0" width="30" height="20" rx="3" fill="#fecaca" stroke="#ef4444" stroke-width="1"/><text x="85" y="14" text-anchor="middle" font-size="9" fill="#ef4444">?</text>
    <rect x="105" y="0" width="30" height="20" rx="3" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1"/><text x="120" y="14" text-anchor="middle" font-size="9" fill="#1d4ed8">NY</text>
    <rect x="140" y="0" width="30" height="20" rx="3" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1"/><text x="155" y="14" text-anchor="middle" font-size="9" fill="#1d4ed8">65k</text>

    <rect x="0" y="25" width="30" height="20" rx="3" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1"/><text x="15" y="39" text-anchor="middle" font-size="9" fill="#1d4ed8">28</text>
    <rect x="35" y="25" width="30" height="20" rx="3" fill="#fecaca" stroke="#ef4444" stroke-width="1"/><text x="50" y="39" text-anchor="middle" font-size="9" fill="#ef4444">?</text>
    <rect x="70" y="25" width="30" height="20" rx="3" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1"/><text x="85" y="39" text-anchor="middle" font-size="9" fill="#1d4ed8">B+</text>
    <rect x="105" y="25" width="30" height="20" rx="3" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1"/><text x="120" y="39" text-anchor="middle" font-size="9" fill="#1d4ed8">LA</text>
    <rect x="140" y="25" width="30" height="20" rx="3" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1"/><text x="155" y="39" text-anchor="middle" font-size="9" fill="#1d4ed8">72k</text>

    <rect x="0" y="50" width="30" height="20" rx="3" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1"/><text x="15" y="64" text-anchor="middle" font-size="9" fill="#1d4ed8">55</text>
    <rect x="35" y="50" width="30" height="20" rx="3" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1"/><text x="50" y="64" text-anchor="middle" font-size="9" fill="#1d4ed8">F</text>
    <rect x="70" y="50" width="30" height="20" rx="3" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1"/><text x="85" y="64" text-anchor="middle" font-size="9" fill="#1d4ed8">A</text>
    <rect x="105" y="50" width="30" height="20" rx="3" fill="#fecaca" stroke="#ef4444" stroke-width="1"/><text x="120" y="64" text-anchor="middle" font-size="9" fill="#ef4444">?</text>
    <rect x="140" y="50" width="30" height="20" rx="3" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1"/><text x="155" y="64" text-anchor="middle" font-size="9" fill="#1d4ed8">55k</text>

    <rect x="0" y="75" width="30" height="20" rx="3" fill="#fecaca" stroke="#ef4444" stroke-width="1"/><text x="15" y="89" text-anchor="middle" font-size="9" fill="#ef4444">?</text>
    <rect x="35" y="75" width="30" height="20" rx="3" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1"/><text x="50" y="89" text-anchor="middle" font-size="9" fill="#1d4ed8">M</text>
    <rect x="70" y="75" width="30" height="20" rx="3" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1"/><text x="85" y="89" text-anchor="middle" font-size="9" fill="#1d4ed8">A-</text>
    <rect x="105" y="75" width="30" height="20" rx="3" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1"/><text x="120" y="89" text-anchor="middle" font-size="9" fill="#1d4ed8">SF</text>
    <rect x="140" y="75" width="30" height="20" rx="3" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1"/><text x="155" y="89" text-anchor="middle" font-size="9" fill="#1d4ed8">81k</text>

    <text x="85" y="110" text-anchor="middle" font-size="9" fill="#6b7280">Random holes everywhere</text>
  </g>

  <!-- Imputation strategy -->
  <rect x="560" y="105" width="200" height="90" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="660" y="125" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">Safe to use:</text>
  <text x="660" y="145" text-anchor="middle" font-size="10" fill="#1e293b">• Mean/median imputation</text>
  <text x="660" y="162" text-anchor="middle" font-size="10" fill="#1e293b">• Listwise deletion</text>
  <text x="660" y="179" text-anchor="middle" font-size="10" fill="#1e293b">• Simple random imputation</text>

  <!-- === Row 2: MAR === -->
  <rect x="25" y="230" width="750" height="130" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Label -->
  <rect x="40" y="240" width="140" height="30" rx="8" fill="#f59e0b"/>
  <text x="110" y="260" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">MAR</text>
  <text x="110" y="288" text-anchor="middle" font-size="10" fill="#1e293b" font-weight="600">Missing At Random</text>
  <text x="110" y="310" text-anchor="middle" font-size="9" fill="#6b7280">Missingness related to</text>
  <text x="110" y="323" text-anchor="middle" font-size="9" fill="#6b7280">observed variables</text>
  <text x="110" y="343" text-anchor="middle" font-size="9" fill="#6b7280">e.g. men less likely</text>
  <text x="110" y="353" text-anchor="middle" font-size="9" fill="#6b7280">to report weight</text>

  <!-- Data grid - structured pattern (income missing for younger) -->
  <g transform="translate(240, 240)">
    <rect x="0" y="0" width="30" height="20" rx="3" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1"/><text x="15" y="14" text-anchor="middle" font-size="9" fill="#1d4ed8">22</text>
    <rect x="35" y="0" width="30" height="20" rx="3" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1"/><text x="50" y="14" text-anchor="middle" font-size="9" fill="#1d4ed8">M</text>
    <rect x="70" y="0" width="30" height="20" rx="3" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1"/><text x="85" y="14" text-anchor="middle" font-size="9" fill="#1d4ed8">B</text>
    <rect x="105" y="0" width="30" height="20" rx="3" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1"/><text x="120" y="14" text-anchor="middle" font-size="9" fill="#1d4ed8">NY</text>
    <rect x="140" y="0" width="30" height="20" rx="3" fill="#fecaca" stroke="#ef4444" stroke-width="1"/><text x="155" y="14" text-anchor="middle" font-size="9" fill="#ef4444">?</text>

    <rect x="0" y="25" width="30" height="20" rx="3" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1"/><text x="15" y="39" text-anchor="middle" font-size="9" fill="#1d4ed8">19</text>
    <rect x="35" y="25" width="30" height="20" rx="3" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1"/><text x="50" y="39" text-anchor="middle" font-size="9" fill="#1d4ed8">F</text>
    <rect x="70" y="25" width="30" height="20" rx="3" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1"/><text x="85" y="39" text-anchor="middle" font-size="9" fill="#1d4ed8">B+</text>
    <rect x="105" y="25" width="30" height="20" rx="3" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1"/><text x="120" y="39" text-anchor="middle" font-size="9" fill="#1d4ed8">LA</text>
    <rect x="140" y="25" width="30" height="20" rx="3" fill="#fecaca" stroke="#ef4444" stroke-width="1"/><text x="155" y="39" text-anchor="middle" font-size="9" fill="#ef4444">?</text>

    <rect x="0" y="50" width="30" height="20" rx="3" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1"/><text x="15" y="64" text-anchor="middle" font-size="9" fill="#1d4ed8">45</text>
    <rect x="35" y="50" width="30" height="20" rx="3" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1"/><text x="50" y="64" text-anchor="middle" font-size="9" fill="#1d4ed8">M</text>
    <rect x="70" y="50" width="30" height="20" rx="3" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1"/><text x="85" y="64" text-anchor="middle" font-size="9" fill="#1d4ed8">A</text>
    <rect x="105" y="50" width="30" height="20" rx="3" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1"/><text x="120" y="64" text-anchor="middle" font-size="9" fill="#1d4ed8">SF</text>
    <rect x="140" y="50" width="30" height="20" rx="3" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1"/><text x="155" y="64" text-anchor="middle" font-size="9" fill="#1d4ed8">88k</text>

    <rect x="0" y="75" width="30" height="20" rx="3" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1"/><text x="15" y="89" text-anchor="middle" font-size="9" fill="#1d4ed8">51</text>
    <rect x="35" y="75" width="30" height="20" rx="3" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1"/><text x="50" y="89" text-anchor="middle" font-size="9" fill="#1d4ed8">F</text>
    <rect x="70" y="75" width="30" height="20" rx="3" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1"/><text x="85" y="89" text-anchor="middle" font-size="9" fill="#1d4ed8">A-</text>
    <rect x="105" y="75" width="30" height="20" rx="3" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1"/><text x="120" y="89" text-anchor="middle" font-size="9" fill="#1d4ed8">CH</text>
    <rect x="140" y="75" width="30" height="20" rx="3" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1"/><text x="155" y="89" text-anchor="middle" font-size="9" fill="#1d4ed8">92k</text>

    <!-- Annotation -->
    <line x1="170" y1="5" x2="195" y2="5" stroke="#ef4444" stroke-width="1.5"/>
    <line x1="170" y1="30" x2="195" y2="30" stroke="#ef4444" stroke-width="1.5"/>
    <text x="207" y="22" font-size="8" fill="#ef4444" font-weight="600">Young →</text>
    <text x="207" y="32" font-size="8" fill="#ef4444" font-weight="600">missing</text>
    <text x="85" y="110" text-anchor="middle" font-size="9" fill="#6b7280">Income missing for age &lt; 25</text>
  </g>

  <!-- Imputation strategy -->
  <rect x="560" y="245" width="200" height="90" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="660" y="265" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">Use conditional:</text>
  <text x="660" y="285" text-anchor="middle" font-size="10" fill="#1e293b">• Multiple imputation (MICE)</text>
  <text x="660" y="302" text-anchor="middle" font-size="10" fill="#1e293b">• Regression imputation</text>
  <text x="660" y="319" text-anchor="middle" font-size="10" fill="#1e293b">• Group-based mean/median</text>

  <!-- === Row 3: MNAR === -->
  <rect x="25" y="370" width="750" height="130" rx="10" fill="#ffffff" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Label -->
  <rect x="40" y="380" width="140" height="30" rx="8" fill="#ef4444"/>
  <text x="110" y="400" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">MNAR</text>
  <text x="110" y="428" text-anchor="middle" font-size="10" fill="#1e293b" font-weight="600">Missing Not At Random</text>
  <text x="110" y="450" text-anchor="middle" font-size="9" fill="#6b7280">Missingness related to</text>
  <text x="110" y="463" text-anchor="middle" font-size="9" fill="#6b7280">the missing value itself</text>
  <text x="110" y="483" text-anchor="middle" font-size="9" fill="#6b7280">e.g. high earners hide</text>
  <text x="110" y="493" text-anchor="middle" font-size="9" fill="#6b7280">their income</text>

  <!-- Data grid - systematic pattern (high values missing) -->
  <g transform="translate(240, 380)">
    <rect x="0" y="0" width="30" height="20" rx="3" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1"/><text x="15" y="14" text-anchor="middle" font-size="9" fill="#1d4ed8">35</text>
    <rect x="35" y="0" width="30" height="20" rx="3" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1"/><text x="50" y="14" text-anchor="middle" font-size="9" fill="#1d4ed8">M</text>
    <rect x="70" y="0" width="30" height="20" rx="3" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1"/><text x="85" y="14" text-anchor="middle" font-size="9" fill="#1d4ed8">A</text>
    <rect x="105" y="0" width="30" height="20" rx="3" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1"/><text x="120" y="14" text-anchor="middle" font-size="9" fill="#1d4ed8">NY</text>
    <rect x="140" y="0" width="30" height="20" rx="3" fill="#fecaca" stroke="#ef4444" stroke-width="1"/><text x="155" y="14" text-anchor="middle" font-size="9" fill="#ef4444">?</text>

    <rect x="0" y="25" width="30" height="20" rx="3" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1"/><text x="15" y="39" text-anchor="middle" font-size="9" fill="#1d4ed8">28</text>
    <rect x="35" y="25" width="30" height="20" rx="3" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1"/><text x="50" y="39" text-anchor="middle" font-size="9" fill="#1d4ed8">F</text>
    <rect x="70" y="25" width="30" height="20" rx="3" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1"/><text x="85" y="39" text-anchor="middle" font-size="9" fill="#1d4ed8">B+</text>
    <rect x="105" y="25" width="30" height="20" rx="3" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1"/><text x="120" y="39" text-anchor="middle" font-size="9" fill="#1d4ed8">LA</text>
    <rect x="140" y="25" width="30" height="20" rx="3" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1"/><text x="155" y="39" text-anchor="middle" font-size="9" fill="#1d4ed8">55k</text>

    <rect x="0" y="50" width="30" height="20" rx="3" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1"/><text x="15" y="64" text-anchor="middle" font-size="9" fill="#1d4ed8">42</text>
    <rect x="35" y="50" width="30" height="20" rx="3" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1"/><text x="50" y="64" text-anchor="middle" font-size="9" fill="#1d4ed8">M</text>
    <rect x="70" y="50" width="30" height="20" rx="3" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1"/><text x="85" y="64" text-anchor="middle" font-size="9" fill="#1d4ed8">A+</text>
    <rect x="105" y="50" width="30" height="20" rx="3" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1"/><text x="120" y="64" text-anchor="middle" font-size="9" fill="#1d4ed8">SF</text>
    <rect x="140" y="50" width="30" height="20" rx="3" fill="#fecaca" stroke="#ef4444" stroke-width="1"/><text x="155" y="64" text-anchor="middle" font-size="9" fill="#ef4444">?</text>

    <rect x="0" y="75" width="30" height="20" rx="3" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1"/><text x="15" y="89" text-anchor="middle" font-size="9" fill="#1d4ed8">50</text>
    <rect x="35" y="75" width="30" height="20" rx="3" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1"/><text x="50" y="89" text-anchor="middle" font-size="9" fill="#1d4ed8">F</text>
    <rect x="70" y="75" width="30" height="20" rx="3" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1"/><text x="85" y="89" text-anchor="middle" font-size="9" fill="#1d4ed8">A+</text>
    <rect x="105" y="75" width="30" height="20" rx="3" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1"/><text x="120" y="89" text-anchor="middle" font-size="9" fill="#1d4ed8">CH</text>
    <rect x="140" y="75" width="30" height="20" rx="3" fill="#fecaca" stroke="#ef4444" stroke-width="1"/><text x="155" y="89" text-anchor="middle" font-size="9" fill="#ef4444">?</text>

    <!-- Annotation -->
    <line x1="170" y1="5" x2="195" y2="5" stroke="#ef4444" stroke-width="1.5"/>
    <line x1="170" y1="55" x2="195" y2="55" stroke="#ef4444" stroke-width="1.5"/>
    <line x1="170" y1="80" x2="195" y2="80" stroke="#ef4444" stroke-width="1.5"/>
    <text x="215" y="48" font-size="8" fill="#ef4444" font-weight="600">High grade →</text>
    <text x="215" y="58" font-size="8" fill="#ef4444" font-weight="600">inc. missing</text>
    <text x="85" y="110" text-anchor="middle" font-size="9" fill="#6b7280">High-income people don't report</text>
  </g>

  <!-- Imputation strategy -->
  <rect x="560" y="385" width="200" height="90" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="660" y="405" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">⚠ Hardest case:</text>
  <text x="660" y="425" text-anchor="middle" font-size="10" fill="#1e293b">• Selection models</text>
  <text x="660" y="442" text-anchor="middle" font-size="10" fill="#1e293b">• Sensitivity analysis</text>
  <text x="660" y="459" text-anchor="middle" font-size="10" fill="#1e293b">• Domain knowledge required</text>
</svg>