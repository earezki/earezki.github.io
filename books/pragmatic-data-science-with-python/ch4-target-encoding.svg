<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="860" height="520">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="860" height="520" rx="12" fill="#f8fafc"/>
  <rect x="0" y="0" width="860" height="56" rx="12" fill="url(#headerGrad)"/>
  <rect x="0" y="30" width="860" height="26" fill="url(#headerGrad)"/>
  <text x="430" y="37" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Target Encoding: Naive vs Regularized</text>

  <!-- LEFT PANEL: Naive -->
  <g filter="url(#shadow)">
    <rect x="20" y="75" width="400" height="425" rx="10" fill="#ffffff" stroke="#fecaca" stroke-width="2"/>
    <rect x="20" y="75" width="400" height="40" rx="10" fill="#ef4444"/>
    <rect x="20" y="100" width="400" height="15" fill="#ef4444"/>
    <text x="220" y="101" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">❌ Naive Target Encoding</text>
  </g>

  <!-- Naive table -->
  <text x="220" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#334155">Category → Mean(target) directly</text>

  <!-- Table headers -->
  <rect x="45" y="160" width="130" height="28" rx="4" fill="#fee2e2"/>
  <rect x="180" y="160" width="65" height="28" rx="4" fill="#fee2e2"/>
  <rect x="250" y="160" width="80" height="28" rx="4" fill="#fee2e2"/>
  <rect x="335" y="160" width="65" height="28" rx="4" fill="#fee2e2"/>
  <text x="110" y="179" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#991b1b">Category</text>
  <text x="213" y="179" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#991b1b">Count</text>
  <text x="290" y="179" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#991b1b">Mean(y)</text>
  <text x="368" y="179" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#991b1b">Encoded</text>

  <!-- Row 1: Large category -->
  <rect x="45" y="192" width="130" height="26" rx="3" fill="#f8fafc"/>
  <rect x="180" y="192" width="65" height="26" rx="3" fill="#f8fafc"/>
  <rect x="250" y="192" width="80" height="26" rx="3" fill="#f8fafc"/>
  <rect x="335" y="192" width="65" height="26" rx="3" fill="#f8fafc"/>
  <text x="110" y="210" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Electronics</text>
  <text x="213" y="210" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">5,000</text>
  <text x="290" y="210" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">0.42</text>
  <text x="368" y="210" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#10b981">0.42</text>

  <!-- Row 2: Medium -->
  <rect x="45" y="222" width="130" height="26" rx="3" fill="#ffffff"/>
  <rect x="180" y="222" width="65" height="26" rx="3" fill="#ffffff"/>
  <rect x="250" y="222" width="80" height="26" rx="3" fill="#ffffff"/>
  <rect x="335" y="222" width="65" height="26" rx="3" fill="#ffffff"/>
  <text x="110" y="240" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Clothing</text>
  <text x="213" y="240" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">500</text>
  <text x="290" y="240" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">0.38</text>
  <text x="368" y="240" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#10b981">0.38</text>

  <!-- Row 3: Small - PROBLEM -->
  <rect x="45" y="252" width="130" height="26" rx="3" fill="#fef2f2"/>
  <rect x="180" y="252" width="65" height="26" rx="3" fill="#fef2f2"/>
  <rect x="250" y="252" width="80" height="26" rx="3" fill="#fef2f2"/>
  <rect x="335" y="252" width="65" height="26" rx="3" fill="#fef2f2"/>
  <text x="110" y="270" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#ef4444" font-weight="600">Rare_Widget</text>
  <text x="213" y="270" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#ef4444" font-weight="600">2</text>
  <text x="290" y="270" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#ef4444" font-weight="600">1.00</text>
  <text x="368" y="270" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#ef4444" font-weight="700">1.00 ⚠</text>

  <!-- Row 4: Tiny - PROBLEM -->
  <rect x="45" y="282" width="130" height="26" rx="3" fill="#fef2f2"/>
  <rect x="180" y="282" width="65" height="26" rx="3" fill="#fef2f2"/>
  <rect x="250" y="282" width="80" height="26" rx="3" fill="#fef2f2"/>
  <rect x="335" y="282" width="65" height="26" rx="3" fill="#fef2f2"/>
  <text x="110" y="300" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#ef4444" font-weight="600">Niche_Item</text>
  <text x="213" y="300" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#ef4444" font-weight="600">1</text>
  <text x="290" y="300" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#ef4444" font-weight="600">0.00</text>
  <text x="368" y="300" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#ef4444" font-weight="700">0.00 ⚠</text>

  <!-- Overfitting warning -->
  <rect x="45" y="320" width="355" height="65" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="222" y="340" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#dc2626">⚠ Overfitting Problem</text>
  <text x="222" y="358" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#7f1d1d">Small categories get extreme values (0.0 or 1.0)</text>
  <text x="222" y="374" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#7f1d1d">based on noise, not signal → memorization!</text>

  <!-- Overfitting visual -->
  <text x="220" y="415" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#475569">Encoding Distribution</text>
  <!-- Axis -->
  <line x1="60" y1="470" x2="380" y2="470" stroke="#94a3b8" stroke-width="1"/>
  <text x="60" y="487" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">0.0</text>
  <text x="370" y="487" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">1.0</text>
  <!-- Extreme spikes at 0 and 1 -->
  <rect x="62" y="432" width="12" height="38" rx="2" fill="#ef4444" opacity="0.7"/>
  <rect x="366" y="435" width="12" height="35" rx="2" fill="#ef4444" opacity="0.7"/>
  <!-- Normal distribution in middle -->
  <rect x="160" y="450" width="15" height="20" rx="2" fill="#94a3b8" opacity="0.4"/>
  <rect x="180" y="442" width="15" height="28" rx="2" fill="#94a3b8" opacity="0.4"/>
  <rect x="200" y="436" width="15" height="34" rx="2" fill="#94a3b8" opacity="0.4"/>
  <rect x="220" y="442" width="15" height="28" rx="2" fill="#94a3b8" opacity="0.4"/>
  <rect x="240" y="450" width="15" height="20" rx="2" fill="#94a3b8" opacity="0.4"/>
  <text x="68" y="428" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#ef4444">rare cats</text>
  <text x="372" y="428" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#ef4444">rare cats</text>

  <!-- RIGHT PANEL: Regularized -->
  <g filter="url(#shadow)">
    <rect x="440" y="75" width="400" height="425" rx="10" fill="#ffffff" stroke="#bbf7d0" stroke-width="2"/>
    <rect x="440" y="75" width="400" height="40" rx="10" fill="#10b981"/>
    <rect x="440" y="100" width="400" height="15" fill="#10b981"/>
    <text x="640" y="101" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">✓ Regularized Target Encoding</text>
  </g>

  <!-- Formula banner -->
  <rect x="460" y="125" width="360" height="50" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="640" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#166534">Smoothed Encoding Formula:</text>
  <text x="640" y="165" text-anchor="middle" font-family="monospace, monospace" font-size="13" fill="#15803d">enc = (n·cat_mean + m·global_mean) / (n + m)</text>

  <!-- Parameters explanation -->
  <text x="640" y="200" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">where n = category count, m = smoothing factor (e.g. 20)</text>
  <text x="640" y="216" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Global mean = 0.40</text>

  <!-- Table headers -->
  <rect x="462" y="230" width="100" height="26" rx="4" fill="#dcfce7"/>
  <rect x="567" y="230" width="50" height="26" rx="4" fill="#dcfce7"/>
  <rect x="622" y="230" width="60" height="26" rx="4" fill="#dcfce7"/>
  <rect x="687" y="230" width="65" height="26" rx="4" fill="#dcfce7"/>
  <rect x="757" y="230" width="65" height="26" rx="4" fill="#dcfce7"/>
  <text x="512" y="248" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#166534">Category</text>
  <text x="592" y="248" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#166534">n</text>
  <text x="652" y="248" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#166534">Mean</text>
  <text x="720" y="248" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#166534">Weight</text>
  <text x="790" y="248" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#166534">Encoded</text>

  <!-- Row 1 -->
  <text x="512" y="276" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Electronics</text>
  <text x="592" y="276" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">5000</text>
  <text x="652" y="276" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">0.42</text>
  <text x="720" y="276" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">99.6%</text>
  <text x="790" y="276" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#10b981">0.420</text>

  <!-- Row 2 -->
  <text x="512" y="300" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Clothing</text>
  <text x="592" y="300" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">500</text>
  <text x="652" y="300" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">0.38</text>
  <text x="720" y="300" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">96.2%</text>
  <text x="790" y="300" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#10b981">0.381</text>

  <!-- Row 3 - Small: smoothed! -->
  <rect x="462" y="308" width="360" height="22" rx="3" fill="#f0fdf4"/>
  <text x="512" y="324" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#15803d" font-weight="600">Rare_Widget</text>
  <text x="592" y="324" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#15803d" font-weight="600">2</text>
  <text x="652" y="324" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#15803d">1.00</text>
  <text x="720" y="324" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#15803d">9.1%</text>
  <text x="790" y="324" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#10b981">0.455 ✓</text>

  <!-- Row 4 - Tiny: heavily smoothed! -->
  <rect x="462" y="332" width="360" height="22" rx="3" fill="#f0fdf4"/>
  <text x="512" y="348" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#15803d" font-weight="600">Niche_Item</text>
  <text x="592" y="348" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#15803d" font-weight="600">1</text>
  <text x="652" y="348" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#15803d">0.00</text>
  <text x="720" y="348" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#15803d">4.8%</text>
  <text x="790" y="348" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#10b981">0.381 ✓</text>

  <!-- Smoothing effect visual -->
  <rect x="462" y="368" width="360" height="120" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="642" y="390" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#166534">Smoothing Effect</text>

  <!-- Visual: spectrum from global mean to category mean -->
  <text x="485" y="412" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Global Mean</text>
  <text x="750" y="412" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Cat. Mean</text>
  <rect x="485" y="420" width="320" height="10" rx="5" fill="#e2e8f0"/>
  <linearGradient id="smoothGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#3b82f6"/>
    <stop offset="100%" stop-color="#10b981"/>
  </linearGradient>
  <rect x="485" y="420" width="320" height="10" rx="5" fill="url(#smoothGrad)" opacity="0.6"/>

  <!-- Markers for categories -->
  <circle cx="505" cy="425" r="6" fill="#ef4444" stroke="#fff" stroke-width="1.5"/>
  <text x="505" y="450" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#ef4444">n=1</text>
  <circle cx="530" cy="425" r="6" fill="#f59e0b" stroke="#fff" stroke-width="1.5"/>
  <text x="530" y="450" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#f59e0b">n=2</text>
  <circle cx="700" cy="425" r="6" fill="#22c55e" stroke="#fff" stroke-width="1.5"/>
  <text x="700" y="450" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#22c55e">n=500</text>
  <circle cx="790" cy="425" r="6" fill="#10b981" stroke="#fff" stroke-width="1.5"/>
  <text x="790" y="450" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#10b981">n=5000</text>

  <text x="642" y="478" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#166534">Small n → pulled toward global mean (safe)</text>
  <text x="642" y="492" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#166534">Large n → keeps own category mean (reliable)</text>
</svg>