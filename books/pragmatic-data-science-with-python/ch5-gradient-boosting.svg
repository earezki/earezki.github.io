<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" width="860" height="500">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <marker id="arrowG" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
    <marker id="arrowB" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="10" markerHeight="7" orient="auto-start-auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="860" height="500" rx="12" fill="#f8fafc"/>
  <rect x="0" y="0" width="860" height="56" rx="12" fill="url(#headerGrad)"/>
  <rect x="0" y="30" width="860" height="26" fill="url(#headerGrad)"/>
  <text x="430" y="37" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Gradient Boosting Mechanics</text>

  <!-- Step 1: Initial Prediction -->
  <g filter="url(#shadow)">
    <rect x="20" y="80" width="110" height="60" rx="10" fill="#6b7280"/>
    <text x="75" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Initial</text>
    <text x="75" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Prediction</text>
  </g>
  <text x="75" y="158" text-anchor="middle" font-family="monospace" font-size="11" fill="#6b7280">ŷ₀ = mean(y)</text>

  <!-- Arrow -->
  <line x1="130" y1="110" x2="155" y2="110" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowG)"/>

  <!-- Step 2: Compute Residuals -->
  <g filter="url(#shadow)">
    <rect x="163" y="80" width="110" height="60" rx="10" fill="#ef4444"/>
    <text x="218" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Compute</text>
    <text x="218" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Residuals</text>
  </g>
  <text x="218" y="158" text-anchor="middle" font-family="monospace" font-size="11" fill="#ef4444">rᵢ = yᵢ - ŷᵢ</text>

  <!-- Arrow -->
  <line x1="273" y1="110" x2="298" y2="110" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowG)"/>

  <!-- Step 3: Fit Tree 1 -->
  <g filter="url(#shadow)">
    <rect x="306" y="80" width="110" height="60" rx="10" fill="#3b82f6"/>
    <text x="361" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Tree 1</text>
    <text x="361" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#bfdbfe">fits residuals</text>
    <text x="361" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#93c5fd">h₁(x)</text>
  </g>

  <!-- Arrow -->
  <line x1="416" y1="110" x2="441" y2="110" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowG)"/>

  <!-- Step 4: Update prediction -->
  <g filter="url(#shadow)">
    <rect x="449" y="80" width="110" height="60" rx="10" fill="#10b981"/>
    <text x="504" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Update</text>
    <text x="504" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#bbf7d0">ŷ₁ = ŷ₀ + η·h₁</text>
    <text x="504" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#86efac">shrinkage!</text>
  </g>

  <!-- Arrow looping -->
  <line x1="559" y1="110" x2="584" y2="110" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowG)"/>

  <!-- Step 5: New residuals -->
  <g filter="url(#shadow)">
    <rect x="592" y="80" width="110" height="60" rx="10" fill="#ef4444" opacity="0.85"/>
    <text x="647" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">New</text>
    <text x="647" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Residuals</text>
  </g>

  <!-- Arrow -->
  <line x1="702" y1="110" x2="727" y2="110" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowG)"/>

  <!-- Step 6: Tree 2 -->
  <g filter="url(#shadow)">
    <rect x="735" y="80" width="105" height="60" rx="10" fill="#3b82f6" opacity="0.85"/>
    <text x="788" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Tree 2</text>
    <text x="788" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#bfdbfe">fits residuals</text>
    <text x="788" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#93c5fd">h₂(x)</text>
  </g>

  <!-- Repeat dots -->
  <text x="430" y="175" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#6b7280">· · ·  repeat for T iterations  · · ·</text>

  <!-- Learning Rate Shrinkage Visual -->
  <g filter="url(#shadow)">
    <rect x="20" y="200" width="820" height="100" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="430" y="225" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#334155">Learning Rate (η) Shrinkage Effect</text>
  </g>

  <!-- Tree contribution bars with shrinkage -->
  <text x="80" y="258" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#475569">Tree 1</text>
  <rect x="53" y="262" width="54" height="28" rx="4" fill="#3b82f6"/>
  <text x="80" y="280" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#ffffff">η=0.1</text>

  <text x="160" y="258" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#475569">Full h₁</text>
  <rect x="133" y="262" width="54" height="28" rx="4" fill="#bfdbfe" stroke="#3b82f6" stroke-dasharray="3,2"/>
  <text x="160" y="280" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#3b82f6">×1.0</text>

  <!-- Multiplication visual -->
  <text x="110" y="280" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#6b7280">→</text>

  <!-- Arrow pointing to shrunk version -->
  <rect x="200" y="262" width="6" height="28" rx="2" fill="#3b82f6"/>
  <text x="203" y="258" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#3b82f6" font-weight="600">×η</text>

  <!-- More trees showing same pattern -->
  <text x="280" y="258" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#475569">Tree 2</text>
  <rect x="257" y="262" width="46" height="28" rx="4" fill="#bfdbfe" stroke="#3b82f6" stroke-dasharray="3,2"/>
  <text x="243" y="280" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#6b7280">→</text>
  <rect x="310" y="262" width="5" height="28" rx="2" fill="#3b82f6"/>

  <text x="370" y="258" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#475569">Tree 3</text>
  <rect x="348" y="262" width="44" height="28" rx="4" fill="#bfdbfe" stroke="#3b82f6" stroke-dasharray="3,2"/>
  <text x="335" y="280" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#6b7280">→</text>
  <rect x="398" y="262" width="5" height="28" rx="2" fill="#3b82f6"/>

  <text x="430" y="280" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#6b7280">···</text>

  <!-- Explanation -->
  <text x="620" y="260" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Each tree's contribution is multiplied by η</text>
  <text x="620" y="278" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Small η (0.01-0.1) → more trees needed, but</text>
  <text x="620" y="293" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#10b981">better generalization and less overfitting</text>

  <!-- Final Equation Box -->
  <g filter="url(#shadow)">
    <rect x="20" y="315" width="820" height="80" rx="10" fill="#f0f9ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="430" y="340" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1d4ed8">Final Prediction Equation</text>
    <text x="430" y="370" text-anchor="middle" font-family="monospace" font-size="18" fill="#1e40af">ŷ = y_mean + η · h₁(x) + η · h₂(x) + η · h₃(x) + ··· + η · hₜ(x)</text>
    <text x="430" y="390" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Each hₜ fits the residuals of the previous step's prediction</text>
  </g>

  <!-- Key parameters box -->
  <g filter="url(#shadow)">
    <rect x="20" y="410" width="265" height="78" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="20" y="410" width="265" height="28" rx="8" fill="#3b82f6"/>
    <rect x="20" y="426" width="265" height="12" fill="#3b82f6"/>
    <text x="153" y="430" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">🎯 Key Parameters</text>
    <text x="35" y="458" font-family="system-ui, sans-serif" font-size="11" fill="#475569">• n_estimators: number of trees (T)</text>
    <text x="35" y="475" font-family="system-ui, sans-serif" font-size="11" fill="#475569">• learning_rate: shrinkage (η = 0.01-0.3)</text>
    <text x="35" y="480" font-family="system-ui, sans-serif" font-size="11" fill="#475569"></text>
  </g>

  <g filter="url(#shadow)">
    <rect x="298" y="410" width="265" height="78" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="298" y="410" width="265" height="28" rx="8" fill="#f59e0b"/>
    <rect x="298" y="426" width="265" height="12" fill="#f59e0b"/>
    <text x="430" y="430" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">🌳 Tree Constraints</text>
    <text x="313" y="458" font-family="system-ui, sans-serif" font-size="11" fill="#475569">• max_depth: 3-8 (shallow trees!)</text>
    <text x="313" y="475" font-family="system-ui, sans-serif" font-size="11" fill="#475569">• min_child_weight: regularization</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="576" y="410" width="264" height="78" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="576" y="410" width="264" height="28" rx="8" fill="#10b981"/>
    <rect x="576" y="426" width="264" height="12" fill="#10b981"/>
    <text x="708" y="430" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">⚡ Regularization</text>
    <text x="591" y="458" font-family="system-ui, sans-serif" font-size="11" fill="#475569">• subsample: row sampling (0.7-0.9)</text>
    <text x="591" y="475" font-family="system-ui, sans-serif" font-size="11" fill="#475569">• colsample_bytree: col sampling</text>
  </g>
</svg>