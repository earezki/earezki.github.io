<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="12" fill="url(#bgGrad)" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Title -->
  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">Data Failure Taxonomy</text>
  <line x1="265" y1="46" x2="535" y2="46" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>

  <!-- Center label -->
  <rect x="290" y="230" width="220" height="40" rx="20" fill="#1e293b" filter="url(#shadow)"/>
  <text x="400" y="255" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Every Dataset Has At Least One</text>

  <!-- === Top-Left: Missing Data === -->
  <rect x="30" y="65" width="350" height="155" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="30" y="65" width="350" height="32" rx="12" fill="#3b82f6"/>
  <rect x="30" y="85" width="350" height="12" fill="#3b82f6"/>

  <!-- Icon -->
  <text x="55" y="89" font-size="16" fill="#ffffff">◻</text>
  <text x="165" y="89" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Missing Data</text>

  <!-- Content -->
  <rect x="50" y="110" width="90" height="28" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="95" y="128" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">MCAR</text>

  <rect x="155" y="110" width="90" height="28" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="200" y="128" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">MAR</text>

  <rect x="260" y="110" width="100" height="28" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="310" y="128" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">MNAR</text>

  <text x="50" y="160" font-size="10" fill="#6b7280">Missing Completely At Random</text>
  <text x="50" y="175" font-size="10" fill="#6b7280">Missing At Random</text>
  <text x="50" y="190" font-size="10" fill="#6b7280">Missing Not At Random</text>

  <text x="50" y="210" font-size="10" font-weight="600" fill="#3b82f6">→ Different mechanisms need different fixes</text>

  <!-- === Top-Right: Target Leakage === -->
  <rect x="420" y="65" width="350" height="155" rx="12" fill="#ffffff" stroke="#ef4444" stroke-width="2" filter="url(#shadow)"/>
  <rect x="420" y="65" width="350" height="32" rx="12" fill="#ef4444"/>
  <rect x="420" y="85" width="350" height="12" fill="#ef4444"/>

  <!-- Icon -->
  <text x="445" y="89" font-size="16" fill="#ffffff">⚠</text>
  <text x="560" y="89" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Target Leakage</text>

  <!-- Content -->
  <rect x="440" y="110" width="130" height="28" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="505" y="128" text-anchor="middle" font-size="11" font-weight="600" fill="#991b1b">Temporal</text>

  <rect x="585" y="110" width="165" height="28" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="667" y="128" text-anchor="middle" font-size="11" font-weight="600" fill="#991b1b">Feature-based</text>

  <text x="440" y="160" font-size="10" fill="#6b7280">Future data leaking into training</text>
  <text x="440" y="175" font-size="10" fill="#6b7280">Features derived from the target</text>
  <text x="440" y="190" font-size="10" fill="#6b7280">Proxy variables with direct access</text>

  <text x="440" y="210" font-size="10" font-weight="600" fill="#ef4444">→ Inflated metrics, model fails in prod</text>

  <!-- === Bottom-Left: Outliers === -->
  <rect x="30" y="280" width="350" height="155" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <rect x="30" y="280" width="350" height="32" rx="12" fill="#f59e0b"/>
  <rect x="30" y="300" width="350" height="12" fill="#f59e0b"/>

  <!-- Icon -->
  <text x="55" y="303" font-size="16" fill="#ffffff">📊</text>
  <text x="170" y="303" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Outliers</text>

  <!-- Content -->
  <rect x="50" y="325" width="80" height="28" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="90" y="343" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">True</text>

  <rect x="145" y="325" width="90" height="28" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="190" y="343" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">Anomaly</text>

  <rect x="250" y="325" width="110" height="28" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="305" y="343" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">Bad Data</text>

  <text x="50" y="375" font-size="10" fill="#6b7280">True extremes: real but rare events</text>
  <text x="50" y="390" font-size="10" fill="#6b7280">Anomaly: interesting signal to detect</text>
  <text x="50" y="405" font-size="10" fill="#6b7280">Bad data: errors, corruption, entry bugs</text>

  <text x="50" y="425" font-size="10" font-weight="600" fill="#d97706">→ Context determines whether to keep or remove</text>

  <!-- === Bottom-Right: Distribution Shift === -->
  <rect x="420" y="280" width="350" height="155" rx="12" fill="#ffffff" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="420" y="280" width="350" height="32" rx="12" fill="#8b5cf6"/>
  <rect x="420" y="300" width="350" height="12" fill="#8b5cf6"/>

  <!-- Icon -->
  <text x="445" y="303" font-size="16" fill="#ffffff">📈</text>
  <text x="560" y="303" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Distribution Shift</text>

  <!-- Content -->
  <rect x="440" y="325" width="95" height="28" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1"/>
  <text x="487" y="343" text-anchor="middle" font-size="11" font-weight="600" fill="#6d28d9">Covariate</text>

  <rect x="548" y="325" width="90" height="28" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1"/>
  <text x="593" y="343" text-anchor="middle" font-size="11" font-weight="600" fill="#6d28d9">Concept</text>

  <rect x="652" y="325" width="95" height="28" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1"/>
  <text x="700" y="343" text-anchor="middle" font-size="11" font-weight="600" fill="#6d28d9">Prior</text>

  <text x="440" y="375" font-size="10" fill="#6b7280">Covariate: input features change</text>
  <text x="440" y="390" font-size="10" fill="#6b7280">Concept: relationship changes</text>
  <text x="440" y="405" font-size="10" fill="#6b7280">Prior: class proportions change</text>

  <text x="440" y="425" font-size="10" font-weight="600" fill="#8b5cf6">→ Monitor and retrain continuously</text>

  <!-- Bottom summary -->
  <rect x="120" y="460" width="560" height="28" rx="8" fill="#1e293b"/>
  <text x="400" y="479" text-anchor="middle" font-size="12" font-weight="600" fill="#f8fafc">🔍 Systematic diagnosis before modeling saves weeks of debugging</text>
</svg>