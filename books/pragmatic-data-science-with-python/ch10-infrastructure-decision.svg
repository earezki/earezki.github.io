<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" rx="12" fill="#f8fafc"/>

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">Infrastructure Decision Matrix</text>
  <line x1="240" y1="48" x2="560" y2="48" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Axes -->
  <!-- Y-axis -->
  <line x1="140" y1="90" x2="140" y2="430" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="140,85 135,98 145,98" fill="#94a3b8"/>
  <text x="70" y="265" text-anchor="middle" font-size="15" font-weight="600" fill="#475569" transform="rotate(-90 70 265)">Request Volume</text>
  <text x="125" y="108" text-anchor="end" font-size="11" fill="#94a3b8">High</text>
  <text x="125" y="425" text-anchor="end" font-size="11" fill="#94a3b8">Low</text>

  <!-- X-axis -->
  <line x1="140" y1="430" x2="760" y2="430" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="765,430 752,425 752,435" fill="#94a3b8"/>
  <text x="450" y="465" text-anchor="middle" font-size="15" font-weight="600" fill="#475569">Model Size</text>
  <text x="155" y="448" font-size="11" fill="#94a3b8">Small</text>
  <text x="720" y="448" text-anchor="end" font-size="11" fill="#94a3b8">Large</text>

  <!-- Dividing lines -->
  <line x1="450" y1="90" x2="450" y2="430" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="140" y1="260" x2="760" y2="260" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Quadrant 1: Low Volume, Small Model - Serverless -->
  <rect x="160" y="278" width="272" height="138" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="160" y="278" width="272" height="36" rx="12" fill="#10b981"/>
  <rect x="160" y="298" width="272" height="16" fill="#10b981"/>
  <text x="296" y="302" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">☁ Serverless</text>
  <text x="296" y="340" text-anchor="middle" font-size="13" fill="#475569">AWS Lambda / Cloud Functions</text>
  <text x="296" y="362" text-anchor="middle" font-size="12" fill="#64748b">• Zero idle cost</text>
  <text x="296" y="380" text-anchor="middle" font-size="12" fill="#64748b">• Auto-scaling</text>
  <text x="296" y="398" text-anchor="middle" font-size="12" fill="#64748b">• Cold start latency</text>
  <rect x="210" y="404" width="172" height="20" rx="5" fill="#d1fae5"/>
  <text x="296" y="418" text-anchor="middle" font-size="11" font-weight="600" fill="#059669">~$5–50/month</text>

  <!-- Quadrant 2: Low Volume, Large Model - Managed Endpoint -->
  <rect x="468" y="278" width="272" height="138" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="468" y="278" width="272" height="36" rx="12" fill="#8b5cf6"/>
  <rect x="468" y="298" width="272" height="16" fill="#8b5cf6"/>
  <text x="604" y="302" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">🔧 Managed Endpoint</text>
  <text x="604" y="340" text-anchor="middle" font-size="13" fill="#475569">SageMaker / Vertex AI</text>
  <text x="604" y="362" text-anchor="middle" font-size="12" fill="#64748b">• GPU support</text>
  <text x="604" y="380" text-anchor="middle" font-size="12" fill="#64748b">• Managed scaling</text>
  <text x="604" y="398" text-anchor="middle" font-size="12" fill="#64748b">• Higher baseline cost</text>
  <rect x="518" y="404" width="172" height="20" rx="5" fill="#ede9fe"/>
  <text x="604" y="418" text-anchor="middle" font-size="11" font-weight="600" fill="#7c3aed">~$100–500/month</text>

  <!-- Quadrant 3: High Volume, Small Model - Container -->
  <rect x="160" y="104" width="272" height="138" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="160" y="104" width="272" height="36" rx="12" fill="#3b82f6"/>
  <rect x="160" y="124" width="272" height="16" fill="#3b82f6"/>
  <text x="296" y="128" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">📦 Container</text>
  <text x="296" y="166" text-anchor="middle" font-size="13" fill="#475569">Cloud Run / ECS / K8s</text>
  <text x="296" y="188" text-anchor="middle" font-size="12" fill="#64748b">• Fast scaling</text>
  <text x="296" y="206" text-anchor="middle" font-size="12" fill="#64748b">• Cost-efficient at scale</text>
  <text x="296" y="224" text-anchor="middle" font-size="12" fill="#64748b">• Requires orchestration</text>
  <rect x="210" y="228" width="172" height="20" rx="5" fill="#dbeafe"/>
  <text x="296" y="242" text-anchor="middle" font-size="11" font-weight="600" fill="#2563eb">~$50–300/month</text>

  <!-- Quadrant 4: High Volume, Large Model - Dedicated GPU -->
  <rect x="468" y="104" width="272" height="138" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="468" y="104" width="272" height="36" rx="12" fill="#ef4444"/>
  <rect x="468" y="124" width="272" height="16" fill="#ef4444"/>
  <text x="604" y="128" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">⚡ Dedicated GPU</text>
  <text x="604" y="166" text-anchor="middle" font-size="13" fill="#475569">EC2 GPU / GCE A100</text>
  <text x="604" y="188" text-anchor="middle" font-size="12" fill="#64748b">• Maximum throughput</text>
  <text x="604" y="206" text-anchor="middle" font-size="12" fill="#64748b">• Predictable latency</text>
  <text x="604" y="224" text-anchor="middle" font-size="12" fill="#64748b">• Highest cost</text>
  <rect x="518" y="228" width="172" height="20" rx="5" fill="#fee2e2"/>
  <text x="604" y="242" text-anchor="middle" font-size="11" font-weight="600" fill="#dc2626">~$500–5000/month</text>

  <!-- Decision hint -->
  <rect x="140" y="478" width="620" height="30" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="450" y="498" text-anchor="middle" font-size="12" fill="#64748b">💡 Start with the simplest option that meets latency requirements, then scale up as needed</text>
</svg>