<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" width="820" height="520" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="820" height="520" fill="#f8fafc" rx="8"/>

  <!-- Title -->
  <text x="410" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">LoRA: Low-Rank Adaptation</text>

  <!-- Input x -->
  <g filter="url(#shadow)">
    <rect x="30" y="180" width="80" height="60" rx="8" fill="white" stroke="#6b7280" stroke-width="1.5"/>
    <text x="70" y="207" text-anchor="middle" font-size="16" font-weight="700" fill="#374151">x</text>
    <text x="70" y="228" text-anchor="middle" font-size="11" fill="#6b7280">Input</text>
  </g>

  <!-- Arrow to W -->
  <line x1="110" y1="195" x2="148" y2="155" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- Arrow to A -->
  <line x1="110" y1="225" x2="148" y2="275" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Original Weight Matrix W (frozen) -->
  <g filter="url(#shadow)">
    <rect x="155" y="80" width="200" height="140" rx="8" fill="#e5e7eb" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6,3"/>
    <text x="255" y="135" text-anchor="middle" font-size="20" font-weight="700" fill="#6b7280">W</text>
    <text x="255" y="158" text-anchor="middle" font-size="13" fill="#6b7280">4096 × 4096</text>
    <text x="255" y="178" text-anchor="middle" font-size="12" fill="#9ca3af">❄️ Frozen Weights</text>
    <text x="255" y="198" text-anchor="middle" font-size="11" fill="#9ca3af">~16.7M parameters</text>
  </g>

  <!-- W·x output arrow -->
  <line x1="355" y1="150" x2="548" y2="150" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="450" y="142" text-anchor="middle" font-size="13" font-weight="600" fill="#9ca3af">W · x</text>

  <!-- Matrix A (down-projection, trainable) -->
  <g filter="url(#shadow)">
    <rect x="155" y="260" width="100" height="120" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
    <text x="205" y="310" text-anchor="middle" font-size="18" font-weight="700" fill="#5b21b6">A</text>
    <text x="205" y="332" text-anchor="middle" font-size="12" fill="#5b21b6">4096 × 16</text>
    <text x="205" y="350" text-anchor="middle" font-size="11" fill="#7c3aed">🔥 Trainable</text>
    <text x="205" y="368" text-anchor="middle" font-size="10" fill="#6b7280">Down-project</text>
  </g>

  <line x1="255" y1="320" x2="298" y2="320" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Rank-16 bottleneck label -->
  <text x="278" y="305" text-anchor="middle" font-size="10" fill="#8b5cf6" font-weight="600">rank</text>
  <text x="278" y="316" text-anchor="middle" font-size="10" fill="#8b5cf6" font-weight="600">r=16</text>

  <!-- Matrix B (up-projection, trainable) -->
  <g filter="url(#shadow)">
    <rect x="305" y="260" width="120" height="120" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
    <text x="365" y="310" text-anchor="middle" font-size="18" font-weight="700" fill="#5b21b6">B</text>
    <text x="365" y="332" text-anchor="middle" font-size="12" fill="#5b21b6">16 × 4096</text>
    <text x="365" y="350" text-anchor="middle" font-size="11" fill="#7c3aed">🔥 Trainable</text>
    <text x="365" y="368" text-anchor="middle" font-size="10" fill="#6b7280">Up-project</text>
  </g>

  <!-- B·A·x arrow up to addition -->
  <path d="M 425 320 L 500 320 L 560 200" stroke="#8b5cf6" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="505" y="270" text-anchor="middle" font-size="13" font-weight="600" fill="#8b5cf6">B · A · x</text>

  <!-- Addition circle -->
  <circle cx="570" cy="180" r="24" fill="white" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <text x="570" y="186" text-anchor="middle" font-size="22" font-weight="700" fill="#10b981">+</text>

  <!-- Output -->
  <line x1="594" y1="180" x2="648" y2="180" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <g filter="url(#shadow)">
    <rect x="655" y="155" width="130" height="50" rx="8" fill="#dcfce7" stroke="#10b981" stroke-width="2"/>
    <text x="720" y="177" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">Output</text>
    <text x="720" y="195" text-anchor="middle" font-size="12" fill="#065f46">h = Wx + BAx</text>
  </g>

  <!-- Parameter count label -->
  <g filter="url(#shadow)">
    <rect x="155" y="410" width="270" height="40" rx="8" fill="#fefce8" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="290" y="435" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">Only ~0.1% of parameters trained (131K vs 16.7M)</text>
  </g>

  <!-- VRAM comparison -->
  <g transform="translate(490, 330)">
    <text font-size="14" font-weight="700" fill="#374151">VRAM Comparison</text>

    <!-- Full fine-tuning bar -->
    <rect y="18" width="280" height="28" rx="6" fill="#ef4444" opacity="0.2" stroke="#ef4444" stroke-width="1"/>
    <text x="140" y="37" text-anchor="middle" font-size="13" font-weight="600" fill="#991b1b">Full Fine-Tuning: 56 GB</text>

    <!-- LoRA bar -->
    <rect y="54" width="40" height="28" rx="6" fill="#8b5cf6" opacity="0.2" stroke="#8b5cf6" stroke-width="1"/>
    <rect y="54" width="40" height="28" rx="6" fill="#8b5cf6" opacity="0.15"/>
    <text x="70" y="73" font-size="13" font-weight="600" fill="#5b21b6">LoRA: 8 GB</text>

    <!-- QLoRA bar -->
    <rect y="90" width="20" height="28" rx="6" fill="#10b981" opacity="0.2" stroke="#10b981" stroke-width="1"/>
    <rect y="90" width="20" height="28" rx="6" fill="#10b981" opacity="0.15"/>
    <text x="70" y="109" font-size="13" font-weight="600" fill="#065f46">QLoRA: 4 GB</text>
  </g>
</svg>