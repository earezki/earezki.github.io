<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" width="840" height="520" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="840" height="520" fill="#f8fafc" rx="8"/>

  <!-- Title -->
  <text x="420" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">RAG Architecture</text>

  <!-- Phase 1: Ingestion -->
  <rect x="20" y="50" width="800" height="170" rx="10" fill="#3b82f6" opacity="0.06" stroke="#3b82f6" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="40" y="72" font-size="16" font-weight="700" fill="#1d4ed8">INGESTION PHASE</text>

  <!-- Documents -->
  <g filter="url(#shadow)">
    <rect x="40" y="88" width="120" height="56" rx="8" fill="white" stroke="#6b7280" stroke-width="1.5"/>
    <text x="100" y="114" text-anchor="middle" font-size="14" font-weight="600" fill="#374151">📄 Documents</text>
    <text x="100" y="132" text-anchor="middle" font-size="11" fill="#6b7280">PDF, HTML, MD</text>
  </g>

  <!-- Arrow -->
  <line x1="160" y1="116" x2="198" y2="116" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Chunking -->
  <g filter="url(#shadow)">
    <rect x="205" y="88" width="130" height="56" rx="8" fill="white" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="270" y="114" text-anchor="middle" font-size="14" font-weight="600" fill="#92400e">✂️ Chunking</text>
    <text x="270" y="132" text-anchor="middle" font-size="11" fill="#92400e">512 tokens</text>
  </g>

  <line x1="335" y1="116" x2="373" y2="116" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Embedding Model -->
  <g filter="url(#shadow)">
    <rect x="380" y="88" width="160" height="56" rx="8" fill="white" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="460" y="110" text-anchor="middle" font-size="14" font-weight="600" fill="#5b21b6">Embedding Model</text>
    <text x="460" y="128" text-anchor="middle" font-size="11" fill="#6b7280">sentence-transformers</text>
  </g>

  <line x1="540" y1="116" x2="588" y2="116" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Vector Database (shared) -->
  <g filter="url(#shadow)">
    <rect x="595" y="88" width="170" height="110" rx="12" fill="#e0f2fe" stroke="#3b82f6" stroke-width="2"/>
    <text x="680" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">🗄️ Vector DB</text>
    <text x="680" y="136" text-anchor="middle" font-size="11" fill="#1d4ed8">Qdrant / Pinecone</text>
    <text x="680" y="156" text-anchor="middle" font-size="11" fill="#6b7280">Chunks + Embeddings</text>
    <text x="680" y="172" text-anchor="middle" font-size="11" fill="#6b7280">+ Metadata</text>
  </g>

  <!-- Phase 2: Query -->
  <rect x="20" y="240" width="800" height="200" rx="10" fill="#10b981" opacity="0.06" stroke="#10b981" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="40" y="262" font-size="16" font-weight="700" fill="#065f46">QUERY PHASE</text>

  <!-- User Query -->
  <g filter="url(#shadow)">
    <rect x="40" y="280" width="110" height="56" rx="8" fill="white" stroke="#6b7280" stroke-width="1.5"/>
    <text x="95" y="306" text-anchor="middle" font-size="14" font-weight="600" fill="#374151">🧑 User Query</text>
    <text x="95" y="324" text-anchor="middle" font-size="11" fill="#6b7280">"How does…?"</text>
  </g>

  <line x1="150" y1="308" x2="188" y2="308" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Embed query -->
  <g filter="url(#shadow)">
    <rect x="195" y="280" width="110" height="56" rx="8" fill="white" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="250" y="306" text-anchor="middle" font-size="14" font-weight="600" fill="#5b21b6">Embedding</text>
    <text x="250" y="324" text-anchor="middle" font-size="11" fill="#6b7280">query → vector</text>
  </g>

  <line x1="305" y1="308" x2="343" y2="308" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Vector Search -->
  <g filter="url(#shadow)">
    <rect x="350" y="280" width="120" height="56" rx="8" fill="white" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="410" y="306" text-anchor="middle" font-size="14" font-weight="600" fill="#1d4ed8">🔍 Search</text>
    <text x="410" y="324" text-anchor="middle" font-size="11" fill="#6b7280">Top-K: 5 chunks</text>
  </g>

  <!-- Connection to Vector DB -->
  <path d="M 680 198 L 680 230 L 410 230 L 410 280" stroke="#3b82f6" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <text x="545" y="224" text-anchor="middle" font-size="11" fill="#3b82f6">similarity search</text>

  <line x1="470" y1="308" x2="508" y2="308" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Retrieved Chunks -->
  <g filter="url(#shadow)">
    <rect x="515" y="280" width="120" height="56" rx="8" fill="white" stroke="#10b981" stroke-width="1.5"/>
    <text x="575" y="302" text-anchor="middle" font-size="13" font-weight="600" fill="#065f46">Retrieved</text>
    <text x="575" y="320" text-anchor="middle" font-size="13" font-weight="600" fill="#065f46">Chunks</text>
  </g>

  <line x1="635" y1="308" x2="668" y2="308" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- LLM + Answer -->
  <g filter="url(#shadow)">
    <rect x="675" y="270" width="130" height="76" rx="8" fill="#fefce8" stroke="#f59e0b" stroke-width="2"/>
    <text x="740" y="296" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">🤖 LLM</text>
    <text x="740" y="314" text-anchor="middle" font-size="11" fill="#92400e">Context + Query</text>
    <text x="740" y="332" text-anchor="middle" font-size="11" fill="#92400e">→ Answer</text>
  </g>

  <!-- Generated Answer -->
  <g filter="url(#shadow)">
    <rect x="675" y="370" width="130" height="50" rx="8" fill="#dcfce7" stroke="#10b981" stroke-width="2"/>
    <text x="740" y="394" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">✅ Answer</text>
    <text x="740" y="410" text-anchor="middle" font-size="11" fill="#065f46">with citations</text>
  </g>
  <line x1="740" y1="346" x2="740" y2="370" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Key decisions footer -->
  <g transform="translate(30, 468)">
    <text font-size="13" font-weight="600" fill="#374151">Key Decisions:</text>
    <text x="120" font-size="12" fill="#6b7280">Chunk size: 512 tokens</text>
    <text x="310" font-size="12" fill="#6b7280">Top-K: 5 chunks</text>
    <text x="460" font-size="12" fill="#6b7280">Embedding: sentence-transformers</text>
    <text x="710" font-size="12" fill="#6b7280">Overlap: 50 tokens</text>
  </g>
</svg>