<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" width="820" height="500" font-family="'JetBrains Mono', 'Fira Code', monospace">
  <rect width="820" height="500" fill="#1e1e2e" rx="8"/>

  <!-- Title -->
  <text x="410" y="35" text-anchor="middle" fill="#cdd6f4" font-size="16" font-weight="bold">Optimistic Locking: Thundering Herd at Scale</text>

  <!-- Left: Sequence diagram -->
  <text x="50" y="65" fill="#cdd6f4" font-size="12" font-weight="bold">50 Concurrent Requests, Same Row</text>

  <!-- Round 1 -->
  <rect x="40" y="80" width="350" height="90" rx="6" fill="#313244" stroke="#f38ba8" stroke-width="1"/>
  <text x="215" y="100" text-anchor="middle" fill="#f38ba8" font-size="11" font-weight="bold">Round 1</text>
  <text x="60" y="120" fill="#cdd6f4" font-size="9">All 50 load version 1</text>
  <text x="60" y="135" fill="#a6e3a1" font-size="9">1 succeeds → version becomes 2</text>
  <text x="60" y="150" fill="#f38ba8" font-size="9">49 throw OptimisticLockException</text>

  <!-- Round 2 -->
  <rect x="40" y="180" width="350" height="90" rx="6" fill="#313244" stroke="#f38ba8" stroke-width="1"/>
  <text x="215" y="200" text-anchor="middle" fill="#f38ba8" font-size="11" font-weight="bold">Round 2 (retry)</text>
  <text x="60" y="220" fill="#cdd6f4" font-size="9">49 retry, load version 2</text>
  <text x="60" y="235" fill="#a6e3a1" font-size="9">1 succeeds → version becomes 3</text>
  <text x="60" y="250" fill="#f38ba8" font-size="9">48 throw OptimisticLockException</text>

  <!-- Round 3 -->
  <rect x="40" y="280" width="350" height="90" rx="6" fill="#313244" stroke="#f38ba8" stroke-width="1"/>
  <text x="215" y="300" text-anchor="middle" fill="#f38ba8" font-size="11" font-weight="bold">Round 3 (retry)</text>
  <text x="60" y="320" fill="#cdd6f4" font-size="9">48 retry, load version 3</text>
  <text x="60" y="335" fill="#a6e3a1" font-size="9">1 succeeds → version becomes 4</text>
  <text x="60" y="350" fill="#f38ba8" font-size="9">47 exhaust retries, FAIL permanently</text>

  <!-- Stats -->
  <rect x="40" y="380" width="350" height="55" rx="6" fill="#313244" stroke="#f9e2af" stroke-width="1"/>
  <text x="215" y="400" text-anchor="middle" fill="#f9e2af" font-size="11" font-weight="bold">Result (3 retry limit)</text>
  <text x="60" y="420" fill="#cdd6f4" font-size="9">Total attempts: <tspan fill="#f38ba8" font-weight="bold">147</tspan> (50+49+48)</text>
  <text x="260" y="420" fill="#cdd6f4" font-size="9">Successes: <tspan fill="#a6e3a1" font-weight="bold">3</tspan> (6%)</text>

  <!-- Right: Alternatives comparison -->
  <rect x="420" y="80" width="370" height="355" rx="6" fill="#313244" stroke="#cdd6f4" stroke-width="1"/>
  <text x="605" y="105" text-anchor="middle" fill="#cdd6f4" font-size="13" font-weight="bold">Alternative Approaches</text>

  <!-- Pessimistic -->
  <rect x="440" y="120" width="330" height="80" rx="4" fill="#45475a" stroke="#89b4fa" stroke-width="1"/>
  <text x="605" y="140" text-anchor="middle" fill="#89b4fa" font-size="11" font-weight="bold">PESSIMISTIC_WRITE (FOR UPDATE)</text>
  <text x="460" y="158" fill="#cdd6f4" font-size="9">Requests queue at DB level</text>
  <text x="460" y="173" fill="#cdd6f4" font-size="9">Attempts: <tspan fill="#a6e3a1" font-weight="bold">50</tspan>  Successes: <tspan fill="#a6e3a1" font-weight="bold">50</tspan> (100%)</text>
  <text x="460" y="188" fill="#6c7086" font-size="9">Trade-off: higher per-request latency (queued)</text>

  <!-- Atomic -->
  <rect x="440" y="210" width="330" height="80" rx="4" fill="#45475a" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="605" y="230" text-anchor="middle" fill="#a6e3a1" font-size="11" font-weight="bold">Atomic UPDATE (skip entity load)</text>
  <text x="460" y="248" fill="#cdd6f4" font-size="9">SET qty = qty - 1 WHERE qty >= 1</text>
  <text x="460" y="263" fill="#cdd6f4" font-size="9">Attempts: <tspan fill="#a6e3a1" font-weight="bold">50</tspan>  Successes: <tspan fill="#a6e3a1" font-weight="bold">50</tspan> (100%)</text>
  <text x="460" y="278" fill="#a6e3a1" font-size="9">No entity loaded. No version conflict. Fastest.</text>

  <!-- Jittered backoff -->
  <rect x="440" y="300" width="330" height="80" rx="4" fill="#45475a" stroke="#f9e2af" stroke-width="1"/>
  <text x="605" y="320" text-anchor="middle" fill="#f9e2af" font-size="11" font-weight="bold">Optimistic + Jittered Backoff</text>
  <text x="460" y="338" fill="#cdd6f4" font-size="9">Retries spread across time (50-1600ms jitter)</text>
  <text x="460" y="353" fill="#cdd6f4" font-size="9">Attempts: <tspan fill="#f9e2af" font-weight="bold">~100</tspan>  Successes: <tspan fill="#f9e2af" font-weight="bold">~40</tspan> (80%)</text>
  <text x="460" y="368" fill="#6c7086" font-size="9">Better than naive retry, still wasteful at scale</text>

  <!-- Recommendation -->
  <rect x="420" y="400" width="370" height="35" rx="4" fill="#a6e3a1" opacity="0.1" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="605" y="422" text-anchor="middle" fill="#a6e3a1" font-size="11" font-weight="bold">High contention? Use atomic updates or pessimistic locks.</text>

  <!-- Footer -->
  <text x="410" y="480" text-anchor="middle" fill="#585b70" font-size="10">Chapter 9: Optimistic Locking at Scale</text>
</svg>