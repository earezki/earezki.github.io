<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" width="820" height="480" font-family="'JetBrains Mono', 'Fira Code', monospace">
  <rect width="820" height="480" fill="#1e1e2e" rx="8"/>

  <!-- Title -->
  <text x="410" y="35" text-anchor="middle" fill="#cdd6f4" font-size="16" font-weight="bold">Fetch Strategy Decision Tree</text>

  <!-- Root -->
  <rect x="280" y="55" width="260" height="40" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <text x="410" y="80" text-anchor="middle" fill="#89b4fa" font-size="12" font-weight="bold">Association Access Pattern?</text>

  <!-- Left branch: Always accessed -->
  <line x1="340" y1="95" x2="180" y2="130" stroke="#6c7086" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="220" y="120" fill="#6c7086" font-size="10">Always accessed</text>

  <rect x="60" y="130" width="240" height="40" rx="6" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="180" y="155" text-anchor="middle" fill="#a6e3a1" font-size="11" font-weight="bold">JOIN FETCH in query</text>

  <!-- Right branch: Sometimes accessed -->
  <line x1="480" y1="95" x2="640" y2="130" stroke="#6c7086" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="580" y="120" fill="#6c7086" font-size="10">Sometimes accessed</text>

  <rect x="520" y="130" width="240" height="40" rx="6" fill="#313244" stroke="#f9e2af" stroke-width="1.5"/>
  <text x="640" y="155" text-anchor="middle" fill="#f9e2af" font-size="11" font-weight="bold">How many parent entities?</text>

  <!-- Left-left: Single query result -->
  <line x1="180" y1="170" x2="180" y2="200" stroke="#6c7086" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <rect x="60" y="200" width="240" height="60" rx="6" fill="#313244" stroke="#a6e3a1" stroke-width="1"/>
  <text x="180" y="222" text-anchor="middle" fill="#cdd6f4" font-size="10">Single SQL with JOIN</text>
  <text x="180" y="238" text-anchor="middle" fill="#a6e3a1" font-size="10">1 query total</text>
  <text x="180" y="252" text-anchor="middle" fill="#6c7086" font-size="9">Watch for cartesian product</text>

  <!-- Right-left: Few -->
  <line x1="590" y1="170" x2="500" y2="200" stroke="#6c7086" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="510" y="195" fill="#6c7086" font-size="10">Few (1-10)</text>

  <rect x="380" y="200" width="240" height="50" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="1"/>
  <text x="500" y="222" text-anchor="middle" fill="#89b4fa" font-size="11" font-weight="bold">@EntityGraph</text>
  <text x="500" y="240" text-anchor="middle" fill="#cdd6f4" font-size="10">Per-use-case fetch plan</text>

  <!-- Right-right: Many -->
  <line x1="690" y1="170" x2="720" y2="200" stroke="#6c7086" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="700" y="195" fill="#6c7086" font-size="10">Many (100+)</text>

  <rect x="640" y="200" width="160" height="50" rx="6" fill="#313244" stroke="#f9e2af" stroke-width="1"/>
  <text x="720" y="222" text-anchor="middle" fill="#f9e2af" font-size="11" font-weight="bold">@BatchSize</text>
  <text x="720" y="240" text-anchor="middle" fill="#cdd6f4" font-size="10">IN-clause batching</text>

  <!-- Bottom comparison -->
  <line x1="40" y1="290" x2="780" y2="290" stroke="#45475a" stroke-width="1"/>
  <text x="410" y="315" text-anchor="middle" fill="#cdd6f4" font-size="14" font-weight="bold">Query Count Comparison (100 Orders, each with Items)</text>

  <!-- Bars -->
  <text x="50" y="350" fill="#cdd6f4" font-size="10">EAGER</text>
  <rect x="150" y="338" width="600" height="20" rx="3" fill="#f38ba8" opacity="0.8"/>
  <text x="760" y="353" fill="#f38ba8" font-size="11" font-weight="bold">101</text>

  <text x="50" y="380" fill="#cdd6f4" font-size="10">LAZY (accessed)</text>
  <rect x="150" y="368" width="600" height="20" rx="3" fill="#f38ba8" opacity="0.6"/>
  <text x="760" y="383" fill="#f38ba8" font-size="11" font-weight="bold">101</text>

  <text x="50" y="410" fill="#cdd6f4" font-size="10">@BatchSize(25)</text>
  <rect x="150" y="398" width="30" height="20" rx="3" fill="#f9e2af" opacity="0.8"/>
  <text x="188" y="413" fill="#f9e2af" font-size="11" font-weight="bold">5</text>

  <text x="50" y="440" fill="#cdd6f4" font-size="10">JOIN FETCH</text>
  <rect x="150" y="428" width="6" height="20" rx="3" fill="#a6e3a1" opacity="0.8"/>
  <text x="164" y="443" fill="#a6e3a1" font-size="11" font-weight="bold">1</text>

  <!-- Footer -->
  <text x="410" y="470" text-anchor="middle" fill="#585b70" font-size="10">Chapter 2: Fetch Strategies and the Queries You Never Asked For</text>

  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto" fill="#6c7086">
      <polygon points="0 0, 8 3, 0 6"/>
    </marker>
  </defs>
</svg>