<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 500" width="850" height="500">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#585b70"/>
    </marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="850" height="500" rx="12" fill="#1e1e2e"/>

  <!-- Title -->
  <text x="425" y="35" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#cdd6f4">Infrastructure Scaling Roadmap</text>

  <!-- Timeline axis -->
  <line x1="100" y1="80" x2="100" y2="460" stroke="#585b70" stroke-width="2"/>
  <text x="60" y="75" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#a6adc8">TIME</text>

  <!-- Phase 1: Launch -->
  <g filter="url(#shadow)">
    <circle cx="100" cy="100" r="8" fill="#a6e3a1"/>
    <rect x="130" y="75" width="680" height="70" rx="8" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
    <text x="150" y="97" font-family="sans-serif" font-size="13" font-weight="bold" fill="#a6e3a1">Phase 1: Launch (Month 1-3)</text>
    <text x="150" y="117" font-family="sans-serif" font-size="11" fill="#a6adc8">CX22 (€4.51) + Supabase Free + Cloudflare Free + Resend Free + Sentry Free + Grafana Free</text>
    <text x="150" y="135" font-family="sans-serif" font-size="11" fill="#a6adc8">Revenue: $0-$290/mo | Infra: ~$10/mo | Customers: 0-10</text>
  </g>

  <!-- Phase 2: First growth -->
  <g filter="url(#shadow)">
    <circle cx="100" cy="185" r="8" fill="#89b4fa"/>
    <rect x="130" y="160" width="680" height="70" rx="8" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
    <text x="150" y="182" font-family="sans-serif" font-size="13" font-weight="bold" fill="#89b4fa">Phase 2: First Graduation (Month 4-6)</text>
    <text x="150" y="202" font-family="sans-serif" font-size="11" fill="#f9e2af">+ Supabase Pro ($25/mo)</text>
    <text x="440" y="202" font-family="sans-serif" font-size="11" fill="#a6adc8">Trigger: DB size &gt; 400 MB</text>
    <text x="150" y="220" font-family="sans-serif" font-size="11" fill="#a6adc8">Revenue: $290-$870/mo | Infra: ~$35/mo | Customers: 10-30</text>
  </g>

  <!-- Phase 3: Scaling compute -->
  <g filter="url(#shadow)">
    <circle cx="100" cy="270" r="8" fill="#f9e2af"/>
    <rect x="130" y="245" width="680" height="70" rx="8" fill="#313244" stroke="#f9e2af" stroke-width="1.5"/>
    <text x="150" y="267" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f9e2af">Phase 3: VPS Upgrade (Month 7-12)</text>
    <text x="150" y="287" font-family="sans-serif" font-size="11" fill="#f9e2af">+ CX22 → CX32 (+€3/mo)</text>
    <text x="420" y="287" font-family="sans-serif" font-size="11" fill="#a6adc8">Trigger: CPU &gt; 70% sustained</text>
    <text x="150" y="305" font-family="sans-serif" font-size="11" fill="#a6adc8">Revenue: $870-$2,900/mo | Infra: ~$38/mo | Customers: 30-100</text>
  </g>

  <!-- Phase 4: Separate services -->
  <g filter="url(#shadow)">
    <circle cx="100" cy="355" r="8" fill="#cba6f7"/>
    <rect x="130" y="330" width="680" height="70" rx="8" fill="#313244" stroke="#cba6f7" stroke-width="1.5"/>
    <text x="150" y="352" font-family="sans-serif" font-size="13" font-weight="bold" fill="#cba6f7">Phase 4: Service Separation (Month 12-18)</text>
    <text x="150" y="372" font-family="sans-serif" font-size="11" fill="#cba6f7">+ Dedicated Redis VPS (+€3.79/mo)</text>
    <text x="480" y="372" font-family="sans-serif" font-size="11" fill="#a6adc8">Trigger: Memory contention</text>
    <text x="150" y="390" font-family="sans-serif" font-size="11" fill="#a6adc8">Revenue: $2,900-$5,800/mo | Infra: ~$42/mo | Customers: 100-200</text>
  </g>

  <!-- Phase 5: Mature -->
  <g filter="url(#shadow)">
    <circle cx="100" cy="440" r="8" fill="#f38ba8"/>
    <rect x="130" y="415" width="680" height="70" rx="8" fill="#313244" stroke="#f38ba8" stroke-width="1.5"/>
    <text x="150" y="437" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f38ba8">Phase 5: Full Stack (Month 18+)</text>
    <text x="150" y="457" font-family="sans-serif" font-size="11" fill="#f38ba8">+ Resend Pro ($20) + Grafana Pro ($29)</text>
    <text x="500" y="457" font-family="sans-serif" font-size="11" fill="#a6adc8">Trigger: Volume limits</text>
    <text x="150" y="475" font-family="sans-serif" font-size="11" fill="#a6adc8">Revenue: $5,800+/mo | Infra: ~$112/mo | Margin: 99%+ | Customers: 200-500</text>
  </g>
</svg>