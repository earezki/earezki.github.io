<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="850" height="420">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#585b70"/>
    </marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="850" height="420" rx="12" fill="#1e1e2e"/>

  <!-- Title -->
  <text x="425" y="35" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#cdd6f4">Database Schema Evolution — Marketflow</text>

  <!-- Phase 1: MVP -->
  <g filter="url(#shadow)">
    <rect x="30" y="60" width="240" height="160" rx="8" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
    <text x="150" y="85" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#a6e3a1">Phase 1: MVP</text>

    <!-- Tables -->
    <rect x="50" y="100" width="80" height="25" rx="4" fill="#1e1e2e" stroke="#89b4fa" stroke-width="1"/>
    <text x="90" y="117" text-anchor="middle" font-family="monospace" font-size="10" fill="#89b4fa">users</text>

    <rect x="150" y="100" width="100" height="25" rx="4" fill="#1e1e2e" stroke="#89b4fa" stroke-width="1"/>
    <text x="200" y="117" text-anchor="middle" font-family="monospace" font-size="10" fill="#89b4fa">organizers</text>

    <rect x="50" y="140" width="80" height="25" rx="4" fill="#1e1e2e" stroke="#f9e2af" stroke-width="1"/>
    <text x="90" y="157" text-anchor="middle" font-family="monospace" font-size="10" fill="#f9e2af">markets</text>

    <rect x="150" y="140" width="100" height="25" rx="4" fill="#1e1e2e" stroke="#f9e2af" stroke-width="1"/>
    <text x="200" y="157" text-anchor="middle" font-family="monospace" font-size="10" fill="#f9e2af">vendors</text>

    <text x="150" y="190" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#a6adc8">4 tables</text>
    <text x="150" y="207" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#a6e3a1">CH3-CH4</text>
  </g>

  <!-- Arrow -->
  <line x1="270" y1="140" x2="310" y2="140" stroke="#585b70" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Phase 2: Billing -->
  <g filter="url(#shadow)">
    <rect x="315" y="60" width="240" height="160" rx="8" fill="#313244" stroke="#cba6f7" stroke-width="1.5"/>
    <text x="435" y="85" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#cba6f7">Phase 2: Billing + Auth</text>

    <rect x="335" y="100" width="95" height="25" rx="4" fill="#1e1e2e" stroke="#cba6f7" stroke-width="1"/>
    <text x="382" y="117" text-anchor="middle" font-family="monospace" font-size="10" fill="#cba6f7">subscriptions</text>

    <rect x="440" y="100" width="95" height="25" rx="4" fill="#1e1e2e" stroke="#cba6f7" stroke-width="1"/>
    <text x="487" y="117" text-anchor="middle" font-family="monospace" font-size="10" fill="#cba6f7">applications</text>

    <rect x="335" y="140" width="95" height="25" rx="4" fill="#1e1e2e" stroke="#f38ba8" stroke-width="1"/>
    <text x="382" y="157" text-anchor="middle" font-family="monospace" font-size="10" fill="#f38ba8">documents</text>

    <rect x="440" y="140" width="95" height="25" rx="4" fill="#1e1e2e" stroke="#f38ba8" stroke-width="1"/>
    <text x="487" y="157" text-anchor="middle" font-family="monospace" font-size="10" fill="#f38ba8">payments</text>

    <text x="435" y="190" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#a6adc8">+4 tables (8 total)</text>
    <text x="435" y="207" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#cba6f7">CH5-CH8</text>
  </g>

  <!-- Arrow -->
  <line x1="555" y1="140" x2="595" y2="140" stroke="#585b70" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Phase 3: Analytics -->
  <g filter="url(#shadow)">
    <rect x="600" y="60" width="220" height="160" rx="8" fill="#313244" stroke="#f9e2af" stroke-width="1.5"/>
    <text x="710" y="85" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f9e2af">Phase 3: Analytics</text>

    <rect x="620" y="100" width="80" height="25" rx="4" fill="#1e1e2e" stroke="#f9e2af" stroke-width="1"/>
    <text x="660" y="117" text-anchor="middle" font-family="monospace" font-size="9" fill="#f9e2af">events</text>

    <rect x="715" y="100" width="85" height="25" rx="4" fill="#1e1e2e" stroke="#f9e2af" stroke-width="1"/>
    <text x="757" y="117" text-anchor="middle" font-family="monospace" font-size="9" fill="#f9e2af">stall_assign</text>

    <rect x="620" y="140" width="80" height="25" rx="4" fill="#1e1e2e" stroke="#89b4fa" stroke-width="1"/>
    <text x="660" y="157" text-anchor="middle" font-family="monospace" font-size="9" fill="#89b4fa">market_days</text>

    <text x="710" y="190" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#a6adc8">+3 tables (11 total)</text>
    <text x="710" y="207" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#f9e2af">CH10-CH13</text>
  </g>

  <!-- Index strategy -->
  <g filter="url(#shadow)">
    <rect x="30" y="260" width="790" height="140" rx="8" fill="#313244" stroke="#585b70" stroke-width="1"/>
    <text x="425" y="285" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#cdd6f4">Critical Indexes</text>

    <!-- Index table -->
    <text x="60" y="310" font-family="monospace" font-size="10" fill="#89b4fa">ix_applications_market_status</text>
    <text x="350" y="310" font-family="sans-serif" font-size="10" fill="#a6adc8">(market_id, status, created_at)</text>
    <text x="640" y="310" font-family="sans-serif" font-size="10" fill="#a6e3a1">Pending apps per market</text>

    <text x="60" y="330" font-family="monospace" font-size="10" fill="#89b4fa">ix_vendors_market_status</text>
    <text x="350" y="330" font-family="sans-serif" font-size="10" fill="#a6adc8">(market_id, status)</text>
    <text x="640" y="330" font-family="sans-serif" font-size="10" fill="#a6e3a1">Vendor count per market</text>

    <text x="60" y="350" font-family="monospace" font-size="10" fill="#89b4fa">ix_markets_organizer</text>
    <text x="350" y="350" font-family="sans-serif" font-size="10" fill="#a6adc8">(organizer_id, status)</text>
    <text x="640" y="350" font-family="sans-serif" font-size="10" fill="#a6e3a1">Organizer's markets</text>

    <text x="60" y="370" font-family="monospace" font-size="10" fill="#89b4fa">ix_documents_application</text>
    <text x="350" y="370" font-family="sans-serif" font-size="10" fill="#a6adc8">(application_id, market_id)</text>
    <text x="640" y="370" font-family="sans-serif" font-size="10" fill="#a6e3a1">Docs for an application</text>

    <text x="60" y="390" font-family="monospace" font-size="10" fill="#f9e2af">ix_applications_pending</text>
    <text x="350" y="390" font-family="sans-serif" font-size="10" fill="#a6adc8">WHERE status = 'pending'</text>
    <text x="640" y="390" font-family="sans-serif" font-size="10" fill="#f9e2af">Partial index (5x smaller)</text>
  </g>
</svg>