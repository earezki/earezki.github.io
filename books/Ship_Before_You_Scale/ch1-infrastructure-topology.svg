<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="900" height="550">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="550" rx="12" fill="#1e1e2e"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#cdd6f4">The Bootstrapper's Stack — Infrastructure Topology</text>

  <!-- User/Browser -->
  <g filter="url(#shadow)">
    <rect x="370" y="65" width="160" height="45" rx="8" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
    <text x="450" y="93" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#89b4fa">Browser / Client</text>
  </g>

  <!-- Arrow down to Cloudflare -->
  <line x1="450" y1="110" x2="450" y2="140" stroke="#585b70" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Cloudflare -->
  <g filter="url(#shadow)">
    <rect x="330" y="140" width="240" height="50" rx="8" fill="#313244" stroke="#f9e2af" stroke-width="1.5"/>
    <text x="450" y="162" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f9e2af">Cloudflare</text>
    <text x="450" y="180" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a6adc8">CDN · DNS · DDoS Protection · Tunnel</text>
  </g>

  <!-- Arrow down splits to frontend and API -->
  <line x1="380" y1="190" x2="200" y2="240" stroke="#585b70" stroke-width="1.5"/>
  <line x1="520" y1="190" x2="700" y2="240" stroke="#585b70" stroke-width="1.5"/>

  <!-- Static Frontend (GitHub Pages) -->
  <g filter="url(#shadow)">
    <rect x="80" y="240" width="240" height="50" rx="8" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
    <text x="200" y="262" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#a6e3a1">React Frontend</text>
    <text x="200" y="280" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a6adc8">Cloudflare Pages · $0/month</text>
  </g>

  <!-- Hetzner VPS Box -->
  <g filter="url(#shadow)">
    <rect x="540" y="225" width="320" height="280" rx="10" fill="#1e1e2e" stroke="#89b4fa" stroke-width="2" stroke-dasharray="6,3"/>
    <text x="700" y="248" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#89b4fa">Hetzner CX22 — €4.51/month</text>
  </g>

  <!-- FastAPI -->
  <g filter="url(#shadow)">
    <rect x="575" y="265" width="250" height="45" rx="6" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
    <text x="700" y="285" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#a6e3a1">FastAPI Backend</text>
    <text x="700" y="301" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a6adc8">Docker · 2 Workers</text>
  </g>

  <!-- Redis -->
  <g filter="url(#shadow)">
    <rect x="575" y="325" width="115" height="40" rx="6" fill="#313244" stroke="#f38ba8" stroke-width="1.5"/>
    <text x="632" y="350" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f38ba8">Redis</text>
  </g>

  <!-- Coolify -->
  <g filter="url(#shadow)">
    <rect x="710" y="325" width="115" height="40" rx="6" fill="#313244" stroke="#cba6f7" stroke-width="1.5"/>
    <text x="767" y="350" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#cba6f7">Coolify</text>
  </g>

  <!-- Traefik -->
  <g filter="url(#shadow)">
    <rect x="575" y="380" width="250" height="40" rx="6" fill="#313244" stroke="#f9e2af" stroke-width="1.5"/>
    <text x="700" y="405" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#f9e2af">Traefik Reverse Proxy</text>
  </g>

  <!-- External Services -->
  <text x="200" y="340" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#cdd6f4">External Services (Free Tiers)</text>

  <!-- Supabase -->
  <g filter="url(#shadow)">
    <rect x="50" y="360" width="130" height="40" rx="6" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
    <text x="115" y="384" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a6e3a1">Supabase</text>
  </g>

  <!-- Stripe -->
  <g filter="url(#shadow)">
    <rect x="195" y="360" width="100" height="40" rx="6" fill="#313244" stroke="#cba6f7" stroke-width="1.5"/>
    <text x="245" y="384" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#cba6f7">Stripe</text>
  </g>

  <!-- R2 -->
  <g filter="url(#shadow)">
    <rect x="310" y="360" width="100" height="40" rx="6" fill="#313244" stroke="#f9e2af" stroke-width="1.5"/>
    <text x="360" y="384" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#f9e2af">R2 Storage</text>
  </g>

  <!-- Resend -->
  <g filter="url(#shadow)">
    <rect x="50" y="415" width="130" height="40" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
    <text x="115" y="439" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#89b4fa">Resend</text>
  </g>

  <!-- Sentry -->
  <g filter="url(#shadow)">
    <rect x="195" y="415" width="100" height="40" rx="6" fill="#313244" stroke="#f38ba8" stroke-width="1.5"/>
    <text x="245" y="439" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#f38ba8">Sentry</text>
  </g>

  <!-- Grafana -->
  <g filter="url(#shadow)">
    <rect x="310" y="415" width="100" height="40" rx="6" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
    <text x="360" y="439" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a6e3a1">Grafana</text>
  </g>

  <!-- Connection lines from API to services -->
  <line x1="575" y1="290" x2="420" y2="375" stroke="#585b70" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="575" y1="290" x2="300" y2="375" stroke="#585b70" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="575" y1="290" x2="180" y2="375" stroke="#585b70" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Total Cost -->
  <g>
    <rect x="300" y="490" width="300" height="40" rx="8" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
    <text x="450" y="515" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#a6e3a1">Total: ~$10/month</text>
  </g>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#585b70"/>
    </marker>
  </defs>
</svg>