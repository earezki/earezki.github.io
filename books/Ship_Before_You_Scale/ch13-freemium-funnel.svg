<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 450" width="850" height="450">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#585b70"/>
    </marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="850" height="450" rx="12" fill="#1e1e2e"/>

  <!-- Title -->
  <text x="425" y="35" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#cdd6f4">Freemium Conversion Funnel</text>

  <!-- Funnel stages -->
  <!-- Stage 1: Sign up -->
  <g filter="url(#shadow)">
    <polygon points="100,70 750,70 720,120 130,120" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
    <text x="425" y="95" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#89b4fa">Sign Up (Free Tier)</text>
    <text x="425" y="112" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#a6adc8">100% of users</text>
  </g>

  <!-- Stage 2: Active use -->
  <g filter="url(#shadow)">
    <polygon points="150,135 700,135 675,185 175,185" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
    <text x="425" y="158" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#a6e3a1">Active Usage (&gt;1 market created)</text>
    <text x="425" y="177" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#a6adc8">~60% of signups</text>
  </g>

  <!-- Stage 3: Approach limit -->
  <g filter="url(#shadow)">
    <polygon points="200,200 650,200 630,250 220,250" fill="#313244" stroke="#f9e2af" stroke-width="1.5"/>
    <text x="425" y="222" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f9e2af">Hit 80% Vendor Limit (16/20)</text>
    <text x="425" y="242" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#a6adc8">~20% of active users</text>
  </g>

  <!-- Stage 4: Hit limit -->
  <g filter="url(#shadow)">
    <polygon points="250,265 600,265 580,315 270,315" fill="#313244" stroke="#f38ba8" stroke-width="1.5"/>
    <text x="425" y="287" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f38ba8">Hit Vendor Limit (20/20)</text>
    <text x="425" y="307" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#a6adc8">~15% of active users</text>
  </g>

  <!-- Stage 5: Upgrade -->
  <g filter="url(#shadow)">
    <polygon points="310,330 540,330 520,380 330,380" fill="#313244" stroke="#cba6f7" stroke-width="2"/>
    <text x="425" y="353" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#cba6f7">Upgrade to Growth</text>
    <text x="425" y="373" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#a6adc8">~8% of active users</text>
  </g>

  <!-- Revenue callout -->
  <g filter="url(#shadow)">
    <rect x="300" y="395" width="250" height="40" rx="8" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
    <text x="425" y="420" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#a6e3a1">$29/month per conversion</text>
  </g>

  <!-- Right side: upgrade triggers -->
  <g filter="url(#shadow)">
    <rect x="620" y="135" width="200" height="200" rx="8" fill="#313244" stroke="#585b70" stroke-width="1"/>
    <text x="720" y="160" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#cdd6f4">Upgrade Triggers</text>

    <text x="640" y="185" font-family="sans-serif" font-size="10" fill="#f9e2af">80%</text>
    <text x="665" y="185" font-family="sans-serif" font-size="10" fill="#a6adc8">Banner notification</text>

    <text x="640" y="210" font-family="sans-serif" font-size="10" fill="#f9e2af">90%</text>
    <text x="665" y="210" font-family="sans-serif" font-size="10" fill="#a6adc8">Persistent warning</text>

    <text x="640" y="235" font-family="sans-serif" font-size="10" fill="#f38ba8">100%</text>
    <text x="665" y="235" font-family="sans-serif" font-size="10" fill="#a6adc8">Action blocked</text>

    <line x1="640" y1="250" x2="800" y2="250" stroke="#585b70" stroke-width="0.5"/>

    <text x="720" y="275" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#cba6f7">Key Principle</text>
    <text x="720" y="295" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#a6adc8">Inform before restrict.</text>
    <text x="720" y="312" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#a6adc8">Restrict action,</text>
    <text x="720" y="327" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#a6adc8">not account.</text>
  </g>

  <!-- Left side: tracking -->
  <g filter="url(#shadow)">
    <rect x="30" y="135" width="145" height="130" rx="8" fill="#313244" stroke="#585b70" stroke-width="1"/>
    <text x="102" y="158" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#cdd6f4">Tracked Events</text>
    <text x="45" y="180" font-family="sans-serif" font-size="9" fill="#a6e3a1">limit_reached</text>
    <text x="45" y="198" font-family="sans-serif" font-size="9" fill="#f9e2af">upgrade_initiated</text>
    <text x="45" y="216" font-family="sans-serif" font-size="9" fill="#cba6f7">upgrade_completed</text>
    <text x="45" y="234" font-family="sans-serif" font-size="9" fill="#f38ba8">subscription_cancelled</text>
    <text x="45" y="255" font-family="sans-serif" font-size="9" fill="#89b4fa">Stored in PostgreSQL</text>
  </g>
</svg>