<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 400" width="850" height="400">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#585b70"/>
    </marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="850" height="400" rx="12" fill="#1e1e2e"/>

  <!-- Title -->
  <text x="425" y="35" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#cdd6f4">Cloudflare Request Path</text>

  <!-- User -->
  <g filter="url(#shadow)">
    <rect x="30" y="80" width="110" height="50" rx="8" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
    <text x="85" y="110" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#89b4fa">User</text>
  </g>

  <!-- Arrow to Cloudflare DNS -->
  <line x1="140" y1="105" x2="185" y2="105" stroke="#585b70" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="162" y="95" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#a6adc8">DNS</text>

  <!-- Cloudflare Edge -->
  <g filter="url(#shadow)">
    <rect x="190" y="60" width="200" height="90" rx="8" fill="#313244" stroke="#f9e2af" stroke-width="2"/>
    <text x="290" y="85" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f9e2af">Cloudflare Edge</text>
    <text x="290" y="105" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#a6adc8">DDoS protection</text>
    <text x="290" y="120" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#a6adc8">SSL termination</text>
    <text x="290" y="135" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#a6adc8">WAF rules</text>
  </g>

  <!-- Split: static vs API -->
  <line x1="390" y1="90" x2="470" y2="90" stroke="#a6e3a1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="430" y="82" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#a6e3a1">Static</text>

  <line x1="390" y1="125" x2="470" y2="215" stroke="#cba6f7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="445" y="175" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#cba6f7">API</text>

  <!-- Static path: CDN cache -->
  <g filter="url(#shadow)">
    <rect x="475" y="60" width="170" height="60" rx="8" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
    <text x="560" y="85" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#a6e3a1">CDN Cache</text>
    <text x="560" y="105" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#a6adc8">HTML, JS, CSS, images</text>
  </g>

  <!-- Cache hit -->
  <line x1="645" y1="78" x2="720" y2="78" stroke="#a6e3a1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="682" y="70" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#a6e3a1">HIT</text>

  <g filter="url(#shadow)">
    <rect x="725" y="55" width="100" height="50" rx="6" fill="#313244" stroke="#a6e3a1" stroke-width="1"/>
    <text x="775" y="78" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#a6e3a1">Response</text>
    <text x="775" y="93" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#a6adc8">&lt;5ms</text>
  </g>

  <!-- Cache miss -->
  <line x1="560" y1="120" x2="560" y2="155" stroke="#f38ba8" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="582" y="142" font-family="sans-serif" font-size="8" fill="#f38ba8">MISS</text>

  <g filter="url(#shadow)">
    <rect x="475" y="160" width="170" height="40" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="1"/>
    <text x="560" y="185" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#89b4fa">Cloudflare Pages</text>
  </g>

  <!-- API path: Tunnel -->
  <g filter="url(#shadow)">
    <rect x="475" y="215" width="170" height="55" rx="8" fill="#313244" stroke="#cba6f7" stroke-width="1.5"/>
    <text x="560" y="237" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#cba6f7">Cloudflare Tunnel</text>
    <text x="560" y="257" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#a6adc8">No open ports needed</text>
  </g>

  <!-- Arrow to VPS -->
  <line x1="645" y1="242" x2="690" y2="242" stroke="#585b70" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- VPS -->
  <g filter="url(#shadow)">
    <rect x="695" y="210" width="130" height="65" rx="8" fill="#313244" stroke="#f38ba8" stroke-width="1.5"/>
    <text x="760" y="235" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f38ba8">Hetzner VPS</text>
    <text x="760" y="253" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#a6adc8">Traefik</text>
    <text x="760" y="268" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#a6adc8">FastAPI</text>
  </g>

  <!-- Benefits box -->
  <g filter="url(#shadow)">
    <rect x="60" y="300" width="730" height="80" rx="8" fill="#313244" stroke="#585b70" stroke-width="1"/>
    <text x="425" y="325" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#cdd6f4">Cloudflare Benefits (All Free Tier)</text>

    <rect x="85" y="340" width="140" height="28" rx="4" fill="#1e1e2e" stroke="#a6e3a1" stroke-width="1"/>
    <text x="155" y="359" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#a6e3a1">DDoS Protection</text>

    <rect x="245" y="340" width="120" height="28" rx="4" fill="#1e1e2e" stroke="#89b4fa" stroke-width="1"/>
    <text x="305" y="359" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#89b4fa">Free SSL/TLS</text>

    <rect x="385" y="340" width="120" height="28" rx="4" fill="#1e1e2e" stroke="#f9e2af" stroke-width="1"/>
    <text x="445" y="359" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#f9e2af">Global CDN</text>

    <rect x="525" y="340" width="120" height="28" rx="4" fill="#1e1e2e" stroke="#cba6f7" stroke-width="1"/>
    <text x="585" y="359" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#cba6f7">Tunnel (no ports)</text>

    <rect x="665" y="340" width="100" height="28" rx="4" fill="#1e1e2e" stroke="#f38ba8" stroke-width="1"/>
    <text x="715" y="359" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#f38ba8">WAF Rules</text>
  </g>
</svg>