<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520">
  <rect width="900" height="520" rx="12" fill="#1e1e2e"/>
  <text x="450" y="32" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#cdd6f4">Token Propagation Patterns: Forward vs Exchange vs Credentials</text>

  <!-- Pattern 1: JWT Forwarding (BAD) -->
  <rect x="30" y="55" width="840" height="105" rx="8" fill="#181825" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="60" y="75" font-family="monospace" font-size="11" font-weight="bold" fill="#f38ba8">Pattern 1: JWT Forwarding (FRAGILE)</text>
  <rect x="50" y="88" width="80" height="30" rx="4" fill="#1e1e2e" stroke="#89b4fa" stroke-width="1"/>
  <text x="90" y="108" text-anchor="middle" font-family="monospace" font-size="9" fill="#89b4fa">User</text>

  <line x1="130" y1="103" x2="200" y2="103" stroke="#585b70" stroke-width="1.5" marker-end="url(#a1)"/>
  <rect x="152" y="85" width="35" height="16" rx="2" fill="#1e1e2e" stroke="#f38ba8" stroke-width="0.5"/>
  <text x="170" y="95" text-anchor="middle" font-family="monospace" font-size="7" fill="#f38ba8">JWT</text>
  <text x="170" y="82" text-anchor="middle" font-family="monospace" font-size="7" fill="#6c7086">aud=gw</text>

  <rect x="200" y="88" width="110" height="30" rx="4" fill="#1e1e2e" stroke="#fab387" stroke-width="1"/>
  <text x="255" y="108" text-anchor="middle" font-family="monospace" font-size="9" fill="#fab387">Gateway</text>

  <line x1="310" y1="103" x2="410" y2="93" stroke="#f38ba8" stroke-width="1.5" marker-end="url(#a-r)"/>
  <rect x="335" y="80" width="55" height="16" rx="2" fill="#1e1e2e" stroke="#f38ba8" stroke-width="1"/>
  <text x="362" y="91" text-anchor="middle" font-family="monospace" font-size="7" fill="#f38ba8">SAME JWT</text>

  <rect x="410" y="78" width="110" height="30" rx="4" fill="#1e1e2e" stroke="#585b70" stroke-width="1"/>
  <text x="465" y="98" text-anchor="middle" font-family="monospace" font-size="9" fill="#cdd6f4">Core API</text>

  <line x1="520" y1="93" x2="620" y2="93" stroke="#f38ba8" stroke-width="1.5" marker-end="url(#a-r)"/>
  <rect x="545" y="80" width="55" height="16" rx="2" fill="#1e1e2e" stroke="#f38ba8" stroke-width="1"/>
  <text x="572" y="91" text-anchor="middle" font-family="monospace" font-size="7" fill="#f38ba8">SAME JWT</text>

  <rect x="620" y="78" width="110" height="30" rx="4" fill="#1e1e2e" stroke="#585b70" stroke-width="1"/>
  <text x="675" y="98" text-anchor="middle" font-family="monospace" font-size="9" fill="#cdd6f4">Billing</text>

  <text x="760" y="93" font-family="monospace" font-size="8" fill="#f38ba8">aud mismatch!</text>
  <text x="760" y="107" font-family="monospace" font-size="8" fill="#f38ba8">scope leakage!</text>
  <text x="760" y="121" font-family="monospace" font-size="8" fill="#f38ba8">replay risk!</text>

  <!-- X mark -->
  <text x="830" y="105" text-anchor="middle" font-family="monospace" font-size="20" fill="#f38ba8">✗</text>

  <!-- Pattern 2: Token Exchange (CORRECT) -->
  <rect x="30" y="175" width="840" height="140" rx="8" fill="#181825" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="60" y="195" font-family="monospace" font-size="11" font-weight="bold" fill="#a6e3a1">Pattern 2: Token Exchange (CORRECT)</text>

  <rect x="50" y="210" width="80" height="30" rx="4" fill="#1e1e2e" stroke="#89b4fa" stroke-width="1"/>
  <text x="90" y="230" text-anchor="middle" font-family="monospace" font-size="9" fill="#89b4fa">User</text>

  <line x1="130" y1="225" x2="200" y2="225" stroke="#585b70" stroke-width="1.5" marker-end="url(#a1)"/>
  <rect x="148" y="208" width="40" height="16" rx="2" fill="#1e1e2e" stroke="#89b4fa" stroke-width="0.5"/>
  <text x="168" y="219" text-anchor="middle" font-family="monospace" font-size="7" fill="#89b4fa">aud=gw</text>

  <rect x="200" y="210" width="110" height="30" rx="4" fill="#1e1e2e" stroke="#fab387" stroke-width="1.5"/>
  <text x="255" y="230" text-anchor="middle" font-family="monospace" font-size="9" fill="#fab387">Gateway</text>

  <!-- Exchange arrow 1 -->
  <line x1="255" y1="240" x2="255" y2="260" stroke="#fab387" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="280" y="256" font-family="monospace" font-size="7" fill="#fab387">exchange</text>

  <line x1="310" y1="270" x2="410" y2="270" stroke="#a6e3a1" stroke-width="1.5" marker-end="url(#a-g)"/>
  <rect x="330" y="253" width="60" height="16" rx="2" fill="#1e1e2e" stroke="#a6e3a1" stroke-width="1"/>
  <text x="360" y="264" text-anchor="middle" font-family="monospace" font-size="7" fill="#a6e3a1">aud=api</text>

  <rect x="410" y="256" width="130" height="30" rx="4" fill="#1e1e2e" stroke="#a6e3a1" stroke-width="1"/>
  <text x="475" y="276" text-anchor="middle" font-family="monospace" font-size="9" fill="#a6e3a1">Core API</text>
  <text x="475" y="280" text-anchor="middle" font-family="monospace" font-size="7" fill="#6c7086">scope=tenant:read</text>

  <!-- Exchange arrow 2 -->
  <line x1="475" y1="286" x2="475" y2="296" stroke="#fab387" stroke-width="1" stroke-dasharray="3,2"/>

  <line x1="540" y1="300" x2="640" y2="300" stroke="#a6e3a1" stroke-width="1.5" marker-end="url(#a-g)"/>
  <rect x="558" y="283" width="60" height="16" rx="2" fill="#1e1e2e" stroke="#a6e3a1" stroke-width="1"/>
  <text x="588" y="294" text-anchor="middle" font-family="monospace" font-size="7" fill="#a6e3a1">aud=bill</text>

  <rect x="640" y="286" width="130" height="30" rx="4" fill="#1e1e2e" stroke="#a6e3a1" stroke-width="1"/>
  <text x="705" y="306" text-anchor="middle" font-family="monospace" font-size="9" fill="#a6e3a1">Billing</text>
  <text x="705" y="310" text-anchor="middle" font-family="monospace" font-size="7" fill="#6c7086">scope=billing:read</text>

  <!-- Check mark -->
  <text x="830" y="280" text-anchor="middle" font-family="monospace" font-size="20" fill="#a6e3a1">✓</text>

  <!-- Pattern 3: Client Credentials -->
  <rect x="30" y="330" width="840" height="105" rx="8" fill="#181825" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="60" y="350" font-family="monospace" font-size="11" font-weight="bold" fill="#89b4fa">Pattern 3: Client Credentials (Service as itself)</text>

  <rect x="50" y="365" width="130" height="30" rx="4" fill="#1e1e2e" stroke="#89b4fa" stroke-width="1"/>
  <text x="115" y="385" text-anchor="middle" font-family="monospace" font-size="9" fill="#89b4fa">Core API</text>

  <line x1="180" y1="380" x2="290" y2="380" stroke="#585b70" stroke-width="1.5" marker-end="url(#a1)"/>
  <text x="235" y="370" text-anchor="middle" font-family="monospace" font-size="7" fill="#6c7086">client_credentials</text>

  <rect x="290" y="365" width="140" height="30" rx="4" fill="#1e1e2e" stroke="#fab387" stroke-width="1.5"/>
  <text x="360" y="385" text-anchor="middle" font-family="monospace" font-size="9" fill="#fab387">Auth Server</text>

  <line x1="430" y1="380" x2="510" y2="380" stroke="#a6e3a1" stroke-width="1.5" marker-end="url(#a-g)"/>
  <rect x="442" y="363" width="55" height="16" rx="2" fill="#1e1e2e" stroke="#a6e3a1" stroke-width="0.5"/>
  <text x="470" y="374" text-anchor="middle" font-family="monospace" font-size="7" fill="#a6e3a1">JWT</text>

  <rect x="510" y="365" width="160" height="30" rx="4" fill="#1e1e2e" stroke="#585b70" stroke-width="1"/>
  <text x="590" y="385" text-anchor="middle" font-family="monospace" font-size="9" fill="#cdd6f4">Notification Svc</text>

  <text x="700" y="385" font-family="monospace" font-size="8" fill="#89b4fa">sub=core-api</text>
  <text x="700" y="399" font-family="monospace" font-size="8" fill="#89b4fa">scope=notify:send</text>
  <text x="700" y="413" font-family="monospace" font-size="8" fill="#6c7086">No user context</text>

  <!-- Decision rule -->
  <rect x="30" y="450" width="840" height="55" rx="6" fill="#1e1e2e" stroke="#585b70" stroke-width="1"/>
  <text x="60" y="473" font-family="monospace" font-size="10" font-weight="bold" fill="#cdd6f4">Decision Rule:</text>
  <text x="60" y="491" font-family="monospace" font-size="9" fill="#a6e3a1">User action → downstream calls: Token Exchange (user identity preserved, scope reduced)</text>
  <text x="60" y="503" font-family="monospace" font-size="9" fill="#89b4fa">Service acting on its own behalf: Client Credentials (no user context, service identity only)</text>

  <defs>
    <marker id="a1" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5" fill="none" stroke="#585b70" stroke-width="1"/>
    </marker>
    <marker id="a-r" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5" fill="none" stroke="#f38ba8" stroke-width="1"/>
    </marker>
    <marker id="a-g" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5" fill="none" stroke="#a6e3a1" stroke-width="1"/>
    </marker>
  </defs>
</svg>