<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430">
  <rect width="900" height="430" rx="12" fill="#1e1e2e"/>
  <text x="450" y="32" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#cdd6f4">Microservice Auth Boundaries</text>

  <!-- API Gateway -->
  <rect x="310" y="55" width="280" height="65" rx="8" fill="#181825" stroke="#89b4fa" stroke-width="2"/>
  <text x="450" y="80" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#89b4fa">API Gateway / BFF</text>
  <text x="450" y="98" text-anchor="middle" font-family="monospace" font-size="9" fill="#6c7086">User-facing authentication</text>
  <text x="450" y="112" text-anchor="middle" font-family="monospace" font-size="8" fill="#a6e3a1">JWT / Session / Opaque per path</text>

  <!-- Trust boundary lines -->
  <line x1="310" y1="135" x2="120" y2="190" stroke="#fab387" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="450" y1="120" x2="450" y2="190" stroke="#fab387" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="590" y1="135" x2="760" y2="190" stroke="#fab387" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Trust boundary label -->
  <rect x="160" y="142" width="130" height="20" rx="3" fill="#1e1e2e" stroke="#fab387" stroke-width="1"/>
  <text x="225" y="156" text-anchor="middle" font-family="monospace" font-size="8" fill="#fab387">mTLS + Token Exchange</text>

  <!-- Core API -->
  <rect x="30" y="190" width="210" height="75" rx="6" fill="#181825" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="135" y="215" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#a6e3a1">Core API</text>
  <text x="135" y="235" text-anchor="middle" font-family="monospace" font-size="9" fill="#6c7086">tenant data, projects</text>
  <text x="135" y="250" text-anchor="middle" font-family="monospace" font-size="8" fill="#cdd6f4">aud=core-api</text>
  <text x="135" y="262" text-anchor="middle" font-family="monospace" font-size="8" fill="#cdd6f4">scope=tenant:*</text>

  <!-- Billing -->
  <rect x="345" y="190" width="210" height="75" rx="6" fill="#181825" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="450" y="215" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#a6e3a1">Billing Service</text>
  <text x="450" y="235" text-anchor="middle" font-family="monospace" font-size="9" fill="#6c7086">subscriptions, payments</text>
  <text x="450" y="250" text-anchor="middle" font-family="monospace" font-size="8" fill="#cdd6f4">aud=billing</text>
  <text x="450" y="262" text-anchor="middle" font-family="monospace" font-size="8" fill="#cdd6f4">scope=billing:*</text>

  <!-- Notification -->
  <rect x="660" y="190" width="210" height="75" rx="6" fill="#181825" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="765" y="215" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#a6e3a1">Notification Svc</text>
  <text x="765" y="235" text-anchor="middle" font-family="monospace" font-size="9" fill="#6c7086">email, push, SMS</text>
  <text x="765" y="250" text-anchor="middle" font-family="monospace" font-size="8" fill="#cdd6f4">aud=notify</text>
  <text x="765" y="262" text-anchor="middle" font-family="monospace" font-size="8" fill="#cdd6f4">scope=notify:send</text>

  <!-- Arrow from Core API down -->
  <line x1="135" y1="265" x2="135" y2="310" stroke="#585b70" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Analytics -->
  <rect x="30" y="310" width="210" height="65" rx="6" fill="#181825" stroke="#585b70" stroke-width="1.5"/>
  <text x="135" y="335" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#cdd6f4">Analytics Service</text>
  <text x="135" y="352" text-anchor="middle" font-family="monospace" font-size="9" fill="#6c7086">read-only access</text>
  <text x="135" y="366" text-anchor="middle" font-family="monospace" font-size="8" fill="#cdd6f4">aud=analytics, scope=read</text>

  <!-- Requirements box -->
  <rect x="310" y="295" width="560" height="115" rx="6" fill="#181825" stroke="#585b70" stroke-width="1"/>
  <text x="590" y="318" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#cdd6f4">Each Boundary Requires</text>
  <text x="340" y="340" font-family="monospace" font-size="9" fill="#a6e3a1">1.</text>
  <text x="360" y="340" font-family="monospace" font-size="9" fill="#cdd6f4">Caller identity verification (mTLS or client credentials)</text>
  <text x="340" y="358" font-family="monospace" font-size="9" fill="#a6e3a1">2.</text>
  <text x="360" y="358" font-family="monospace" font-size="9" fill="#cdd6f4">User context propagation (token exchange, not forwarding)</text>
  <text x="340" y="376" font-family="monospace" font-size="9" fill="#a6e3a1">3.</text>
  <text x="360" y="376" font-family="monospace" font-size="9" fill="#cdd6f4">Scope limitation (analytics gets read, not write)</text>
  <text x="340" y="394" font-family="monospace" font-size="9" fill="#a6e3a1">4.</text>
  <text x="360" y="394" font-family="monospace" font-size="9" fill="#cdd6f4">Audience restriction (token valid at exactly one service)</text>

  <defs>
    <marker id="arr" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5" fill="none" stroke="#585b70" stroke-width="1"/>
    </marker>
  </defs>
</svg>