<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="900" height="550">
  <!-- Background -->
  <rect width="900" height="550" rx="12" fill="#1e1e2e"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#cdd6f4">mTLS Handshake and SPIFFE Identity</text>

  <!-- Client Service -->
  <rect x="50" y="80" width="160" height="60" rx="8" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="130" y="105" text-anchor="middle" font-family="monospace" font-size="11" fill="#89b4fa">Checkout Service</text>
  <text x="130" y="125" text-anchor="middle" font-family="monospace" font-size="8" fill="#bac2de">spiffe://prod/checkout</text>

  <!-- Server Service -->
  <rect x="680" y="80" width="160" height="60" rx="8" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="760" y="105" text-anchor="middle" font-family="monospace" font-size="11" fill="#a6e3a1">Payment Service</text>
  <text x="760" y="125" text-anchor="middle" font-family="monospace" font-size="8" fill="#bac2de">spiffe://prod/payment</text>

  <!-- Handshake steps -->
  <!-- Step 1 -->
  <line x1="210" y1="170" x2="680" y2="170" stroke="#cdd6f4" stroke-width="1.5" marker-end="url(#arr9)"/>
  <text x="445" y="163" text-anchor="middle" font-family="monospace" font-size="9" fill="#cdd6f4">1. ClientHello + supported cipher suites</text>

  <!-- Step 2 -->
  <line x1="680" y1="200" x2="210" y2="200" stroke="#a6e3a1" stroke-width="1.5" marker-end="url(#arr9-green)"/>
  <text x="445" y="193" text-anchor="middle" font-family="monospace" font-size="9" fill="#a6e3a1">2. ServerHello + server certificate (SVID)</text>

  <!-- Step 3 -->
  <line x1="680" y1="230" x2="210" y2="230" stroke="#a6e3a1" stroke-width="1.5" marker-end="url(#arr9-green)"/>
  <text x="445" y="223" text-anchor="middle" font-family="monospace" font-size="9" fill="#a6e3a1">3. CertificateRequest (client cert required)</text>

  <!-- Step 4 -->
  <line x1="210" y1="260" x2="680" y2="260" stroke="#89b4fa" stroke-width="1.5" marker-end="url(#arr9)"/>
  <text x="445" y="253" text-anchor="middle" font-family="monospace" font-size="9" fill="#89b4fa">4. Client certificate (SVID) + verify</text>

  <!-- Step 5 -->
  <rect x="300" y="280" width="290" height="30" rx="6" fill="#1e3a1e" stroke="#a6e3a1" stroke-width="1"/>
  <text x="445" y="300" text-anchor="middle" font-family="monospace" font-size="10" fill="#a6e3a1">5. Mutual verification complete</text>

  <!-- SPIRE Architecture -->
  <rect x="50" y="340" width="380" height="180" rx="8" fill="#181825" stroke="#f9e2af" stroke-width="1.5"/>
  <text x="240" y="365" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#f9e2af">SPIRE Architecture</text>

  <!-- SPIRE Server -->
  <rect x="70" y="385" width="140" height="45" rx="6" fill="#313244" stroke="#f9e2af" stroke-width="1"/>
  <text x="140" y="405" text-anchor="middle" font-family="monospace" font-size="9" fill="#f9e2af">SPIRE Server</text>
  <text x="140" y="420" text-anchor="middle" font-family="monospace" font-size="8" fill="#bac2de">CA + Registration</text>

  <!-- SPIRE Agent -->
  <rect x="250" y="385" width="140" height="45" rx="6" fill="#313244" stroke="#f9e2af" stroke-width="1"/>
  <text x="320" y="405" text-anchor="middle" font-family="monospace" font-size="9" fill="#f9e2af">SPIRE Agent</text>
  <text x="320" y="420" text-anchor="middle" font-family="monospace" font-size="8" fill="#bac2de">Node attestation</text>

  <!-- Workload -->
  <rect x="150" y="455" width="140" height="45" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="1"/>
  <text x="220" y="475" text-anchor="middle" font-family="monospace" font-size="9" fill="#89b4fa">Workload</text>
  <text x="220" y="490" text-anchor="middle" font-family="monospace" font-size="8" fill="#bac2de">Gets SVID via API</text>

  <!-- Arrows in SPIRE -->
  <line x1="210" y1="385" x2="250" y2="400" stroke="#f9e2af" stroke-width="1" marker-end="url(#arr9-yellow)"/>
  <line x1="320" y1="430" x2="250" y2="455" stroke="#f9e2af" stroke-width="1" marker-end="url(#arr9-yellow)"/>

  <!-- Comparison -->
  <rect x="470" y="340" width="400" height="180" rx="8" fill="#181825" stroke="#cdd6f4" stroke-width="1"/>
  <text x="670" y="365" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#cdd6f4">API Key vs mTLS</text>

  <!-- API Key row -->
  <rect x="490" y="385" width="360" height="50" rx="4" fill="#3a1e1e"/>
  <text x="510" y="405" font-family="monospace" font-size="9" fill="#f38ba8">API Key:</text>
  <text x="510" y="420" font-family="monospace" font-size="8" fill="#cdd6f4">  Shared secret, manual rotation, no per-instance ID</text>
  <text x="510" y="432" font-family="monospace" font-size="8" fill="#f38ba8">  One leak compromises all instances</text>

  <!-- mTLS row -->
  <rect x="490" y="445" width="360" height="55" rx="4" fill="#1e3a1e"/>
  <text x="510" y="465" font-family="monospace" font-size="9" fill="#a6e3a1">mTLS + SPIFFE:</text>
  <text x="510" y="480" font-family="monospace" font-size="8" fill="#cdd6f4">  Per-instance identity, auto rotation, attestation</text>
  <text x="510" y="492" font-family="monospace" font-size="8" fill="#a6e3a1">  Compromised cert revoked without affecting others</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arr9" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#cdd6f4"/>
    </marker>
    <marker id="arr9-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a6e3a1"/>
    </marker>
    <marker id="arr9-yellow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f9e2af"/>
    </marker>
  </defs>
</svg>
