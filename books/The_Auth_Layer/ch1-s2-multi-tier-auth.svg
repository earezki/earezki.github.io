<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620">
  <rect width="900" height="620" rx="12" fill="#1e1e2e"/>
  <text x="450" y="32" text-anchor="middle" font-family="monospace" font-size="15" font-weight="bold" fill="#cdd6f4">Multi-Tier Auth Boundary Map</text>

  <!-- Internet zone -->
  <rect x="40" y="50" width="820" height="90" rx="8" fill="#181825" stroke="#f38ba8" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="450" y="72" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#f38ba8">INTERNET (Untrusted)</text>

  <!-- Clients -->
  <rect x="80" y="85" width="130" height="42" rx="6" fill="#1e1e2e" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="145" y="110" text-anchor="middle" font-family="monospace" font-size="11" fill="#89b4fa">Browser</text>

  <rect x="385" y="85" width="130" height="42" rx="6" fill="#1e1e2e" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="450" y="110" text-anchor="middle" font-family="monospace" font-size="11" fill="#89b4fa">Mobile App</text>

  <rect x="690" y="85" width="130" height="42" rx="6" fill="#1e1e2e" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="755" y="110" text-anchor="middle" font-family="monospace" font-size="11" fill="#89b4fa">Third-Party</text>

  <!-- Auth mechanism labels -->
  <text x="145" y="165" text-anchor="middle" font-family="monospace" font-size="10" fill="#a6e3a1">Session Cookie</text>
  <text x="145" y="178" text-anchor="middle" font-family="monospace" font-size="9" fill="#6c7086">(HttpOnly, Secure)</text>

  <text x="450" y="165" text-anchor="middle" font-family="monospace" font-size="10" fill="#a6e3a1">Bearer JWT</text>
  <text x="450" y="178" text-anchor="middle" font-family="monospace" font-size="9" fill="#6c7086">(short-lived)</text>

  <text x="755" y="165" text-anchor="middle" font-family="monospace" font-size="10" fill="#a6e3a1">Bearer JWT</text>
  <text x="755" y="178" text-anchor="middle" font-family="monospace" font-size="9" fill="#6c7086">(scoped, opaque)</text>

  <!-- Arrows down -->
  <line x1="145" y1="127" x2="145" y2="200" stroke="#585b70" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="127" x2="450" y2="200" stroke="#585b70" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="755" y1="127" x2="755" y2="200" stroke="#585b70" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Core API / BFF zone -->
  <rect x="40" y="205" width="820" height="130" rx="8" fill="#181825" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="450" y="228" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#89b4fa">CORE API / BFF</text>
  <text x="450" y="248" text-anchor="middle" font-family="monospace" font-size="11" fill="#6c7086">SecurityFilterChain per path</text>

  <!-- Filter chain boxes -->
  <rect x="65" y="262" width="230" height="55" rx="5" fill="#1e1e2e" stroke="#a6e3a1" stroke-width="1"/>
  <text x="180" y="282" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#a6e3a1">/app/** → session</text>
  <text x="180" y="298" text-anchor="middle" font-family="monospace" font-size="9" fill="#6c7086">CSRF + SameSite cookies</text>

  <rect x="335" y="262" width="230" height="55" rx="5" fill="#1e1e2e" stroke="#a6e3a1" stroke-width="1"/>
  <text x="450" y="282" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#a6e3a1">/api/** → JWT</text>
  <text x="450" y="298" text-anchor="middle" font-family="monospace" font-size="9" fill="#6c7086">Bearer token validation</text>

  <rect x="605" y="262" width="230" height="55" rx="5" fill="#1e1e2e" stroke="#a6e3a1" stroke-width="1"/>
  <text x="720" y="282" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#a6e3a1">/partner/** → opaque</text>
  <text x="720" y="298" text-anchor="middle" font-family="monospace" font-size="9" fill="#6c7086">Introspection endpoint</text>

  <!-- Internal boundary label -->
  <text x="450" y="365" text-anchor="middle" font-family="monospace" font-size="10" fill="#fab387">mTLS + SPIFFE SVID  ·  Token Exchange (RFC 8693)</text>

  <!-- Arrow down to internal -->
  <line x1="450" y1="335" x2="450" y2="390" stroke="#fab387" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-orange)"/>

  <!-- Internal services zone -->
  <rect x="40" y="395" width="820" height="120" rx="8" fill="#181825" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="450" y="418" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#a6e3a1">INTERNAL SERVICES</text>

  <rect x="80" y="432" width="200" height="65" rx="5" fill="#1e1e2e" stroke="#585b70" stroke-width="1"/>
  <text x="180" y="458" text-anchor="middle" font-family="monospace" font-size="10" fill="#cdd6f4">payment-service</text>
  <text x="180" y="474" text-anchor="middle" font-family="monospace" font-size="9" fill="#6c7086">spiffe://prod/payment</text>

  <rect x="350" y="432" width="200" height="65" rx="5" fill="#1e1e2e" stroke="#585b70" stroke-width="1"/>
  <text x="450" y="458" text-anchor="middle" font-family="monospace" font-size="10" fill="#cdd6f4">notification-service</text>
  <text x="450" y="474" text-anchor="middle" font-family="monospace" font-size="9" fill="#6c7086">spiffe://prod/notify</text>

  <rect x="620" y="432" width="200" height="65" rx="5" fill="#1e1e2e" stroke="#585b70" stroke-width="1"/>
  <text x="720" y="458" text-anchor="middle" font-family="monospace" font-size="10" fill="#cdd6f4">analytics-service</text>
  <text x="720" y="474" text-anchor="middle" font-family="monospace" font-size="9" fill="#6c7086">spiffe://prod/analytics</text>

  <!-- Legend -->
  <rect x="40" y="535" width="820" height="70" rx="6" fill="#181825" stroke="#585b70" stroke-width="0.5"/>
  <text x="60" y="555" font-family="monospace" font-size="10" fill="#6c7086">Legend:</text>
  <line x1="60" y1="572" x2="90" y2="572" stroke="#f38ba8" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="100" y="576" font-family="monospace" font-size="9" fill="#cdd6f4">Untrusted boundary</text>
  <line x1="280" y1="572" x2="310" y2="572" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="320" y="576" font-family="monospace" font-size="9" fill="#cdd6f4">Perimeter auth</text>
  <line x1="480" y1="572" x2="510" y2="572" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="520" y="576" font-family="monospace" font-size="9" fill="#cdd6f4">Internal auth</text>
  <line x1="670" y1="572" x2="700" y2="572" stroke="#fab387" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="710" y="576" font-family="monospace" font-size="9" fill="#cdd6f4">mTLS boundary</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#585b70" stroke-width="1"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#fab387" stroke-width="1"/>
    </marker>
  </defs>
</svg>