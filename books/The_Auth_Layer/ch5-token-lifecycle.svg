<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <!-- Background -->
  <rect width="900" height="500" rx="12" fill="#1e1e2e"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#cdd6f4">Token Lifecycle State Machine</text>

  <!-- States -->
  <!-- Issued -->
  <rect x="50" y="180" width="110" height="50" rx="25" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <text x="105" y="210" text-anchor="middle" font-family="monospace" font-size="11" fill="#89b4fa">ISSUED</text>

  <!-- Active -->
  <rect x="220" y="180" width="110" height="50" rx="25" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
  <text x="275" y="210" text-anchor="middle" font-family="monospace" font-size="11" fill="#a6e3a1">ACTIVE</text>

  <!-- Refreshed -->
  <rect x="395" y="100" width="120" height="50" rx="25" fill="#313244" stroke="#f9e2af" stroke-width="2"/>
  <text x="455" y="130" text-anchor="middle" font-family="monospace" font-size="11" fill="#f9e2af">REFRESHED</text>

  <!-- Rotated -->
  <rect x="395" y="260" width="120" height="50" rx="25" fill="#313244" stroke="#cba6f7" stroke-width="2"/>
  <text x="455" y="290" text-anchor="middle" font-family="monospace" font-size="11" fill="#cba6f7">ROTATED</text>

  <!-- Revoked -->
  <rect x="600" y="180" width="110" height="50" rx="25" fill="#313244" stroke="#f38ba8" stroke-width="2"/>
  <text x="655" y="210" text-anchor="middle" font-family="monospace" font-size="11" fill="#f38ba8">REVOKED</text>

  <!-- Expired -->
  <rect x="770" y="180" width="110" height="50" rx="25" fill="#313244" stroke="#6c7086" stroke-width="2"/>
  <text x="825" y="210" text-anchor="middle" font-family="monospace" font-size="11" fill="#6c7086">EXPIRED</text>

  <!-- Transitions -->
  <!-- Issued → Active -->
  <line x1="160" y1="205" x2="218" y2="205" stroke="#cdd6f4" stroke-width="1.5" marker-end="url(#arr5)"/>
  <text x="189" y="197" text-anchor="middle" font-family="monospace" font-size="8" fill="#bac2de">use</text>

  <!-- Active → Refreshed -->
  <line x1="310" y1="180" x2="395" y2="140" stroke="#f9e2af" stroke-width="1.5" marker-end="url(#arr5-yellow)"/>
  <text x="340" y="148" text-anchor="middle" font-family="monospace" font-size="8" fill="#f9e2af">refresh</text>

  <!-- Refreshed → Rotated -->
  <line x1="455" y1="150" x2="455" y2="258" stroke="#cba6f7" stroke-width="1.5" marker-end="url(#arr5-purple)"/>
  <text x="485" y="210" text-anchor="middle" font-family="monospace" font-size="8" fill="#cba6f7">rotate</text>

  <!-- Active → Revoked -->
  <line x1="330" y1="205" x2="598" y2="205" stroke="#f38ba8" stroke-width="1.5" marker-end="url(#arr5-red)"/>
  <text x="465" y="220" text-anchor="middle" font-family="monospace" font-size="8" fill="#f38ba8">revoke</text>

  <!-- Active → Expired -->
  <path d="M 330 215 C 500 300 700 300 770 215" fill="none" stroke="#6c7086" stroke-width="1.5" marker-end="url(#arr5-gray)"/>
  <text x="550" y="310" text-anchor="middle" font-family="monospace" font-size="8" fill="#6c7086">TTL expires</text>

  <!-- Rotated → Revoked (replay detection) -->
  <line x1="515" y1="280" x2="600" y2="220" stroke="#f38ba8" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr5-red)"/>
  <text x="575" y="260" text-anchor="middle" font-family="monospace" font-size="8" fill="#f38ba8">replay!</text>

  <!-- Race condition annotation -->
  <rect x="50" y="370" width="380" height="110" rx="8" fill="#3a1e1e" stroke="#f38ba8" stroke-width="1"/>
  <text x="240" y="395" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#f38ba8">THE RACE CONDITION</text>
  <text x="70" y="418" font-family="monospace" font-size="9" fill="#cdd6f4">Request A: refresh(token_v1) → issues token_v2</text>
  <text x="70" y="436" font-family="monospace" font-size="9" fill="#cdd6f4">Request B: refresh(token_v1) → ???</text>
  <text x="70" y="460" font-family="monospace" font-size="9" fill="#f38ba8">If B succeeds: dangling token, rotation broken</text>
  <text x="70" y="475" font-family="monospace" font-size="9" fill="#a6e3a1">If B triggers replay: invalidate entire grant</text>

  <!-- Replay detection annotation -->
  <rect x="470" y="370" width="380" height="110" rx="8" fill="#1e3a1e" stroke="#a6e3a1" stroke-width="1"/>
  <text x="660" y="395" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#a6e3a1">REPLAY DETECTION</text>
  <text x="490" y="418" font-family="monospace" font-size="9" fill="#cdd6f4">1. Store grant chain in Redis</text>
  <text x="490" y="436" font-family="monospace" font-size="9" fill="#cdd6f4">2. On refresh: mark old token ROTATED</text>
  <text x="490" y="454" font-family="monospace" font-size="9" fill="#cdd6f4">3. If ROTATED token presented again:</text>
  <text x="490" y="472" font-family="monospace" font-size="9" fill="#a6e3a1">   → Revoke ALL tokens in grant chain</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arr5" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#cdd6f4"/>
    </marker>
    <marker id="arr5-yellow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f9e2af"/>
    </marker>
    <marker id="arr5-purple" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#cba6f7"/>
    </marker>
    <marker id="arr5-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f38ba8"/>
    </marker>
    <marker id="arr5-gray" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6c7086"/>
    </marker>
  </defs>
</svg>
