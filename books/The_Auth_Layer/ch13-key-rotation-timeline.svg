<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <!-- Background -->
  <rect width="900" height="480" rx="12" fill="#1e1e2e"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#cdd6f4">Key Rotation Timeline: Graceful vs Emergency</text>

  <!-- Timeline axis -->
  <line x1="50" y1="250" x2="850" y2="250" stroke="#45475a" stroke-width="2"/>

  <!-- Time markers -->
  <line x1="100" y1="245" x2="100" y2="255" stroke="#cdd6f4" stroke-width="1.5"/>
  <text x="100" y="270" text-anchor="middle" font-family="monospace" font-size="8" fill="#bac2de">T0</text>
  <text x="100" y="283" text-anchor="middle" font-family="monospace" font-size="7" fill="#6c7086">Generate</text>

  <line x1="250" y1="245" x2="250" y2="255" stroke="#cdd6f4" stroke-width="1.5"/>
  <text x="250" y="270" text-anchor="middle" font-family="monospace" font-size="8" fill="#bac2de">T1</text>
  <text x="250" y="283" text-anchor="middle" font-family="monospace" font-size="7" fill="#6c7086">Publish</text>

  <line x1="400" y1="245" x2="400" y2="255" stroke="#cdd6f4" stroke-width="1.5"/>
  <text x="400" y="270" text-anchor="middle" font-family="monospace" font-size="8" fill="#bac2de">T2</text>
  <text x="400" y="283" text-anchor="middle" font-family="monospace" font-size="7" fill="#6c7086">Start signing</text>

  <line x1="600" y1="245" x2="600" y2="255" stroke="#cdd6f4" stroke-width="1.5"/>
  <text x="600" y="270" text-anchor="middle" font-family="monospace" font-size="8" fill="#bac2de">T3</text>
  <text x="600" y="283" text-anchor="middle" font-family="monospace" font-size="7" fill="#6c7086">Cache expires</text>

  <line x1="750" y1="245" x2="750" y2="255" stroke="#cdd6f4" stroke-width="1.5"/>
  <text x="750" y="270" text-anchor="middle" font-family="monospace" font-size="8" fill="#bac2de">T4</text>
  <text x="750" y="283" text-anchor="middle" font-family="monospace" font-size="7" fill="#6c7086">Remove old</text>

  <!-- Graceful rotation (top) -->
  <text x="450" y="65" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#a6e3a1">GRACEFUL ROTATION</text>

  <!-- Old key bar -->
  <rect x="50" y="90" width="700" height="25" rx="4" fill="#313244" stroke="#89b4fa" stroke-width="1"/>
  <text x="400" y="107" text-anchor="middle" font-family="monospace" font-size="9" fill="#89b4fa">Old Key (kid: key-001) - in JWKS, signing until T2</text>

  <!-- New key bar -->
  <rect x="250" y="125" width="600" height="25" rx="4" fill="#313244" stroke="#a6e3a1" stroke-width="1"/>
  <text x="550" y="142" text-anchor="middle" font-family="monospace" font-size="9" fill="#a6e3a1">New Key (kid: key-002) - in JWKS from T1, signing from T2</text>

  <!-- Overlap zone -->
  <rect x="250" y="160" width="500" height="20" rx="4" fill="#1e3a1e" opacity="0.5"/>
  <text x="500" y="175" text-anchor="middle" font-family="monospace" font-size="8" fill="#a6e3a1">OVERLAP: Both keys in JWKS, both validate</text>

  <!-- Signing transition -->
  <rect x="400" y="190" width="50" height="20" rx="4" fill="#f9e2af" opacity="0.6"/>
  <text x="425" y="204" text-anchor="middle" font-family="monospace" font-size="7" fill="#f9e2af">switch</text>

  <!-- Safe zone markers -->
  <text x="500" y="220" text-anchor="middle" font-family="monospace" font-size="9" fill="#a6e3a1">Zero token rejections during rotation</text>

  <!-- Emergency rotation (bottom) -->
  <text x="450" y="320" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#f38ba8">EMERGENCY ROTATION (Key Compromised)</text>

  <!-- Emergency timeline -->
  <line x1="50" y1="380" x2="850" y2="380" stroke="#45475a" stroke-width="2"/>

  <!-- Compromise point -->
  <line x1="200" y1="365" x2="200" y2="395" stroke="#f38ba8" stroke-width="2"/>
  <text x="200" y="410" text-anchor="middle" font-family="monospace" font-size="8" fill="#f38ba8">COMPROMISE</text>
  <text x="200" y="423" text-anchor="middle" font-family="monospace" font-size="8" fill="#f38ba8">DETECTED</text>

  <!-- Actions -->
  <rect x="250" y="340" width="180" height="30" rx="4" fill="#3a1e1e" stroke="#f38ba8" stroke-width="1"/>
  <text x="340" y="360" text-anchor="middle" font-family="monospace" font-size="8" fill="#f38ba8">Remove compromised key</text>

  <rect x="450" y="340" width="180" height="30" rx="4" fill="#313244" stroke="#f9e2af" stroke-width="1"/>
  <text x="540" y="360" text-anchor="middle" font-family="monospace" font-size="8" fill="#f9e2af">Generate + publish new</text>

  <rect x="650" y="340" width="180" height="30" rx="4" fill="#1e3a1e" stroke="#a6e3a1" stroke-width="1"/>
  <text x="740" y="360" text-anchor="middle" font-family="monospace" font-size="8" fill="#a6e3a1">Force JWKS refresh</text>

  <!-- Rejection zone -->
  <rect x="250" y="440" width="400" height="25" rx="4" fill="#3a1e1e" stroke="#f38ba8" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="450" y="457" text-anchor="middle" font-family="monospace" font-size="8" fill="#f38ba8">TOKEN REJECTION WINDOW: cached keys invalid until refresh</text>

  <!-- Note -->
  <text x="450" y="477" text-anchor="middle" font-family="monospace" font-size="8" fill="#bac2de">Acceptable cost: brief auth failures vs continued compromise</text>
</svg>
