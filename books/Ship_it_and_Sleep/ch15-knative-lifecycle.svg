<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" fill="#1e1e2e" rx="12"/>
  <text x="400" y="35" fill="#cdd6f4" font-family="monospace" font-size="18" text-anchor="middle" font-weight="bold">Knative Scale-to-Zero Lifecycle</text>

  <!-- Timeline -->
  <line x1="60" y1="200" x2="740" y2="200" stroke="#45475a" stroke-width="2"/>
  <text x="400" y="220" fill="#a6adc8" font-family="monospace" font-size="10" text-anchor="middle">time →</text>

  <!-- Phase 1: Running -->
  <rect x="60" y="100" width="150" height="80" fill="#313244" stroke="#a6e3a1" stroke-width="2" rx="8"/>
  <text x="135" y="130" fill="#a6e3a1" font-family="monospace" font-size="11" text-anchor="middle">Pods Running</text>
  <text x="135" y="150" fill="#a6adc8" font-family="monospace" font-size="10" text-anchor="middle">Serving traffic</text>
  <text x="135" y="168" fill="#a6adc8" font-family="monospace" font-size="10" text-anchor="middle">replicas: 3</text>

  <!-- Phase 2: Idle -->
  <rect x="230" y="100" width="120" height="80" fill="#313244" stroke="#f9e2af" stroke-width="2" rx="8"/>
  <text x="290" y="130" fill="#f9e2af" font-family="monospace" font-size="11" text-anchor="middle">Grace Period</text>
  <text x="290" y="150" fill="#a6adc8" font-family="monospace" font-size="10" text-anchor="middle">No traffic</text>
  <text x="290" y="168" fill="#a6adc8" font-family="monospace" font-size="10" text-anchor="middle">30s countdown</text>

  <!-- Phase 3: Zero -->
  <rect x="370" y="100" width="120" height="80" fill="#313244" stroke="#f38ba8" stroke-width="2" rx="8"/>
  <text x="430" y="130" fill="#f38ba8" font-family="monospace" font-size="11" text-anchor="middle">Scale to Zero</text>
  <text x="430" y="150" fill="#a6adc8" font-family="monospace" font-size="10" text-anchor="middle">Pods terminated</text>
  <text x="430" y="168" fill="#a6adc8" font-family="monospace" font-size="10" text-anchor="middle">replicas: 0</text>

  <!-- Phase 4: Request arrives -->
  <rect x="510" y="100" width="120" height="80" fill="#313244" stroke="#89b4fa" stroke-width="2" rx="8"/>
  <text x="570" y="125" fill="#89b4fa" font-family="monospace" font-size="11" text-anchor="middle">Cold Start</text>
  <text x="570" y="145" fill="#a6adc8" font-family="monospace" font-size="10" text-anchor="middle">Request → Activator</text>
  <text x="570" y="160" fill="#a6adc8" font-family="monospace" font-size="10" text-anchor="middle">→ Scale up</text>
  <text x="570" y="175" fill="#a6adc8" font-family="monospace" font-size="10" text-anchor="middle">→ Forward</text>

  <!-- Phase 5: Running again -->
  <rect x="650" y="100" width="100" height="80" fill="#313244" stroke="#a6e3a1" stroke-width="2" rx="8"/>
  <text x="700" y="130" fill="#a6e3a1" font-family="monospace" font-size="11" text-anchor="middle">Running</text>
  <text x="700" y="150" fill="#a6adc8" font-family="monospace" font-size="10" text-anchor="middle">Serving</text>
  <text x="700" y="168" fill="#a6adc8" font-family="monospace" font-size="10" text-anchor="middle">replicas: 1+</text>

  <!-- Arrows between phases -->
  <line x1="210" y1="140" x2="228" y2="140" stroke="#a6adc8" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="350" y1="140" x2="368" y2="140" stroke="#a6adc8" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="490" y1="140" x2="508" y2="140" stroke="#a6adc8" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="630" y1="140" x2="648" y2="140" stroke="#a6adc8" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Cold start budget -->
  <rect x="150" y="260" width="500" height="110" fill="#313244" stroke="#89b4fa" stroke-width="1" rx="8"/>
  <text x="400" y="285" fill="#89b4fa" font-family="monospace" font-size="12" text-anchor="middle" font-weight="bold">Cold Start Budget Breakdown</text>

  <rect x="180" y="300" width="100" height="30" fill="#89b4fa" rx="4"/>
  <text x="230" y="320" fill="#1e1e2e" font-family="monospace" font-size="9" text-anchor="middle">Image Pull</text>

  <rect x="290" y="300" width="60" height="30" fill="#a6e3a1" rx="4"/>
  <text x="320" y="320" fill="#1e1e2e" font-family="monospace" font-size="9" text-anchor="middle">Init</text>

  <rect x="360" y="300" width="140" height="30" fill="#f9e2af" rx="4"/>
  <text x="430" y="320" fill="#1e1e2e" font-family="monospace" font-size="9" text-anchor="middle">App Startup</text>

  <rect x="510" y="300" width="80" height="30" fill="#f38ba8" rx="4"/>
  <text x="550" y="320" fill="#1e1e2e" font-family="monospace" font-size="9" text-anchor="middle">Ready</text>

  <text x="400" y="358" fill="#a6adc8" font-family="monospace" font-size="10" text-anchor="middle">Go: ~2s total | Java: ~15s total | Java+GraalVM: ~2s total</text>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a6adc8"/></marker>
  </defs>
</svg>