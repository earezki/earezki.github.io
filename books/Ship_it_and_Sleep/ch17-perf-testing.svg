<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380">
  <rect width="800" height="380" fill="#1e1e2e" rx="12"/>
  <text x="400" y="35" fill="#cdd6f4" font-family="monospace" font-size="18" text-anchor="middle" font-weight="bold">Performance Test Levels</text>

  <!-- Three columns -->
  <!-- Smoke -->
  <rect x="40" y="60" width="220" height="290" fill="#313244" stroke="#a6e3a1" stroke-width="2" rx="8"/>
  <text x="150" y="90" fill="#a6e3a1" font-family="monospace" font-size="14" text-anchor="middle" font-weight="bold">Smoke</text>
  <text x="150" y="115" fill="#a6adc8" font-family="monospace" font-size="10" text-anchor="middle">Every PR</text>
  <line x1="70" y1="130" x2="230" y2="130" stroke="#45475a" stroke-width="1"/>
  <text x="70" y="155" fill="#a6adc8" font-family="monospace" font-size="10">Duration: 30s</text>
  <text x="70" y="175" fill="#a6adc8" font-family="monospace" font-size="10">Users: 10</text>
  <text x="70" y="195" fill="#a6adc8" font-family="monospace" font-size="10">Tags: browse</text>
  <text x="70" y="225" fill="#a6e3a1" font-family="monospace" font-size="10">Purpose:</text>
  <text x="70" y="245" fill="#a6adc8" font-family="monospace" font-size="10">Catch obvious</text>
  <text x="70" y="260" fill="#a6adc8" font-family="monospace" font-size="10">regressions</text>
  <text x="70" y="290" fill="#a6e3a1" font-family="monospace" font-size="10">Gate: ✓ Blocks PR</text>

  <!-- Load -->
  <rect x="290" y="60" width="220" height="290" fill="#313244" stroke="#f9e2af" stroke-width="2" rx="8"/>
  <text x="400" y="90" fill="#f9e2af" font-family="monospace" font-size="14" text-anchor="middle" font-weight="bold">Load</text>
  <text x="400" y="115" fill="#a6adc8" font-family="monospace" font-size="10" text-anchor="middle">Merge to main</text>
  <line x1="320" y1="130" x2="480" y2="130" stroke="#45475a" stroke-width="1"/>
  <text x="320" y="155" fill="#a6adc8" font-family="monospace" font-size="10">Duration: 5min</text>
  <text x="320" y="175" fill="#a6adc8" font-family="monospace" font-size="10">Users: 100</text>
  <text x="320" y="195" fill="#a6adc8" font-family="monospace" font-size="10">Tags: all</text>
  <text x="320" y="225" fill="#f9e2af" font-family="monospace" font-size="10">Purpose:</text>
  <text x="320" y="245" fill="#a6adc8" font-family="monospace" font-size="10">Validate perf</text>
  <text x="320" y="260" fill="#a6adc8" font-family="monospace" font-size="10">budgets</text>
  <text x="320" y="290" fill="#f9e2af" font-family="monospace" font-size="10">Gate: ✓ Blocks deploy</text>

  <!-- Stress -->
  <rect x="540" y="60" width="220" height="290" fill="#313244" stroke="#f38ba8" stroke-width="2" rx="8"/>
  <text x="650" y="90" fill="#f38ba8" font-family="monospace" font-size="14" text-anchor="middle" font-weight="bold">Stress</text>
  <text x="650" y="115" fill="#a6adc8" font-family="monospace" font-size="10" text-anchor="middle">Pre-release</text>
  <line x1="570" y1="130" x2="730" y2="130" stroke="#45475a" stroke-width="1"/>
  <text x="570" y="155" fill="#a6adc8" font-family="monospace" font-size="10">Duration: 30min</text>
  <text x="570" y="175" fill="#a6adc8" font-family="monospace" font-size="10">Users: 500+</text>
  <text x="570" y="195" fill="#a6adc8" font-family="monospace" font-size="10">Tags: all + spike</text>
  <text x="570" y="225" fill="#f38ba8" font-family="monospace" font-size="10">Purpose:</text>
  <text x="570" y="245" fill="#a6adc8" font-family="monospace" font-size="10">Find breaking</text>
  <text x="570" y="260" fill="#a6adc8" font-family="monospace" font-size="10">points</text>
  <text x="570" y="290" fill="#f38ba8" font-family="monospace" font-size="10">Gate: Advisory</text>
</svg>