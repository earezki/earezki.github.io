<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" fill="#1e1e2e" rx="12"/>
  <text x="400" y="35" fill="#cdd6f4" font-family="monospace" font-size="18" text-anchor="middle" font-weight="bold">Multi-Repo Pipeline Architecture</text>

  <!-- Service repos -->
  <rect x="30" y="60" width="200" height="250" fill="#313244" stroke="#89b4fa" stroke-width="1" rx="8"/>
  <text x="130" y="85" fill="#89b4fa" font-family="monospace" font-size="12" text-anchor="middle" font-weight="bold">Service Repos</text>

  <rect x="50" y="100" width="160" height="30" fill="#1e1e2e" stroke="#89b4fa" stroke-width="1" rx="4"/>
  <text x="130" y="120" fill="#89b4fa" font-family="monospace" font-size="10" text-anchor="middle">catalog-service</text>

  <rect x="50" y="140" width="160" height="30" fill="#1e1e2e" stroke="#89b4fa" stroke-width="1" rx="4"/>
  <text x="130" y="160" fill="#89b4fa" font-family="monospace" font-size="10" text-anchor="middle">inventory-service</text>

  <rect x="50" y="180" width="160" height="30" fill="#1e1e2e" stroke="#89b4fa" stroke-width="1" rx="4"/>
  <text x="130" y="200" fill="#89b4fa" font-family="monospace" font-size="10" text-anchor="middle">checkout-service</text>

  <rect x="50" y="220" width="160" height="30" fill="#1e1e2e" stroke="#89b4fa" stroke-width="1" rx="4"/>
  <text x="130" y="240" fill="#89b4fa" font-family="monospace" font-size="10" text-anchor="middle">payments-service</text>

  <rect x="50" y="260" width="160" height="30" fill="#1e1e2e" stroke="#89b4fa" stroke-width="1" rx="4"/>
  <text x="130" y="280" fill="#89b4fa" font-family="monospace" font-size="10" text-anchor="middle">frontend-shell</text>

  <!-- Arrows to registry -->
  <line x1="230" y1="190" x2="300" y2="190" stroke="#a6e3a1" stroke-width="2" marker-end="url(#mr-arr)"/>
  <text x="265" y="180" fill="#a6adc8" font-family="monospace" font-size="9" text-anchor="middle">image:sha</text>

  <!-- Container Registry -->
  <rect x="300" y="150" width="140" height="80" fill="#313244" stroke="#a6e3a1" stroke-width="2" rx="8"/>
  <text x="370" y="185" fill="#a6e3a1" font-family="monospace" font-size="11" text-anchor="middle">Container</text>
  <text x="370" y="200" fill="#a6e3a1" font-family="monospace" font-size="11" text-anchor="middle">Registry</text>

  <!-- Arrow to infra repo -->
  <line x1="230" y1="280" x2="530" y2="340" stroke="#f9e2af" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#mr-arr-y)"/>
  <text x="380" y="325" fill="#f9e2af" font-family="monospace" font-size="9" text-anchor="middle">repository_dispatch</text>

  <!-- Infra repo -->
  <rect x="500" y="60" width="270" height="310" fill="#313244" stroke="#f9e2af" stroke-width="2" rx="8"/>
  <text x="635" y="85" fill="#f9e2af" font-family="monospace" font-size="12" text-anchor="middle" font-weight="bold">ecommerce-infra</text>

  <rect x="520" y="100" width="110" height="25" fill="#1e1e2e" stroke="#f9e2af" stroke-width="1" rx="4"/>
  <text x="575" y="117" fill="#f9e2af" font-family="monospace" font-size="9" text-anchor="middle">apps/catalog/</text>

  <rect x="520" y="130" width="110" height="25" fill="#1e1e2e" stroke="#f9e2af" stroke-width="1" rx="4"/>
  <text x="575" y="147" fill="#f9e2af" font-family="monospace" font-size="9" text-anchor="middle">apps/checkout/</text>

  <rect x="520" y="160" width="110" height="25" fill="#1e1e2e" stroke="#f9e2af" stroke-width="1" rx="4"/>
  <text x="575" y="177" fill="#f9e2af" font-family="monospace" font-size="9" text-anchor="middle">apps/payments/</text>

  <rect x="650" y="100" width="100" height="85" fill="#1e1e2e" stroke="#89b4fa" stroke-width="1" rx="4"/>
  <text x="700" y="125" fill="#89b4fa" font-family="monospace" font-size="9" text-anchor="middle">platform/</text>
  <text x="700" y="140" fill="#a6adc8" font-family="monospace" font-size="8" text-anchor="middle">argocd/</text>
  <text x="700" y="155" fill="#a6adc8" font-family="monospace" font-size="8" text-anchor="middle">monitoring/</text>
  <text x="700" y="170" fill="#a6adc8" font-family="monospace" font-size="8" text-anchor="middle">ingress/</text>

  <!-- Arrow to ArgoCD -->
  <rect x="560" y="220" width="150" height="50" fill="#1e1e2e" stroke="#a6e3a1" stroke-width="2" rx="8"/>
  <text x="635" y="245" fill="#a6e3a1" font-family="monospace" font-size="11" text-anchor="middle">ArgoCD</text>
  <text x="635" y="260" fill="#a6adc8" font-family="monospace" font-size="9" text-anchor="middle">sync to cluster</text>

  <!-- K8s cluster -->
  <rect x="560" y="290" width="150" height="50" fill="#1e1e2e" stroke="#f38ba8" stroke-width="2" rx="8"/>
  <text x="635" y="320" fill="#f38ba8" font-family="monospace" font-size="11" text-anchor="middle">K8s Cluster</text>

  <line x1="635" y1="270" x2="635" y2="288" stroke="#a6e3a1" stroke-width="2" marker-end="url(#mr-arr)"/>

  <defs>
    <marker id="mr-arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a6e3a1"/></marker>
    <marker id="mr-arr-y" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f9e2af"/></marker>
  </defs>
</svg>