<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" rx="12" fill="#1e1e2e"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#cdd6f4">The Four Pipeline Properties</text>

  <!-- Property 1: Reproducibility -->
  <g transform="translate(50, 70)">
    <rect width="180" height="160" rx="8" fill="#313244" filter="url(#shadow)"/>
    <rect width="180" height="4" rx="2" fill="#89b4fa" y="0"/>
    <text x="90" y="35" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#89b4fa">Reproducibility</text>
    <text x="90" y="60" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a6adc8">Same commit SHA</text>
    <text x="90" y="76" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a6adc8">= same artifact</text>
    <line x1="20" y1="90" x2="160" y2="90" stroke="#45475a" stroke-width="1"/>
    <text x="90" y="112" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#cdd6f4">• Pinned deps</text>
    <text x="90" y="128" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#cdd6f4">• Digest base images</text>
    <text x="90" y="144" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#cdd6f4">• Lock file enforced</text>
  </g>

  <!-- Property 2: Observability -->
  <g transform="translate(255, 70)">
    <rect width="180" height="160" rx="8" fill="#313244" filter="url(#shadow)"/>
    <rect width="180" height="4" rx="2" fill="#a6e3a1" y="0"/>
    <text x="90" y="35" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#a6e3a1">Observability</text>
    <text x="90" y="60" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a6adc8">Structured metadata</text>
    <text x="90" y="76" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a6adc8">at every stage</text>
    <line x1="20" y1="90" x2="160" y2="90" stroke="#45475a" stroke-width="1"/>
    <text x="90" y="112" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#cdd6f4">• Step summaries</text>
    <text x="90" y="128" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#cdd6f4">• Duration metrics</text>
    <text x="90" y="144" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#cdd6f4">• Prometheus push</text>
  </g>

  <!-- Property 3: Gateability -->
  <g transform="translate(460, 70)">
    <rect width="180" height="160" rx="8" fill="#313244" filter="url(#shadow)"/>
    <rect width="180" height="4" rx="2" fill="#f9e2af" y="0"/>
    <text x="90" y="35" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f9e2af">Gateability</text>
    <text x="90" y="60" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a6adc8">Hard stops that</text>
    <text x="90" y="76" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a6adc8">block promotion</text>
    <line x1="20" y1="90" x2="160" y2="90" stroke="#45475a" stroke-width="1"/>
    <text x="90" y="112" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#cdd6f4">• Security scan gates</text>
    <text x="90" y="128" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#cdd6f4">• Locust thresholds</text>
    <text x="90" y="144" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#cdd6f4">• No continue-on-error</text>
  </g>

  <!-- Property 4: Recoverability -->
  <g transform="translate(665, 70)">
    <rect width="180" height="160" rx="8" fill="#313244" filter="url(#shadow)"/>
    <rect width="180" height="4" rx="2" fill="#f38ba8" y="0"/>
    <text x="90" y="35" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f38ba8">Recoverability</text>
    <text x="90" y="60" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a6adc8">Path back without</text>
    <text x="90" y="76" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a6adc8">thinking clearly</text>
    <line x1="20" y1="90" x2="160" y2="90" stroke="#45475a" stroke-width="1"/>
    <text x="90" y="112" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#cdd6f4">• GitOps revert</text>
    <text x="90" y="128" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#cdd6f4">• Argo auto-rollback</text>
    <text x="90" y="144" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#cdd6f4">• Separate CI/CD repos</text>
  </g>

  <!-- Connection arrows -->
  <g stroke="#585b70" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-auto">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#585b70"/>
      </marker>
    </defs>
    <line x1="230" y1="150" x2="253" y2="150"/>
    <line x1="435" y1="150" x2="458" y2="150"/>
    <line x1="640" y1="150" x2="663" y2="150"/>
  </g>

  <!-- Bottom: Pipeline maturity scale -->
  <text x="450" y="275" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#cdd6f4">Pipeline Maturity</text>

  <!-- Maturity bar background -->
  <rect x="50" y="295" width="800" height="30" rx="6" fill="#313244"/>

  <!-- Level 1: Script -->
  <rect x="50" y="295" width="200" height="30" rx="6" fill="#f38ba8" opacity="0.3"/>
  <text x="150" y="315" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f38ba8">Script on Push</text>

  <!-- Level 2: Gated -->
  <rect x="250" y="295" width="200" height="30" fill="#f9e2af" opacity="0.3"/>
  <text x="350" y="315" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f9e2af">Gated Pipeline</text>

  <!-- Level 3: Observable -->
  <rect x="450" y="295" width="200" height="30" fill="#a6e3a1" opacity="0.3"/>
  <text x="550" y="315" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#a6e3a1">Observable + Gated</text>

  <!-- Level 4: Production-grade -->
  <rect x="650" y="295" width="200" height="30" rx="6" fill="#89b4fa" opacity="0.3"/>
  <text x="750" y="315" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#89b4fa">Production-Grade</text>

  <!-- Maturity descriptions -->
  <text x="150" y="345" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#a6adc8">Builds and pushes.</text>
  <text x="150" y="357" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#a6adc8">No gates. No rollback.</text>

  <text x="350" y="345" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#a6adc8">Tests block deploy.</text>
  <text x="350" y="357" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#a6adc8">Manual recovery.</text>

  <text x="550" y="345" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#a6adc8">Metrics emitted.</text>
  <text x="550" y="357" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#a6adc8">Trend analysis possible.</text>

  <text x="750" y="345" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#a6adc8">All four properties.</text>
  <text x="750" y="357" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#a6adc8">Recoverable at 3am.</text>

  <!-- Arrow showing progression -->
  <line x1="80" y1="380" x2="820" y2="380" stroke="#585b70" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="450" y="400" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#585b70">Increasing confidence in unattended deploys</text>

  <!-- Most teams marker -->
  <line x1="300" y1="290" x2="300" y2="270" stroke="#f38ba8" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="300" y="264" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#f38ba8">Most teams</text>

  <!-- This book target -->
  <line x1="750" y1="290" x2="750" y2="270" stroke="#89b4fa" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="750" y="264" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#89b4fa">This book</text>

  <!-- Footer -->
  <text x="450" y="480" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#585b70">Ship it and Sleep · Chapter 1</text>
</svg>
