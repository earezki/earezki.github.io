<svg viewBox="0 0 800 400" width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#1e1e2e"/>
  <text x="400" y="35" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="18" font-weight="bold">Environment Promotion Flow</text>

  <!-- Dev -->
  <rect x="50" y="120" width="180" height="100" rx="10" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <text x="140" y="150" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="15" font-weight="bold">Dev</text>
  <text x="140" y="172" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="10">Namespace: dev</text>
  <text x="140" y="188" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="10">Trigger: CI pass</text>
  <text x="140" y="204" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="10">Auto-deploy</text>

  <!-- Arrow Dev → Staging -->
  <line x1="230" y1="170" x2="290" y2="170" stroke="#a6e3a1" stroke-width="2" marker-end="url(#arrowG)"/>
  <text x="260" y="155" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="9">Health ✓</text>
  <text x="260" y="190" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="9">Smoke ✓</text>

  <!-- Staging -->
  <rect x="290" y="120" width="200" height="100" rx="10" fill="#313244" stroke="#fab387" stroke-width="2"/>
  <text x="390" y="150" text-anchor="middle" fill="#fab387" font-family="monospace" font-size="15" font-weight="bold">Staging</text>
  <text x="390" y="172" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="10">Namespace: staging</text>
  <text x="390" y="188" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="10">Trigger: Dev validated</text>
  <text x="390" y="204" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="10">Auto-deploy</text>

  <!-- Arrow Staging → Production -->
  <line x1="490" y1="170" x2="550" y2="170" stroke="#f38ba8" stroke-width="2" marker-end="url(#arrowR)"/>
  <text x="520" y="148" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="9">Contract ✓</text>
  <text x="520" y="162" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="9">Perf ✓</text>
  <text x="520" y="195" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="9">Approval ✓</text>

  <!-- Production -->
  <rect x="550" y="120" width="200" height="100" rx="10" fill="#313244" stroke="#f38ba8" stroke-width="2"/>
  <text x="650" y="150" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="15" font-weight="bold">Production</text>
  <text x="650" y="172" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="10">Namespace: production</text>
  <text x="650" y="188" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="10">Trigger: Manual approval</text>
  <text x="650" y="204" text-anchor="middle" fill="#fab387" font-family="monospace" font-size="10">Gated deploy</text>

  <!-- Image flow -->
  <text x="400" y="80" text-anchor="middle" fill="#585b70" font-family="monospace" font-size="11">Same image digest moves through all environments</text>
  <line x1="140" y1="90" x2="650" y2="90" stroke="#585b70" stroke-width="1" stroke-dasharray="6,3"/>

  <!-- Git-based promotion -->
  <rect x="100" y="280" width="600" height="70" rx="8" fill="#313244" stroke="#89b4fa" stroke-width="1"/>
  <text x="400" y="305" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="12" font-weight="bold">ecommerce-infra repo (GitOps)</text>
  <text x="200" y="330" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="10">values-dev.yaml</text>
  <text x="400" y="330" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="10">values-staging.yaml</text>
  <text x="600" y="330" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="10">values-production.yaml</text>

  <!-- Lines from envs to git -->
  <line x1="140" y1="220" x2="200" y2="280" stroke="#585b70" stroke-width="1" stroke-dasharray="4,2"/>
  <line x1="390" y1="220" x2="400" y2="280" stroke="#585b70" stroke-width="1" stroke-dasharray="4,2"/>
  <line x1="650" y1="220" x2="600" y2="280" stroke="#585b70" stroke-width="1" stroke-dasharray="4,2"/>

  <!-- ArgoCD label -->
  <text x="400" y="370" text-anchor="middle" fill="#585b70" font-family="monospace" font-size="10">ArgoCD watches each path and syncs the corresponding namespace</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a6e3a1"/>
    </marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f38ba8"/>
    </marker>
  </defs>
</svg>