<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380">
  <rect width="800" height="380" fill="#1e1e2e" rx="12"/>
  <text x="400" y="35" fill="#cdd6f4" font-family="monospace" font-size="18" text-anchor="middle" font-weight="bold">Incident Recovery Workflow</text>

  <!-- Timeline -->
  <line x1="60" y1="100" x2="740" y2="100" stroke="#45475a" stroke-width="2"/>

  <!-- Event 1: Deploy -->
  <circle cx="100" cy="100" r="8" fill="#89b4fa"/>
  <text x="100" y="80" fill="#89b4fa" font-family="monospace" font-size="10" text-anchor="middle">Deploy</text>
  <text x="100" y="130" fill="#a6adc8" font-family="monospace" font-size="9" text-anchor="middle">4:47 PM</text>

  <!-- Event 2: Alert -->
  <circle cx="230" cy="100" r="8" fill="#f38ba8"/>
  <text x="230" y="80" fill="#f38ba8" font-family="monospace" font-size="10" text-anchor="middle">Alert</text>
  <text x="230" y="130" fill="#a6adc8" font-family="monospace" font-size="9" text-anchor="middle">5:15 PM</text>

  <!-- Event 3: Rollback -->
  <circle cx="380" cy="100" r="8" fill="#f9e2af"/>
  <text x="380" y="80" fill="#f9e2af" font-family="monospace" font-size="10" text-anchor="middle">Rollback</text>
  <text x="380" y="130" fill="#a6adc8" font-family="monospace" font-size="9" text-anchor="middle">5:18 PM</text>

  <!-- Event 4: Recovered -->
  <circle cx="500" cy="100" r="8" fill="#a6e3a1"/>
  <text x="500" y="80" fill="#a6e3a1" font-family="monospace" font-size="10" text-anchor="middle">Recovered</text>
  <text x="500" y="130" fill="#a6adc8" font-family="monospace" font-size="9" text-anchor="middle">5:22 PM</text>

  <!-- Event 5: Hotfix -->
  <circle cx="620" cy="100" r="8" fill="#89b4fa"/>
  <text x="620" y="80" fill="#89b4fa" font-family="monospace" font-size="10" text-anchor="middle">Hotfix</text>
  <text x="620" y="130" fill="#a6adc8" font-family="monospace" font-size="9" text-anchor="middle">6:00 PM</text>

  <!-- Event 6: Review -->
  <circle cx="720" cy="100" r="8" fill="#a6e3a1"/>
  <text x="720" y="80" fill="#a6e3a1" font-family="monospace" font-size="10" text-anchor="middle">Review</text>
  <text x="720" y="130" fill="#a6adc8" font-family="monospace" font-size="9" text-anchor="middle">Next day</text>

  <!-- Rollback methods -->
  <rect x="60" y="170" width="680" height="180" fill="#313244" stroke="#f9e2af" stroke-width="1" rx="8"/>
  <text x="400" y="195" fill="#f9e2af" font-family="monospace" font-size="13" text-anchor="middle" font-weight="bold">Rollback Methods</text>

  <!-- Method 1 -->
  <rect x="80" y="210" width="150" height="70" fill="#1e1e2e" stroke="#f38ba8" stroke-width="1" rx="6"/>
  <text x="155" y="235" fill="#f38ba8" font-family="monospace" font-size="10" text-anchor="middle">kubectl rollout</text>
  <text x="155" y="252" fill="#a6adc8" font-family="monospace" font-size="9" text-anchor="middle">30s | Overwritten</text>
  <text x="155" y="268" fill="#f38ba8" font-family="monospace" font-size="9" text-anchor="middle">✗ Don't use</text>

  <!-- Method 2 -->
  <rect x="250" y="210" width="150" height="70" fill="#1e1e2e" stroke="#f9e2af" stroke-width="1" rx="6"/>
  <text x="325" y="235" fill="#f9e2af" font-family="monospace" font-size="10" text-anchor="middle">ArgoCD UI</text>
  <text x="325" y="252" fill="#a6adc8" font-family="monospace" font-size="9" text-anchor="middle">1-2min | Temporary</text>
  <text x="325" y="268" fill="#f9e2af" font-family="monospace" font-size="9" text-anchor="middle">~ First response</text>

  <!-- Method 3 -->
  <rect x="420" y="210" width="150" height="70" fill="#1e1e2e" stroke="#a6e3a1" stroke-width="2" rx="6"/>
  <text x="495" y="235" fill="#a6e3a1" font-family="monospace" font-size="10" text-anchor="middle">git revert</text>
  <text x="495" y="252" fill="#a6adc8" font-family="monospace" font-size="9" text-anchor="middle">2-5min | Permanent</text>
  <text x="495" y="268" fill="#a6e3a1" font-family="monospace" font-size="9" text-anchor="middle">✓ Recommended</text>

  <!-- Method 4 -->
  <rect x="590" y="210" width="130" height="70" fill="#1e1e2e" stroke="#89b4fa" stroke-width="1" rx="6"/>
  <text x="655" y="235" fill="#89b4fa" font-family="monospace" font-size="10" text-anchor="middle">Argo abort</text>
  <text x="655" y="252" fill="#a6adc8" font-family="monospace" font-size="9" text-anchor="middle">10s | Canary only</text>
  <text x="655" y="268" fill="#89b4fa" font-family="monospace" font-size="9" text-anchor="middle">✓ During rollout</text>

  <!-- MTTR -->
  <text x="400" y="330" fill="#a6adc8" font-family="monospace" font-size="11" text-anchor="middle">MTTR target: detect + rollback &lt; 10 minutes</text>
</svg>