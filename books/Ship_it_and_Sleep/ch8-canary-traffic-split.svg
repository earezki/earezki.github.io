<svg viewBox="0 0 800 400" width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="#1e1e2e"/>
  <text x="400" y="35" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="18" font-weight="bold">Canary Traffic Split Timeline</text>

  <!-- Timeline axis -->
  <line x1="80" y1="300" x2="720" y2="300" stroke="#585b70" stroke-width="2"/>
  <text x="400" y="330" text-anchor="middle" fill="#585b70" font-family="monospace" font-size="11">Time →</text>

  <!-- Y axis -->
  <line x1="80" y1="80" x2="80" y2="300" stroke="#585b70" stroke-width="2"/>
  <text x="30" y="90" text-anchor="middle" fill="#585b70" font-family="monospace" font-size="10">100%</text>
  <text x="30" y="190" text-anchor="middle" fill="#585b70" font-family="monospace" font-size="10">50%</text>
  <text x="30" y="300" text-anchor="middle" fill="#585b70" font-family="monospace" font-size="10">0%</text>

  <!-- Stable traffic (green, decreasing) -->
  <polyline points="80,80 200,80 200,86 320,86 320,100 440,100 440,190 560,190 560,300" fill="none" stroke="#a6e3a1" stroke-width="3"/>
  
  <!-- Canary traffic (blue, increasing) -->
  <polyline points="80,300 200,300 200,290 320,290 320,260 440,260 440,190 560,190 560,80 720,80" fill="none" stroke="#89b4fa" stroke-width="3"/>

  <!-- Stage markers -->
  <line x1="200" y1="80" x2="200" y2="310" stroke="#585b70" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="200" y="345" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="9">5%</text>
  <text x="200" y="360" text-anchor="middle" fill="#fab387" font-family="monospace" font-size="8">Analysis 1</text>

  <line x1="320" y1="80" x2="320" y2="310" stroke="#585b70" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="320" y="345" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="9">20%</text>
  <text x="320" y="360" text-anchor="middle" fill="#fab387" font-family="monospace" font-size="8">Analysis 2</text>

  <line x1="440" y1="80" x2="440" y2="310" stroke="#585b70" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="440" y="345" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="9">50%</text>
  <text x="440" y="360" text-anchor="middle" fill="#fab387" font-family="monospace" font-size="8">Analysis 3</text>

  <line x1="560" y1="80" x2="560" y2="310" stroke="#585b70" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="560" y="345" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="9">100%</text>
  <text x="560" y="360" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="8">Promoted</text>

  <!-- Analysis icons -->
  <circle cx="260" y="70" r="8" fill="#a6e3a1" opacity="0.3" stroke="#a6e3a1" stroke-width="1"/>
  <text x="260" y="74" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="10">✓</text>

  <circle cx="380" y="70" r="8" fill="#a6e3a1" opacity="0.3" stroke="#a6e3a1" stroke-width="1"/>
  <text x="380" y="74" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="10">✓</text>

  <circle cx="500" y="70" r="8" fill="#a6e3a1" opacity="0.3" stroke="#a6e3a1" stroke-width="1"/>
  <text x="500" y="74" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="10">✓</text>

  <!-- Legend -->
  <line x1="100" y1="385" x2="130" y2="385" stroke="#a6e3a1" stroke-width="3"/>
  <text x="135" y="389" fill="#cdd6f4" font-family="monospace" font-size="10">Stable version</text>
  <line x1="300" y1="385" x2="330" y2="385" stroke="#89b4fa" stroke-width="3"/>
  <text x="335" y="389" fill="#cdd6f4" font-family="monospace" font-size="10">Canary version</text>
  <circle cx="500" y="385" r="6" fill="#a6e3a1" opacity="0.3" stroke="#a6e3a1" stroke-width="1"/>
  <text x="510" y="389" fill="#cdd6f4" font-family="monospace" font-size="10">Analysis passed</text>
</svg>