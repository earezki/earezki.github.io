<svg viewBox="0 0 800 500" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" fill="#1e1e2e"/>
  <text x="400" y="35" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="18" font-weight="bold">Supply Chain Attack Vectors</text>

  <!-- Central node: Your Build -->
  <rect x="310" y="200" width="180" height="60" rx="8" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <text x="400" y="225" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="13" font-weight="bold">Your CI Build</text>
  <text x="400" y="245" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="11">docker build + push</text>

  <!-- Attack vector 1: Dependency Confusion -->
  <rect x="30" y="60" width="200" height="70" rx="8" fill="#313244" stroke="#f38ba8" stroke-width="2"/>
  <text x="130" y="82" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="12" font-weight="bold">Dependency Confusion</text>
  <text x="130" y="100" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="10">Public pkg same name</text>
  <text x="130" y="115" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="10">as private pkg</text>
  <line x1="230" y1="95" x2="310" y2="215" stroke="#f38ba8" stroke-width="1.5" stroke-dasharray="6,3"/>

  <!-- Attack vector 2: Typosquatting -->
  <rect x="280" y="60" width="200" height="70" rx="8" fill="#313244" stroke="#f38ba8" stroke-width="2"/>
  <text x="380" y="82" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="12" font-weight="bold">Typosquatting</text>
  <text x="380" y="100" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="10">lodash → lodassh</text>
  <text x="380" y="115" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="10">colors → colores</text>
  <line x1="380" y1="130" x2="390" y2="200" stroke="#f38ba8" stroke-width="1.5" stroke-dasharray="6,3"/>

  <!-- Attack vector 3: Compromised Maintainer -->
  <rect x="530" y="60" width="220" height="70" rx="8" fill="#313244" stroke="#f38ba8" stroke-width="2"/>
  <text x="640" y="82" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="12" font-weight="bold">Compromised Maintainer</text>
  <text x="640" y="100" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="10">Account takeover or</text>
  <text x="640" y="115" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="10">malicious insider</text>
  <line x1="530" y1="100" x2="490" y2="215" stroke="#f38ba8" stroke-width="1.5" stroke-dasharray="6,3"/>

  <!-- Attack vector 4: CI Action Compromise -->
  <rect x="30" y="300" width="220" height="70" rx="8" fill="#313244" stroke="#fab387" stroke-width="2"/>
  <text x="140" y="322" text-anchor="middle" fill="#fab387" font-family="monospace" font-size="12" font-weight="bold">CI Action Compromise</text>
  <text x="140" y="340" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="10">codecov/action tag moved</text>
  <text x="140" y="355" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="10">to malicious commit</text>
  <line x1="250" y1="335" x2="310" y2="240" stroke="#fab387" stroke-width="1.5" stroke-dasharray="6,3"/>

  <!-- Attack vector 5: Base Image Poisoning -->
  <rect x="530" y="300" width="220" height="70" rx="8" fill="#313244" stroke="#fab387" stroke-width="2"/>
  <text x="640" y="322" text-anchor="middle" fill="#fab387" font-family="monospace" font-size="12" font-weight="bold">Base Image Poisoning</text>
  <text x="640" y="340" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="10">Compromised Docker Hub</text>
  <text x="640" y="355" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="10">image with backdoor</text>
  <line x1="530" y1="330" x2="490" y2="245" stroke="#fab387" stroke-width="1.5" stroke-dasharray="6,3"/>

  <!-- Defenses -->
  <rect x="150" y="420" width="500" height="55" rx="8" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
  <text x="400" y="442" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="13" font-weight="bold">Defenses</text>
  <text x="400" y="462" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="11">Lock files │ SHA pinning │ SBOM │ OSV Scanner │ Trivy │ Dependabot</text>
  <line x1="400" y1="420" x2="400" y2="260" stroke="#a6e3a1" stroke-width="1.5"/>

  <!-- Legend -->
  <line x1="30" y1="480" x2="50" y2="480" stroke="#f38ba8" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="55" y="484" fill="#cdd6f4" font-family="monospace" font-size="10">Package registry attacks</text>
  <line x1="250" y1="480" x2="270" y2="480" stroke="#fab387" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="275" y="484" fill="#cdd6f4" font-family="monospace" font-size="10">Infrastructure attacks</text>
  <line x1="470" y1="480" x2="490" y2="480" stroke="#a6e3a1" stroke-width="2"/>
  <text x="495" y="484" fill="#cdd6f4" font-family="monospace" font-size="10">Defense layer</text>
</svg>