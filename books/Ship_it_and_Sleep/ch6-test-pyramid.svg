<svg viewBox="0 0 800 500" width="800" height="500" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" fill="#1e1e2e"/>
  <text x="400" y="35" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="18" font-weight="bold">Test Pyramid → Pipeline Stages</text>

  <!-- Pyramid -->
  <!-- Top: E2E (outside pipeline) -->
  <polygon points="400,70 340,140 460,140" fill="none" stroke="#585b70" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="400" y="120" text-anchor="middle" fill="#585b70" font-family="monospace" font-size="11">E2E</text>
  <text x="570" y="110" fill="#585b70" font-family="monospace" font-size="10">Post-deploy only</text>
  <text x="570" y="125" fill="#585b70" font-family="monospace" font-size="10">(not a gate)</text>
  <line x1="462" y1="110" x2="560" y2="110" stroke="#585b70" stroke-width="1" stroke-dasharray="4,2"/>

  <!-- Performance tier -->
  <polygon points="340,140 280,210 520,210 460,140" fill="#f38ba8" fill-opacity="0.15" stroke="#f38ba8" stroke-width="2"/>
  <text x="400" y="182" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="12">Performance (Locust)</text>
  <text x="620" y="175" fill="#f38ba8" font-family="monospace" font-size="10">Post-deploy gate</text>
  <text x="620" y="190" fill="#f38ba8" font-family="monospace" font-size="10">in staging (CH17)</text>
  <line x1="522" y1="175" x2="610" y2="175" stroke="#f38ba8" stroke-width="1"/>

  <!-- Contract tier -->
  <polygon points="280,210 220,280 580,280 520,210" fill="#fab387" fill-opacity="0.15" stroke="#fab387" stroke-width="2"/>
  <text x="400" y="252" text-anchor="middle" fill="#fab387" font-family="monospace" font-size="12">Contract (Pact)</text>
  <text x="650" y="245" fill="#fab387" font-family="monospace" font-size="10">Parallel job</text>
  <text x="650" y="260" fill="#fab387" font-family="monospace" font-size="10">after build</text>
  <line x1="582" y1="248" x2="640" y2="248" stroke="#fab387" stroke-width="1"/>

  <!-- Integration tier -->
  <polygon points="220,280 160,350 640,350 580,280" fill="#89b4fa" fill-opacity="0.15" stroke="#89b4fa" stroke-width="2"/>
  <text x="400" y="322" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="12">Integration (Docker Compose)</text>
  <text x="700" y="315" fill="#89b4fa" font-family="monospace" font-size="10">Parallel job</text>
  <text x="700" y="330" fill="#89b4fa" font-family="monospace" font-size="10">after build</text>
  <line x1="642" y1="318" x2="690" y2="318" stroke="#89b4fa" stroke-width="1"/>

  <!-- Unit tier -->
  <polygon points="160,350 100,420 700,420 640,350" fill="#a6e3a1" fill-opacity="0.15" stroke="#a6e3a1" stroke-width="2"/>
  <text x="400" y="392" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="12">Unit Tests</text>
  <text x="730" y="385" fill="#a6e3a1" font-family="monospace" font-size="10">Parallel job</text>
  <text x="730" y="400" fill="#a6e3a1" font-family="monospace" font-size="10">after build</text>
  <line x1="702" y1="388" x2="720" y2="388" stroke="#a6e3a1" stroke-width="1"/>

  <!-- Axis labels -->
  <text x="50" y="250" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="10" transform="rotate(-90,50,250)">← Fewer, slower, broader →</text>
  <text x="400" y="455" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="10">← More tests, faster, narrower scope →</text>

  <!-- Pipeline stage labels on left -->
  <rect x="20" y="340" width="70" height="20" rx="3" fill="#a6e3a1" fill-opacity="0.2"/>
  <text x="55" y="354" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="9">CI gate</text>

  <rect x="20" y="130" width="70" height="20" rx="3" fill="#f38ba8" fill-opacity="0.2"/>
  <text x="55" y="144" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="9">CD gate</text>

  <!-- Duration annotations -->
  <text x="400" y="480" text-anchor="middle" fill="#585b70" font-family="monospace" font-size="10">Unit: 30s-2min │ Integration: 3-6min │ Contract: 1-3min │ Perf: 3-10min │ E2E: 10-30min</text>
</svg>