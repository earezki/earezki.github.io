<svg viewBox="0 0 800 450" width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" fill="#1e1e2e"/>
  <text x="400" y="35" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="18" font-weight="bold">Secrets Flow: Pipeline → Cluster</text>

  <!-- Pipeline (left side) -->
  <rect x="30" y="70" width="330" height="160" rx="8" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <text x="195" y="95" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="14" font-weight="bold">CI Pipeline</text>

  <!-- GitHub Secrets -->
  <rect x="50" y="110" width="130" height="45" rx="4" fill="#45475a" stroke="#585b70" stroke-width="1"/>
  <text x="115" y="130" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="10">GitHub Secrets</text>
  <text x="115" y="145" text-anchor="middle" fill="#585b70" font-family="monospace" font-size="9">Static tokens</text>

  <!-- Vault (pipeline) -->
  <rect x="210" y="110" width="130" height="45" rx="4" fill="#45475a" stroke="#fab387" stroke-width="1"/>
  <text x="275" y="130" text-anchor="middle" fill="#fab387" font-family="monospace" font-size="10">Vault (JWT)</text>
  <text x="275" y="145" text-anchor="middle" fill="#585b70" font-family="monospace" font-size="9">Dynamic creds</text>

  <!-- OIDC arrow -->
  <text x="195" y="185" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="9">OIDC token exchange</text>
  <line x1="180" y1="155" x2="210" y2="155" stroke="#a6e3a1" stroke-width="1" marker-end="url(#arrS)"/>

  <!-- Kubernetes (right side) -->
  <rect x="440" y="70" width="330" height="340" rx="8" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
  <text x="605" y="95" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="14" font-weight="bold">Kubernetes Cluster</text>

  <!-- Sealed Secrets -->
  <rect x="460" y="115" width="140" height="60" rx="4" fill="#45475a" stroke="#89b4fa" stroke-width="1"/>
  <text x="530" y="135" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="10">Sealed Secrets</text>
  <text x="530" y="152" text-anchor="middle" fill="#585b70" font-family="monospace" font-size="9">Encrypted in Git</text>
  <text x="530" y="166" text-anchor="middle" fill="#585b70" font-family="monospace" font-size="9">Decrypted in cluster</text>

  <!-- External Secrets -->
  <rect x="620" y="115" width="140" height="60" rx="4" fill="#45475a" stroke="#fab387" stroke-width="1"/>
  <text x="690" y="135" text-anchor="middle" fill="#fab387" font-family="monospace" font-size="10">External Secrets</text>
  <text x="690" y="152" text-anchor="middle" fill="#585b70" font-family="monospace" font-size="9">Synced from Vault</text>
  <text x="690" y="166" text-anchor="middle" fill="#585b70" font-family="monospace" font-size="9">Auto-rotated</text>

  <!-- K8s Secret -->
  <rect x="520" y="210" width="170" height="45" rx="4" fill="#45475a" stroke="#a6e3a1" stroke-width="1"/>
  <text x="605" y="230" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="11">K8s Secret</text>
  <text x="605" y="245" text-anchor="middle" fill="#585b70" font-family="monospace" font-size="9">etcd (encrypted at rest)</text>

  <!-- Pod -->
  <rect x="520" y="290" width="170" height="45" rx="4" fill="#45475a" stroke="#cdd6f4" stroke-width="1"/>
  <text x="605" y="310" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="11">Pod</text>
  <text x="605" y="325" text-anchor="middle" fill="#585b70" font-family="monospace" font-size="9">env vars / volume mount</text>

  <!-- Arrows within cluster -->
  <line x1="530" y1="175" x2="570" y2="210" stroke="#89b4fa" stroke-width="1.5" marker-end="url(#arrS)"/>
  <line x1="690" y1="175" x2="640" y2="210" stroke="#fab387" stroke-width="1.5" marker-end="url(#arrS)"/>
  <line x1="605" y1="255" x2="605" y2="290" stroke="#a6e3a1" stroke-width="1.5" marker-end="url(#arrS)"/>

  <!-- Vault (external) -->
  <rect x="440" y="370" width="140" height="35" rx="4" fill="#45475a" stroke="#fab387" stroke-width="1"/>
  <text x="510" y="392" text-anchor="middle" fill="#fab387" font-family="monospace" font-size="10">HashiCorp Vault</text>
  <line x1="510" y1="370" x2="660" y2="175" stroke="#fab387" stroke-width="1" stroke-dasharray="6,3"/>

  <!-- Git repo -->
  <rect x="30" y="290" width="140" height="35" rx="4" fill="#45475a" stroke="#89b4fa" stroke-width="1"/>
  <text x="100" y="312" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="10">Git (encrypted)</text>
  <line x1="170" y1="307" x2="460" y2="145" stroke="#89b4fa" stroke-width="1" stroke-dasharray="6,3"/>

  <!-- Never do -->
  <rect x="30" y="370" width="330" height="55" rx="6" fill="#f38ba8" fill-opacity="0.1" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="195" y="390" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="11" font-weight="bold">Never</text>
  <text x="195" y="410" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="9">Plain secrets in Git │ Shared across envs │ Long-lived static keys</text>

  <defs>
    <marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cdd6f4"/>
    </marker>
  </defs>
</svg>