<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380">
  <rect width="800" height="380" fill="#1e1e2e" rx="12"/>
  <text x="400" y="35" fill="#cdd6f4" font-family="monospace" font-size="18" text-anchor="middle" font-weight="bold">Pipeline Observability Stack</text>

  <!-- Flow: GH Actions → Pushgateway → Prometheus → Grafana → Alerts -->
  <rect x="40" y="120" width="120" height="70" fill="#313244" stroke="#89b4fa" stroke-width="2" rx="8"/>
  <text x="100" y="150" fill="#89b4fa" font-family="monospace" font-size="11" text-anchor="middle">GitHub</text>
  <text x="100" y="168" fill="#89b4fa" font-family="monospace" font-size="11" text-anchor="middle">Actions</text>

  <line x1="160" y1="155" x2="210" y2="155" stroke="#a6adc8" stroke-width="2" marker-end="url(#po-arr)"/>
  <text x="185" y="145" fill="#a6adc8" font-family="monospace" font-size="8" text-anchor="middle">push</text>

  <rect x="210" y="120" width="120" height="70" fill="#313244" stroke="#f9e2af" stroke-width="2" rx="8"/>
  <text x="270" y="150" fill="#f9e2af" font-family="monospace" font-size="11" text-anchor="middle">Push</text>
  <text x="270" y="168" fill="#f9e2af" font-family="monospace" font-size="11" text-anchor="middle">gateway</text>

  <line x1="330" y1="155" x2="380" y2="155" stroke="#a6adc8" stroke-width="2" marker-end="url(#po-arr)"/>
  <text x="355" y="145" fill="#a6adc8" font-family="monospace" font-size="8" text-anchor="middle">scrape</text>

  <rect x="380" y="120" width="120" height="70" fill="#313244" stroke="#f38ba8" stroke-width="2" rx="8"/>
  <text x="440" y="150" fill="#f38ba8" font-family="monospace" font-size="11" text-anchor="middle">Prometheus</text>
  <text x="440" y="168" fill="#a6adc8" font-family="monospace" font-size="10" text-anchor="middle">TSDB</text>

  <line x1="500" y1="155" x2="550" y2="155" stroke="#a6adc8" stroke-width="2" marker-end="url(#po-arr)"/>
  <text x="525" y="145" fill="#a6adc8" font-family="monospace" font-size="8" text-anchor="middle">query</text>

  <rect x="550" y="120" width="120" height="70" fill="#313244" stroke="#a6e3a1" stroke-width="2" rx="8"/>
  <text x="610" y="155" fill="#a6e3a1" font-family="monospace" font-size="11" text-anchor="middle">Grafana</text>

  <line x1="670" y1="155" x2="710" y2="155" stroke="#a6adc8" stroke-width="2" marker-end="url(#po-arr)"/>

  <rect x="710" y="120" width="70" height="70" fill="#313244" stroke="#89b4fa" stroke-width="2" rx="8"/>
  <text x="745" y="155" fill="#89b4fa" font-family="monospace" font-size="11" text-anchor="middle">Slack</text>

  <!-- Dashboard panels -->
  <rect x="100" y="240" width="140" height="80" fill="#313244" stroke="#a6e3a1" stroke-width="1" rx="6"/>
  <text x="170" y="265" fill="#a6e3a1" font-family="monospace" font-size="10" text-anchor="middle">Build Duration</text>
  <text x="170" y="285" fill="#a6adc8" font-family="monospace" font-size="20" text-anchor="middle">8m 12s</text>
  <text x="170" y="305" fill="#a6e3a1" font-family="monospace" font-size="9" text-anchor="middle">p90</text>

  <rect x="260" y="240" width="140" height="80" fill="#313244" stroke="#a6e3a1" stroke-width="1" rx="6"/>
  <text x="330" y="265" fill="#a6e3a1" font-family="monospace" font-size="10" text-anchor="middle">Success Rate</text>
  <text x="330" y="285" fill="#a6e3a1" font-family="monospace" font-size="20" text-anchor="middle">96.2%</text>

  <rect x="420" y="240" width="140" height="80" fill="#313244" stroke="#f9e2af" stroke-width="1" rx="6"/>
  <text x="490" y="265" fill="#f9e2af" font-family="monospace" font-size="10" text-anchor="middle">Queue Time</text>
  <text x="490" y="285" fill="#f9e2af" font-family="monospace" font-size="20" text-anchor="middle">45s</text>
  <text x="490" y="305" fill="#f9e2af" font-family="monospace" font-size="9" text-anchor="middle">p90</text>

  <rect x="580" y="240" width="140" height="80" fill="#313244" stroke="#f38ba8" stroke-width="1" rx="6"/>
  <text x="650" y="265" fill="#f38ba8" font-family="monospace" font-size="10" text-anchor="middle">Flaky Tests</text>
  <text x="650" y="285" fill="#f38ba8" font-family="monospace" font-size="20" text-anchor="middle">7</text>
  <text x="650" y="305" fill="#f38ba8" font-family="monospace" font-size="9" text-anchor="middle">quarantined</text>

  <!-- Label -->
  <text x="400" y="360" fill="#a6adc8" font-family="monospace" font-size="10" text-anchor="middle">Four essential panels for pipeline health visibility</text>

  <defs>
    <marker id="po-arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a6adc8"/></marker>
  </defs>
</svg>