<svg viewBox="0 0 800 350" width="800" height="350" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="350" fill="#1e1e2e"/>
  <text x="400" y="35" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="18" font-weight="bold">Expand-Contract Migration Timeline</text>

  <!-- Timeline axis -->
  <line x1="60" y1="250" x2="740" y2="250" stroke="#585b70" stroke-width="2"/>

  <!-- Phase markers -->
  <rect x="80" y="80" width="180" height="140" rx="6" fill="#89b4fa" fill-opacity="0.1" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="170" y="105" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="13" font-weight="bold">Expand</text>
  <text x="170" y="130" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="10">Add new column</text>
  <text x="170" y="148" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="10">Backfill data</text>
  <text x="170" y="166" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="10">Add sync trigger</text>
  <text x="170" y="190" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="10">Old code works ✓</text>
  <text x="170" y="206" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="10">New code works ✓</text>

  <rect x="300" y="80" width="180" height="140" rx="6" fill="#fab387" fill-opacity="0.1" stroke="#fab387" stroke-width="1.5"/>
  <text x="390" y="105" text-anchor="middle" fill="#fab387" font-family="monospace" font-size="13" font-weight="bold">Migrate</text>
  <text x="390" y="130" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="10">Read from new col</text>
  <text x="390" y="148" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="10">Write to both</text>
  <text x="390" y="166" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="10">Trigger keeps sync</text>
  <text x="390" y="190" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="10">Rollback safe ✓</text>

  <rect x="520" y="80" width="180" height="140" rx="6" fill="#f38ba8" fill-opacity="0.1" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="610" y="105" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="13" font-weight="bold">Contract</text>
  <text x="610" y="130" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="10">Drop old column</text>
  <text x="610" y="148" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="10">Remove trigger</text>
  <text x="610" y="166" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="10">Clean schema</text>
  <text x="610" y="190" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="10">No rollback ✗</text>

  <!-- Deployment markers on timeline -->
  <circle cx="170" cy="250" r="6" fill="#89b4fa"/>
  <text x="170" y="275" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="9">Deploy 1</text>

  <circle cx="390" cy="250" r="6" fill="#fab387"/>
  <text x="390" y="275" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="9">Deploy 2</text>

  <circle cx="610" cy="250" r="6" fill="#f38ba8"/>
  <text x="610" y="275" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="9">Deploy 3</text>

  <!-- Column state labels -->
  <text x="170" y="310" text-anchor="middle" fill="#585b70" font-family="monospace" font-size="9">amount + total_amount</text>
  <text x="390" y="310" text-anchor="middle" fill="#585b70" font-family="monospace" font-size="9">amount + total_amount</text>
  <text x="610" y="310" text-anchor="middle" fill="#585b70" font-family="monospace" font-size="9">total_amount only</text>

  <!-- Arrows between phases -->
  <line x1="260" y1="150" x2="300" y2="150" stroke="#585b70" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="480" y1="150" x2="520" y2="150" stroke="#585b70" stroke-width="1.5" marker-end="url(#arr)"/>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#585b70"/>
    </marker>
  </defs>
</svg>