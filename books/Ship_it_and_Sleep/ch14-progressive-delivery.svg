<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#1e1e2e" rx="12"/>
  <text x="400" y="35" fill="#cdd6f4" font-family="monospace" font-size="18" text-anchor="middle" font-weight="bold">Progressive Delivery with Argo Rollouts</text>

  <!-- Timeline -->
  <line x1="80" y1="100" x2="720" y2="100" stroke="#45475a" stroke-width="2"/>

  <!-- Steps -->
  <circle cx="120" cy="100" r="8" fill="#89b4fa"/>
  <text x="120" y="85" fill="#89b4fa" font-family="monospace" font-size="10" text-anchor="middle">5%</text>
  <text x="120" y="130" fill="#a6adc8" font-family="monospace" font-size="9" text-anchor="middle">setWeight</text>

  <circle cx="220" cy="100" r="8" fill="#f9e2af"/>
  <text x="220" y="85" fill="#f9e2af" font-family="monospace" font-size="10" text-anchor="middle">pause</text>
  <text x="220" y="130" fill="#a6adc8" font-family="monospace" font-size="9" text-anchor="middle">2min</text>

  <circle cx="320" cy="100" r="8" fill="#a6e3a1"/>
  <text x="320" y="85" fill="#a6e3a1" font-family="monospace" font-size="10" text-anchor="middle">analyze</text>
  <text x="320" y="130" fill="#a6adc8" font-family="monospace" font-size="9" text-anchor="middle">error rate</text>

  <circle cx="420" cy="100" r="8" fill="#89b4fa"/>
  <text x="420" y="85" fill="#89b4fa" font-family="monospace" font-size="10" text-anchor="middle">25%</text>
  <text x="420" y="130" fill="#a6adc8" font-family="monospace" font-size="9" text-anchor="middle">setWeight</text>

  <circle cx="520" cy="100" r="8" fill="#a6e3a1"/>
  <text x="520" y="85" fill="#a6e3a1" font-family="monospace" font-size="10" text-anchor="middle">analyze</text>
  <text x="520" y="130" fill="#a6adc8" font-family="monospace" font-size="9" text-anchor="middle">full suite</text>

  <circle cx="620" cy="100" r="8" fill="#89b4fa"/>
  <text x="620" y="85" fill="#89b4fa" font-family="monospace" font-size="10" text-anchor="middle">50%</text>

  <circle cx="700" cy="100" r="8" fill="#a6e3a1"/>
  <text x="700" y="85" fill="#a6e3a1" font-family="monospace" font-size="10" text-anchor="middle">100%</text>

  <!-- Traffic visualization -->
  <rect x="80" y="170" width="640" height="30" fill="#313244" stroke="#45475a" stroke-width="1" rx="4"/>
  <text x="400" y="160" fill="#a6adc8" font-family="monospace" font-size="11" text-anchor="middle">Traffic Distribution</text>

  <!-- Stable traffic -->
  <rect x="80" y="170" width="608" height="30" fill="#89b4fa" rx="4"/>
  <text x="384" y="190" fill="#1e1e2e" font-family="monospace" font-size="11" text-anchor="middle">Stable (95%)</text>

  <!-- Canary traffic -->
  <rect x="688" y="170" width="32" height="30" fill="#a6e3a1" rx="4"/>

  <!-- Analysis Run box -->
  <rect x="80" y="230" width="640" height="120" fill="#313244" stroke="#a6e3a1" stroke-width="2" rx="8"/>
  <text x="400" y="255" fill="#a6e3a1" font-family="monospace" font-size="13" text-anchor="middle" font-weight="bold">AnalysisRun</text>

  <rect x="110" y="270" width="140" height="60" fill="#1e1e2e" stroke="#89b4fa" stroke-width="1" rx="4"/>
  <text x="180" y="292" fill="#89b4fa" font-family="monospace" font-size="10" text-anchor="middle">Prometheus</text>
  <text x="180" y="310" fill="#a6adc8" font-family="monospace" font-size="9" text-anchor="middle">error_rate &lt; 0.01</text>
  <text x="180" y="322" fill="#a6e3a1" font-family="monospace" font-size="9" text-anchor="middle">✓ Pass</text>

  <rect x="270" y="270" width="140" height="60" fill="#1e1e2e" stroke="#89b4fa" stroke-width="1" rx="4"/>
  <text x="340" y="292" fill="#89b4fa" font-family="monospace" font-size="10" text-anchor="middle">Prometheus</text>
  <text x="340" y="310" fill="#a6adc8" font-family="monospace" font-size="9" text-anchor="middle">p99_latency &lt; 500ms</text>
  <text x="340" y="322" fill="#a6e3a1" font-family="monospace" font-size="9" text-anchor="middle">✓ Pass</text>

  <rect x="430" y="270" width="140" height="60" fill="#1e1e2e" stroke="#f38ba8" stroke-width="1" rx="4"/>
  <text x="500" y="292" fill="#f38ba8" font-family="monospace" font-size="10" text-anchor="middle">Web Hook</text>
  <text x="500" y="310" fill="#a6adc8" font-family="monospace" font-size="9" text-anchor="middle">smoke_test == pass</text>
  <text x="500" y="322" fill="#f38ba8" font-family="monospace" font-size="9" text-anchor="middle">✗ Fail</text>

  <rect x="590" y="270" width="110" height="60" fill="#1e1e2e" stroke="#89b4fa" stroke-width="1" rx="4"/>
  <text x="645" y="292" fill="#89b4fa" font-family="monospace" font-size="10" text-anchor="middle">PagerDuty</text>
  <text x="645" y="310" fill="#a6adc8" font-family="monospace" font-size="9" text-anchor="middle">incidents == 0</text>
  <text x="645" y="322" fill="#a6e3a1" font-family="monospace" font-size="9" text-anchor="middle">✓ Pass</text>

  <!-- Abort arrow -->
  <line x1="500" y1="340" x2="500" y2="390" stroke="#f38ba8" stroke-width="2" marker-end="url(#arr-red)"/>
  <rect x="400" y="390" width="200" height="40" fill="#313244" stroke="#f38ba8" stroke-width="2" rx="8"/>
  <text x="500" y="415" fill="#f38ba8" font-family="monospace" font-size="12" text-anchor="middle">Rollback (abort)</text>

  <defs>
    <marker id="arr-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#f38ba8"/></marker>
  </defs>
</svg>