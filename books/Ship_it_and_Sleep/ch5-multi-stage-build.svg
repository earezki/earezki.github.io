<svg viewBox="0 0 800 520" width="800" height="520" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="520" fill="#1e1e2e"/>
  <text x="400" y="35" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="18" font-weight="bold">Multi-Stage Docker Build</text>

  <!-- Stage 1: Dependencies -->
  <rect x="40" y="70" width="340" height="130" rx="8" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <text x="210" y="95" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="14" font-weight="bold">Stage 1: deps</text>
  <text x="60" y="120" fill="#cdd6f4" font-family="monospace" font-size="11">FROM node:20-slim AS deps</text>
  <text x="60" y="138" fill="#a6e3a1" font-family="monospace" font-size="11">COPY package.json package-lock.json</text>
  <text x="60" y="156" fill="#cdd6f4" font-family="monospace" font-size="11">RUN npm ci --production</text>
  <text x="60" y="178" fill="#585b70" font-family="monospace" font-size="10">↑ Cached unless lock file changes</text>

  <!-- Stage 2: Build -->
  <rect x="420" y="70" width="340" height="130" rx="8" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <text x="590" y="95" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="14" font-weight="bold">Stage 2: build</text>
  <text x="440" y="120" fill="#cdd6f4" font-family="monospace" font-size="11">FROM deps AS build</text>
  <text x="440" y="138" fill="#a6e3a1" font-family="monospace" font-size="11">COPY src/ tsconfig.json</text>
  <text x="440" y="156" fill="#cdd6f4" font-family="monospace" font-size="11">RUN npm run build</text>
  <text x="440" y="178" fill="#585b70" font-family="monospace" font-size="10">↑ Invalidated on code change</text>

  <!-- Arrow 1→2 -->
  <line x1="380" y1="135" x2="420" y2="135" stroke="#89b4fa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 3: Runtime -->
  <rect x="180" y="250" width="440" height="130" rx="8" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
  <text x="400" y="275" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="14" font-weight="bold">Stage 3: runtime (final)</text>
  <text x="200" y="300" fill="#cdd6f4" font-family="monospace" font-size="11">FROM gcr.io/distroless/nodejs20-debian12</text>
  <text x="200" y="318" fill="#a6e3a1" font-family="monospace" font-size="11">COPY --from=deps /app/node_modules</text>
  <text x="200" y="336" fill="#a6e3a1" font-family="monospace" font-size="11">COPY --from=build /app/dist</text>
  <text x="200" y="358" fill="#585b70" font-family="monospace" font-size="10">No build tools, no dev deps, no shell</text>

  <!-- Arrows to runtime -->
  <line x1="210" y1="200" x2="300" y2="250" stroke="#89b4fa" stroke-width="1.5" stroke-dasharray="6,3"/>
  <line x1="590" y1="200" x2="500" y2="250" stroke="#89b4fa" stroke-width="1.5" stroke-dasharray="6,3"/>

  <!-- Size comparison -->
  <rect x="40" y="420" width="700" height="30" rx="4" fill="#45475a"/>
  <text x="50" y="441" fill="#f38ba8" font-family="monospace" font-size="12" font-weight="bold">Single-stage:</text>
  <rect x="190" y="422" width="540" height="26" rx="3" fill="#f38ba8" opacity="0.3"/>
  <text x="460" y="440" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="11">1.2 GB (node:20 + build tools + dev deps + source)</text>

  <rect x="40" y="460" width="700" height="30" rx="4" fill="#45475a"/>
  <text x="50" y="481" fill="#a6e3a1" font-family="monospace" font-size="12" font-weight="bold">Multi-stage:</text>
  <rect x="190" y="462" width="120" height="26" rx="3" fill="#a6e3a1" opacity="0.3"/>
  <text x="250" y="480" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="11">145 MB</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#89b4fa"/>
    </marker>
  </defs>
</svg>