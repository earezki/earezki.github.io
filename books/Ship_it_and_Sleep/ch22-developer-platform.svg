<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <rect width="800" height="420" fill="#1e1e2e" rx="12"/>
  <text x="400" y="35" fill="#cdd6f4" font-family="monospace" font-size="18" text-anchor="middle" font-weight="bold">Self-Service Developer Platform</text>

  <!-- Developer -->
  <rect x="40" y="80" width="120" height="60" fill="#313244" stroke="#89b4fa" stroke-width="2" rx="8"/>
  <text x="100" y="115" fill="#89b4fa" font-family="monospace" font-size="11" text-anchor="middle">Developer</text>

  <!-- Backstage -->
  <rect x="220" y="60" width="360" height="100" fill="#313244" stroke="#a6e3a1" stroke-width="2" rx="8"/>
  <text x="400" y="85" fill="#a6e3a1" font-family="monospace" font-size="13" text-anchor="middle" font-weight="bold">Backstage Portal</text>

  <rect x="240" y="95" width="90" height="50" fill="#1e1e2e" stroke="#89b4fa" stroke-width="1" rx="4"/>
  <text x="285" y="118" fill="#89b4fa" font-family="monospace" font-size="9" text-anchor="middle">Catalog</text>
  <text x="285" y="133" fill="#a6adc8" font-family="monospace" font-size="8" text-anchor="middle">Find services</text>

  <rect x="345" y="95" width="90" height="50" fill="#1e1e2e" stroke="#a6e3a1" stroke-width="1" rx="4"/>
  <text x="390" y="118" fill="#a6e3a1" font-family="monospace" font-size="9" text-anchor="middle">Scaffolder</text>
  <text x="390" y="133" fill="#a6adc8" font-family="monospace" font-size="8" text-anchor="middle">Create new</text>

  <rect x="450" y="95" width="100" height="50" fill="#1e1e2e" stroke="#f9e2af" stroke-width="1" rx="4"/>
  <text x="500" y="118" fill="#f9e2af" font-family="monospace" font-size="9" text-anchor="middle">TechDocs</text>
  <text x="500" y="133" fill="#a6adc8" font-family="monospace" font-size="8" text-anchor="middle">Read docs</text>

  <!-- Arrow developer to backstage -->
  <line x1="160" y1="110" x2="218" y2="110" stroke="#a6adc8" stroke-width="2" marker-end="url(#dp-arr)"/>

  <!-- Golden Path -->
  <rect x="220" y="200" width="360" height="50" fill="#313244" stroke="#f9e2af" stroke-width="2" rx="8"/>
  <text x="400" y="230" fill="#f9e2af" font-family="monospace" font-size="12" text-anchor="middle">Golden Path Template</text>

  <line x1="400" y1="160" x2="400" y2="198" stroke="#a6e3a1" stroke-width="2" marker-end="url(#dp-arr)"/>
  <text x="420" y="185" fill="#a6adc8" font-family="monospace" font-size="9">scaffold</text>

  <!-- Output services -->
  <line x1="400" y1="250" x2="400" y2="280" stroke="#f9e2af" stroke-width="2" marker-end="url(#dp-arr-y)"/>

  <!-- Generated artifacts -->
  <rect x="40" y="285" width="150" height="110" fill="#313244" stroke="#89b4fa" stroke-width="1" rx="6"/>
  <text x="115" y="310" fill="#89b4fa" font-family="monospace" font-size="10" text-anchor="middle" font-weight="bold">GitHub Repo</text>
  <text x="115" y="330" fill="#a6adc8" font-family="monospace" font-size="8" text-anchor="middle">CI workflows</text>
  <text x="115" y="345" fill="#a6adc8" font-family="monospace" font-size="8" text-anchor="middle">Dockerfile</text>
  <text x="115" y="360" fill="#a6adc8" font-family="monospace" font-size="8" text-anchor="middle">Security scans</text>
  <text x="115" y="375" fill="#a6adc8" font-family="monospace" font-size="8" text-anchor="middle">Tests</text>

  <rect x="220" y="285" width="150" height="110" fill="#313244" stroke="#f9e2af" stroke-width="1" rx="6"/>
  <text x="295" y="310" fill="#f9e2af" font-family="monospace" font-size="10" text-anchor="middle" font-weight="bold">Infra Entry</text>
  <text x="295" y="330" fill="#a6adc8" font-family="monospace" font-size="8" text-anchor="middle">K8s manifests</text>
  <text x="295" y="345" fill="#a6adc8" font-family="monospace" font-size="8" text-anchor="middle">Staging overlay</text>
  <text x="295" y="360" fill="#a6adc8" font-family="monospace" font-size="8" text-anchor="middle">Production overlay</text>
  <text x="295" y="375" fill="#a6adc8" font-family="monospace" font-size="8" text-anchor="middle">ArgoCD app</text>

  <rect x="400" y="285" width="150" height="110" fill="#313244" stroke="#a6e3a1" stroke-width="1" rx="6"/>
  <text x="475" y="310" fill="#a6e3a1" font-family="monospace" font-size="10" text-anchor="middle" font-weight="bold">Monitoring</text>
  <text x="475" y="330" fill="#a6adc8" font-family="monospace" font-size="8" text-anchor="middle">Grafana dashboard</text>
  <text x="475" y="345" fill="#a6adc8" font-family="monospace" font-size="8" text-anchor="middle">Prometheus rules</text>
  <text x="475" y="360" fill="#a6adc8" font-family="monospace" font-size="8" text-anchor="middle">PagerDuty service</text>
  <text x="475" y="375" fill="#a6adc8" font-family="monospace" font-size="8" text-anchor="middle">Catalog entry</text>

  <!-- Time to deploy -->
  <rect x="600" y="285" width="160" height="110" fill="#313244" stroke="#a6e3a1" stroke-width="2" rx="8"/>
  <text x="680" y="315" fill="#a6e3a1" font-family="monospace" font-size="12" text-anchor="middle" font-weight="bold">Result</text>
  <text x="680" y="345" fill="#a6e3a1" font-family="monospace" font-size="22" text-anchor="middle">10 min</text>
  <text x="680" y="370" fill="#a6adc8" font-family="monospace" font-size="10" text-anchor="middle">to first deploy</text>
  <text x="680" y="388" fill="#a6adc8" font-family="monospace" font-size="9" text-anchor="middle">(was: 3 days)</text>

  <defs>
    <marker id="dp-arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a6adc8"/></marker>
    <marker id="dp-arr-y" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f9e2af"/></marker>
  </defs>
</svg>