<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" fill="#1e1e2e" rx="12"/>
  <text x="400" y="35" fill="#cdd6f4" font-family="monospace" font-size="18" text-anchor="middle" font-weight="bold">Helm vs Kustomize: Template vs Overlay</text>

  <!-- Helm Side -->
  <rect x="30" y="55" width="360" height="320" fill="#1e1e2e" stroke="#89b4fa" stroke-width="1" rx="8" stroke-dasharray="6,4"/>
  <text x="210" y="80" fill="#89b4fa" font-family="monospace" font-size="14" text-anchor="middle" font-weight="bold">Helm (Template)</text>

  <rect x="60" y="95" width="300" height="35" fill="#313244" stroke="#89b4fa" stroke-width="2" rx="6"/>
  <text x="210" y="117" fill="#89b4fa" font-family="monospace" font-size="11" text-anchor="middle">Chart Template (Go tmpl)</text>

  <text x="170" y="150" fill="#a6adc8" font-family="monospace" font-size="12" text-anchor="middle">+</text>

  <rect x="60" y="160" width="300" height="35" fill="#313244" stroke="#f9e2af" stroke-width="2" rx="6"/>
  <text x="210" y="182" fill="#f9e2af" font-family="monospace" font-size="11" text-anchor="middle">values.yaml (Parameters)</text>

  <text x="170" y="215" fill="#a6adc8" font-family="monospace" font-size="12" text-anchor="middle">→</text>

  <rect x="60" y="225" width="300" height="35" fill="#313244" stroke="#a6e3a1" stroke-width="2" rx="6"/>
  <text x="210" y="247" fill="#a6e3a1" font-family="monospace" font-size="11" text-anchor="middle">Rendered YAML</text>

  <text x="60" y="290" fill="#a6e3a1" font-family="monospace" font-size="10">✓ Package management</text>
  <text x="60" y="308" fill="#a6e3a1" font-family="monospace" font-size="10">✓ Versioned releases</text>
  <text x="60" y="326" fill="#a6e3a1" font-family="monospace" font-size="10">✓ Dependencies (subcharts)</text>
  <text x="60" y="344" fill="#f38ba8" font-family="monospace" font-size="10">✗ Complex Go templates</text>
  <text x="60" y="362" fill="#f38ba8" font-family="monospace" font-size="10">✗ Hard to debug rendering</text>

  <!-- Kustomize Side -->
  <rect x="410" y="55" width="360" height="320" fill="#1e1e2e" stroke="#a6e3a1" stroke-width="1" rx="8" stroke-dasharray="6,4"/>
  <text x="590" y="80" fill="#a6e3a1" font-family="monospace" font-size="14" text-anchor="middle" font-weight="bold">Kustomize (Overlay)</text>

  <rect x="440" y="95" width="300" height="35" fill="#313244" stroke="#a6e3a1" stroke-width="2" rx="6"/>
  <text x="590" y="117" fill="#a6e3a1" font-family="monospace" font-size="11" text-anchor="middle">Base YAML (Plain K8s)</text>

  <text x="550" y="150" fill="#a6adc8" font-family="monospace" font-size="12" text-anchor="middle">+</text>

  <rect x="440" y="160" width="300" height="35" fill="#313244" stroke="#f9e2af" stroke-width="2" rx="6"/>
  <text x="590" y="182" fill="#f9e2af" font-family="monospace" font-size="11" text-anchor="middle">Overlay Patches (per env)</text>

  <text x="550" y="215" fill="#a6adc8" font-family="monospace" font-size="12" text-anchor="middle">→</text>

  <rect x="440" y="225" width="300" height="35" fill="#313244" stroke="#a6e3a1" stroke-width="2" rx="6"/>
  <text x="590" y="247" fill="#a6e3a1" font-family="monospace" font-size="11" text-anchor="middle">Merged YAML</text>

  <text x="440" y="290" fill="#a6e3a1" font-family="monospace" font-size="10">✓ Plain YAML (no templates)</text>
  <text x="440" y="308" fill="#a6e3a1" font-family="monospace" font-size="10">✓ Built into kubectl</text>
  <text x="440" y="326" fill="#a6e3a1" font-family="monospace" font-size="10">✓ Easy to understand diffs</text>
  <text x="440" y="344" fill="#f38ba8" font-family="monospace" font-size="10">✗ No package registry</text>
  <text x="440" y="362" fill="#f38ba8" font-family="monospace" font-size="10">✗ No release versioning</text>
</svg>