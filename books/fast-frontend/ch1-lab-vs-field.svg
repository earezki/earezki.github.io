<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="system-ui, -apple-system, sans-serif">
  <rect width="720" height="400" fill="#0f172a" rx="8"/>
  <text x="360" y="36" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="bold">Lab vs Field Data Divergence</text>

  <!-- Axes -->
  <line x1="80" y1="340" x2="660" y2="340" stroke="#475569" stroke-width="1"/>
  <line x1="80" y1="60" x2="80" y2="340" stroke="#475569" stroke-width="1"/>

  <!-- Y axis labels -->
  <text x="70" y="345" text-anchor="end" fill="#94a3b8" font-size="11">0</text>
  <text x="70" y="275" text-anchor="end" fill="#94a3b8" font-size="11">1s</text>
  <text x="70" y="205" text-anchor="end" fill="#94a3b8" font-size="11">2s</text>
  <text x="70" y="135" text-anchor="end" fill="#94a3b8" font-size="11">3s</text>
  <text x="70" y="75" text-anchor="end" fill="#94a3b8" font-size="11">4s</text>

  <!-- Y axis title -->
  <text x="20" y="200" text-anchor="middle" fill="#94a3b8" font-size="11" transform="rotate(-90 20 200)">LCP (seconds)</text>

  <!-- Grid lines -->
  <line x1="80" y1="270" x2="660" y2="270" stroke="#1e293b" stroke-width="1" stroke-dasharray="4"/>
  <line x1="80" y1="200" x2="660" y2="200" stroke="#1e293b" stroke-width="1" stroke-dasharray="4"/>
  <line x1="80" y1="130" x2="660" y2="130" stroke="#1e293b" stroke-width="1" stroke-dasharray="4"/>

  <!-- X axis labels -->
  <text x="170" y="360" text-anchor="middle" fill="#94a3b8" font-size="11">LCP</text>
  <text x="340" y="360" text-anchor="middle" fill="#94a3b8" font-size="11">FID / INP</text>
  <text x="510" y="360" text-anchor="middle" fill="#94a3b8" font-size="11">CLS</text>

  <!-- LCP bars -->
  <rect x="130" y="198" width="40" height="142" fill="#38bdf8" rx="3" opacity="0.9"/>
  <text x="150" y="192" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="bold">1.4s</text>
  <rect x="175" y="130" width="40" height="210" fill="#ef4444" rx="3" opacity="0.9"/>
  <text x="195" y="124" text-anchor="middle" fill="#ef4444" font-size="11" font-weight="bold">2.8s</text>

  <!-- FID bars (scaled differently - using ms but showing as fraction of seconds) -->
  <rect x="300" y="305" width="40" height="35" fill="#38bdf8" rx="3" opacity="0.9"/>
  <text x="320" y="299" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="bold">50ms</text>
  <rect x="345" y="235" width="40" height="105" fill="#ef4444" rx="3" opacity="0.9"/>
  <text x="365" y="229" text-anchor="middle" fill="#ef4444" font-size="11" font-weight="bold">280ms</text>

  <!-- CLS bars (scaled) -->
  <rect x="470" y="312" width="40" height="28" fill="#38bdf8" rx="3" opacity="0.9"/>
  <text x="490" y="306" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="bold">0.02</text>
  <rect x="515" y="270" width="40" height="70" fill="#ef4444" rx="3" opacity="0.9"/>
  <text x="535" y="264" text-anchor="middle" fill="#ef4444" font-size="11" font-weight="bold">0.18</text>

  <!-- Legend -->
  <rect x="240" y="375" width="12" height="12" fill="#38bdf8" rx="2"/>
  <text x="258" y="386" fill="#e2e8f0" font-size="11">Lab (Lighthouse)</text>
  <rect x="380" y="375" width="12" height="12" fill="#ef4444" rx="2"/>
  <text x="398" y="386" fill="#e2e8f0" font-size="11">Field (p75 RUM)</text>
</svg>