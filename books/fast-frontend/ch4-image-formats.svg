<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="system-ui, -apple-system, sans-serif">
  <rect width="720" height="320" fill="#0f172a" rx="8"/>
  <text x="360" y="32" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="bold">Image Format Size Comparison</text>
  <text x="360" y="52" text-anchor="middle" fill="#94a3b8" font-size="11">Product photo 800x800, quality 80</text>

  <!-- Axes -->
  <line x1="100" y1="270" x2="660" y2="270" stroke="#475569" stroke-width="1"/>
  <line x1="100" y1="70" x2="100" y2="270" stroke="#475569" stroke-width="1"/>

  <!-- Y axis labels -->
  <text x="90" y="275" text-anchor="end" fill="#94a3b8" font-size="10">0</text>
  <text x="90" y="230" text-anchor="end" fill="#94a3b8" font-size="10">50 kB</text>
  <text x="90" y="190" text-anchor="end" fill="#94a3b8" font-size="10">100 kB</text>
  <text x="90" y="150" text-anchor="end" fill="#94a3b8" font-size="10">150 kB</text>
  <text x="90" y="110" text-anchor="end" fill="#94a3b8" font-size="10">200 kB</text>
  <text x="90" y="80" text-anchor="end" fill="#94a3b8" font-size="10">240 kB</text>

  <!-- Grid -->
  <line x1="100" y1="230" x2="660" y2="230" stroke="#1e293b" stroke-width="1" stroke-dasharray="3"/>
  <line x1="100" y1="190" x2="660" y2="190" stroke="#1e293b" stroke-width="1" stroke-dasharray="3"/>
  <line x1="100" y1="150" x2="660" y2="150" stroke="#1e293b" stroke-width="1" stroke-dasharray="3"/>
  <line x1="100" y1="110" x2="660" y2="110" stroke="#1e293b" stroke-width="1" stroke-dasharray="3"/>

  <!-- PNG bar -->
  <rect x="140" y="78" width="80" height="192" fill="#ef4444" rx="4" opacity="0.9"/>
  <text x="180" y="72" text-anchor="middle" fill="#ef4444" font-size="12" font-weight="bold">240 kB</text>
  <text x="180" y="290" text-anchor="middle" fill="#e2e8f0" font-size="12">PNG</text>

  <!-- JPEG bar -->
  <rect x="260" y="158" width="80" height="112" fill="#f59e0b" rx="4" opacity="0.9"/>
  <text x="300" y="152" text-anchor="middle" fill="#f59e0b" font-size="12" font-weight="bold">140 kB</text>
  <text x="300" y="290" text-anchor="middle" fill="#e2e8f0" font-size="12">JPEG</text>

  <!-- WebP bar -->
  <rect x="380" y="198" width="80" height="72" fill="#38bdf8" rx="4" opacity="0.9"/>
  <text x="420" y="192" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="bold">86 kB</text>
  <text x="420" y="290" text-anchor="middle" fill="#e2e8f0" font-size="12">WebP</text>

  <!-- AVIF bar -->
  <rect x="500" y="222" width="80" height="48" fill="#22c55e" rx="4" opacity="0.9"/>
  <text x="540" y="216" text-anchor="middle" fill="#22c55e" font-size="12" font-weight="bold">58 kB</text>
  <text x="540" y="290" text-anchor="middle" fill="#e2e8f0" font-size="12">AVIF</text>

  <!-- Savings annotations -->
  <line x1="620" y1="100" x2="620" y2="230" stroke="#22c55e" stroke-width="1" stroke-dasharray="4"/>
  <text x="625" y="120" fill="#22c55e" font-size="10">-76% vs PNG</text>
  <text x="625" y="140" fill="#22c55e" font-size="10">-59% vs JPEG</text>
  <text x="625" y="165" fill="#94a3b8" font-size="10">AVIF: best</text>
  <text x="625" y="185" fill="#94a3b8" font-size="10">compression</text>
  <text x="625" y="210" fill="#94a3b8" font-size="10">97% browser</text>
  <text x="625" y="225" fill="#94a3b8" font-size="10">support (2024)</text>
</svg>