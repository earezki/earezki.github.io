  <rect x="330" y="148" width="200" height="200" fill="#1e293b" rx="6" stroke="#f59e0b" stroke-width="1"/>
  <text x="430" y="170" text-anchor="middle" fill="#f59e0b" font-size="12" font-weight="bold">Vendor Libraries</text>
