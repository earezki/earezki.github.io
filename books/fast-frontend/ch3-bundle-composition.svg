  <text x="515" y="194" text-anchor="end" fill="#e2e8f0" font-size="11">42 kB</text>
  <text x="345" y="214" fill="#94a3b8" font-size="11">date-fns</text>
  <text x="515" y="214" text-anchor="end" fill="#e2e8f0" font-size="11">14 kB</text>
  <text x="345" y="234" fill="#94a3b8" font-size="11">zod</text>
  <text x="515" y="234" text-anchor="end" fill="#e2e8f0" font-size="11">11 kB</text>
