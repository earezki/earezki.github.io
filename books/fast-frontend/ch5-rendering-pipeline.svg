<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="system-ui, -apple-system, sans-serif">
  <rect width="720" height="300" fill="#0f172a" rx="8"/>
  <text x="360" y="32" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="bold">Browser Rendering Pipeline</text>

  <!-- Pipeline stages -->
  <rect x="20" y="70" width="100" height="50" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
  <text x="70" y="92" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="bold">JavaScript</text>
  <text x="70" y="108" text-anchor="middle" fill="#94a3b8" font-size="9">Execute</text>

  <rect x="140" y="70" width="100" height="50" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5" rx="6"/>
  <text x="190" y="92" text-anchor="middle" fill="#a78bfa" font-size="11" font-weight="bold">Style</text>
  <text x="190" y="108" text-anchor="middle" fill="#94a3b8" font-size="9">Recalculate</text>

  <rect x="260" y="70" width="100" height="50" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" rx="6"/>
  <text x="310" y="92" text-anchor="middle" fill="#f59e0b" font-size="11" font-weight="bold">Layout</text>
  <text x="310" y="108" text-anchor="middle" fill="#94a3b8" font-size="9">Reflow</text>

  <rect x="380" y="70" width="100" height="50" fill="#1e293b" stroke="#22c55e" stroke-width="1.5" rx="6"/>
  <text x="430" y="92" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="bold">Paint</text>
  <text x="430" y="108" text-anchor="middle" fill="#94a3b8" font-size="9">Rasterize</text>

  <rect x="500" y="70" width="110" height="50" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
  <text x="555" y="92" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="bold">Composite</text>
  <text x="555" y="108" text-anchor="middle" fill="#94a3b8" font-size="9">GPU layers</text>

  <rect x="630" y="70" width="70" height="50" fill="#1e293b" stroke="#e2e8f0" stroke-width="1.5" rx="6"/>
  <text x="665" y="92" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="bold">Display</text>
  <text x="665" y="108" text-anchor="middle" fill="#94a3b8" font-size="9">Frame</text>

  <!-- Arrows -->
  <path d="M120 95 L135 95" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#pipeArrow)"/>
  <path d="M240 95 L255 95" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#pipeArrow)"/>
  <path d="M360 95 L375 95" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#pipeArrow)"/>
  <path d="M480 95 L495 95" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#pipeArrow)"/>
  <path d="M610 95 L625 95" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#pipeArrow)"/>

  <!-- Main thread vs compositor thread labels -->
  <rect x="20" y="135" width="490" height="24" fill="#1e293b" rx="4" opacity="0.6"/>
  <text x="265" y="152" text-anchor="middle" fill="#f59e0b" font-size="10" font-weight="bold">Main Thread (blocking)</text>

  <rect x="500" y="135" width="200" height="24" fill="#1e293b" rx="4" opacity="0.6"/>
  <text x="600" y="152" text-anchor="middle" fill="#22c55e" font-size="10" font-weight="bold">Compositor Thread (non-blocking)</text>

  <!-- Cost comparison -->
  <text x="360" y="185" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="bold">Animation Cost by Property</text>

  <!-- transform (compositor only) -->
  <rect x="40" y="200" width="300" height="36" fill="#1e293b" rx="6" stroke="#22c55e" stroke-width="1"/>
  <text x="55" y="222" fill="#22c55e" font-size="11" font-weight="bold">transform, opacity</text>
  <rect x="210" y="208" width="120" height="20" fill="#22c55e" rx="3" opacity="0.3"/>
  <text x="270" y="222" text-anchor="middle" fill="#22c55e" font-size="10">Composite only</text>

  <!-- background-color (paint + composite) -->
  <rect x="40" y="244" width="300" height="36" fill="#1e293b" rx="6" stroke="#f59e0b" stroke-width="1"/>
  <text x="55" y="266" fill="#f59e0b" font-size="11" font-weight="bold">background, color</text>
  <rect x="170" y="252" width="160" height="20" fill="#f59e0b" rx="3" opacity="0.3"/>
  <text x="250" y="266" text-anchor="middle" fill="#f59e0b" font-size="10">Paint + Composite</text>

  <!-- width/height (layout + paint + composite) -->
  <rect x="380" y="200" width="320" height="36" fill="#1e293b" rx="6" stroke="#ef4444" stroke-width="1"/>
  <text x="395" y="222" fill="#ef4444" font-size="11" font-weight="bold">width, height, top, left</text>
  <rect x="500" y="208" width="190" height="20" fill="#ef4444" rx="3" opacity="0.3"/>
  <text x="595" y="222" text-anchor="middle" fill="#ef4444" font-size="10">Layout + Paint + Composite</text>

  <!-- Cost labels -->
  <rect x="380" y="244" width="320" height="36" fill="#1e293b" rx="6" stroke="#475569" stroke-width="1"/>
  <text x="395" y="260" fill="#94a3b8" font-size="10">Compositor only:</text>
  <text x="510" y="260" fill="#22c55e" font-size="10" font-weight="bold">0.1ms</text>
  <text x="555" y="260" fill="#94a3b8" font-size="10">Paint:</text>
  <text x="595" y="260" fill="#f59e0b" font-size="10" font-weight="bold">2ms</text>
  <text x="632" y="260" fill="#94a3b8" font-size="10">Layout:</text>
  <text x="680" y="260" fill="#ef4444" font-size="10" font-weight="bold">8ms</text>
  <text x="540" y="274" text-anchor="middle" fill="#94a3b8" font-size="9">Per frame at 60fps (16.67ms budget)</text>

  <defs>
    <marker id="pipeArrow" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#475569"/>
    </marker>
  </defs>
</svg>