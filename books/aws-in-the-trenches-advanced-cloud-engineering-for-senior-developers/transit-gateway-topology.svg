<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" fill="#3b82f6">
      <polygon points="0 0, 10 3.5, 0 7"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" fill="#f59e0b">
      <polygon points="0 0, 10 3.5, 0 7"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" rx="12" fill="url(#bgGrad)" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">Transit Gateway Multi-VPC Topology</text>
  <line x1="230" y1="48" x2="570" y2="48" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>

  <!-- Transit Gateway (center hub) -->
  <rect x="300" y="200" width="200" height="80" rx="14" fill="#ffffff" stroke="#f59e0b" stroke-width="3" filter="url(#shadow)"/>
  <text x="400" y="230" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Transit Gateway</text>
  <text x="400" y="250" text-anchor="middle" font-size="10" fill="#64748b">Regional router (50 Gbps/AZ)</text>
  <text x="400" y="265" text-anchor="middle" font-size="10" fill="#64748b">Route tables per attachment</text>

  <!-- VPC: Shared Services (top center) -->
  <rect x="295" y="60" width="210" height="70" rx="10" fill="#ffffff" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="83" text-anchor="middle" font-size="12" font-weight="600" fill="#8b5cf6">Shared Services VPC</text>
  <text x="400" y="100" text-anchor="middle" font-size="10" fill="#64748b">10.0.0.0/16</text>
  <text x="400" y="117" text-anchor="middle" font-size="9" fill="#64748b">DNS, AD, CI/CD, Monitoring</text>
  <line x1="400" y1="130" x2="400" y2="198" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- VPC: Production (left) -->
  <rect x="30" y="170" width="200" height="70" rx="10" fill="#ffffff" stroke="#ef4444" stroke-width="2" filter="url(#shadow)"/>
  <text x="130" y="193" text-anchor="middle" font-size="12" font-weight="600" fill="#ef4444">Production VPC</text>
  <text x="130" y="210" text-anchor="middle" font-size="10" fill="#64748b">10.1.0.0/16</text>
  <text x="130" y="227" text-anchor="middle" font-size="9" fill="#64748b">ECS, RDS, ElastiCache</text>
  <line x1="230" y1="220" x2="298" y2="230" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- VPC: Development (right) -->
  <rect x="570" y="170" width="200" height="70" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="670" y="193" text-anchor="middle" font-size="12" font-weight="600" fill="#3b82f6">Development VPC</text>
  <text x="670" y="210" text-anchor="middle" font-size="10" fill="#64748b">10.2.0.0/16</text>
  <text x="670" y="227" text-anchor="middle" font-size="9" fill="#64748b">Dev workloads, sandboxes</text>
  <line x1="570" y1="220" x2="502" y2="230" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- VPC: Data (bottom left) -->
  <rect x="80" y="320" width="180" height="70" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <text x="170" y="343" text-anchor="middle" font-size="12" font-weight="600" fill="#10b981">Data VPC</text>
  <text x="170" y="360" text-anchor="middle" font-size="10" fill="#64748b">10.3.0.0/16</text>
  <text x="170" y="377" text-anchor="middle" font-size="9" fill="#64748b">Redshift, EMR, S3 endpoints</text>
  <line x1="260" y1="345" x2="310" y2="275" stroke="#10b981" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- On-Premises (bottom right) -->
  <rect x="530" y="320" width="210" height="70" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
  <text x="635" y="343" text-anchor="middle" font-size="12" font-weight="600" fill="#64748b">On-Premises DC</text>
  <text x="635" y="360" text-anchor="middle" font-size="10" fill="#64748b">192.168.0.0/16</text>
  <text x="635" y="377" text-anchor="middle" font-size="9" fill="#64748b">Direct Connect / Site-to-Site VPN</text>
  <line x1="530" y1="345" x2="490" y2="275" stroke="#64748b" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- Route Table Explanation -->
  <rect x="60" y="415" width="680" height="90" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="438" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">TGW Route Table Segmentation</text>
  
  <rect x="80" y="448" width="200" height="45" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
  <text x="180" y="466" text-anchor="middle" font-size="10" font-weight="600" fill="#ef4444">Prod Route Table</text>
  <text x="180" y="482" text-anchor="middle" font-size="9" fill="#64748b">→ Shared, Data, On-Prem</text>
  <text x="180" y="494" text-anchor="middle" font-size="9" fill="#ef4444">✗ No route to Dev</text>

  <rect x="300" y="448" width="200" height="45" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="400" y="466" text-anchor="middle" font-size="10" font-weight="600" fill="#3b82f6">Dev Route Table</text>
  <text x="400" y="482" text-anchor="middle" font-size="9" fill="#64748b">→ Shared, Internet</text>
  <text x="400" y="494" text-anchor="middle" font-size="9" fill="#3b82f6">✗ No route to Prod/Data</text>

  <rect x="520" y="448" width="200" height="45" rx="6" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1"/>
  <text x="620" y="466" text-anchor="middle" font-size="10" font-weight="600" fill="#8b5cf6">Shared Route Table</text>
  <text x="620" y="482" text-anchor="middle" font-size="9" fill="#64748b">→ All VPCs, On-Prem</text>
  <text x="620" y="494" text-anchor="middle" font-size="9" fill="#8b5cf6">Hub for shared services</text>
</svg>