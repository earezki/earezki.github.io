<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="800" height="550" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" fill="#3b82f6">
      <polygon points="0 0, 10 3.5, 0 7"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" fill="#10b981">
      <polygon points="0 0, 10 3.5, 0 7"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" fill="#ef4444">
      <polygon points="0 0, 10 3.5, 0 7"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="550" rx="12" fill="url(#bgGrad)" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">Step Functions Orchestration</text>
  <line x1="250" y1="48" x2="550" y2="48" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round"/>

  <!-- Start -->
  <circle cx="400" cy="80" r="18" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="400" y="85" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">Start</text>
  <line x1="400" y1="98" x2="400" y2="120" stroke="#64748b" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Task: Validate Order -->
  <rect x="300" y="122" width="200" height="45" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="141" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">Validate Order</text>
  <text x="400" y="157" text-anchor="middle" font-size="10" fill="#64748b">Task: Lambda</text>
  <line x1="400" y1="167" x2="400" y2="187" stroke="#64748b" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Choice: Valid? -->
  <polygon points="400,189 450,215 400,241 350,215" fill="#ffffff" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="219" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">Valid?</text>

  <!-- No path (left) → Fail -->
  <line x1="350" y1="215" x2="230" y2="215" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="290" y="208" font-size="10" fill="#ef4444" font-weight="500">No</text>
  <rect x="130" y="200" width="100" height="35" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="180" y="222" text-anchor="middle" font-size="11" font-weight="600" fill="#ef4444">Fail</text>

  <!-- Yes path (down) -->
  <line x1="400" y1="241" x2="400" y2="261" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="415" y="255" font-size="10" fill="#10b981" font-weight="500">Yes</text>

  <!-- Parallel: Process Payment + Reserve Inventory -->
  <rect x="220" y="263" width="360" height="100" rx="10" fill="#ffffff" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6,3" filter="url(#shadow)"/>
  <text x="400" y="280" text-anchor="middle" font-size="11" font-weight="600" fill="#8b5cf6">Parallel</text>

  <rect x="240" y="290" width="145" height="40" rx="6" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="312" y="308" text-anchor="middle" font-size="10" font-weight="600" fill="#1e293b">Process Payment</text>
  <text x="312" y="322" text-anchor="middle" font-size="9" fill="#64748b">Task: Lambda</text>

  <rect x="415" y="290" width="145" height="40" rx="6" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="487" y="308" text-anchor="middle" font-size="10" font-weight="600" fill="#1e293b">Reserve Inventory</text>
  <text x="487" y="322" text-anchor="middle" font-size="9" fill="#64748b">Task: Lambda</text>

  <line x1="400" y1="363" x2="400" y2="383" stroke="#64748b" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Wait for callback -->
  <rect x="300" y="385" width="200" height="45" rx="8" fill="#ffffff" stroke="#06b6d4" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="404" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">Ship Order</text>
  <text x="400" y="420" text-anchor="middle" font-size="10" fill="#06b6d4">.waitForTaskToken</text>
  <line x1="400" y1="430" x2="400" y2="450" stroke="#64748b" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Callback annotation -->
  <rect x="540" y="385" width="200" height="45" rx="6" fill="#ecfeff" stroke="#06b6d4" stroke-width="1"/>
  <text x="640" y="404" text-anchor="middle" font-size="10" fill="#0e7490">External system calls</text>
  <text x="640" y="418" text-anchor="middle" font-size="10" fill="#0e7490">SendTaskSuccess(token)</text>
  <line x1="540" y1="407" x2="502" y2="407" stroke="#06b6d4" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Map state: Send Notifications -->
  <rect x="290" y="452" width="220" height="45" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="471" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">Notify Subscribers</text>
  <text x="400" y="487" text-anchor="middle" font-size="10" fill="#10b981">Map: concurrency=40</text>
  <line x1="400" y1="497" x2="400" y2="517" stroke="#64748b" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- End -->
  <circle cx="400" cy="532" r="16" fill="#10b981" stroke="#059669" stroke-width="2"/>
  <text x="400" y="537" text-anchor="middle" font-size="10" font-weight="600" fill="#ffffff">End</text>

  <!-- Catch/Retry annotation -->
  <rect x="30" y="280" width="170" height="80" rx="8" fill="#fefce8" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="115" y="300" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">Error Handling</text>
  <text x="115" y="318" text-anchor="middle" font-size="10" fill="#78350f">Retry: 3x exponential</text>
  <text x="115" y="335" text-anchor="middle" font-size="10" fill="#78350f">Catch: → Compensation</text>
  <text x="115" y="352" text-anchor="middle" font-size="10" fill="#78350f">Timeout: HeartbeatSec</text>
  <line x1="200" y1="320" x2="220" y2="313" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Standard vs Express -->
  <rect x="570" y="455" width="200" height="80" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="670" y="475" text-anchor="middle" font-size="11" font-weight="700" fill="#1e293b">Execution Types</text>
  <text x="670" y="495" text-anchor="middle" font-size="10" fill="#64748b">Standard: 1yr max, exactly-once</text>
  <text x="670" y="510" text-anchor="middle" font-size="10" fill="#64748b">Express: 5min max, at-least-once</text>
  <text x="670" y="525" text-anchor="middle" font-size="10" fill="#64748b">Express: 100x cheaper at volume</text>
</svg>