<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" fill="#3b82f6">
      <polygon points="0 0, 10 3.5, 0 7"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" fill="#10b981">
      <polygon points="0 0, 10 3.5, 0 7"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" fill="#8b5cf6">
      <polygon points="0 0, 10 3.5, 0 7"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" rx="12" fill="url(#bgGrad)" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">Event-Driven Architecture on AWS</text>
  <line x1="240" y1="48" x2="560" y2="48" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round"/>

  <!-- Producer (left) -->
  <rect x="30" y="130" width="120" height="55" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="90" y="155" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">Order Service</text>
  <text x="90" y="172" text-anchor="middle" font-size="10" fill="#64748b">Producer</text>

  <rect x="30" y="210" width="120" height="55" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="90" y="235" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">Payment Svc</text>
  <text x="90" y="252" text-anchor="middle" font-size="10" fill="#64748b">Producer</text>

  <rect x="30" y="290" width="120" height="55" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="90" y="315" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">Inventory Svc</text>
  <text x="90" y="332" text-anchor="middle" font-size="10" fill="#64748b">Producer</text>

  <!-- Arrows to EventBridge -->
  <line x1="150" y1="157" x2="255" y2="200" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="150" y1="237" x2="255" y2="230" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="150" y1="317" x2="255" y2="260" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <!-- EventBridge (center) -->
  <rect x="260" y="170" width="200" height="120" rx="12" fill="#ffffff" stroke="#8b5cf6" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="260" y="170" width="200" height="30" rx="12" fill="#8b5cf6"/>
  <rect x="260" y="188" width="200" height="12" fill="#8b5cf6"/>
  <text x="360" y="191" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">EventBridge</text>
  <text x="360" y="220" text-anchor="middle" font-size="11" fill="#1e293b" font-weight="500">Event Bus: "orders"</text>
  <text x="360" y="240" text-anchor="middle" font-size="10" fill="#64748b">Content-based filtering</text>
  <text x="360" y="255" text-anchor="middle" font-size="10" fill="#64748b">Schema registry</text>
  <text x="360" y="270" text-anchor="middle" font-size="10" fill="#64748b">Archive + Replay</text>
  <text x="360" y="285" text-anchor="middle" font-size="10" fill="#64748b">At-least-once delivery</text>

  <!-- SNS Topic (alternate path) -->
  <rect x="260" y="320" width="200" height="55" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="360" y="345" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">SNS Topic</text>
  <text x="360" y="362" text-anchor="middle" font-size="10" fill="#64748b">Fan-out to SQS queues</text>

  <!-- Arrow from EventBridge to SNS -->
  <line x1="360" y1="290" x2="360" y2="318" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- SQS Queues (right side, between EventBridge and consumers) -->
  <rect x="520" y="80" width="130" height="50" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="585" y="102" text-anchor="middle" font-size="10" font-weight="600" fill="#1e293b">SQS: email-queue</text>
  <text x="585" y="118" text-anchor="middle" font-size="9" fill="#64748b">Visibility: 300s</text>

  <rect x="520" y="145" width="130" height="50" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="585" y="167" text-anchor="middle" font-size="10" font-weight="600" fill="#1e293b">SQS: analytics</text>
  <text x="585" y="183" text-anchor="middle" font-size="9" fill="#64748b">Batch: 10 msgs</text>

  <rect x="520" y="210" width="130" height="50" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="585" y="232" text-anchor="middle" font-size="10" font-weight="600" fill="#1e293b">SQS: fulfillment</text>
  <text x="585" y="248" text-anchor="middle" font-size="9" fill="#64748b">FIFO, dedup: 5min</text>

  <rect x="520" y="280" width="130" height="50" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="585" y="302" text-anchor="middle" font-size="10" font-weight="600" fill="#1e293b">SQS: DLQ</text>
  <text x="585" y="318" text-anchor="middle" font-size="9" fill="#ef4444">maxReceiveCount: 3</text>

  <!-- Arrows from EventBridge to SQS -->
  <line x1="460" y1="200" x2="518" y2="105" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
  <line x1="460" y1="215" x2="518" y2="170" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
  <line x1="460" y1="240" x2="518" y2="235" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrowPurple)"/>

  <!-- Consumers (far right) -->
  <rect x="680" y="80" width="100" height="50" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="730" y="102" text-anchor="middle" font-size="10" font-weight="600" fill="#1e293b">Lambda</text>
  <text x="730" y="118" text-anchor="middle" font-size="9" fill="#64748b">Email Sender</text>

  <rect x="680" y="145" width="100" height="50" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="730" y="167" text-anchor="middle" font-size="10" font-weight="600" fill="#1e293b">Lambda</text>
  <text x="730" y="183" text-anchor="middle" font-size="9" fill="#64748b">Analytics ETL</text>

  <rect x="680" y="210" width="100" height="50" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="730" y="232" text-anchor="middle" font-size="10" font-weight="600" fill="#1e293b">ECS Task</text>
  <text x="730" y="248" text-anchor="middle" font-size="9" fill="#64748b">Fulfillment</text>

  <!-- Arrows SQS to consumers -->
  <line x1="650" y1="105" x2="678" y2="105" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="650" y1="170" x2="678" y2="170" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="650" y1="235" x2="678" y2="235" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- DLQ arrow -->
  <line x1="585" y1="260" x2="585" y2="278" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- Pattern Comparison -->
  <rect x="50" y="390" width="700" height="115" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="415" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Choreography vs Orchestration</text>
  
  <rect x="70" y="425" width="300" height="65" rx="6" fill="#f0fdf4" stroke="#10b981" stroke-width="1"/>
  <text x="220" y="445" text-anchor="middle" font-size="11" font-weight="600" fill="#10b981">Choreography (EventBridge/SNS)</text>
  <text x="220" y="462" text-anchor="middle" font-size="10" fill="#64748b">Services react to events independently</text>
  <text x="220" y="477" text-anchor="middle" font-size="10" fill="#64748b">Loose coupling, hard to trace flows</text>

  <rect x="430" y="425" width="300" height="65" rx="6" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1"/>
  <text x="580" y="445" text-anchor="middle" font-size="11" font-weight="600" fill="#8b5cf6">Orchestration (Step Functions)</text>
  <text x="580" y="462" text-anchor="middle" font-size="10" fill="#64748b">Central coordinator manages flow</text>
  <text x="580" y="477" text-anchor="middle" font-size="10" fill="#64748b">Explicit flow, easy debugging</text>
</svg>