<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="800" height="550" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" fill="#f59e0b">
      <polygon points="0 0, 10 3.5, 0 7"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="550" rx="12" fill="url(#bgGrad)" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">DynamoDB Partition Layout</text>
  <line x1="260" y1="48" x2="540" y2="48" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>

  <!-- Table Level -->
  <rect x="150" y="65" width="500" height="45" rx="10" fill="#ffffff" stroke="#1e293b" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="93" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Table: Orders (On-Demand, 3000+ WCU Burst)</text>

  <!-- Hash Ring Visualization -->
  <text x="400" y="135" text-anchor="middle" font-size="12" font-weight="600" fill="#64748b">Hash Key Space: 0x0000...0000 → 0xFFFF...FFFF</text>
  <rect x="80" y="145" width="640" height="8" rx="4" fill="#e2e8f0"/>
  <!-- Partition ranges -->
  <rect x="80" y="145" width="160" height="8" rx="4" fill="#3b82f6" opacity="0.7"/>
  <rect x="240" y="145" width="160" height="8" rx="4" fill="#10b981" opacity="0.7"/>
  <rect x="400" y="145" width="160" height="8" rx="4" fill="#f59e0b" opacity="0.7"/>
  <rect x="560" y="145" width="160" height="8" rx="4" fill="#8b5cf6" opacity="0.7"/>

  <!-- Partition 1 -->
  <rect x="50" y="175" width="160" height="180" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="50" y="175" width="160" height="28" rx="10" fill="#3b82f6"/>
  <rect x="50" y="192" width="160" height="11" fill="#3b82f6"/>
  <text x="130" y="194" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">Partition 1</text>
  <text x="130" y="220" text-anchor="middle" font-size="10" fill="#64748b">Range: 0x00...0x3F</text>
  <text x="130" y="238" text-anchor="middle" font-size="10" fill="#64748b">Storage: B-Tree (10GB max)</text>
  <line x1="70" y1="248" x2="190" y2="248" stroke="#e2e8f0" stroke-width="1"/>
  <text x="75" y="265" font-size="10" fill="#1e293b">PK: USER#001</text>
  <text x="75" y="280" font-size="10" fill="#1e293b">PK: USER#042</text>
  <text x="75" y="295" font-size="10" fill="#1e293b">PK: USER#107</text>
  <text x="75" y="315" font-size="10" fill="#64748b">WCU: 1000/partition</text>
  <text x="75" y="330" font-size="10" fill="#64748b">RCU: 3000/partition</text>
  <rect x="60" y="337" width="140" height="14" rx="3" fill="#dbeafe"/>
  <text x="130" y="348" text-anchor="middle" font-size="9" fill="#3b82f6">Adaptive Capacity: ON</text>

  <!-- Partition 2 -->
  <rect x="230" y="175" width="160" height="180" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <rect x="230" y="175" width="160" height="28" rx="10" fill="#10b981"/>
  <rect x="230" y="192" width="160" height="11" fill="#10b981"/>
  <text x="310" y="194" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">Partition 2</text>
  <text x="310" y="220" text-anchor="middle" font-size="10" fill="#64748b">Range: 0x40...0x7F</text>
  <text x="310" y="238" text-anchor="middle" font-size="10" fill="#64748b">Storage: B-Tree (10GB max)</text>
  <line x1="250" y1="248" x2="370" y2="248" stroke="#e2e8f0" stroke-width="1"/>
  <text x="255" y="265" font-size="10" fill="#1e293b">PK: ORDER#A1</text>
  <text x="255" y="280" font-size="10" fill="#1e293b">PK: ORDER#B3</text>
  <text x="255" y="295" font-size="10" fill="#1e293b">PK: ORDER#C9</text>
  <text x="255" y="315" font-size="10" fill="#64748b">WCU: 1000/partition</text>
  <text x="255" y="330" font-size="10" fill="#64748b">RCU: 3000/partition</text>
  <rect x="240" y="337" width="140" height="14" rx="3" fill="#dcfce7"/>
  <text x="310" y="348" text-anchor="middle" font-size="9" fill="#10b981">Adaptive Capacity: ON</text>

  <!-- Partition 3 -->
  <rect x="410" y="175" width="160" height="180" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <rect x="410" y="175" width="160" height="28" rx="10" fill="#f59e0b"/>
  <rect x="410" y="192" width="160" height="11" fill="#f59e0b"/>
  <text x="490" y="194" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">Partition 3</text>
  <text x="490" y="220" text-anchor="middle" font-size="10" fill="#64748b">Range: 0x80...0xBF</text>
  <text x="490" y="238" text-anchor="middle" font-size="10" fill="#64748b">Storage: B-Tree (10GB max)</text>
  <line x1="430" y1="248" x2="550" y2="248" stroke="#e2e8f0" stroke-width="1"/>
  <text x="435" y="265" font-size="10" fill="#ef4444" font-weight="600">PK: HOT_KEY ← Hot!</text>
  <text x="435" y="280" font-size="10" fill="#1e293b">PK: PROD#X7</text>
  <text x="435" y="295" font-size="10" fill="#1e293b">PK: PROD#Z2</text>
  <text x="435" y="315" font-size="10" fill="#ef4444" font-weight="500">WCU: 2500/partition ↑</text>
  <text x="435" y="330" font-size="10" fill="#64748b">RCU: 3000/partition</text>
  <rect x="420" y="337" width="140" height="14" rx="3" fill="#fef3c7"/>
  <text x="490" y="348" text-anchor="middle" font-size="9" fill="#d97706">Borrowing from P4</text>

  <!-- Partition 4 -->
  <rect x="590" y="175" width="160" height="180" rx="10" fill="#ffffff" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="590" y="175" width="160" height="28" rx="10" fill="#8b5cf6"/>
  <rect x="590" y="192" width="160" height="11" fill="#8b5cf6"/>
  <text x="670" y="194" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">Partition 4</text>
  <text x="670" y="220" text-anchor="middle" font-size="10" fill="#64748b">Range: 0xC0...0xFF</text>
  <text x="670" y="238" text-anchor="middle" font-size="10" fill="#64748b">Storage: B-Tree (10GB max)</text>
  <line x1="610" y1="248" x2="730" y2="248" stroke="#e2e8f0" stroke-width="1"/>
  <text x="615" y="265" font-size="10" fill="#1e293b">PK: INV#001</text>
  <text x="615" y="280" font-size="10" fill="#1e293b">PK: INV#055</text>
  <text x="615" y="295" font-size="10" fill="#1e293b">PK: INV#200</text>
  <text x="615" y="315" font-size="10" fill="#64748b">WCU: 500/partition ↓</text>
  <text x="615" y="330" font-size="10" fill="#64748b">RCU: 1000/partition</text>
  <rect x="600" y="337" width="140" height="14" rx="3" fill="#f3e8ff"/>
  <text x="670" y="348" text-anchor="middle" font-size="9" fill="#8b5cf6">Lending to P3</text>

  <!-- Adaptive Capacity Arrow -->
  <path d="M 570 340 C 580 360, 590 360, 600 340" stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#arrowOrange)"/>
  <text x="585" y="375" text-anchor="middle" font-size="9" fill="#d97706">Borrow</text>

  <!-- Storage Node Info -->
  <rect x="100" y="385" width="600" height="70" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="408" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Storage Node Architecture</text>
  <text x="400" y="428" text-anchor="middle" font-size="11" fill="#64748b">Each partition → 3 Storage Nodes (replicas) across AZs | Leader handles writes | Eventually consistent reads from any replica</text>
  <text x="400" y="445" text-anchor="middle" font-size="11" fill="#64748b">Strongly consistent reads → Leader only | Global Tables → Multi-region active-active with last-writer-wins</text>

  <!-- Split explanation -->
  <rect x="100" y="470" width="600" height="65" rx="8" fill="#fefce8" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="400" y="493" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Partition Split Triggers</text>
  <text x="400" y="513" text-anchor="middle" font-size="11" fill="#78350f">Storage &gt; 10GB → Split by key range | Throughput &gt; 3000 RCU or 1000 WCU sustained → Split</text>
  <text x="400" y="528" text-anchor="middle" font-size="11" fill="#78350f">Splits are irreversible. You can go from 4 → 8 partitions, never back to 4.</text>
</svg>