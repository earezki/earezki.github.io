<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <marker id="arrowUp" markerWidth="10" markerHeight="7" refX="5" refY="0" orient="auto" fill="#64748b">
      <polygon points="0 7, 10 7, 5 0"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" rx="12" fill="url(#bgGrad)" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">CDK Construct Levels</text>
  <line x1="285" y1="48" x2="515" y2="48" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round"/>

  <!-- Abstraction arrow (left side) -->
  <line x1="35" y1="420" x2="35" y2="90" stroke="#64748b" stroke-width="2" marker-end="url(#arrowUp)"/>
  <text x="25" y="250" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b" transform="rotate(-90, 25, 250)">Abstraction Level</text>

  <!-- L3: Patterns (Top) -->
  <rect x="70" y="70" width="700" height="120" rx="12" fill="#ffffff" stroke="#8b5cf6" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="70" y="70" width="700" height="30" rx="12" fill="#8b5cf6"/>
  <rect x="70" y="88" width="700" height="12" fill="#8b5cf6"/>
  <text x="420" y="91" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">L3 — Patterns (opinionated multi-resource constructs)</text>

  <rect x="95" y="110" width="190" height="60" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="190" y="132" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">LambdaRestApi</text>
  <text x="190" y="148" text-anchor="middle" font-size="9" fill="#64748b">Creates: API GW + Lambda +</text>
  <text x="190" y="161" text-anchor="middle" font-size="9" fill="#64748b">IAM + CloudWatch Logs</text>

  <rect x="305" y="110" width="190" height="60" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="400" y="132" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">ApplicationLoadBalancedFargateService</text>
  <text x="400" y="148" text-anchor="middle" font-size="9" fill="#64748b">Creates: ALB + ECS Cluster +</text>
  <text x="400" y="161" text-anchor="middle" font-size="9" fill="#64748b">Service + Task Def + SGs</text>

  <rect x="515" y="110" width="190" height="60" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="610" y="132" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">CodePipeline</text>
  <text x="610" y="148" text-anchor="middle" font-size="9" fill="#64748b">Creates: Pipeline + Build +</text>
  <text x="610" y="161" text-anchor="middle" font-size="9" fill="#64748b">Deploy + Roles + Artifacts</text>

  <!-- L2: Curated (Middle) -->
  <rect x="70" y="210" width="700" height="120" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="70" y="210" width="700" height="30" rx="12" fill="#3b82f6"/>
  <rect x="70" y="228" width="700" height="12" fill="#3b82f6"/>
  <text x="420" y="231" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">L2 — Curated (intent-based, sensible defaults)</text>

  <rect x="95" y="250" width="150" height="60" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="170" y="272" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">s3.Bucket</text>
  <text x="170" y="288" text-anchor="middle" font-size="9" fill="#64748b">.grant_read(fn)</text>
  <text x="170" y="301" text-anchor="middle" font-size="9" fill="#64748b">auto-creates IAM policy</text>

  <rect x="265" y="250" width="150" height="60" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="340" y="272" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">lambda_.Function</text>
  <text x="340" y="288" text-anchor="middle" font-size="9" fill="#64748b">Auto: LogGroup, Role,</text>
  <text x="340" y="301" text-anchor="middle" font-size="9" fill="#64748b">DLQ, retry config</text>

  <rect x="435" y="250" width="150" height="60" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="510" y="272" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">dynamodb.Table</text>
  <text x="510" y="288" text-anchor="middle" font-size="9" fill="#64748b">Auto-scaling, GSI,</text>
  <text x="510" y="301" text-anchor="middle" font-size="9" fill="#64748b">encryption, streams</text>

  <rect x="605" y="250" width="150" height="60" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="680" y="272" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">ec2.Vpc</text>
  <text x="680" y="288" text-anchor="middle" font-size="9" fill="#64748b">Subnets, NATGw, IGW,</text>
  <text x="680" y="301" text-anchor="middle" font-size="9" fill="#64748b">route tables, NACLs</text>

  <!-- L1: CFN Resources (Bottom) -->
  <rect x="70" y="350" width="700" height="120" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="70" y="350" width="700" height="30" rx="12" fill="#64748b"/>
  <rect x="70" y="368" width="700" height="12" fill="#64748b"/>
  <text x="420" y="371" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">L1 — CFN Resources (1:1 CloudFormation mapping)</text>

  <rect x="95" y="390" width="150" height="60" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="170" y="412" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">CfnBucket</text>
  <text x="170" y="428" text-anchor="middle" font-size="9" fill="#64748b">Every CFN property</text>
  <text x="170" y="441" text-anchor="middle" font-size="9" fill="#64748b">exposed verbatim</text>

  <rect x="265" y="390" width="150" height="60" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="340" y="412" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">CfnFunction</text>
  <text x="340" y="428" text-anchor="middle" font-size="9" fill="#64748b">No defaults, no grants,</text>
  <text x="340" y="441" text-anchor="middle" font-size="9" fill="#64748b">manual IAM wiring</text>

  <rect x="435" y="390" width="150" height="60" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="510" y="412" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">CfnTable</text>
  <text x="510" y="428" text-anchor="middle" font-size="9" fill="#64748b">Raw properties,</text>
  <text x="510" y="441" text-anchor="middle" font-size="9" fill="#64748b">escape hatch target</text>

  <rect x="605" y="390" width="150" height="60" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="680" y="412" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">CfnVPC</text>
  <text x="680" y="428" text-anchor="middle" font-size="9" fill="#64748b">No subnet allocation,</text>
  <text x="680" y="441" text-anchor="middle" font-size="9" fill="#64748b">manual CIDR math</text>

  <!-- Bottom wisdom -->
  <rect x="70" y="480" width="700" height="30" rx="6" fill="#fefce8" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="420" y="500" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">Use L2 by default → L3 for common patterns → L1 escape hatch when L2 is missing a property</text>
</svg>