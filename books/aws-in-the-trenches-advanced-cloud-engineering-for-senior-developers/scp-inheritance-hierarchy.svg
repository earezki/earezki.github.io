<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="800" height="550" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <marker id="arrowDown" markerWidth="10" markerHeight="7" refX="5" refY="7" orient="auto" fill="#64748b">
      <polygon points="0 0, 10 0, 5 7"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="550" rx="12" fill="url(#bgGrad)" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">SCP Inheritance Hierarchy</text>
  <line x1="270" y1="48" x2="530" y2="48" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>

  <!-- Management Account (Root) -->
  <rect x="275" y="65" width="250" height="60" rx="10" fill="#ffffff" stroke="#1e293b" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="275" y="65" width="250" height="24" rx="10" fill="#1e293b"/>
  <rect x="275" y="78" width="250" height="11" fill="#1e293b"/>
  <text x="400" y="83" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">Management Account (Root)</text>
  <text x="400" y="108" text-anchor="middle" font-size="11" fill="#64748b">FullAWSAccess (implicit)</text>
  <text x="400" y="120" text-anchor="middle" font-size="10" fill="#94a3b8">SCPs don't affect this account</text>

  <!-- Arrows from root to OUs -->
  <line x1="320" y1="125" x2="200" y2="165" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="480" y1="125" x2="600" y2="165" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- OU: Production -->
  <rect x="80" y="167" width="240" height="70" rx="10" fill="#ffffff" stroke="#ef4444" stroke-width="2" filter="url(#shadow)"/>
  <rect x="80" y="167" width="240" height="24" rx="10" fill="#ef4444"/>
  <rect x="80" y="180" width="240" height="11" fill="#ef4444"/>
  <text x="200" y="185" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">OU: Production</text>
  <text x="200" y="210" text-anchor="middle" font-size="11" fill="#1e293b" font-weight="500">SCP: DenyRegionsExceptUsEast</text>
  <text x="200" y="226" text-anchor="middle" font-size="11" fill="#1e293b" font-weight="500">SCP: DenyDeleteCriticalResources</text>

  <!-- OU: Development -->
  <rect x="480" y="167" width="240" height="70" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="480" y="167" width="240" height="24" rx="10" fill="#3b82f6"/>
  <rect x="480" y="180" width="240" height="11" fill="#3b82f6"/>
  <text x="600" y="185" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">OU: Development</text>
  <text x="600" y="210" text-anchor="middle" font-size="11" fill="#1e293b" font-weight="500">SCP: DenyExpensiveInstances</text>
  <text x="600" y="226" text-anchor="middle" font-size="11" fill="#1e293b" font-weight="500">SCP: AllowAllExceptBilling</text>

  <!-- Arrows to child accounts -->
  <line x1="150" y1="237" x2="150" y2="280" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="250" y1="237" x2="250" y2="280" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="550" y1="237" x2="550" y2="280" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="650" y1="237" x2="650" y2="280" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Prod Account 1 -->
  <rect x="80" y="282" width="140" height="55" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="150" y="303" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">Workloads-Prod</text>
  <text x="150" y="320" text-anchor="middle" font-size="10" fill="#64748b">Account: 111...</text>
  <text x="150" y="333" text-anchor="middle" font-size="9" fill="#ef4444">Inherits: 2 SCPs</text>

  <!-- Prod Account 2 -->
  <rect x="180" y="282" width="140" height="55" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="250" y="303" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">Data-Prod</text>
  <text x="250" y="320" text-anchor="middle" font-size="10" fill="#64748b">Account: 222...</text>
  <text x="250" y="333" text-anchor="middle" font-size="9" fill="#ef4444">Inherits: 2 SCPs</text>

  <!-- Dev Account 1 -->
  <rect x="480" y="282" width="140" height="55" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="550" y="303" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">Team-Alpha</text>
  <text x="550" y="320" text-anchor="middle" font-size="10" fill="#64748b">Account: 333...</text>
  <text x="550" y="333" text-anchor="middle" font-size="9" fill="#3b82f6">Inherits: 2 SCPs</text>

  <!-- Dev Account 2 -->
  <rect x="580" y="282" width="140" height="55" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="650" y="303" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">Team-Beta</text>
  <text x="650" y="320" text-anchor="middle" font-size="10" fill="#64748b">Account: 444...</text>
  <text x="650" y="333" text-anchor="middle" font-size="9" fill="#3b82f6">Inherits: 2 SCPs</text>

  <!-- Effective Permissions Box -->
  <rect x="60" y="365" width="680" height="95" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="388" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Effective Permission = INTERSECTION of all policies</text>

  <text x="80" y="415" font-size="12" fill="#1e293b" font-weight="500">Workloads-Prod effective:</text>
  <text x="80" y="435" font-size="11" fill="#64748b">Identity Policy ∩ Permission Boundary ∩ SCP(DenyRegions) ∩ SCP(DenyDelete) ∩ Session Policy</text>

  <!-- Key Insight -->
  <rect x="60" y="475" width="680" height="60" rx="8" fill="#fefce8" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="400" y="498" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Key Insight: SCPs are deny-lists by convention, not allow-lists</text>
  <text x="400" y="518" text-anchor="middle" font-size="11" fill="#78350f">Remove FullAWSAccess SCP → All actions denied. SCPs limit the maximum possible permissions.</text>
</svg>