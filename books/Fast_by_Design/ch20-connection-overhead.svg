<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650">
  <rect width="900" height="650" rx="8" fill="#1e1e2e"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="15" font-weight="bold">Connection Lifecycle: Direct vs PgBouncer</text>

  <!-- Left side: Direct Connection -->
  <text x="225" y="60" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="12" font-weight="bold">Direct Connection (per-request)</text>

  <!-- Client box -->
  <rect x="50" y="80" width="120" height="36" rx="4" fill="#181825" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="110" y="102" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="10">Java Client</text>

  <!-- Arrow: connect -->
  <line x1="110" y1="116" x2="110" y2="140" stroke="#f38ba8" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <text x="170" y="133" fill="#f38ba8" font-family="monospace" font-size="8">TCP + fork (5-15ms)</text>

  <!-- Postmaster -->
  <rect x="50" y="140" width="120" height="30" rx="4" fill="#181825" stroke="#45475a" stroke-width="1"/>
  <text x="110" y="159" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="9">postmaster fork()</text>

  <!-- Arrow: backend created -->
  <line x1="110" y1="170" x2="110" y2="195" stroke="#f38ba8" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <text x="185" y="187" fill="#f38ba8" font-family="monospace" font-size="8">alloc 28MB RSS</text>

  <!-- Backend process -->
  <rect x="40" y="195" width="140" height="60" rx="4" fill="#181825" stroke="#f38ba8" stroke-width="2"/>
  <text x="110" y="212" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="9">Backend Process</text>
  <text x="110" y="226" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="8">catalog cache: 4MB</text>
  <text x="110" y="238" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="8">work_mem: 32MB max</text>
  <text x="110" y="250" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="8">plan cache: 2MB</text>

  <!-- Arrow: query -->
  <line x1="110" y1="255" x2="110" y2="280" stroke="#cdd6f4" stroke-width="1" marker-end="url(#arrowWhite)"/>
  <text x="170" y="272" fill="#cdd6f4" font-family="monospace" font-size="8">query (4ms)</text>

  <!-- Arrow: disconnect -->
  <line x1="110" y1="280" x2="110" y2="310" stroke="#f38ba8" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <text x="180" y="300" fill="#f38ba8" font-family="monospace" font-size="8">disconnect + exit</text>

  <!-- Total time box -->
  <rect x="50" y="315" width="160" height="30" rx="4" fill="#302030" stroke="#f38ba8" stroke-width="1"/>
  <text x="130" y="334" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="9">Total: 12.4ms/query</text>

  <!-- Memory at 200 connections -->
  <rect x="30" y="360" width="200" height="55" rx="4" fill="#181825" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="130" y="378" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="10" font-weight="bold">200 Connections</text>
  <text x="130" y="393" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="9">200 backend processes</text>
  <text x="130" y="406" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="9">Memory: 6.1 GB</text>

  <!-- Right side: PgBouncer -->
  <text x="650" y="60" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="12" font-weight="bold">PgBouncer Transaction Mode</text>

  <!-- Client box -->
  <rect x="560" y="80" width="120" height="36" rx="4" fill="#181825" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="620" y="102" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="10">Java Client</text>

  <!-- Arrow: connect to PgBouncer -->
  <line x1="620" y1="116" x2="620" y2="145" stroke="#a6e3a1" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="710" y="133" fill="#a6e3a1" font-family="monospace" font-size="8">TCP only (0.1ms)</text>

  <!-- PgBouncer box -->
  <rect x="545" y="145" width="150" height="50" rx="4" fill="#181825" stroke="#a6e3a1" stroke-width="2"/>
  <text x="620" y="164" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="10" font-weight="bold">PgBouncer</text>
  <text x="620" y="178" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="8">event loop, 2KB/client</text>
  <text x="620" y="190" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="8">multiplexes N:M</text>

  <!-- Arrow: assign connection -->
  <line x1="620" y1="195" x2="620" y2="225" stroke="#a6e3a1" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="720" y="214" fill="#a6e3a1" font-family="monospace" font-size="8">assign (0.05ms)</text>

  <!-- Backend pool -->
  <rect x="540" y="225" width="160" height="80" rx="4" fill="#181825" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="620" y="244" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="10">Backend Pool (20)</text>
  <text x="620" y="260" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="8">warm plan caches</text>
  <text x="620" y="274" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="8">persistent connections</text>
  <text x="620" y="288" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="8">shared catalog cache</text>

  <!-- Arrow: query -->
  <line x1="620" y1="305" x2="620" y2="330" stroke="#cdd6f4" stroke-width="1" marker-end="url(#arrowWhite)"/>
  <text x="700" y="322" fill="#cdd6f4" font-family="monospace" font-size="8">query (4ms)</text>

  <!-- Arrow: return to pool -->
  <line x1="630" y1="330" x2="630" y2="355" stroke="#a6e3a1" stroke-width="1" marker-end="url(#arrowGreen)"/>
  <text x="720" y="347" fill="#a6e3a1" font-family="monospace" font-size="8">return to pool</text>

  <!-- Total time box -->
  <rect x="550" y="360" width="160" height="30" rx="4" fill="#203020" stroke="#a6e3a1" stroke-width="1"/>
  <text x="630" y="379" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="9">Total: 4.5ms/query</text>

  <!-- Memory at 200 connections -->
  <rect x="530" y="405" width="200" height="55" rx="4" fill="#181825" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="630" y="423" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="10" font-weight="bold">200 Clients</text>
  <text x="630" y="438" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="9">20 backend processes</text>
  <text x="630" y="451" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="9">Memory: 0.6 GB + 48 MB</text>

  <!-- Comparison arrow -->
  <line x1="250" y1="390" x2="520" y2="430" stroke="#cdd6f4" stroke-width="1" stroke-dasharray="4" opacity="0.5"/>

  <!-- Savings box -->
  <rect x="300" y="480" width="300" height="80" rx="6" fill="#181825" stroke="#89b4fa" stroke-width="2"/>
  <text x="450" y="502" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="11" font-weight="bold">PgBouncer Savings</text>
  <text x="450" y="520" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="10">Memory: 6.1 GB -> 0.65 GB (-89%)</text>
  <text x="450" y="536" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="10">Latency: 12.4ms -> 4.5ms (-64%)</text>
  <text x="450" y="552" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="10">Context switches: 14,200 -> 2,100/sec</text>

  <!-- Bottom note -->
  <text x="450" y="590" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="9">Content platform: 200 readers + 10 writers through 20-connection pool</text>
  <text x="450" y="608" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="9">Each reader occupies backend for 5% of time (4ms query / 100ms interval)</text>

  <!-- Scale indicator -->
  <rect x="30" y="440" width="200" height="40" rx="4" fill="#302020" stroke="#f38ba8" stroke-width="1" stroke-dasharray="3"/>
  <text x="130" y="456" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="8">At 500 connections:</text>
  <text x="130" y="470" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="9" font-weight="bold">16.2 GB -> SWAP -> CRASH</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f38ba8"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#a6e3a1"/>
    </marker>
    <marker id="arrowWhite" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#cdd6f4"/>
    </marker>
  </defs>
</svg>
