<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620">
  <defs>
    <marker id="arrBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#89b4fa"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a6e3a1"/>
    </marker>
    <marker id="arrRed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f38ba8"/>
    </marker>
  </defs>
  <rect width="900" height="620" rx="8" fill="#1e1e2e"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="16" font-weight="bold">Collection Memory Layout: ArrayList vs LinkedList</text>

  <!-- === TOP PANEL: ArrayList === -->
  <rect x="20" y="50" width="860" height="230" rx="6" fill="#181825" stroke="#45475a" stroke-width="1"/>
  <text x="450" y="75" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="13" font-weight="bold">ArrayList: Contiguous Object[] Backing Array</text>

  <!-- Array header -->
  <rect x="50" y="95" width="120" height="30" rx="3" fill="#313244" stroke="#45475a" stroke-width="1"/>
  <text x="110" y="114" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="9">Object[] header</text>
  <text x="110" y="136" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="8">16 bytes + length</text>

  <!-- Array slots (references) -->
  <rect x="180" y="95" width="50" height="30" rx="2" fill="#89b4fa" opacity="0.8"/>
  <text x="205" y="114" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="8" font-weight="bold">[0]</text>
  <rect x="232" y="95" width="50" height="30" rx="2" fill="#89b4fa" opacity="0.8"/>
  <text x="257" y="114" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="8" font-weight="bold">[1]</text>
  <rect x="284" y="95" width="50" height="30" rx="2" fill="#89b4fa" opacity="0.8"/>
  <text x="309" y="114" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="8" font-weight="bold">[2]</text>
  <rect x="336" y="95" width="50" height="30" rx="2" fill="#89b4fa" opacity="0.8"/>
  <text x="361" y="114" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="8" font-weight="bold">[3]</text>
  <rect x="388" y="95" width="50" height="30" rx="2" fill="#89b4fa" opacity="0.8"/>
  <text x="413" y="114" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="8" font-weight="bold">[4]</text>
  <rect x="440" y="95" width="50" height="30" rx="2" fill="#89b4fa" opacity="0.8"/>
  <text x="465" y="114" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="8" font-weight="bold">[5]</text>
  <rect x="492" y="95" width="50" height="30" rx="2" fill="#89b4fa" opacity="0.8"/>
  <text x="517" y="114" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="8" font-weight="bold">[6]</text>
  <rect x="544" y="95" width="50" height="30" rx="2" fill="#89b4fa" opacity="0.8"/>
  <text x="569" y="114" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="8" font-weight="bold">[7]</text>
  <text x="610" y="114" fill="#6c7086" font-family="monospace" font-size="10">...</text>

  <!-- Per-element annotation -->
  <text x="205" y="88" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="7">4B</text>
  <text x="257" y="88" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="7">4B</text>
  <text x="309" y="88" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="7">4B</text>
  <text x="361" y="88" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="7">4B</text>

  <!-- Cache line overlay -->
  <rect x="180" y="127" width="416" height="16" rx="2" fill="#a6e3a1" opacity="0.15" stroke="#a6e3a1" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="388" y="139" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="8">64-byte cache line = 16 consecutive references</text>

  <!-- Prefetcher arrows -->
  <line x1="600" y1="135" x2="700" y2="135" stroke="#a6e3a1" stroke-width="1.5" marker-end="url(#arrGreen)"/>
  <line x1="710" y1="135" x2="810" y2="135" stroke="#a6e3a1" stroke-width="1.5" marker-end="url(#arrGreen)"/>
  <text x="740" y="150" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="8">Prefetcher loads ahead</text>

  <!-- Element objects -->
  <text x="110" y="175" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="9">Element objects (separate heap locations, but refs are packed):</text>
  <rect x="120" y="185" width="80" height="24" rx="2" fill="#89b4fa" opacity="0.4"/>
  <text x="160" y="201" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="8">Article-0</text>
  <rect x="230" y="185" width="80" height="24" rx="2" fill="#89b4fa" opacity="0.4"/>
  <text x="270" y="201" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="8">Article-1</text>
  <rect x="340" y="185" width="80" height="24" rx="2" fill="#89b4fa" opacity="0.4"/>
  <text x="380" y="201" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="8">Article-2</text>
  <rect x="450" y="185" width="80" height="24" rx="2" fill="#89b4fa" opacity="0.4"/>
  <text x="490" y="201" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="8">Article-3</text>

  <!-- Arrows from array slots to elements -->
  <line x1="205" y1="125" x2="160" y2="185" stroke="#89b4fa" stroke-width="1" opacity="0.5"/>
  <line x1="257" y1="125" x2="270" y2="185" stroke="#89b4fa" stroke-width="1" opacity="0.5"/>
  <line x1="309" y1="125" x2="380" y2="185" stroke="#89b4fa" stroke-width="1" opacity="0.5"/>
  <line x1="361" y1="125" x2="490" y2="185" stroke="#89b4fa" stroke-width="1" opacity="0.5"/>

  <!-- Memory summary -->
  <text x="450" y="248" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="11">Per element: 4 bytes (ref) | 10,000 elements = ~39 KB backing array</text>
  <text x="450" y="265" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="10">Sequential access pattern: L1 cache hits, prefetcher effective</text>

  <!-- === BOTTOM PANEL: LinkedList === -->
  <rect x="20" y="295" width="860" height="300" rx="6" fill="#181825" stroke="#45475a" stroke-width="1"/>
  <text x="450" y="320" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="13" font-weight="bold">LinkedList: Scattered Node Objects on Heap</text>

  <!-- Node 0 -->
  <rect x="50" y="340" width="140" height="70" rx="3" fill="#313244" stroke="#f38ba8" stroke-width="1" opacity="0.8"/>
  <text x="120" y="358" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="8" font-weight="bold">Node (32 bytes)</text>
  <line x1="55" y1="363" x2="185" y2="363" stroke="#45475a" stroke-width="0.5"/>
  <text x="65" y="376" fill="#6c7086" font-family="monospace" font-size="7">header: 12B</text>
  <text x="65" y="387" fill="#6c7086" font-family="monospace" font-size="7">item:    4B</text>
  <text x="65" y="398" fill="#f38ba8" font-family="monospace" font-size="7">next:    4B  ----></text>
  <text x="65" y="409" fill="#6c7086" font-family="monospace" font-size="7">prev:    4B</text>

  <!-- Node 1 (offset position to show scatter) -->
  <rect x="260" y="370" width="140" height="70" rx="3" fill="#313244" stroke="#f38ba8" stroke-width="1" opacity="0.8"/>
  <text x="330" y="388" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="8" font-weight="bold">Node (32 bytes)</text>
  <line x1="265" y1="393" x2="395" y2="393" stroke="#45475a" stroke-width="0.5"/>
  <text x="275" y="406" fill="#6c7086" font-family="monospace" font-size="7">header: 12B</text>
  <text x="275" y="417" fill="#6c7086" font-family="monospace" font-size="7">item:    4B</text>
  <text x="275" y="428" fill="#f38ba8" font-family="monospace" font-size="7">next:    4B  ----></text>
  <text x="275" y="439" fill="#6c7086" font-family="monospace" font-size="7">prev:    4B</text>

  <!-- Node 2 (scattered up) -->
  <rect x="470" y="340" width="140" height="70" rx="3" fill="#313244" stroke="#f38ba8" stroke-width="1" opacity="0.8"/>
  <text x="540" y="358" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="8" font-weight="bold">Node (32 bytes)</text>
  <line x1="475" y1="363" x2="605" y2="363" stroke="#45475a" stroke-width="0.5"/>
  <text x="485" y="376" fill="#6c7086" font-family="monospace" font-size="7">header: 12B</text>
  <text x="485" y="387" fill="#6c7086" font-family="monospace" font-size="7">item:    4B</text>
  <text x="485" y="398" fill="#f38ba8" font-family="monospace" font-size="7">next:    4B  ----></text>
  <text x="485" y="409" fill="#6c7086" font-family="monospace" font-size="7">prev:    4B</text>

  <!-- Node 3 (scattered down) -->
  <rect x="680" y="380" width="140" height="70" rx="3" fill="#313244" stroke="#f38ba8" stroke-width="1" opacity="0.8"/>
  <text x="750" y="398" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="8" font-weight="bold">Node (32 bytes)</text>
  <line x1="685" y1="403" x2="815" y2="403" stroke="#45475a" stroke-width="0.5"/>
  <text x="695" y="416" fill="#6c7086" font-family="monospace" font-size="7">header: 12B</text>
  <text x="695" y="427" fill="#6c7086" font-family="monospace" font-size="7">item:    4B</text>
  <text x="695" y="438" fill="#6c7086" font-family="monospace" font-size="7">next:    4B</text>
  <text x="695" y="449" fill="#6c7086" font-family="monospace" font-size="7">prev:    4B</text>

  <!-- Pointer chase arrows (zig-zagging to show random access) -->
  <line x1="190" y1="395" x2="258" y2="405" stroke="#f38ba8" stroke-width="1.5" marker-end="url(#arrRed)" stroke-dasharray="5,3"/>
  <line x1="400" y1="415" x2="468" y2="375" stroke="#f38ba8" stroke-width="1.5" marker-end="url(#arrRed)" stroke-dasharray="5,3"/>
  <line x1="610" y1="385" x2="678" y2="410" stroke="#f38ba8" stroke-width="1.5" marker-end="url(#arrRed)" stroke-dasharray="5,3"/>

  <!-- Cache miss annotations -->
  <text x="225" y="345" fill="#f38ba8" font-family="monospace" font-size="8">CACHE MISS</text>
  <text x="430" y="445" fill="#f38ba8" font-family="monospace" font-size="8">CACHE MISS</text>
  <text x="640" y="370" fill="#f38ba8" font-family="monospace" font-size="8">CACHE MISS</text>

  <!-- Prefetcher note -->
  <text x="450" y="475" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="9">Each next pointer dereference = random heap address = prefetcher defeated</text>

  <!-- Memory summary -->
  <text x="450" y="505" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="11">Per element: 32 bytes (Node) | 10,000 elements = ~312 KB of Nodes</text>
  <text x="450" y="522" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="10">8x memory overhead | Pointer-chasing: L2/L3 cache misses per hop</text>

  <!-- Bottom comparison bar -->
  <rect x="50" y="550" width="380" height="24" rx="3" fill="#a6e3a1" opacity="0.2" stroke="#a6e3a1" stroke-width="1"/>
  <text x="240" y="566" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="10" font-weight="bold">ArrayList: 39 KB | cache-friendly | 6-12x faster iteration</text>
  <rect x="470" y="550" width="380" height="24" rx="3" fill="#f38ba8" opacity="0.2" stroke="#f38ba8" stroke-width="1"/>
  <text x="660" y="566" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="10" font-weight="bold">LinkedList: 312 KB | cache-hostile | 8x memory overhead</text>

  <!-- Footer -->
  <text x="450" y="600" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="9">Memory layout determines performance more than algorithmic complexity</text>
</svg>