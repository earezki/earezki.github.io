<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620">
  <rect width="900" height="620" rx="8" fill="#1e1e2e"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="16" font-weight="bold">Cache Stampede Timeline: Expiration vs Proactive Refresh</text>

  <!-- Scenario 1: Stampede (top) -->
  <text x="450" y="60" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="12" font-weight="bold">Scenario 1: Naive Cache (Stampede)</text>
  <rect x="60" y="75" width="800" height="200" rx="4" fill="#181825" stroke="#45475a" stroke-width="1"/>

  <!-- Timeline axis -->
  <line x1="100" y1="250" x2="820" y2="250" stroke="#6c7086" stroke-width="1"/>
  <text x="100" y="268" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="9">0ms</text>
  <text x="250" y="268" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="9">50ms</text>
  <text x="400" y="268" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="9">100ms</text>
  <text x="550" y="268" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="9">200ms</text>
  <text x="700" y="268" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="9">300ms</text>

  <!-- Cache entry expires -->
  <line x1="100" y1="85" x2="100" y2="245" stroke="#f38ba8" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="105" y="95" fill="#f38ba8" font-family="monospace" font-size="9">TTL expires</text>

  <!-- Concurrent requests hitting DB (red bars) -->
  <rect x="105" y="108" width="140" height="8" rx="2" fill="#f38ba8" opacity="0.8"/>
  <text x="250" y="116" fill="#f38ba8" font-family="monospace" font-size="8">Req A -> DB query</text>
  <rect x="108" y="120" width="145" height="8" rx="2" fill="#f38ba8" opacity="0.7"/>
  <text x="258" y="128" fill="#f38ba8" font-family="monospace" font-size="8">Req B -> DB query</text>
  <rect x="112" y="132" width="138" height="8" rx="2" fill="#f38ba8" opacity="0.6"/>
  <text x="255" y="140" fill="#f38ba8" font-family="monospace" font-size="8">Req C -> DB query</text>
  <rect x="115" y="144" width="150" height="8" rx="2" fill="#f38ba8" opacity="0.5"/>
  <rect x="118" y="156" width="142" height="8" rx="2" fill="#f38ba8" opacity="0.4"/>
  <rect x="120" y="168" width="155" height="8" rx="2" fill="#f38ba8" opacity="0.3"/>
  <text x="280" y="160" fill="#f38ba8" font-family="monospace" font-size="8">...497 more queries</text>

  <!-- Connection pool exhaustion -->
  <rect x="250" y="182" width="200" height="22" rx="3" fill="#f38ba8" opacity="0.2" stroke="#f38ba8" stroke-width="1"/>
  <text x="350" y="197" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="9" font-weight="bold">DB Pool Exhausted: 500 errors</text>

  <!-- Cache repopulated -->
  <line x1="550" y1="85" x2="550" y2="245" stroke="#a6e3a1" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="555" y="95" fill="#a6e3a1" font-family="monospace" font-size="9">Cache repopulated</text>

  <!-- Recovery -->
  <rect x="555" y="108" width="240" height="16" rx="3" fill="#a6e3a1" opacity="0.2"/>
  <text x="675" y="120" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="9">Normal: cache hits resume</text>

  <!-- Impact annotation -->
  <rect x="555" y="182" width="240" height="36" rx="3" fill="#313244" stroke="#f38ba8" stroke-width="1"/>
  <text x="675" y="198" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="9" font-weight="bold">Impact: 150+ failed requests</text>
  <text x="675" y="212" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="8">P99 latency spike to 2000ms+</text>

  <!-- Scenario 2: Proactive Refresh (bottom) -->
  <text x="450" y="300" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="12" font-weight="bold">Scenario 2: Caffeine + refreshAfterWrite (No Stampede)</text>
  <rect x="60" y="315" width="800" height="200" rx="4" fill="#181825" stroke="#45475a" stroke-width="1"/>

  <!-- Timeline axis -->
  <line x1="100" y1="490" x2="820" y2="490" stroke="#6c7086" stroke-width="1"/>
  <text x="100" y="508" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="9">T-60s</text>
  <text x="250" y="508" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="9">T-30s</text>
  <text x="400" y="508" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="9">Refresh</text>
  <text x="550" y="508" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="9">T+30s</text>
  <text x="700" y="508" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="9">T+60s</text>

  <!-- Cache serving stale (green, continuous) -->
  <rect x="100" y="340" width="700" height="16" rx="3" fill="#a6e3a1" opacity="0.3"/>
  <text x="450" y="352" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="9">Serving from cache (no interruption)</text>

  <!-- Proactive refresh trigger -->
  <line x1="400" y1="325" x2="400" y2="485" stroke="#89b4fa" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="405" y="375" fill="#89b4fa" font-family="monospace" font-size="9">refreshAfterWrite triggers</text>

  <!-- Single async DB query -->
  <rect x="400" y="390" width="80" height="12" rx="2" fill="#89b4fa" opacity="0.8"/>
  <text x="485" y="400" fill="#89b4fa" font-family="monospace" font-size="8">1 async DB query</text>

  <!-- All other requests served from stale cache -->
  <rect x="400" y="410" width="80" height="8" rx="2" fill="#a6e3a1" opacity="0.5"/>
  <text x="485" y="418" fill="#a6e3a1" font-family="monospace" font-size="8">Req A -> stale cache (fast)</text>
  <rect x="405" y="422" width="75" height="8" rx="2" fill="#a6e3a1" opacity="0.5"/>
  <text x="485" y="430" fill="#a6e3a1" font-family="monospace" font-size="8">Req B -> stale cache (fast)</text>
  <rect x="410" y="434" width="70" height="8" rx="2" fill="#a6e3a1" opacity="0.5"/>
  <text x="485" y="442" fill="#a6e3a1" font-family="monospace" font-size="8">Req C-Z -> stale cache (fast)</text>

  <!-- Cache updated -->
  <line x1="480" y1="325" x2="480" y2="485" stroke="#a6e3a1" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="485" y="465" fill="#a6e3a1" font-family="monospace" font-size="9">Fresh value cached</text>

  <!-- Impact annotation -->
  <rect x="555" y="395" width="240" height="36" rx="3" fill="#313244" stroke="#a6e3a1" stroke-width="1"/>
  <text x="675" y="411" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="9" font-weight="bold">Impact: 0 failed requests</text>
  <text x="675" y="425" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="8">P99 latency unchanged: 3ms</text>

  <!-- Comparison box -->
  <rect x="150" y="535" width="600" height="65" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="1"/>
  <text x="450" y="555" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="11" font-weight="bold">Stampede Prevention Summary</text>
  <text x="450" y="572" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="9">Naive: 500 DB queries, 150 failures, 2000ms P99 spike</text>
  <text x="450" y="589" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="9">Caffeine refresh: 1 DB query, 0 failures, 3ms P99 steady</text>
</svg>
