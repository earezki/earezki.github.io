<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520">
  <defs>
    <style>
      text { font-family: 'Consolas', 'Monaco', monospace; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="520" fill="#1e1e2e" rx="8"/>
  
  <!-- Title -->
  <text x="450" y="30" fill="#cdd6f4" font-size="14" font-weight="bold" text-anchor="middle">CPU Flame Graph: Content Platform /api/articles/{id} Request</text>
  
  <!-- Flame graph frames - bottom up (root at bottom) -->
  
  <!-- Root frame: Thread.run -->
  <rect x="20" y="460" width="860" height="28" fill="#45475a" rx="2"/>
  <text x="450" y="479" fill="#cdd6f4" font-size="11" text-anchor="middle">java.lang.Thread.run (100%)</text>
  
  <!-- Level 1: Tomcat worker -->
  <rect x="20" y="428" width="860" height="28" fill="#585b70" rx="2"/>
  <text x="450" y="447" fill="#cdd6f4" font-size="11" text-anchor="middle">o.a.tomcat.util.threads.TaskThread$WrappingRunnable.run (100%)</text>
  
  <!-- Level 2: Spring DispatcherServlet -->
  <rect x="20" y="396" width="860" height="28" fill="#6c7086" rx="2"/>
  <text x="450" y="415" fill="#cdd6f4" font-size="11" text-anchor="middle">o.s.web.servlet.DispatcherServlet.doDispatch (98.2%)</text>
  
  <!-- Level 3: Split into controller + filter chain -->
  <rect x="20" y="364" width="680" height="28" fill="#7f849c" rx="2"/>
  <text x="360" y="383" fill="#cdd6f4" font-size="11" text-anchor="middle">ArticleController.getArticle (78.5%)</text>
  
  <rect x="704" y="364" width="176" height="28" fill="#585b70" rx="2"/>
  <text x="792" y="383" fill="#cdd6f4" font-size="11" text-anchor="middle">FilterChain (19.7%)</text>
  
  <!-- Level 4: Split into service methods -->
  <rect x="20" y="332" width="420" height="28" fill="#89b4fa" rx="2"/>
  <text x="230" y="351" fill="#1e1e2e" font-size="11" text-anchor="middle">ArticleService.findById (48.3%)</text>
  
  <rect x="444" y="332" width="160" height="28" fill="#a6e3a1" rx="2"/>
  <text x="524" y="351" fill="#1e1e2e" font-size="11" text-anchor="middle">ViewCounter.increment (18.4%)</text>
  
  <rect x="608" y="332" width="92" height="28" fill="#7f849c" rx="2"/>
  <text x="654" y="351" fill="#cdd6f4" font-size="10" text-anchor="middle">Serialization (11.8%)</text>
  
  <!-- Level 5: Under ArticleService -->
  <rect x="20" y="300" width="280" height="28" fill="#f38ba8" rx="2"/>
  <text x="160" y="319" fill="#1e1e2e" font-size="11" text-anchor="middle" font-weight="bold">JdbcTemplate.queryForObject (32.1%)</text>
  
  <rect x="304" y="300" width="136" height="28" fill="#89b4fa" rx="2"/>
  <text x="372" y="319" fill="#1e1e2e" font-size="11" text-anchor="middle">RowMapper.mapRow (16.2%)</text>
  
  <!-- Level 5: Under ViewCounter -->
  <rect x="444" y="300" width="100" height="28" fill="#a6e3a1" rx="2"/>
  <text x="494" y="319" fill="#1e1e2e" font-size="10" text-anchor="middle">Redis INCR (11.5%)</text>
  
  <rect x="548" y="300" width="56" height="28" fill="#a6e3a1" rx="2"/>
  <text x="576" y="319" fill="#1e1e2e" font-size="9" text-anchor="middle">Lettuce (6.9%)</text>
  
  <!-- Level 6: Under JdbcTemplate - THE HOT FRAME -->
  <rect x="20" y="268" width="200" height="28" fill="#f38ba8" rx="2" stroke="#fab387" stroke-width="2"/>
  <text x="120" y="287" fill="#1e1e2e" font-size="10" text-anchor="middle" font-weight="bold">PostgreSQL: SeqScan (23.8%)</text>
  
  <rect x="224" y="268" width="76" height="28" fill="#f38ba8" rx="2"/>
  <text x="262" y="287" fill="#1e1e2e" font-size="9" text-anchor="middle">PgConnection (8.3%)</text>
  
  <!-- Level 6: Under RowMapper -->
  <rect x="304" y="268" width="90" height="28" fill="#89b4fa" rx="2"/>
  <text x="349" y="287" fill="#1e1e2e" font-size="10" text-anchor="middle">Jackson bind (10.7%)</text>
  
  <rect x="398" y="268" width="42" height="28" fill="#89b4fa" rx="2"/>
  <text x="419" y="287" fill="#1e1e2e" font-size="9" text-anchor="middle">JSONB (5.5%)</text>
  
  <!-- Level 7: Under SeqScan -->
  <rect x="20" y="236" width="120" height="28" fill="#f38ba8" rx="2"/>
  <text x="80" y="255" fill="#1e1e2e" font-size="9" text-anchor="middle">Heap Fetch (14.2%)</text>
  
  <rect x="144" y="236" width="76" height="28" fill="#f38ba8" rx="2"/>
  <text x="182" y="255" fill="#1e1e2e" font-size="9" text-anchor="middle">Filter (9.6%)</text>
  
  <!-- Hot frame annotation arrow -->
  <line x1="300" y1="230" x2="210" y2="260" stroke="#fab387" stroke-width="2"/>
  <rect x="300" y="210" width="280" height="46" fill="#313244" rx="4" stroke="#fab387" stroke-width="1"/>
  <text x="310" y="228" fill="#fab387" font-size="11" font-weight="bold">HOT FRAME: Sequential scan on articles table</text>
  <text x="310" y="245" fill="#cdd6f4" font-size="10">Missing index on article_id. 23.8% of total CPU.</text>
  
  <!-- Legend -->
  <rect x="20" y="60" width="12" height="12" fill="#f38ba8" rx="1"/>
  <text x="38" y="71" fill="#cdd6f4" font-size="10">Database / JDBC</text>
  
  <rect x="160" y="60" width="12" height="12" fill="#89b4fa" rx="1"/>
  <text x="178" y="71" fill="#cdd6f4" font-size="10">Serialization / Mapping</text>
  
  <rect x="330" y="60" width="12" height="12" fill="#a6e3a1" rx="1"/>
  <text x="348" y="71" fill="#cdd6f4" font-size="10">Redis / View Counting</text>
  
  <rect x="500" y="60" width="12" height="12" fill="#585b70" rx="1"/>
  <text x="518" y="71" fill="#cdd6f4" font-size="10">Framework / Infrastructure</text>
  
  <!-- Percentage axis hint -->
  <text x="20" y="500" fill="#6c7086" font-size="9">Wider frames = more CPU time. Read bottom-up: root cause is at the top of each stack.</text>
</svg>