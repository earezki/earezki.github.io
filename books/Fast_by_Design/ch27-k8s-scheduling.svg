<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680">
  <rect width="900" height="680" rx="8" fill="#1e1e2e"/>

  <!-- Title -->
  <text x="450" y="28" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="14" font-weight="bold">Kubernetes Node: Pod Placement and L3 Cache Contention Zones</text>
  <text x="450" y="48" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="10">16-core node, 2 NUMA nodes, 27.5MB shared L3 cache per socket</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#cdd6f4"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f38ba8"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#a6e3a1"/>
    </marker>
  </defs>

  <!-- NUMA Node 0 -->
  <rect x="30" y="70" width="410" height="280" rx="6" fill="#181825" stroke="#45475a" stroke-width="1.5"/>
  <text x="235" y="92" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="12" font-weight="bold">NUMA Node 0 (Socket 0)</text>
  <text x="235" y="108" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="9">Local memory: 32GB DDR4 (40ns access)</text>

  <!-- Cores 0-7 in NUMA 0 -->
  <!-- Core 0: System reserved -->
  <rect x="45" y="120" width="85" height="32" rx="3" fill="#45475a" stroke="#585b70" stroke-width="1"/>
  <text x="87" y="138" text-anchor="middle" fill="#a6adc8" font-family="monospace" font-size="8">Core 0</text>
  <text x="87" y="148" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="7">system/kubelet</text>

  <!-- Cores 1-4: Pinned to article-service (green) -->
  <rect x="45" y="160" width="185" height="55" rx="3" fill="#1a3a2a" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="137" y="176" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="9" font-weight="bold">Cores 1-4 (PINNED)</text>
  <text x="137" y="190" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="8">article-service</text>
  <text x="137" y="202" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="7">Guaranteed QoS | cpuset: 1-4</text>
  <!-- Lock icon indicator -->
  <text x="220" y="176" fill="#a6e3a1" font-family="monospace" font-size="8">&#x1F512;</text>

  <!-- Cores 5-6: Pinned to search-api (blue) -->
  <rect x="240" y="160" width="185" height="55" rx="3" fill="#1a2a3a" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="332" y="176" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="9" font-weight="bold">Cores 5-6 (PINNED)</text>
  <text x="332" y="190" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="8">search-api</text>
  <text x="332" y="202" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="7">Guaranteed QoS | cpuset: 5-6</text>

  <!-- Core 7: Shared pool -->
  <rect x="140" y="120" width="85" height="32" rx="3" fill="#2a2a1a" stroke="#f9e2af" stroke-width="1" stroke-dasharray="4"/>
  <text x="182" y="138" text-anchor="middle" fill="#f9e2af" font-family="monospace" font-size="8">Core 7</text>
  <text x="182" y="148" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="7">shared pool</text>

  <!-- L3 Cache bar for NUMA 0 -->
  <rect x="45" y="225" width="385" height="30" rx="3" fill="#313244" stroke="#45475a" stroke-width="1"/>
  <text x="237" y="235" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="8">L3 Cache: 27.5 MB (shared across Socket 0 cores)</text>

  <!-- Cache occupancy segments -->
  <rect x="47" y="240" width="155" height="12" rx="2" fill="#a6e3a1" opacity="0.4"/>
  <text x="124" y="249" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="7">article-svc: 18MB</text>

  <rect x="204" y="240" width="65" height="12" rx="2" fill="#89b4fa" opacity="0.4"/>
  <text x="236" y="249" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="7">search: 6MB</text>

  <rect x="271" y="240" width="40" height="12" rx="2" fill="#6c7086" opacity="0.3"/>
  <text x="291" y="249" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="7">3.5MB free</text>

  <!-- Memory for NUMA 0 -->
  <rect x="45" y="265" width="385" height="22" rx="3" fill="#1e1e2e" stroke="#45475a" stroke-width="1"/>
  <text x="237" y="280" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="8">DDR4 Memory: 32GB | Bandwidth: 50 GB/s | Latency: 40ns</text>

  <!-- Connection to QPI -->
  <line x1="237" y1="295" x2="237" y2="310" stroke="#45475a" stroke-width="1"/>

  <!-- NUMA Node 1 -->
  <rect x="460" y="70" width="410" height="280" rx="6" fill="#181825" stroke="#45475a" stroke-width="1.5"/>
  <text x="665" y="92" text-anchor="middle" fill="#fab387" font-family="monospace" font-size="12" font-weight="bold">NUMA Node 1 (Socket 1)</text>
  <text x="665" y="108" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="9">Local memory: 32GB DDR4 (40ns access)</text>

  <!-- Cores 8-15: Shared pool -->
  <rect x="475" y="120" width="380" height="32" rx="3" fill="#2a2a1a" stroke="#f9e2af" stroke-width="1" stroke-dasharray="4"/>
  <text x="665" y="138" text-anchor="middle" fill="#f9e2af" font-family="monospace" font-size="9">Cores 8-15: Shared Pool</text>
  <text x="665" y="148" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="7">Burstable + BestEffort pods via CFS scheduling</text>

  <!-- Batch job pod (noisy neighbor warning) -->
  <rect x="475" y="160" width="185" height="55" rx="3" fill="#3a1a1a" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="567" y="176" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="9" font-weight="bold">analytics-batch</text>
  <text x="567" y="190" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="8">sequential scan workload</text>
  <text x="567" y="202" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="7">Burstable QoS | cores 8-15</text>

  <!-- Monitoring pod -->
  <rect x="670" y="160" width="185" height="55" rx="3" fill="#2a2a2a" stroke="#585b70" stroke-width="1"/>
  <text x="762" y="176" text-anchor="middle" fill="#a6adc8" font-family="monospace" font-size="9">monitoring</text>
  <text x="762" y="190" text-anchor="middle" fill="#a6adc8" font-family="monospace" font-size="8">prometheus-agent</text>
  <text x="762" y="202" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="7">BestEffort | cores 8-15</text>

  <!-- L3 Cache bar for NUMA 1 -->
  <rect x="475" y="225" width="380" height="30" rx="3" fill="#313244" stroke="#45475a" stroke-width="1"/>
  <text x="665" y="235" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="8">L3 Cache: 27.5 MB (shared across Socket 1 cores)</text>

  <!-- Cache occupancy: batch job dominates -->
  <rect x="477" y="240" width="300" height="12" rx="2" fill="#f38ba8" opacity="0.4"/>
  <text x="627" y="249" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="7">analytics-batch: 24MB (NOISY NEIGHBOR)</text>

  <rect x="779" y="240" width="30" height="12" rx="2" fill="#a6adc8" opacity="0.3"/>
  <text x="830" y="249" text-anchor="end" fill="#6c7086" font-family="monospace" font-size="7">3.5MB</text>

  <!-- Memory for NUMA 1 -->
  <rect x="475" y="265" width="380" height="22" rx="3" fill="#1e1e2e" stroke="#45475a" stroke-width="1"/>
  <text x="665" y="280" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="8">DDR4 Memory: 32GB | Bandwidth: 50 GB/s | Latency: 40ns</text>

  <!-- Connection to QPI -->
  <line x1="665" y1="295" x2="665" y2="310" stroke="#45475a" stroke-width="1"/>

  <!-- QPI/UPI Interconnect -->
  <rect x="200" y="310" width="500" height="28" rx="4" fill="#1e1e2e" stroke="#cba6f7" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="450" y="328" text-anchor="middle" fill="#cba6f7" font-family="monospace" font-size="9">QPI/UPI Interconnect: Cross-socket access = 80ns (+100% penalty)</text>

  <!-- Contention danger zone annotation -->
  <rect x="30" y="360" width="840" height="110" rx="6" fill="#181825" stroke="#45475a" stroke-width="1"/>
  <text x="450" y="382" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="11" font-weight="bold">Impact: Default Scheduling vs CPU Pinning + NUMA Alignment</text>

  <!-- Before (bad) -->
  <rect x="50" y="395" width="380" height="65" rx="4" fill="#2a1a1a" stroke="#f38ba8" stroke-width="1"/>
  <text x="240" y="412" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="10" font-weight="bold">WITHOUT Isolation (Default Scheduler)</text>
  <text x="60" y="428" fill="#f38ba8" font-family="monospace" font-size="8">L3 hit rate:  72%    P99: 95ms</text>
  <text x="60" y="440" fill="#f38ba8" font-family="monospace" font-size="8">IPC: 1.3             P999: 210ms</text>
  <text x="60" y="452" fill="#f38ba8" font-family="monospace" font-size="8">Ctx switches: 4,200/s    Cache: unstable</text>

  <!-- After (good) -->
  <rect x="470" y="395" width="380" height="65" rx="4" fill="#1a3a2a" stroke="#a6e3a1" stroke-width="1"/>
  <text x="660" y="412" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="10" font-weight="bold">WITH Pinning + NUMA + Anti-Affinity</text>
  <text x="480" y="428" fill="#a6e3a1" font-family="monospace" font-size="8">L3 hit rate:  97%    P99: 19ms</text>
  <text x="480" y="440" fill="#a6e3a1" font-family="monospace" font-size="8">IPC: 2.2             P999: 24ms</text>
  <text x="480" y="452" fill="#a6e3a1" font-family="monospace" font-size="8">Ctx switches: 120/s      Cache: stable</text>

  <!-- Arrow between them -->
  <line x1="435" y1="427" x2="465" y2="427" stroke="#cdd6f4" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Legend -->
  <rect x="30" y="490" width="840" height="175" rx="6" fill="#181825" stroke="#45475a" stroke-width="1"/>
  <text x="450" y="512" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="11" font-weight="bold">Isolation Strategy Layers</text>

  <!-- Layer 1 -->
  <rect x="50" y="525" width="12" height="12" rx="2" fill="#cba6f7" opacity="0.5"/>
  <text x="70" y="535" fill="#cba6f7" font-family="monospace" font-size="9">Layer 1: Node Taints</text>
  <text x="250" y="535" fill="#6c7086" font-family="monospace" font-size="8">Separate latency-sensitive, batch, and shared node pools</text>

  <!-- Layer 2 -->
  <rect x="50" y="548" width="12" height="12" rx="2" fill="#fab387" opacity="0.5"/>
  <text x="70" y="558" fill="#fab387" font-family="monospace" font-size="9">Layer 2: Anti-Affinity</text>
  <text x="250" y="558" fill="#6c7086" font-family="monospace" font-size="8">Prevent batch pods from co-locating with latency-sensitive pods</text>

  <!-- Layer 3 -->
  <rect x="50" y="571" width="12" height="12" rx="2" fill="#a6e3a1" opacity="0.5"/>
  <text x="70" y="581" fill="#a6e3a1" font-family="monospace" font-size="9">Layer 3: CPU Pinning</text>
  <text x="250" y="581" fill="#6c7086" font-family="monospace" font-size="8">Exclusive cores via cpuset (static policy, integer CPU requests)</text>

  <!-- Layer 4 -->
  <rect x="50" y="594" width="12" height="12" rx="2" fill="#89b4fa" opacity="0.5"/>
  <text x="70" y="604" fill="#89b4fa" font-family="monospace" font-size="9">Layer 4: NUMA Alignment</text>
  <text x="250" y="604" fill="#6c7086" font-family="monospace" font-size="8">Cores + memory on same socket (topology-manager: single-numa-node)</text>

  <!-- QoS legend -->
  <line x1="50" y1="620" x2="840" y2="620" stroke="#45475a" stroke-width="0.5"/>
  <text x="50" y="638" fill="#a6e3a1" font-family="monospace" font-size="8">&#9632; Guaranteed (oom_score_adj: -997)</text>
  <text x="300" y="638" fill="#f9e2af" font-family="monospace" font-size="8">&#9634; Burstable (oom_score_adj: 2-999)</text>
  <text x="570" y="638" fill="#585b70" font-family="monospace" font-size="8">&#9632; BestEffort (oom_score_adj: 1000)</text>
  <text x="50" y="655" fill="#f38ba8" font-family="monospace" font-size="8">&#9632; Noisy Neighbor</text>
  <text x="300" y="655" fill="#6c7086" font-family="monospace" font-size="8">Eviction order: BestEffort &#8594; Burstable &#8594; Guaranteed</text>
</svg>
