<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620">
  <defs>
    <linearGradient id="edenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a6e3a1;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#a6e3a1;stop-opacity:0.5"/>
    </linearGradient>
    <linearGradient id="survivorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f9e2af;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#f9e2af;stop-opacity:0.5"/>
    </linearGradient>
    <linearGradient id="oldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#89b4fa;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#89b4fa;stop-opacity:0.5"/>
    </linearGradient>
    <linearGradient id="humongousGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f38ba8;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#f38ba8;stop-opacity:0.5"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="620" rx="8" fill="#1e1e2e"/>

  <text x="500" y="35" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="16" font-weight="bold">G1 Heap Region Layout and GC Pause Timeline</text>

  <!-- Heap Region Grid -->
  <text x="30" y="70" fill="#cdd6f4" font-family="monospace" font-size="12" font-weight="bold">Heap Regions (each region = 4MB, total heap = 8GB)</text>

  <!-- Row 1 -->
  <rect x="30" y="85" width="55" height="40" rx="3" fill="url(#edenGrad)" stroke="#a6e3a1" stroke-width="1"/>
  <text x="57" y="109" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="9">E</text>
  <rect x="90" y="85" width="55" height="40" rx="3" fill="url(#edenGrad)" stroke="#a6e3a1" stroke-width="1"/>
  <text x="117" y="109" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="9">E</text>
  <rect x="150" y="85" width="55" height="40" rx="3" fill="url(#edenGrad)" stroke="#a6e3a1" stroke-width="1"/>
  <text x="177" y="109" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="9">E</text>
  <rect x="210" y="85" width="55" height="40" rx="3" fill="url(#survivorGrad)" stroke="#f9e2af" stroke-width="1"/>
  <text x="237" y="109" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="9">S</text>
  <rect x="270" y="85" width="55" height="40" rx="3" fill="url(#oldGrad)" stroke="#89b4fa" stroke-width="1"/>
  <text x="297" y="109" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="9">O</text>
  <rect x="330" y="85" width="55" height="40" rx="3" fill="url(#oldGrad)" stroke="#89b4fa" stroke-width="1"/>
  <text x="357" y="109" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="9">O</text>
  <rect x="390" y="85" width="55" height="40" rx="3" fill="url(#oldGrad)" stroke="#89b4fa" stroke-width="1"/>
  <text x="417" y="109" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="9">O</text>
  <rect x="450" y="85" width="55" height="40" rx="3" fill="url(#oldGrad)" stroke="#89b4fa" stroke-width="1"/>
  <text x="477" y="109" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="9">O</text>
  <rect x="510" y="85" width="55" height="40" rx="3" fill="url(#humongousGrad)" stroke="#f38ba8" stroke-width="1"/>
  <text x="537" y="109" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="9">H</text>
  <rect x="570" y="85" width="55" height="40" rx="3" fill="url(#humongousGrad)" stroke="#f38ba8" stroke-width="1"/>
  <text x="597" y="109" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="9">H</text>

  <!-- Row 2 -->
  <rect x="30" y="130" width="55" height="40" rx="3" fill="url(#edenGrad)" stroke="#a6e3a1" stroke-width="1"/>
  <text x="57" y="154" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="9">E</text>
  <rect x="90" y="130" width="55" height="40" rx="3" fill="url(#edenGrad)" stroke="#a6e3a1" stroke-width="1"/>
  <text x="117" y="154" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="9">E</text>
  <rect x="150" y="130" width="55" height="40" rx="3" fill="url(#oldGrad)" stroke="#89b4fa" stroke-width="1"/>
  <text x="177" y="154" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="9">O</text>
  <rect x="210" y="130" width="55" height="40" rx="3" fill="url(#oldGrad)" stroke="#89b4fa" stroke-width="1"/>
  <text x="237" y="154" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="9">O</text>
  <rect x="270" y="130" width="55" height="40" rx="3" fill="url(#survivorGrad)" stroke="#f9e2af" stroke-width="1"/>
  <text x="297" y="154" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="9">S</text>
  <rect x="330" y="130" width="55" height="40" rx="3" fill="url(#oldGrad)" stroke="#89b4fa" stroke-width="1"/>
  <text x="357" y="154" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="9">O</text>
  <rect x="390" y="130" width="55" height="40" rx="3" fill="url(#oldGrad)" stroke="#89b4fa" stroke-width="1"/>
  <text x="417" y="154" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="9">O</text>
  <rect x="450" y="130" width="55" height="40" rx="3" fill="url(#edenGrad)" stroke="#a6e3a1" stroke-width="1"/>
  <text x="477" y="154" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="9">E</text>
  <rect x="510" y="130" width="55" height="40" rx="3" fill="url(#oldGrad)" stroke="#89b4fa" stroke-width="1"/>
  <text x="537" y="154" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="9">O</text>
  <rect x="570" y="130" width="55" height="40" rx="3" fill="#45475a" stroke="#585b70" stroke-width="1"/>
  <text x="597" y="154" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="9">Free</text>

  <!-- Legend -->
  <rect x="660" y="85" width="14" height="14" rx="2" fill="url(#edenGrad)" stroke="#a6e3a1"/>
  <text x="680" y="96" fill="#cdd6f4" font-family="monospace" font-size="11">Eden</text>
  <rect x="660" y="107" width="14" height="14" rx="2" fill="url(#survivorGrad)" stroke="#f9e2af"/>
  <text x="680" y="118" fill="#cdd6f4" font-family="monospace" font-size="11">Survivor</text>
  <rect x="660" y="129" width="14" height="14" rx="2" fill="url(#oldGrad)" stroke="#89b4fa"/>
  <text x="680" y="140" fill="#cdd6f4" font-family="monospace" font-size="11">Old Gen</text>
  <rect x="660" y="151" width="14" height="14" rx="2" fill="url(#humongousGrad)" stroke="#f38ba8"/>
  <text x="680" y="162" fill="#cdd6f4" font-family="monospace" font-size="11">Humongous</text>
  <rect x="780" y="85" width="14" height="14" rx="2" fill="#45475a" stroke="#585b70"/>
  <text x="800" y="96" fill="#cdd6f4" font-family="monospace" font-size="11">Free</text>

  <!-- Pause Timeline -->
  <text x="30" y="210" fill="#cdd6f4" font-family="monospace" font-size="12" font-weight="bold">GC Pause Timeline (5 seconds window)</text>
  <line x1="30" y1="230" x2="970" y2="230" stroke="#585b70" stroke-width="1"/>

  <!-- Time axis labels -->
  <text x="30" y="248" fill="#7f849c" font-family="monospace" font-size="9">0s</text>
  <text x="218" y="248" fill="#7f849c" font-family="monospace" font-size="9">1s</text>
  <text x="406" y="248" fill="#7f849c" font-family="monospace" font-size="9">2s</text>
  <text x="594" y="248" fill="#7f849c" font-family="monospace" font-size="9">3s</text>
  <text x="782" y="248" fill="#7f849c" font-family="monospace" font-size="9">4s</text>
  <text x="958" y="248" fill="#7f849c" font-family="monospace" font-size="9">5s</text>

  <!-- G1 pauses -->
  <text x="30" y="278" fill="#a6e3a1" font-family="monospace" font-size="11" font-weight="bold">G1GC</text>
  <rect x="120" y="265" width="4" height="20" fill="#a6e3a1" opacity="0.9"/>
  <text x="126" y="280" fill="#7f849c" font-family="monospace" font-size="8">12ms</text>
  <rect x="310" y="265" width="3" height="20" fill="#a6e3a1" opacity="0.9"/>
  <text x="315" y="280" fill="#7f849c" font-family="monospace" font-size="8">8ms</text>
  <rect x="480" y="265" width="5" height="20" fill="#a6e3a1" opacity="0.9"/>
  <text x="487" y="280" fill="#7f849c" font-family="monospace" font-size="8">15ms</text>
  <rect x="620" y="258" width="14" height="27" fill="#f38ba8" opacity="0.9"/>
  <text x="636" y="275" fill="#f38ba8" font-family="monospace" font-size="8">82ms mixed</text>
  <rect x="830" y="265" width="4" height="20" fill="#a6e3a1" opacity="0.9"/>
  <text x="836" y="280" fill="#7f849c" font-family="monospace" font-size="8">10ms</text>

  <!-- ZGC pauses -->
  <text x="30" y="328" fill="#89b4fa" font-family="monospace" font-size="11" font-weight="bold">ZGC</text>
  <rect x="120" y="315" width="1" height="20" fill="#89b4fa" opacity="0.9"/>
  <rect x="220" y="315" width="1" height="20" fill="#89b4fa" opacity="0.9"/>
  <rect x="340" y="315" width="1" height="20" fill="#89b4fa" opacity="0.9"/>
  <rect x="430" y="315" width="1" height="20" fill="#89b4fa" opacity="0.9"/>
  <rect x="550" y="315" width="1" height="20" fill="#89b4fa" opacity="0.9"/>
  <rect x="650" y="315" width="1" height="20" fill="#89b4fa" opacity="0.9"/>
  <rect x="750" y="315" width="1" height="20" fill="#89b4fa" opacity="0.9"/>
  <rect x="870" y="315" width="1" height="20" fill="#89b4fa" opacity="0.9"/>
  <rect x="940" y="315" width="1" height="20" fill="#89b4fa" opacity="0.9"/>
  <text x="126" y="330" fill="#7f849c" font-family="monospace" font-size="8">&lt;1ms each</text>

  <!-- Shenandoah pauses -->
  <text x="30" y="378" fill="#f9e2af" font-family="monospace" font-size="11" font-weight="bold">Shenandoah</text>
  <rect x="150" y="365" width="1" height="20" fill="#f9e2af" opacity="0.9"/>
  <rect x="300" y="365" width="1" height="20" fill="#f9e2af" opacity="0.9"/>
  <rect x="460" y="365" width="1" height="20" fill="#f9e2af" opacity="0.9"/>
  <rect x="600" y="365" width="1" height="20" fill="#f9e2af" opacity="0.9"/>
  <rect x="780" y="365" width="1" height="20" fill="#f9e2af" opacity="0.9"/>
  <rect x="900" y="365" width="1" height="20" fill="#f9e2af" opacity="0.9"/>
  <text x="156" y="380" fill="#7f849c" font-family="monospace" font-size="8">&lt;1ms each</text>

  <!-- Latency Impact Box -->
  <rect x="30" y="410" width="940" height="195" rx="6" fill="#313244" stroke="#585b70" stroke-width="1"/>
  <text x="50" y="435" fill="#cdd6f4" font-family="monospace" font-size="12" font-weight="bold">p99 Latency Impact: Content Platform Article Serving (8GB heap, 200 req/s)</text>

  <text x="50" y="465" fill="#a6e3a1" font-family="monospace" font-size="11">G1GC    -XX:+UseG1GC -XX:MaxGCPauseMillis=15</text>
  <rect x="400" y="455" width="240" height="14" rx="2" fill="#a6e3a1" opacity="0.3"/>
  <rect x="400" y="455" width="180" height="14" rx="2" fill="#a6e3a1" opacity="0.7"/>
  <text x="648" y="466" fill="#cdd6f4" font-family="monospace" font-size="10">p50=3ms  p99=18ms  p999=95ms</text>

  <text x="50" y="495" fill="#89b4fa" font-family="monospace" font-size="11">ZGC     -XX:+UseZGC</text>
  <rect x="400" y="485" width="240" height="14" rx="2" fill="#89b4fa" opacity="0.3"/>
  <rect x="400" y="485" width="60" height="14" rx="2" fill="#89b4fa" opacity="0.7"/>
  <text x="648" y="496" fill="#cdd6f4" font-family="monospace" font-size="10">p50=4ms  p99=6ms   p999=9ms</text>

  <text x="50" y="525" fill="#f9e2af" font-family="monospace" font-size="11">Shenandoah -XX:+UseShenandoahGC</text>
  <rect x="400" y="515" width="240" height="14" rx="2" fill="#f9e2af" opacity="0.3"/>
  <rect x="400" y="515" width="65" height="14" rx="2" fill="#f9e2af" opacity="0.7"/>
  <text x="648" y="526" fill="#cdd6f4" font-family="monospace" font-size="10">p50=4ms  p99=7ms   p999=11ms</text>

  <line x1="50" y1="545" x2="950" y2="545" stroke="#585b70" stroke-width="1" stroke-dasharray="4"/>
  <text x="50" y="565" fill="#f38ba8" font-family="monospace" font-size="10">G1 mixed GC pause: 82ms spike visible in p999. ZGC/Shenandoah: sub-ms pauses, no spikes.</text>
  <text x="50" y="582" fill="#7f849c" font-family="monospace" font-size="10">Trade-off: ZGC uses 3-5% more CPU for concurrent marking. G1 delivers higher peak throughput.</text>
  <text x="50" y="598" fill="#7f849c" font-family="monospace" font-size="10">H = Humongous allocation: objects &gt; region_size/2. These bypass Eden and trigger special collection.</text>
</svg>