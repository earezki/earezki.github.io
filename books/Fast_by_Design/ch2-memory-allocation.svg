<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <style>
      text { font-family: 'Consolas', 'Monaco', monospace; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#89b4fa"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f38ba8"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a6e3a1"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" fill="#1e1e2e" rx="8"/>

  <!-- Title -->
  <text x="450" y="30" fill="#cdd6f4" font-size="14" font-weight="bold" text-anchor="middle">Object Allocation Lifecycle in the Content Platform</text>

  <!-- EDEN SPACE -->
  <rect x="30" y="60" width="260" height="280" fill="#313244" rx="6" stroke="#45475a" stroke-width="1"/>
  <text x="160" y="85" fill="#a6e3a1" font-size="13" font-weight="bold" text-anchor="middle">Eden Space</text>
  <text x="160" y="100" fill="#6c7086" font-size="10" text-anchor="middle">Young Generation</text>

  <!-- Objects in Eden -->
  <rect x="45" y="115" width="110" height="32" fill="#a6e3a1" rx="3" opacity="0.9"/>
  <text x="100" y="135" fill="#1e1e2e" font-size="9" text-anchor="middle">ArticleDTO</text>

  <rect x="165" y="115" width="110" height="32" fill="#a6e3a1" rx="3" opacity="0.9"/>
  <text x="220" y="135" fill="#1e1e2e" font-size="9" text-anchor="middle">ViewCountEvent</text>

  <rect x="45" y="157" width="110" height="32" fill="#a6e3a1" rx="3" opacity="0.7"/>
  <text x="100" y="177" fill="#1e1e2e" font-size="9" text-anchor="middle">JsonNode (temp)</text>

  <rect x="165" y="157" width="110" height="32" fill="#f38ba8" rx="3" opacity="0.8"/>
  <text x="220" y="177" fill="#1e1e2e" font-size="9" text-anchor="middle">String concat (leak)</text>

  <rect x="45" y="199" width="110" height="32" fill="#a6e3a1" rx="3" opacity="0.6"/>
  <text x="100" y="219" fill="#1e1e2e" font-size="9" text-anchor="middle">HttpRequest</text>

  <rect x="165" y="199" width="110" height="32" fill="#a6e3a1" rx="3" opacity="0.5"/>
  <text x="220" y="219" fill="#1e1e2e" font-size="9" text-anchor="middle">ArrayList (temp)</text>

  <rect x="45" y="241" width="230" height="32" fill="#f38ba8" rx="3" opacity="0.8"/>
  <text x="160" y="261" fill="#1e1e2e" font-size="9" text-anchor="middle">byte[] from Jackson ObjectMapper (2.4 MB/req)</text>

  <rect x="45" y="283" width="230" height="32" fill="#fab387" rx="3" opacity="0.7"/>
  <text x="160" y="303" fill="#1e1e2e" font-size="9" text-anchor="middle">RecommendationResult[] (survives to S1)</text>

  <!-- Allocation rate indicator -->
  <text x="160" y="330" fill="#f38ba8" font-size="10" text-anchor="middle" font-weight="bold">Alloc rate: 1.2 GB/s</text>

  <!-- Arrow Eden to Survivor -->
  <line x1="295" y1="200" x2="335" y2="200" stroke="#89b4fa" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="315" y="190" fill="#6c7086" font-size="8" text-anchor="middle" transform="rotate(-90, 315, 190)">Minor GC</text>

  <!-- SURVIVOR SPACES -->
  <rect x="345" y="60" width="180" height="280" fill="#313244" rx="6" stroke="#45475a" stroke-width="1"/>
  <text x="435" y="85" fill="#89b4fa" font-size="13" font-weight="bold" text-anchor="middle">Survivor Spaces</text>
  <text x="435" y="100" fill="#6c7086" font-size="10" text-anchor="middle">S0 / S1 (age threshold)</text>

  <!-- S0 -->
  <rect x="355" y="115" width="75" height="120" fill="#45475a" rx="3"/>
  <text x="393" y="132" fill="#cdd6f4" font-size="10" text-anchor="middle">S0</text>
  <rect x="360" y="140" width="65" height="22" fill="#89b4fa" rx="2" opacity="0.8"/>
  <text x="393" y="155" fill="#1e1e2e" font-size="8" text-anchor="middle">ArticleDTO</text>
  <rect x="360" y="168" width="65" height="22" fill="#89b4fa" rx="2" opacity="0.7"/>
  <text x="393" y="183" fill="#1e1e2e" font-size="8" text-anchor="middle">RecResult[]</text>
  <rect x="360" y="196" width="65" height="22" fill="#f38ba8" rx="2" opacity="0.8"/>
  <text x="393" y="211" fill="#1e1e2e" font-size="8" text-anchor="middle">String leak</text>

  <!-- S1 -->
  <rect x="440" y="115" width="75" height="120" fill="#45475a" rx="3"/>
  <text x="478" y="132" fill="#cdd6f4" font-size="10" text-anchor="middle">S1</text>
  <rect x="445" y="140" width="65" height="22" fill="#89b4fa" rx="2" opacity="0.6"/>
  <text x="478" y="155" fill="#1e1e2e" font-size="8" text-anchor="middle">ArticleDTO</text>
  <rect x="445" y="168" width="65" height="22" fill="#f38ba8" rx="2" opacity="0.9"/>
  <text x="478" y="183" fill="#1e1e2e" font-size="8" text-anchor="middle">String leak</text>

  <!-- Age counter -->
  <text x="435" y="260" fill="#cdd6f4" font-size="10" text-anchor="middle">Age threshold: 6</text>
  <text x="435" y="278" fill="#fab387" font-size="10" text-anchor="middle">Promotion rate: 45 MB/s</text>
  <text x="435" y="296" fill="#f38ba8" font-size="9" text-anchor="middle">(too high, indicates leak)</text>

  <!-- Arrow Survivor to Old Gen -->
  <line x1="530" y1="200" x2="570" y2="200" stroke="#89b4fa" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="550" y="190" fill="#6c7086" font-size="8" text-anchor="middle" transform="rotate(-90, 550, 190)">Promote</text>

  <!-- OLD GENERATION -->
  <rect x="580" y="60" width="290" height="280" fill="#313244" rx="6" stroke="#45475a" stroke-width="1"/>
  <text x="725" y="85" fill="#fab387" font-size="13" font-weight="bold" text-anchor="middle">Old Generation (Tenured)</text>
  <text x="725" y="100" fill="#6c7086" font-size="10" text-anchor="middle">Long-lived objects</text>

  <!-- Old gen objects -->
  <rect x="595" y="115" width="130" height="28" fill="#585b70" rx="3"/>
  <text x="660" y="134" fill="#cdd6f4" font-size="9" text-anchor="middle">Class metadata</text>

  <rect x="735" y="115" width="120" height="28" fill="#585b70" rx="3"/>
  <text x="795" y="134" fill="#cdd6f4" font-size="9" text-anchor="middle">Connection pool</text>

  <rect x="595" y="153" width="260" height="28" fill="#585b70" rx="3"/>
  <text x="725" y="172" fill="#cdd6f4" font-size="9" text-anchor="middle">Spring ApplicationContext (singleton beans)</text>

  <rect x="595" y="191" width="260" height="28" fill="#f38ba8" rx="3" opacity="0.9"/>
  <text x="725" y="210" fill="#1e1e2e" font-size="9" text-anchor="middle" font-weight="bold">LEAKED: ArticleSearchCache (unbounded HashMap)</text>

  <rect x="595" y="229" width="260" height="28" fill="#f38ba8" rx="3" opacity="0.7"/>
  <text x="725" y="248" fill="#1e1e2e" font-size="9" text-anchor="middle">LEAKED: Cached query strings (never evicted)</text>

  <rect x="595" y="267" width="260" height="28" fill="#f38ba8" rx="3" opacity="0.5"/>
  <text x="725" y="286" fill="#1e1e2e" font-size="9" text-anchor="middle">LEAKED: Retained Jackson buffers</text>

  <text x="725" y="325" fill="#f38ba8" font-size="10" text-anchor="middle" font-weight="bold">Old Gen usage: 78% and growing</text>

  <!-- GC TIMELINE at bottom -->
  <rect x="30" y="370" width="840" height="110" fill="#313244" rx="6" stroke="#45475a" stroke-width="1"/>
  <text x="450" y="392" fill="#cdd6f4" font-size="12" font-weight="bold" text-anchor="middle">GC Event Timeline</text>

  <!-- Timeline axis -->
  <line x1="60" y1="440" x2="840" y2="440" stroke="#45475a" stroke-width="1"/>

  <!-- Minor GC events -->
  <rect x="80" y="415" width="4" height="25" fill="#a6e3a1" rx="1"/>
  <rect x="140" y="415" width="4" height="25" fill="#a6e3a1" rx="1"/>
  <rect x="200" y="415" width="4" height="25" fill="#a6e3a1" rx="1"/>
  <rect x="260" y="415" width="4" height="25" fill="#a6e3a1" rx="1"/>
  <rect x="320" y="415" width="4" height="25" fill="#a6e3a1" rx="1"/>
  <rect x="380" y="415" width="4" height="25" fill="#a6e3a1" rx="1"/>
  <rect x="440" y="415" width="4" height="25" fill="#a6e3a1" rx="1"/>
  <rect x="500" y="415" width="4" height="25" fill="#a6e3a1" rx="1"/>
  <rect x="560" y="415" width="4" height="25" fill="#a6e3a1" rx="1"/>
  <rect x="620" y="415" width="4" height="25" fill="#a6e3a1" rx="1"/>
  <rect x="680" y="415" width="4" height="25" fill="#a6e3a1" rx="1"/>

  <!-- Major GC events (pauses) -->
  <rect x="730" y="405" width="16" height="35" fill="#f38ba8" rx="1" opacity="0.9"/>
  <text x="738" y="458" fill="#f38ba8" font-size="8" text-anchor="middle">420ms</text>

  <rect x="800" y="405" width="20" height="35" fill="#f38ba8" rx="1"/>
  <text x="810" y="458" fill="#f38ba8" font-size="8" text-anchor="middle">680ms</text>

  <!-- Legend for timeline -->
  <rect x="80" y="465" width="10" height="10" fill="#a6e3a1" rx="1"/>
  <text x="96" y="474" fill="#cdd6f4" font-size="9">Minor GC (3-8ms)</text>

  <rect x="230" y="465" width="10" height="10" fill="#f38ba8" rx="1"/>
  <text x="246" y="474" fill="#cdd6f4" font-size="9">Full GC (pause, growing duration)</text>

  <!-- Diagnosis box -->
  <rect x="400" y="500" width="470" height="55" fill="#313244" rx="4" stroke="#f38ba8" stroke-width="1"/>
  <text x="410" y="520" fill="#f38ba8" font-size="11" font-weight="bold">Diagnosis:</text>
  <text x="410" y="535" fill="#cdd6f4" font-size="10">Unbounded ArticleSearchCache promotes to Old Gen, triggers Full GC.</text>
  <text x="410" y="548" fill="#cdd6f4" font-size="10">Fix: Use Caffeine cache with maxSize=10000, expireAfterAccess=5min.</text>

  <!-- Healthy vs unhealthy labels -->
  <text x="160" y="355" fill="#a6e3a1" font-size="10" text-anchor="middle">Healthy: most die young</text>
  <text x="725" y="355" fill="#f38ba8" font-size="10" text-anchor="middle">Unhealthy: leaked objects accumulate</text>
</svg>