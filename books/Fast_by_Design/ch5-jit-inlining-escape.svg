<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#89b4fa"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f38ba8"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#a6e3a1"/>
    </marker>
  </defs>

  <rect width="1000" height="700" rx="8" fill="#1e1e2e"/>
  <text x="500" y="32" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="16" font-weight="bold">JIT Optimization Pipeline: Inlining and Escape Analysis Decision Tree</text>

  <!-- Phase 1: Method Profiling -->
  <rect x="380" y="55" width="240" height="40" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <text x="500" y="80" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="12">Method Invoked (Hot Path)</text>

  <line x1="500" y1="95" x2="500" y2="120" stroke="#89b4fa" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Type Profiling -->
  <rect x="350" y="120" width="300" height="40" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <text x="500" y="145" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="12">C1 Collects Type Profile Data</text>

  <line x1="500" y1="160" x2="500" y2="185" stroke="#89b4fa" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- C2 Decision Point -->
  <polygon points="500,185 600,220 500,255 400,220" fill="#313244" stroke="#f9e2af" stroke-width="2"/>
  <text x="500" y="224" text-anchor="middle" fill="#f9e2af" font-family="monospace" font-size="11">Call Site</text>
  <text x="500" y="238" text-anchor="middle" fill="#f9e2af" font-family="monospace" font-size="11">Type Check</text>

  <!-- Left Branch: Monomorphic -->
  <line x1="400" y1="220" x2="180" y2="220" stroke="#a6e3a1" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="290" y="212" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="10">Monomorphic (1 type)</text>

  <!-- Middle Branch: Bimorphic -->
  <line x1="500" y1="255" x2="500" y2="290" stroke="#89b4fa" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="560" y="275" fill="#89b4fa" font-family="monospace" font-size="10">Bimorphic (2 types)</text>

  <!-- Right Branch: Megamorphic -->
  <line x1="600" y1="220" x2="820" y2="220" stroke="#f38ba8" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <text x="710" y="212" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="10">Megamorphic (3+ types)</text>

  <!-- Monomorphic Path -->
  <rect x="50" y="205" width="130" height="35" rx="5" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
  <text x="115" y="227" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="11">Devirtualize</text>
  <line x1="115" y1="240" x2="115" y2="270" stroke="#a6e3a1" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <rect x="40" y="270" width="150" height="35" rx="5" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
  <text x="115" y="292" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="11">Inline Method</text>

  <line x1="115" y1="305" x2="115" y2="330" stroke="#a6e3a1" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- Inlining Decision -->
  <polygon points="115,330 200,360 115,390 30,360" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="115" y="360" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="9">bytecode</text>
  <text x="115" y="374" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="9">&lt; 325 bytes?</text>

  <line x1="115" y1="390" x2="115" y2="420" stroke="#a6e3a1" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="130" y="408" fill="#a6e3a1" font-family="monospace" font-size="9">Yes</text>

  <line x1="200" y1="360" x2="260" y2="360" stroke="#f38ba8" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <text x="222" y="352" fill="#f38ba8" font-family="monospace" font-size="9">No</text>
  <rect x="260" y="345" width="100" height="30" rx="4" fill="#45475a" stroke="#f38ba8" stroke-width="1"/>
  <text x="310" y="365" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="9">Not Inlined</text>

  <!-- Escape Analysis -->
  <rect x="40" y="420" width="150" height="35" rx="5" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
  <text x="115" y="442" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="11">Escape Analysis</text>

  <line x1="115" y1="455" x2="115" y2="480" stroke="#a6e3a1" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- EA Decision -->
  <polygon points="115,480 210,515 115,550 20,515" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="115" y="512" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="9">Object</text>
  <text x="115" y="526" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="9">escapes?</text>

  <!-- NoEscape -->
  <line x1="20" y1="515" x2="-10" y2="515" stroke="#a6e3a1" stroke-width="0"/>
  <line x1="115" y1="550" x2="115" y2="580" stroke="#a6e3a1" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="130" y="568" fill="#a6e3a1" font-family="monospace" font-size="9">NoEscape</text>

  <rect x="35" y="580" width="160" height="50" rx="5" fill="#1e3a1e" stroke="#a6e3a1" stroke-width="2"/>
  <text x="115" y="600" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="10">Scalar Replacement</text>
  <text x="115" y="616" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="9">Object eliminated</text>
  <text x="115" y="628" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="9">Fields on stack</text>

  <!-- ArgEscape path from EA -->
  <line x1="210" y1="515" x2="280" y2="515" stroke="#f9e2af" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="240" y="507" fill="#f9e2af" font-family="monospace" font-size="9">ArgEscape</text>
  <rect x="280" y="498" width="130" height="35" rx="5" fill="#45475a" stroke="#f9e2af" stroke-width="1.5"/>
  <text x="345" y="520" text-anchor="middle" fill="#f9e2af" font-family="monospace" font-size="10">Stack Allocated</text>

  <!-- Bimorphic Path -->
  <rect x="430" y="290" width="140" height="35" rx="5" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <text x="500" y="312" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="11">Type Switch</text>

  <line x1="500" y1="325" x2="500" y2="355" stroke="#89b4fa" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <rect x="415" y="355" width="170" height="35" rx="5" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <text x="500" y="377" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="11">Inline Both Paths</text>

  <line x1="500" y1="390" x2="500" y2="420" stroke="#89b4fa" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <rect x="420" y="420" width="160" height="45" rx="5" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="500" y="440" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="10">Guard + Branch</text>
  <text x="500" y="456" text-anchor="middle" fill="#7f849c" font-family="monospace" font-size="9">if (type == A) / else</text>

  <!-- Megamorphic Path -->
  <rect x="760" y="205" width="190" height="35" rx="5" fill="#45475a" stroke="#f38ba8" stroke-width="2"/>
  <text x="855" y="227" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="11">vtable / itable lookup</text>

  <line x1="855" y1="240" x2="855" y2="270" stroke="#f38ba8" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <rect x="760" y="270" width="190" height="50" rx="5" fill="#3a1e1e" stroke="#f38ba8" stroke-width="2"/>
  <text x="855" y="290" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="10">NO INLINING</text>
  <text x="855" y="306" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="9">Indirect call every time</text>

  <line x1="855" y1="320" x2="855" y2="350" stroke="#f38ba8" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <rect x="760" y="350" width="190" height="50" rx="5" fill="#3a1e1e" stroke="#f38ba8" stroke-width="2"/>
  <text x="855" y="370" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="10">NO ESCAPE ANALYSIS</text>
  <text x="855" y="386" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="9">Objects allocated on heap</text>

  <!-- Summary Box -->
  <rect x="450" y="510" width="530" height="175" rx="6" fill="#313244" stroke="#585b70" stroke-width="1"/>
  <text x="470" y="535" fill="#cdd6f4" font-family="monospace" font-size="12" font-weight="bold">Performance Impact Summary</text>

  <text x="470" y="560" fill="#a6e3a1" font-family="monospace" font-size="10">Monomorphic: Inlined + Escape Analysis = 0 allocations, ~2ns/op</text>
  <text x="470" y="580" fill="#89b4fa" font-family="monospace" font-size="10">Bimorphic:   Type guard + Branch = partial inline, ~8ns/op</text>
  <text x="470" y="600" fill="#f38ba8" font-family="monospace" font-size="10">Megamorphic: vtable dispatch = no inline, ~25ns/op</text>

  <line x1="470" y1="615" x2="960" y2="615" stroke="#585b70" stroke-width="1" stroke-dasharray="3"/>

  <text x="470" y="635" fill="#7f849c" font-family="monospace" font-size="10">Inlining threshold: -XX:MaxInlineSize=35 (bytecodes, default)</text>
  <text x="470" y="652" fill="#7f849c" font-family="monospace" font-size="10">Freq inline size:   -XX:FreqInlineSize=325 (for hot methods)</text>
  <text x="470" y="669" fill="#7f849c" font-family="monospace" font-size="10">Max inline depth:   -XX:MaxInlineLevel=15 (nested calls)</text>
</svg>