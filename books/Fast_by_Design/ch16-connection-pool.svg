<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620">
  <rect width="900" height="620" rx="8" fill="#1e1e2e"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="16" font-weight="bold">Connection Pool Size vs Throughput and Latency</text>

  <!-- Chart area -->
  <rect x="80" y="50" width="780" height="300" rx="4" fill="#181825" stroke="#45475a" stroke-width="1"/>

  <!-- Y-axis left: Throughput -->
  <text x="22" y="200" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="10" transform="rotate(-90 22 200)">Throughput (ops/s)</text>

  <!-- Y-axis right: P99 Latency -->
  <text x="878" y="200" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="10" transform="rotate(90 878 200)">P99 Latency (ms)</text>

  <!-- Y-axis grid lines and labels (left: throughput) -->
  <line x1="100" y1="80" x2="840" y2="80" stroke="#313244" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="90" y="84" text-anchor="end" fill="#89b4fa" font-family="monospace" font-size="9">20K</text>

  <line x1="100" y1="140" x2="840" y2="140" stroke="#313244" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="90" y="144" text-anchor="end" fill="#89b4fa" font-family="monospace" font-size="9">16K</text>

  <line x1="100" y1="200" x2="840" y2="200" stroke="#313244" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="90" y="204" text-anchor="end" fill="#89b4fa" font-family="monospace" font-size="9">12K</text>

  <line x1="100" y1="260" x2="840" y2="260" stroke="#313244" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="90" y="264" text-anchor="end" fill="#89b4fa" font-family="monospace" font-size="9">8K</text>

  <line x1="100" y1="320" x2="840" y2="320" stroke="#313244" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="90" y="324" text-anchor="end" fill="#89b4fa" font-family="monospace" font-size="9">4K</text>

  <!-- X-axis labels -->
  <text x="450" y="365" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="11">Pool Size (connections)</text>
  <text x="170" y="355" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="9">5</text>
  <text x="318" y="355" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="9">10</text>
  <text x="466" y="355" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="9">20</text>
  <text x="614" y="355" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="9">50</text>
  <text x="762" y="355" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="9">100</text>

  <!-- Throughput line (blue) - peaks at 10 connections -->
  <!-- 5: 12,400 -> y=196 | 10: 18,200 -> y=99 | 20: 17,800 -> y=106 | 50: 14,100 -> y=168 | 100: 9,800 -> y=240 -->
  <polyline fill="none" stroke="#89b4fa" stroke-width="3"
    points="170,196 318,99 466,106 614,168 762,240"/>
  <circle cx="170" cy="196" r="5" fill="#89b4fa"/>
  <circle cx="318" cy="99" r="6" fill="#89b4fa" stroke="#1e1e2e" stroke-width="2"/>
  <circle cx="466" cy="106" r="5" fill="#89b4fa"/>
  <circle cx="614" cy="168" r="5" fill="#89b4fa"/>
  <circle cx="762" cy="240" r="5" fill="#89b4fa"/>

  <!-- Throughput labels -->
  <text x="170" y="188" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="8">12.4K</text>
  <text x="318" y="88" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="9" font-weight="bold">18.2K</text>
  <text x="466" y="98" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="8">17.8K</text>
  <text x="614" y="160" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="8">14.1K</text>
  <text x="762" y="232" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="8">9.8K</text>

  <!-- P99 Latency line (red) - increases with pool size -->
  <!-- 5: 18ms -> y=277 | 10: 12ms -> y=290 | 20: 15ms -> y=283 | 50: 32ms -> y=247 | 100: 68ms -> y=171 -->
  <polyline fill="none" stroke="#f38ba8" stroke-width="3" stroke-dasharray="8,4"
    points="170,277 318,290 466,283 614,247 762,171"/>
  <circle cx="170" cy="277" r="5" fill="#f38ba8"/>
  <circle cx="318" cy="290" r="6" fill="#f38ba8" stroke="#1e1e2e" stroke-width="2"/>
  <circle cx="466" cy="283" r="5" fill="#f38ba8"/>
  <circle cx="614" cy="247" r="5" fill="#f38ba8"/>
  <circle cx="762" cy="171" r="5" fill="#f38ba8"/>

  <!-- P99 labels -->
  <text x="170" y="272" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="8">18ms</text>
  <text x="318" y="306" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="9" font-weight="bold">12ms</text>
  <text x="466" y="298" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="8">15ms</text>
  <text x="614" y="242" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="8">32ms</text>
  <text x="762" y="164" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="8">68ms</text>

  <!-- Optimal zone highlight -->
  <rect x="290" y="55" width="60" height="290" rx="0" fill="#a6e3a1" opacity="0.06"/>
  <text x="320" y="70" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="9" font-weight="bold">OPTIMAL</text>

  <!-- Legend -->
  <rect x="80" y="380" width="780" height="35" rx="4" fill="#181825" stroke="#45475a" stroke-width="1"/>
  <line x1="150" y1="398" x2="190" y2="398" stroke="#89b4fa" stroke-width="3"/>
  <circle cx="170" cy="398" r="4" fill="#89b4fa"/>
  <text x="200" y="402" fill="#89b4fa" font-family="monospace" font-size="10">Throughput (ops/s)</text>
  <line x1="450" y1="398" x2="490" y2="398" stroke="#f38ba8" stroke-width="3" stroke-dasharray="8,4"/>
  <circle cx="470" cy="398" r="4" fill="#f38ba8"/>
  <text x="500" y="402" fill="#f38ba8" font-family="monospace" font-size="10">P99 Latency (ms)</text>

  <!-- DB CPU section -->
  <rect x="80" y="430" width="780" height="80" rx="4" fill="#181825" stroke="#45475a" stroke-width="1"/>
  <text x="450" y="450" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="11" font-weight="bold">Database CPU Utilization</text>

  <!-- CPU bars -->
  <text x="170" y="472" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="8">5 conn</text>
  <rect x="130" y="478" width="80" height="12" rx="2" fill="#313244"/>
  <rect x="130" y="478" width="22" height="12" rx="2" fill="#a6e3a1"/>
  <text x="158" y="488" fill="#a6e3a1" font-family="monospace" font-size="8">28%</text>

  <text x="318" y="472" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="8">10 conn</text>
  <rect x="278" y="478" width="80" height="12" rx="2" fill="#313244"/>
  <rect x="278" y="478" width="36" height="12" rx="2" fill="#a6e3a1"/>
  <text x="320" y="488" fill="#a6e3a1" font-family="monospace" font-size="8">45%</text>

  <text x="466" y="472" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="8">20 conn</text>
  <rect x="426" y="478" width="80" height="12" rx="2" fill="#313244"/>
  <rect x="426" y="478" width="49" height="12" rx="2" fill="#f9e2af"/>
  <text x="481" y="488" fill="#f9e2af" font-family="monospace" font-size="8">61%</text>

  <text x="614" y="472" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="8">50 conn</text>
  <rect x="574" y="478" width="80" height="12" rx="2" fill="#313244"/>
  <rect x="574" y="478" width="66" height="12" rx="2" fill="#f38ba8" opacity="0.7"/>
  <text x="645" y="488" fill="#f38ba8" font-family="monospace" font-size="8">82%</text>

  <text x="762" y="472" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="8">100 conn</text>
  <rect x="722" y="478" width="80" height="12" rx="2" fill="#313244"/>
  <rect x="722" y="478" width="75" height="12" rx="2" fill="#f38ba8"/>
  <text x="802" y="488" fill="#f38ba8" font-family="monospace" font-size="8">94%</text>

  <!-- Formula and insight box -->
  <rect x="120" y="525" width="660" height="80" rx="6" fill="#313244" stroke="#a6e3a1" stroke-width="1"/>
  <text x="450" y="548" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="11" font-weight="bold">Pool Size Formula: connections = (CPU cores x 2) / nodes</text>
  <text x="450" y="568" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="10">16-core DB, 8 app nodes: (16 x 2) / 8 = 4 per node (10 with headroom)</text>
  <text x="450" y="588" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="9">More connections past the optimal point DECREASE throughput and INCREASE latency</text>
</svg>
