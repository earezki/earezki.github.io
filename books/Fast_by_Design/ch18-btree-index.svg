<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700">
  <rect width="900" height="700" rx="8" fill="#1e1e2e"/>

  <!-- Title -->
  <text x="450" y="28" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="15" font-weight="bold">B-tree Index Structure: Standard vs Covering Index</text>

  <!-- Left side: Standard B-tree -->
  <text x="225" y="58" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="12" font-weight="bold">Standard Index (category_id, published_at)</text>

  <!-- Root node -->
  <rect x="140" y="72" width="170" height="36" rx="4" fill="#181825" stroke="#89b4fa" stroke-width="2"/>
  <text x="225" y="88" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="9">Root: [5|...|12|...|19]</text>
  <text x="225" y="100" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="8">1 page | Level 0</text>

  <!-- Edges to internal nodes -->
  <line x1="175" y1="108" x2="110" y2="132" stroke="#45475a" stroke-width="1"/>
  <line x1="225" y1="108" x2="225" y2="132" stroke="#45475a" stroke-width="1"/>
  <line x1="275" y1="108" x2="340" y2="132" stroke="#45475a" stroke-width="1"/>

  <!-- Internal nodes -->
  <rect x="40" y="132" width="140" height="32" rx="4" fill="#181825" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="110" y="152" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="8">Internal | cat 1-4</text>

  <rect x="155" y="132" width="140" height="32" rx="4" fill="#181825" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="225" y="152" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="8">Internal | cat 5-12</text>

  <rect x="270" y="132" width="140" height="32" rx="4" fill="#181825" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="340" y="152" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="8">Internal | cat 13-20</text>

  <!-- Edges to leaf nodes -->
  <line x1="185" y1="164" x2="70" y2="192" stroke="#45475a" stroke-width="1"/>
  <line x1="225" y1="164" x2="180" y2="192" stroke="#45475a" stroke-width="1"/>
  <line x1="265" y1="164" x2="290" y2="192" stroke="#45475a" stroke-width="1"/>
  <line x1="295" y1="164" x2="400" y2="192" stroke="#45475a" stroke-width="1"/>

  <!-- Leaf nodes -->
  <rect x="20" y="192" width="105" height="54" rx="4" fill="#181825" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="72" y="208" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="8">Leaf Page</text>
  <text x="72" y="220" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="7">cat=5, 2026-05-29</text>
  <text x="72" y="230" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="7">cat=5, 2026-05-28</text>
  <text x="72" y="240" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="7">~350 entries/page</text>

  <rect x="132" y="192" width="105" height="54" rx="4" fill="#181825" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="184" y="208" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="8">Leaf Page</text>
  <text x="184" y="220" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="7">cat=5, 2026-05-15</text>
  <text x="184" y="230" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="7">cat=5, 2026-05-14</text>
  <text x="184" y="240" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="7">+ TID -> heap</text>

  <rect x="244" y="192" width="105" height="54" rx="4" fill="#181825" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="296" y="208" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="8">Leaf Page</text>
  <text x="296" y="220" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="7">cat=7, 2026-05-28</text>
  <text x="296" y="230" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="7">cat=7, 2026-05-27</text>
  <text x="296" y="240" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="7">+ TID -> heap</text>

  <rect x="356" y="192" width="105" height="54" rx="4" fill="#181825" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="408" y="208" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="8">Leaf Page</text>
  <text x="408" y="220" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="7">cat=12, 2026-05-29</text>
  <text x="408" y="230" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="7">cat=12, 2026-05-28</text>
  <text x="408" y="240" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="7">+ TID -> heap</text>

  <!-- Arrow from leaf to heap -->
  <line x1="72" y1="246" x2="72" y2="272" stroke="#f38ba8" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrowhead)"/>
  <line x1="184" y1="246" x2="184" y2="272" stroke="#f38ba8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="296" y1="246" x2="296" y2="272" stroke="#f38ba8" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Heap pages -->
  <rect x="20" y="272" width="430" height="34" rx="4" fill="#181825" stroke="#f38ba8" stroke-width="1"/>
  <text x="235" y="286" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="9">Heap (Table): title, slug, content, excerpt, view_count, ...</text>
  <text x="235" y="298" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="8">Random I/O: 1 page read per row | 64 buffer hits for 20 rows</text>

  <!-- Standard index stats -->
  <rect x="30" y="316" width="180" height="42" rx="4" fill="#181825" stroke="#45475a" stroke-width="1"/>
  <text x="120" y="332" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="9">Size: 1,400 pages</text>
  <text x="120" y="348" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="9">Entry: key + TID (22B)</text>

  <!-- Separator -->
  <line x1="450" y1="52" x2="450" y2="370" stroke="#313244" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- Right side: Covering B-tree -->
  <text x="675" y="58" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="12" font-weight="bold">Covering Index (INCLUDE title, slug, ...)</text>

  <!-- Root node -->
  <rect x="590" y="72" width="170" height="36" rx="4" fill="#181825" stroke="#a6e3a1" stroke-width="2"/>
  <text x="675" y="88" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="9">Root: [5|...|12|...|19]</text>
  <text x="675" y="100" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="8">1 page | Level 0</text>

  <!-- Edges to internal nodes -->
  <line x1="625" y1="108" x2="560" y2="132" stroke="#45475a" stroke-width="1"/>
  <line x1="675" y1="108" x2="675" y2="132" stroke="#45475a" stroke-width="1"/>
  <line x1="725" y1="108" x2="790" y2="132" stroke="#45475a" stroke-width="1"/>

  <!-- Internal nodes -->
  <rect x="490" y="132" width="140" height="32" rx="4" fill="#181825" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="560" y="152" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="8">Internal | cat 1-4</text>

  <rect x="605" y="132" width="140" height="32" rx="4" fill="#181825" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="675" y="152" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="8">Internal | cat 5-12</text>

  <rect x="720" y="132" width="140" height="32" rx="4" fill="#181825" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="790" y="152" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="8">Internal | cat 13-20</text>

  <!-- Edges to leaf nodes -->
  <line x1="635" y1="164" x2="540" y2="192" stroke="#45475a" stroke-width="1"/>
  <line x1="675" y1="164" x2="660" y2="192" stroke="#45475a" stroke-width="1"/>
  <line x1="715" y1="164" x2="770" y2="192" stroke="#45475a" stroke-width="1"/>

  <!-- Covering leaf nodes (wider) -->
  <rect x="470" y="192" width="145" height="72" rx="4" fill="#181825" stroke="#a6e3a1" stroke-width="2"/>
  <text x="542" y="206" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="8" font-weight="bold">Leaf Page (wider)</text>
  <text x="542" y="218" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="7">cat=5, 2026-05-29</text>
  <text x="542" y="228" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="7">+ title, slug, excerpt</text>
  <text x="542" y="240" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="7">cat=5, 2026-05-28</text>
  <text x="542" y="250" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="7">+ title, slug, excerpt</text>
  <text x="542" y="260" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="7">~120 entries/page</text>

  <rect x="622" y="192" width="145" height="72" rx="4" fill="#181825" stroke="#a6e3a1" stroke-width="2"/>
  <text x="694" y="206" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="8" font-weight="bold">Leaf Page (wider)</text>
  <text x="694" y="218" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="7">cat=5, 2026-05-15</text>
  <text x="694" y="228" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="7">+ title, slug, excerpt</text>
  <text x="694" y="240" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="7">cat=5, 2026-05-14</text>
  <text x="694" y="250" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="7">+ title, slug, excerpt</text>
  <text x="694" y="260" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="7">No heap fetch needed</text>

  <rect x="774" y="192" width="105" height="72" rx="4" fill="#181825" stroke="#a6e3a1" stroke-width="2"/>
  <text x="826" y="206" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="8" font-weight="bold">Leaf Page</text>
  <text x="826" y="220" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="7">cat=7, ...</text>
  <text x="826" y="232" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="7">+ included</text>
  <text x="826" y="244" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="7">  columns</text>
  <text x="826" y="260" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="7">Index Only</text>

  <!-- No arrow to heap - crossed out -->
  <text x="675" y="284" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="10" font-weight="bold">No Heap Access Required</text>
  <text x="675" y="298" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="9">Index Only Scan: Heap Fetches = 0</text>

  <!-- Covering index stats -->
  <rect x="570" y="316" width="210" height="42" rx="4" fill="#181825" stroke="#45475a" stroke-width="1"/>
  <text x="675" y="332" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="9">Size: 4,200 pages (3x larger)</text>
  <text x="675" y="348" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="9">Entry: key + INCLUDE cols (~90B)</text>

  <!-- Horizontal divider -->
  <line x1="30" y1="380" x2="870" y2="380" stroke="#313244" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Bottom section: Bloat visualization -->
  <text x="450" y="405" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="13" font-weight="bold">Index Bloat: Leaf Page Density Over Time</text>

  <!-- Healthy leaf page -->
  <text x="150" y="430" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="10">Healthy (90% density)</text>
  <rect x="40" y="438" width="220" height="80" rx="4" fill="#181825" stroke="#a6e3a1" stroke-width="1.5"/>
  <!-- Fill bars representing entries -->
  <rect x="48" y="446" width="204" height="8" rx="2" fill="#a6e3a1" fill-opacity="0.6"/>
  <rect x="48" y="458" width="204" height="8" rx="2" fill="#a6e3a1" fill-opacity="0.6"/>
  <rect x="48" y="470" width="204" height="8" rx="2" fill="#a6e3a1" fill-opacity="0.6"/>
  <rect x="48" y="482" width="204" height="8" rx="2" fill="#a6e3a1" fill-opacity="0.6"/>
  <rect x="48" y="494" width="184" height="8" rx="2" fill="#a6e3a1" fill-opacity="0.6"/>
  <rect x="236" y="494" width="16" height="8" rx="2" fill="#313244"/>
  <rect x="48" y="506" width="24" height="6" rx="2" fill="#313244"/>
  <text x="150" y="528" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="8">~350 live entries | Buffers: 4 hits</text>

  <!-- Bloated leaf page -->
  <text x="450" y="430" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="10">Bloated (28% density)</text>
  <rect x="340" y="438" width="220" height="80" rx="4" fill="#181825" stroke="#f38ba8" stroke-width="1.5"/>
  <!-- Mix of live (green) and dead (red) entries -->
  <rect x="348" y="446" width="60" height="8" rx="2" fill="#a6e3a1" fill-opacity="0.6"/>
  <rect x="412" y="446" width="44" height="8" rx="2" fill="#f38ba8" fill-opacity="0.3"/>
  <rect x="460" y="446" width="44" height="8" rx="2" fill="#f38ba8" fill-opacity="0.3"/>
  <rect x="508" y="446" width="44" height="8" rx="2" fill="#f38ba8" fill-opacity="0.3"/>
  <rect x="348" y="458" width="44" height="8" rx="2" fill="#f38ba8" fill-opacity="0.3"/>
  <rect x="396" y="458" width="60" height="8" rx="2" fill="#a6e3a1" fill-opacity="0.6"/>
  <rect x="460" y="458" width="44" height="8" rx="2" fill="#f38ba8" fill-opacity="0.3"/>
  <rect x="508" y="458" width="44" height="8" rx="2" fill="#f38ba8" fill-opacity="0.3"/>
  <rect x="348" y="470" width="44" height="8" rx="2" fill="#f38ba8" fill-opacity="0.3"/>
  <rect x="396" y="470" width="44" height="8" rx="2" fill="#f38ba8" fill-opacity="0.3"/>
  <rect x="444" y="470" width="44" height="8" rx="2" fill="#f38ba8" fill-opacity="0.3"/>
  <rect x="492" y="470" width="60" height="8" rx="2" fill="#a6e3a1" fill-opacity="0.6"/>
  <rect x="348" y="482" width="60" height="8" rx="2" fill="#a6e3a1" fill-opacity="0.6"/>
  <rect x="412" y="482" width="44" height="8" rx="2" fill="#f38ba8" fill-opacity="0.3"/>
  <rect x="460" y="482" width="44" height="8" rx="2" fill="#f38ba8" fill-opacity="0.3"/>
  <rect x="508" y="482" width="44" height="8" rx="2" fill="#f38ba8" fill-opacity="0.3"/>
  <rect x="348" y="494" width="44" height="8" rx="2" fill="#f38ba8" fill-opacity="0.3"/>
  <rect x="396" y="494" width="44" height="8" rx="2" fill="#f38ba8" fill-opacity="0.3"/>
  <rect x="444" y="494" width="60" height="8" rx="2" fill="#a6e3a1" fill-opacity="0.6"/>
  <rect x="508" y="494" width="44" height="8" rx="2" fill="#f38ba8" fill-opacity="0.3"/>
  <text x="450" y="528" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="8">~100 live + 250 dead | 5x more pages scanned</text>

  <!-- After REINDEX -->
  <text x="750" y="430" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="10">After REINDEX (90%)</text>
  <rect x="640" y="438" width="220" height="80" rx="4" fill="#181825" stroke="#89b4fa" stroke-width="1.5"/>
  <rect x="648" y="446" width="204" height="8" rx="2" fill="#89b4fa" fill-opacity="0.6"/>
  <rect x="648" y="458" width="204" height="8" rx="2" fill="#89b4fa" fill-opacity="0.6"/>
  <rect x="648" y="470" width="204" height="8" rx="2" fill="#89b4fa" fill-opacity="0.6"/>
  <rect x="648" y="482" width="204" height="8" rx="2" fill="#89b4fa" fill-opacity="0.6"/>
  <rect x="648" y="494" width="184" height="8" rx="2" fill="#89b4fa" fill-opacity="0.6"/>
  <rect x="836" y="494" width="16" height="8" rx="2" fill="#313244"/>
  <text x="750" y="528" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="8">Compacted: 18MB -> 3.6MB</text>

  <!-- Legend -->
  <rect x="40" y="548" width="820" height="44" rx="4" fill="#181825" stroke="#45475a" stroke-width="1"/>
  <rect x="60" y="560" width="12" height="12" rx="2" fill="#a6e3a1" fill-opacity="0.6"/>
  <text x="78" y="570" fill="#cdd6f4" font-family="monospace" font-size="9">Live entries</text>
  <rect x="180" y="560" width="12" height="12" rx="2" fill="#f38ba8" fill-opacity="0.3"/>
  <text x="198" y="570" fill="#cdd6f4" font-family="monospace" font-size="9">Dead entries (from UPDATEs)</text>
  <rect x="400" y="560" width="12" height="12" rx="2" fill="#313244"/>
  <text x="418" y="570" fill="#cdd6f4" font-family="monospace" font-size="9">Free space</text>
  <text x="60" y="584" fill="#6c7086" font-family="monospace" font-size="9">Bloat cause: UPDATE view_count (10K/s) creates dead index entries faster than VACUUM removes them</text>

  <!-- Performance impact box -->
  <rect x="40" y="604" width="820" height="80" rx="4" fill="#181825" stroke="#45475a" stroke-width="1"/>
  <text x="450" y="622" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="11" font-weight="bold">Write-Side Impact: INSERT Throughput vs Index Count</text>
  <!-- Bar chart -->
  <rect x="100" y="636" width="240" height="14" rx="2" fill="#a6e3a1" fill-opacity="0.7"/>
  <text x="90" y="647" text-anchor="end" fill="#6c7086" font-family="monospace" font-size="9">0 idx</text>
  <text x="348" y="647" fill="#a6e3a1" font-family="monospace" font-size="9">28,421 ops/s</text>

  <rect x="100" y="654" width="120" height="14" rx="2" fill="#89b4fa" fill-opacity="0.7"/>
  <text x="90" y="665" text-anchor="end" fill="#6c7086" font-family="monospace" font-size="9">6 idx</text>
  <text x="228" y="665" fill="#89b4fa" font-family="monospace" font-size="9">14,210 ops/s</text>

  <rect x="100" y="672" width="43" height="14" rx="2" fill="#f38ba8" fill-opacity="0.7"/>
  <text x="90" y="683" text-anchor="end" fill="#6c7086" font-family="monospace" font-size="9">12 idx</text>
  <text x="150" y="683" fill="#f38ba8" font-family="monospace" font-size="9">5,124 ops/s (-82%)</text>
</svg>
