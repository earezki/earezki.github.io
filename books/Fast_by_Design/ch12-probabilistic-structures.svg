<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700">
  <defs>
    <marker id="arrBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#89b4fa"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a6e3a1"/>
    </marker>
    <marker id="arrRed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f38ba8"/>
    </marker>
  </defs>
  <rect width="900" height="700" rx="8" fill="#1e1e2e"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="16" font-weight="bold">Probabilistic Data Structures: Bloom Filter and HyperLogLog Internals</text>

  <!-- === Bloom Filter Section === -->
  <rect x="20" y="50" width="860" height="300" rx="6" fill="#181825" stroke="#45475a" stroke-width="1"/>
  <text x="450" y="75" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="13" font-weight="bold">Bloom Filter: Bit Array with k Hash Functions (k=3 shown)</text>

  <!-- Input element -->
  <rect x="40" y="95" width="140" height="30" rx="4" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="110" y="114" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="10">"article-42"</text>

  <!-- Hash function arrows -->
  <line x1="180" y1="105" x2="240" y2="88" stroke="#89b4fa" stroke-width="1.5" marker-end="url(#arrBlue)"/>
  <line x1="180" y1="110" x2="240" y2="110" stroke="#a6e3a1" stroke-width="1.5" marker-end="url(#arrGreen)"/>
  <line x1="180" y1="115" x2="240" y2="132" stroke="#f38ba8" stroke-width="1.5" marker-end="url(#arrRed)"/>

  <!-- Hash function labels -->
  <text x="215" y="84" fill="#89b4fa" font-family="monospace" font-size="8">h1</text>
  <text x="215" y="107" fill="#a6e3a1" font-family="monospace" font-size="8">h2</text>
  <text x="215" y="140" fill="#f38ba8" font-family="monospace" font-size="8">h3</text>

  <!-- Hash results -->
  <text x="260" y="92" fill="#89b4fa" font-family="monospace" font-size="9">= 3</text>
  <text x="260" y="114" fill="#a6e3a1" font-family="monospace" font-size="9">= 7</text>
  <text x="260" y="136" fill="#f38ba8" font-family="monospace" font-size="9">= 12</text>

  <!-- Bit array -->
  <text x="450" y="170" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="10">Bit Array (m = 20 bits shown)</text>

  <!-- Bit array cells -->
  <!-- Bit 0 -->
  <rect x="110" y="180" width="32" height="28" rx="2" fill="#313244" stroke="#45475a" stroke-width="1"/>
  <text x="126" y="198" text-anchor="middle" fill="#45475a" font-family="monospace" font-size="10">0</text>
  <text x="126" y="220" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="7">0</text>
  <!-- Bit 1 -->
  <rect x="145" y="180" width="32" height="28" rx="2" fill="#313244" stroke="#45475a" stroke-width="1"/>
  <text x="161" y="198" text-anchor="middle" fill="#45475a" font-family="monospace" font-size="10">0</text>
  <text x="161" y="220" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="7">1</text>
  <!-- Bit 2 -->
  <rect x="180" y="180" width="32" height="28" rx="2" fill="#313244" stroke="#45475a" stroke-width="1"/>
  <text x="196" y="198" text-anchor="middle" fill="#45475a" font-family="monospace" font-size="10">0</text>
  <text x="196" y="220" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="7">2</text>
  <!-- Bit 3 - SET by h1 -->
  <rect x="215" y="180" width="32" height="28" rx="2" fill="#1e3a5f" stroke="#89b4fa" stroke-width="2"/>
  <text x="231" y="198" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="10" font-weight="bold">1</text>
  <text x="231" y="220" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="7">3</text>
  <!-- Bit 4 -->
  <rect x="250" y="180" width="32" height="28" rx="2" fill="#313244" stroke="#45475a" stroke-width="1"/>
  <text x="266" y="198" text-anchor="middle" fill="#45475a" font-family="monospace" font-size="10">0</text>
  <text x="266" y="220" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="7">4</text>
  <!-- Bit 5 -->
  <rect x="285" y="180" width="32" height="28" rx="2" fill="#313244" stroke="#45475a" stroke-width="1"/>
  <text x="301" y="198" text-anchor="middle" fill="#45475a" font-family="monospace" font-size="10">0</text>
  <text x="301" y="220" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="7">5</text>
  <!-- Bit 6 -->
  <rect x="320" y="180" width="32" height="28" rx="2" fill="#313244" stroke="#45475a" stroke-width="1"/>
  <text x="336" y="198" text-anchor="middle" fill="#45475a" font-family="monospace" font-size="10">0</text>
  <text x="336" y="220" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="7">6</text>
  <!-- Bit 7 - SET by h2 -->
  <rect x="355" y="180" width="32" height="28" rx="2" fill="#1e3f1e" stroke="#a6e3a1" stroke-width="2"/>
  <text x="371" y="198" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="10" font-weight="bold">1</text>
  <text x="371" y="220" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="7">7</text>
  <!-- Bit 8 -->
  <rect x="390" y="180" width="32" height="28" rx="2" fill="#313244" stroke="#45475a" stroke-width="1"/>
  <text x="406" y="198" text-anchor="middle" fill="#45475a" font-family="monospace" font-size="10">0</text>
  <text x="406" y="220" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="7">8</text>
  <!-- Bit 9 -->
  <rect x="425" y="180" width="32" height="28" rx="2" fill="#313244" stroke="#45475a" stroke-width="1"/>
  <text x="441" y="198" text-anchor="middle" fill="#45475a" font-family="monospace" font-size="10">0</text>
  <text x="441" y="220" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="7">9</text>
  <!-- Bit 10 -->
  <rect x="460" y="180" width="32" height="28" rx="2" fill="#313244" stroke="#45475a" stroke-width="1"/>
  <text x="476" y="198" text-anchor="middle" fill="#45475a" font-family="monospace" font-size="10">0</text>
  <text x="476" y="220" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="7">10</text>
  <!-- Bit 11 -->
  <rect x="495" y="180" width="32" height="28" rx="2" fill="#313244" stroke="#45475a" stroke-width="1"/>
  <text x="511" y="198" text-anchor="middle" fill="#45475a" font-family="monospace" font-size="10">0</text>
  <text x="511" y="220" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="7">11</text>
  <!-- Bit 12 - SET by h3 -->
  <rect x="530" y="180" width="32" height="28" rx="2" fill="#3f1e1e" stroke="#f38ba8" stroke-width="2"/>
  <text x="546" y="198" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="10" font-weight="bold">1</text>
  <text x="546" y="220" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="7">12</text>
  <!-- Bit 13 -->
  <rect x="565" y="180" width="32" height="28" rx="2" fill="#313244" stroke="#45475a" stroke-width="1"/>
  <text x="581" y="198" text-anchor="middle" fill="#45475a" font-family="monospace" font-size="10">0</text>
  <text x="581" y="220" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="7">13</text>
  <!-- Bit 14 -->
  <rect x="600" y="180" width="32" height="28" rx="2" fill="#313244" stroke="#45475a" stroke-width="1"/>
  <text x="616" y="198" text-anchor="middle" fill="#45475a" font-family="monospace" font-size="10">0</text>
  <text x="616" y="220" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="7">14</text>
  <!-- Bit 15 -->
  <rect x="635" y="180" width="32" height="28" rx="2" fill="#313244" stroke="#45475a" stroke-width="1"/>
  <text x="651" y="198" text-anchor="middle" fill="#45475a" font-family="monospace" font-size="10">0</text>
  <text x="651" y="220" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="7">15</text>
  <!-- Bit 16-19 dots -->
  <text x="700" y="198" fill="#6c7086" font-family="monospace" font-size="10">...</text>

  <!-- False positive explanation -->
  <rect x="100" y="240" width="700" height="45" rx="4" fill="#313244" stroke="#f9e2af" stroke-width="1"/>
  <text x="450" y="258" text-anchor="middle" fill="#f9e2af" font-family="monospace" font-size="9" font-weight="bold">mightContain("article-42"): bits[3]=1, bits[7]=1, bits[12]=1 -> PROBABLY IN SET</text>
  <text x="450" y="274" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="9">mightContain("article-99"): bits[2]=0 -> DEFINITELY NOT IN SET (early exit)</text>

  <!-- Memory comparison -->
  <rect x="100" y="296" width="700" height="45" rx="4" fill="#313244" stroke="#a6e3a1" stroke-width="1"/>
  <text x="450" y="312" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="9">18M articles: HashSet = 3.2 GB | Bloom (1% FPR) = 20.6 MB | 155x savings</text>
  <text x="450" y="328" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="9">FPR = (1 - e^(-kn/m))^k | Optimal k = (m/n) * ln(2) | m = -n*ln(p) / (ln2)^2</text>

  <!-- === HyperLogLog Section === -->
  <rect x="20" y="360" width="860" height="330" rx="6" fill="#181825" stroke="#45475a" stroke-width="1"/>
  <text x="450" y="385" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="13" font-weight="bold">HyperLogLog: Register Array with Leading-Zero Counting (p=4, m=16 registers)</text>

  <!-- Hash explanation -->
  <rect x="40" y="400" width="200" height="50" rx="4" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="140" y="418" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="9">hash("visitor-123")</text>
  <text x="140" y="434" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="9">= 0101 000010110...</text>

  <!-- Arrow to split -->
  <line x1="240" y1="425" x2="280" y2="425" stroke="#89b4fa" stroke-width="1.5" marker-end="url(#arrBlue)"/>

  <!-- Split explanation -->
  <rect x="285" y="400" width="280" height="50" rx="4" fill="#313244" stroke="#a6e3a1" stroke-width="1"/>
  <text x="425" y="418" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="9">First p=4 bits: 0101 -> register[5]</text>
  <text x="425" y="434" text-anchor="middle" fill="#f9e2af" font-family="monospace" font-size="9">Remaining: 000010110... -> rho=4</text>

  <!-- Arrow to register -->
  <line x1="565" y1="425" x2="600" y2="425" stroke="#a6e3a1" stroke-width="1.5" marker-end="url(#arrGreen)"/>

  <!-- Max update -->
  <rect x="605" y="400" width="250" height="50" rx="4" fill="#313244" stroke="#f9e2af" stroke-width="1"/>
  <text x="730" y="418" text-anchor="middle" fill="#f9e2af" font-family="monospace" font-size="9">register[5] = max(old, 4)</text>
  <text x="730" y="434" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="9">rho = leading zeros + 1</text>

  <!-- Register array -->
  <text x="450" y="475" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="10">Register Array (m = 2^p = 16 registers)</text>

  <!-- Register cells -->
  <rect x="70" y="488" width="46" height="35" rx="2" fill="#313244" stroke="#45475a" stroke-width="1"/>
  <text x="93" y="502" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="11">2</text>
  <text x="93" y="530" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="7">[0]</text>

  <rect x="120" y="488" width="46" height="35" rx="2" fill="#313244" stroke="#45475a" stroke-width="1"/>
  <text x="143" y="502" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="11">5</text>
  <text x="143" y="530" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="7">[1]</text>

  <rect x="170" y="488" width="46" height="35" rx="2" fill="#313244" stroke="#45475a" stroke-width="1"/>
  <text x="193" y="502" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="11">1</text>
  <text x="193" y="530" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="7">[2]</text>

  <rect x="220" y="488" width="46" height="35" rx="2" fill="#313244" stroke="#45475a" stroke-width="1"/>
  <text x="243" y="502" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="11">3</text>
  <text x="243" y="530" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="7">[3]</text>

  <rect x="270" y="488" width="46" height="35" rx="2" fill="#313244" stroke="#45475a" stroke-width="1"/>
  <text x="293" y="502" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="11">7</text>
  <text x="293" y="530" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="7">[4]</text>

  <!-- Register 5 highlighted -->
  <rect x="320" y="488" width="46" height="35" rx="2" fill="#1e3a5f" stroke="#89b4fa" stroke-width="2"/>
  <text x="343" y="502" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="11" font-weight="bold">4</text>
  <text x="343" y="530" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="7">[5]</text>

  <rect x="370" y="488" width="46" height="35" rx="2" fill="#313244" stroke="#45475a" stroke-width="1"/>
  <text x="393" y="502" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="11">2</text>
  <text x="393" y="530" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="7">[6]</text>

  <rect x="420" y="488" width="46" height="35" rx="2" fill="#313244" stroke="#45475a" stroke-width="1"/>
  <text x="443" y="502" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="11">6</text>
  <text x="443" y="530" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="7">[7]</text>

  <rect x="470" y="488" width="46" height="35" rx="2" fill="#313244" stroke="#45475a" stroke-width="1"/>
  <text x="493" y="502" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="11">1</text>
  <text x="493" y="530" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="7">[8]</text>

  <rect x="520" y="488" width="46" height="35" rx="2" fill="#313244" stroke="#45475a" stroke-width="1"/>
  <text x="543" y="502" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="11">3</text>
  <text x="543" y="530" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="7">[9]</text>

  <rect x="570" y="488" width="46" height="35" rx="2" fill="#313244" stroke="#45475a" stroke-width="1"/>
  <text x="593" y="502" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="11">4</text>
  <text x="593" y="530" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="7">[10]</text>

  <rect x="620" y="488" width="46" height="35" rx="2" fill="#313244" stroke="#45475a" stroke-width="1"/>
  <text x="643" y="502" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="11">2</text>
  <text x="643" y="530" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="7">[11]</text>

  <rect x="670" y="488" width="46" height="35" rx="2" fill="#313244" stroke="#45475a" stroke-width="1"/>
  <text x="693" y="502" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="11">5</text>
  <text x="693" y="530" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="7">[12]</text>

  <rect x="720" y="488" width="46" height="35" rx="2" fill="#313244" stroke="#45475a" stroke-width="1"/>
  <text x="743" y="502" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="11">1</text>
  <text x="743" y="530" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="7">[13]</text>

  <rect x="770" y="488" width="46" height="35" rx="2" fill="#313244" stroke="#45475a" stroke-width="1"/>
  <text x="793" y="502" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="11">3</text>
  <text x="793" y="530" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="7">[14]</text>

  <!-- Estimate formula -->
  <rect x="100" y="545" width="700" height="50" rx="4" fill="#313244" stroke="#a6e3a1" stroke-width="1"/>
  <text x="450" y="563" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="10" font-weight="bold">E = alpha * m^2 * (sum(2^(-M[j])))^(-1)</text>
  <text x="450" y="582" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="9">p=14: 16,384 registers, 16 KB memory, ~0.81% standard error</text>

  <!-- Bottom comparison -->
  <rect x="100" y="605" width="700" height="40" rx="4" fill="#313244" stroke="#89b4fa" stroke-width="1"/>
  <text x="220" y="623" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="9">HashSet: 128 MB</text>
  <text x="450" y="623" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="9">HyperLogLog: 16 KB</text>
  <text x="680" y="623" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="9">8,000x savings</text>
  <text x="450" y="638" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="8">For 1M unique visitors: exact vs approximate cardinality estimation</text>
</svg>
