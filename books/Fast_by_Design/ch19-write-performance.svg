<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="900" height="550">
  <rect width="900" height="550" rx="8" fill="#1e1e2e"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="15" font-weight="bold">Write Performance: Throughput by Method (10,000 rows)</text>

  <!-- Y-axis label -->
  <text x="20" y="290" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="11" transform="rotate(-90, 20, 290)">Rows/sec</text>

  <!-- Y-axis ticks -->
  <line x1="100" y1="70" x2="100" y2="460" stroke="#45475a" stroke-width="1"/>
  <text x="90" y="460" text-anchor="end" fill="#6c7086" font-family="monospace" font-size="10">0</text>
  <line x1="95" y1="460" x2="100" y2="460" stroke="#6c7086" stroke-width="1"/>
  <text x="90" y="382" text-anchor="end" fill="#6c7086" font-family="monospace" font-size="10">2,500</text>
  <line x1="95" y1="382" x2="850" y2="382" stroke="#313244" stroke-width="1" stroke-dasharray="4"/>
  <text x="90" y="304" text-anchor="end" fill="#6c7086" font-family="monospace" font-size="10">5,000</text>
  <line x1="95" y1="304" x2="850" y2="304" stroke="#313244" stroke-width="1" stroke-dasharray="4"/>
  <text x="90" y="226" text-anchor="end" fill="#6c7086" font-family="monospace" font-size="10">7,500</text>
  <line x1="95" y1="226" x2="850" y2="226" stroke="#313244" stroke-width="1" stroke-dasharray="4"/>
  <text x="90" y="148" text-anchor="end" fill="#6c7086" font-family="monospace" font-size="10">10,000</text>
  <line x1="95" y1="148" x2="850" y2="148" stroke="#313244" stroke-width="1" stroke-dasharray="4"/>
  <text x="90" y="70" text-anchor="end" fill="#6c7086" font-family="monospace" font-size="10">12,500</text>
  <line x1="95" y1="70" x2="850" y2="70" stroke="#313244" stroke-width="1" stroke-dasharray="4"/>

  <!-- X-axis -->
  <line x1="100" y1="460" x2="850" y2="460" stroke="#45475a" stroke-width="1"/>

  <!-- Bar 1: Single INSERT + autocommit = 704 rows/sec -->
  <rect x="130" y="438" width="100" height="22" rx="3" fill="#f38ba8"/>
  <text x="180" y="432" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="11" font-weight="bold">704</text>
  <text x="180" y="485" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="9">Single INSERT</text>
  <text x="180" y="498" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="8">autocommit</text>
  <text x="180" y="515" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="8">10,000 fsyncs</text>

  <!-- Bar 2: Batch INSERT (100/commit) = 3,846 rows/sec -->
  <rect x="260" y="340" width="100" height="120" rx="3" fill="#fab387"/>
  <text x="310" y="333" text-anchor="middle" fill="#fab387" font-family="monospace" font-size="11" font-weight="bold">3,846</text>
  <text x="310" y="485" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="9">Batch INSERT</text>
  <text x="310" y="498" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="8">100/commit</text>
  <text x="310" y="515" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="8">100 fsyncs</text>

  <!-- Bar 3: Batch INSERT (1000/commit) = 5,556 rows/sec -->
  <rect x="390" y="287" width="100" height="173" rx="3" fill="#f9e2af"/>
  <text x="440" y="280" text-anchor="middle" fill="#f9e2af" font-family="monospace" font-size="11" font-weight="bold">5,556</text>
  <text x="440" y="485" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="9">Batch INSERT</text>
  <text x="440" y="498" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="8">1000/commit</text>
  <text x="440" y="515" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="8">10 fsyncs</text>

  <!-- Bar 4: JDBC Batch rewrite = 9,524 rows/sec -->
  <rect x="520" y="163" width="100" height="297" rx="3" fill="#89b4fa"/>
  <text x="570" y="156" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="11" font-weight="bold">9,524</text>
  <text x="570" y="485" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="9">JDBC Batch</text>
  <text x="570" y="498" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="8">rewrite=true</text>
  <text x="570" y="515" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="8">1 fsync</text>

  <!-- Bar 5: COPY text = 11,111 rows/sec -->
  <rect x="650" y="114" width="100" height="346" rx="3" fill="#a6e3a1"/>
  <text x="700" y="107" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="11" font-weight="bold">11,111</text>
  <text x="700" y="485" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="9">COPY</text>
  <text x="700" y="498" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="8">text format</text>
  <text x="700" y="515" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="8">1 fsync</text>

  <!-- Bar 6: COPY binary = 12,500 rows/sec (slightly taller) -->
  <rect x="780" y="70" width="60" height="390" rx="3" fill="#a6e3a1" opacity="0.7"/>
  <text x="810" y="63" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="10" font-weight="bold">12,500</text>
  <text x="810" y="485" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="8">COPY</text>
  <text x="810" y="498" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="7">binary</text>

  <!-- Annotation: speedup -->
  <line x1="180" y1="440" x2="700" y2="120" stroke="#cdd6f4" stroke-width="1" stroke-dasharray="6" opacity="0.4"/>
  <text x="500" y="55" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="12" font-weight="bold">16x throughput improvement</text>

  <!-- Legend: fsync explanation -->
  <rect x="120" y="530" width="8" height="8" fill="#f38ba8"/>
  <text x="133" y="538" fill="#6c7086" font-family="monospace" font-size="9">fsync-bound</text>
  <rect x="260" y="530" width="8" height="8" fill="#a6e3a1"/>
  <text x="273" y="538" fill="#6c7086" font-family="monospace" font-size="9">I/O-bound (fsync amortized)</text>
</svg>
