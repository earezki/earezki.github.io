<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620">
  <rect width="900" height="620" rx="8" fill="#1e1e2e"/>

  <!-- Title -->
  <text x="450" y="28" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="14" font-weight="bold">Disk I/O Performance: IOPS by Storage Type (4KB Random Read, QD=32)</text>
  <text x="450" y="48" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="10">Measured with fio --rw=randread --bs=4k --iodepth=32 --direct=1 --ioengine=libaio</text>

  <!-- Y-axis label -->
  <text x="18" y="320" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="11" transform="rotate(-90, 18, 320)">IOPS (thousands)</text>

  <!-- Y-axis gridlines and labels -->
  <!-- Max value: 800K, scale: 0-800K -->
  <!-- Chart area: x=120..850, y=70..500 -->
  <!-- y=500 is 0, y=70 is 800K -->

  <line x1="120" y1="500" x2="850" y2="500" stroke="#313244" stroke-width="1"/>
  <text x="110" y="504" text-anchor="end" fill="#6c7086" font-family="monospace" font-size="10">0</text>

  <line x1="120" y1="446" x2="850" y2="446" stroke="#313244" stroke-width="1" stroke-dasharray="4"/>
  <text x="110" y="450" text-anchor="end" fill="#6c7086" font-family="monospace" font-size="10">100K</text>

  <line x1="120" y1="393" x2="850" y2="393" stroke="#313244" stroke-width="1" stroke-dasharray="4"/>
  <text x="110" y="397" text-anchor="end" fill="#6c7086" font-family="monospace" font-size="10">200K</text>

  <line x1="120" y1="339" x2="850" y2="339" stroke="#313244" stroke-width="1" stroke-dasharray="4"/>
  <text x="110" y="343" text-anchor="end" fill="#6c7086" font-family="monospace" font-size="10">300K</text>

  <line x1="120" y1="285" x2="850" y2="285" stroke="#313244" stroke-width="1" stroke-dasharray="4"/>
  <text x="110" y="289" text-anchor="end" fill="#6c7086" font-family="monospace" font-size="10">400K</text>

  <line x1="120" y1="231" x2="850" y2="231" stroke="#313244" stroke-width="1" stroke-dasharray="4"/>
  <text x="110" y="235" text-anchor="end" fill="#6c7086" font-family="monospace" font-size="10">500K</text>

  <line x1="120" y1="178" x2="850" y2="178" stroke="#313244" stroke-width="1" stroke-dasharray="4"/>
  <text x="110" y="182" text-anchor="end" fill="#6c7086" font-family="monospace" font-size="10">600K</text>

  <line x1="120" y1="124" x2="850" y2="124" stroke="#313244" stroke-width="1" stroke-dasharray="4"/>
  <text x="110" y="128" text-anchor="end" fill="#6c7086" font-family="monospace" font-size="10">700K</text>

  <line x1="120" y1="70" x2="850" y2="70" stroke="#313244" stroke-width="1" stroke-dasharray="4"/>
  <text x="110" y="74" text-anchor="end" fill="#6c7086" font-family="monospace" font-size="10">800K</text>

  <!-- X-axis baseline -->
  <line x1="120" y1="500" x2="120" y2="70" stroke="#45475a" stroke-width="1"/>

  <!-- Bars: 6 storage types, bar width=90, gap=25 -->
  <!-- 1. HDD 7200 RPM: 100 IOPS -->
  <!-- Scale: 1K IOPS = 0.5375px (430px / 800K) -->
  <!-- 100 IOPS ~ 0.05px, make minimum visible height of 3px -->
  <rect x="138" y="497" width="90" height="3" rx="2" fill="#f38ba8"/>
  <text x="183" y="493" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="10" font-weight="bold">100</text>
  <text x="183" y="518" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="9">HDD</text>
  <text x="183" y="530" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="8">7200 RPM</text>

  <!-- 2. EBS gp3: 3,000 IOPS -->
  <!-- 3K * 0.5375 = 1.6px, min 4px -->
  <rect x="253" y="498" width="90" height="2" rx="2" fill="#fab387"/>
  <text x="298" y="493" text-anchor="middle" fill="#fab387" font-family="monospace" font-size="10" font-weight="bold">3K</text>
  <text x="298" y="518" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="9">EBS gp3</text>
  <text x="298" y="530" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="8">baseline</text>

  <!-- 3. SATA SSD: 52,000 IOPS -->
  <!-- 52K / 800K * 430 = 28px -->
  <rect x="368" y="472" width="90" height="28" rx="2" fill="#f9e2af"/>
  <text x="413" y="467" text-anchor="middle" fill="#f9e2af" font-family="monospace" font-size="10" font-weight="bold">52K</text>
  <text x="413" y="518" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="9">SATA SSD</text>
  <text x="413" y="530" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="8">860 EVO</text>

  <!-- 4. EBS io2: 64,000 IOPS -->
  <!-- 64K / 800K * 430 = 34.4px -->
  <rect x="483" y="466" width="90" height="34" rx="2" fill="#89b4fa"/>
  <text x="528" y="461" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="10" font-weight="bold">64K</text>
  <text x="528" y="518" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="9">EBS io2</text>
  <text x="528" y="530" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="8">provisioned</text>

  <!-- 5. NVMe Consumer: 340,000 IOPS -->
  <!-- 340K / 800K * 430 = 182.75px -->
  <rect x="598" y="317" width="90" height="183" rx="2" fill="#a6e3a1"/>
  <text x="643" y="312" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="10" font-weight="bold">340K</text>
  <text x="643" y="518" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="9">NVMe</text>
  <text x="643" y="530" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="8">970 EVO Plus</text>

  <!-- 6. NVMe Enterprise: 800,000 IOPS -->
  <!-- 800K / 800K * 430 = 430px -->
  <rect x="713" y="70" width="90" height="430" rx="2" fill="#94e2d5"/>
  <text x="758" y="92" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="10" font-weight="bold">800K</text>
  <text x="758" y="518" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="9">NVMe</text>
  <text x="758" y="530" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="8">Intel P5800X</text>

  <!-- Annotation: multiplier callouts -->
  <!-- HDD to gp3 -->
  <line x1="183" y1="487" x2="298" y2="487" stroke="#6c7086" stroke-width="1" stroke-dasharray="3"/>
  <text x="240" y="482" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="8">30x</text>

  <!-- gp3 to NVMe consumer -->
  <line x1="298" y1="480" x2="643" y2="310" stroke="#f9e2af" stroke-width="1" stroke-dasharray="3"/>
  <text x="480" y="385" text-anchor="middle" fill="#f9e2af" font-family="monospace" font-size="9" font-weight="bold">113x</text>

  <!-- Separator line -->
  <line x1="40" y1="548" x2="860" y2="548" stroke="#313244" stroke-width="1"/>

  <!-- fsync latency comparison (bottom section) -->
  <text x="450" y="568" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="12" font-weight="bold">fsync Latency (lower is better)</text>

  <!-- fsync bars (horizontal, showing latency) -->
  <!-- Scale: max 2100us = full width (700px from x=140 to x=840) -->

  <!-- HDD: not applicable -->
  <text x="183" y="590" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="9">N/A</text>

  <!-- gp3: 2100us -->
  <rect x="260" y="582" width="240" height="12" rx="2" fill="#fab387" opacity="0.7"/>
  <text x="510" y="592" text-anchor="start" fill="#fab387" font-family="monospace" font-size="9">2,100 us</text>

  <!-- SATA SSD: 210us -->
  <rect x="375" y="582" width="24" height="12" rx="2" fill="#f9e2af" opacity="0.7"/>
  <text x="405" y="592" text-anchor="start" fill="#f9e2af" font-family="monospace" font-size="9">210 us</text>

  <!-- io2: 520us -->
  <rect x="490" y="582" width="60" height="12" rx="2" fill="#89b4fa" opacity="0.7"/>
  <text x="556" y="592" text-anchor="start" fill="#89b4fa" font-family="monospace" font-size="9">520 us</text>

  <!-- NVMe consumer: 42us -->
  <rect x="605" y="582" width="5" height="12" rx="1" fill="#a6e3a1" opacity="0.7"/>
  <text x="616" y="592" text-anchor="start" fill="#a6e3a1" font-family="monospace" font-size="9">42 us</text>

  <!-- NVMe enterprise: 22us -->
  <rect x="720" y="582" width="3" height="12" rx="1" fill="#94e2d5" opacity="0.7"/>
  <text x="729" y="592" text-anchor="start" fill="#94e2d5" font-family="monospace" font-size="9">22 us</text>

  <!-- Bottom note -->
  <text x="450" y="612" text-anchor="middle" fill="#585b70" font-family="monospace" font-size="9">EBS gp3 fsync is 51x slower than local NVMe due to network round trip + cross-AZ replication</text>
</svg>
