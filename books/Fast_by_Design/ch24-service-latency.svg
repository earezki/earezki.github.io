<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <rect width="900" height="600" rx="8" fill="#1e1e2e"/>

  <!-- Title -->
  <text x="450" y="28" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="14" font-weight="bold">Service-to-Service Latency: Connection Establishment Waterfall</text>
  <text x="450" y="48" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="10">Article Service → Search Service (same datacenter, 0.5ms RTT)</text>

  <!-- Time axis -->
  <line x1="150" y1="80" x2="150" y2="560" stroke="#45475a" stroke-width="1"/>
  <text x="145" y="75" text-anchor="end" fill="#6c7086" font-family="monospace" font-size="9">Time (ms)</text>

  <!-- Time markers -->
  <line x1="145" y1="90" x2="150" y2="90" stroke="#6c7086" stroke-width="1"/>
  <text x="140" y="94" text-anchor="end" fill="#6c7086" font-family="monospace" font-size="8">0</text>
  <line x1="145" y1="170" x2="150" y2="170" stroke="#6c7086" stroke-width="1"/>
  <text x="140" y="174" text-anchor="end" fill="#6c7086" font-family="monospace" font-size="8">2</text>
  <line x1="145" y1="250" x2="150" y2="250" stroke="#6c7086" stroke-width="1"/>
  <text x="140" y="254" text-anchor="end" fill="#6c7086" font-family="monospace" font-size="8">4</text>
  <line x1="145" y1="330" x2="150" y2="330" stroke="#6c7086" stroke-width="1"/>
  <text x="140" y="334" text-anchor="end" fill="#6c7086" font-family="monospace" font-size="8">6</text>
  <line x1="145" y1="410" x2="150" y2="410" stroke="#6c7086" stroke-width="1"/>
  <text x="140" y="414" text-anchor="end" fill="#6c7086" font-family="monospace" font-size="8">8</text>
  <line x1="145" y1="490" x2="150" y2="490" stroke="#6c7086" stroke-width="1"/>
  <text x="140" y="494" text-anchor="end" fill="#6c7086" font-family="monospace" font-size="8">10</text>

  <!-- Grid lines -->
  <line x1="150" y1="170" x2="850" y2="170" stroke="#313244" stroke-width="0.5" stroke-dasharray="3"/>
  <line x1="150" y1="250" x2="850" y2="250" stroke="#313244" stroke-width="0.5" stroke-dasharray="3"/>
  <line x1="150" y1="330" x2="850" y2="330" stroke="#313244" stroke-width="0.5" stroke-dasharray="3"/>
  <line x1="150" y1="410" x2="850" y2="410" stroke="#313244" stroke-width="0.5" stroke-dasharray="3"/>
  <line x1="150" y1="490" x2="850" y2="490" stroke="#313244" stroke-width="0.5" stroke-dasharray="3"/>

  <!-- Column headers -->
  <text x="320" y="75" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="11" font-weight="bold">COLD CONNECTION</text>
  <text x="620" y="75" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="11" font-weight="bold">WARM CONNECTION</text>

  <!-- Cold connection waterfall (left side) -->
  <!-- DNS Resolution: 0-4ms -->
  <rect x="200" y="90" width="240" height="70" rx="3" fill="#f38ba8" opacity="0.3" stroke="#f38ba8" stroke-width="1"/>
  <text x="320" y="120" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="10">DNS Resolution</text>
  <text x="320" y="138" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="9">4.2ms (system resolver)</text>

  <!-- TCP Handshake: 4-5ms -->
  <rect x="200" y="163" width="240" height="40" rx="3" fill="#fab387" opacity="0.3" stroke="#fab387" stroke-width="1"/>
  <text x="320" y="183" text-anchor="middle" fill="#fab387" font-family="monospace" font-size="10">TCP Handshake (SYN/SYN-ACK/ACK)</text>
  <text x="320" y="197" text-anchor="middle" fill="#fab387" font-family="monospace" font-size="9">1.0ms (1 RTT)</text>

  <!-- TLS Handshake: 5-6ms -->
  <rect x="200" y="206" width="240" height="40" rx="3" fill="#f9e2af" opacity="0.3" stroke="#f9e2af" stroke-width="1"/>
  <text x="320" y="226" text-anchor="middle" fill="#f9e2af" font-family="monospace" font-size="10">TLS 1.3 Handshake</text>
  <text x="320" y="240" text-anchor="middle" fill="#f9e2af" font-family="monospace" font-size="9">1.0ms (1 RTT)</text>

  <!-- HTTP Request: 6-6.5ms -->
  <rect x="200" y="249" width="240" height="25" rx="3" fill="#89b4fa" opacity="0.3" stroke="#89b4fa" stroke-width="1"/>
  <text x="320" y="266" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="9">HTTP Request Send (0.5ms)</text>

  <!-- Application Processing: 6.5-18.5ms -->
  <rect x="200" y="277" width="240" height="195" rx="3" fill="#a6e3a1" opacity="0.15" stroke="#a6e3a1" stroke-width="1"/>
  <text x="320" y="370" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="10">Application Processing</text>
  <text x="320" y="388" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="9">12ms (search query)</text>

  <!-- Cold total annotation -->
  <line x1="450" y1="90" x2="450" y2="472" stroke="#cdd6f4" stroke-width="1" stroke-dasharray="2"/>
  <text x="455" y="490" text-anchor="start" fill="#cdd6f4" font-family="monospace" font-size="10" font-weight="bold">Total: 18.7ms</text>

  <!-- Warm connection waterfall (right side) -->
  <!-- No DNS, no TCP, no TLS - just request -->
  <!-- HTTP Request: 0-0.5ms -->
  <rect x="500" y="90" width="240" height="25" rx="3" fill="#89b4fa" opacity="0.3" stroke="#89b4fa" stroke-width="1"/>
  <text x="620" y="107" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="9">HTTP Request Send (0.5ms)</text>

  <!-- Application Processing: 0.5-12.5ms -->
  <rect x="500" y="118" width="240" height="195" rx="3" fill="#a6e3a1" opacity="0.15" stroke="#a6e3a1" stroke-width="1"/>
  <text x="620" y="210" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="10">Application Processing</text>
  <text x="620" y="228" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="9">12ms (search query)</text>

  <!-- Warm total annotation -->
  <line x1="750" y1="90" x2="750" y2="313" stroke="#cdd6f4" stroke-width="1" stroke-dasharray="2"/>
  <text x="755" y="330" text-anchor="start" fill="#cdd6f4" font-family="monospace" font-size="10" font-weight="bold">Total: 12.5ms</text>

  <!-- Overhead annotation -->
  <rect x="165" y="525" width="680" height="55" rx="4" fill="#313244" stroke="#45475a" stroke-width="1"/>
  <text x="505" y="545" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="10">Connection overhead (cold): DNS 4.2ms + TCP 1.0ms + TLS 1.0ms + send 0.5ms = 6.7ms</text>
  <text x="505" y="563" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="10">Connection overhead (warm): send 0.5ms only = 0.5ms (93% reduction)</text>
  <text x="505" y="575" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="9">Speedup: 18.7ms → 12.5ms = 1.5x faster (overhead dominated by app time in datacenter)</text>

  <!-- Arrows showing overhead portion -->
  <rect x="448" y="88" width="4" height="187" rx="1" fill="#f38ba8" opacity="0.6"/>
  <text x="460" y="140" text-anchor="start" fill="#f38ba8" font-family="monospace" font-size="8" transform="rotate(90, 460, 140)">OVERHEAD</text>
</svg>
