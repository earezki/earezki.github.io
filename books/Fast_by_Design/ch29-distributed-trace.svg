  <text x="30" y="510" fill="#cdd6f4" font-family="monospace" font-size="10">response.serialize</text>
  <rect x="834" y="500" width="9" height="18" rx="2" fill="#585b70" opacity="0.85"/>
  <text x="848" y="513" fill="#6c7086" font-family="monospace" font-size="9">2ms</text>

