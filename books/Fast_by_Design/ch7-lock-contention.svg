<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620">
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#89b4fa"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f38ba8"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a6e3a1"/>
    </marker>
  </defs>
  <rect width="900" height="620" rx="8" fill="#1e1e2e"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="16" font-weight="bold">Lock Contention and the Throughput Cliff</text>

  <!-- Left panel: Lock Escalation -->
  <rect x="20" y="55" width="420" height="270" rx="6" fill="#181825" stroke="#45475a" stroke-width="1"/>
  <text x="230" y="80" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="13" font-weight="bold">Lock Escalation Path</text>

  <!-- Biased Lock -->
  <rect x="150" y="95" width="160" height="36" rx="4" fill="#1e1e2e" stroke="#a6e3a1" stroke-width="2"/>
  <text x="230" y="118" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="11">Biased Lock</text>
  <text x="330" y="118" fill="#6c7086" font-family="monospace" font-size="9">0 ns</text>

  <!-- Thin Lock (CAS) -->
  <line x1="230" y1="131" x2="230" y2="148" stroke="#89b4fa" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <text x="260" y="143" fill="#6c7086" font-family="monospace" font-size="9">contention</text>
  <rect x="150" y="150" width="160" height="36" rx="4" fill="#1e1e2e" stroke="#89b4fa" stroke-width="2"/>
  <text x="230" y="173" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="11">Thin Lock (CAS)</text>
  <text x="330" y="173" fill="#6c7086" font-family="monospace" font-size="9">~20 ns</text>

  <!-- Fat Lock (OS Mutex) -->
  <line x1="230" y1="186" x2="230" y2="203" stroke="#f9e2af" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <text x="260" y="198" fill="#6c7086" font-family="monospace" font-size="9">spin fails</text>
  <rect x="150" y="205" width="160" height="36" rx="4" fill="#1e1e2e" stroke="#f9e2af" stroke-width="2"/>
  <text x="230" y="228" text-anchor="middle" fill="#f9e2af" font-family="monospace" font-size="11">Fat Lock (Mutex)</text>
  <text x="330" y="228" fill="#6c7086" font-family="monospace" font-size="9">~10 μs</text>

  <!-- Blocked / Parked -->
  <line x1="230" y1="241" x2="230" y2="258" stroke="#f38ba8" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <text x="260" y="253" fill="#6c7086" font-family="monospace" font-size="9">all waiting</text>
  <rect x="150" y="260" width="160" height="36" rx="4" fill="#1e1e2e" stroke="#f38ba8" stroke-width="2"/>
  <text x="230" y="283" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="11">Thread Park</text>
  <text x="330" y="283" fill="#6c7086" font-family="monospace" font-size="9">~50 μs+</text>

  <!-- Thread icons on left -->
  <text x="55" y="118" fill="#a6e3a1" font-family="monospace" font-size="10">T1 ─────▶</text>
  <text x="55" y="173" fill="#89b4fa" font-family="monospace" font-size="10">T1,T2 ──▶</text>
  <text x="55" y="228" fill="#f9e2af" font-family="monospace" font-size="10">T1..T4 ─▶</text>
  <text x="55" y="283" fill="#f38ba8" font-family="monospace" font-size="10">T1..Tn ─▶</text>

  <!-- Right panel: Throughput Cliff Chart -->
  <rect x="460" y="55" width="420" height="270" rx="6" fill="#181825" stroke="#45475a" stroke-width="1"/>
  <text x="670" y="80" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="13" font-weight="bold">Throughput vs Thread Count</text>

  <!-- Y axis -->
  <line x1="520" y1="95" x2="520" y2="300" stroke="#45475a" stroke-width="1"/>
  <text x="515" y="100" text-anchor="end" fill="#6c7086" font-family="monospace" font-size="9">ops/s</text>
  <text x="515" y="300" text-anchor="end" fill="#6c7086" font-family="monospace" font-size="9">0</text>

  <!-- X axis -->
  <line x1="520" y1="300" x2="850" y2="300" stroke="#45475a" stroke-width="1"/>
  <text x="850" y="315" text-anchor="end" fill="#6c7086" font-family="monospace" font-size="9">threads</text>

  <!-- X labels -->
  <text x="540" y="315" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="9">1</text>
  <text x="580" y="315" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="9">2</text>
  <text x="620" y="315" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="9">4</text>
  <text x="660" y="315" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="9">8</text>
  <text x="700" y="315" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="9">16</text>
  <text x="740" y="315" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="9">32</text>
  <text x="780" y="315" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="9">64</text>
  <text x="820" y="315" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="9">128</text>

  <!-- synchronized line (red, drops) -->
  <polyline points="540,220 580,180 620,160 660,170 700,200 740,240 780,265 820,280" fill="none" stroke="#f38ba8" stroke-width="2.5"/>
  <circle cx="660" cy="170" r="3" fill="#f38ba8"/>

  <!-- StampedLock line (green, scales) -->
  <polyline points="540,220 580,175 620,140 660,120 700,110 740,108 780,112 820,118" fill="none" stroke="#a6e3a1" stroke-width="2.5"/>
  <circle cx="740" cy="108" r="3" fill="#a6e3a1"/>

  <!-- LongAdder line (blue, scales well) -->
  <polyline points="540,225 580,180 620,145 660,118 700,105 740,100 780,98 820,100" fill="none" stroke="#89b4fa" stroke-width="2.5"/>
  <circle cx="780" cy="98" r="3" fill="#89b4fa"/>

  <!-- Legend -->
  <line x1="620" y1="100" x2="640" y2="100" stroke="#f38ba8" stroke-width="2"/>
  <text x="645" y="104" fill="#f38ba8" font-family="monospace" font-size="9">synchronized</text>
  <line x1="730" y1="100" x2="750" y2="100" stroke="#a6e3a1" stroke-width="2"/>
  <text x="755" y="104" fill="#a6e3a1" font-family="monospace" font-size="9">StampedLock</text>
  <line x1="620" y1="115" x2="640" y2="115" stroke="#89b4fa" stroke-width="2"/>
  <text x="645" y="119" fill="#89b4fa" font-family="monospace" font-size="9">LongAdder</text>

  <!-- Contention cliff annotation -->
  <line x1="660" y1="170" x2="660" y2="290" stroke="#f38ba8" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="665" y="250" fill="#f38ba8" font-family="monospace" font-size="9" transform="rotate(-90, 665, 250)">contention cliff</text>

  <!-- Bottom panel: Thread pool sizing -->
  <rect x="20" y="340" width="860" height="260" rx="6" fill="#181825" stroke="#45475a" stroke-width="1"/>
  <text x="450" y="365" text-anchor="middle" fill="#89b4fa" font-family="monospace" font-size="13" font-weight="bold">Thread Pool: Undersized vs Optimal vs Oversized</text>

  <!-- Three boxes -->
  <!-- Undersized -->
  <rect x="45" y="385" width="250" height="190" rx="4" fill="#1e1e2e" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="170" y="405" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="11" font-weight="bold">UNDERSIZED (2 threads)</text>

  <!-- CPU bars -->
  <rect x="65" y="420" width="80" height="12" rx="2" fill="#313244"/>
  <rect x="65" y="420" width="80" height="12" rx="2" fill="#a6e3a1" opacity="0.8"/>
  <text x="150" y="430" fill="#cdd6f4" font-family="monospace" font-size="9">CPU 100%</text>

  <rect x="65" y="436" width="80" height="12" rx="2" fill="#313244"/>
  <rect x="65" y="436" width="80" height="12" rx="2" fill="#a6e3a1" opacity="0.8"/>
  <text x="150" y="446" fill="#cdd6f4" font-family="monospace" font-size="9">CPU 100%</text>

  <!-- Queue -->
  <rect x="65" y="460" width="210" height="30" rx="3" fill="#313244" stroke="#f38ba8" stroke-width="1"/>
  <text x="170" y="480" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="10">Queue: ████████ (overflow)</text>

  <text x="170" y="510" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="9">Latency: HIGH</text>
  <text x="170" y="525" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="9">Throughput: LOW</text>
  <text x="170" y="540" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="9">Tasks starved</text>

  <!-- Optimal -->
  <rect x="325" y="385" width="250" height="190" rx="4" fill="#1e1e2e" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="450" y="405" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="11" font-weight="bold">OPTIMAL (N threads)</text>

  <rect x="345" y="420" width="80" height="12" rx="2" fill="#313244"/>
  <rect x="345" y="420" width="60" height="12" rx="2" fill="#a6e3a1" opacity="0.8"/>
  <text x="430" y="430" fill="#cdd6f4" font-family="monospace" font-size="9">CPU 75%</text>

  <rect x="345" y="436" width="80" height="12" rx="2" fill="#313244"/>
  <rect x="345" y="436" width="56" height="12" rx="2" fill="#a6e3a1" opacity="0.8"/>
  <text x="430" y="446" fill="#cdd6f4" font-family="monospace" font-size="9">CPU 70%</text>

  <rect x="345" y="452" width="80" height="12" rx="2" fill="#313244"/>
  <rect x="345" y="452" width="64" height="12" rx="2" fill="#a6e3a1" opacity="0.8"/>
  <text x="430" y="462" fill="#cdd6f4" font-family="monospace" font-size="9">CPU 80%</text>

  <rect x="345" y="478" width="210" height="20" rx="3" fill="#313244" stroke="#a6e3a1" stroke-width="1"/>
  <text x="450" y="492" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="10">Queue: ██ (healthy)</text>

  <text x="450" y="515" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="9">Latency: LOW</text>
  <text x="450" y="530" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="9">Throughput: MAX</text>
  <text x="450" y="545" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="9">Balanced utilization</text>

  <!-- Oversized -->
  <rect x="605" y="385" width="250" height="190" rx="4" fill="#1e1e2e" stroke="#f9e2af" stroke-width="1.5"/>
  <text x="730" y="405" text-anchor="middle" fill="#f9e2af" font-family="monospace" font-size="11" font-weight="bold">OVERSIZED (200 threads)</text>

  <rect x="625" y="420" width="80" height="8" rx="2" fill="#313244"/>
  <rect x="625" y="420" width="16" height="8" rx="2" fill="#a6e3a1" opacity="0.5"/>
  <text x="710" y="427" fill="#cdd6f4" font-family="monospace" font-size="8">T1: 20%</text>

  <rect x="625" y="430" width="80" height="8" rx="2" fill="#313244"/>
  <rect x="625" y="430" width="12" height="8" rx="2" fill="#a6e3a1" opacity="0.5"/>
  <text x="710" y="437" fill="#cdd6f4" font-family="monospace" font-size="8">T2: 15%</text>

  <rect x="625" y="440" width="80" height="8" rx="2" fill="#313244"/>
  <rect x="625" y="440" width="8" height="8" rx="2" fill="#a6e3a1" opacity="0.3"/>
  <text x="710" y="447" fill="#cdd6f4" font-family="monospace" font-size="8">T3: 10%</text>

  <text x="660" y="462" fill="#6c7086" font-family="monospace" font-size="8">... 197 more threads</text>

  <rect x="625" y="478" width="210" height="20" rx="3" fill="#313244" stroke="#f9e2af" stroke-width="1"/>
  <text x="730" y="492" text-anchor="middle" fill="#f9e2af" font-family="monospace" font-size="10">Context switches: 48K/s</text>

  <text x="730" y="515" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="9">Latency: VARIABLE</text>
  <text x="730" y="530" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="9">Throughput: DEGRADED</text>
  <text x="730" y="545" text-anchor="middle" fill="#f9e2af" font-family="monospace" font-size="9">Cache thrashing + switching</text>
</svg>