<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650">
  <defs>
    <marker id="arrBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#89b4fa"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a6e3a1"/>
    </marker>
    <marker id="arrRed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f38ba8"/>
    </marker>
    <marker id="arrYellow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f9e2af"/>
    </marker>
  </defs>
  <rect width="900" height="650" rx="8" fill="#1e1e2e"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="16" font-weight="bold">Virtual Thread Scheduling: Mount, Unmount, and Pinning</text>

  <!-- Top panel: Normal virtual thread scheduling -->
  <rect x="20" y="50" width="860" height="250" rx="6" fill="#181825" stroke="#45475a" stroke-width="1"/>
  <text x="450" y="75" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="13" font-weight="bold">Normal Operation: Mount / Unmount on Carrier Threads</text>

  <!-- Carrier thread pool -->
  <text x="45" y="100" fill="#6c7086" font-family="monospace" font-size="10">Carrier Thread Pool (ForkJoinPool, size = Ncpu)</text>

  <!-- Carrier 1 timeline -->
  <rect x="45" y="110" width="820" height="24" rx="3" fill="#313244"/>
  <text x="50" y="126" fill="#6c7086" font-family="monospace" font-size="9">CT-1</text>
  <rect x="95" y="112" width="100" height="20" rx="3" fill="#89b4fa" opacity="0.8"/>
  <text x="130" y="126" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="8" font-weight="bold">VT-1</text>
  <rect x="200" y="112" width="60" height="20" rx="3" fill="#a6e3a1" opacity="0.8"/>
  <text x="230" y="126" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="8" font-weight="bold">VT-3</text>
  <rect x="270" y="112" width="120" height="20" rx="3" fill="#89b4fa" opacity="0.8"/>
  <text x="330" y="126" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="8" font-weight="bold">VT-1</text>
  <rect x="400" y="112" width="80" height="20" rx="3" fill="#cba6f7" opacity="0.8"/>
  <text x="440" y="126" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="8" font-weight="bold">VT-5</text>
  <rect x="490" y="112" width="110" height="20" rx="3" fill="#a6e3a1" opacity="0.8"/>
  <text x="545" y="126" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="8" font-weight="bold">VT-3</text>
  <rect x="610" y="112" width="70" height="20" rx="3" fill="#f9e2af" opacity="0.7"/>
  <text x="645" y="126" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="8" font-weight="bold">VT-7</text>

  <!-- Carrier 2 timeline -->
  <rect x="45" y="140" width="820" height="24" rx="3" fill="#313244"/>
  <text x="50" y="156" fill="#6c7086" font-family="monospace" font-size="9">CT-2</text>
  <rect x="95" y="142" width="80" height="20" rx="3" fill="#f9e2af" opacity="0.7"/>
  <text x="135" y="156" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="8" font-weight="bold">VT-2</text>
  <rect x="180" y="142" width="130" height="20" rx="3" fill="#cba6f7" opacity="0.8"/>
  <text x="245" y="156" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="8" font-weight="bold">VT-4</text>
  <rect x="320" y="142" width="70" height="20" rx="3" fill="#f9e2af" opacity="0.7"/>
  <text x="355" y="156" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="8" font-weight="bold">VT-2</text>
  <rect x="400" y="142" width="90" height="20" rx="3" fill="#89b4fa" opacity="0.8"/>
  <text x="445" y="156" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="8" font-weight="bold">VT-6</text>
  <rect x="500" y="142" width="100" height="20" rx="3" fill="#cba6f7" opacity="0.8"/>
  <text x="550" y="156" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="8" font-weight="bold">VT-4</text>

  <!-- I/O wait annotations -->
  <text x="198" y="108" fill="#6c7086" font-family="monospace" font-size="8">↓unmount (I/O)</text>
  <text x="265" y="108" fill="#6c7086" font-family="monospace" font-size="8">↓remount</text>

  <!-- Virtual thread queue -->
  <rect x="45" y="180" width="820" height="35" rx="3" fill="#1e1e2e" stroke="#45475a" stroke-width="1"/>
  <text x="55" y="202" fill="#6c7086" font-family="monospace" font-size="9">VT Queue:</text>
  <rect x="130" y="187" width="40" height="20" rx="2" fill="#89b4fa" opacity="0.4"/>
  <text x="150" y="201" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="8">VT-8</text>
  <rect x="175" y="187" width="40" height="20" rx="2" fill="#a6e3a1" opacity="0.4"/>
  <text x="195" y="201" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="8">VT-9</text>
  <rect x="220" y="187" width="40" height="20" rx="2" fill="#cba6f7" opacity="0.4"/>
  <text x="240" y="201" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="8">VT-10</text>
  <rect x="265" y="187" width="40" height="20" rx="2" fill="#f9e2af" opacity="0.4"/>
  <text x="285" y="201" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="8">VT-11</text>
  <text x="320" y="201" fill="#6c7086" font-family="monospace" font-size="9">... (1000s waiting, ~1 KB each)</text>

  <!-- Key insight -->
  <text x="450" y="240" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="11">VT unmounts on blocking I/O → carrier freed → another VT mounts → no wasted OS threads</text>
  <text x="450" y="258" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="10">2 carrier threads can service 10,000+ virtual threads doing I/O</text>

  <!-- Bottom panel: Pinning scenario -->
  <rect x="20" y="315" width="860" height="320" rx="6" fill="#181825" stroke="#45475a" stroke-width="1"/>
  <text x="450" y="340" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="13" font-weight="bold">Pinning: synchronized Blocks Carrier Thread</text>

  <!-- Pinned carrier timeline -->
  <rect x="45" y="355" width="820" height="28" rx="3" fill="#313244"/>
  <text x="50" y="373" fill="#6c7086" font-family="monospace" font-size="9">CT-1</text>
  <rect x="95" y="357" width="350" height="24" rx="3" fill="#f38ba8" opacity="0.7" stroke="#f38ba8" stroke-width="2"/>
  <text x="270" y="373" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="9" font-weight="bold">VT-1 PINNED (synchronized + I/O wait)</text>

  <!-- Normal carrier -->
  <rect x="45" y="388" width="820" height="28" rx="3" fill="#313244"/>
  <text x="50" y="406" fill="#6c7086" font-family="monospace" font-size="9">CT-2</text>
  <rect x="95" y="390" width="60" height="24" rx="3" fill="#89b4fa" opacity="0.8"/>
  <text x="125" y="406" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="8" font-weight="bold">VT-2</text>
  <rect x="160" y="390" width="50" height="24" rx="3" fill="#a6e3a1" opacity="0.8"/>
  <text x="185" y="406" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="8" font-weight="bold">VT-3</text>
  <rect x="215" y="390" width="70" height="24" rx="3" fill="#cba6f7" opacity="0.8"/>
  <text x="250" y="406" text-anchor="middle" fill="#1e1e2e" font-family="monospace" font-size="8" font-weight="bold">VT-4</text>

  <!-- Blocked VTs -->
  <rect x="45" y="430" width="820" height="45" rx="3" fill="#1e1e2e" stroke="#f38ba8" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="55" y="448" fill="#f38ba8" font-family="monospace" font-size="9">BLOCKED (waiting for CT-1):</text>
  <rect x="240" y="437" width="40" height="20" rx="2" fill="#f38ba8" opacity="0.3"/>
  <text x="260" y="451" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="8">VT-5</text>
  <rect x="285" y="437" width="40" height="20" rx="2" fill="#f38ba8" opacity="0.3"/>
  <text x="305" y="451" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="8">VT-6</text>
  <rect x="330" y="437" width="40" height="20" rx="2" fill="#f38ba8" opacity="0.3"/>
  <text x="350" y="451" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="8">VT-7</text>
  <rect x="375" y="437" width="40" height="20" rx="2" fill="#f38ba8" opacity="0.3"/>
  <text x="395" y="451" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="8">VT-8</text>
  <text x="430" y="451" fill="#f38ba8" font-family="monospace" font-size="8">... (all starved)</text>

  <!-- Code comparison -->
  <rect x="45" y="490" width="395" height="115" rx="4" fill="#1e1e2e" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="242" y="510" text-anchor="middle" fill="#f38ba8" font-family="monospace" font-size="11" font-weight="bold">PINNING (synchronized)</text>
  <text x="60" y="530" fill="#f38ba8" font-family="monospace" font-size="10">synchronized (lock) {</text>
  <text x="70" y="548" fill="#f38ba8" font-family="monospace" font-size="10">  connection.query(sql);</text>
  <text x="70" y="566" fill="#f38ba8" font-family="monospace" font-size="10">  // VT pinned to carrier!</text>
  <text x="60" y="584" fill="#f38ba8" font-family="monospace" font-size="10">}</text>

  <rect x="460" y="490" width="395" height="115" rx="4" fill="#1e1e2e" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="657" y="510" text-anchor="middle" fill="#a6e3a1" font-family="monospace" font-size="11" font-weight="bold">NO PINNING (ReentrantLock)</text>
  <text x="475" y="530" fill="#a6e3a1" font-family="monospace" font-size="10">lock.lock();</text>
  <text x="475" y="548" fill="#a6e3a1" font-family="monospace" font-size="10">try {</text>
  <text x="485" y="566" fill="#a6e3a1" font-family="monospace" font-size="10">  connection.query(sql);</text>
  <text x="475" y="584" fill="#a6e3a1" font-family="monospace" font-size="10">} finally { lock.unlock(); }</text>

  <!-- Arrow between -->
  <line x1="442" y1="547" x2="455" y2="547" stroke="#f9e2af" stroke-width="2" marker-end="url(#arrYellow)"/>

  <!-- Bottom annotation -->
  <text x="450" y="625" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="11">synchronized holds the monitor at the OS level → carrier cannot unmount the virtual thread</text>
  <text x="450" y="642" text-anchor="middle" fill="#6c7086" font-family="monospace" font-size="10">ReentrantLock uses j.u.c.locks → virtual thread unmounts normally on blocking I/O inside the lock</text>
</svg>