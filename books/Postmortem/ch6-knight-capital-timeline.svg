<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="monospace">
  <rect width="900" height="480" fill="#1e1e2e"/>
  <text x="450" y="30" text-anchor="middle" fill="#cdd6f4" font-size="15" font-weight="bold">Knight Capital: 45-Minute Timeline of Destruction</text>
  
  <!-- Timeline axis -->
  <line x1="80" y1="80" x2="840" y2="80" stroke="#585b70" stroke-width="1.5"/>
  
  <!-- Time labels -->
  <text x="100" y="70" fill="#a6adc8" font-size="9">July 31</text>
  <text x="200" y="70" fill="#a6adc8" font-size="9">Aug 1, 9:00</text>
  <text x="380" y="70" fill="#f38ba8" font-size="9" font-weight="bold">9:30 OPEN</text>
  <text x="620" y="70" fill="#f38ba8" font-size="9" font-weight="bold">10:15</text>
  <text x="780" y="70" fill="#a6e3a1" font-size="9">10:15+</text>
  
  <!-- Event 1: Deployment -->
  <circle cx="120" cy="80" r="5" fill="#89b4fa"/>
  <rect x="60" y="100" width="180" height="70" rx="5" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="150" y="118" text-anchor="middle" fill="#89b4fa" font-size="10" font-weight="bold">SMARS Deployment</text>
  <text x="150" y="133" text-anchor="middle" fill="#cdd6f4" font-size="8">New RLP code pushed to</text>
  <text x="150" y="145" text-anchor="middle" fill="#cdd6f4" font-size="8">7 of 8 servers</text>
  <text x="150" y="158" text-anchor="middle" fill="#f38ba8" font-size="8">Server 8: OLD CODE REMAINS</text>
  
  <!-- Event 2: Pre-market -->
  <circle cx="260" cy="80" r="5" fill="#89b4fa"/>
  <rect x="200" y="190" width="160" height="55" rx="5" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="280" y="208" text-anchor="middle" fill="#89b4fa" font-size="10" font-weight="bold">Flag Reactivation</text>
  <text x="280" y="222" text-anchor="middle" fill="#cdd6f4" font-size="8">Feature flag repurposed</text>
  <text x="280" y="234" text-anchor="middle" fill="#f38ba8" font-size="8">Activates dead Power Peg code</text>
  <line x1="260" y1="85" x2="260" y2="190" stroke="#89b4fa" stroke-width="1" stroke-dasharray="3"/>
  
  <!-- Event 3: Market Open -->
  <circle cx="400" cy="80" r="7" fill="#f38ba8"/>
  <rect x="340" y="100" width="200" height="70" rx="5" fill="#313244" stroke="#f38ba8" stroke-width="2"/>
  <text x="440" y="118" text-anchor="middle" fill="#f38ba8" font-size="10" font-weight="bold">MARKET OPENS</text>
  <text x="440" y="133" text-anchor="middle" fill="#cdd6f4" font-size="8">Server 8 executes Power Peg:</text>
  <text x="440" y="145" text-anchor="middle" fill="#f38ba8" font-size="8">Buys at ask, sells at bid</text>
  <text x="440" y="158" text-anchor="middle" fill="#f38ba8" font-size="8">EVERY order loses money</text>
  
  <!-- Loss accumulation graph area -->
  <rect x="390" y="210" width="280" height="120" rx="3" fill="#313244" stroke="#585b70" stroke-width="1"/>
  <text x="530" y="230" text-anchor="middle" fill="#cdd6f4" font-size="9" font-weight="bold">Cumulative Loss</text>
  
  <!-- Loss curve -->
  <polyline points="400,320 430,318 460,312 490,300 520,280 550,260 580,240 610,228 640,222 660,220" fill="none" stroke="#f38ba8" stroke-width="2.5"/>
  
  <!-- Loss labels -->
  <text x="398" y="335" fill="#a6adc8" font-size="7">$0</text>
  <text x="530" y="275" fill="#f38ba8" font-size="7">$200M</text>
  <text x="665" y="218" fill="#f38ba8" font-size="8" font-weight="bold">$440M</text>

  <!-- Time labels on graph -->
  <text x="400" y="345" fill="#a6adc8" font-size="7">9:30</text>
  <text x="530" y="345" fill="#a6adc8" font-size="7">9:50</text>
  <text x="660" y="345" fill="#a6adc8" font-size="7">10:15</text>
  
  <!-- Event 4: Manual shutdown -->
  <circle cx="660" cy="80" r="5" fill="#a6e3a1"/>
  <rect x="600" y="100" width="180" height="55" rx="5" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="690" y="118" text-anchor="middle" fill="#a6e3a1" font-size="10" font-weight="bold">MANUAL SHUTDOWN</text>
  <text x="690" y="133" text-anchor="middle" fill="#cdd6f4" font-size="8">Staff manually kill SMARS</text>
  <text x="690" y="145" text-anchor="middle" fill="#cdd6f4" font-size="8">No automated kill switch</text>
  
  <!-- Aftermath -->
  <rect x="700" y="370" width="160" height="55" rx="5" fill="#f38ba8" fill-opacity="0.2" stroke="#f38ba8" stroke-width="2"/>
  <text x="780" y="390" text-anchor="middle" fill="#f38ba8" font-size="10" font-weight="bold">$440M LOST</text>
  <text x="780" y="404" text-anchor="middle" fill="#cdd6f4" font-size="8">4M shares in 154 stocks</text>
  <text x="780" y="416" text-anchor="middle" fill="#cdd6f4" font-size="8">Company nearly bankrupt</text>

  <!-- Key factors -->
  <rect x="60" y="380" width="580" height="80" rx="5" fill="#313244"/>
  <text x="80" y="400" fill="#a6e3a1" font-size="10" font-weight="bold">Three Compounding Factors:</text>
  <text x="80" y="418" fill="#f38ba8" font-size="9">1. Dead code left in production</text>
  <text x="300" y="418" fill="#f38ba8" font-size="9">2. Feature flag reused for new purpose</text>
  <text x="80" y="436" fill="#f38ba8" font-size="9">3. No automated kill switch or loss limit</text>
  <text x="300" y="436" fill="#a6adc8" font-size="9">Incomplete deployment undetected</text>
</svg>
