<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="monospace">
  <rect width="900" height="500" fill="#1e1e2e"/>
  <text x="450" y="30" text-anchor="middle" fill="#cdd6f4" font-size="15" font-weight="bold">Flash Crash: Positive Feedback Loop</text>
  
  <!-- Central loop -->
  <!-- Waddell & Reed Sell Algorithm -->
  <rect x="300" y="80" width="300" height="55" rx="8" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <text x="450" y="100" text-anchor="middle" fill="#89b4fa" font-size="11" font-weight="bold">W&amp;R Sell Algorithm</text>
  <text x="450" y="116" text-anchor="middle" fill="#cdd6f4" font-size="9">75,000 E-Mini contracts, volume-based rate</text>
  <text x="450" y="128" text-anchor="middle" fill="#f38ba8" font-size="8">No price check, no spread check, no depth check</text>
  
  <!-- Arrow: Sell → Market Pressure -->
  <line x1="600" y1="108" x2="710" y2="180" stroke="#f38ba8" stroke-width="2" marker-end="url(#arrowLoop)"/>
  <text x="680" y="140" fill="#f38ba8" font-size="9" transform="rotate(30 680 140)">sells into</text>
  
  <!-- Market Selling Pressure -->
  <rect x="630" y="180" width="220" height="55" rx="8" fill="#313244" stroke="#f38ba8" stroke-width="2"/>
  <text x="740" y="200" text-anchor="middle" fill="#f38ba8" font-size="11" font-weight="bold">Selling Pressure</text>
  <text x="740" y="216" text-anchor="middle" fill="#cdd6f4" font-size="9">E-Mini price drops rapidly</text>
  <text x="740" y="228" text-anchor="middle" fill="#cdd6f4" font-size="9">Bid-ask spread widens</text>
  
  <!-- Arrow: Market Pressure → HFT Withdrawal -->
  <line x1="740" y1="235" x2="740" y2="300" stroke="#f38ba8" stroke-width="2" marker-end="url(#arrowLoop)"/>
  <text x="755" y="270" fill="#f38ba8" font-size="9">triggers</text>
  
  <!-- HFT Withdrawal -->
  <rect x="630" y="300" width="220" height="55" rx="8" fill="#313244" stroke="#f9e2af" stroke-width="2"/>
  <text x="740" y="320" text-anchor="middle" fill="#f9e2af" font-size="11" font-weight="bold">HFT Withdrawal</text>
  <text x="740" y="336" text-anchor="middle" fill="#cdd6f4" font-size="9">Market makers pull quotes</text>
  <text x="740" y="348" text-anchor="middle" fill="#cdd6f4" font-size="9">Liquidity evaporates</text>
  
  <!-- Arrow: HFT Withdrawal → Declining Liquidity -->
  <line x1="630" y1="328" x2="530" y2="328" stroke="#f38ba8" stroke-width="2" marker-end="url(#arrowLoopRev)"/>
  <text x="580" y="320" fill="#f38ba8" font-size="9">causes</text>
  
  <!-- Declining Liquidity -->
  <rect x="300" y="300" width="230" height="55" rx="8" fill="#313244" stroke="#f38ba8" stroke-width="2"/>
  <text x="415" y="320" text-anchor="middle" fill="#f38ba8" font-size="11" font-weight="bold">Declining Liquidity</text>
  <text x="415" y="336" text-anchor="middle" fill="#cdd6f4" font-size="9">Fewer buyers, wider spreads</text>
  <text x="415" y="348" text-anchor="middle" fill="#cdd6f4" font-size="9">Same volume = faster price drop</text>
  
  <!-- Arrow: Declining Liquidity → back to Sell Algorithm (the loop) -->
  <line x1="300" y1="328" x2="220" y2="250" stroke="#f38ba8" stroke-width="2"/>
  <line x1="220" y1="250" x2="220" y2="130" stroke="#f38ba8" stroke-width="2"/>
  <line x1="220" y1="130" x2="300" y2="108" stroke="#f38ba8" stroke-width="2" marker-end="url(#arrowLoop)"/>
  <text x="170" y="200" fill="#f38ba8" font-size="9" font-weight="bold">FEEDBACK</text>
  <text x="178" y="215" fill="#f38ba8" font-size="9">sells faster</text>
  
  <!-- Loop label -->
  <rect x="350" y="200" width="200" height="30" rx="15" fill="#f38ba8" fill-opacity="0.15" stroke="#f38ba8" stroke-width="1.5" stroke-dasharray="5"/>
  <text x="450" y="219" text-anchor="middle" fill="#f38ba8" font-size="10" font-weight="bold">POSITIVE FEEDBACK LOOP</text>
  
  <!-- External circuit breaker -->
  <rect x="80" y="380" width="200" height="50" rx="5" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
  <text x="180" y="400" text-anchor="middle" fill="#a6e3a1" font-size="10" font-weight="bold">CME Circuit Breaker</text>
  <text x="180" y="416" text-anchor="middle" fill="#a6e3a1" font-size="9">5-second trading pause</text>
  <line x1="180" y1="380" x2="180" y2="355" stroke="#a6e3a1" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="185" y="370" fill="#a6e3a1" font-size="8">external only</text>

  <!-- Result -->
  <rect x="60" y="445" width="780" height="40" rx="5" fill="#313244"/>
  <text x="80" y="465" fill="#a6adc8" font-size="10">In 36 minutes:</text>
  <text x="190" y="465" fill="#f38ba8" font-size="10" font-weight="bold">E-Mini drops 5%</text>
  <text x="350" y="465" fill="#a6adc8" font-size="10">|  DJIA:</text>
  <text x="410" y="465" fill="#f38ba8" font-size="10" font-weight="bold">−998.5 points</text>
  <text x="550" y="465" fill="#a6adc8" font-size="10">|  Stock trades at:</text>
  <text x="700" y="465" fill="#f38ba8" font-size="10" font-weight="bold">$0.01</text>

  <defs>
    <marker id="arrowLoop" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f38ba8"/></marker>
    <marker id="arrowLoopRev" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 10 0 L 0 5 L 10 10 z" fill="#f38ba8"/></marker>
  </defs>
</svg>
