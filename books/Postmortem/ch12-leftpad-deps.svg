<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="monospace">
  <rect width="900" height="500" fill="#1e1e2e"/>
  <text x="450" y="30" text-anchor="middle" fill="#cdd6f4" font-size="15" font-weight="bold">Left-Pad: Dependency Fan-Out from a Single Package</text>
  
  <!-- left-pad package -->
  <rect x="370" y="60" width="160" height="45" rx="8" fill="#313244" stroke="#f38ba8" stroke-width="2"/>
  <text x="450" y="82" text-anchor="middle" fill="#f38ba8" font-size="11" font-weight="bold">left-pad</text>
  <text x="450" y="98" text-anchor="middle" fill="#a6adc8" font-size="8">11 lines of code</text>
  
  <!-- Arrow down -->
  <line x1="450" y1="105" x2="450" y2="125" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="460" y="118" fill="#f38ba8" font-size="8">removed</text>
  
  <!-- Direct dependents -->
  <text x="60" y="148" fill="#a6adc8" font-size="9">DIRECT DEPENDENTS</text>
  <line x1="60" y1="155" x2="840" y2="155" stroke="#585b70" stroke-width="0.5"/>
  
  <rect x="120" y="165" width="130" height="35" rx="5" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="185" y="187" text-anchor="middle" fill="#89b4fa" font-size="9" font-weight="bold">line-numbers</text>
  
  <rect x="280" y="165" width="130" height="35" rx="5" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="345" y="187" text-anchor="middle" fill="#89b4fa" font-size="9" font-weight="bold">string-width</text>
  
  <rect x="440" y="165" width="130" height="35" rx="5" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="505" y="187" text-anchor="middle" fill="#89b4fa" font-size="9" font-weight="bold">sprintf-js</text>
  
  <rect x="600" y="165" width="130" height="35" rx="5" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="665" y="187" text-anchor="middle" fill="#89b4fa" font-size="9" font-weight="bold">+ hundreds</text>
  
  <!-- Lines from left-pad -->
  <line x1="400" y1="105" x2="185" y2="165" stroke="#585b70" stroke-width="1"/>
  <line x1="430" y1="105" x2="345" y2="165" stroke="#585b70" stroke-width="1"/>
  <line x1="470" y1="105" x2="505" y2="165" stroke="#585b70" stroke-width="1"/>
  <line x1="500" y1="105" x2="665" y2="165" stroke="#585b70" stroke-width="1"/>
  
  <!-- Transitive layer 1 -->
  <text x="60" y="228" fill="#a6adc8" font-size="9">TRANSITIVE DEPENDENTS (layer 1)</text>
  <line x1="60" y1="235" x2="840" y2="235" stroke="#585b70" stroke-width="0.5"/>
  
  <rect x="80" y="245" width="100" height="30" rx="4" fill="#313244" stroke="#a6e3a1" stroke-width="1"/>
  <text x="130" y="264" text-anchor="middle" fill="#a6e3a1" font-size="8">chalk</text>
  
  <rect x="200" y="245" width="100" height="30" rx="4" fill="#313244" stroke="#a6e3a1" stroke-width="1"/>
  <text x="250" y="264" text-anchor="middle" fill="#a6e3a1" font-size="8">yargs</text>
  
  <rect x="320" y="245" width="100" height="30" rx="4" fill="#313244" stroke="#a6e3a1" stroke-width="1"/>
  <text x="370" y="264" text-anchor="middle" fill="#a6e3a1" font-size="8">inquirer</text>
  
  <rect x="440" y="245" width="100" height="30" rx="4" fill="#313244" stroke="#a6e3a1" stroke-width="1"/>
  <text x="490" y="264" text-anchor="middle" fill="#a6e3a1" font-size="8">tape</text>
  
  <rect x="560" y="245" width="100" height="30" rx="4" fill="#313244" stroke="#a6e3a1" stroke-width="1"/>
  <text x="610" y="264" text-anchor="middle" fill="#a6e3a1" font-size="8">mocha</text>
  
  <rect x="680" y="245" width="100" height="30" rx="4" fill="#313244" stroke="#a6e3a1" stroke-width="1"/>
  <text x="730" y="264" text-anchor="middle" fill="#a6e3a1" font-size="8">+ thousands</text>
  
  <!-- Lines -->
  <line x1="185" y1="200" x2="130" y2="245" stroke="#585b70" stroke-width="0.5"/>
  <line x1="345" y1="200" x2="250" y2="245" stroke="#585b70" stroke-width="0.5"/>
  <line x1="345" y1="200" x2="370" y2="245" stroke="#585b70" stroke-width="0.5"/>
  <line x1="505" y1="200" x2="490" y2="245" stroke="#585b70" stroke-width="0.5"/>
  <line x1="505" y1="200" x2="610" y2="245" stroke="#585b70" stroke-width="0.5"/>
  <line x1="665" y1="200" x2="730" y2="245" stroke="#585b70" stroke-width="0.5"/>
  
  <!-- Transitive layer 2: major frameworks -->
  <text x="60" y="308" fill="#a6adc8" font-size="9">TRANSITIVE DEPENDENTS (layer 2 — major tools)</text>
  <line x1="60" y1="315" x2="840" y2="315" stroke="#585b70" stroke-width="0.5"/>
  
  <rect x="100" y="325" width="120" height="35" rx="5" fill="#313244" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="160" y="347" text-anchor="middle" fill="#f38ba8" font-size="9" font-weight="bold">Babel</text>
  
  <rect x="250" y="325" width="120" height="35" rx="5" fill="#313244" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="310" y="347" text-anchor="middle" fill="#f38ba8" font-size="9" font-weight="bold">React Native</text>
  
  <rect x="400" y="325" width="120" height="35" rx="5" fill="#313244" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="460" y="347" text-anchor="middle" fill="#f38ba8" font-size="9" font-weight="bold">Webpack</text>
  
  <rect x="550" y="325" width="120" height="35" rx="5" fill="#313244" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="610" y="347" text-anchor="middle" fill="#f38ba8" font-size="9" font-weight="bold">ESLint</text>
  
  <rect x="700" y="325" width="120" height="35" rx="5" fill="#313244" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="760" y="347" text-anchor="middle" fill="#f38ba8" font-size="9" font-weight="bold">+ millions</text>
  
  <!-- Lines -->
  <line x1="130" y1="275" x2="160" y2="325" stroke="#585b70" stroke-width="0.5"/>
  <line x1="250" y1="275" x2="310" y2="325" stroke="#585b70" stroke-width="0.5"/>
  <line x1="370" y1="275" x2="460" y2="325" stroke="#585b70" stroke-width="0.5"/>
  <line x1="610" y1="275" x2="610" y2="325" stroke="#585b70" stroke-width="0.5"/>
  <line x1="730" y1="275" x2="760" y2="325" stroke="#585b70" stroke-width="0.5"/>
  
  <!-- Result -->
  <rect x="80" y="385" width="740" height="45" rx="5" fill="#f38ba8" fill-opacity="0.15" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="450" y="405" text-anchor="middle" fill="#f38ba8" font-size="11" font-weight="bold">ALL BROKEN — npm install fails worldwide</text>
  <text x="450" y="422" text-anchor="middle" fill="#cdd6f4" font-size="9">Millions of builds fail. CI/CD pipelines halt. Production deployments blocked.</text>
  
  <!-- Stats -->
  <rect x="80" y="445" width="740" height="40" rx="5" fill="#313244"/>
  <text x="100" y="465" fill="#a6adc8" font-size="9">Package size:</text>
  <text x="195" y="465" fill="#f38ba8" font-size="9" font-weight="bold">11 lines</text>
  <text x="280" y="465" fill="#a6adc8" font-size="9">| Direct deps:</text>
  <text x="380" y="465" fill="#f38ba8" font-size="9" font-weight="bold">hundreds</text>
  <text x="470" y="465" fill="#a6adc8" font-size="9">| Transitive deps:</text>
  <text x="590" y="465" fill="#f38ba8" font-size="9" font-weight="bold">millions</text>
  <text x="670" y="465" fill="#a6adc8" font-size="9">| Recovery:</text>
  <text x="745" y="465" fill="#a6e3a1" font-size="9" font-weight="bold">npm un-unpublish</text>
</svg>
