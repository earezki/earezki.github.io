<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" font-family="monospace">
  <rect width="900" height="460" fill="#1e1e2e"/>
  <text x="450" y="30" text-anchor="middle" fill="#cdd6f4" font-size="15" font-weight="bold">Cloudflare Outage: Simultaneous Global Deployment</text>
  
  <!-- Engineer -->
  <rect x="60" y="60" width="160" height="50" rx="5" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="140" y="82" text-anchor="middle" fill="#89b4fa" font-size="10" font-weight="bold">WAF Rule Push</text>
  <text x="140" y="98" text-anchor="middle" fill="#cdd6f4" font-size="9">New regex rule deployed</text>
  
  <!-- Arrow to all POPs -->
  <line x1="220" y1="85" x2="310" y2="85" stroke="#89b4fa" stroke-width="2" marker-end="url(#arrowCF)"/>
  <text x="265" y="78" fill="#a6adc8" font-size="8">global push</text>
  
  <!-- Global deployment box -->
  <rect x="310" y="55" width="530" height="110" rx="5" fill="#313244" stroke="#f38ba8" stroke-width="2"/>
  <text x="575" y="75" text-anchor="middle" fill="#f38ba8" font-size="11" font-weight="bold">194 Data Centers — Simultaneous Deployment</text>
  
  <!-- Individual POPs -->
  <rect x="330" y="90" width="70" height="30" rx="3" fill="#45475a" stroke="#f38ba8" stroke-width="1"/>
  <text x="365" y="109" text-anchor="middle" fill="#f38ba8" font-size="8">SFO</text>
  <rect x="330" y="125" width="70" height="30" rx="3" fill="#45475a" stroke="#f38ba8" stroke-width="1"/>
  <text x="365" y="144" text-anchor="middle" fill="#f38ba8" font-size="8">100% CPU</text>
  
  <rect x="420" y="90" width="70" height="30" rx="3" fill="#45475a" stroke="#f38ba8" stroke-width="1"/>
  <text x="455" y="109" text-anchor="middle" fill="#f38ba8" font-size="8">LHR</text>
  <rect x="420" y="125" width="70" height="30" rx="3" fill="#45475a" stroke="#f38ba8" stroke-width="1"/>
  <text x="455" y="144" text-anchor="middle" fill="#f38ba8" font-size="8">100% CPU</text>
  
  <rect x="510" y="90" width="70" height="30" rx="3" fill="#45475a" stroke="#f38ba8" stroke-width="1"/>
  <text x="545" y="109" text-anchor="middle" fill="#f38ba8" font-size="8">NRT</text>
  <rect x="510" y="125" width="70" height="30" rx="3" fill="#45475a" stroke="#f38ba8" stroke-width="1"/>
  <text x="545" y="144" text-anchor="middle" fill="#f38ba8" font-size="8">100% CPU</text>
  
  <rect x="600" y="90" width="70" height="30" rx="3" fill="#45475a" stroke="#f38ba8" stroke-width="1"/>
  <text x="635" y="109" text-anchor="middle" fill="#f38ba8" font-size="8">SIN</text>
  <rect x="600" y="125" width="70" height="30" rx="3" fill="#45475a" stroke="#f38ba8" stroke-width="1"/>
  <text x="635" y="144" text-anchor="middle" fill="#f38ba8" font-size="8">100% CPU</text>
  
  <rect x="690" y="90" width="70" height="30" rx="3" fill="#45475a" stroke="#f38ba8" stroke-width="1"/>
  <text x="725" y="109" text-anchor="middle" fill="#f38ba8" font-size="8">...</text>
  <rect x="690" y="125" width="70" height="30" rx="3" fill="#45475a" stroke="#f38ba8" stroke-width="1"/>
  <text x="725" y="144" text-anchor="middle" fill="#f38ba8" font-size="8">100% CPU</text>
  
  <rect x="780" y="90" width="50" height="30" rx="3" fill="#45475a" stroke="#f38ba8" stroke-width="1"/>
  <text x="805" y="109" text-anchor="middle" fill="#f38ba8" font-size="8">ALL</text>
  <rect x="780" y="125" width="50" height="30" rx="3" fill="#45475a" stroke="#f38ba8" stroke-width="1"/>
  <text x="805" y="144" text-anchor="middle" fill="#f38ba8" font-size="7">100%</text>

  <!-- The regex -->
  <rect x="80" y="195" width="740" height="45" rx="5" fill="#45475a" stroke="#f9e2af" stroke-width="1.5"/>
  <text x="100" y="215" fill="#f9e2af" font-size="10" font-weight="bold">The Regex:</text>
  <text x="200" y="215" fill="#cdd6f4" font-size="9">(?:(?:\"|'|\]|\}|\\|\d|(?:nan|infinity|true|false|null|...</text>
  <text x="100" y="230" fill="#f38ba8" font-size="9">Catastrophic backtracking: O(2^n) on crafted input</text>
  
  <!-- What happened -->
  <rect x="80" y="260" width="350" height="120" rx="5" fill="#313244" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="255" y="282" text-anchor="middle" fill="#f38ba8" font-size="10" font-weight="bold">What Happened</text>
  <text x="100" y="300" fill="#cdd6f4" font-size="9">• Every HTTP request evaluated regex</text>
  <text x="100" y="316" fill="#cdd6f4" font-size="9">• Regex engine enters backtracking loop</text>
  <text x="100" y="332" fill="#cdd6f4" font-size="9">• CPU saturated, no capacity for requests</text>
  <text x="100" y="348" fill="#cdd6f4" font-size="9">• HTTP 502 for ALL Cloudflare customers</text>
  <text x="100" y="364" fill="#f38ba8" font-size="9" font-weight="bold">• 27 minutes of global outage</text>
  
  <!-- What was missing -->
  <rect x="470" y="260" width="350" height="120" rx="5" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="645" y="282" text-anchor="middle" fill="#a6e3a1" font-size="10" font-weight="bold">What Was Missing</text>
  <text x="490" y="300" fill="#a6adc8" font-size="9">✗ No canary deployment (1% → 10% → 100%)</text>
  <text x="490" y="316" fill="#a6adc8" font-size="9">✗ No CPU budget per regex evaluation</text>
  <text x="490" y="332" fill="#a6adc8" font-size="9">✗ No regex complexity analysis in CI</text>
  <text x="490" y="348" fill="#a6adc8" font-size="9">✗ No timeout on WAF rule execution</text>
  <text x="490" y="364" fill="#a6e3a1" font-size="9" font-weight="bold">All added after the outage</text>

  <!-- Impact -->
  <rect x="80" y="400" width="740" height="45" rx="5" fill="#313244"/>
  <text x="100" y="420" fill="#cdd6f4" font-size="10">Duration:</text>
  <text x="175" y="420" fill="#f38ba8" font-size="10" font-weight="bold">27 minutes</text>
  <text x="310" y="420" fill="#cdd6f4" font-size="10">| Scope:</text>
  <text x="375" y="420" fill="#f38ba8" font-size="10" font-weight="bold">100% of traffic</text>
  <text x="530" y="420" fill="#cdd6f4" font-size="10">| Cause:</text>
  <text x="595" y="420" fill="#f38ba8" font-size="10" font-weight="bold">1 regex, 0 canary</text>
  <text x="100" y="436" fill="#a6e3a1" font-size="9">Rule: Never evaluate a backtracking regex against input whose length or content you do not control.</text>
  
  <defs>
    <marker id="arrowCF" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#89b4fa"/></marker>
  </defs>
</svg>
