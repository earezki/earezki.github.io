<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="monospace">
  <rect width="900" height="480" fill="#1e1e2e"/>
  <text x="450" y="30" text-anchor="middle" fill="#cdd6f4" font-size="15" font-weight="bold">Y2038: 32-bit time_t Overflow</text>
  
  <!-- Timeline bar -->
  <rect x="80" y="80" width="740" height="30" rx="3" fill="#313244" stroke="#585b70" stroke-width="1"/>
  
  <!-- Epoch start -->
  <rect x="80" y="80" width="5" height="30" fill="#89b4fa"/>
  <text x="80" y="130" fill="#89b4fa" font-size="9" font-weight="bold">1970-01-01</text>
  <text x="80" y="143" fill="#a6adc8" font-size="8">time_t = 0</text>
  <text x="80" y="155" fill="#a6adc8" font-size="8">Unix epoch</text>
  
  <!-- Current time (approximate) -->
  <rect x="450" y="80" width="3" height="30" fill="#a6e3a1"/>
  <text x="450" y="130" fill="#a6e3a1" font-size="9" font-weight="bold">~2025</text>
  <text x="450" y="143" fill="#a6adc8" font-size="8">We are here</text>
  
  <!-- Overflow point -->
  <rect x="540" y="75" width="4" height="40" fill="#f38ba8"/>
  <text x="540" y="68" fill="#f38ba8" font-size="10" font-weight="bold">2038-01-19</text>
  <text x="540" y="130" fill="#f38ba8" font-size="9" font-weight="bold">03:14:07 UTC</text>
  <text x="540" y="143" fill="#f38ba8" font-size="8">time_t = 2,147,483,647</text>
  <text x="540" y="155" fill="#f38ba8" font-size="8">INT32_MAX</text>
  
  <!-- After overflow -->
  <rect x="544" y="80" width="276" height="30" fill="#f38ba8" fill-opacity="0.15"/>
  <text x="680" y="100" text-anchor="middle" fill="#f38ba8" font-size="9">Wraps to 1901-12-13</text>
  
  <!-- Max int32 -->
  <rect x="815" y="80" width="5" height="30" fill="#585b70"/>

  <!-- The binary representation -->
  <rect x="120" y="190" width="660" height="70" rx="5" fill="#313244" stroke="#89b4fa" stroke-width="1"/>
  <text x="450" y="210" text-anchor="middle" fill="#89b4fa" font-size="10" font-weight="bold">32-bit signed integer (time_t)</text>
  
  <!-- Bit layout -->
  <rect x="150" y="220" width="30" height="28" fill="#f38ba8" fill-opacity="0.3" stroke="#f38ba8" stroke-width="1"/>
  <text x="165" y="238" text-anchor="middle" fill="#f38ba8" font-size="9">S</text>
  
  <rect x="180" y="220" width="600" height="28" fill="#89b4fa" fill-opacity="0.1" stroke="#89b4fa" stroke-width="1"/>
  <text x="480" y="238" text-anchor="middle" fill="#89b4fa" font-size="9">31 bits for seconds since epoch = max 2,147,483,647 seconds ≈ 68 years</text>
  
  <text x="165" y="263" text-anchor="middle" fill="#f38ba8" font-size="8">sign bit flips</text>
  <text x="165" y="275" text-anchor="middle" fill="#f38ba8" font-size="8">at overflow →</text>
  <text x="165" y="287" text-anchor="middle" fill="#f38ba8" font-size="8">negative time</text>

  <!-- Categories of affected systems -->
  <text x="80" y="320" fill="#cdd6f4" font-size="11" font-weight="bold">Categories of Affected Systems</text>
  
  <!-- Category 1 -->
  <rect x="80" y="335" width="190" height="60" rx="5" fill="#313244" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="175" y="355" text-anchor="middle" fill="#f38ba8" font-size="9" font-weight="bold">Embedded Systems</text>
  <text x="175" y="370" text-anchor="middle" fill="#cdd6f4" font-size="8">Industrial controllers</text>
  <text x="175" y="382" text-anchor="middle" fill="#cdd6f4" font-size="8">Medical devices, SCADA</text>
  
  <!-- Category 2 -->
  <rect x="290" y="335" width="190" height="60" rx="5" fill="#313244" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="385" y="355" text-anchor="middle" fill="#f38ba8" font-size="9" font-weight="bold">File Systems</text>
  <text x="385" y="370" text-anchor="middle" fill="#cdd6f4" font-size="8">ext3 timestamps</text>
  <text x="385" y="382" text-anchor="middle" fill="#cdd6f4" font-size="8">NFS, archive formats</text>
  
  <!-- Category 3 -->
  <rect x="500" y="335" width="190" height="60" rx="5" fill="#313244" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="595" y="355" text-anchor="middle" fill="#f38ba8" font-size="9" font-weight="bold">Databases</text>
  <text x="595" y="370" text-anchor="middle" fill="#cdd6f4" font-size="8">MySQL TIMESTAMP columns</text>
  <text x="595" y="382" text-anchor="middle" fill="#cdd6f4" font-size="8">Scheduling, cron systems</text>
  
  <!-- Category 4 -->
  <rect x="710" y="335" width="130" height="60" rx="5" fill="#313244" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="775" y="355" text-anchor="middle" fill="#f38ba8" font-size="9" font-weight="bold">Protocols</text>
  <text x="775" y="370" text-anchor="middle" fill="#cdd6f4" font-size="8">NTP, TLS certs</text>
  <text x="775" y="382" text-anchor="middle" fill="#cdd6f4" font-size="8">Cookie expiry</text>

  <!-- Already failing -->
  <rect x="80" y="415" width="760" height="50" rx="5" fill="#313244"/>
  <text x="100" y="435" fill="#f9e2af" font-size="10" font-weight="bold">Already happening:</text>
  <text x="260" y="435" fill="#cdd6f4" font-size="9">Systems that compute dates 15+ years ahead are failing NOW (mortgages, insurance, bonds)</text>
  <text x="100" y="453" fill="#a6e3a1" font-size="10" font-weight="bold">The Rule:</text>
  <text x="185" y="453" fill="#cdd6f4" font-size="9">Never assume a fixed-width representation is sufficient because it works today.</text>
</svg>
