<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="monospace">
  <rect width="900" height="500" fill="#1e1e2e"/>
  <text x="450" y="30" text-anchor="middle" fill="#cdd6f4" font-size="15" font-weight="bold">Mars Climate Orbiter: Planned vs Actual Trajectory</text>
  
  <!-- Mars -->
  <circle cx="450" cy="280" r="90" fill="#45475a" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="450" y="284" text-anchor="middle" fill="#89b4fa" font-size="12" font-weight="bold">MARS</text>
  <text x="450" y="300" text-anchor="middle" fill="#a6adc8" font-size="9">r = 3,396 km</text>
  
  <!-- Atmosphere line -->
  <circle cx="450" cy="280" r="100" fill="none" stroke="#f38ba8" stroke-width="0.5" stroke-dasharray="3"/>
  <text x="560" y="210" fill="#f38ba8" font-size="8">atmosphere</text>
  
  <!-- Planned orbit at 226 km -->
  <ellipse cx="450" cy="260" rx="210" ry="160" fill="none" stroke="#a6e3a1" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="680" y="200" fill="#a6e3a1" font-size="10" font-weight="bold">PLANNED ORBIT</text>
  <text x="680" y="215" fill="#a6e3a1" font-size="9">Periapsis: 226 km</text>
  <text x="680" y="228" fill="#a6e3a1" font-size="8">Safe orbital insertion</text>
  
  <!-- Marker for 226 km point -->
  <circle cx="450" cy="100" r="4" fill="#a6e3a1"/>
  <line x1="454" y1="100" x2="520" y2="80" stroke="#a6e3a1" stroke-width="0.5"/>
  <text x="525" y="84" fill="#a6e3a1" font-size="8">226 km altitude</text>

  <!-- Actual trajectory at 57 km -->
  <path d="M 850 400 Q 550 250 450 205" fill="none" stroke="#f38ba8" stroke-width="2.5"/>
  <circle cx="450" cy="205" r="5" fill="#f38ba8"/>
  <line x1="445" y1="200" x2="350" y2="140" stroke="#f38ba8" stroke-width="0.5"/>
  <text x="260" y="130" fill="#f38ba8" font-size="10" font-weight="bold">ACTUAL TRAJECTORY</text>
  <text x="260" y="145" fill="#f38ba8" font-size="9">Periapsis: 57 km</text>
  <text x="260" y="158" fill="#f38ba8" font-size="8">Below survivable altitude</text>
  
  <!-- Arrow showing approach -->
  <text x="780" y="370" fill="#cdd6f4" font-size="9">Approach</text>
  <text x="780" y="383" fill="#cdd6f4" font-size="9">vector</text>

  <!-- Error annotation -->
  <line x1="452" y1="108" x2="452" y2="200" stroke="#f9e2af" stroke-width="1" stroke-dasharray="3"/>
  <text x="460" y="160" fill="#f9e2af" font-size="9">169 km error</text>
  
  <!-- Data flow showing unit mismatch -->
  <rect x="50" y="370" width="220" height="45" rx="5" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="160" y="390" text-anchor="middle" fill="#89b4fa" font-size="10" font-weight="bold">Lockheed Martin</text>
  <text x="160" y="404" text-anchor="middle" fill="#89b4fa" font-size="9">Outputs: pound-seconds</text>
  
  <line x1="270" y1="392" x2="350" y2="392" stroke="#f9e2af" stroke-width="2" marker-end="url(#arrowY)"/>
  <text x="310" y="385" text-anchor="middle" fill="#f9e2af" font-size="8">AMD file</text>
  
  <rect x="350" y="370" width="220" height="45" rx="5" fill="#313244" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="460" y="390" text-anchor="middle" fill="#f38ba8" font-size="10" font-weight="bold">JPL Navigation</text>
  <text x="460" y="404" text-anchor="middle" fill="#f38ba8" font-size="9">Expects: newton-seconds</text>
  
  <line x1="570" y1="392" x2="650" y2="392" stroke="#f38ba8" stroke-width="2" marker-end="url(#arrowR)"/>
  
  <rect x="650" y="375" width="140" height="34" rx="5" fill="#f38ba8" fill-opacity="0.2" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="720" y="396" text-anchor="middle" fill="#f38ba8" font-size="10" font-weight="bold">4.45× error</text>

  <!-- Bottom summary -->
  <rect x="50" y="440" width="800" height="45" rx="5" fill="#313244"/>
  <text x="70" y="460" fill="#a6e3a1" font-size="10" font-weight="bold">The Rule:</text>
  <text x="145" y="460" fill="#cdd6f4" font-size="10">Every data interface between independently developed components must enforce</text>
  <text x="70" y="476" fill="#cdd6f4" font-size="10">unit and type consistency at the software level, not in documentation alone.</text>

  <defs>
    <marker id="arrowY" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f9e2af"/></marker>
    <marker id="arrowR" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f38ba8"/></marker>
  </defs>
</svg>
