<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="monospace">
  <rect width="900" height="520" fill="#1e1e2e"/>
  <text x="450" y="30" text-anchor="middle" fill="#cdd6f4" font-size="15" font-weight="bold">GitLab: Five Backup Mechanisms — Five Failures</text>
  
  <!-- Headers -->
  <text x="80" y="65" fill="#a6adc8" font-size="10" font-weight="bold">BACKUP METHOD</text>
  <text x="380" y="65" fill="#a6adc8" font-size="10" font-weight="bold">EXPECTED STATE</text>
  <text x="600" y="65" fill="#a6adc8" font-size="10" font-weight="bold">ACTUAL STATE</text>
  <line x1="60" y1="75" x2="840" y2="75" stroke="#585b70" stroke-width="1"/>

  <!-- 1. Regular pg_dump -->
  <rect x="60" y="90" width="280" height="50" rx="5" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="80" y="112" fill="#89b4fa" font-size="10" font-weight="bold">1. pg_dump (cron job)</text>
  <text x="80" y="128" fill="#a6adc8" font-size="9">Daily automated database dump</text>
  
  <rect x="370" y="95" width="180" height="40" rx="3" fill="#313244"/>
  <text x="460" y="119" text-anchor="middle" fill="#a6e3a1" font-size="9">Daily SQL dump files</text>
  
  <rect x="580" y="90" width="260" height="50" rx="5" fill="#f38ba8" fill-opacity="0.1" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="600" y="112" fill="#f38ba8" font-size="10" font-weight="bold">FAILING SILENTLY</text>
  <text x="600" y="128" fill="#f38ba8" font-size="9">Error: not enough disk space</text>
  
  <!-- X mark -->
  <text x="555" y="120" fill="#f38ba8" font-size="16" font-weight="bold">✗</text>

  <!-- 2. LVM Snapshots -->
  <rect x="60" y="160" width="280" height="50" rx="5" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="80" y="182" fill="#89b4fa" font-size="10" font-weight="bold">2. LVM Snapshots</text>
  <text x="80" y="198" fill="#a6adc8" font-size="9">Block-level filesystem snapshots</text>
  
  <rect x="370" y="165" width="180" height="40" rx="3" fill="#313244"/>
  <text x="460" y="189" text-anchor="middle" fill="#a6e3a1" font-size="9">Point-in-time recovery</text>
  
  <rect x="580" y="160" width="260" height="50" rx="5" fill="#f38ba8" fill-opacity="0.1" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="600" y="182" fill="#f38ba8" font-size="10" font-weight="bold">NEVER CONFIGURED</text>
  <text x="600" y="198" fill="#f38ba8" font-size="9">Not set up on this server</text>
  
  <text x="555" y="190" fill="#f38ba8" font-size="16" font-weight="bold">✗</text>

  <!-- 3. Azure Disk Snapshots -->
  <rect x="60" y="230" width="280" height="50" rx="5" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="80" y="252" fill="#89b4fa" font-size="10" font-weight="bold">3. Azure Disk Snapshots</text>
  <text x="80" y="268" fill="#a6adc8" font-size="9">Cloud provider snapshot service</text>
  
  <rect x="370" y="235" width="180" height="40" rx="3" fill="#313244"/>
  <text x="460" y="259" text-anchor="middle" fill="#a6e3a1" font-size="9">VM-level backup</text>
  
  <rect x="580" y="230" width="260" height="50" rx="5" fill="#f38ba8" fill-opacity="0.1" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="600" y="252" fill="#f38ba8" font-size="10" font-weight="bold">NOT ENABLED</text>
  <text x="600" y="268" fill="#f38ba8" font-size="9">Disabled for this project</text>
  
  <text x="555" y="260" fill="#f38ba8" font-size="16" font-weight="bold">✗</text>

  <!-- 4. Streaming Replication -->
  <rect x="60" y="300" width="280" height="50" rx="5" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="80" y="322" fill="#89b4fa" font-size="10" font-weight="bold">4. Streaming Replication</text>
  <text x="80" y="338" fill="#a6adc8" font-size="9">Real-time PostgreSQL replica</text>
  
  <rect x="370" y="305" width="180" height="40" rx="3" fill="#313244"/>
  <text x="460" y="329" text-anchor="middle" fill="#a6e3a1" font-size="9">Hot standby database</text>
  
  <rect x="580" y="300" width="260" height="50" rx="5" fill="#f38ba8" fill-opacity="0.1" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="600" y="322" fill="#f38ba8" font-size="10" font-weight="bold">REPLICATED DELETION</text>
  <text x="600" y="338" fill="#f38ba8" font-size="9">rm -rf replicated instantly</text>
  
  <text x="555" y="330" fill="#f38ba8" font-size="16" font-weight="bold">✗</text>

  <!-- 5. S3 Backups -->
  <rect x="60" y="370" width="280" height="50" rx="5" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="80" y="392" fill="#89b4fa" font-size="10" font-weight="bold">5. S3 Bucket Backups</text>
  <text x="80" y="408" fill="#a6adc8" font-size="9">Offsite backup copies</text>
  
  <rect x="370" y="375" width="180" height="40" rx="3" fill="#313244"/>
  <text x="460" y="399" text-anchor="middle" fill="#a6e3a1" font-size="9">Remote disaster recovery</text>
  
  <rect x="580" y="370" width="260" height="50" rx="5" fill="#f9e2af" fill-opacity="0.1" stroke="#f9e2af" stroke-width="1.5"/>
  <text x="600" y="392" fill="#f9e2af" font-size="10" font-weight="bold">PARTIAL — 6 HOURS OLD</text>
  <text x="600" y="408" fill="#f9e2af" font-size="9">Only usable backup, 6h data loss</text>
  
  <text x="555" y="400" fill="#f9e2af" font-size="16">⚠</text>

  <!-- Summary -->
  <rect x="60" y="445" width="780" height="55" rx="5" fill="#313244"/>
  <text x="80" y="468" fill="#f38ba8" font-size="10" font-weight="bold">Result: 5 backup systems, 0 verified restores, 6 hours of data permanently lost</text>
  <text x="80" y="486" fill="#a6e3a1" font-size="10">The Rule: A backup that has never been restored is not a backup. It is a hypothesis.</text>
</svg>
