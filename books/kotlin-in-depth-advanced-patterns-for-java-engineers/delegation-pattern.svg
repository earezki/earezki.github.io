<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#6B57FF"/>
    </marker>
    <marker id="arrowImpl" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="none" stroke="#2E7D32" stroke-width="1.5"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, sans-serif; }
      .code { font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; font-size: 11px; }
    </style>
  </defs>
  <rect width="800" height="400" fill="white"/>

  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#2D2D2D">Delegation Pattern — Kotlin <tspan fill="#6B57FF">by</tspan> Keyword</text>

  <!-- Interface -->
  <rect x="290" y="48" width="220" height="70" rx="10" fill="#EDE9FF" stroke="#6B57FF" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="68" text-anchor="middle" font-size="11" fill="#6B57FF" font-weight="600">«interface»</text>
  <text x="400" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#2D2D2D">Printer</text>
  <line x1="300" y1="95" x2="500" y2="95" stroke="#6B57FF" stroke-width="0.5"/>
  <text x="400" y="112" text-anchor="middle" class="code" fill="#2D2D2D">fun print(msg: String)</text>

  <!-- RealPrinter -->
  <rect x="50" y="175" width="220" height="80" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="160" y="200" text-anchor="middle" font-size="14" font-weight="700" fill="#2E7D32">RealPrinter</text>
  <line x1="60" y1="207" x2="260" y2="207" stroke="#2E7D32" stroke-width="0.5"/>
  <text x="70" y="225" class="code" fill="#2D2D2D">fun print(msg: String) {</text>
  <text x="80" y="240" class="code" fill="#2D2D2D">  println(msg)</text>
  <text x="70" y="250" class="code" fill="#2D2D2D">}</text>

  <!-- Arrow RealPrinter implements Printer -->
  <line x1="160" y1="175" x2="350" y2="118" stroke="#2E7D32" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowImpl)"/>
  <text x="230" y="140" font-size="10" fill="#2E7D32" font-weight="500">implements</text>

  <!-- DelegatingPrinter -->
  <rect x="380" y="175" width="280" height="80" rx="10" fill="#FFF5EB" stroke="#F7931E" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="520" y="200" text-anchor="middle" font-size="14" font-weight="700" fill="#F7931E">DelegatingPrinter</text>
  <line x1="390" y1="207" x2="650" y2="207" stroke="#F7931E" stroke-width="0.5"/>
  <text x="400" y="225" class="code" fill="#2D2D2D">class DelegatingPrinter(p: Printer)</text>
  <text x="400" y="242" class="code" fill="#2D2D2D">  : Printer <tspan fill="#6B57FF" font-weight="700">by</tspan> p</text>

  <!-- Arrow DelegatingPrinter implements Printer -->
  <line x1="460" y1="175" x2="440" y2="118" stroke="#F7931E" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowImpl)"/>
  <text x="460" y="140" font-size="10" fill="#F7931E" font-weight="500">implements via delegation</text>

  <!-- Arrow delegation link -->
  <line x1="380" y1="230" x2="275" y2="230" stroke="#6B57FF" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="328" y="220" text-anchor="middle" font-size="10" fill="#6B57FF" font-weight="600">delegates to</text>

  <!-- Comparison section -->
  <text x="400" y="290" text-anchor="middle" font-size="14" font-weight="700" fill="#2D2D2D">Kotlin vs Java</text>

  <!-- Kotlin -->
  <rect x="30" y="300" width="350" height="85" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="205" y="320" text-anchor="middle" font-size="12" font-weight="700" fill="#2E7D32">Kotlin — 1 line</text>
  <text x="50" y="340" class="code" fill="#2D2D2D">class DelegatingPrinter(p: Printer)</text>
  <text x="50" y="356" class="code" fill="#2D2D2D">  : Printer <tspan fill="#6B57FF" font-weight="700">by</tspan> p</text>
  <text x="50" y="376" class="code" fill="#2E7D32">// Compiler generates forwarding methods ✓</text>

  <!-- Java -->
  <rect x="420" y="300" width="350" height="85" rx="10" fill="#FFEBEE" stroke="#E53935" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="595" y="320" text-anchor="middle" font-size="12" font-weight="700" fill="#E53935">Java — Manual Boilerplate</text>
  <text x="440" y="340" class="code" fill="#2D2D2D">class DelegatingPrinter implements Printer {</text>
  <text x="450" y="356" class="code" fill="#2D2D2D">  private final Printer delegate;</text>
  <text x="450" y="372" class="code" fill="#E53935">  public void print(String msg) {</text>
  <text x="460" y="382" class="code" fill="#E53935">    delegate.print(msg); // every method!</text>
</svg>