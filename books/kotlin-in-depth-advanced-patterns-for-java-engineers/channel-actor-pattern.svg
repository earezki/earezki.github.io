<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#6B57FF"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#F7931E"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, sans-serif; }
      .code { font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; font-size: 11px; }
    </style>
  </defs>
  <rect width="800" height="400" fill="white"/>

  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#2D2D2D">Channel &amp; Actor Pattern</text>

  <!-- Coroutine senders (left side) -->
  <text x="110" y="60" text-anchor="middle" font-size="13" font-weight="600" fill="#6B57FF">Sender Coroutines</text>

  <rect x="25" y="75" width="170" height="44" rx="8" fill="#EDE9FF" stroke="#6B57FF" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="110" y="95" text-anchor="middle" font-size="12" font-weight="600" fill="#6B57FF">Coroutine A</text>
  <text x="110" y="112" text-anchor="middle" font-size="10" fill="#666">send(Increment)</text>

  <rect x="25" y="135" width="170" height="44" rx="8" fill="#EDE9FF" stroke="#6B57FF" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="110" y="155" text-anchor="middle" font-size="12" font-weight="600" fill="#6B57FF">Coroutine B</text>
  <text x="110" y="172" text-anchor="middle" font-size="10" fill="#666">send(GetValue)</text>

  <rect x="25" y="195" width="170" height="44" rx="8" fill="#EDE9FF" stroke="#6B57FF" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="110" y="215" text-anchor="middle" font-size="12" font-weight="600" fill="#6B57FF">Coroutine C</text>
  <text x="110" y="232" text-anchor="middle" font-size="10" fill="#666">send(Decrement)</text>

  <!-- Channel (middle) -->
  <line x1="195" y1="97" x2="288" y2="157" stroke="#F7931E" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <line x1="195" y1="157" x2="288" y2="157" stroke="#F7931E" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <line x1="195" y1="217" x2="288" y2="157" stroke="#F7931E" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <rect x="290" y="80" width="180" height="160" rx="12" fill="#FFF5EB" stroke="#F7931E" stroke-width="2" filter="url(#shadow)"/>
  <text x="380" y="105" text-anchor="middle" font-size="14" font-weight="700" fill="#F7931E">Channel</text>
  <text x="380" y="125" text-anchor="middle" font-size="11" fill="#2D2D2D">FIFO Queue</text>

  <!-- Messages in channel -->
  <rect x="310" y="138" width="140" height="26" rx="5" fill="white" stroke="#F7931E" stroke-width="1"/>
  <text x="380" y="156" text-anchor="middle" font-size="10" fill="#F7931E" font-weight="500">→ Increment</text>
  <rect x="310" y="170" width="140" height="26" rx="5" fill="white" stroke="#F7931E" stroke-width="1"/>
  <text x="380" y="188" text-anchor="middle" font-size="10" fill="#F7931E" font-weight="500">→ GetValue</text>
  <rect x="310" y="202" width="140" height="26" rx="5" fill="white" stroke="#F7931E" stroke-width="1"/>
  <text x="380" y="220" text-anchor="middle" font-size="10" fill="#F7931E" font-weight="500">→ Decrement</text>

  <!-- Arrow to Actor -->
  <line x1="470" y1="157" x2="520" y2="157" stroke="#F7931E" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="495" y="148" text-anchor="middle" font-size="9" fill="#F7931E" font-weight="600">receive</text>

  <!-- Actor (right side) -->
  <rect x="525" y="60" width="250" height="200" rx="12" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2" filter="url(#shadow)"/>
  <text x="650" y="85" text-anchor="middle" font-size="14" font-weight="700" fill="#2E7D32">Actor</text>
  <text x="650" y="102" text-anchor="middle" font-size="10" fill="#2D2D2D">(single coroutine)</text>

  <!-- Processing loop -->
  <rect x="545" y="112" width="210" height="60" rx="7" fill="white" stroke="#2E7D32" stroke-width="1"/>
  <text x="555" y="130" class="code" fill="#2D2D2D">for (msg in channel) {</text>
  <text x="565" y="147" class="code" fill="#2D2D2D">  when (msg) { /* handle */ }</text>
  <text x="555" y="164" class="code" fill="#2D2D2D">}</text>

  <!-- Private state -->
  <rect x="545" y="185" width="210" height="60" rx="7" fill="#C8E6C9" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="650" y="205" text-anchor="middle" font-size="12" font-weight="700" fill="#2E7D32">Private Mutable State</text>
  <text x="555" y="225" class="code" fill="#2D2D2D">var counter = 0</text>
  <text x="555" y="238" class="code" fill="#2E7D32" font-weight="500">// Only this coroutine!</text>

  <!-- No lock highlight -->
  <rect x="180" y="275" width="440" height="52" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="297" text-anchor="middle" font-size="14" font-weight="700" fill="#2E7D32">No locks needed!</text>
  <text x="400" y="316" text-anchor="middle" font-size="11" fill="#2D2D2D">Only one coroutine accesses the mutable state → no data races by design</text>

  <!-- Comparison -->
  <rect x="40" y="345" width="340" height="42" rx="8" fill="#FFEBEE" stroke="#E53935" stroke-width="1" filter="url(#shadow)"/>
  <text x="210" y="365" text-anchor="middle" font-size="11" font-weight="600" fill="#E53935">Shared Mutable State (Traditional)</text>
  <text x="210" y="381" text-anchor="middle" font-size="10" fill="#2D2D2D">synchronized / Mutex / AtomicInteger</text>

  <rect x="420" y="345" width="340" height="42" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1" filter="url(#shadow)"/>
  <text x="590" y="365" text-anchor="middle" font-size="11" font-weight="600" fill="#2E7D32">Message Passing (Actor)</text>
  <text x="590" y="381" text-anchor="middle" font-size="10" fill="#2D2D2D">No shared state → no synchronization ✓</text>
</svg>