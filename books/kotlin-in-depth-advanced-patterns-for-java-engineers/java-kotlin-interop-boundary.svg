<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#6B57FF"/>
    </marker>
    <marker id="arrowLeft" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <polygon points="8,0 0,3 8,6" fill="#F7931E"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, sans-serif; }
      .code { font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; font-size: 10.5px; }
    </style>
  </defs>
  <rect width="800" height="450" fill="white"/>

  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#2D2D2D">Java ↔ Kotlin Interop Boundary</text>

  <!-- Kotlin side -->
  <rect x="20" y="50" width="305" height="340" rx="12" fill="#EDE9FF" stroke="#6B57FF" stroke-width="2" filter="url(#shadow)"/>
  <text x="172" y="75" text-anchor="middle" font-size="16" font-weight="700" fill="#6B57FF">Kotlin Side</text>

  <text x="40" y="100" font-size="12" font-weight="600" fill="#2D2D2D">Types are always explicit:</text>
  <text x="50" y="120" class="code" fill="#2D2D2D">val name: <tspan fill="#6B57FF" font-weight="600">String</tspan>      // non-null</text>
  <text x="50" y="138" class="code" fill="#2D2D2D">val nick: <tspan fill="#F7931E" font-weight="600">String?</tspan>     // nullable</text>

  <text x="40" y="165" font-size="12" font-weight="600" fill="#2D2D2D">Property accessors:</text>
  <text x="50" y="185" class="code" fill="#2D2D2D">val x: Int     <tspan fill="#999">// getX()</tspan></text>
  <text x="50" y="203" class="code" fill="#2D2D2D">var y: Int     <tspan fill="#999">// getY() + setY()</tspan></text>
  <text x="50" y="221" class="code" fill="#2D2D2D">val isValid    <tspan fill="#999">// isValid()</tspan></text>

  <text x="40" y="248" font-size="12" font-weight="600" fill="#2D2D2D">Companion object:</text>
  <text x="50" y="268" class="code" fill="#6B57FF">companion object</text><text x="170" y="268" class="code" fill="#2D2D2D"> {</text>
  <text x="60" y="285" class="code" fill="#2D2D2D">  fun create(): MyClass</text>
  <text x="50" y="298" class="code" fill="#2D2D2D">}</text>

  <text x="40" y="325" font-size="12" font-weight="600" fill="#2D2D2D">SAM lambda:</text>
  <text x="50" y="345" class="code" fill="#2D2D2D">list.forEach { println(it) }</text>
  <text x="50" y="365" class="code" fill="#999">// lambda → SAM interface auto</text>

  <!-- Java side -->
  <rect x="475" y="50" width="305" height="340" rx="12" fill="#FFF5EB" stroke="#F7931E" stroke-width="2" filter="url(#shadow)"/>
  <text x="627" y="75" text-anchor="middle" font-size="16" font-weight="700" fill="#F7931E">Java Side</text>

  <text x="495" y="100" font-size="12" font-weight="600" fill="#2D2D2D">Types from Java are platform:</text>
  <text x="505" y="120" class="code" fill="#2D2D2D">String getName()  <tspan fill="#E53935">// T!</tspan></text>
  <text x="505" y="138" class="code" fill="#2D2D2D"><tspan fill="#2E7D32">@NotNull</tspan> String → String</text>
  <text x="505" y="156" class="code" fill="#2D2D2D"><tspan fill="#F7931E">@Nullable</tspan> String → String?</text>

  <text x="495" y="183" font-size="12" font-weight="600" fill="#2D2D2D">Property access becomes:</text>
  <text x="505" y="203" class="code" fill="#2D2D2D">obj.getX()        <tspan fill="#999">// getter</tspan></text>
  <text x="505" y="221" class="code" fill="#2D2D2D">obj.setY(value)   <tspan fill="#999">// setter</tspan></text>

  <text x="495" y="248" font-size="12" font-weight="600" fill="#2D2D2D">Companion access:</text>
  <text x="505" y="268" class="code" fill="#F7931E" font-weight="600">MyClass.Companion</text><text x="658" y="268" class="code" fill="#2D2D2D">.create()</text>
  <text x="505" y="285" class="code" fill="#999">// or @JvmStatic →</text>
  <text x="505" y="298" class="code" fill="#2E7D32" font-weight="600">MyClass.create()</text>

  <text x="495" y="325" font-size="12" font-weight="600" fill="#2D2D2D">SAM conversion:</text>
  <text x="505" y="345" class="code" fill="#2D2D2D">list.forEach(item -&gt;</text>
  <text x="525" y="360" class="code" fill="#2D2D2D">System.out.println(item))</text>

  <!-- Danger zone in the middle -->
  <rect x="330" y="80" width="140" height="130" rx="10" fill="#FFEBEE" stroke="#E53935" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="102" text-anchor="middle" font-size="13" font-weight="700" fill="#E53935">⚠ Danger Zone</text>
  <text x="400" y="125" text-anchor="middle" font-size="14" font-weight="700" fill="#E53935">T!</text>
  <text x="400" y="145" text-anchor="middle" font-size="10" fill="#2D2D2D">Platform Type</text>
  <text x="400" y="165" text-anchor="middle" font-size="10" fill="#2D2D2D">No compile-time</text>
  <text x="400" y="180" text-anchor="middle" font-size="10" fill="#2D2D2D">null check!</text>
  <text x="400" y="200" text-anchor="middle" font-size="10" fill="#E53935">NPE at runtime</text>

  <!-- Arrows through danger zone -->
  <line x1="325" y1="120" x2="336" y2="120" stroke="#6B57FF" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="475" y1="120" x2="464" y2="120" stroke="#F7931E" stroke-width="1.5" marker-end="url(#arrowLeft)"/>

  <!-- Annotation mapping -->
  <rect x="330" y="225" width="140" height="80" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="248" text-anchor="middle" font-size="12" font-weight="700" fill="#2E7D32">Annotations</text>
  <text x="400" y="268" text-anchor="middle" font-size="10" fill="#2D2D2D">@NotNull → T</text>
  <text x="400" y="285" text-anchor="middle" font-size="10" fill="#2D2D2D">@Nullable → T?</text>
  <text x="400" y="298" text-anchor="middle" font-size="10" fill="#2E7D32" font-weight="500">Safe ✓</text>

  <!-- Common pitfalls at bottom -->
  <rect x="60" y="400" width="680" height="40" rx="8" fill="#F5F5F5" stroke="#E8E8E8" stroke-width="1" filter="url(#shadow)"/>
  <text x="400" y="420" text-anchor="middle" font-size="11" font-weight="600" fill="#2D2D2D">Key annotations: <tspan fill="#6B57FF">@JvmStatic</tspan> · <tspan fill="#6B57FF">@JvmField</tspan> · <tspan fill="#6B57FF">@JvmOverloads</tspan> · <tspan fill="#6B57FF">@JvmName</tspan> · <tspan fill="#6B57FF">@Throws</tspan></text>
  <text x="400" y="436" text-anchor="middle" font-size="10" fill="#666" font-style="italic">Use these annotations to control how Kotlin declarations appear to Java code</text>
</svg>