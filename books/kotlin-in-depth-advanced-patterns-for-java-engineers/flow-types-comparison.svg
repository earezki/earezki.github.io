<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowDown" markerWidth="8" markerHeight="6" refX="4" refY="6" orient="auto">
      <polygon points="0,0 8,0 4,6" fill="#6B57FF"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, sans-serif; }
    </style>
  </defs>
  <rect width="800" height="400" fill="white"/>

  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#2D2D2D">Flow Types Comparison</text>

  <!-- Hot vs Cold spectrum -->
  <rect x="80" y="42" width="640" height="22" rx="11" fill="linear-gradient()" stroke="#E8E8E8" stroke-width="1"/>
  <rect x="80" y="42" width="640" height="22" rx="11" fill="#F5F5F5" stroke="#E8E8E8" stroke-width="1"/>
  <rect x="80" y="42" width="213" height="22" rx="11" fill="#EDE9FF" stroke="#6B57FF" stroke-width="1"/>
  <text x="187" y="57" text-anchor="middle" font-size="10" font-weight="700" fill="#6B57FF">COLD</text>
  <rect x="507" y="42" width="213" height="22" rx="11" fill="#FFEBEE" stroke="#E53935" stroke-width="1"/>
  <text x="614" y="57" text-anchor="middle" font-size="10" font-weight="700" fill="#E53935">HOT</text>
  <text x="400" y="57" text-anchor="middle" font-size="10" font-weight="600" fill="#666">spectrum →</text>

  <!-- Column 1: Cold Flow -->
  <rect x="30" y="75" width="230" height="300" rx="12" fill="white" stroke="#6B57FF" stroke-width="2" filter="url(#shadow)"/>
  <rect x="30" y="75" width="230" height="40" rx="12" fill="#6B57FF"/>
  <rect x="30" y="100" width="230" height="15" fill="#6B57FF"/>
  <text x="145" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="white">Cold Flow</text>

  <!-- Emission pattern -->
  <text x="50" y="135" font-size="11" font-weight="600" fill="#2D2D2D">Emission Pattern:</text>
  <text x="60" y="153" font-size="10" fill="#6B57FF">emit(1) → 🔵 → collect</text>
  <text x="60" y="168" font-size="10" fill="#6B57FF">emit(2) → 🔵 → collect</text>
  <text x="60" y="183" font-size="10" fill="#6B57FF">emit(3) → 🔵 → collect</text>
  <text x="60" y="198" font-size="10" fill="#999" font-style="italic">On-demand, sequential</text>

  <line x1="50" y1="208" x2="240" y2="208" stroke="#E8E8E8" stroke-width="1"/>
  <text x="50" y="225" font-size="11" font-weight="600" fill="#2D2D2D">Collectors:</text>
  <text x="60" y="242" font-size="10" fill="#2D2D2D">Each gets <tspan font-weight="600">independent</tspan> stream</text>
  <text x="60" y="257" font-size="10" fill="#2D2D2D">Starts fresh per collector</text>

  <line x1="50" y1="267" x2="240" y2="267" stroke="#E8E8E8" stroke-width="1"/>
  <text x="50" y="284" font-size="11" font-weight="600" fill="#2D2D2D">Replay:</text>
  <text x="60" y="301" font-size="10" fill="#2D2D2D">Full replay (re-executes)</text>

  <line x1="50" y1="311" x2="240" y2="311" stroke="#E8E8E8" stroke-width="1"/>
  <text x="50" y="328" font-size="11" font-weight="600" fill="#2D2D2D">Use Cases:</text>
  <text x="60" y="345" font-size="10" fill="#666">• Database queries</text>
  <text x="60" y="360" font-size="10" fill="#666">• Network requests</text>

  <!-- Column 2: SharedFlow -->
  <rect x="285" y="75" width="230" height="300" rx="12" fill="white" stroke="#F7931E" stroke-width="2" filter="url(#shadow)"/>
  <rect x="285" y="75" width="230" height="40" rx="12" fill="#F7931E"/>
  <rect x="285" y="100" width="230" height="15" fill="#F7931E"/>
  <text x="400" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="white">SharedFlow</text>

  <text x="305" y="135" font-size="11" font-weight="600" fill="#2D2D2D">Emission Pattern:</text>
  <text x="315" y="153" font-size="10" fill="#F7931E">emit → 🟠 → collector A</text>
  <text x="315" y="168" font-size="10" fill="#F7931E">     ↘ 🟠 → collector B</text>
  <text x="315" y="183" font-size="10" fill="#F7931E">     ↘ 🟠 → collector C</text>
  <text x="315" y="198" font-size="10" fill="#999" font-style="italic">Broadcast to all</text>

  <line x1="305" y1="208" x2="495" y2="208" stroke="#E8E8E8" stroke-width="1"/>
  <text x="305" y="225" font-size="11" font-weight="600" fill="#2D2D2D">Collectors:</text>
  <text x="315" y="242" font-size="10" fill="#2D2D2D"><tspan font-weight="600">Multiple</tspan> concurrent</text>
  <text x="315" y="257" font-size="10" fill="#2D2D2D">All share same stream</text>

  <line x1="305" y1="267" x2="495" y2="267" stroke="#E8E8E8" stroke-width="1"/>
  <text x="305" y="284" font-size="11" font-weight="600" fill="#2D2D2D">Replay:</text>
  <text x="315" y="301" font-size="10" fill="#2D2D2D">Configurable (0..N)</text>

  <line x1="305" y1="311" x2="495" y2="311" stroke="#E8E8E8" stroke-width="1"/>
  <text x="305" y="328" font-size="11" font-weight="600" fill="#2D2D2D">Use Cases:</text>
  <text x="315" y="345" font-size="10" fill="#666">• Events / notifications</text>
  <text x="315" y="360" font-size="10" fill="#666">• One-time signals</text>

  <!-- Column 3: StateFlow -->
  <rect x="540" y="75" width="230" height="300" rx="12" fill="white" stroke="#E53935" stroke-width="2" filter="url(#shadow)"/>
  <rect x="540" y="75" width="230" height="40" rx="12" fill="#E53935"/>
  <rect x="540" y="100" width="230" height="15" fill="#E53935"/>
  <text x="655" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="white">StateFlow</text>

  <text x="560" y="135" font-size="11" font-weight="600" fill="#2D2D2D">Emission Pattern:</text>
  <text x="570" y="153" font-size="10" fill="#E53935">[current value] always available</text>
  <text x="570" y="168" font-size="10" fill="#E53935">value = newState</text>
  <text x="570" y="183" font-size="10" fill="#E53935">Only emits on <tspan font-weight="600">change</tspan></text>
  <text x="570" y="198" font-size="10" fill="#999" font-style="italic">Conflated, distinct</text>

  <line x1="560" y1="208" x2="750" y2="208" stroke="#E8E8E8" stroke-width="1"/>
  <text x="560" y="225" font-size="11" font-weight="600" fill="#2D2D2D">Collectors:</text>
  <text x="570" y="242" font-size="10" fill="#2D2D2D"><tspan font-weight="600">Multiple</tspan> concurrent</text>
  <text x="570" y="257" font-size="10" fill="#2D2D2D">Always get latest value</text>

  <line x1="560" y1="267" x2="750" y2="267" stroke="#E8E8E8" stroke-width="1"/>
  <text x="560" y="284" font-size="11" font-weight="600" fill="#2D2D2D">Replay:</text>
  <text x="570" y="301" font-size="10" fill="#2D2D2D">Always 1 (latest state)</text>

  <line x1="560" y1="311" x2="750" y2="311" stroke="#E8E8E8" stroke-width="1"/>
  <text x="560" y="328" font-size="11" font-weight="600" fill="#2D2D2D">Use Cases:</text>
  <text x="570" y="345" font-size="10" fill="#666">• UI state (like LiveData)</text>
  <text x="570" y="360" font-size="10" fill="#666">• Observable properties</text>

  <!-- Bottom note -->
  <text x="400" y="393" text-anchor="middle" font-size="11" fill="#666" font-style="italic">StateFlow is a specialized SharedFlow with replay=1, distinctUntilChanged, and a .value property</text>
</svg>