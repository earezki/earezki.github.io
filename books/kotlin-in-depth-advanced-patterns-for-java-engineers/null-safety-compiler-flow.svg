<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#6B57FF"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#E53935"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#2E7D32"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, sans-serif; }
    </style>
  </defs>
  <rect width="800" height="450" fill="white"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#2D2D2D">Null Safety — Compiler Analysis Flow</text>

  <!-- Step 1: Variable Declaration -->
  <rect x="305" y="50" width="190" height="38" rx="8" fill="#6B57FF" filter="url(#shadow)"/>
  <text x="400" y="74" text-anchor="middle" font-size="13" font-weight="600" fill="white">Variable Declaration</text>
  <line x1="400" y1="88" x2="400" y2="108" stroke="#6B57FF" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 2: Type Inference -->
  <rect x="315" y="112" width="170" height="36" rx="8" fill="#F5F5F5" stroke="#E8E8E8" stroke-width="1" filter="url(#shadow)"/>
  <text x="400" y="135" text-anchor="middle" font-size="13" font-weight="500" fill="#2D2D2D">Type Inference</text>
  <line x1="400" y1="148" x2="400" y2="170" stroke="#6B57FF" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Decision: Nullable? -->
  <polygon points="400,173 490,208 400,243 310,208" fill="#FFF5EB" stroke="#F7931E" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="205" text-anchor="middle" font-size="12" font-weight="600" fill="#2D2D2D">Nullable</text>
  <text x="400" y="218" text-anchor="middle" font-size="12" font-weight="600" fill="#2D2D2D">type?</text>

  <!-- YES branch (left) -->
  <text x="290" y="200" font-size="11" font-weight="700" fill="#E53935">YES</text>
  <line x1="310" y1="208" x2="205" y2="208" stroke="#E53935" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <!-- Insert null-check bytecode -->
  <rect x="55" y="190" width="150" height="36" rx="8" fill="#FFEBEE" stroke="#E53935" stroke-width="1" filter="url(#shadow)"/>
  <text x="130" y="210" text-anchor="middle" font-size="11" font-weight="500" fill="#C62828">Require null checks</text>
  <text x="130" y="222" text-anchor="middle" font-size="10" fill="#C62828">(?. ?: !!)</text>
  <line x1="130" y1="226" x2="130" y2="260" stroke="#E53935" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <!-- Platform type decision -->
  <polygon points="130,263 200,290 130,317 60,290" fill="#FFF5EB" stroke="#F7931E" stroke-width="1.2"/>
  <text x="130" y="288" text-anchor="middle" font-size="10" font-weight="600" fill="#2D2D2D">Platform</text>
  <text x="130" y="300" text-anchor="middle" font-size="10" font-weight="600" fill="#2D2D2D">type (T!)?</text>

  <!-- Platform YES -->
  <text x="40" y="282" font-size="10" font-weight="700" fill="#E53935">YES</text>
  <line x1="60" y1="290" x2="15" y2="290" stroke="#E53935" stroke-width="1.2"/>
  <line x1="15" y1="290" x2="15" y2="340" stroke="#E53935" stroke-width="1.2" marker-end="url(#arrowRed)"/>

  <rect x="-45" y="344" width="120" height="46" rx="7" fill="#FFEBEE" stroke="#E53935" stroke-width="1" filter="url(#shadow)"/>
  <text x="15" y="362" text-anchor="middle" font-size="10" font-weight="500" fill="#C62828">Warning /</text>
  <text x="15" y="375" text-anchor="middle" font-size="10" font-weight="500" fill="#C62828">Unchecked cast</text>
  <line x1="75" y1="367" x2="148" y2="367" stroke="#E53935" stroke-width="1.2" marker-end="url(#arrowRed)"/>

  <rect x="148" y="347" width="140" height="40" rx="7" fill="#E53935" filter="url(#shadow)"/>
  <text x="218" y="365" text-anchor="middle" font-size="11" font-weight="600" fill="white">Runtime:</text>
  <text x="218" y="380" text-anchor="middle" font-size="11" font-weight="600" fill="white">NPE possible!</text>

  <!-- Platform NO -->
  <text x="210" y="305" font-size="10" font-weight="700" fill="#2E7D32">NO</text>
  <line x1="200" y1="290" x2="260" y2="290" stroke="#2E7D32" stroke-width="1.2"/>
  <line x1="260" y1="290" x2="260" y2="344" stroke="#2E7D32" stroke-width="1.2"/>
  <rect x="215" y="395" width="140" height="36" rx="7" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1" filter="url(#shadow)"/>
  <text x="285" y="415" text-anchor="middle" font-size="10" font-weight="500" fill="#2E7D32">Compile-time enforced</text>
  <line x1="260" y1="344" x2="260" y2="395" stroke="#2E7D32" stroke-width="1.2" marker-end="url(#arrowGreen)"/>

  <!-- NO branch (right) — Safe -->
  <text x="500" y="200" font-size="11" font-weight="700" fill="#2E7D32">NO</text>
  <line x1="490" y1="208" x2="560" y2="208" stroke="#2E7D32" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <rect x="560" y="190" width="200" height="36" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1" filter="url(#shadow)"/>
  <text x="660" y="213" text-anchor="middle" font-size="12" font-weight="600" fill="#2E7D32">Safe access guaranteed</text>

  <!-- Smart cast branch below -->
  <line x1="660" y1="226" x2="660" y2="265" stroke="#6B57FF" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Smart cast box -->
  <rect x="540" y="268" width="240" height="75" rx="8" fill="#EDE9FF" stroke="#6B57FF" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="660" y="290" text-anchor="middle" font-size="13" font-weight="600" fill="#6B57FF">Smart Cast</text>
  <text x="660" y="308" text-anchor="middle" font-size="11" fill="#2D2D2D">if (x is String) {</text>
  <text x="660" y="322" text-anchor="middle" font-size="11" fill="#6B57FF" font-weight="500">  // x is String here</text>
  <text x="660" y="336" text-anchor="middle" font-size="11" fill="#2D2D2D">}</text>

  <line x1="660" y1="343" x2="660" y2="370" stroke="#6B57FF" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="560" y="373" width="200" height="36" rx="8" fill="#F5F5F5" stroke="#E8E8E8" stroke-width="1" filter="url(#shadow)"/>
  <text x="660" y="396" text-anchor="middle" font-size="12" font-weight="500" fill="#2D2D2D">Narrowed type in scope</text>

  <!-- Legend -->
  <rect x="430" y="420" width="360" height="25" rx="6" fill="#F5F5F5" stroke="#E8E8E8" stroke-width="1"/>
  <circle cx="452" cy="432" r="5" fill="#2E7D32"/>
  <text x="462" y="436" font-size="10" fill="#666">Compile-time safe</text>
  <circle cx="567" cy="432" r="5" fill="#E53935"/>
  <text x="577" y="436" font-size="10" fill="#666">Runtime risk</text>
  <circle cx="660" cy="432" r="5" fill="#6B57FF"/>
  <text x="670" y="436" font-size="10" fill="#666">Smart cast path</text>
</svg>