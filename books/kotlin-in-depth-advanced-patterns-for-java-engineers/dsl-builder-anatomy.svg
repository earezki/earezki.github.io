<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#6B57FF"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#F7931E"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, sans-serif; }
      .code { font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; font-size: 11px; }
    </style>
  </defs>
  <rect width="800" height="400" fill="white"/>

  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#2D2D2D">DSL Builder Anatomy</text>

  <!-- Left: DSL code -->
  <text x="175" y="55" text-anchor="middle" font-size="14" font-weight="600" fill="#6B57FF">DSL Code (What You Write)</text>
  <rect x="25" y="65" width="300" height="220" rx="10" fill="#F5F5F5" stroke="#E8E8E8" stroke-width="1" filter="url(#shadow)"/>
  <text x="45" y="90" class="code" fill="#6B57FF" font-weight="600">html</text><text x="68" y="90" class="code" fill="#2D2D2D"> {</text>
  <text x="55" y="110" class="code" fill="#6B57FF" font-weight="600">  head</text><text x="90" y="110" class="code" fill="#2D2D2D"> {</text>
  <text x="65" y="130" class="code" fill="#6B57FF" font-weight="600">    title</text><text x="100" y="130" class="code" fill="#2D2D2D"> { +"My Page" }</text>
  <text x="55" y="150" class="code" fill="#2D2D2D">  }</text>
  <text x="55" y="170" class="code" fill="#6B57FF" font-weight="600">  body</text><text x="90" y="170" class="code" fill="#2D2D2D"> {</text>
  <text x="65" y="190" class="code" fill="#6B57FF" font-weight="600">    p</text><text x="78" y="190" class="code" fill="#2D2D2D"> {</text>
  <text x="75" y="210" class="code" fill="#2D2D2D">      +"Hello, world!"</text>
  <text x="65" y="230" class="code" fill="#2D2D2D">    }</text>
  <text x="55" y="250" class="code" fill="#2D2D2D">  }</text>
  <text x="45" y="270" class="code" fill="#2D2D2D">}</text>

  <!-- Arrow between columns -->
  <line x1="340" y1="175" x2="460" y2="175" stroke="#6B57FF" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="400" y="165" text-anchor="middle" font-size="11" font-weight="600" fill="#6B57FF">compiles as</text>

  <!-- Right: What compiler sees -->
  <text x="620" y="55" text-anchor="middle" font-size="14" font-weight="600" fill="#F7931E">What the Compiler Sees</text>
  <rect x="465" y="65" width="320" height="220" rx="10" fill="#FFF5EB" stroke="#F7931E" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="485" y="90" class="code" fill="#F7931E" font-weight="600">html(</text><text x="515" y="90" class="code" fill="#2D2D2D">fun <tspan fill="#6B57FF" font-weight="600">HTML</tspan>.() -&gt; Unit</text><text x="690" y="90" class="code" fill="#F7931E">)</text>
  <text x="485" y="115" class="code" fill="#999">// receiver = HTML instance</text>
  <text x="485" y="140" class="code" fill="#2D2D2D">  this.<tspan fill="#F7931E" font-weight="600">head</tspan>(fun <tspan fill="#6B57FF" font-weight="600">Head</tspan>.() -&gt; Unit)</text>
  <text x="485" y="160" class="code" fill="#999">  // receiver = Head instance</text>
  <text x="485" y="185" class="code" fill="#2D2D2D">    this.<tspan fill="#F7931E" font-weight="600">title</tspan>(fun <tspan fill="#6B57FF" font-weight="600">Title</tspan>.() -&gt; Unit)</text>
  <text x="485" y="210" class="code" fill="#2D2D2D">  this.<tspan fill="#F7931E" font-weight="600">body</tspan>(fun <tspan fill="#6B57FF" font-weight="600">Body</tspan>.() -&gt; Unit)</text>
  <text x="485" y="230" class="code" fill="#999">  // receiver = Body instance</text>
  <text x="485" y="255" class="code" fill="#2D2D2D">    this.<tspan fill="#F7931E" font-weight="600">p</tspan>(fun <tspan fill="#6B57FF" font-weight="600">P</tspan>.() -&gt; Unit)</text>

  <!-- Resulting object graph -->
  <text x="400" y="310" text-anchor="middle" font-size="14" font-weight="600" fill="#2D2D2D">Resulting Object Graph</text>
  <rect x="100" y="320" width="600" height="65" rx="10" fill="white" stroke="#E8E8E8" stroke-width="1" filter="url(#shadow)"/>

  <!-- Object nodes -->
  <rect x="120" y="332" width="70" height="30" rx="6" fill="#6B57FF"/>
  <text x="155" y="352" text-anchor="middle" font-size="11" font-weight="600" fill="white">HTML</text>

  <line x1="190" y1="347" x2="225" y2="347" stroke="#6B57FF" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="230" y="332" width="70" height="30" rx="6" fill="#EDE9FF" stroke="#6B57FF" stroke-width="1"/>
  <text x="265" y="352" text-anchor="middle" font-size="11" font-weight="600" fill="#6B57FF">Head</text>

  <line x1="300" y1="347" x2="335" y2="347" stroke="#6B57FF" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="340" y="332" width="70" height="30" rx="6" fill="#EDE9FF" stroke="#6B57FF" stroke-width="1"/>
  <text x="375" y="352" text-anchor="middle" font-size="11" font-weight="600" fill="#6B57FF">Title</text>

  <line x1="190" y1="362" x2="470" y2="370" stroke="#F7931E" stroke-width="1.5" marker-end="url(#arrowOrange)"/>

  <rect x="450" y="332" width="70" height="30" rx="6" fill="#FFF5EB" stroke="#F7931E" stroke-width="1"/>
  <text x="485" y="352" text-anchor="middle" font-size="11" font-weight="600" fill="#F7931E">Body</text>

  <line x1="520" y1="347" x2="555" y2="347" stroke="#F7931E" stroke-width="1.5" marker-end="url(#arrowOrange)"/>

  <rect x="560" y="332" width="50" height="30" rx="6" fill="#FFF5EB" stroke="#F7931E" stroke-width="1"/>
  <text x="585" y="352" text-anchor="middle" font-size="11" font-weight="600" fill="#F7931E">P</text>

  <text x="625" y="352" font-size="11" fill="#2D2D2D">→ "Hello!"</text>

  <!-- Key insight -->
  <text x="400" y="398" text-anchor="middle" font-size="11" fill="#666" font-style="italic">Key: Each { } block is a lambda with a receiver (<tspan fill="#6B57FF" font-weight="600">T.() -&gt; Unit</tspan>) — <tspan font-weight="600">this</tspan> refers to the builder object</text>
</svg>