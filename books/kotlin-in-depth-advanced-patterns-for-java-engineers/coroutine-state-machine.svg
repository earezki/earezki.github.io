<svg xmlns="http://www.w3.org/2000/svg" width="800" height="550" viewBox="0 0 800 550">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#6B57FF"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#F7931E"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, sans-serif; }
      .code { font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; font-size: 11px; }
    </style>
  </defs>
  <rect width="800" height="550" fill="white"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#2D2D2D">Coroutine CPS — State Machine Compilation</text>

  <!-- Source function (left) -->
  <text x="190" y="60" text-anchor="middle" font-size="14" font-weight="600" fill="#6B57FF">Source Code</text>
  <rect x="30" y="70" width="320" height="165" rx="10" fill="#F5F5F5" stroke="#E8E8E8" stroke-width="1" filter="url(#shadow)"/>
  <text x="50" y="95" class="code" fill="#6B57FF" font-weight="600">suspend fun fetchData() {</text>
  <text x="60" y="115" class="code" fill="#2D2D2D">  val a = <tspan fill="#F7931E">suspendA()</tspan>  // point 1</text>
  <text x="60" y="135" class="code" fill="#2D2D2D">  val b = <tspan fill="#F7931E">suspendB(a)</tspan> // point 2</text>
  <text x="60" y="155" class="code" fill="#2D2D2D">  val c = <tspan fill="#F7931E">suspendC(b)</tspan> // point 3</text>
  <text x="60" y="175" class="code" fill="#2D2D2D">  return process(a, b, c)</text>
  <text x="50" y="195" class="code" fill="#6B57FF" font-weight="600">}</text>
  <text x="50" y="225" font-size="11" fill="#F7931E" font-weight="500">● = suspension point</text>

  <!-- Arrow to compiled -->
  <text x="400" y="140" text-anchor="middle" font-size="12" font-weight="600" fill="#6B57FF">compiles to</text>
  <line x1="350" y1="145" x2="448" y2="145" stroke="#6B57FF" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>

  <!-- Compiled state machine (right) -->
  <text x="610" y="60" text-anchor="middle" font-size="14" font-weight="600" fill="#6B57FF">Compiled State Machine</text>
  <rect x="450" y="70" width="330" height="195" rx="10" fill="#EDE9FF" stroke="#6B57FF" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="470" y="95" class="code" fill="#6B57FF" font-weight="600">fun fetchData(cont: Continuation) {</text>
  <text x="480" y="115" class="code" fill="#2D2D2D">  when (<tspan fill="#F7931E" font-weight="600">cont.label</tspan>) {</text>
  <text x="495" y="135" class="code" fill="#2D2D2D">    <tspan fill="#F7931E" font-weight="700">0</tspan> → { /* initial code */ }</text>
  <text x="495" y="155" class="code" fill="#2D2D2D">    <tspan fill="#F7931E" font-weight="700">1</tspan> → { /* after suspendA */ }</text>
  <text x="495" y="175" class="code" fill="#2D2D2D">    <tspan fill="#F7931E" font-weight="700">2</tspan> → { /* after suspendB */ }</text>
  <text x="495" y="195" class="code" fill="#2D2D2D">    <tspan fill="#F7931E" font-weight="700">3</tspan> → { /* after suspendC */ }</text>
  <text x="480" y="215" class="code" fill="#2D2D2D">  }</text>
  <text x="470" y="235" class="code" fill="#2D2D2D">  cont.<tspan fill="#6B57FF">label</tspan>++</text>
  <text x="470" y="255" class="code" fill="#6B57FF" font-weight="600">}</text>

  <!-- State boxes below -->
  <!-- State 0 -->
  <rect x="20" y="290" width="170" height="90" rx="8" fill="white" stroke="#6B57FF" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="20" y="290" width="170" height="26" rx="8" fill="#6B57FF"/>
  <rect x="20" y="305" width="170" height="11" fill="#6B57FF"/>
  <text x="105" y="308" text-anchor="middle" font-size="12" font-weight="700" fill="white">State 0</text>
  <text x="35" y="338" class="code" fill="#2D2D2D">label = 0</text>
  <text x="35" y="355" class="code" fill="#2D2D2D">call suspendA()</text>
  <text x="35" y="372" class="code" fill="#F7931E" font-weight="500">→ SUSPEND</text>

  <!-- State 1 -->
  <rect x="215" y="290" width="170" height="90" rx="8" fill="white" stroke="#6B57FF" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="215" y="290" width="170" height="26" rx="8" fill="#6B57FF"/>
  <rect x="215" y="305" width="170" height="11" fill="#6B57FF"/>
  <text x="300" y="308" text-anchor="middle" font-size="12" font-weight="700" fill="white">State 1</text>
  <text x="230" y="338" class="code" fill="#2D2D2D">a = result</text>
  <text x="230" y="355" class="code" fill="#2D2D2D">call suspendB(a)</text>
  <text x="230" y="372" class="code" fill="#F7931E" font-weight="500">→ SUSPEND</text>

  <!-- State 2 -->
  <rect x="410" y="290" width="170" height="90" rx="8" fill="white" stroke="#6B57FF" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="410" y="290" width="170" height="26" rx="8" fill="#6B57FF"/>
  <rect x="410" y="305" width="170" height="11" fill="#6B57FF"/>
  <text x="495" y="308" text-anchor="middle" font-size="12" font-weight="700" fill="white">State 2</text>
  <text x="425" y="338" class="code" fill="#2D2D2D">b = result</text>
  <text x="425" y="355" class="code" fill="#2D2D2D">call suspendC(b)</text>
  <text x="425" y="372" class="code" fill="#F7931E" font-weight="500">→ SUSPEND</text>

  <!-- State 3 -->
  <rect x="605" y="290" width="170" height="90" rx="8" fill="white" stroke="#2E7D32" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="605" y="290" width="170" height="26" rx="8" fill="#2E7D32"/>
  <rect x="605" y="305" width="170" height="11" fill="#2E7D32"/>
  <text x="690" y="308" text-anchor="middle" font-size="12" font-weight="700" fill="white">State 3</text>
  <text x="620" y="338" class="code" fill="#2D2D2D">c = result</text>
  <text x="620" y="355" class="code" fill="#2D2D2D">process(a, b, c)</text>
  <text x="620" y="372" class="code" fill="#2E7D32" font-weight="600">→ RETURN</text>

  <!-- Arrows between states -->
  <path d="M 190 345 Q 203 410 215 345" fill="none" stroke="#F7931E" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="203" y="420" text-anchor="middle" font-size="9" font-weight="600" fill="#F7931E">suspend</text>
  <text x="203" y="432" text-anchor="middle" font-size="9" font-weight="600" fill="#F7931E">→ resume</text>

  <path d="M 385 345 Q 398 410 410 345" fill="none" stroke="#F7931E" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="398" y="420" text-anchor="middle" font-size="9" font-weight="600" fill="#F7931E">suspend</text>
  <text x="398" y="432" text-anchor="middle" font-size="9" font-weight="600" fill="#F7931E">→ resume</text>

  <path d="M 580 345 Q 593 410 605 345" fill="none" stroke="#F7931E" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="593" y="420" text-anchor="middle" font-size="9" font-weight="600" fill="#F7931E">suspend</text>
  <text x="593" y="432" text-anchor="middle" font-size="9" font-weight="600" fill="#F7931E">→ resume</text>

  <!-- Continuation object -->
  <rect x="145" y="460" width="510" height="70" rx="10" fill="#FFF5EB" stroke="#F7931E" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="485" text-anchor="middle" font-size="13" font-weight="700" fill="#F7931E">Continuation Object</text>
  <text x="230" y="505" text-anchor="middle" font-size="11" fill="#2D2D2D"><tspan font-weight="600">label:</tspan> Int</text>
  <text x="340" y="505" text-anchor="middle" font-size="11" fill="#2D2D2D"><tspan font-weight="600">result:</tspan> Any?</text>
  <text x="460" y="505" text-anchor="middle" font-size="11" fill="#2D2D2D"><tspan font-weight="600">a, b, c:</tspan> saved locals</text>
  <text x="580" y="505" text-anchor="middle" font-size="11" fill="#2D2D2D"><tspan font-weight="600">resumeWith()</tspan></text>
  <text x="400" y="522" text-anchor="middle" font-size="10" fill="#666" font-style="italic">All state preserved in a single Continuation object — no stack frame needed</text>
</svg>