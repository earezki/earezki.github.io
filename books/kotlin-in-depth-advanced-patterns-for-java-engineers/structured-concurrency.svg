<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#2E7D32"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#E53935"/>
    </marker>
    <marker id="arrowRedUp" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto-start-reverse">
      <polygon points="0,0 8,3 0,6" fill="#E53935"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, sans-serif; }
    </style>
  </defs>
  <rect width="800" height="450" fill="white"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#2D2D2D">Structured Concurrency — Scope Tree &amp; Cancellation</text>

  <!-- runBlocking (root) -->
  <rect x="300" y="50" width="200" height="42" rx="10" fill="#6B57FF" filter="url(#shadow)"/>
  <text x="400" y="77" text-anchor="middle" font-size="14" font-weight="700" fill="white">runBlocking</text>

  <!-- Line down to coroutineScope -->
  <line x1="400" y1="92" x2="400" y2="118" stroke="#2E7D32" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- coroutineScope -->
  <rect x="280" y="120" width="240" height="42" rx="10" fill="#EDE9FF" stroke="#6B57FF" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="147" text-anchor="middle" font-size="14" font-weight="600" fill="#6B57FF">coroutineScope { }</text>

  <!-- Three children branches -->
  <!-- Left: launch (success) -->
  <line x1="320" y1="162" x2="160" y2="200" stroke="#2E7D32" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <rect x="75" y="202" width="170" height="40" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="160" y="227" text-anchor="middle" font-size="13" font-weight="600" fill="#2E7D32">launch { work1 }</text>

  <!-- Success indicator -->
  <line x1="160" y1="242" x2="160" y2="280" stroke="#2E7D32" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <rect x="105" y="282" width="110" height="30" rx="7" fill="#2E7D32" filter="url(#shadow)"/>
  <text x="160" y="302" text-anchor="middle" font-size="12" font-weight="600" fill="white">✓ Completed</text>

  <!-- Center: launch (FAILS) -->
  <line x1="400" y1="162" x2="400" y2="200" stroke="#E53935" stroke-width="2" marker-end="url(#arrowRed)"/>
  <rect x="315" y="202" width="170" height="40" rx="8" fill="#FFEBEE" stroke="#E53935" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="227" text-anchor="middle" font-size="13" font-weight="600" fill="#E53935">launch { work2 }</text>

  <!-- Failure explosion -->
  <line x1="400" y1="242" x2="400" y2="275" stroke="#E53935" stroke-width="2" marker-end="url(#arrowRed)"/>
  <rect x="340" y="278" width="120" height="32" rx="7" fill="#E53935" filter="url(#shadow)"/>
  <text x="400" y="300" text-anchor="middle" font-size="12" font-weight="700" fill="white">✗ Exception!</text>

  <!-- Right: async (cancelled) -->
  <line x1="480" y1="162" x2="640" y2="200" stroke="#2E7D32" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <rect x="555" y="202" width="170" height="40" rx="8" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="640" y="227" text-anchor="middle" font-size="13" font-weight="600" fill="#2E7D32">async { work3 }</text>

  <!-- Gets cancelled -->
  <line x1="640" y1="242" x2="640" y2="280" stroke="#E53935" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowRed)"/>
  <rect x="575" y="282" width="130" height="30" rx="7" fill="#FFEBEE" stroke="#E53935" stroke-width="1" filter="url(#shadow)"/>
  <text x="640" y="302" text-anchor="middle" font-size="12" font-weight="600" fill="#E53935">✗ Cancelled</text>

  <!-- Cancellation propagation UP from failed child to scope -->
  <path d="M 400 278 Q 460 260 470 180 Q 470 155 420 145" fill="none" stroke="#E53935" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#arrowRed)"/>
  <text x="495" y="218" font-size="10" font-weight="700" fill="#E53935" transform="rotate(-60 495 218)">propagates UP</text>

  <!-- Cancellation propagation DOWN from scope to sibling -->
  <path d="M 500 150 Q 580 170 600 200" fill="none" stroke="#E53935" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#arrowRed)"/>
  <text x="565" y="168" font-size="10" font-weight="700" fill="#E53935">cancels DOWN</text>

  <!-- Explanation boxes at bottom -->
  <rect x="40" y="340" width="340" height="95" rx="10" fill="#F5F5F5" stroke="#E8E8E8" stroke-width="1" filter="url(#shadow)"/>
  <text x="210" y="365" text-anchor="middle" font-size="13" font-weight="700" fill="#2D2D2D">Structured Concurrency Rules</text>
  <text x="60" y="385" font-size="11" fill="#2D2D2D">1. A scope waits for <tspan font-weight="600">all</tspan> children to complete</text>
  <text x="60" y="402" font-size="11" fill="#2D2D2D">2. A child failure <tspan fill="#E53935" font-weight="600">cancels the scope</tspan></text>
  <text x="60" y="419" font-size="11" fill="#2D2D2D">3. Scope cancellation <tspan fill="#E53935" font-weight="600">cancels all siblings</tspan></text>

  <!-- Legend -->
  <rect x="420" y="340" width="350" height="95" rx="10" fill="#F5F5F5" stroke="#E8E8E8" stroke-width="1" filter="url(#shadow)"/>
  <text x="595" y="365" text-anchor="middle" font-size="13" font-weight="700" fill="#2D2D2D">Propagation Flow</text>
  <line x1="440" y1="382" x2="490" y2="382" stroke="#2E7D32" stroke-width="2.5"/>
  <text x="500" y="386" font-size="11" fill="#666">Normal execution (success path)</text>
  <line x1="440" y1="402" x2="490" y2="402" stroke="#E53935" stroke-width="2.5"/>
  <text x="500" y="406" font-size="11" fill="#666">Exception throws (failure)</text>
  <line x1="440" y1="422" x2="490" y2="422" stroke="#E53935" stroke-width="2.5" stroke-dasharray="5,3"/>
  <text x="500" y="426" font-size="11" fill="#666">Cancellation propagation</text>
</svg>