<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="1" dy="2" stdDeviation="2.5" flood-color="#94a3b8" flood-opacity="0.18"/>
    </filter>
    <style>
      .step { animation: stepIn 0.45s ease both; }
      .step:nth-of-type(1)  { animation-delay: 0.0s; }
      .step:nth-of-type(2)  { animation-delay: 0.3s; }
      .step:nth-of-type(3)  { animation-delay: 0.6s; }
      .step:nth-of-type(4)  { animation-delay: 0.9s; }
      .step:nth-of-type(5)  { animation-delay: 1.2s; }
      @keyframes stepIn {
        from { opacity: 0; transform: translateX(-16px); }
        to   { opacity: 1; transform: translateX(0); }
      }
    </style>
  </defs>

  <!-- Page background -->
  <rect width="860" height="540" rx="14" fill="url(#pageBg)"/>

  <text x="430" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">Rolling Update Strategy (maxSurge=1, maxUnavailable=0)</text>
  <text x="430" y="48" text-anchor="middle" font-size="12" fill="#64748b">Deployment: replicas=3, updating v1 → v2</text>

  <!-- Step 1 -->
  <g class="step">
    <rect x="14" y="60" width="110" height="46" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="69" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">Step 1</text>
    <text x="69" y="96" text-anchor="middle" font-size="10" fill="#64748b">Initial state</text>
    <rect x="134" y="63" width="100" height="38" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.3"/>
    <text x="184" y="87" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">v1 ✓</text>
    <rect x="248" y="63" width="100" height="38" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.3"/>
    <text x="298" y="87" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">v1 ✓</text>
    <rect x="362" y="63" width="100" height="38" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.3"/>
    <text x="412" y="87" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">v1 ✓</text>
    <rect x="490" y="63" width="355" height="38" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="667" y="87" text-anchor="middle" font-size="11" fill="#64748b">Running: 3/3 · Available: 3/3</text>
  </g>

  <!-- Connector 1→2 -->
  <line x1="69" y1="112" x2="69" y2="148" stroke="#94a3b8" stroke-width="1.2"/>
  <polygon points="65,145 73,145 69,152" fill="#94a3b8"/>

  <!-- Step 2 -->
  <g class="step">
    <rect x="14" y="155" width="110" height="46" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="69" y="175" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">Step 2</text>
    <text x="69" y="191" text-anchor="middle" font-size="10" fill="#14532d">+1 v2 surge</text>
    <rect x="134" y="158" width="100" height="38" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.3"/>
    <text x="184" y="182" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">v1 ✓</text>
    <rect x="248" y="158" width="100" height="38" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.3"/>
    <text x="298" y="182" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">v1 ✓</text>
    <rect x="362" y="158" width="100" height="38" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.3"/>
    <text x="412" y="182" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">v1 ✓</text>
    <rect x="476" y="158" width="100" height="38" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="526" y="182" text-anchor="middle" font-size="12" font-weight="600" fill="#15803d">v2 ⟳</text>
    <rect x="600" y="158" width="245" height="38" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="722" y="182" text-anchor="middle" font-size="11" fill="#16a34a">Running: 4/3 (surge) · v2 starting</text>
  </g>

  <!-- Connector 2→3 -->
  <line x1="69" y1="207" x2="69" y2="243" stroke="#94a3b8" stroke-width="1.2"/>
  <polygon points="65,240 73,240 69,247" fill="#94a3b8"/>

  <!-- Step 3 -->
  <g class="step">
    <rect x="14" y="250" width="110" height="46" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="69" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">Step 3</text>
    <text x="69" y="286" text-anchor="middle" font-size="10" fill="#dc2626">Remove 1st v1</text>
    <rect x="134" y="253" width="100" height="38" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.3" stroke-dasharray="5,3"/>
    <text x="184" y="277" text-anchor="middle" font-size="12" font-weight="600" fill="#dc2626">v1 ✗</text>
    <rect x="248" y="253" width="100" height="38" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.3"/>
    <text x="298" y="277" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">v1 ✓</text>
    <rect x="362" y="253" width="100" height="38" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.3"/>
    <text x="412" y="277" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">v1 ✓</text>
    <rect x="476" y="253" width="100" height="38" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
    <text x="526" y="277" text-anchor="middle" font-size="12" font-weight="600" fill="#15803d">v2 ✓</text>
    <rect x="600" y="253" width="245" height="38" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="722" y="277" text-anchor="middle" font-size="11" fill="#64748b">Running: 3/3 · 1 v2 ready</text>
  </g>

  <!-- Connector 3→4 -->
  <line x1="69" y1="302" x2="69" y2="338" stroke="#94a3b8" stroke-width="1.2"/>
  <polygon points="65,335 73,335 69,342" fill="#94a3b8"/>

  <!-- Step 4 -->
  <g class="step">
    <rect x="14" y="345" width="110" height="46" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="69" y="365" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">Step 4</text>
    <text x="69" y="381" text-anchor="middle" font-size="10" fill="#dc2626">Remove 2nd v1</text>
    <rect x="134" y="348" width="100" height="38" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.3" stroke-dasharray="5,3"/>
    <text x="184" y="372" text-anchor="middle" font-size="12" font-weight="600" fill="#dc2626">v1 ✗</text>
    <rect x="248" y="348" width="100" height="38" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.3"/>
    <text x="298" y="372" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">v1 ✓</text>
    <rect x="362" y="348" width="100" height="38" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
    <text x="412" y="372" text-anchor="middle" font-size="12" font-weight="600" fill="#15803d">v2 ✓</text>
    <rect x="476" y="348" width="100" height="38" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="526" y="372" text-anchor="middle" font-size="12" font-weight="600" fill="#15803d">v2 ⟳</text>
    <rect x="600" y="348" width="245" height="38" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="722" y="372" text-anchor="middle" font-size="11" fill="#64748b">Running: 3/3 · 2 v2 ready</text>
  </g>

  <!-- Connector 4→5 -->
  <line x1="69" y1="397" x2="69" y2="433" stroke="#94a3b8" stroke-width="1.2"/>
  <polygon points="65,430 73,430 69,437" fill="#94a3b8"/>

  <!-- Step 5 -->
  <g class="step">
    <rect x="14" y="440" width="110" height="46" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="69" y="460" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">Step 5</text>
    <text x="69" y="476" text-anchor="middle" font-size="10" fill="#15803d">Complete ✓</text>
    <rect x="134" y="443" width="100" height="38" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
    <text x="184" y="467" text-anchor="middle" font-size="12" font-weight="600" fill="#15803d">v2 ✓</text>
    <rect x="248" y="443" width="100" height="38" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
    <text x="298" y="467" text-anchor="middle" font-size="12" font-weight="600" fill="#15803d">v2 ✓</text>
    <rect x="362" y="443" width="100" height="38" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
    <text x="412" y="467" text-anchor="middle" font-size="12" font-weight="600" fill="#15803d">v2 ✓</text>
    <rect x="476" y="443" width="369" height="38" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="660" y="467" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">Complete: 3/3 v2 running ✓</text>
  </g>

  <!-- Legend -->
  <rect x="14" y="498" width="832" height="32" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="28" y="508" width="14" height="12" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="48" y="519" font-size="10" fill="#475569">Old (v1)</text>
  <rect x="110" y="508" width="14" height="12" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="130" y="519" font-size="10" fill="#475569">New (v2)</text>
  <rect x="210" y="508" width="14" height="12" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="230" y="519" font-size="10" fill="#475569">Terminating</text>
  <text x="780" y="519" font-size="10" font-style="italic" fill="#64748b">⟳ = starting up</text>
</svg>