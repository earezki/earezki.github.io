<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 450" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="1" dy="2" stdDeviation="2.5" flood-color="#94a3b8" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6366f1"/>
    </marker>
  </defs>

  <!-- Page background -->
  <rect width="860" height="450" rx="14" fill="url(#pageBg)"/>
  <text x="430" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">ConfigMap and Secret Consumption Paths</text>

  <!-- ConfigMap source -->
  <rect x="18" y="50" width="208" height="136" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="122" y="74" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">ConfigMap</text>
  <rect x="36" y="84" width="172" height="82" rx="7" fill="#fff" stroke="#93c5fd" stroke-width="1"/>
  <text x="50" y="103" font-size="10" fill="#475569" font-family="monospace">DB_HOST: postgres</text>
  <text x="50" y="119" font-size="10" fill="#475569" font-family="monospace">DB_PORT: "5432"</text>
  <text x="50" y="135" font-size="10" fill="#475569" font-family="monospace">LOG_LEVEL: info</text>
  <text x="50" y="151" font-size="10" fill="#475569" font-family="monospace">app.conf: |  ...</text>

  <!-- Secret source -->
  <rect x="18" y="216" width="208" height="136" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="122" y="240" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc2626">Secret</text>
  <rect x="36" y="250" width="172" height="82" rx="7" fill="#fff" stroke="#fca5a5" stroke-width="1"/>
  <text x="50" y="269" font-size="10" fill="#475569" font-family="monospace">DB_PASSWORD: ****</text>
  <text x="50" y="285" font-size="10" fill="#475569" font-family="monospace">API_KEY: ****</text>
  <text x="50" y="301" font-size="9" fill="#64748b">(base64 encoded in YAML)</text>
  <text x="50" y="317" font-size="9" fill="#64748b">(stored in etcd, opt. encrypted)</text>

  <!-- Method 1: envFrom -->
  <rect x="306" y="50" width="228" height="90" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="420" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">Method 1: envFrom</text>
  <text x="420" y="94" text-anchor="middle" font-size="10" fill="#475569">All keys → env vars (bulk)</text>
  <text x="420" y="111" text-anchor="middle" font-size="10" fill="#64748b" font-family="monospace">envFrom: configMapRef</text>
  <text x="420" y="128" text-anchor="middle" font-size="9" font-weight="600" fill="#16a34a">Quick, all-or-nothing</text>

  <line x1="226" y1="91" x2="306" y2="80" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Method 2: valueFrom -->
  <rect x="306" y="164" width="228" height="90" rx="10" fill="#fdf4ff" stroke="#a855f7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="420" y="188" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c3aed">Method 2: valueFrom</text>
  <text x="420" y="208" text-anchor="middle" font-size="10" fill="#475569">Specific key → named env var</text>
  <text x="420" y="225" text-anchor="middle" font-size="10" fill="#64748b" font-family="monospace">env: secretKeyRef</text>
  <text x="420" y="242" text-anchor="middle" font-size="9" font-weight="600" fill="#7c3aed">Selective, rename keys</text>

  <line x1="226" y1="143" x2="306" y2="188" stroke="#3b82f6" stroke-width="1.2"/>
  <line x1="226" y1="280" x2="306" y2="200" stroke="#ef4444" stroke-width="1.2"/>

  <!-- Method 3: Volume -->
  <rect x="306" y="278" width="228" height="100" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="420" y="302" text-anchor="middle" font-size="13" font-weight="bold" fill="#d97706">Method 3: Volume</text>
  <text x="420" y="322" text-anchor="middle" font-size="10" fill="#475569">Keys → files in directory</text>
  <text x="420" y="339" text-anchor="middle" font-size="10" fill="#64748b" font-family="monospace">volumeMounts + volumes</text>
  <text x="420" y="356" text-anchor="middle" font-size="9" font-weight="600" fill="#d97706">Auto-updates on ConfigMap change!</text>
  <text x="420" y="370" text-anchor="middle" font-size="9" fill="#64748b">/etc/config/DB_HOST → file</text>

  <line x1="226" y1="160" x2="306" y2="318" stroke="#3b82f6" stroke-width="1.2"/>
  <line x1="226" y1="316" x2="306" y2="326" stroke="#ef4444" stroke-width="1.2"/>

  <!-- Pod consuming -->
  <rect x="610" y="50" width="232" height="330" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="726" y="74" text-anchor="middle" font-size="14" font-weight="bold" fill="#854d0e">Pod</text>
  <rect x="626" y="84" width="200" height="226" rx="8" fill="#fff" stroke="#ca8a04" stroke-width="1"/>
  <text x="726" y="104" text-anchor="middle" font-size="12" font-weight="600" fill="#854d0e">Container</text>
  <!-- Env vars section -->
  <rect x="640" y="116" width="172" height="76" rx="5" fill="#f0fdf4" stroke="#16a34a" stroke-width="0.9"/>
  <text x="726" y="134" text-anchor="middle" font-size="10" font-weight="600" fill="#15803d">Environment Variables</text>
  <text x="648" y="151" font-size="9" fill="#475569" font-family="monospace">DB_HOST=postgres</text>
  <text x="648" y="165" font-size="9" fill="#475569" font-family="monospace">DB_PASSWORD=s3cret</text>
  <text x="648" y="179" font-size="9" fill="#475569" font-family="monospace">LOG_LEVEL=info</text>
  <!-- Volume mount section -->
  <rect x="640" y="202" width="172" height="96" rx="5" fill="#fffbeb" stroke="#f59e0b" stroke-width="0.9"/>
  <text x="726" y="220" text-anchor="middle" font-size="10" font-weight="600" fill="#d97706">Volume Mount</text>
  <text x="648" y="237" font-size="9" fill="#475569" font-family="monospace">/etc/config/</text>
  <text x="648" y="251" font-size="9" fill="#475569" font-family="monospace">  ├── DB_HOST</text>
  <text x="648" y="265" font-size="9" fill="#475569" font-family="monospace">  ├── DB_PORT</text>
  <text x="648" y="279" font-size="9" fill="#475569" font-family="monospace">  └── app.conf</text>

  <!-- Arrows to Pod -->
  <line x1="534" y1="90" x2="610" y2="165" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="534" y1="209" x2="610" y2="225" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="534" y1="325" x2="610" y2="300" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Warning bar -->
  <rect x="18" y="398" width="824" height="38" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="430" y="415" text-anchor="middle" font-size="11" font-weight="600" fill="#dc2626">⚠ Env vars do NOT update when ConfigMap changes — restart the Pod.</text>
  <text x="430" y="430" text-anchor="middle" font-size="10" fill="#64748b">Volume mounts update automatically (with propagation delay ~60s). Never store sensitive data in ConfigMap.</text>
</svg>