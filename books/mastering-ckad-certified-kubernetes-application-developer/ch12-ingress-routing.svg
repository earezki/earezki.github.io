<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="1" dy="2" stdDeviation="2.5" flood-color="#94a3b8" flood-opacity="0.18"/>
    </filter>
    <marker id="arrowIndigo" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6366f1"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#16a34a"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#a855f7"/>
    </marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f59e0b"/>
    </marker>
    <style>
      .svc-group { animation: riseIn 0.4s ease both; }
      .svc-group:nth-of-type(1) { animation-delay: 0.8s; }
      .svc-group:nth-of-type(2) { animation-delay: 1.0s; }
      .svc-group:nth-of-type(3) { animation-delay: 1.2s; }
      @keyframes riseIn {
        from { opacity: 0; transform: translateY(14px); }
        to   { opacity: 1; transform: translateY(0); }
      }
    </style>
  </defs>

  <!-- Page background -->
  <rect width="820" height="460" rx="14" fill="url(#pageBg)"/>
  <text x="410" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">Ingress Routing: Path-Based and Host-Based</text>

  <!-- External Client -->
  <rect x="310" y="46" width="200" height="46" rx="10" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="410" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#be185d">External Client</text>

  <line x1="410" y1="92" x2="410" y2="114" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrowIndigo)"/>
  <text x="460" y="107" font-size="10" fill="#64748b">HTTPS :443</text>

  <!-- Ingress Controller -->
  <rect x="200" y="118" width="420" height="72" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="410" y="141" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">Ingress Controller (NGINX)</text>
  <text x="410" y="159" text-anchor="middle" font-size="10" fill="#475569">TLS Termination → Route by host + path → Backend Service</text>
  <text x="410" y="176" text-anchor="middle" font-size="9" font-style="italic" fill="#64748b">Deployed as a Pod, watches Ingress resources via API Server</text>

  <!-- Ingress Rules panel -->
  <rect x="95" y="204" width="630" height="44" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="410" y="224" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">Ingress Rules</text>
  <text x="410" y="240" text-anchor="middle" font-size="10" fill="#64748b">host: app.example.com · /api/* → api-svc · /web/* → web-svc · / → default-svc</text>

  <!-- Routing arrows -->
  <line x1="184" y1="248" x2="112" y2="290" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="110" y="274" font-size="10" fill="#16a34a">/api/*</text>
  <line x1="410" y1="248" x2="410" y2="290" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
  <text x="426" y="276" font-size="10" fill="#a855f7">/web/*</text>
  <line x1="636" y1="248" x2="710" y2="290" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowAmber)"/>
  <text x="688" y="274" font-size="10" fill="#f59e0b">/ (default)</text>

  <!-- ── api-svc group ── -->
  <g class="svc-group">
    <rect x="26" y="294" width="186" height="50" rx="22" fill="#16a34a" stroke="#15803d" stroke-width="1.2"/>
    <text x="119" y="316" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">api-svc:80</text>
    <text x="119" y="333" text-anchor="middle" font-size="9" fill="#dcfce7">ClusterIP</text>
    <!-- lines to pods -->
    <line x1="74" y1="344" x2="55" y2="370" stroke="#16a34a" stroke-width="1"/>
    <line x1="119" y1="344" x2="119" y2="370" stroke="#16a34a" stroke-width="1"/>
    <line x1="164" y1="344" x2="183" y2="370" stroke="#16a34a" stroke-width="1"/>
    <!-- pods -->
    <rect x="26" y="372" width="54" height="36" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="0.9"/>
    <text x="53" y="394" text-anchor="middle" font-size="9" fill="#15803d">api-1</text>
    <rect x="92" y="372" width="54" height="36" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="0.9"/>
    <text x="119" y="394" text-anchor="middle" font-size="9" fill="#15803d">api-2</text>
    <rect x="158" y="372" width="54" height="36" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="0.9"/>
    <text x="185" y="394" text-anchor="middle" font-size="9" fill="#15803d">api-3</text>
  </g>

  <!-- ── web-svc group ── -->
  <g class="svc-group">
    <rect x="314" y="294" width="192" height="50" rx="22" fill="#a855f7" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="410" y="316" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">web-svc:80</text>
    <text x="410" y="333" text-anchor="middle" font-size="9" fill="#e9d5ff">ClusterIP</text>
    <!-- lines to pods -->
    <line x1="368" y1="344" x2="358" y2="370" stroke="#a855f7" stroke-width="1"/>
    <line x1="452" y1="344" x2="462" y2="370" stroke="#a855f7" stroke-width="1"/>
    <!-- pods -->
    <rect x="328" y="372" width="54" height="36" rx="6" fill="#f3e8ff" stroke="#a855f7" stroke-width="0.9"/>
    <text x="355" y="394" text-anchor="middle" font-size="9" fill="#7c3aed">web-1</text>
    <rect x="428" y="372" width="54" height="36" rx="6" fill="#f3e8ff" stroke="#a855f7" stroke-width="0.9"/>
    <text x="455" y="394" text-anchor="middle" font-size="9" fill="#7c3aed">web-2</text>
  </g>

  <!-- ── default-svc group ── -->
  <g class="svc-group">
    <rect x="612" y="294" width="190" height="50" rx="22" fill="#f59e0b" stroke="#d97706" stroke-width="1.2"/>
    <text x="707" y="316" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">default-svc:80</text>
    <text x="707" y="333" text-anchor="middle" font-size="9" fill="#fef3c7">ClusterIP</text>
    <!-- line to pod -->
    <line x1="707" y1="344" x2="707" y2="370" stroke="#f59e0b" stroke-width="1"/>
    <!-- pod -->
    <rect x="680" y="372" width="54" height="36" rx="6" fill="#fef9c3" stroke="#f59e0b" stroke-width="0.9"/>
    <text x="707" y="394" text-anchor="middle" font-size="9" fill="#d97706">app-1</text>
  </g>

  <!-- note bar -->
  <rect x="26" y="420" width="768" height="28" rx="7" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="410" y="438" text-anchor="middle" font-size="10" fill="#475569">
    <tspan font-weight="600">TLS:</tspan> create Secret type kubernetes.io/tls, reference in Ingress tls[].secretName
  </text>
</svg>