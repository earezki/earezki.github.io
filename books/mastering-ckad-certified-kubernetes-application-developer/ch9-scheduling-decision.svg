<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="1" dy="2" stdDeviation="2.5" flood-color="#94a3b8" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6366f1"/>
    </marker>
    <style>
      .filter-pill { animation: popIn 0.35s cubic-bezier(.34,1.56,.64,1) both; }
      .filter-pill:nth-of-type(1) { animation-delay: 0.55s; }
      .filter-pill:nth-of-type(2) { animation-delay: 0.70s; }
      .filter-pill:nth-of-type(3) { animation-delay: 0.85s; }
      .filter-pill:nth-of-type(4) { animation-delay: 1.00s; }
      .filter-pill:nth-of-type(5) { animation-delay: 1.15s; }
      .score-pill { animation: popIn 0.35s cubic-bezier(.34,1.56,.64,1) both; }
      .score-pill:nth-of-type(1) { animation-delay: 1.50s; }
      .score-pill:nth-of-type(2) { animation-delay: 1.65s; }
      .score-pill:nth-of-type(3) { animation-delay: 1.80s; }
      .score-pill:nth-of-type(4) { animation-delay: 1.95s; }
      .score-pill:nth-of-type(5) { animation-delay: 2.10s; }
      @keyframes popIn {
        from { opacity: 0; transform: scale(0.7); }
        to   { opacity: 1; transform: scale(1); }
      }
    </style>
  </defs>

  <!-- Page background -->
  <rect width="820" height="500" rx="14" fill="url(#pageBg)"/>
  <text x="410" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">Kubernetes Scheduling Decision Flow</text>

  <!-- Unscheduled Pod -->
  <rect x="310" y="46" width="200" height="50" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="410" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#854d0e">Unscheduled Pod</text>

  <line x1="410" y1="96" x2="410" y2="122" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- kube-scheduler box -->
  <rect x="310" y="126" width="200" height="42" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="410" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">kube-scheduler</text>

  <line x1="410" y1="168" x2="410" y2="190" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Filtering Phase -->
  <rect x="28" y="194" width="764" height="115" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="410" y="218" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc2626">Phase 1: Filtering — Eliminate unsuitable nodes</text>

  <g class="filter-pill">
    <rect x="44" y="232" width="135" height="50" rx="7" fill="#fff" stroke="#ef4444" stroke-width="1"/>
    <text x="111" y="253" text-anchor="middle" font-size="10" font-weight="600" fill="#dc2626">Resource Fit?</text>
    <text x="111" y="269" text-anchor="middle" font-size="9" fill="#64748b">CPU / memory requests</text>
  </g>
  <g class="filter-pill">
    <rect x="192" y="232" width="135" height="50" rx="7" fill="#fff" stroke="#ef4444" stroke-width="1"/>
    <text x="259" y="253" text-anchor="middle" font-size="10" font-weight="600" fill="#dc2626">Taints OK?</text>
    <text x="259" y="269" text-anchor="middle" font-size="9" fill="#64748b">Pod tolerates taints?</text>
  </g>
  <g class="filter-pill">
    <rect x="340" y="232" width="135" height="50" rx="7" fill="#fff" stroke="#ef4444" stroke-width="1"/>
    <text x="407" y="253" text-anchor="middle" font-size="10" font-weight="600" fill="#dc2626">nodeSelector?</text>
    <text x="407" y="269" text-anchor="middle" font-size="9" fill="#64748b">Labels match?</text>
  </g>
  <g class="filter-pill">
    <rect x="488" y="232" width="135" height="50" rx="7" fill="#fff" stroke="#ef4444" stroke-width="1"/>
    <text x="555" y="253" text-anchor="middle" font-size="10" font-weight="600" fill="#dc2626">Node Affinity?</text>
    <text x="555" y="269" text-anchor="middle" font-size="9" fill="#64748b">required rules match?</text>
  </g>
  <g class="filter-pill">
    <rect x="636" y="232" width="145" height="50" rx="7" fill="#fff" stroke="#ef4444" stroke-width="1"/>
    <text x="708" y="253" text-anchor="middle" font-size="10" font-weight="600" fill="#dc2626">Port Available?</text>
    <text x="708" y="269" text-anchor="middle" font-size="9" fill="#64748b">hostPort conflicts?</text>
  </g>

  <line x1="410" y1="309" x2="410" y2="330" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="450" y="324" font-size="10" fill="#16a34a">Remaining nodes pass →</text>

  <!-- Scoring Phase -->
  <rect x="28" y="334" width="764" height="115" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="410" y="357" text-anchor="middle" font-size="14" font-weight="bold" fill="#15803d">Phase 2: Scoring — Rank surviving nodes (0-100)</text>

  <g class="score-pill">
    <rect x="44" y="370" width="140" height="50" rx="7" fill="#fff" stroke="#16a34a" stroke-width="1"/>
    <text x="114" y="392" text-anchor="middle" font-size="10" font-weight="600" fill="#15803d">LeastRequested</text>
    <text x="114" y="408" text-anchor="middle" font-size="9" fill="#64748b">Most free resources</text>
  </g>
  <g class="score-pill">
    <rect x="196" y="370" width="140" height="50" rx="7" fill="#fff" stroke="#16a34a" stroke-width="1"/>
    <text x="266" y="392" text-anchor="middle" font-size="10" font-weight="600" fill="#15803d">Pod Affinity</text>
    <text x="266" y="408" text-anchor="middle" font-size="9" fill="#64748b">preferred rules</text>
  </g>
  <g class="score-pill">
    <rect x="348" y="370" width="140" height="50" rx="7" fill="#fff" stroke="#16a34a" stroke-width="1"/>
    <text x="418" y="392" text-anchor="middle" font-size="10" font-weight="600" fill="#15803d">Topology Spread</text>
    <text x="418" y="408" text-anchor="middle" font-size="9" fill="#64748b">Balance across zones</text>
  </g>
  <g class="score-pill">
    <rect x="500" y="370" width="140" height="50" rx="7" fill="#fff" stroke="#16a34a" stroke-width="1"/>
    <text x="570" y="392" text-anchor="middle" font-size="10" font-weight="600" fill="#15803d">Node Affinity</text>
    <text x="570" y="408" text-anchor="middle" font-size="9" fill="#64748b">preferred rules</text>
  </g>
  <g class="score-pill">
    <rect x="652" y="370" width="130" height="50" rx="7" fill="#fff" stroke="#16a34a" stroke-width="1"/>
    <text x="717" y="392" text-anchor="middle" font-size="10" font-weight="600" fill="#15803d">Image Locality</text>
    <text x="717" y="408" text-anchor="middle" font-size="9" fill="#64748b">Already cached?</text>
  </g>

  <line x1="410" y1="449" x2="410" y2="466" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Result -->
  <rect x="300" y="470" width="220" height="22" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="410" y="485" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">Best Node Selected ✓</text>
</svg>