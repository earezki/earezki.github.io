<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 545" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="1" dy="2" stdDeviation="2.5" flood-color="#94a3b8" flood-opacity="0.18"/>
    </filter>
    <marker id="arrowDark" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
    </marker>
    <style>
      .probe-box { animation: probeAppear 0.5s ease both; }
      .probe-box:nth-of-type(1) { animation-delay: 0.0s; }
      .probe-box:nth-of-type(2) { animation-delay: 0.4s; }
      .probe-box:nth-of-type(3) { animation-delay: 0.8s; }
      .mech-box { animation: fadeUp 0.4s ease both; }
      .mech-box:nth-of-type(1) { animation-delay: 1.1s; }
      .mech-box:nth-of-type(2) { animation-delay: 1.25s; }
      .mech-box:nth-of-type(3) { animation-delay: 1.40s; }
      .mech-box:nth-of-type(4) { animation-delay: 1.55s; }
      @keyframes probeAppear {
        from { opacity: 0; transform: scale(0.88) translateY(10px); }
        to   { opacity: 1; transform: scale(1) translateY(0); }
      }
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(12px); }
        to   { opacity: 1; transform: translateY(0); }
      }
    </style>
  </defs>

  <!-- Page background -->
  <rect width="860" height="545" rx="14" fill="url(#pageBg)"/>
  <text x="430" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">Probe Types and Pod Lifecycle</text>

  <!-- Timeline bar -->
  <rect x="78" y="52" width="728" height="8" rx="4" fill="#e2e8f0"/>
  <rect x="78" y="52" width="728" height="8" rx="4" fill="url(#timelineGrad)"/>
  <text x="78" y="46" text-anchor="middle" font-size="10" fill="#64748b">Container Start</text>
  <text x="806" y="46" text-anchor="middle" font-size="10" fill="#64748b">Running</text>

  <!-- ── Startup Probe ── -->
  <g class="probe-box">
    <rect x="78" y="70" width="248" height="118" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="202" y="93" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc2626">Startup Probe</text>
    <text x="202" y="113" text-anchor="middle" font-size="11" fill="#475569">Is the app started yet?</text>
    <text x="202" y="133" text-anchor="middle" font-size="10" fill="#64748b">failureThreshold × periodSeconds</text>
    <text x="202" y="148" text-anchor="middle" font-size="10" fill="#64748b">= total startup budget</text>
    <rect x="92" y="158" width="92" height="17" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="0.9"/>
    <text x="138" y="170" text-anchor="middle" font-size="9" fill="#15803d">Pass → enable others</text>
    <rect x="193" y="158" width="118" height="17" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="0.9"/>
    <text x="252" y="170" text-anchor="middle" font-size="9" fill="#dc2626">Fail → kill + restart</text>
  </g>

  <!-- Arrow startup → liveness -->
  <line x1="326" y1="126" x2="366" y2="126" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowDark)"/>
  <text x="346" y="118" text-anchor="middle" font-size="9" fill="#16a34a">Pass</text>

  <!-- ── Liveness Probe ── -->
  <g class="probe-box">
    <rect x="370" y="70" width="230" height="118" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="485" y="93" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">Liveness Probe</text>
    <text x="485" y="113" text-anchor="middle" font-size="11" fill="#475569">Is the app still alive?</text>
    <text x="485" y="133" text-anchor="middle" font-size="10" fill="#64748b">Runs continuously after</text>
    <text x="485" y="148" text-anchor="middle" font-size="10" fill="#64748b">startup probe clears</text>
    <rect x="384" y="158" width="84" height="17" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="0.9"/>
    <text x="426" y="170" text-anchor="middle" font-size="9" fill="#15803d">Pass → alive</text>
    <rect x="480" y="158" width="106" height="17" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="0.9"/>
    <text x="533" y="170" text-anchor="middle" font-size="9" fill="#dc2626">Fail → restart</text>
  </g>

  <!-- ── Readiness Probe ── -->
  <g class="probe-box">
    <rect x="614" y="70" width="232" height="118" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="730" y="93" text-anchor="middle" font-size="14" font-weight="bold" fill="#15803d">Readiness Probe</text>
    <text x="730" y="113" text-anchor="middle" font-size="11" fill="#475569">Can it handle traffic?</text>
    <text x="730" y="133" text-anchor="middle" font-size="10" fill="#64748b">Controls Service endpoint</text>
    <text x="730" y="148" text-anchor="middle" font-size="10" fill="#64748b">membership (in/out)</text>
    <rect x="626" y="158" width="98" height="17" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="0.9"/>
    <text x="675" y="170" text-anchor="middle" font-size="9" fill="#15803d">Pass → in SVC</text>
    <rect x="734" y="158" width="100" height="17" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="0.9"/>
    <text x="784" y="170" text-anchor="middle" font-size="9" fill="#854d0e">Fail → out of SVC</text>
  </g>

  <!-- ── Mechanisms ── -->
  <text x="430" y="220" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Probe Mechanisms</text>

  <g class="mech-box">
    <rect x="48" y="234" width="185" height="106" rx="10" fill="#fff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="140" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">httpGet</text>
    <text x="140" y="278" text-anchor="middle" font-size="10" fill="#475569">HTTP GET request</text>
    <text x="140" y="294" text-anchor="middle" font-size="10" fill="#475569">200 ≤ code &lt; 400 = success</text>
    <rect x="60" y="304" width="164" height="28" rx="5" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="142" y="322" text-anchor="middle" font-size="9" font-style="italic" fill="#1e40af">path: /healthz, port: 8080</text>
  </g>

  <g class="mech-box">
    <rect x="250" y="234" width="185" height="106" rx="10" fill="#fff" stroke="#16a34a" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="342" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">exec</text>
    <text x="342" y="278" text-anchor="middle" font-size="10" fill="#475569">Run command in container</text>
    <text x="342" y="294" text-anchor="middle" font-size="10" fill="#475569">Exit code 0 = success</text>
    <rect x="262" y="304" width="164" height="28" rx="5" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="344" y="322" text-anchor="middle" font-size="9" font-style="italic" fill="#15803d">command: [cat, /tmp/ready]</text>
  </g>

  <g class="mech-box">
    <rect x="452" y="234" width="185" height="106" rx="10" fill="#fff" stroke="#a855f7" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="544" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c3aed">tcpSocket</text>
    <text x="544" y="278" text-anchor="middle" font-size="10" fill="#475569">TCP connection attempt</text>
    <text x="544" y="294" text-anchor="middle" font-size="10" fill="#475569">Opens = success</text>
    <rect x="464" y="304" width="164" height="28" rx="5" fill="#fdf4ff" stroke="#e9d5ff" stroke-width="1"/>
    <text x="546" y="322" text-anchor="middle" font-size="9" font-style="italic" fill="#7c3aed">port: 5432</text>
  </g>

  <g class="mech-box">
    <rect x="654" y="234" width="160" height="106" rx="10" fill="#fff" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="734" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#d97706">grpc</text>
    <text x="734" y="278" text-anchor="middle" font-size="10" fill="#475569">gRPC health check</text>
    <text x="734" y="294" text-anchor="middle" font-size="10" fill="#475569">SERVING = success</text>
    <rect x="664" y="304" width="140" height="28" rx="5" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
    <text x="734" y="322" text-anchor="middle" font-size="9" font-style="italic" fill="#d97706">port: 50051</text>
  </g>

  <!-- Key Parameters -->
  <rect x="30" y="358" width="800" height="172" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="430" y="382" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Key Configuration Parameters</text>

  <text x="56" y="408" font-size="11" font-weight="600" fill="#475569">initialDelaySeconds</text>
  <text x="252" y="408" font-size="11" fill="#64748b">Wait before first probe (default: 0). Too low → CrashLoopBackOff.</text>

  <text x="56" y="428" font-size="11" font-weight="600" fill="#475569">periodSeconds</text>
  <text x="252" y="428" font-size="11" fill="#64748b">Interval between probes (default: 10s)</text>

  <text x="56" y="448" font-size="11" font-weight="600" fill="#475569">failureThreshold</text>
  <text x="252" y="448" font-size="11" fill="#64748b">Consecutive failures before action (default: 3)</text>

  <text x="56" y="468" font-size="11" font-weight="600" fill="#475569">successThreshold</text>
  <text x="252" y="468" font-size="11" fill="#64748b">Consecutive successes to pass (default: 1; readiness often 2+)</text>

  <text x="56" y="488" font-size="11" font-weight="600" fill="#475569">timeoutSeconds</text>
  <text x="252" y="488" font-size="11" fill="#64748b">Max response wait (default: 1s)</text>

  <!-- Move to bottom right (with 30px margin from right and bottom) -->
  <rect x="530" y="470" width="300" height="60" rx="7" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="680" y="485" text-anchor="middle" font-size="11" font-weight="700" fill="#dc2626">Common exam trap:</text>
  <text x="680" y="501" text-anchor="middle" font-size="10" fill="#64748b">initialDelaySeconds too short → probe fails before app is</text>
  <text x="680" y="516" text-anchor="middle" font-size="10" fill="#64748b">ready → CrashLoopBackOff. Use startupProbe to decouple.</text>
</svg>