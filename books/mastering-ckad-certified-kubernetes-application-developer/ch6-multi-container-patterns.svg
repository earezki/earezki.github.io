<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="1" dy="2" stdDeviation="2.5" flood-color="#94a3b8" flood-opacity="0.18"/>
    </filter>
    <style>
      .pattern-card { animation: fadeUp 0.5s ease both; }
      .pattern-card:nth-child(2) { animation-delay: 0.05s; }
      .pattern-card:nth-child(3) { animation-delay: 0.2s; }
      .pattern-card:nth-child(4) { animation-delay: 0.35s; }
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(12px); }
        to   { opacity: 1; transform: translateY(0); }
      }
    </style>
  </defs>

  <!-- Page background -->
  <rect width="900" height="500" rx="14" fill="url(#pageBg)"/>
  <text x="450" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">Multi-Container Pod Patterns</text>

  <!-- === SIDECAR === -->
  <g class="pattern-card">
    <rect x="20" y="52" width="275" height="422" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="157" y="78" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">Sidecar</text>
    <!-- Pod boundary -->
    <rect x="35" y="92" width="245" height="255" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.2"/>
    <text x="157" y="111" text-anchor="middle" font-size="11" font-weight="600" fill="#854d0e">Pod</text>
    <!-- App container -->
    <rect x="50" y="122" width="105" height="68" rx="7" fill="#fff" stroke="#3b82f6" stroke-width="1.3"/>
    <text x="102" y="149" text-anchor="middle" font-weight="600" font-size="12" fill="#1e40af">App</text>
    <text x="102" y="166" text-anchor="middle" font-size="9" fill="#64748b">main container</text>
    <!-- Sidecar container -->
    <rect x="165" y="122" width="105" height="68" rx="7" fill="#fff" stroke="#8b5cf6" stroke-width="1.3"/>
    <text x="217" y="145" text-anchor="middle" font-weight="600" font-size="12" fill="#6d28d9">Log Shipper</text>
    <text x="217" y="163" text-anchor="middle" font-size="9" fill="#64748b">sidecar</text>
    <!-- Shared volume -->
    <rect x="60" y="210" width="200" height="36" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1"/>
    <text x="160" y="233" text-anchor="middle" font-size="11" fill="#4338ca">Shared Volume: /var/log</text>
    <!-- Arrows to volume -->
    <line x1="102" y1="190" x2="102" y2="210" stroke="#6366f1" stroke-width="1.3"/>
    <polygon points="98,208 106,208 102,215" fill="#6366f1"/>
    <line x1="217" y1="190" x2="217" y2="210" stroke="#6366f1" stroke-width="1.3"/>
    <polygon points="213,208 221,208 217,215" fill="#6366f1"/>
    <!-- Shared network -->
    <rect x="60" y="256" width="200" height="32" rx="6" fill="#fce7f3" stroke="#ec4899" stroke-width="1"/>
    <text x="160" y="277" text-anchor="middle" font-size="11" fill="#be185d">localhost network</text>
    <!-- Description -->
    <rect x="35" y="358" width="245" height="106" rx="8" fill="#fff" stroke="#dbeafe" stroke-width="1"/>
    <text x="157" y="378" text-anchor="middle" font-size="10" fill="#475569">Extends the main container</text>
    <text x="157" y="394" text-anchor="middle" font-size="10" fill="#475569">with auxiliary functionality.</text>
    <text x="157" y="410" text-anchor="middle" font-size="10" fill="#475569">Shares volumes and network.</text>
    <text x="157" y="432" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af">Use: logging, sync, proxy</text>
    <text x="157" y="450" text-anchor="middle" font-size="9" font-style="italic" fill="#64748b">e.g. Envoy, Fluentd</text>
  </g>

  <!-- === AMBASSADOR === -->
  <g class="pattern-card">
    <rect x="313" y="52" width="275" height="422" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="450" y="78" text-anchor="middle" font-size="15" font-weight="bold" fill="#15803d">Ambassador</text>
    <!-- Pod boundary -->
    <rect x="328" y="92" width="245" height="255" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.2"/>
    <text x="450" y="111" text-anchor="middle" font-size="11" font-weight="600" fill="#854d0e">Pod</text>
    <!-- App container -->
    <rect x="343" y="122" width="105" height="68" rx="7" fill="#fff" stroke="#16a34a" stroke-width="1.3"/>
    <text x="395" y="145" text-anchor="middle" font-weight="600" font-size="12" fill="#15803d">App</text>
    <text x="395" y="163" text-anchor="middle" font-size="9" fill="#64748b">→ localhost:6379</text>
    <!-- Ambassador container -->
    <rect x="458" y="122" width="105" height="68" rx="7" fill="#fff" stroke="#f59e0b" stroke-width="1.3"/>
    <text x="510" y="145" text-anchor="middle" font-weight="600" font-size="12" fill="#d97706">Proxy</text>
    <text x="510" y="163" text-anchor="middle" font-size="9" fill="#64748b">ambassador</text>
    <!-- Arrow between containers -->
    <line x1="448" y1="155" x2="458" y2="155" stroke="#16a34a" stroke-width="1.5"/>
    <polygon points="455,151 455,159 462,155" fill="#16a34a"/>
    <!-- External service -->
    <rect x="390" y="220" width="155" height="42" rx="7" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
    <text x="467" y="238" text-anchor="middle" font-size="10" fill="#dc2626">External Redis Cluster</text>
    <text x="467" y="254" text-anchor="middle" font-size="9" fill="#dc2626">redis-primary:6379</text>
    <!-- Arrow to external -->
    <line x1="510" y1="190" x2="510" y2="220" stroke="#f59e0b" stroke-width="1.3"/>
    <polygon points="506,218 514,218 510,225" fill="#f59e0b"/>
    <!-- localhost line -->
    <rect x="343" y="280" width="230" height="30" rx="6" fill="#fce7f3" stroke="#ec4899" stroke-width="1"/>
    <text x="458" y="300" text-anchor="middle" font-size="11" fill="#be185d">localhost network</text>
    <!-- Description -->
    <rect x="328" y="358" width="245" height="106" rx="8" fill="#fff" stroke="#dcfce7" stroke-width="1"/>
    <text x="450" y="378" text-anchor="middle" font-size="10" fill="#475569">Proxies network connections</text>
    <text x="450" y="394" text-anchor="middle" font-size="10" fill="#475569">to external services. App talks</text>
    <text x="450" y="410" text-anchor="middle" font-size="10" fill="#475569">to localhost; proxy routes out.</text>
    <text x="450" y="432" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d">Use: DB proxy, API gateway</text>
    <text x="450" y="450" text-anchor="middle" font-size="9" font-style="italic" fill="#64748b">e.g. Redis Twemproxy</text>
  </g>

  <!-- === ADAPTER === -->
  <g class="pattern-card">
    <rect x="606" y="52" width="275" height="422" rx="12" fill="#fdf4ff" stroke="#a855f7" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="743" y="78" text-anchor="middle" font-size="15" font-weight="bold" fill="#7c3aed">Adapter</text>
    <!-- Pod boundary -->
    <rect x="621" y="92" width="245" height="255" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.2"/>
    <text x="743" y="111" text-anchor="middle" font-size="11" font-weight="600" fill="#854d0e">Pod</text>
    <!-- App container -->
    <rect x="636" y="122" width="105" height="68" rx="7" fill="#fff" stroke="#a855f7" stroke-width="1.3"/>
    <text x="688" y="145" text-anchor="middle" font-weight="600" font-size="12" fill="#7c3aed">App</text>
    <text x="688" y="163" text-anchor="middle" font-size="9" fill="#64748b">custom metrics</text>
    <!-- Adapter container -->
    <rect x="751" y="122" width="105" height="68" rx="7" fill="#fff" stroke="#ec4899" stroke-width="1.3"/>
    <text x="803" y="145" text-anchor="middle" font-weight="600" font-size="12" fill="#be185d">Transformer</text>
    <text x="803" y="163" text-anchor="middle" font-size="9" fill="#64748b">adapter</text>
    <!-- Shared volume -->
    <rect x="643" y="210" width="200" height="36" rx="6" fill="#f3e8ff" stroke="#a855f7" stroke-width="1"/>
    <text x="743" y="233" text-anchor="middle" font-size="11" fill="#7c3aed">Shared: /metrics/raw</text>
    <!-- Arrows to volume -->
    <line x1="688" y1="190" x2="688" y2="210" stroke="#a855f7" stroke-width="1.3"/>
    <polygon points="684,208 692,208 688,215" fill="#a855f7"/>
    <line x1="803" y1="190" x2="803" y2="210" stroke="#a855f7" stroke-width="1.3"/>
    <polygon points="799,208 807,208 803,215" fill="#a855f7"/>
    <!-- Standardised output -->
    <rect x="690" y="260" width="140" height="32" rx="6" fill="#d1fae5" stroke="#16a34a" stroke-width="1"/>
    <text x="760" y="280" text-anchor="middle" font-size="10" fill="#15803d">Prometheus format</text>
    <!-- Arrow from adapter to output -->
    <line x1="803" y1="246" x2="803" y2="260" stroke="#16a34a" stroke-width="1.3"/>
    <polygon points="799,258 807,258 803,265" fill="#16a34a"/>
    <!-- localhost line -->
    <rect x="636" y="304" width="230" height="30" rx="6" fill="#fce7f3" stroke="#ec4899" stroke-width="1"/>
    <text x="751" y="324" text-anchor="middle" font-size="11" fill="#be185d">localhost network</text>
    <!-- Description -->
    <rect x="621" y="358" width="245" height="106" rx="8" fill="#fff" stroke="#f3e8ff" stroke-width="1"/>
    <text x="743" y="378" text-anchor="middle" font-size="10" fill="#475569">Transforms output from the</text>
    <text x="743" y="394" text-anchor="middle" font-size="10" fill="#475569">main container into a standard</text>
    <text x="743" y="410" text-anchor="middle" font-size="10" fill="#475569">format for external consumers.</text>
    <text x="743" y="432" text-anchor="middle" font-size="10" font-weight="700" fill="#7c3aed">Use: metrics, log transform</text>
    <text x="743" y="450" text-anchor="middle" font-size="9" font-style="italic" fill="#64748b">e.g. Prometheus exporter</text>
  </g>
</svg>