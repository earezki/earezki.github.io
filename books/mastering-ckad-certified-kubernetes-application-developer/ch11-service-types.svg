<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="1" dy="2" stdDeviation="2.5" flood-color="#94a3b8" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Page background -->
  <rect width="900" height="580" rx="14" fill="url(#pageBg)"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">Kubernetes Service Types</text>

  <!-- ── ClusterIP ── -->
  <rect x="18" y="50" width="276" height="508" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="156" y="76" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">ClusterIP</text>
  <text x="156" y="94" text-anchor="middle" font-size="10" fill="#64748b">Internal cluster access only</text>
  <!-- Client pod -->
  <rect x="88" y="108" width="136" height="38" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1"/>
  <text x="156" y="132" text-anchor="middle" font-size="11" font-weight="600" fill="#854d0e">Client Pod</text>
  <!-- Arrow -->
  <line x1="156" y1="146" x2="156" y2="178" stroke="#3b82f6" stroke-width="1.5"/>
  <polygon points="152,175 160,175 156,183" fill="#3b82f6"/>
  <text x="198" y="167" font-size="9" fill="#3b82f6">my-svc:80</text>
  <!-- Service pill -->
  <rect x="48" y="184" width="216" height="44" rx="22" fill="#3b82f6" stroke="#1e40af" stroke-width="1.2"/>
  <text x="156" y="205" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">ClusterIP: 10.96.0.42</text>
  <text x="156" y="221" text-anchor="middle" font-size="9" fill="#dbeafe">port: 80 → targetPort: 8080</text>
  <!-- kube-proxy -->
  <rect x="78" y="238" width="155" height="28" rx="4" fill="#e0e7ff" stroke="#6366f1" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="156" y="257" text-anchor="middle" font-size="10" fill="#4338ca">kube-proxy / iptables</text>
  <!-- Lines to pods -->
  <line x1="108" y1="266" x2="80" y2="294" stroke="#3b82f6" stroke-width="1"/>
  <line x1="156" y1="266" x2="156" y2="294" stroke="#3b82f6" stroke-width="1"/>
  <line x1="204" y1="266" x2="232" y2="294" stroke="#3b82f6" stroke-width="1"/>
  <!-- Backend pods -->
  <rect x="38" y="294" width="72" height="44" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="74" y="311" text-anchor="middle" font-size="10" font-weight="600" fill="#15803d">Pod 1</text>
  <text x="74" y="327" text-anchor="middle" font-size="9" fill="#64748b">:8080</text>
  <rect x="120" y="294" width="72" height="44" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="156" y="311" text-anchor="middle" font-size="10" font-weight="600" fill="#15803d">Pod 2</text>
  <text x="156" y="327" text-anchor="middle" font-size="9" fill="#64748b">:8080</text>
  <rect x="202" y="294" width="72" height="44" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="238" y="311" text-anchor="middle" font-size="10" font-weight="600" fill="#15803d">Pod 3</text>
  <text x="238" y="327" text-anchor="middle" font-size="9" fill="#64748b">:8080</text>
  <!-- DNS box -->
  <rect x="48" y="354" width="216" height="55" rx="7" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="156" y="374" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">DNS Resolution</text>
  <text x="156" y="389" text-anchor="middle" font-size="9" fill="#64748b">my-svc.default.svc</text>
  <text x="156" y="403" text-anchor="middle" font-size="9" fill="#64748b">.cluster.local → 10.96.0.42</text>
  <!-- Notes -->
  <rect x="38" y="424" width="236" height="122" rx="7" fill="#fff" stroke="#dbeafe" stroke-width="1"/>
  <text x="156" y="446" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af">Default type · Most common</text>
  <text x="156" y="464" text-anchor="middle" font-size="10" fill="#475569">Only accessible inside the cluster.</text>
  <text x="156" y="480" text-anchor="middle" font-size="10" fill="#475569">Ideal for microservice comms.</text>
  <text x="156" y="498" text-anchor="middle" font-size="10" fill="#475569">Stable virtual IP assigned by K8s.</text>
  <text x="156" y="514" text-anchor="middle" font-size="9" font-style="italic" fill="#64748b">kubectl expose deploy … --type=ClusterIP</text>
  <text x="156" y="530" text-anchor="middle" font-size="9" font-style="italic" fill="#64748b">type omitted → defaults to ClusterIP</text>

  <!-- ── NodePort ── -->
  <rect x="312" y="50" width="276" height="508" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="76" text-anchor="middle" font-size="15" font-weight="bold" fill="#15803d">NodePort</text>
  <text x="450" y="94" text-anchor="middle" font-size="10" fill="#64748b">External via node IP + port</text>
  <!-- External client -->
  <rect x="376" y="108" width="148" height="38" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1"/>
  <text x="450" y="132" text-anchor="middle" font-size="11" font-weight="600" fill="#be185d">External Client</text>
  <!-- Arrow -->
  <line x1="450" y1="146" x2="450" y2="178" stroke="#16a34a" stroke-width="1.5"/>
  <polygon points="446,175 454,175 450,183" fill="#16a34a"/>
  <text x="508" y="167" font-size="9" fill="#16a34a">&lt;NodeIP&gt;:30080</text>
  <!-- Node boundary -->
  <rect x="326" y="184" width="248" height="44" rx="8" fill="#fff" stroke="#16a34a" stroke-width="1.2"/>
  <text x="450" y="203" text-anchor="middle" font-size="11" font-weight="600" fill="#15803d">Any Worker Node</text>
  <text x="450" y="219" text-anchor="middle" font-size="9" fill="#64748b">NodePort: 30080 (30000–32767)</text>
  <!-- Arrow to service -->
  <line x1="450" y1="228" x2="450" y2="254" stroke="#16a34a" stroke-width="1.5"/>
  <polygon points="446,251 454,251 450,259" fill="#16a34a"/>
  <!-- Service pill -->
  <rect x="336" y="260" width="228" height="44" rx="22" fill="#16a34a" stroke="#15803d" stroke-width="1.2"/>
  <text x="450" y="280" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">ClusterIP: 10.96.0.42</text>
  <text x="450" y="296" text-anchor="middle" font-size="9" fill="#dcfce7">port: 80 → targetPort: 8080</text>
  <!-- Lines to pods -->
  <line x1="412" y1="304" x2="382" y2="332" stroke="#16a34a" stroke-width="1"/>
  <line x1="450" y1="304" x2="450" y2="332" stroke="#16a34a" stroke-width="1"/>
  <line x1="488" y1="304" x2="518" y2="332" stroke="#16a34a" stroke-width="1"/>
  <!-- Backend pods -->
  <rect x="340" y="332" width="68" height="40" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="374" y="357" text-anchor="middle" font-size="10" fill="#15803d">Pod 1</text>
  <rect x="416" y="332" width="68" height="40" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="450" y="357" text-anchor="middle" font-size="10" fill="#15803d">Pod 2</text>
  <rect x="492" y="332" width="68" height="40" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="526" y="357" text-anchor="middle" font-size="10" fill="#15803d">Pod 3</text>
  <!-- Notes -->
  <rect x="332" y="390" width="236" height="156" rx="7" fill="#fff" stroke="#dcfce7" stroke-width="1"/>
  <text x="450" y="412" text-anchor="middle" font-size="10" font-weight="700" fill="#15803d">Extends ClusterIP</text>
  <text x="450" y="430" text-anchor="middle" font-size="10" fill="#475569">Opens port on every node.</text>
  <text x="450" y="446" text-anchor="middle" font-size="10" fill="#475569">Range: 30000–32767.</text>
  <text x="450" y="462" text-anchor="middle" font-size="10" fill="#475569">Fine for dev/testing.</text>
  <text x="450" y="478" text-anchor="middle" font-size="10" fill="#b45309">Avoid in production — exposes</text>
  <text x="450" y="494" text-anchor="middle" font-size="10" fill="#b45309">node IP directly.</text>
  <text x="450" y="514" text-anchor="middle" font-size="9" font-style="italic" fill="#64748b">--type=NodePort</text>
  <text x="450" y="530" text-anchor="middle" font-size="9" font-style="italic" fill="#64748b">--node-port=30080 (optional)</text>

  <!-- ── LoadBalancer ── -->
  <rect x="606" y="50" width="276" height="508" rx="12" fill="#fdf4ff" stroke="#a855f7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="744" y="76" text-anchor="middle" font-size="15" font-weight="bold" fill="#7c3aed">LoadBalancer</text>
  <text x="744" y="94" text-anchor="middle" font-size="10" fill="#64748b">Cloud provider external IP</text>
  <!-- External client -->
  <rect x="670" y="108" width="148" height="38" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1"/>
  <text x="744" y="132" text-anchor="middle" font-size="11" font-weight="600" fill="#be185d">External Client</text>
  <!-- Arrow -->
  <line x1="744" y1="146" x2="744" y2="172" stroke="#a855f7" stroke-width="1.5"/>
  <polygon points="740,169 748,169 744,177" fill="#a855f7"/>
  <!-- Cloud LB box -->
  <rect x="630" y="178" width="228" height="46" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="744" y="198" text-anchor="middle" font-size="11" font-weight="600" fill="#7c3aed">Cloud Load Balancer</text>
  <text x="744" y="215" text-anchor="middle" font-size="9" fill="#7c3aed">External IP: 34.120.5.12</text>
  <!-- Arrow to nodeport layer -->
  <line x1="744" y1="224" x2="744" y2="250" stroke="#a855f7" stroke-width="1.5"/>
  <polygon points="740,247 748,247 744,255" fill="#a855f7"/>
  <!-- NodePort layer -->
  <rect x="640" y="256" width="208" height="28" rx="4" fill="#e0e7ff" stroke="#6366f1" stroke-width="1"/>
  <text x="744" y="275" text-anchor="middle" font-size="10" fill="#4338ca">NodePort (auto-assigned)</text>
  <!-- Arrow to clusterip -->
  <line x1="744" y1="284" x2="744" y2="302" stroke="#a855f7" stroke-width="1.2"/>
  <polygon points="740,299 748,299 744,307" fill="#a855f7"/>
  <!-- Service pill -->
  <rect x="630" y="308" width="228" height="44" rx="22" fill="#a855f7" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="744" y="328" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">ClusterIP: 10.96.0.42</text>
  <text x="744" y="344" text-anchor="middle" font-size="9" fill="#e9d5ff">port: 80 → targetPort: 8080</text>
  <!-- Lines to pods -->
  <line x1="710" y1="352" x2="688" y2="378" stroke="#a855f7" stroke-width="1"/>
  <line x1="744" y1="352" x2="744" y2="378" stroke="#a855f7" stroke-width="1"/>
  <line x1="778" y1="352" x2="800" y2="378" stroke="#a855f7" stroke-width="1"/>
  <!-- Backend pods -->
  <rect x="650" y="378" width="64" height="38" rx="7" fill="#f3e8ff" stroke="#a855f7" stroke-width="1"/>
  <text x="682" y="402" text-anchor="middle" font-size="10" fill="#7c3aed">Pod 1</text>
  <rect x="712" y="378" width="64" height="38" rx="7" fill="#f3e8ff" stroke="#a855f7" stroke-width="1"/>
  <text x="744" y="402" text-anchor="middle" font-size="10" fill="#7c3aed">Pod 2</text>
  <rect x="774" y="378" width="64" height="38" rx="7" fill="#f3e8ff" stroke="#a855f7" stroke-width="1"/>
  <text x="806" y="402" text-anchor="middle" font-size="10" fill="#7c3aed">Pod 3</text>
  <!-- Notes -->
  <rect x="626" y="430" width="236" height="116" rx="7" fill="#fff" stroke="#f3e8ff" stroke-width="1"/>
  <text x="744" y="452" text-anchor="middle" font-size="10" font-weight="700" fill="#7c3aed">Extends NodePort</text>
  <text x="744" y="470" text-anchor="middle" font-size="10" fill="#475569">Provisions cloud LB (AWS/GCP/AZ).</text>
  <text x="744" y="486" text-anchor="middle" font-size="10" fill="#475569">External IP assigned automatically.</text>
  <text x="744" y="502" text-anchor="middle" font-size="10" fill="#475569">Production-grade ingress traffic.</text>
  <text x="744" y="520" text-anchor="middle" font-size="9" font-style="italic" fill="#64748b">--type=LoadBalancer</text>
  <text x="744" y="534" text-anchor="middle" font-size="9" font-style="italic" fill="#64748b">Not available without cloud provider</text>
</svg>