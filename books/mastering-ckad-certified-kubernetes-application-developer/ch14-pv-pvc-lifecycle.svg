<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="1" dy="2" stdDeviation="2.5" flood-color="#94a3b8" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6366f1"/>
    </marker>
    <style>
      .phase { animation: slideRight 0.45s ease both; }
      .phase:nth-of-type(1) { animation-delay: 0.0s; }
      .phase:nth-of-type(2) { animation-delay: 0.35s; }
      .phase:nth-of-type(3) { animation-delay: 0.7s; }
      .phase:nth-of-type(4) { animation-delay: 1.05s; }
      @keyframes slideRight {
        from { opacity: 0; transform: translateX(-18px); }
        to   { opacity: 1; transform: translateX(0); }
      }
    </style>
  </defs>

  <!-- Page background -->
  <rect width="850" height="420" rx="14" fill="url(#pageBg)"/>
  <text x="425" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">PersistentVolume / PersistentVolumeClaim Lifecycle</text>

  <!-- ── Phase 1: Provision ── -->
  <g class="phase">
    <rect x="18" y="50" width="195" height="130" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="115" y="74" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">1. Provision</text>
    <rect x="32" y="86" width="78" height="36" rx="7" fill="#fff" stroke="#3b82f6" stroke-width="1"/>
    <text x="71" y="99" text-anchor="middle" font-size="10" fill="#1e40af">Static PV</text>
    <text x="71" y="113" text-anchor="middle" font-size="9" fill="#64748b">admin-created</text>
    <rect x="120" y="86" width="82" height="36" rx="7" fill="#fff" stroke="#3b82f6" stroke-width="1"/>
    <text x="161" y="99" text-anchor="middle" font-size="10" fill="#1e40af">Dynamic</text>
    <text x="161" y="113" text-anchor="middle" font-size="9" fill="#64748b">StorageClass</text>
    <text x="115" y="152" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">Status: Available</text>
    <text x="115" y="168" text-anchor="middle" font-size="9" fill="#64748b">PV exists, no claim yet</text>
  </g>

  <!-- Arrow 1→2 -->
  <line x1="213" y1="115" x2="250" y2="115" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── Phase 2: Bind ── -->
  <g class="phase">
    <rect x="254" y="50" width="193" height="130" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="350" y="74" text-anchor="middle" font-size="14" font-weight="bold" fill="#15803d">2. Bind</text>
    <rect x="268" y="86" width="72" height="40" rx="7" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
    <text x="304" y="110" text-anchor="middle" font-size="10" fill="#1e40af">PVC</text>
    <text x="350" y="112" text-anchor="middle" font-size="16" fill="#16a34a">↔</text>
    <rect x="367" y="86" width="72" height="40" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="403" y="110" text-anchor="middle" font-size="10" fill="#15803d">PV</text>
    <text x="350" y="152" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">Status: Bound</text>
    <text x="350" y="168" text-anchor="middle" font-size="9" fill="#64748b">1:1 exclusive mapping</text>
  </g>

  <!-- Arrow 2→3 -->
  <line x1="447" y1="115" x2="484" y2="115" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── Phase 3: Use ── -->
  <g class="phase">
    <rect x="488" y="50" width="174" height="130" rx="10" fill="#fdf4ff" stroke="#a855f7" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="575" y="74" text-anchor="middle" font-size="14" font-weight="bold" fill="#7c3aed">3. Use</text>
    <rect x="503" y="86" width="144" height="58" rx="7" fill="#fff" stroke="#a855f7" stroke-width="1"/>
    <text x="575" y="105" text-anchor="middle" font-size="10" fill="#7c3aed">Pod mounts PVC</text>
    <text x="575" y="121" text-anchor="middle" font-size="9" fill="#64748b">volumeMounts:</text>
    <text x="575" y="135" text-anchor="middle" font-size="9" fill="#64748b">  mountPath: /data</text>
    <text x="575" y="162" text-anchor="middle" font-size="10" fill="#475569">Pod reads / writes</text>
    <text x="575" y="177" text-anchor="middle" font-size="9" fill="#64748b">data persists across restarts</text>
  </g>

  <!-- Arrow 3→4 -->
  <line x1="662" y1="115" x2="697" y2="115" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── Phase 4: Reclaim ── -->
  <g class="phase">
    <rect x="701" y="50" width="135" height="130" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="768" y="74" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc2626">4. Reclaim</text>
    <rect x="716" y="88" width="104" height="26" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="768" y="105" text-anchor="middle" font-size="10" font-weight="600" fill="#15803d">Retain</text>
    <text x="768" y="118" text-anchor="middle" font-size="9" fill="#64748b">data preserved</text>
    <rect x="716" y="120" width="104" height="26" rx="5" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
    <text x="768" y="137" text-anchor="middle" font-size="10" font-weight="600" fill="#dc2626">Delete</text>
    <text x="768" y="150" text-anchor="middle" font-size="9" fill="#64748b">data + PV removed</text>
    <text x="768" y="172" text-anchor="middle" font-size="10" fill="#475569">Status: Released</text>
  </g>

  <!-- Access Modes section -->
  <rect x="18" y="202" width="814" height="76" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="425" y="224" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">Access Modes</text>
  <rect x="40" y="236" width="210" height="30" rx="7" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="145" y="256" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">RWO — ReadWriteOnce</text>
  <rect x="272" y="236" width="210" height="30" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="377" y="256" text-anchor="middle" font-size="11" font-weight="600" fill="#15803d">ROX — ReadOnlyMany</text>
  <rect x="504" y="236" width="210" height="30" rx="7" fill="#f3e8ff" stroke="#a855f7" stroke-width="1"/>
  <text x="609" y="256" text-anchor="middle" font-size="11" font-weight="600" fill="#7c3aed">RWX — ReadWriteMany</text>
  <rect x="726" y="236" width="94" height="30" rx="7" fill="#fef9c3" stroke="#ca8a04" stroke-width="1"/>
  <text x="773" y="256" text-anchor="middle" font-size="10" font-weight="600" fill="#854d0e">RWOP</text>

  <!-- Dynamic Provisioning Flow -->
  <rect x="18" y="296" width="814" height="108" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="425" y="320" text-anchor="middle" font-size="14" font-weight="bold" fill="#d97706">Dynamic Provisioning Flow (StorageClass)</text>

  <rect x="38" y="334" width="148" height="54" rx="8" fill="#fff" stroke="#f59e0b" stroke-width="1"/>
  <text x="112" y="356" text-anchor="middle" font-size="11" font-weight="600" fill="#d97706">1. PVC Created</text>
  <text x="112" y="373" text-anchor="middle" font-size="9" fill="#64748b">storageClassName: fast</text>
  <text x="112" y="387" text-anchor="middle" font-size="9" fill="#64748b">storage: 10Gi</text>

  <line x1="186" y1="361" x2="218" y2="361" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="222" y="334" width="155" height="54" rx="8" fill="#fff" stroke="#f59e0b" stroke-width="1"/>
  <text x="299" y="356" text-anchor="middle" font-size="11" font-weight="600" fill="#d97706">2. SC Matched</text>
  <text x="299" y="373" text-anchor="middle" font-size="9" fill="#64748b">Provisioner called</text>
  <text x="299" y="387" text-anchor="middle" font-size="9" fill="#64748b">e.g. EBS / GCE-PD</text>

  <line x1="377" y1="361" x2="409" y2="361" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="413" y="334" width="155" height="54" rx="8" fill="#fff" stroke="#f59e0b" stroke-width="1"/>
  <text x="490" y="356" text-anchor="middle" font-size="11" font-weight="600" fill="#d97706">3. PV Created</text>
  <text x="490" y="373" text-anchor="middle" font-size="9" fill="#64748b">Disk provisioned</text>
  <text x="490" y="387" text-anchor="middle" font-size="9" fill="#64748b">PV obj auto-created</text>

  <line x1="568" y1="361" x2="600" y2="361" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="604" y="334" width="212" height="54" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="710" y="356" text-anchor="middle" font-size="11" font-weight="600" fill="#15803d">4. PVC Bound ✓</text>
  <text x="710" y="373" text-anchor="middle" font-size="9" fill="#64748b">PVC status: Bound</text>
  <text x="710" y="387" text-anchor="middle" font-size="9" fill="#64748b">Pod can now mount volume</text>
</svg>