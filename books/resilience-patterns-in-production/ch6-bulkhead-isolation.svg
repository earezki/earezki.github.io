<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#1e1e2e" rx="8"/>
  <text x="400" y="35" text-anchor="middle" fill="#cdd6f4" font-family="sans-serif" font-size="16" font-weight="bold">Bulkhead: Thread Pool Isolation</text>

  <!-- Without bulkhead -->
  <text x="200" y="70" text-anchor="middle" fill="#f38ba8" font-family="sans-serif" font-size="13" font-weight="bold">Without Bulkhead</text>

  <rect x="50" y="85" width="300" height="160" rx="6" fill="#313244" stroke="#585b70" stroke-width="1"/>
  <text x="200" y="105" text-anchor="middle" fill="#a6adc8" font-family="sans-serif" font-size="11">Shared Thread Pool (200 threads)</text>

  <!-- Threads - all consumed by slow dependency -->
  <rect x="65" y="115" width="270" height="18" rx="3" fill="#f38ba8" fill-opacity="0.8"/>
  <text x="200" y="128" text-anchor="middle" fill="#1e1e2e" font-family="sans-serif" font-size="10">180 threads blocked on Fraud Service (30s timeout)</text>

  <rect x="65" y="138" width="30" height="18" rx="3" fill="#a6e3a1" fill-opacity="0.8"/>
  <text x="120" y="151" fill="#a6adc8" font-family="sans-serif" font-size="10">20 threads for everything else</text>

  <rect x="65" y="165" width="270" height="30" rx="3" fill="none" stroke="#f38ba8" stroke-width="1" stroke-dasharray="4"/>
  <text x="200" y="178" text-anchor="middle" fill="#f38ba8" font-family="sans-serif" font-size="10">Payment requests: QUEUED (no threads)</text>
  <text x="200" y="190" text-anchor="middle" fill="#f38ba8" font-family="sans-serif" font-size="10">Balance checks: QUEUED (no threads)</text>

  <text x="200" y="225" text-anchor="middle" fill="#f38ba8" font-family="sans-serif" font-size="11">One slow dependency takes down everything</text>

  <!-- With bulkhead -->
  <text x="600" y="70" text-anchor="middle" fill="#a6e3a1" font-family="sans-serif" font-size="13" font-weight="bold">With Bulkhead</text>

  <rect x="450" y="85" width="300" height="200" rx="6" fill="#313244" stroke="#585b70" stroke-width="1"/>

  <!-- Fraud pool -->
  <rect x="465" y="100" width="130" height="55" rx="4" fill="none" stroke="#f38ba8" stroke-width="2"/>
  <text x="530" y="118" text-anchor="middle" fill="#f38ba8" font-family="sans-serif" font-size="10">Fraud Pool (20 max)</text>
  <rect x="470" y="125" width="120" height="12" rx="2" fill="#f38ba8" fill-opacity="0.8"/>
  <text x="530" y="135" text-anchor="middle" fill="#1e1e2e" font-family="sans-serif" font-size="8">20/20 FULL</text>
  <text x="530" y="150" text-anchor="middle" fill="#f38ba8" font-family="sans-serif" font-size="9">Overflow rejected fast</text>

  <!-- Payment pool -->
  <rect x="610" y="100" width="130" height="55" rx="4" fill="none" stroke="#a6e3a1" stroke-width="2"/>
  <text x="675" y="118" text-anchor="middle" fill="#a6e3a1" font-family="sans-serif" font-size="10">Payment Pool (50 max)</text>
  <rect x="615" y="125" width="50" height="12" rx="2" fill="#a6e3a1" fill-opacity="0.8"/>
  <text x="675" y="135" text-anchor="middle" fill="#a6e3a1" font-family="sans-serif" font-size="8">20/50 normal</text>
  <text x="675" y="150" text-anchor="middle" fill="#a6e3a1" font-family="sans-serif" font-size="9">Unaffected</text>

  <!-- Balance pool -->
  <rect x="465" y="170" width="130" height="55" rx="4" fill="none" stroke="#89b4fa" stroke-width="2"/>
  <text x="530" y="188" text-anchor="middle" fill="#89b4fa" font-family="sans-serif" font-size="10">Balance Pool (30 max)</text>
  <rect x="470" y="195" width="40" height="12" rx="2" fill="#89b4fa" fill-opacity="0.8"/>
  <text x="530" y="205" text-anchor="middle" fill="#89b4fa" font-family="sans-serif" font-size="8">10/30 normal</text>
  <text x="530" y="220" text-anchor="middle" fill="#89b4fa" font-family="sans-serif" font-size="9">Unaffected</text>

  <!-- Notification pool -->
  <rect x="610" y="170" width="130" height="55" rx="4" fill="none" stroke="#fab387" stroke-width="2"/>
  <text x="675" y="188" text-anchor="middle" fill="#fab387" font-family="sans-serif" font-size="10">Notify Pool (10 max)</text>
  <rect x="615" y="195" width="25" height="12" rx="2" fill="#fab387" fill-opacity="0.8"/>
  <text x="675" y="205" text-anchor="middle" fill="#fab387" font-family="sans-serif" font-size="8">5/10 normal</text>
  <text x="675" y="220" text-anchor="middle" fill="#fab387" font-family="sans-serif" font-size="9">Unaffected</text>

  <text x="600" y="270" text-anchor="middle" fill="#a6e3a1" font-family="sans-serif" font-size="11">Fraud failure contained. Other services healthy.</text>

  <!-- Key insight -->
  <rect x="50" y="310" width="700" height="60" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="1"/>
  <text x="400" y="335" text-anchor="middle" fill="#cdd6f4" font-family="sans-serif" font-size="12" font-weight="bold">Key insight: The bulkhead does not fix the slow dependency.</text>
  <text x="400" y="355" text-anchor="middle" fill="#a6adc8" font-family="sans-serif" font-size="11">It prevents the slow dependency from consuming resources needed by healthy dependencies.</text>

  <!-- Sizing rule -->
  <rect x="50" y="385" width="700" height="45" rx="6" fill="#313244" stroke="#fab387" stroke-width="1"/>
  <text x="400" y="405" text-anchor="middle" fill="#fab387" font-family="sans-serif" font-size="11">Sizing formula: max_concurrent_calls = (requests/sec) x (p99_latency_seconds) x safety_factor</text>
  <text x="400" y="422" text-anchor="middle" fill="#a6adc8" font-family="sans-serif" font-size="10">For fraud at 100 rps, 200ms p99, 2x safety: 100 x 0.2 x 2 = 40 threads max</text>
</svg>
