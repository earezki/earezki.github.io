<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380">
  <rect width="800" height="380" fill="#1e1e2e" rx="8"/>
  <text x="400" y="30" text-anchor="middle" fill="#cdd6f4" font-family="sans-serif" font-size="16" font-weight="bold">Resilience4J Decorator Ordering</text>

  <!-- Correct order -->
  <text x="400" y="60" text-anchor="middle" fill="#a6e3a1" font-family="sans-serif" font-size="13" font-weight="bold">Execution order (outermost to innermost)</text>

  <!-- Layers -->
  <rect x="60" y="80" width="680" height="260" rx="8" fill="none" stroke="#f38ba8" stroke-width="2"/>
  <text x="80" y="100" fill="#f38ba8" font-family="sans-serif" font-size="12" font-weight="bold">1. Retry (outermost)</text>
  <text x="80" y="115" fill="#a6adc8" font-family="sans-serif" font-size="10">Retries the entire decorated chain. Must be outside circuit breaker.</text>

  <rect x="90" y="125" width="620" height="200" rx="6" fill="none" stroke="#fab387" stroke-width="2"/>
  <text x="110" y="145" fill="#fab387" font-family="sans-serif" font-size="12" font-weight="bold">2. Circuit Breaker</text>
  <text x="110" y="160" fill="#a6adc8" font-family="sans-serif" font-size="10">Records success/failure. Opens when threshold reached. If open, retry sees CallNotPermittedException.</text>

  <rect x="120" y="170" width="560" height="140" rx="6" fill="none" stroke="#89b4fa" stroke-width="2"/>
  <text x="140" y="190" fill="#89b4fa" font-family="sans-serif" font-size="12" font-weight="bold">3. Rate Limiter</text>
  <text x="140" y="205" fill="#a6adc8" font-family="sans-serif" font-size="10">Throttles calls that pass the circuit breaker. Prevents retry storms from overwhelming downstream.</text>

  <rect x="150" y="215" width="500" height="80" rx="6" fill="none" stroke="#a6e3a1" stroke-width="2"/>
  <text x="170" y="235" fill="#a6e3a1" font-family="sans-serif" font-size="12" font-weight="bold">4. Bulkhead</text>
  <text x="170" y="250" fill="#a6adc8" font-family="sans-serif" font-size="10">Limits concurrent executions. Only calls that pass rate limiter compete for bulkhead permits.</text>

  <rect x="180" y="260" width="440" height="25" rx="4" fill="#313244" stroke="#cdd6f4" stroke-width="2"/>
  <text x="400" y="277" text-anchor="middle" fill="#cdd6f4" font-family="sans-serif" font-size="12" font-weight="bold">5. Time Limiter (innermost) then Actual Call</text>

  <!-- Wrong order warning -->
  <rect x="100" y="345" width="600" height="25" rx="4" fill="#313244" stroke="#f38ba8" stroke-width="1"/>
  <text x="400" y="362" text-anchor="middle" fill="#f38ba8" font-family="sans-serif" font-size="11">WRONG: CircuitBreaker outside Retry = retries bypass failure recording = breaker never opens</text>
</svg>
