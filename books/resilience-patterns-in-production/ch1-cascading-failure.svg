<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#1e1e2e" rx="8"/>
  <text x="400" y="35" text-anchor="middle" fill="#cdd6f4" font-family="sans-serif" font-size="16" font-weight="bold">Cascading Failure Propagation</text>

  <!-- Service boxes -->
  <rect x="60" y="70" width="140" height="50" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <text x="130" y="100" text-anchor="middle" fill="#cdd6f4" font-family="sans-serif" font-size="13">Payment Service</text>

  <rect x="330" y="70" width="140" height="50" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <text x="400" y="100" text-anchor="middle" fill="#cdd6f4" font-family="sans-serif" font-size="13">Fraud Detection</text>

  <rect x="600" y="70" width="140" height="50" rx="6" fill="#313244" stroke="#f38ba8" stroke-width="2"/>
  <text x="670" y="100" text-anchor="middle" fill="#f38ba8" font-family="sans-serif" font-size="13">External Scoring</text>
  <text x="670" y="115" text-anchor="middle" fill="#f38ba8" font-family="sans-serif" font-size="10">(SLOW: 30s response)</text>

  <!-- Arrows -->
  <line x1="200" y1="95" x2="325" y2="95" stroke="#89b4fa" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="470" y1="95" x2="595" y2="95" stroke="#f38ba8" stroke-width="2" marker-end="url(#arrowRed)"/>

  <!-- Timeline -->
  <text x="400" y="170" text-anchor="middle" fill="#a6adc8" font-family="sans-serif" font-size="12">Timeline of Failure</text>
  <line x1="60" y1="190" x2="740" y2="190" stroke="#585b70" stroke-width="1"/>

  <!-- T=0 -->
  <line x1="100" y1="185" x2="100" y2="195" stroke="#a6adc8" stroke-width="2"/>
  <text x="100" y="210" text-anchor="middle" fill="#a6adc8" font-family="sans-serif" font-size="10">T=0s</text>
  <text x="100" y="225" text-anchor="middle" fill="#a6e3a1" font-family="sans-serif" font-size="10">Normal</text>

  <!-- T=30 -->
  <line x1="250" y1="185" x2="250" y2="195" stroke="#a6adc8" stroke-width="2"/>
  <text x="250" y="210" text-anchor="middle" fill="#a6adc8" font-family="sans-serif" font-size="10">T=30s</text>
  <text x="250" y="225" text-anchor="middle" fill="#fab387" font-family="sans-serif" font-size="10">Threads filling</text>

  <!-- T=60 -->
  <line x1="400" y1="185" x2="400" y2="195" stroke="#a6adc8" stroke-width="2"/>
  <text x="400" y="210" text-anchor="middle" fill="#a6adc8" font-family="sans-serif" font-size="10">T=60s</text>
  <text x="400" y="225" text-anchor="middle" fill="#fab387" font-family="sans-serif" font-size="10">Thread pool exhausted</text>

  <!-- T=90 -->
  <line x1="550" y1="185" x2="550" y2="195" stroke="#a6adc8" stroke-width="2"/>
  <text x="550" y="210" text-anchor="middle" fill="#a6adc8" font-family="sans-serif" font-size="10">T=90s</text>
  <text x="550" y="225" text-anchor="middle" fill="#f38ba8" font-family="sans-serif" font-size="10">Payment timeouts</text>

  <!-- T=120 -->
  <line x1="700" y1="185" x2="700" y2="195" stroke="#a6adc8" stroke-width="2"/>
  <text x="700" y="210" text-anchor="middle" fill="#a6adc8" font-family="sans-serif" font-size="10">T=120s</text>
  <text x="700" y="225" text-anchor="middle" fill="#f38ba8" font-family="sans-serif" font-size="10">Full outage</text>

  <!-- Thread pool visualization -->
  <text x="130" y="270" text-anchor="middle" fill="#cdd6f4" font-family="sans-serif" font-size="12" font-weight="bold">Thread Pool (200 threads)</text>

  <!-- T=0 pool -->
  <text x="100" y="295" text-anchor="middle" fill="#a6adc8" font-family="sans-serif" font-size="10">T=0s</text>
  <rect x="60" y="300" width="80" height="20" rx="3" fill="#313244" stroke="#585b70" stroke-width="1"/>
  <rect x="60" y="300" width="16" height="20" rx="3" fill="#a6e3a1"/>
  <text x="150" y="315" fill="#a6adc8" font-family="sans-serif" font-size="10">20/200</text>

  <!-- T=30 pool -->
  <text x="100" y="335" text-anchor="middle" fill="#a6adc8" font-family="sans-serif" font-size="10">T=30s</text>
  <rect x="60" y="340" width="80" height="20" rx="3" fill="#313244" stroke="#585b70" stroke-width="1"/>
  <rect x="60" y="340" width="56" height="20" rx="3" fill="#fab387"/>
  <text x="150" y="355" fill="#a6adc8" font-family="sans-serif" font-size="10">140/200</text>

  <!-- T=60 pool -->
  <text x="100" y="375" text-anchor="middle" fill="#a6adc8" font-family="sans-serif" font-size="10">T=60s</text>
  <rect x="60" y="380" width="80" height="20" rx="3" fill="#313244" stroke="#585b70" stroke-width="1"/>
  <rect x="60" y="380" width="80" height="20" rx="3" fill="#f38ba8"/>
  <text x="150" y="395" fill="#f38ba8" font-family="sans-serif" font-size="10">200/200 FULL</text>

  <!-- Impact column -->
  <text x="500" y="270" text-anchor="middle" fill="#cdd6f4" font-family="sans-serif" font-size="12" font-weight="bold">Observable Impact</text>

  <rect x="350" y="285" width="300" height="35" rx="4" fill="#313244" stroke="#585b70" stroke-width="1"/>
  <text x="365" y="305" fill="#a6e3a1" font-family="sans-serif" font-size="11">p99 latency: 120ms</text>
  <text x="365" y="315" fill="#a6adc8" font-family="sans-serif" font-size="10">Normal operation</text>

  <rect x="350" y="330" width="300" height="35" rx="4" fill="#313244" stroke="#fab387" stroke-width="1"/>
  <text x="365" y="350" fill="#fab387" font-family="sans-serif" font-size="11">p99 latency: 30,200ms</text>
  <text x="365" y="360" fill="#a6adc8" font-family="sans-serif" font-size="10">Requests queuing behind stuck threads</text>

  <rect x="350" y="375" width="300" height="35" rx="4" fill="#313244" stroke="#f38ba8" stroke-width="1"/>
  <text x="365" y="395" fill="#f38ba8" font-family="sans-serif" font-size="11">HTTP 503: Connection refused</text>
  <text x="365" y="405" fill="#a6adc8" font-family="sans-serif" font-size="10">No threads available for any request</text>

  <rect x="350" y="420" width="300" height="35" rx="4" fill="#313244" stroke="#f38ba8" stroke-width="2"/>
  <text x="365" y="440" fill="#f38ba8" font-family="sans-serif" font-size="11">Upstream services fail: cascade complete</text>
  <text x="365" y="450" fill="#a6adc8" font-family="sans-serif" font-size="10">Fraud detection outage becomes payment outage</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#89b4fa"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f38ba8"/>
    </marker>
  </defs>
</svg>
