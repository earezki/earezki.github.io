<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="700" height="450">
  <rect width="700" height="450" fill="#1e1e2e" rx="8"/>
  <text x="350" y="35" text-anchor="middle" fill="#cdd6f4" font-family="sans-serif" font-size="16" font-weight="bold">Fallback Decision Tree</text>

  <!-- Root -->
  <rect x="250" y="55" width="200" height="35" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <text x="350" y="78" text-anchor="middle" fill="#cdd6f4" font-family="sans-serif" font-size="12">Primary call fails</text>

  <!-- Branch: Is data stale-safe? -->
  <line x1="350" y1="90" x2="350" y2="120" stroke="#585b70" stroke-width="1.5"/>
  <rect x="220" y="120" width="260" height="30" rx="6" fill="#313244" stroke="#fab387" stroke-width="2"/>
  <text x="350" y="140" text-anchor="middle" fill="#fab387" font-family="sans-serif" font-size="11">Can the caller tolerate stale data?</text>

  <!-- Yes branch -->
  <line x1="280" y1="150" x2="150" y2="180" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="200" y="170" fill="#a6e3a1" font-family="sans-serif" font-size="10">YES</text>
  <rect x="50" y="180" width="200" height="30" rx="6" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
  <text x="150" y="200" text-anchor="middle" fill="#a6e3a1" font-family="sans-serif" font-size="11">Return cached response</text>

  <!-- No branch -->
  <line x1="420" y1="150" x2="550" y2="180" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="500" y="170" fill="#f38ba8" font-family="sans-serif" font-size="10">NO</text>
  <rect x="450" y="180" width="200" height="30" rx="6" fill="#313244" stroke="#f38ba8" stroke-width="2"/>
  <text x="550" y="200" text-anchor="middle" fill="#f38ba8" font-family="sans-serif" font-size="11">Is the call critical path?</text>

  <!-- Critical: Yes -->
  <line x1="510" y1="210" x2="430" y2="240" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="455" y="230" fill="#f38ba8" font-family="sans-serif" font-size="10">YES</text>
  <rect x="310" y="240" width="240" height="45" rx="6" fill="#313244" stroke="#f38ba8" stroke-width="2"/>
  <text x="430" y="258" text-anchor="middle" fill="#f38ba8" font-family="sans-serif" font-size="11">Fail fast with clear error</text>
  <text x="430" y="275" text-anchor="middle" fill="#a6adc8" font-family="sans-serif" font-size="10">HTTP 503 + Retry-After header</text>

  <!-- Critical: No -->
  <line x1="590" y1="210" x2="630" y2="240" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="620" y="230" fill="#a6e3a1" font-family="sans-serif" font-size="10">NO</text>
  <rect x="560" y="240" width="120" height="45" rx="6" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
  <text x="620" y="258" text-anchor="middle" fill="#a6e3a1" font-family="sans-serif" font-size="11">Skip and proceed</text>
  <text x="620" y="275" text-anchor="middle" fill="#a6adc8" font-family="sans-serif" font-size="10">Log + metric</text>

  <!-- Cache details -->
  <line x1="150" y1="210" x2="150" y2="240" stroke="#585b70" stroke-width="1.5"/>
  <rect x="30" y="240" width="240" height="30" rx="6" fill="#313244" stroke="#585b70" stroke-width="1"/>
  <text x="150" y="260" text-anchor="middle" fill="#a6adc8" font-family="sans-serif" font-size="11">Set max-stale TTL per endpoint</text>

  <!-- Bottom examples -->
  <text x="350" y="330" text-anchor="middle" fill="#cdd6f4" font-family="sans-serif" font-size="13" font-weight="bold">Transaction Platform Examples</text>

  <rect x="30" y="345" width="200" height="55" rx="4" fill="#313244" stroke="#a6e3a1" stroke-width="1"/>
  <text x="130" y="365" text-anchor="middle" fill="#a6e3a1" font-family="sans-serif" font-size="11">Balance Check</text>
  <text x="130" y="380" text-anchor="middle" fill="#a6adc8" font-family="sans-serif" font-size="10">Fallback: last known balance</text>
  <text x="130" y="393" text-anchor="middle" fill="#a6adc8" font-family="sans-serif" font-size="10">+ "as of" timestamp</text>

  <rect x="250" y="345" width="200" height="55" rx="4" fill="#313244" stroke="#f38ba8" stroke-width="1"/>
  <text x="350" y="365" text-anchor="middle" fill="#f38ba8" font-family="sans-serif" font-size="11">Fraud Detection</text>
  <text x="350" y="380" text-anchor="middle" fill="#a6adc8" font-family="sans-serif" font-size="10">Fallback: allow with flag</text>
  <text x="350" y="393" text-anchor="middle" fill="#a6adc8" font-family="sans-serif" font-size="10">for manual review</text>

  <rect x="470" y="345" width="200" height="55" rx="4" fill="#313244" stroke="#89b4fa" stroke-width="1"/>
  <text x="570" y="365" text-anchor="middle" fill="#89b4fa" font-family="sans-serif" font-size="11">Notification</text>
  <text x="570" y="380" text-anchor="middle" fill="#a6adc8" font-family="sans-serif" font-size="10">Fallback: enqueue for</text>
  <text x="570" y="393" text-anchor="middle" fill="#a6adc8" font-family="sans-serif" font-size="10">later delivery</text>
</svg>
