<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="800" height="400" fill="#1e1e2e" rx="8"/>
  <text x="400" y="30" text-anchor="middle" fill="#cdd6f4" font-family="sans-serif" font-size="16" font-weight="bold">Kafka Retry and Dead Letter Topology</text>

  <!-- Producer -->
  <rect x="30" y="60" width="100" height="40" rx="4" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <text x="80" y="85" text-anchor="middle" fill="#cdd6f4" font-family="sans-serif" font-size="11">Producer</text>

  <!-- Main topic -->
  <rect x="180" y="55" width="160" height="50" rx="4" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
  <text x="260" y="75" text-anchor="middle" fill="#a6e3a1" font-family="sans-serif" font-size="11">payment.events</text>
  <text x="260" y="95" text-anchor="middle" fill="#a6adc8" font-family="sans-serif" font-size="9">partitions: 12</text>

  <!-- Consumer -->
  <rect x="400" y="60" width="120" height="40" rx="4" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <text x="460" y="85" text-anchor="middle" fill="#cdd6f4" font-family="sans-serif" font-size="11">Consumer Group</text>

  <!-- Arrows -->
  <line x1="130" y1="80" x2="175" y2="80" stroke="#89b4fa" stroke-width="1.5" marker-end="url(#ak)"/>
  <line x1="340" y1="80" x2="395" y2="80" stroke="#a6e3a1" stroke-width="1.5" marker-end="url(#ak)"/>

  <!-- Retry topic 1 -->
  <rect x="180" y="140" width="160" height="50" rx="4" fill="#313244" stroke="#fab387" stroke-width="2"/>
  <text x="260" y="160" text-anchor="middle" fill="#fab387" font-family="sans-serif" font-size="11">payment.events.retry-1</text>
  <text x="260" y="180" text-anchor="middle" fill="#a6adc8" font-family="sans-serif" font-size="9">delay: 1s</text>

  <!-- Retry topic 2 -->
  <rect x="180" y="210" width="160" height="50" rx="4" fill="#313244" stroke="#fab387" stroke-width="2"/>
  <text x="260" y="230" text-anchor="middle" fill="#fab387" font-family="sans-serif" font-size="11">payment.events.retry-2</text>
  <text x="260" y="250" text-anchor="middle" fill="#a6adc8" font-family="sans-serif" font-size="9">delay: 10s</text>

  <!-- Retry topic 3 -->
  <rect x="180" y="280" width="160" height="50" rx="4" fill="#313244" stroke="#fab387" stroke-width="2"/>
  <text x="260" y="300" text-anchor="middle" fill="#fab387" font-family="sans-serif" font-size="11">payment.events.retry-3</text>
  <text x="260" y="320" text-anchor="middle" fill="#a6adc8" font-family="sans-serif" font-size="9">delay: 60s</text>

  <!-- DLT -->
  <rect x="180" y="350" width="160" height="40" rx="4" fill="#313244" stroke="#f38ba8" stroke-width="2"/>
  <text x="260" y="375" text-anchor="middle" fill="#f38ba8" font-family="sans-serif" font-size="11">payment.events.dlt</text>

  <!-- Failure arrows -->
  <line x1="460" y1="100" x2="460" y2="150" stroke="#f38ba8" stroke-width="1"/>
  <line x1="460" y1="150" x2="345" y2="165" stroke="#f38ba8" stroke-width="1.5" marker-end="url(#aR)"/>
  <text x="420" y="145" fill="#f38ba8" font-family="sans-serif" font-size="9">fail</text>

  <line x1="340" y1="165" x2="400" y2="165" stroke="#fab387" stroke-width="1"/>
  <line x1="460" y1="165" x2="460" y2="220" stroke="#f38ba8" stroke-width="1"/>
  <line x1="460" y1="220" x2="345" y2="235" stroke="#f38ba8" stroke-width="1.5" marker-end="url(#aR)"/>

  <line x1="340" y1="235" x2="400" y2="235" stroke="#fab387" stroke-width="1"/>
  <line x1="460" y1="235" x2="460" y2="290" stroke="#f38ba8" stroke-width="1"/>
  <line x1="460" y1="290" x2="345" y2="305" stroke="#f38ba8" stroke-width="1.5" marker-end="url(#aR)"/>

  <line x1="340" y1="305" x2="400" y2="305" stroke="#fab387" stroke-width="1"/>
  <line x1="460" y1="305" x2="460" y2="355" stroke="#f38ba8" stroke-width="1"/>
  <line x1="460" y1="370" x2="345" y2="370" stroke="#f38ba8" stroke-width="1.5" marker-end="url(#aR)"/>

  <!-- Success arrow back -->
  <line x1="520" y1="80" x2="560" y2="80" stroke="#a6e3a1" stroke-width="1.5" marker-end="url(#aGk)"/>
  <rect x="560" y="60" width="100" height="40" rx="4" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
  <text x="610" y="85" text-anchor="middle" fill="#a6e3a1" font-family="sans-serif" font-size="11">Process OK</text>

  <!-- DLT handler -->
  <rect x="560" y="350" width="180" height="40" rx="4" fill="#313244" stroke="#f38ba8" stroke-width="1"/>
  <text x="650" y="365" text-anchor="middle" fill="#f38ba8" font-family="sans-serif" font-size="10">Alert + manual review queue</text>
  <text x="650" y="380" text-anchor="middle" fill="#a6adc8" font-family="sans-serif" font-size="9">Poison pill isolation</text>
  <line x1="340" y1="370" x2="555" y2="370" stroke="#f38ba8" stroke-width="1" stroke-dasharray="4"/>

  <defs>
    <marker id="ak" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#89b4fa"/>
    </marker>
    <marker id="aR" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f38ba8"/>
    </marker>
    <marker id="aGk" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#a6e3a1"/>
    </marker>
  </defs>
</svg>
