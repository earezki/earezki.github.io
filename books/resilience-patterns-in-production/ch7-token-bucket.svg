<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350">
  <rect width="800" height="350" fill="#1e1e2e" rx="8"/>
  <text x="400" y="30" text-anchor="middle" fill="#cdd6f4" font-family="sans-serif" font-size="16" font-weight="bold">Token Bucket Rate Limiter</text>

  <!-- Bucket -->
  <rect x="300" y="60" width="200" height="200" rx="0" fill="none" stroke="#89b4fa" stroke-width="3"/>
  <!-- Bucket bottom -->
  <line x1="300" y1="260" x2="500" y2="260" stroke="#89b4fa" stroke-width="3"/>

  <!-- Tokens -->
  <circle cx="340" cy="240" r="14" fill="#a6e3a1" stroke="#313244" stroke-width="2"/>
  <text x="340" y="244" text-anchor="middle" fill="#1e1e2e" font-family="sans-serif" font-size="10" font-weight="bold">T</text>

  <circle cx="380" cy="240" r="14" fill="#a6e3a1" stroke="#313244" stroke-width="2"/>
  <text x="380" y="244" text-anchor="middle" fill="#1e1e2e" font-family="sans-serif" font-size="10" font-weight="bold">T</text>

  <circle cx="420" cy="240" r="14" fill="#a6e3a1" stroke="#313244" stroke-width="2"/>
  <text x="420" y="244" text-anchor="middle" fill="#1e1e2e" font-family="sans-serif" font-size="10" font-weight="bold">T</text>

  <circle cx="460" cy="240" r="14" fill="#a6e3a1" stroke="#313244" stroke-width="2"/>
  <text x="460" y="244" text-anchor="middle" fill="#1e1e2e" font-family="sans-serif" font-size="10" font-weight="bold">T</text>

  <circle cx="340" cy="210" r="14" fill="#a6e3a1" stroke="#313244" stroke-width="2"/>
  <text x="340" y="214" text-anchor="middle" fill="#1e1e2e" font-family="sans-serif" font-size="10" font-weight="bold">T</text>

  <circle cx="380" cy="210" r="14" fill="#a6e3a1" stroke="#313244" stroke-width="2"/>
  <text x="380" y="214" text-anchor="middle" fill="#1e1e2e" font-family="sans-serif" font-size="10" font-weight="bold">T</text>

  <!-- Refill arrow -->
  <line x1="400" y1="35" x2="400" y2="55" stroke="#89b4fa" stroke-width="2" marker-end="url(#aB)"/>
  <text x="400" y="50" text-anchor="middle" fill="#89b4fa" font-family="sans-serif" font-size="10" dy="-15">Refill: 10 tokens/sec</text>

  <!-- Capacity label -->
  <text x="510" y="165" fill="#a6adc8" font-family="sans-serif" font-size="11">Capacity: 20</text>
  <text x="510" y="180" fill="#a6adc8" font-family="sans-serif" font-size="11">Current: 6</text>

  <!-- Request comes in -->
  <rect x="50" y="140" width="120" height="35" rx="4" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
  <text x="110" y="162" text-anchor="middle" fill="#a6e3a1" font-family="sans-serif" font-size="11">Request (1 token)</text>
  <line x1="170" y1="157" x2="295" y2="200" stroke="#a6e3a1" stroke-width="2" marker-end="url(#aG)"/>
  <text x="230" y="170" fill="#a6e3a1" font-family="sans-serif" font-size="10">ALLOWED</text>

  <!-- Request rejected -->
  <rect x="50" y="220" width="120" height="35" rx="4" fill="#313244" stroke="#f38ba8" stroke-width="2"/>
  <text x="110" y="242" text-anchor="middle" fill="#f38ba8" font-family="sans-serif" font-size="11">Burst (25 tokens)</text>
  <line x1="170" y1="237" x2="230" y2="237" stroke="#f38ba8" stroke-width="2"/>
  <line x1="220" y1="230" x2="240" y2="244" stroke="#f38ba8" stroke-width="3"/>
  <line x1="240" y1="230" x2="220" y2="244" stroke="#f38ba8" stroke-width="3"/>
  <text x="230" y="260" fill="#f38ba8" font-family="sans-serif" font-size="10">REJECTED</text>

  <!-- Key properties -->
  <rect x="560" y="70" width="210" height="120" rx="6" fill="#313244" stroke="#585b70" stroke-width="1"/>
  <text x="665" y="95" text-anchor="middle" fill="#cdd6f4" font-family="sans-serif" font-size="12" font-weight="bold">Properties</text>
  <text x="575" y="115" fill="#89b4fa" font-family="sans-serif" font-size="10">limitForPeriod: 10</text>
  <text x="575" y="132" fill="#89b4fa" font-family="sans-serif" font-size="10">limitRefreshPeriod: 1s</text>
  <text x="575" y="149" fill="#89b4fa" font-family="sans-serif" font-size="10">timeoutDuration: 500ms</text>
  <text x="575" y="166" fill="#a6adc8" font-family="sans-serif" font-size="10">Wait up to 500ms for a token</text>
  <text x="575" y="180" fill="#a6adc8" font-family="sans-serif" font-size="10">then reject immediately</text>

  <!-- Distributed note -->
  <rect x="100" y="290" width="600" height="40" rx="6" fill="#313244" stroke="#fab387" stroke-width="1"/>
  <text x="400" y="310" text-anchor="middle" fill="#fab387" font-family="sans-serif" font-size="11">Distributed rate limiting: Use Redis EVALSHA with atomic Lua script for cluster-wide limits</text>
  <text x="400" y="324" text-anchor="middle" fill="#a6adc8" font-family="sans-serif" font-size="10">Local token bucket protects one instance. Redis token bucket protects the downstream service.</text>

  <defs>
    <marker id="aB" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#89b4fa"/>
    </marker>
    <marker id="aG" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#a6e3a1"/>
    </marker>
  </defs>
</svg>
