<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380">
  <rect width="800" height="380" fill="#1e1e2e" rx="8"/>
  <text x="400" y="30" text-anchor="middle" fill="#cdd6f4" font-family="sans-serif" font-size="16" font-weight="bold">Degraded Mode Decision Matrix</text>

  <!-- Headers -->
  <rect x="40" y="50" width="150" height="30" rx="4" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <text x="115" y="70" text-anchor="middle" fill="#89b4fa" font-family="sans-serif" font-size="11" font-weight="bold">Dependency</text>

  <rect x="200" y="50" width="100" height="30" rx="4" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <text x="250" y="70" text-anchor="middle" fill="#89b4fa" font-family="sans-serif" font-size="11" font-weight="bold">Status</text>

  <rect x="310" y="50" width="200" height="30" rx="4" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <text x="410" y="70" text-anchor="middle" fill="#89b4fa" font-family="sans-serif" font-size="11" font-weight="bold">Degraded Behavior</text>

  <rect x="520" y="50" width="120" height="30" rx="4" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <text x="580" y="70" text-anchor="middle" fill="#89b4fa" font-family="sans-serif" font-size="11" font-weight="bold">User Impact</text>

  <rect x="650" y="50" width="110" height="30" rx="4" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <text x="705" y="70" text-anchor="middle" fill="#89b4fa" font-family="sans-serif" font-size="11" font-weight="bold">SLA</text>

  <!-- Row 1: Fraud Detection DOWN -->
  <rect x="40" y="90" width="150" height="40" rx="3" fill="#313244" stroke="#585b70" stroke-width="1"/>
  <text x="115" y="115" text-anchor="middle" fill="#cdd6f4" font-family="sans-serif" font-size="10">Fraud Detection</text>

  <rect x="200" y="90" width="100" height="40" rx="3" fill="#313244" stroke="#f38ba8" stroke-width="1"/>
  <text x="250" y="115" text-anchor="middle" fill="#f38ba8" font-family="sans-serif" font-size="10">DOWN</text>

  <rect x="310" y="90" width="200" height="40" rx="3" fill="#313244" stroke="#585b70" stroke-width="1"/>
  <text x="410" y="108" text-anchor="middle" fill="#fab387" font-family="sans-serif" font-size="10">Allow payment with flag</text>
  <text x="410" y="122" text-anchor="middle" fill="#a6adc8" font-family="sans-serif" font-size="9">Queue for manual review</text>

  <rect x="520" y="90" width="120" height="40" rx="3" fill="#313244" stroke="#585b70" stroke-width="1"/>
  <text x="580" y="115" text-anchor="middle" fill="#a6e3a1" font-family="sans-serif" font-size="10">None visible</text>

  <rect x="650" y="90" width="110" height="40" rx="3" fill="#313244" stroke="#585b70" stroke-width="1"/>
  <text x="705" y="115" text-anchor="middle" fill="#fab387" font-family="sans-serif" font-size="10">99.5%</text>

  <!-- Row 2: Notifications DOWN -->
  <rect x="40" y="140" width="150" height="40" rx="3" fill="#313244" stroke="#585b70" stroke-width="1"/>
  <text x="115" y="165" text-anchor="middle" fill="#cdd6f4" font-family="sans-serif" font-size="10">Notification Service</text>

  <rect x="200" y="140" width="100" height="40" rx="3" fill="#313244" stroke="#f38ba8" stroke-width="1"/>
  <text x="250" y="165" text-anchor="middle" fill="#f38ba8" font-family="sans-serif" font-size="10">DOWN</text>

  <rect x="310" y="140" width="200" height="40" rx="3" fill="#313244" stroke="#585b70" stroke-width="1"/>
  <text x="410" y="158" text-anchor="middle" fill="#a6e3a1" font-family="sans-serif" font-size="10">Enqueue for later delivery</text>
  <text x="410" y="172" text-anchor="middle" fill="#a6adc8" font-family="sans-serif" font-size="9">Payment completes normally</text>

  <rect x="520" y="140" width="120" height="40" rx="3" fill="#313244" stroke="#585b70" stroke-width="1"/>
  <text x="580" y="158" text-anchor="middle" fill="#fab387" font-family="sans-serif" font-size="10">Delayed email/SMS</text>
  <text x="580" y="172" text-anchor="middle" fill="#a6adc8" font-family="sans-serif" font-size="9">(minutes, not seconds)</text>

  <rect x="650" y="140" width="110" height="40" rx="3" fill="#313244" stroke="#585b70" stroke-width="1"/>
  <text x="705" y="165" text-anchor="middle" fill="#a6e3a1" font-family="sans-serif" font-size="10">99.9%</text>

  <!-- Row 3: Balance Service DOWN -->
  <rect x="40" y="190" width="150" height="40" rx="3" fill="#313244" stroke="#585b70" stroke-width="1"/>
  <text x="115" y="215" text-anchor="middle" fill="#cdd6f4" font-family="sans-serif" font-size="10">Balance Service</text>

  <rect x="200" y="190" width="100" height="40" rx="3" fill="#313244" stroke="#f38ba8" stroke-width="1"/>
  <text x="250" y="215" text-anchor="middle" fill="#f38ba8" font-family="sans-serif" font-size="10">DOWN</text>

  <rect x="310" y="190" width="200" height="40" rx="3" fill="#313244" stroke="#585b70" stroke-width="1"/>
  <text x="410" y="208" text-anchor="middle" fill="#f38ba8" font-family="sans-serif" font-size="10">Reject payment</text>
  <text x="410" y="222" text-anchor="middle" fill="#a6adc8" font-family="sans-serif" font-size="9">Cannot verify funds</text>

  <rect x="520" y="190" width="120" height="40" rx="3" fill="#313244" stroke="#585b70" stroke-width="1"/>
  <text x="580" y="215" text-anchor="middle" fill="#f38ba8" font-family="sans-serif" font-size="10">Payment fails</text>

  <rect x="650" y="190" width="110" height="40" rx="3" fill="#313244" stroke="#585b70" stroke-width="1"/>
  <text x="705" y="215" text-anchor="middle" fill="#f38ba8" font-family="sans-serif" font-size="10">0% (critical)</text>

  <!-- Row 4: Audit Log DOWN -->
  <rect x="40" y="240" width="150" height="40" rx="3" fill="#313244" stroke="#585b70" stroke-width="1"/>
  <text x="115" y="265" text-anchor="middle" fill="#cdd6f4" font-family="sans-serif" font-size="10">Audit Log</text>

  <rect x="200" y="240" width="100" height="40" rx="3" fill="#313244" stroke="#f38ba8" stroke-width="1"/>
  <text x="250" y="265" text-anchor="middle" fill="#f38ba8" font-family="sans-serif" font-size="10">DOWN</text>

  <rect x="310" y="240" width="200" height="40" rx="3" fill="#313244" stroke="#585b70" stroke-width="1"/>
  <text x="410" y="258" text-anchor="middle" fill="#fab387" font-family="sans-serif" font-size="10">Buffer to local disk</text>
  <text x="410" y="272" text-anchor="middle" fill="#a6adc8" font-family="sans-serif" font-size="9">Replay when service returns</text>

  <rect x="520" y="240" width="120" height="40" rx="3" fill="#313244" stroke="#585b70" stroke-width="1"/>
  <text x="580" y="265" text-anchor="middle" fill="#a6e3a1" font-family="sans-serif" font-size="10">None visible</text>

  <rect x="650" y="240" width="110" height="40" rx="3" fill="#313244" stroke="#585b70" stroke-width="1"/>
  <text x="705" y="265" text-anchor="middle" fill="#a6e3a1" font-family="sans-serif" font-size="10">99.9%</text>

  <!-- Key insight -->
  <rect x="40" y="300" width="720" height="60" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <text x="400" y="325" text-anchor="middle" fill="#cdd6f4" font-family="sans-serif" font-size="12" font-weight="bold">Every dependency must have a documented answer to: "What happens when this is gone?"</text>
  <text x="400" y="345" text-anchor="middle" fill="#a6adc8" font-family="sans-serif" font-size="11">If the answer is "we don't know," that dependency is a single point of failure.</text>
</svg>
