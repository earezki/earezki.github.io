<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="monospace">
  <rect width="800" height="450" fill="#1e1e2e"/>
  <defs><marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#585b70"/></marker></defs>
  <text x="400" y="30" text-anchor="middle" fill="#cdd6f4" font-size="16" font-weight="bold">Read Path: Query Phase → Fetch Phase</text>
  <!-- Client -->
  <rect x="340" y="50" width="120" height="35" rx="4" fill="#313244" stroke="#cba6f7" stroke-width="1.5"/>
  <text x="400" y="72" text-anchor="middle" fill="#cba6f7" font-size="11">Client</text>
  <line x1="400" y1="85" x2="400" y2="110" stroke="#585b70" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- Coordinating Node -->
  <rect x="260" y="110" width="280" height="45" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <text x="400" y="130" text-anchor="middle" fill="#89b4fa" font-size="12" font-weight="bold">Coordinating Node</text>
  <text x="400" y="147" text-anchor="middle" fill="#cdd6f4" font-size="9">scatter → gather → sort → truncate</text>
  <!-- Query Phase -->
  <text x="200" y="185" text-anchor="middle" fill="#a6e3a1" font-size="13" font-weight="bold">1. Query Phase</text>
  <!-- Shard queries -->
  <line x1="300" y1="155" x2="100" y2="210" stroke="#a6e3a1" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="400" y1="155" x2="300" y2="210" stroke="#a6e3a1" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="500" y1="155" x2="500" y2="210" stroke="#a6e3a1" stroke-width="1" marker-end="url(#arr)"/>
  <rect x="30" y="210" width="140" height="70" rx="4" fill="#313244" stroke="#a6e3a1" stroke-width="1"/>
  <text x="100" y="232" text-anchor="middle" fill="#a6e3a1" font-size="10" font-weight="bold">Shard 0</text>
  <text x="100" y="250" text-anchor="middle" fill="#cdd6f4" font-size="9">Lucene query</text>
  <text x="100" y="265" text-anchor="middle" fill="#cdd6f4" font-size="9">→ top N doc IDs</text>
  <rect x="230" y="210" width="140" height="70" rx="4" fill="#313244" stroke="#a6e3a1" stroke-width="1"/>
  <text x="300" y="232" text-anchor="middle" fill="#a6e3a1" font-size="10" font-weight="bold">Shard 1</text>
  <text x="300" y="250" text-anchor="middle" fill="#cdd6f4" font-size="9">Lucene query</text>
  <text x="300" y="265" text-anchor="middle" fill="#cdd6f4" font-size="9">→ top N doc IDs</text>
  <rect x="430" y="210" width="140" height="70" rx="4" fill="#313244" stroke="#a6e3a1" stroke-width="1"/>
  <text x="500" y="232" text-anchor="middle" fill="#a6e3a1" font-size="10" font-weight="bold">Shard 2</text>
  <text x="500" y="250" text-anchor="middle" fill="#cdd6f4" font-size="9">Lucene query</text>
  <text x="500" y="265" text-anchor="middle" fill="#cdd6f4" font-size="9">→ top N doc IDs</text>
  <!-- Return arrows -->
  <line x1="100" y1="280" x2="350" y2="310" stroke="#a6e3a1" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <line x1="300" y1="280" x2="370" y2="310" stroke="#a6e3a1" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <line x1="500" y1="280" x2="420" y2="310" stroke="#a6e3a1" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <!-- Merge -->
  <rect x="310" y="305" width="180" height="30" rx="4" fill="#45475a" stroke="#a6e3a1" stroke-width="1"/>
  <text x="400" y="325" text-anchor="middle" fill="#a6e3a1" font-size="10">global sort + top K</text>
  <!-- Fetch Phase -->
  <text x="680" y="185" text-anchor="middle" fill="#f9e2af" font-size="13" font-weight="bold">2. Fetch Phase</text>
  <line x1="490" y1="320" x2="630" y2="310" stroke="#f9e2af" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="610" y="210" width="160" height="110" rx="4" fill="#313244" stroke="#f9e2af" stroke-width="1.5"/>
  <text x="690" y="232" text-anchor="middle" fill="#f9e2af" font-size="10" font-weight="bold">Multi-GET</text>
  <text x="690" y="252" text-anchor="middle" fill="#cdd6f4" font-size="9">fetch _source</text>
  <text x="690" y="267" text-anchor="middle" fill="#cdd6f4" font-size="9">apply highlighting</text>
  <text x="690" y="282" text-anchor="middle" fill="#cdd6f4" font-size="9">stored fields</text>
  <text x="690" y="297" text-anchor="middle" fill="#cdd6f4" font-size="9">script fields</text>
  <!-- Cache layers -->
  <rect x="50" y="360" width="700" height="70" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="1"/>
  <text x="400" y="380" text-anchor="middle" fill="#89b4fa" font-size="11" font-weight="bold">Cache Layers</text>
  <rect x="70" y="393" width="150" height="25" rx="3" fill="#45475a" stroke="#585b70" stroke-width="1"/>
  <text x="145" y="410" text-anchor="middle" fill="#cdd6f4" font-size="9">Node Query Cache</text>
  <rect x="240" y="393" width="150" height="25" rx="3" fill="#45475a" stroke="#585b70" stroke-width="1"/>
  <text x="315" y="410" text-anchor="middle" fill="#cdd6f4" font-size="9">Shard Request Cache</text>
  <rect x="410" y="393" width="150" height="25" rx="3" fill="#45475a" stroke="#585b70" stroke-width="1"/>
  <text x="485" y="410" text-anchor="middle" fill="#cdd6f4" font-size="9">OS Page Cache</text>
  <rect x="580" y="393" width="150" height="25" rx="3" fill="#45475a" stroke="#585b70" stroke-width="1"/>
  <text x="655" y="410" text-anchor="middle" fill="#cdd6f4" font-size="9">Field Data Cache</text>
</svg>