<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="monospace">
  <rect width="800" height="380" fill="#1e1e2e"/>
  <defs><marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#585b70"/></marker></defs>
  <text x="400" y="30" text-anchor="middle" fill="#cdd6f4" font-size="16" font-weight="bold">Blue-Green Reindex with Alias Swap</text>
  <!-- Timeline -->
  <line x1="50" y1="190" x2="750" y2="190" stroke="#585b70" stroke-width="1"/>
  <text x="50" y="210" fill="#cdd6f4" font-size="9">t₀</text>
  <text x="200" y="210" fill="#cdd6f4" font-size="9">t₁</text>
  <text x="500" y="210" fill="#cdd6f4" font-size="9">t₂</text>
  <text x="700" y="210" fill="#cdd6f4" font-size="9">t₃</text>
  <!-- Phase 1: Blue is live -->
  <text x="125" y="55" text-anchor="middle" fill="#89b4fa" font-size="11" font-weight="bold">Phase 1: Blue is Live</text>
  <rect x="50" y="65" width="150" height="50" rx="4" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <text x="125" y="88" text-anchor="middle" fill="#89b4fa" font-size="10">docs-v1 (Blue)</text>
  <text x="125" y="103" text-anchor="middle" fill="#a6e3a1" font-size="9">← alias: docs-read</text>
  <circle cx="50" cy="190" r="4" fill="#89b4fa"/>
  <!-- Phase 2: Reindex in background -->
  <text x="350" y="55" text-anchor="middle" fill="#f9e2af" font-size="11" font-weight="bold">Phase 2: Background Reindex</text>
  <rect x="200" y="65" width="150" height="50" rx="4" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="275" y="88" text-anchor="middle" fill="#89b4fa" font-size="10">docs-v1 (Blue)</text>
  <text x="275" y="103" text-anchor="middle" fill="#a6e3a1" font-size="9">← still serving reads</text>
  <rect x="200" y="130" width="150" height="50" rx="4" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="275" y="153" text-anchor="middle" fill="#a6e3a1" font-size="10">docs-v2 (Green)</text>
  <text x="275" y="168" text-anchor="middle" fill="#f9e2af" font-size="9">← _reindex in progress</text>
  <line x1="275" y1="115" x2="275" y2="130" stroke="#f9e2af" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <circle cx="200" cy="190" r="4" fill="#f9e2af"/>
  <!-- Phase 3: Alias swap -->
  <text x="575" y="55" text-anchor="middle" fill="#a6e3a1" font-size="11" font-weight="bold">Phase 3: Atomic Alias Swap</text>
  <rect x="500" y="65" width="150" height="50" rx="4" fill="#313244" stroke="#585b70" stroke-width="1"/>
  <text x="575" y="88" text-anchor="middle" fill="#cdd6f4" font-size="10">docs-v1 (Blue)</text>
  <text x="575" y="103" text-anchor="middle" fill="#cdd6f4" font-size="9">← alias removed</text>
  <rect x="500" y="130" width="150" height="50" rx="4" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
  <text x="575" y="153" text-anchor="middle" fill="#a6e3a1" font-size="10">docs-v2 (Green)</text>
  <text x="575" y="168" text-anchor="middle" fill="#a6e3a1" font-size="9">← alias: docs-read ★</text>
  <circle cx="500" cy="190" r="4" fill="#a6e3a1"/>
  <!-- Phase 4: Cleanup -->
  <rect x="680" y="130" width="90" height="50" rx="4" fill="#313244" stroke="#f38ba8" stroke-width="1"/>
  <text x="725" y="153" text-anchor="middle" fill="#f38ba8" font-size="9">delete</text>
  <text x="725" y="168" text-anchor="middle" fill="#f38ba8" font-size="9">docs-v1</text>
  <circle cx="700" cy="190" r="4" fill="#f38ba8"/>
  <!-- Alias API -->
  <rect x="50" y="230" width="700" height="65" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="1"/>
  <text x="400" y="253" text-anchor="middle" fill="#89b4fa" font-size="11" font-weight="bold">_aliases API (atomic swap)</text>
  <text x="70" y="275" fill="#cdd6f4" font-size="9">POST /_aliases { "actions": [ { "remove": { "index": "docs-v1", "alias": "docs-read" } },</text>
  <text x="70" y="289" fill="#cdd6f4" font-size="9">                                  { "add":    { "index": "docs-v2", "alias": "docs-read" } } ] }</text>
  <!-- Rollback note -->
  <rect x="50" y="310" width="340" height="55" rx="4" fill="#313244" stroke="#f38ba8" stroke-width="1"/>
  <text x="220" y="332" text-anchor="middle" fill="#f38ba8" font-size="10" font-weight="bold">Rollback Plan</text>
  <text x="65" y="350" fill="#cdd6f4" font-size="9">Keep docs-v1 for 24h after swap.</text>
  <text x="65" y="362" fill="#cdd6f4" font-size="9">Swap alias back if NDCG drops below threshold.</text>
  <!-- Write alias note -->
  <rect x="420" y="310" width="330" height="55" rx="4" fill="#313244" stroke="#f9e2af" stroke-width="1"/>
  <text x="585" y="332" text-anchor="middle" fill="#f9e2af" font-size="10" font-weight="bold">Write Alias Pattern</text>
  <text x="435" y="350" fill="#cdd6f4" font-size="9">docs-write → always points to latest</text>
  <text x="435" y="362" fill="#cdd6f4" font-size="9">Separate read/write aliases for zero downtime.</text>
</svg>