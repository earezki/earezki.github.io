<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="monospace">
  <rect width="800" height="500" fill="#1e1e2e"/>
  <text x="400" y="35" text-anchor="middle" fill="#cdd6f4" font-size="16" font-weight="bold">Inverted Index Structure</text>
  <!-- Terms Dictionary -->
  <rect x="40" y="60" width="200" height="30" rx="4" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="140" y="80" text-anchor="middle" fill="#89b4fa" font-size="12" font-weight="bold">Terms Dictionary</text>
  <rect x="40" y="100" width="200" height="25" rx="2" fill="#45475a"/>
  <text x="50" y="117" fill="#cdd6f4" font-size="11">authenticate</text>
  <rect x="40" y="130" width="200" height="25" rx="2" fill="#45475a"/>
  <text x="50" y="147" fill="#cdd6f4" font-size="11">connection</text>
  <rect x="40" y="160" width="200" height="25" rx="2" fill="#45475a"/>
  <text x="50" y="177" fill="#cdd6f4" font-size="11">timeout</text>
  <rect x="40" y="190" width="200" height="25" rx="2" fill="#45475a"/>
  <text x="50" y="207" fill="#cdd6f4" font-size="11">http</text>
  <rect x="40" y="220" width="200" height="25" rx="2" fill="#45475a"/>
  <text x="50" y="237" fill="#cdd6f4" font-size="11">client</text>
  <!-- Postings Lists -->
  <rect x="300" y="60" width="240" height="30" rx="4" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="420" y="80" text-anchor="middle" fill="#a6e3a1" font-size="12" font-weight="bold">Postings Lists</text>
  <line x1="240" y1="112" x2="300" y2="112" stroke="#585b70" stroke-width="1"/>
  <rect x="300" y="100" width="240" height="25" rx="2" fill="#45475a"/>
  <text x="310" y="117" fill="#a6e3a1" font-size="10">doc1:3  doc4:1  doc7:2</text>
  <line x1="240" y1="142" x2="300" y2="142" stroke="#585b70" stroke-width="1"/>
  <rect x="300" y="130" width="240" height="25" rx="2" fill="#45475a"/>
  <text x="310" y="147" fill="#a6e3a1" font-size="10">doc1:1  doc2:5  doc3:2  doc7:1</text>
  <line x1="240" y1="172" x2="300" y2="172" stroke="#585b70" stroke-width="1"/>
  <rect x="300" y="160" width="240" height="25" rx="2" fill="#45475a"/>
  <text x="310" y="177" fill="#a6e3a1" font-size="10">doc2:3  doc3:1  doc5:4</text>
  <line x1="240" y1="202" x2="300" y2="202" stroke="#585b70" stroke-width="1"/>
  <rect x="300" y="190" width="240" height="25" rx="2" fill="#45475a"/>
  <text x="310" y="207" fill="#a6e3a1" font-size="10">doc1:2  doc2:1  doc5:1  doc7:3</text>
  <line x1="240" y1="232" x2="300" y2="232" stroke="#585b70" stroke-width="1"/>
  <rect x="300" y="220" width="240" height="25" rx="2" fill="#45475a"/>
  <text x="310" y="237" fill="#a6e3a1" font-size="10">doc1:1  doc5:2  doc7:1</text>
  <!-- Stored Fields -->
  <rect x="600" y="60" width="170" height="30" rx="4" fill="#313244" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="685" y="80" text-anchor="middle" fill="#f38ba8" font-size="12" font-weight="bold">Stored Fields</text>
  <rect x="600" y="100" width="170" height="50" rx="2" fill="#45475a"/>
  <text x="610" y="117" fill="#f38ba8" font-size="10">doc1: {title, body,</text>
  <text x="610" y="132" fill="#f38ba8" font-size="10">  _source}</text>
  <rect x="600" y="155" width="170" height="50" rx="2" fill="#45475a"/>
  <text x="610" y="172" fill="#f38ba8" font-size="10">doc2: {title, body,</text>
  <text x="610" y="187" fill="#f38ba8" font-size="10">  _source}</text>
  <!-- Segments -->
  <text x="400" y="290" text-anchor="middle" fill="#cdd6f4" font-size="14" font-weight="bold">Segment Architecture</text>
  <rect x="60" y="310" width="180" height="120" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <text x="150" y="335" text-anchor="middle" fill="#89b4fa" font-size="12" font-weight="bold">Segment 0</text>
  <text x="150" y="355" text-anchor="middle" fill="#cdd6f4" font-size="10">immutable</text>
  <text x="80" y="380" fill="#cdd6f4" font-size="10">terms: 12,340</text>
  <text x="80" y="400" fill="#cdd6f4" font-size="10">docs: 50,000</text>
  <text x="80" y="420" fill="#cdd6f4" font-size="10">size: 28MB</text>
  <rect x="280" y="310" width="180" height="120" rx="6" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
  <text x="370" y="335" text-anchor="middle" fill="#a6e3a1" font-size="12" font-weight="bold">Segment 1</text>
  <text x="370" y="355" text-anchor="middle" fill="#cdd6f4" font-size="10">immutable</text>
  <text x="300" y="380" fill="#cdd6f4" font-size="10">terms: 8,200</text>
  <text x="300" y="400" fill="#cdd6f4" font-size="10">docs: 35,000</text>
  <text x="300" y="420" fill="#cdd6f4" font-size="10">size: 19MB</text>
  <rect x="500" y="310" width="180" height="120" rx="6" fill="#313244" stroke="#f9e2af" stroke-width="2"/>
  <text x="590" y="335" text-anchor="middle" fill="#f9e2af" font-size="12" font-weight="bold">Segment 2</text>
  <text x="590" y="355" text-anchor="middle" fill="#f9e2af" font-size="10">newest (in-memory buffer)</text>
  <text x="520" y="380" fill="#cdd6f4" font-size="10">terms: 1,500</text>
  <text x="520" y="400" fill="#cdd6f4" font-size="10">docs: 5,000</text>
  <text x="520" y="420" fill="#cdd6f4" font-size="10">size: 3MB</text>
  <text x="400" y="470" text-anchor="middle" fill="#cdd6f4" font-size="11">Search queries fan out across all segments, merging results</text>
</svg>