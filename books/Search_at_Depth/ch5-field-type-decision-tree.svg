<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="monospace">
  <rect width="800" height="500" fill="#1e1e2e"/>
  <text x="400" y="30" text-anchor="middle" fill="#cdd6f4" font-size="16" font-weight="bold">Field Type Decision Tree</text>
  <!-- Root -->
  <rect x="280" y="50" width="240" height="35" rx="4" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <text x="400" y="73" text-anchor="middle" fill="#89b4fa" font-size="11">What operations on this field?</text>
  <!-- Branch: Full-text search -->
  <line x1="330" y1="85" x2="150" y2="130" stroke="#585b70" stroke-width="1.5"/>
  <text x="220" y="110" fill="#cdd6f4" font-size="9">full-text search</text>
  <rect x="50" y="130" width="200" height="35" rx="4" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="150" y="152" text-anchor="middle" fill="#a6e3a1" font-size="11">text + analyzer</text>
  <!-- Branch: Exact match / filter / agg -->
  <line x1="400" y1="85" x2="400" y2="130" stroke="#585b70" stroke-width="1.5"/>
  <text x="405" y="115" fill="#cdd6f4" font-size="9">filter / agg / sort</text>
  <rect x="300" y="130" width="200" height="35" rx="4" fill="#313244" stroke="#f9e2af" stroke-width="1.5"/>
  <text x="400" y="152" text-anchor="middle" fill="#f9e2af" font-size="11">keyword</text>
  <!-- Branch: Both -->
  <line x1="470" y1="85" x2="650" y2="130" stroke="#585b70" stroke-width="1.5"/>
  <text x="580" y="110" fill="#cdd6f4" font-size="9">both</text>
  <rect x="550" y="130" width="200" height="35" rx="4" fill="#313244" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="650" y="152" text-anchor="middle" fill="#f38ba8" font-size="11">text + keyword sub-field</text>
  <!-- Numeric branch -->
  <line x1="150" y1="165" x2="150" y2="200" stroke="#585b70" stroke-width="1"/>
  <text x="155" y="190" fill="#cdd6f4" font-size="9">numeric?</text>
  <rect x="50" y="200" width="200" height="35" rx="4" fill="#313244" stroke="#cba6f7" stroke-width="1.5"/>
  <text x="150" y="222" text-anchor="middle" fill="#cba6f7" font-size="11">integer / long / float</text>
  <!-- Date branch -->
  <line x1="400" y1="165" x2="400" y2="200" stroke="#585b70" stroke-width="1"/>
  <text x="405" y="190" fill="#cdd6f4" font-size="9">date?</text>
  <rect x="300" y="200" width="200" height="35" rx="4" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="400" y="222" text-anchor="middle" fill="#89b4fa" font-size="11">date (strict_date)</text>
  <!-- Nested vs Object -->
  <text x="400" y="280" text-anchor="middle" fill="#cdd6f4" font-size="14" font-weight="bold">Nested vs Object Decision</text>
  <rect x="250" y="295" width="300" height="35" rx="4" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <text x="400" y="318" text-anchor="middle" fill="#89b4fa" font-size="11">Array of objects with cross-field queries?</text>
  <line x1="330" y1="330" x2="200" y2="370" stroke="#585b70" stroke-width="1.5"/>
  <text x="240" y="355" fill="#a6e3a1" font-size="10">yes</text>
  <rect x="80" y="370" width="240" height="50" rx="4" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="200" y="392" text-anchor="middle" fill="#a6e3a1" font-size="11" font-weight="bold">nested</text>
  <text x="200" y="410" text-anchor="middle" fill="#cdd6f4" font-size="9">preserves field associations</text>
  <line x1="470" y1="330" x2="600" y2="370" stroke="#585b70" stroke-width="1.5"/>
  <text x="560" y="355" fill="#f38ba8" font-size="10">no</text>
  <rect x="480" y="370" width="240" height="50" rx="4" fill="#313244" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="600" y="392" text-anchor="middle" fill="#f38ba8" font-size="11" font-weight="bold">object</text>
  <text x="600" y="410" text-anchor="middle" fill="#cdd6f4" font-size="9">flattened, no hidden docs</text>
  <!-- Warning -->
  <rect x="150" y="440" width="500" height="30" rx="4" fill="#45475a" stroke="#f38ba8" stroke-width="1"/>
  <text x="400" y="460" text-anchor="middle" fill="#f38ba8" font-size="10">⚠ dynamic: strict — never allow automatic field creation in production</text>
</svg>