<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="monospace">
  <rect width="800" height="380" fill="#1e1e2e"/>
  <defs><marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#585b70"/></marker></defs>
  <text x="400" y="30" text-anchor="middle" fill="#cdd6f4" font-size="16" font-weight="bold">Hot → Warm → Cold Architecture with ISM</text>
  <!-- Timeline arrow -->
  <line x1="50" y1="180" x2="750" y2="180" stroke="#585b70" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="750" y="200" fill="#cdd6f4" font-size="9">time</text>
  <!-- Hot tier -->
  <rect x="50" y="55" width="200" height="110" rx="8" fill="#313244" stroke="#f38ba8" stroke-width="2"/>
  <text x="150" y="80" text-anchor="middle" fill="#f38ba8" font-size="14" font-weight="bold">HOT</text>
  <text x="65" y="100" fill="#cdd6f4" font-size="9">NVMe SSD</text>
  <text x="65" y="115" fill="#cdd6f4" font-size="9">1 primary + 1 replica</text>
  <text x="65" y="130" fill="#cdd6f4" font-size="9">refresh_interval: 1s</text>
  <text x="65" y="145" fill="#cdd6f4" font-size="9">active write + search</text>
  <text x="65" y="158" fill="#cdd6f4" font-size="9">age: 0 → 7 days</text>
  <!-- ISM transition 1 -->
  <line x1="250" y1="110" x2="310" y2="110" stroke="#f9e2af" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="280" y="100" text-anchor="middle" fill="#f9e2af" font-size="9">ISM</text>
  <text x="280" y="88" text-anchor="middle" fill="#f9e2af" font-size="8">7 days</text>
  <!-- Warm tier -->
  <rect x="315" y="55" width="200" height="110" rx="8" fill="#313244" stroke="#f9e2af" stroke-width="2"/>
  <text x="415" y="80" text-anchor="middle" fill="#f9e2af" font-size="14" font-weight="bold">WARM</text>
  <text x="330" y="100" fill="#cdd6f4" font-size="9">SATA SSD</text>
  <text x="330" y="115" fill="#cdd6f4" font-size="9">1 primary + 0 replicas</text>
  <text x="330" y="130" fill="#cdd6f4" font-size="9">refresh_interval: 30s</text>
  <text x="330" y="145" fill="#cdd6f4" font-size="9">force_merge: 1 segment</text>
  <text x="330" y="158" fill="#cdd6f4" font-size="9">age: 7 → 30 days</text>
  <!-- ISM transition 2 -->
  <line x1="515" y1="110" x2="575" y2="110" stroke="#89b4fa" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="545" y="100" text-anchor="middle" fill="#89b4fa" font-size="9">ISM</text>
  <text x="545" y="88" text-anchor="middle" fill="#89b4fa" font-size="8">30 days</text>
  <!-- Cold tier -->
  <rect x="580" y="55" width="190" height="110" rx="8" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <text x="675" y="80" text-anchor="middle" fill="#89b4fa" font-size="14" font-weight="bold">COLD</text>
  <text x="595" y="100" fill="#cdd6f4" font-size="9">HDD / S3 (remote)</text>
  <text x="595" y="115" fill="#cdd6f4" font-size="9">read-only</text>
  <text x="595" y="130" fill="#cdd6f4" font-size="9">index.blocks.write: true</text>
  <text x="595" y="145" fill="#cdd6f4" font-size="9">search only (slow)</text>
  <text x="595" y="158" fill="#cdd6f4" font-size="9">age: 30 → 90 days</text>
  <!-- Delete -->
  <rect x="630" y="210" width="120" height="35" rx="4" fill="#45475a" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="690" y="232" text-anchor="middle" fill="#f38ba8" font-size="10" font-weight="bold">DELETE</text>
  <line x1="690" y1="165" x2="690" y2="210" stroke="#f38ba8" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="700" y="195" fill="#f38ba8" font-size="8">90 days</text>
  <!-- ISM Policy -->
  <rect x="50" y="260" width="700" height="100" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="1"/>
  <text x="400" y="285" text-anchor="middle" fill="#89b4fa" font-size="12" font-weight="bold">ISM Policy Configuration</text>
  <text x="70" y="308" fill="#cdd6f4" font-size="10">states: [hot, warm, cold, delete]</text>
  <text x="70" y="325" fill="#cdd6f4" font-size="10">transitions: min_index_age → force_merge → replica_count → allocation → read_only → delete</text>
  <text x="70" y="342" fill="#cdd6f4" font-size="10">error_notification: SNS/webhook on transition failure</text>
  <text x="70" y="355" fill="#cdd6f4" font-size="9">ism_template: [{ index_patterns: ["docs-*"], priority: 100 }]</text>
</svg>