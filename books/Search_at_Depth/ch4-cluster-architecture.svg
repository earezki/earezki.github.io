<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="monospace">
  <rect width="800" height="450" fill="#1e1e2e"/>
  <text x="400" y="30" text-anchor="middle" fill="#cdd6f4" font-size="16" font-weight="bold">Cluster Architecture</text>
  <!-- Cluster Manager Nodes -->
  <text x="400" y="60" text-anchor="middle" fill="#cdd6f4" font-size="11">Cluster Manager Nodes (quorum: 2/3)</text>
  <rect x="150" y="70" width="100" height="50" rx="6" fill="#313244" stroke="#f9e2af" stroke-width="2"/>
  <text x="200" y="100" text-anchor="middle" fill="#f9e2af" font-size="10">CM-1 ★</text>
  <rect x="350" y="70" width="100" height="50" rx="6" fill="#313244" stroke="#f9e2af" stroke-width="1.5"/>
  <text x="400" y="100" text-anchor="middle" fill="#f9e2af" font-size="10">CM-2</text>
  <rect x="550" y="70" width="100" height="50" rx="6" fill="#313244" stroke="#f9e2af" stroke-width="1.5"/>
  <text x="600" y="100" text-anchor="middle" fill="#f9e2af" font-size="10">CM-3</text>
  <!-- Coordinating Node -->
