  <rect x="45" y="270" width="65" height="30" rx="3" fill="#45475a" stroke="#a6e3a1" stroke-width="1"/>
  <text x="77" y="290" text-anchor="middle" fill="#a6e3a1" font-size="9">P0</text>
  <rect x="120" y="270" width="65" height="30" rx="3" fill="#45475a" stroke="#585b70" stroke-width="1"/>
  <text x="152" y="290" text-anchor="middle" fill="#cdd6f4" font-size="9">R1</text>
  <rect x="45" y="310" width="65" height="30" rx="3" fill="#45475a" stroke="#a6e3a1" stroke-width="1"/>
  <text x="77" y="330" text-anchor="middle" fill="#a6e3a1" font-size="9">P3</text>
  <rect x="120" y="310" width="65" height="30" rx="3" fill="#45475a" stroke="#585b70" stroke-width="1"/>
  <text x="152" y="330" text-anchor="middle" fill="#cdd6f4" font-size="9">R4</text>
  <text x="115" y="370" text-anchor="middle" fill="#cdd6f4" font-size="9">temp: hot</text>
  <text x="115" y="385" text-anchor="middle" fill="#cdd6f4" font-size="9">NVMe SSD</text>
  <!-- Node 2 -->
  <rect x="220" y="235" width="170" height="190" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="305" y="258" text-anchor="middle" fill="#89b4fa" font-size="11" font-weight="bold">Data Node 2</text>
  <rect x="235" y="270" width="65" height="30" rx="3" fill="#45475a" stroke="#a6e3a1" stroke-width="1"/>
  <text x="267" y="290" text-anchor="middle" fill="#a6e3a1" font-size="9">P1</text>
  <rect x="310" y="270" width="65" height="30" rx="3" fill="#45475a" stroke="#585b70" stroke-width="1"/>
  <text x="342" y="290" text-anchor="middle" fill="#cdd6f4" font-size="9">R0</text>
  <rect x="235" y="310" width="65" height="30" rx="3" fill="#45475a" stroke="#a6e3a1" stroke-width="1"/>
  <text x="267" y="330" text-anchor="middle" fill="#a6e3a1" font-size="9">P4</text>
  <rect x="310" y="310" width="65" height="30" rx="3" fill="#45475a" stroke="#585b70" stroke-width="1"/>
  <text x="342" y="330" text-anchor="middle" fill="#cdd6f4" font-size="9">R3</text>
  <text x="305" y="370" text-anchor="middle" fill="#cdd6f4" font-size="9">temp: hot</text>
  <text x="305" y="385" text-anchor="middle" fill="#cdd6f4" font-size="9">NVMe SSD</text>
  <!-- Node 3 -->
  <rect x="410" y="235" width="170" height="190" rx="6" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="495" y="258" text-anchor="middle" fill="#a6e3a1" font-size="11" font-weight="bold">Data Node 3</text>
  <rect x="425" y="270" width="65" height="30" rx="3" fill="#45475a" stroke="#a6e3a1" stroke-width="1"/>
  <text x="457" y="290" text-anchor="middle" fill="#a6e3a1" font-size="9">P2</text>
  <rect x="500" y="270" width="65" height="30" rx="3" fill="#45475a" stroke="#585b70" stroke-width="1"/>
  <text x="532" y="290" text-anchor="middle" fill="#cdd6f4" font-size="9">R1</text>
  <text x="495" y="370" text-anchor="middle" fill="#cdd6f4" font-size="9">temp: warm</text>
  <text x="495" y="385" text-anchor="middle" fill="#cdd6f4" font-size="9">SATA SSD</text>
  <!-- Node 4 -->
  <rect x="600" y="235" width="170" height="190" rx="6" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="685" y="258" text-anchor="middle" fill="#a6e3a1" font-size="11" font-weight="bold">Data Node 4</text>
  <rect x="615" y="270" width="65" height="30" rx="3" fill="#45475a" stroke="#585b70" stroke-width="1"/>
  <text x="647" y="290" text-anchor="middle" fill="#cdd6f4" font-size="9">R2</text>
  <rect x="690" y="270" width="65" height="30" rx="3" fill="#45475a" stroke="#a6e3a1" stroke-width="1"/>
  <text x="722" y="290" text-anchor="middle" fill="#a6e3a1" font-size="9">P5</text>
  <text x="685" y="370" text-anchor="middle" fill="#cdd6f4" font-size="9">temp: warm</text>
  <text x="685" y="385" text-anchor="middle" fill="#cdd6f4" font-size="9">SATA SSD</text>
  <!-- Legend -->
  <rect x="30" y="435" width="15" height="10" fill="#45475a" stroke="#a6e3a1" stroke-width="1"/>
  <text x="52" y="444" fill="#a6e3a1" font-size="9">Primary</text>
  <rect x="110" y="435" width="15" height="10" fill="#45475a" stroke="#585b70" stroke-width="1"/>
  <text x="132" y="444" fill="#cdd6f4" font-size="9">Replica</text>
  <text x="200" y="444" fill="#f9e2af" font-size="9">★ = Active Cluster Manager</text>
