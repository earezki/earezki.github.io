<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="monospace">
  <rect width="800" height="420" fill="#1e1e2e"/>
  <defs><marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#585b70"/></marker></defs>
  <text x="400" y="30" text-anchor="middle" fill="#cdd6f4" font-size="16" font-weight="bold">Bulk Write Path Under Load</text>
  <!-- Application -->
  <rect x="30" y="55" width="140" height="40" rx="4" fill="#313244" stroke="#cba6f7" stroke-width="1.5"/>
  <text x="100" y="80" text-anchor="middle" fill="#cba6f7" font-size="11">Application</text>
  <line x1="170" y1="75" x2="210" y2="75" stroke="#585b70" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- Bulk processor -->
  <rect x="215" y="50" width="180" height="50" rx="6" fill="#313244" stroke="#f9e2af" stroke-width="2"/>
  <text x="305" y="70" text-anchor="middle" fill="#f9e2af" font-size="11" font-weight="bold">Bulk Processor</text>
  <text x="305" y="88" text-anchor="middle" fill="#cdd6f4" font-size="9">batch: 500 docs / 5MB / 2s</text>
  <line x1="395" y1="75" x2="435" y2="75" stroke="#585b70" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- Coordinating node -->
  <rect x="440" y="50" width="160" height="50" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="520" y="70" text-anchor="middle" fill="#89b4fa" font-size="11" font-weight="bold">Coordinator</text>
  <text x="520" y="88" text-anchor="middle" fill="#cdd6f4" font-size="9">route by _id hash</text>
  <!-- Fan out to primaries -->
  <line x1="480" y1="100" x2="150" y2="155" stroke="#585b70" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="520" y1="100" x2="400" y2="155" stroke="#585b70" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="560" y1="100" x2="650" y2="155" stroke="#585b70" stroke-width="1" marker-end="url(#arr)"/>
  <!-- Primary shards with internal write path -->
  <rect x="50" y="155" width="200" height="135" rx="4" fill="#313244" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="150" y="175" text-anchor="middle" fill="#a6e3a1" font-size="10" font-weight="bold">Primary Shard P0</text>
  <rect x="65" y="185" width="170" height="20" rx="2" fill="#45475a"/>
  <text x="150" y="200" text-anchor="middle" fill="#f9e2af" font-size="9">1. Write to translog</text>
  <rect x="65" y="210" width="170" height="20" rx="2" fill="#45475a"/>
  <text x="150" y="225" text-anchor="middle" fill="#f9e2af" font-size="9">2. Index in-memory buffer</text>
  <rect x="65" y="235" width="170" height="20" rx="2" fill="#45475a"/>
  <text x="150" y="250" text-anchor="middle" fill="#f9e2af" font-size="9">3. Refresh → new segment</text>
  <rect x="65" y="260" width="170" height="20" rx="2" fill="#45475a"/>
  <text x="150" y="275" text-anchor="middle" fill="#f9e2af" font-size="9">4. Replicate to replica</text>
  <rect x="300" y="155" width="200" height="50" rx="4" fill="#313244" stroke="#a6e3a1" stroke-width="1"/>
  <text x="400" y="178" text-anchor="middle" fill="#a6e3a1" font-size="10">Primary P1</text>
  <text x="400" y="196" text-anchor="middle" fill="#cdd6f4" font-size="9">(same path)</text>
  <rect x="550" y="155" width="200" height="50" rx="4" fill="#313244" stroke="#a6e3a1" stroke-width="1"/>
  <text x="650" y="178" text-anchor="middle" fill="#a6e3a1" font-size="10">Primary P2</text>
  <text x="650" y="196" text-anchor="middle" fill="#cdd6f4" font-size="9">(same path)</text>
  <!-- Merge queue -->
  <rect x="300" y="230" width="450" height="60" rx="4" fill="#313244" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="525" y="252" text-anchor="middle" fill="#f38ba8" font-size="11" font-weight="bold">Merge Scheduler</text>
  <text x="315" y="275" fill="#cdd6f4" font-size="9">max_thread_count: Math.max(1, cores/2)  |  throttle: 20MB/s (merges) → IO pressure</text>
  <!-- Bulk tuning -->
  <rect x="50" y="315" width="340" height="90" rx="4" fill="#313244" stroke="#89b4fa" stroke-width="1"/>
  <text x="220" y="338" text-anchor="middle" fill="#89b4fa" font-size="11" font-weight="bold">High-Write Tuning</text>
  <text x="65" y="358" fill="#cdd6f4" font-size="9">refresh_interval: -1 (during bulk)</text>
  <text x="65" y="373" fill="#cdd6f4" font-size="9">number_of_replicas: 0 (during bulk)</text>
  <text x="65" y="388" fill="#cdd6f4" font-size="9">translog.durability: async</text>
  <text x="65" y="400" fill="#cdd6f4" font-size="9">⚠ restore replicas + refresh after bulk</text>
  <!-- Backpressure -->
  <rect x="420" y="315" width="340" height="90" rx="4" fill="#313244" stroke="#f38ba8" stroke-width="1"/>
  <text x="590" y="338" text-anchor="middle" fill="#f38ba8" font-size="11" font-weight="bold">Backpressure Signals</text>
  <text x="435" y="358" fill="#cdd6f4" font-size="9">429 Too Many Requests → reduce batch</text>
  <text x="435" y="373" fill="#cdd6f4" font-size="9">thread_pool.write.rejected++</text>
  <text x="435" y="388" fill="#cdd6f4" font-size="9">bulk response items[].error → retry</text>
  <text x="435" y="400" fill="#cdd6f4" font-size="9">exponential backoff: 50ms, 100ms, 200ms</text>
</svg>