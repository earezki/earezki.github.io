<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="600" height="480" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="x86-64 stack frame layout diagram">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <marker id="arrowRight" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3b82f6"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="600" height="480" rx="12" fill="url(#bg)" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Title -->
  <text x="300" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b">x86-64 Stack Frame Layout</text>
  <text x="300" y="50" text-anchor="middle" font-size="11" fill="#64748b">Memory during execution of a called function</text>

  <!-- HIGH ADDRESSES label -->
  <text x="200" y="74" text-anchor="middle" font-size="10" font-weight="600" fill="#64748b" letter-spacing="1">▲  HIGH ADDRESSES</text>

  <!-- ── Stack sections (x=60, w=280) ── -->

  <!-- Caller's frame (gray, dashed top border) -->
  <rect x="60" y="82" width="280" height="52" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,3" filter="url(#shadow)"/>
  <text x="200" y="103" text-anchor="middle" font-size="13" fill="#64748b" font-style="italic">...caller's frame...</text>
  <text x="200" y="120" text-anchor="middle" font-size="10" fill="#94a3b8">(higher stack frames above)</text>

  <!-- Return address (blue) -->
  <rect x="60" y="134" width="280" height="48" rx="3" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="200" y="156" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">Return address</text>
  <text x="200" y="172" text-anchor="middle" font-size="10" fill="#3b82f6">8 bytes  ·  x86-64 pointer size</text>

  <!-- Saved RBP (blue) -->
  <rect x="60" y="182" width="280" height="48" rx="3" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="200" y="202" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">Saved RBP</text>
  <text x="200" y="218" text-anchor="middle" font-size="10" fill="#3b82f6">(optional — omitted by leaf functions)</text>

  <!-- RBP divider line (frame base) -->
  <line x1="60" y1="230" x2="340" y2="230" stroke="#3b82f6" stroke-width="2.5"/>

  <!-- Local variables (green) -->
  <rect x="60" y="230" width="280" height="85" rx="0" fill="#dcfce7" stroke="#86efac" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="200" y="264" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">Local variables</text>
  <text x="200" y="281" text-anchor="middle" font-size="10" fill="#16a34a">(if any)  ·  size determined at compile time</text>
  <text x="200" y="298" text-anchor="middle" font-size="10" fill="#16a34a">may include spilled registers, temporaries</text>

  <!-- RSP divider line (stack top) -->
  <line x1="60" y1="315" x2="340" y2="315" stroke="#10b981" stroke-width="2.5"/>

  <!-- Future growth (light, dashed) -->
  <rect x="60" y="315" width="280" height="50" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="200" y="343" text-anchor="middle" font-size="12" fill="#94a3b8">(future growth ↓)</text>

  <!-- LOW ADDRESSES label -->
  <text x="200" y="385" text-anchor="middle" font-size="10" font-weight="600" fill="#64748b" letter-spacing="1">▼  LOW ADDRESSES</text>

  <!-- ── Right-side annotations ── -->

  <!-- Return address annotation -->
  <line x1="342" y1="158" x2="362" y2="158" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowRight)"/>
  <text x="368" y="154" font-size="10.5" fill="#334155">← pushed by CALL</text>
  <text x="368" y="167" font-size="10.5" fill="#334155">instruction</text>

  <!-- Saved RBP annotation -->
  <line x1="342" y1="206" x2="362" y2="206" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowRight)"/>
  <text x="368" y="202" font-size="10.5" fill="#334155">← frame pointer,</text>
  <text x="368" y="215" font-size="10.5" fill="#334155">if not omitted</text>

  <!-- RBP line annotation -->
  <line x1="342" y1="230" x2="362" y2="230" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <text x="368" y="226" font-size="11" font-weight="700" fill="#1d4ed8">RBP  →</text>
  <text x="368" y="239" font-size="10" fill="#334155">frame base</text>

  <!-- RSP line annotation -->
  <line x1="342" y1="315" x2="362" y2="315" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="368" y="311" font-size="11" font-weight="700" fill="#047857">RSP  →</text>
  <text x="368" y="324" font-size="10" fill="#334155">stack top (current)</text>

  <!-- Left side: vertical address arrow -->
  <line x1="42" y1="355" x2="42" y2="90" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="38 90, 46 90, 42 82" fill="#94a3b8"/>
  <polygon points="38 355, 46 355, 42 363" fill="#94a3b8"/>

  <!-- Footer notes -->
  <text x="300" y="415" text-anchor="middle" font-size="10.5" fill="#64748b" font-style="italic">Stack grows downward (toward lower addresses) on x86-64</text>
  <text x="300" y="432" text-anchor="middle" font-size="10.5" fill="#64748b" font-style="italic">Prologue: push rbp / mov rbp,rsp / sub rsp,N   ·   Epilogue: mov rsp,rbp / pop rbp / ret</text>
  <text x="300" y="449" text-anchor="middle" font-size="10.5" fill="#64748b" font-style="italic">Compiler may eliminate frame entirely for simple leaf functions (no saved RBP, no local vars)</text>
  <text x="300" y="468" text-anchor="middle" font-size="10" fill="#94a3b8">System V AMD64 ABI — Linux / macOS calling convention</text>
</svg>
