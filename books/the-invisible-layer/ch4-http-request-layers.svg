<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="800" height="550" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="550" rx="12" fill="url(#bg)" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">HTTP Request: Packet Encapsulation</text>
  <text x="400" y="58" text-anchor="middle" font-size="12" fill="#64748b">Each layer wraps the layer above, adding its own header</text>

  <!-- Left column header -->
  <text x="95" y="85" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">PROTOCOL / HEADER</text>
  <!-- Right column header -->
  <text x="680" y="85" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">EXAMPLE FIELDS</text>

  <!-- Layer positions (centered in diagram) -->
  <!-- Ethernet Frame - outermost -->
  <rect x="170" y="95" width="430" height="420" rx="10" fill="#94a3b8" fill-opacity="0.2" stroke="#94a3b8" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="172" y="97" width="426" height="28" rx="6" fill="#94a3b8" fill-opacity="0.35"/>
  <text x="385" y="116" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">Ethernet Frame</text>

  <!-- Left annotation - Ethernet -->
  <text x="160" y="112" text-anchor="end" font-size="11" font-weight="600" fill="#64748b">Ethernet</text>
  <text x="160" y="126" text-anchor="end" font-size="10" fill="#94a3b8">14B header + 4B FCS</text>

  <!-- Right annotation - Ethernet -->
  <text x="610" y="112" font-size="10" fill="#64748b">Dst MAC: aa:bb:cc:dd:ee:ff</text>
  <text x="610" y="126" font-size="10" fill="#64748b">Src MAC: 11:22:33:44:55:66</text>
  <text x="610" y="140" font-size="10" fill="#64748b">EtherType: 0x0800 (IPv4)</text>

  <!-- IP Packet -->
  <rect x="195" y="135" width="380" height="345" rx="9" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="2.5"/>
  <rect x="197" y="137" width="376" height="28" rx="6" fill="#3b82f6" fill-opacity="0.3"/>
  <text x="385" y="156" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a5f">IP Packet</text>

  <!-- Left annotation - IP -->
  <text x="185" y="152" text-anchor="end" font-size="11" font-weight="600" fill="#3b82f6">IPv4</text>
  <text x="185" y="166" text-anchor="end" font-size="10" fill="#60a5fa">20B header</text>

  <!-- Right annotation - IP -->
  <text x="610" y="156" font-size="10" fill="#3b82f6">Src: 192.168.1.42</text>
  <text x="610" y="170" font-size="10" fill="#3b82f6">Dst: 93.184.216.34</text>
  <text x="610" y="184" font-size="10" fill="#3b82f6">TTL: 64, Proto: TCP(6)</text>

  <!-- TCP Segment -->
  <rect x="220" y="175" width="330" height="270" rx="8" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="2.5"/>
  <rect x="222" y="177" width="326" height="28" rx="6" fill="#10b981" fill-opacity="0.3"/>
  <text x="385" y="196" text-anchor="middle" font-size="12" font-weight="600" fill="#064e3b">TCP Segment</text>

  <!-- Left annotation - TCP -->
  <text x="210" y="192" text-anchor="end" font-size="11" font-weight="600" fill="#10b981">TCP</text>
  <text x="210" y="206" text-anchor="end" font-size="10" fill="#34d399">20B header</text>

  <!-- Right annotation - TCP -->
  <text x="610" y="196" font-size="10" fill="#10b981">Src Port: 52431</text>
  <text x="610" y="210" font-size="10" fill="#10b981">Dst Port: 443 (HTTPS)</text>
  <text x="610" y="224" font-size="10" fill="#10b981">Seq: 1001, Ack: 5001</text>

  <!-- TLS Record -->
  <rect x="245" y="215" width="280" height="195" rx="7" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="2.5"/>
  <rect x="247" y="217" width="276" height="28" rx="6" fill="#f59e0b" fill-opacity="0.3"/>
  <text x="385" y="236" text-anchor="middle" font-size="12" font-weight="600" fill="#78350f">TLS Record</text>

  <!-- Left annotation - TLS -->
  <text x="235" y="232" text-anchor="end" font-size="11" font-weight="600" fill="#f59e0b">TLS 1.3</text>
  <text x="235" y="246" text-anchor="end" font-size="10" fill="#fbbf24">5B header</text>

  <!-- Right annotation - TLS -->
  <text x="610" y="236" font-size="10" fill="#d97706">Content: Application Data</text>
  <text x="610" y="250" font-size="10" fill="#d97706">Version: TLS 1.3 (0x0303)</text>
  <text x="610" y="264" font-size="10" fill="#d97706">Encrypted payload</text>

  <!-- HTTP/2 Frame -->
  <rect x="270" y="255" width="230" height="120" rx="6" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-width="2.5"/>
  <rect x="272" y="257" width="226" height="28" rx="6" fill="#8b5cf6" fill-opacity="0.3"/>
  <text x="385" y="276" text-anchor="middle" font-size="12" font-weight="600" fill="#3b0764">HTTP/2 Frame</text>

  <!-- Left annotation - HTTP/2 -->
  <text x="260" y="272" text-anchor="end" font-size="11" font-weight="600" fill="#8b5cf6">HTTP/2</text>
  <text x="260" y="286" text-anchor="end" font-size="10" fill="#a78bfa">9B header</text>

  <!-- Right annotation - HTTP/2 -->
  <text x="610" y="276" font-size="10" fill="#7c3aed">Stream ID: 1</text>
  <text x="610" y="290" font-size="10" fill="#7c3aed">Type: HEADERS (0x01)</text>

  <!-- Application Data (payload) -->
  <rect x="295" y="295" width="180" height="65" rx="5" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="385" y="322" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">Application Data</text>
  <text x="385" y="340" text-anchor="middle" font-size="10" fill="#dc2626">GET /index.html</text>
  <text x="385" y="354" text-anchor="middle" font-size="10" fill="#dc2626">Host: example.com</text>

  <!-- Ethernet trailer -->
  <rect x="172" y="485" width="426" height="22" rx="6" fill="#94a3b8" fill-opacity="0.35"/>
  <text x="385" y="500" text-anchor="middle" font-size="10" font-weight="600" fill="#334155">FCS (Frame Check Sequence – 4 bytes)</text>

  <!-- Bottom summary -->
  <text x="400" y="535" text-anchor="middle" font-size="11" fill="#64748b">Total overhead per HTTP request: ~68 bytes of headers wrapping the payload</text>
</svg>