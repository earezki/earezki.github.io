<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3b82f6"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981"/>
    </marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#d97706"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8b5cf6"/>
    </marker>
    <marker id="arrowGray" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="650" rx="12" fill="url(#bg)" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">TCP Connection State Machine</text>

  <!-- Legend -->
  <rect x="20" y="52" width="860" height="28" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
  <circle cx="40" cy="66" r="6" fill="#3b82f6"/>
  <text x="52" y="70" font-size="10" fill="#475569">Connection Setup</text>
  <circle cx="170" cy="66" r="6" fill="#10b981"/>
  <text x="182" y="70" font-size="10" fill="#475569">Established</text>
  <circle cx="270" cy="66" r="6" fill="#f59e0b"/>
  <text x="282" y="70" font-size="10" fill="#475569">Active Close</text>
  <circle cx="380" cy="66" r="6" fill="#8b5cf6"/>
  <text x="392" y="70" font-size="10" fill="#475569">Passive Close</text>
  <circle cx="490" cy="66" r="6" fill="#94a3b8"/>
  <text x="502" y="70" font-size="10" fill="#475569">Closed</text>
  <line x1="590" y1="66" x2="630" y2="66" stroke="#3b82f6" stroke-width="2.5" stroke-dasharray="6,3"/>
  <text x="636" y="70" font-size="10" fill="#475569">Client path</text>
  <line x1="720" y1="66" x2="760" y2="66" stroke="#8b5cf6" stroke-width="2.5" stroke-dasharray="2,3"/>
  <text x="766" y="70" font-size="10" fill="#475569">Server path</text>

  <!-- ==================== STATES ==================== -->

  <!-- CLOSED (top center) -->
  <rect x="370" y="95" width="130" height="42" rx="10" fill="#94a3b8" fill-opacity="0.2" stroke="#94a3b8" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="435" y="121" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">CLOSED</text>

  <!-- LISTEN (left, below closed) -->
  <rect x="80" y="185" width="130" height="42" rx="10" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="145" y="211" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">LISTEN</text>

  <!-- SYN_SENT (right, below closed) -->
  <rect x="660" y="185" width="130" height="42" rx="10" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="725" y="211" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">SYN_SENT</text>

  <!-- SYN_RECEIVED (center-left) -->
  <rect x="80" y="290" width="150" height="42" rx="10" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="155" y="316" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">SYN_RCVD</text>

  <!-- ESTABLISHED (center) -->
  <rect x="355" y="290" width="160" height="48" rx="12" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="3" filter="url(#shadow)"/>
  <text x="435" y="320" text-anchor="middle" font-size="15" font-weight="700" fill="#065f46">ESTABLISHED</text>

  <!-- FIN_WAIT_1 (right side) -->
  <rect x="640" y="380" width="140" height="42" rx="10" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="710" y="406" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">FIN_WAIT_1</text>

  <!-- FIN_WAIT_2 (right side, below) -->
  <rect x="640" y="470" width="140" height="42" rx="10" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="710" y="496" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">FIN_WAIT_2</text>

  <!-- CLOSE_WAIT (left side) -->
  <rect x="80" y="400" width="150" height="42" rx="10" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="155" y="426" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6">CLOSE_WAIT</text>

  <!-- LAST_ACK (left side, below) -->
  <rect x="80" y="500" width="150" height="42" rx="10" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="155" y="526" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6">LAST_ACK</text>

  <!-- TIME_WAIT (center-right, bottom) -->
  <rect x="430" y="555" width="140" height="42" rx="10" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="500" y="581" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">TIME_WAIT</text>

  <!-- CLOSING (far right, bottom) -->
  <rect x="640" y="555" width="130" height="42" rx="10" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="705" y="581" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">CLOSING</text>

  <!-- ==================== ARROWS ==================== -->

  <!-- CLOSED → LISTEN (server: passive open) -->
  <path d="M370,116 C280,116 145,140 145,185" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="2,3" marker-end="url(#arrowPurple)"/>
  <text x="230" y="142" font-size="9" fill="#7c3aed" font-weight="600">passive open</text>

  <!-- CLOSED → SYN_SENT (client: active open / SYN) -->
  <path d="M500,116 C600,116 725,150 725,185" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowBlue)"/>
  <text x="615" y="138" font-size="9" fill="#2563eb" font-weight="600">active open / SYN</text>

  <!-- LISTEN → SYN_RECEIVED (server: rcv SYN / SYN,ACK) -->
  <path d="M145,227 L145,290" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="2,3" marker-end="url(#arrowPurple)"/>
  <text x="35" y="263" font-size="9" fill="#7c3aed" font-weight="600">rcv SYN /</text>
  <text x="35" y="275" font-size="9" fill="#7c3aed" font-weight="600">SYN,ACK</text>

  <!-- SYN_SENT → ESTABLISHED (client: rcv SYN,ACK / ACK) -->
  <path d="M660,216 C580,260 520,280 515,290" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowBlue)"/>
  <text x="560" y="255" font-size="9" fill="#2563eb" font-weight="600">rcv SYN,ACK / ACK</text>

  <!-- SYN_RECEIVED → ESTABLISHED (server: rcv ACK) -->
  <path d="M230,311 L355,311" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="2,3" marker-end="url(#arrowPurple)"/>
  <text x="275" y="303" font-size="9" fill="#7c3aed" font-weight="600">rcv ACK / —</text>

  <!-- ESTABLISHED → FIN_WAIT_1 (client: close / FIN) -->
  <path d="M515,330 C590,355 700,360 710,380" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowAmber)"/>
  <text x="590" y="352" font-size="9" fill="#b45309" font-weight="600">close / FIN</text>

  <!-- ESTABLISHED → CLOSE_WAIT (server: rcv FIN / ACK) -->
  <path d="M355,330 C280,365 180,375 165,400" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="2,3" marker-end="url(#arrowPurple)"/>
  <text x="240" y="378" font-size="9" fill="#7c3aed" font-weight="600">rcv FIN / ACK</text>

  <!-- FIN_WAIT_1 → FIN_WAIT_2 (rcv ACK) -->
  <path d="M710,422 L710,470" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowAmber)"/>
  <text x="720" y="452" font-size="9" fill="#b45309" font-weight="600">rcv ACK / —</text>

  <!-- FIN_WAIT_2 → TIME_WAIT (rcv FIN / ACK) -->
  <path d="M640,500 C580,540 560,565 570,576" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowAmber)"/>
  <text x="575" y="540" font-size="9" fill="#b45309" font-weight="600">rcv FIN / ACK</text>

  <!-- FIN_WAIT_1 → CLOSING (simultaneous close: rcv FIN / ACK) -->
  <path d="M750,422 C760,480 730,546 720,555" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <text x="758" y="500" font-size="9" fill="#64748b" font-weight="600">rcv FIN / ACK</text>

  <!-- CLOSING → TIME_WAIT (rcv ACK) -->
  <path d="M640,576 L570,576" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <text x="590" y="568" font-size="9" fill="#64748b" font-weight="600">rcv ACK</text>

  <!-- CLOSE_WAIT → LAST_ACK (server: close / FIN) -->
  <path d="M155,442 L155,500" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="2,3" marker-end="url(#arrowPurple)"/>
  <text x="62" y="476" font-size="9" fill="#7c3aed" font-weight="600">close / FIN</text>

  <!-- LAST_ACK → CLOSED (server: rcv ACK) -->
  <path d="M155,542 C155,590 300,620 370,606 C390,602 410,598 430,576" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="2,3"/>
  <text x="250" y="610" font-size="9" fill="#7c3aed" font-weight="600">rcv ACK / — → CLOSED</text>

  <!-- TIME_WAIT → CLOSED (timeout / 2MSL) -->
  <path d="M430,576 C370,576 320,570 310,560" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="310" y="560" font-size="9" fill="#b45309" font-weight="600">timeout (2MSL) → CLOSED</text>

  <!-- SYN_SENT → SYN_RECEIVED (simultaneous open) -->
  <path d="M660,206 C500,206 350,250 240,290" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <text x="430" y="230" font-size="9" fill="#64748b">rcv SYN / SYN,ACK (simultaneous open)</text>
</svg>