<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 550" width="850" height="550" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="1" dy="2" stdDeviation="2.5" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="850" height="550" fill="url(#bg)" rx="8"/>

  <!-- Title -->
  <text x="425" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">The User Space / Kernel Space Boundary</text>

  <!-- User Space Zone -->
  <rect x="30" y="48" width="700" height="195" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" opacity="0.85"/>
  <text x="50" y="72" font-size="13" font-weight="700" fill="#1e40af">User Space</text>

  <!-- Kernel Space Zone -->
  <rect x="30" y="300" width="700" height="220" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5" opacity="0.85"/>
  <text x="50" y="324" font-size="13" font-weight="700" fill="#c2410c">Kernel Space</text>

  <!-- Dashed divider -->
  <line x1="30" y1="272" x2="730" y2="272" stroke="#64748b" stroke-width="2.2" stroke-dasharray="10,6"/>
  <rect x="230" y="258" width="270" height="26" rx="5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="365" y="276" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">System Call Interface (syscall)</text>

  <!-- USER SPACE BOXES -->
  <!-- Application -->
  <rect x="60" y="100" width="170" height="54" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="145" y="123" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a5f">Application</text>
  <text x="145" y="140" text-anchor="middle" font-size="10.5" fill="#64748b">Python / Java / Go</text>

  <!-- Standard Library -->
  <rect x="280" y="100" width="170" height="54" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="365" y="123" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a5f">Standard Library</text>
  <text x="365" y="140" text-anchor="middle" font-size="10.5" fill="#64748b">libc / glibc</text>

  <!-- System Call Wrapper -->
  <rect x="500" y="100" width="170" height="54" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="585" y="123" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a5f">System Call</text>
  <text x="585" y="140" text-anchor="middle" font-size="10.5" fill="#64748b">Wrapper</text>

  <!-- Arrows in User Space -->
  <line x1="230" y1="127" x2="276" y2="127" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="127" x2="496" y2="127" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- write() call label in user space -->
  <text x="145" y="92" text-anchor="middle" font-size="11" font-weight="600" fill="#2563eb" font-style="italic">write(fd, buf, n)</text>

  <!-- Arrow from user space to kernel space -->
  <line x1="585" y1="154" x2="585" y2="200" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="585" y1="200" x2="585" y2="253" stroke="#2563eb" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="585" y1="285" x2="585" y2="340" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="605" y="218" font-size="10" fill="#2563eb" font-weight="600">trap / sysenter</text>

  <!-- KERNEL SPACE BOXES -->
  <!-- System Call Handler -->
  <rect x="60" y="340" width="155" height="50" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="137" y="362" text-anchor="middle" font-size="12" font-weight="700" fill="#7c2d12">System Call</text>
  <text x="137" y="377" text-anchor="middle" font-size="12" font-weight="700" fill="#7c2d12">Handler</text>

  <!-- VFS -->
  <rect x="250" y="340" width="130" height="50" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="315" y="362" text-anchor="middle" font-size="12" font-weight="700" fill="#7c2d12">VFS</text>
  <text x="315" y="377" text-anchor="middle" font-size="10" fill="#64748b">Virtual File System</text>

  <!-- File System -->
  <rect x="415" y="340" width="120" height="50" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="475" y="362" text-anchor="middle" font-size="12" font-weight="700" fill="#7c2d12">File System</text>
  <text x="475" y="377" text-anchor="middle" font-size="10" fill="#64748b">ext4 / xfs</text>

  <!-- Block Device Driver -->
  <rect x="250" y="430" width="150" height="50" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="325" y="452" text-anchor="middle" font-size="12" font-weight="700" fill="#7c2d12">Block Device</text>
  <text x="325" y="467" text-anchor="middle" font-size="12" font-weight="700" fill="#7c2d12">Driver</text>

  <!-- Hardware -->
  <rect x="460" y="430" width="130" height="50" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="525" y="452" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Hardware</text>
  <text x="525" y="467" text-anchor="middle" font-size="10" fill="#78350f">SSD / HDD / NVMe</text>

  <!-- Arrows in Kernel Space -->
  <line x1="215" y1="365" x2="246" y2="365" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="365" x2="411" y2="365" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="535" y1="365" x2="585" y2="365" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="560" y="358" font-size="9" fill="#2563eb" font-weight="600">context</text>

  <!-- Down arrows -->
  <line x1="475" y1="390" x2="400" y2="430" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="455" x2="456" y2="455" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- write() flow arrow on the left side -->
  <path d="M 585 340 Q 610 340 610 365 Q 610 390 500 410 Q 400 425 325 430" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowBlue)"/>

  <!-- RIGHT SIDE: Privilege Level -->
  <rect x="750" y="48" width="80" height="195" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="790" y="105" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">Ring 3</text>
  <text x="790" y="120" text-anchor="middle" font-size="10" fill="#3b82f6">(User)</text>
  <text x="790" y="175" text-anchor="middle" font-size="20" fill="#64748b">↓</text>
  <text x="790" y="210" text-anchor="middle" font-size="9" fill="#475569">Privilege</text>
  <text x="790" y="222" text-anchor="middle" font-size="9" fill="#475569">Transition</text>

  <rect x="750" y="300" width="80" height="220" rx="8" fill="#ffedd5" stroke="#fdba74" stroke-width="1"/>
  <text x="790" y="395" text-anchor="middle" font-size="11" font-weight="700" fill="#c2410c">Ring 0</text>
  <text x="790" y="410" text-anchor="middle" font-size="10" fill="#ea580c">(Kernel)</text>
  <text x="790" y="445" text-anchor="middle" font-size="9" fill="#78350f">Full hardware</text>
  <text x="790" y="457" text-anchor="middle" font-size="9" fill="#78350f">access</text>

  <!-- write() label flowing down -->
  <text x="55" y="210" font-size="11" font-weight="600" fill="#2563eb">write()</text>
  <path d="M 75 218 L 75 310 L 57 340" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowBlue)"/>
</svg>