<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="1" dy="2" stdDeviation="2.5" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" fill="url(#bg)" rx="8"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">PostgreSQL Query Planner: How It Chooses Your Access Path</text>

  <!-- ===== TOP PIPELINE ===== -->
  <!-- SQL Query -->
  <rect x="30" y="52" width="120" height="42" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="2" filter="url(#shadow)"/>
  <text x="90" y="78" text-anchor="middle" font-size="12" font-weight="700" fill="#4338ca">SQL Query</text>

  <line x1="150" y1="73" x2="190" y2="73" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Parser -->
  <rect x="194" y="52" width="100" height="42" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="244" y="78" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9">Parser</text>

  <line x1="294" y1="73" x2="334" y2="73" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Rewriter -->
  <rect x="338" y="52" width="100" height="42" rx="8" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="388" y="78" text-anchor="middle" font-size="12" font-weight="700" fill="#6d28d9">Rewriter</text>

  <line x1="438" y1="73" x2="478" y2="73" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Planner/Optimizer -->
  <rect x="482" y="48" width="175" height="50" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2.2" filter="url(#shadow)"/>
  <text x="569" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">Planner /</text>
  <text x="569" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">Optimizer</text>

  <!-- ===== SCAN DECISIONS (left branch) ===== -->
  <text x="250" y="125" font-size="13" font-weight="700" fill="#334155">Scan Strategy</text>

  <!-- Decision: Table size -->
  <rect x="120" y="140" width="220" height="38" rx="18" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="230" y="164" text-anchor="middle" font-size="10.5" font-weight="600" fill="#713f12">Table size &lt; 1,000 rows?</text>

  <line x1="520" y1="98" x2="320" y2="140" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Yes → Seq scan -->
  <line x1="120" y1="159" x2="62" y2="159" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrowGray)"/>
  <text x="90" y="152" font-size="9" font-weight="600" fill="#16a34a">Yes</text>

  <rect x="0" y="144" width="58" height="30" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="29" y="163" text-anchor="middle" font-size="9" font-weight="600" fill="#4b5563">Seq Scan</text>

  <!-- No → next decision -->
  <line x1="230" y1="178" x2="230" y2="200" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="240" y="192" font-size="9" font-weight="600" fill="#dc2626">No</text>

  <!-- Decision: Index available? -->
  <rect x="110" y="204" width="240" height="38" rx="18" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="230" y="228" text-anchor="middle" font-size="10.5" font-weight="600" fill="#713f12">Index on WHERE column?</text>

  <!-- No → Seq Scan -->
  <line x1="110" y1="223" x2="62" y2="223" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrowGray)"/>
  <text x="82" y="216" font-size="9" font-weight="600" fill="#dc2626">No</text>

  <rect x="0" y="208" width="58" height="30" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="29" y="227" text-anchor="middle" font-size="9" font-weight="600" fill="#4b5563">Seq Scan</text>

  <!-- Yes → selectivity -->
  <line x1="230" y1="242" x2="230" y2="268" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="240" y="258" font-size="9" font-weight="600" fill="#16a34a">Yes</text>

  <!-- Decision: Selectivity -->
  <rect x="125" y="272" width="210" height="38" rx="18" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="230" y="296" text-anchor="middle" font-size="10.5" font-weight="600" fill="#713f12">Selectivity?</text>

  <!-- Selectivity < 5% → Index Scan -->
  <line x1="125" y1="285" x2="10" y2="285" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="70" y="278" font-size="9" font-weight="600" fill="#334155">&lt; 5%</text>

  <rect x="0" y="330" width="110" height="36" rx="7" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="55" y="352" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">Index Scan</text>
  <line x1="10" y1="296" x2="30" y2="327" stroke="#3b82f6" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="55" y="380" text-anchor="middle" font-size="8.5" fill="#64748b">Highly selective</text>
  <text x="55" y="392" text-anchor="middle" font-size="8.5" fill="#64748b">Few rows returned</text>

  <!-- Selectivity 5-20% → Bitmap Index Scan -->
  <line x1="230" y1="310" x2="230" y2="327" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="250" y="322" font-size="9" font-weight="600" fill="#334155">5–20%</text>

  <rect x="170" y="330" width="145" height="36" rx="7" fill="#d1fae5" stroke="#10b981" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="242" y="352" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">Bitmap Index Scan</text>
  <text x="242" y="380" text-anchor="middle" font-size="8.5" fill="#64748b">Bitmap of matching pages</text>
  <text x="242" y="392" text-anchor="middle" font-size="8.5" fill="#64748b">then sequential read</text>

  <!-- Selectivity > 20% → Seq Scan -->
  <line x1="335" y1="291" x2="408" y2="330" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="385" y="298" font-size="9" font-weight="600" fill="#334155">&gt; 20%</text>

  <rect x="370" y="330" width="120" height="36" rx="7" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="430" y="352" text-anchor="middle" font-size="11" font-weight="700" fill="#4b5563">Sequential Scan</text>
  <text x="430" y="380" text-anchor="middle" font-size="8.5" fill="#64748b">Full table scan faster</text>
  <text x="430" y="392" text-anchor="middle" font-size="8.5" fill="#64748b">than random I/O</text>

  <!-- ===== JOIN DECISIONS (right branch) ===== -->
  <text x="690" y="125" font-size="13" font-weight="700" fill="#334155">Join Strategy</text>

  <line x1="620" y1="98" x2="690" y2="140" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Join decision box -->
  <rect x="610" y="144" width="200" height="38" rx="18" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="710" y="168" text-anchor="middle" font-size="10.5" font-weight="600" fill="#713f12">Join type based on data</text>

  <!-- Nested Loop -->
  <line x1="610" y1="163" x2="560" y2="220" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="565" y="195" font-size="8.5" fill="#92400e" font-weight="600">Small / indexed</text>

  <rect x="510" y="224" width="120" height="36" rx="7" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="570" y="246" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">Nested Loop</text>
  <text x="570" y="274" text-anchor="middle" font-size="8.5" fill="#64748b">For each outer row,</text>
  <text x="570" y="286" text-anchor="middle" font-size="8.5" fill="#64748b">scan inner table</text>

  <!-- Merge Join -->
  <line x1="710" y1="182" x2="710" y2="220" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="730" y="205" font-size="8.5" fill="#6d28d9" font-weight="600">Sorted</text>

  <rect x="650" y="224" width="120" height="36" rx="7" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="710" y="246" text-anchor="middle" font-size="11" font-weight="700" fill="#5b21b6">Merge Join</text>
  <text x="710" y="274" text-anchor="middle" font-size="8.5" fill="#64748b">Zip through two</text>
  <text x="710" y="286" text-anchor="middle" font-size="8.5" fill="#64748b">sorted inputs</text>

  <!-- Hash Join -->
  <line x1="810" y1="163" x2="850" y2="220" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="845" y="195" font-size="8.5" fill="#dc2626" font-weight="600">Large / unsorted</text>

  <rect x="790" y="224" width="105" height="36" rx="7" fill="#fee2e2" stroke="#ef4444" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="842" y="246" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">Hash Join</text>
  <text x="842" y="274" text-anchor="middle" font-size="8.5" fill="#64748b">Build hash table,</text>
  <text x="842" y="286" text-anchor="middle" font-size="8.5" fill="#64748b">probe with other</text>

  <!-- ===== COST MODEL NOTE ===== -->
  <rect x="530" y="320" width="360" height="74" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="710" y="342" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">Cost Model Factors</text>
  <text x="710" y="358" text-anchor="middle" font-size="9.5" fill="#64748b">• seq_page_cost = 1.0 &#160;&#160; • random_page_cost = 4.0</text>
  <text x="710" y="372" text-anchor="middle" font-size="9.5" fill="#64748b">• cpu_tuple_cost = 0.01 &#160; • cpu_index_tuple_cost = 0.005</text>
  <text x="710" y="386" text-anchor="middle" font-size="9.5" fill="#64748b">• Table statistics (pg_stats) drive selectivity estimates</text>

  <!-- ===== FINAL OUTPUT ===== -->
  <rect x="260" y="430" width="380" height="50" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2.2" filter="url(#shadow)"/>
  <text x="450" y="452" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">Query Execution Plan</text>
  <text x="450" y="470" text-anchor="middle" font-size="10" fill="#047857">EXPLAIN ANALYZE to inspect</text>

  <!-- Arrows to final output -->
  <line x1="55" y1="366" x2="260" y2="445" stroke="#10b981" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <line x1="242" y1="366" x2="350" y2="428" stroke="#10b981" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <line x1="430" y1="366" x2="430" y2="426" stroke="#10b981" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <line x1="570" y1="260" x2="500" y2="428" stroke="#10b981" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <line x1="710" y1="260" x2="550" y2="428" stroke="#10b981" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <line x1="842" y1="260" x2="620" y2="428" stroke="#10b981" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arrow)"/>

  <!-- EXPLAIN example at bottom -->
  <rect x="80" y="505" width="740" height="80" rx="8" fill="#1e293b" filter="url(#shadow)"/>
  <text x="100" y="528" font-size="10.5" fill="#a5f3fc" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', monospace">EXPLAIN ANALYZE SELECT * FROM orders o JOIN customers c ON o.customer_id = c.id</text>
  <text x="100" y="546" font-size="10.5" fill="#86efac" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', monospace">→ Hash Join  (cost=1.15..2.45 rows=100 width=64) (actual time=0.03..0.04 rows=100)</text>
  <text x="100" y="564" font-size="10.5" fill="#86efac" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', monospace">    → Seq Scan on customers c  (cost=0.00..1.10 rows=10 width=36)</text>
  <text x="100" y="580" font-size="10.5" fill="#86efac" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', monospace">    → Hash  → Seq Scan on orders o  (cost=0.00..1.00 rows=100 width=28)</text>
</svg>