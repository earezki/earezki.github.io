<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <clipPath id="clip">
      <rect width="800" height="600" rx="8"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)" rx="8"/>

  <!-- Title -->
  <text x="400" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">The CAP Theorem: Pick Two (But You Must Pick P)</text>

  <!-- ===== THREE CIRCLES ===== -->
  <!-- Using opacity to show overlapping regions -->

  <!-- Consistency (top, blue) -->
  <circle cx="400" cy="210" r="155" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="2.5" stroke-opacity="0.6"/>

  <!-- Availability (bottom-left, green) -->
  <circle cx="310" cy="360" r="155" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="2.5" stroke-opacity="0.6"/>

  <!-- Partition Tolerance (bottom-right, amber) -->
  <circle cx="490" cy="360" r="155" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-width="2.5" stroke-opacity="0.6"/>

  <!-- ===== CIRCLE LABELS ===== -->
  <!-- Consistency label (top) -->
  <text x="400" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">Consistency</text>
  <text x="400" y="106" text-anchor="middle" font-size="10" fill="#3b82f6">Every read receives the</text>
  <text x="400" y="119" text-anchor="middle" font-size="10" fill="#3b82f6">most recent write</text>

  <!-- Availability label (bottom-left) -->
  <text x="195" y="425" text-anchor="middle" font-size="16" font-weight="700" fill="#047857">Availability</text>
  <text x="195" y="443" text-anchor="middle" font-size="10" fill="#10b981">Every request receives</text>
  <text x="195" y="456" text-anchor="middle" font-size="10" fill="#10b981">a response</text>

  <!-- Partition Tolerance label (bottom-right) -->
  <text x="605" y="425" text-anchor="middle" font-size="16" font-weight="700" fill="#b45309">Partition</text>
  <text x="605" y="443" text-anchor="middle" font-size="16" font-weight="700" fill="#b45309">Tolerance</text>
  <text x="605" y="461" text-anchor="middle" font-size="10" fill="#d97706">System operates despite</text>
  <text x="605" y="474" text-anchor="middle" font-size="10" fill="#d97706">network partitions</text>

  <!-- ===== OVERLAP REGIONS ===== -->

  <!-- C+A (top, no P) -->
  <rect x="342" y="237" width="116" height="68" rx="8" fill="#ffffff" fill-opacity="0.92" filter="url(#shadow)"/>
  <text x="400" y="254" text-anchor="middle" font-size="10.5" font-weight="700" fill="#4338ca">CA</text>
  <text x="400" y="268" text-anchor="middle" font-size="8.5" fill="#475569">Traditional RDBMS</text>
  <text x="400" y="280" text-anchor="middle" font-size="8.5" fill="#64748b">PostgreSQL, MySQL</text>
  <text x="400" y="296" text-anchor="middle" font-size="7.5" fill="#94a3b8" font-style="italic">Only if network is perfect</text>

  <!-- C+P (right, no A) -->
  <rect x="430" y="302" width="120" height="74" rx="8" fill="#ffffff" fill-opacity="0.92" filter="url(#shadow)"/>
  <text x="490" y="318" text-anchor="middle" font-size="10.5" font-weight="700" fill="#7c2d12">CP</text>
  <text x="490" y="332" text-anchor="middle" font-size="8.5" fill="#475569">ZooKeeper, HBase</text>
  <text x="490" y="344" text-anchor="middle" font-size="8.5" fill="#475569">MongoDB (strong)</text>
  <text x="490" y="360" text-anchor="middle" font-size="7.5" fill="#94a3b8" font-style="italic">May reject requests</text>
  <text x="490" y="371" text-anchor="middle" font-size="7.5" fill="#94a3b8" font-style="italic">during partition</text>

  <!-- A+P (left, no C) -->
  <rect x="250" y="302" width="120" height="74" rx="8" fill="#ffffff" fill-opacity="0.92" filter="url(#shadow)"/>
  <text x="310" y="318" text-anchor="middle" font-size="10.5" font-weight="700" fill="#065f46">AP</text>
  <text x="310" y="332" text-anchor="middle" font-size="8.5" fill="#475569">Cassandra, DynamoDB</text>
  <text x="310" y="344" text-anchor="middle" font-size="8.5" fill="#475569">CouchDB</text>
  <text x="310" y="360" text-anchor="middle" font-size="7.5" fill="#94a3b8" font-style="italic">May return stale data</text>
  <text x="310" y="371" text-anchor="middle" font-size="7.5" fill="#94a3b8" font-style="italic">during partition</text>

  <!-- Center (C+A+P) — Impossible -->
  <circle cx="400" cy="320" r="22" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="400" y="317" text-anchor="middle" font-size="8" font-weight="700" fill="#991b1b">CAP</text>
  <text x="400" y="330" text-anchor="middle" font-size="7" font-weight="700" fill="#dc2626">Impossible</text>
  <!-- X through center -->
  <line x1="385" y1="305" x2="415" y2="335" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="415" y1="305" x2="385" y2="335" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>

  <!-- ===== BOTTOM NOTE ===== -->
  <rect x="100" y="530" width="600" height="50" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="400" y="550" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">In distributed systems, Partition Tolerance is mandatory</text>
  <text x="400" y="568" text-anchor="middle" font-size="11" fill="#475569">— so the real choice is between <tspan font-weight="700" fill="#1d4ed8">Consistency</tspan> and <tspan font-weight="700" fill="#047857">Availability</tspan></text>

  <!-- Small decorative arrows pointing to P circle -->
  <text x="400" y="510" text-anchor="middle" font-size="10" font-weight="700" fill="#d97706">▲ P is non-negotiable ▲</text>
</svg>