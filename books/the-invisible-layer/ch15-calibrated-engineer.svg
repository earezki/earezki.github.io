<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 600" width="850" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="grayGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#78909c"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.13" flood-color="#334155"/>
    </filter>
    <marker id="arrowGray" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="850" height="600" rx="12" fill="url(#bg)" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Title -->
  <text x="425" y="32" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#1e293b">The Calibrated Engineer: Know Your Layer, Know What's Below</text>

  <!-- ===== CONCENTRIC RECTANGLES (Bullseye) ===== -->

  <!-- Outermost: Beyond (gray) -->
  <rect x="45" y="52" width="520" height="355" rx="18" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/>
  <!-- Label -->
  <text x="305" y="74" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#64748b">Beyond: Know what you don't know</text>
  <text x="305" y="88" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" fill="#94a3b8">Recognize when you've hit this boundary</text>

  <!-- Layer -2: Awareness Zone (purple) -->
  <rect x="75" y="100" width="460" height="275" rx="14" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
  <text x="305" y="120" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#7c3aed">Layer -2: Awareness Zone</text>
  <text x="305" y="136" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" fill="#8b5cf6">Know it exists, know basic concepts, know when to investigate</text>
  <!-- Examples -->
  <rect x="93" y="146" width="72" height="22" rx="4" fill="url(#purpleGrad)" opacity="0.7"/>
  <text x="129" y="161" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8" font-weight="600" fill="#fff">V8 JIT</text>
  <rect x="173" y="146" width="110" height="22" rx="4" fill="url(#purpleGrad)" opacity="0.7"/>
  <text x="228" y="161" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8" font-weight="600" fill="#fff">Kernel scheduling</text>
  <rect x="291" y="146" width="100" height="22" rx="4" fill="url(#purpleGrad)" opacity="0.7"/>
  <text x="341" y="161" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8" font-weight="600" fill="#fff">Disk I/O patterns</text>

  <!-- Layer -1: One Below (blue) -->
  <rect x="110" y="180" width="390" height="164" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="305" y="200" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#2563eb">Layer -1: One Below Your Domain</text>
  <text x="305" y="216" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" fill="#3b82f6">Can explain the mechanisms, can read logs, can form hypotheses</text>
  <!-- Examples -->
  <rect x="128" y="226" width="85" height="22" rx="4" fill="url(#blueGrad)" opacity="0.8"/>
  <text x="171" y="241" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8" font-weight="600" fill="#fff">Browser APIs</text>
  <rect x="221" y="226" width="72" height="22" rx="4" fill="url(#blueGrad)" opacity="0.8"/>
  <text x="257" y="241" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8" font-weight="600" fill="#fff">HTTP/TCP</text>
  <rect x="301" y="226" width="130" height="22" rx="4" fill="url(#blueGrad)" opacity="0.8"/>
  <text x="366" y="241" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8" font-weight="600" fill="#fff">PostgreSQL internals</text>

  <!-- Layer 0: Center (green — primary domain) -->
  <rect x="150" y="262" width="310" height="70" rx="10" fill="url(#greenGrad)" filter="url(#shadow)"/>
  <text x="305" y="282" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#fff">Layer 0: Your Primary Domain</text>
  <text x="305" y="298" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" fill="#d1fae5">Can explain in detail, can implement, can debug</text>
  <!-- Examples -->
  <rect x="168" y="306" width="90" height="18" rx="3" fill="rgba(255,255,255,0.25)"/>
  <text x="213" y="319" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8" font-weight="600" fill="#fff">React components</text>
  <rect x="266" y="306" width="72" height="18" rx="3" fill="rgba(255,255,255,0.25)"/>
  <text x="302" y="319" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8" font-weight="600" fill="#fff">API design</text>
  <rect x="346" y="306" width="100" height="18" rx="3" fill="rgba(255,255,255,0.25)"/>
  <text x="396" y="319" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="8" font-weight="600" fill="#fff">Query optimization</text>

  <!-- ===== RIGHT SIDE: Arrow & Labels ===== -->
  <line x1="600" y1="100" x2="600" y2="395" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowGray)"/>
  <!-- Arrow head at top pointing up -->
  <polygon points="596,104 600,92 604,104" fill="#94a3b8"/>

  <text x="615" y="160" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#64748b">Decreasing</text>
  <text x="615" y="175" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#64748b">depth</text>

  <text x="615" y="310" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#64748b">Increasing</text>
  <text x="615" y="325" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#64748b">breadth</text>

  <!-- Depth indicators on the right -->
  <rect x="680" y="92" width="140" height="26" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="750" y="110" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" fill="#94a3b8">Shallow: awareness</text>

  <rect x="680" y="180" width="140" height="26" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="750" y="198" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" fill="#3b82f6">Medium: mechanisms</text>

  <rect x="680" y="270" width="140" height="26" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
  <text x="750" y="288" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" fill="#10b981">Deep: mastery</text>

  <rect x="680" y="370" width="140" height="26" rx="5" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
  <text x="750" y="388" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" fill="#ef4444">⚠ Diminishing returns</text>

  <!-- ===== BOTTOM: Comparison Bars ===== -->
  <rect x="45" y="430" width="760" height="150" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>

  <text x="425" y="454" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#334155">Engineer Profiles</text>

  <!-- Abstraction-dependent -->
  <text x="70" y="484" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#ef4444">Abstraction-dependent</text>
  <rect x="280" y="472" width="240" height="18" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="280" y="472" width="80" height="18" rx="4" fill="#10b981"/>
  <rect x="360" y="472" width="160" height="18" rx="4 4 4 4" fill="#f1f5f9"/>
  <text x="540" y="485" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" fill="#94a3b8">only Layer 0</text>

  <!-- Systems purist -->
  <text x="70" y="516" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#f59e0b">Systems purist</text>
  <rect x="280" y="504" width="240" height="18" rx="4" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="280" y="504" width="60" height="18" rx="4 0 0 4" fill="#f1f5f9"/>
  <rect x="340" y="504" width="120" height="18" rx="0" fill="#8b5cf6"/>
  <rect x="460" y="504" width="60" height="18" rx="0 4 4 0" fill="#f1f5f9"/>
  <text x="540" y="517" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" fill="#94a3b8">lost in Layer -3</text>

  <!-- Calibrated -->
  <text x="70" y="548" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#10b981">Calibrated ✓</text>
  <rect x="280" y="536" width="240" height="18" rx="4" fill="#10b981" stroke="#059669" stroke-width="1"/>
  <!-- Gradient effect to show proportional depth -->
  <rect x="280" y="536" width="80" height="18" rx="4 0 0 4" fill="#059669"/>
  <rect x="360" y="536" width="80" height="18" fill="#10b981"/>
  <rect x="440" y="536" width="80" height="18" rx="0 4 4 0" fill="#34d399"/>
  <text x="540" y="549" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" font-weight="600" fill="#059669">proportional across layers</text>

  <!-- Bar labels -->
  <text x="300" y="568" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="7" fill="#94a3b8">Layer 0</text>
  <text x="380" y="568" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="7" fill="#94a3b8">Layer -1</text>
  <text x="460" y="568" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="7" fill="#94a3b8">Layer -2</text>
</svg>