<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="500" height="700" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <marker id="arrowDown" markerWidth="8" markerHeight="6" refX="4" refY="6" orient="auto">
      <polygon points="0 0, 8 0, 4 6" fill="#ef4444"/>
    </marker>
    <marker id="arrowUp" markerWidth="8" markerHeight="6" refX="4" refY="0" orient="auto">
      <polygon points="0 6, 8 6, 4 0" fill="#10b981"/>
    </marker>
    <pattern id="unmapped" patternUnits="userSpaceOnUse" width="8" height="8">
      <path d="M0,8 L8,0" stroke="#cbd5e1" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="500" height="700" rx="12" fill="url(#bg)" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Title -->
  <text x="250" y="35" text-anchor="middle" font-size="19" font-weight="700" fill="#1e293b">Linux Process Virtual Memory Layout</text>
  <text x="250" y="52" text-anchor="middle" font-size="11" fill="#64748b">Virtual address space (low → high)</text>

  <!-- Address column header -->
  <text x="55" y="78" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">ADDRESS</text>
  <text x="210" y="78" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">SEGMENT</text>
  <text x="390" y="78" text-anchor="middle" font-size="10" font-weight="600" fill="#475569">CONTENTS</text>

  <!-- Outer boundary -->
  <rect x="105" y="88" width="210" height="560" rx="4" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ===== HIGH ADDRESSES (TOP) ===== -->

  <!-- Kernel Space (very top, inaccessible) -->
  <rect x="106" y="89" width="208" height="35" rx="3" fill="#1e293b" fill-opacity="0.08" stroke="#1e293b" stroke-width="1"/>
  <text x="210" y="110" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">Kernel Space</text>
  <text x="55" y="110" text-anchor="middle" font-size="9" fill="#94a3b8" font-style="italic">0xFFFF...</text>
  <text x="390" y="106" font-size="9" fill="#64748b">Inaccessible to</text>
  <text x="390" y="118" font-size="9" fill="#64748b">user processes</text>

  <!-- Stack -->
  <rect x="106" y="130" width="208" height="100" rx="6" fill="#ef4444" fill-opacity="0.12" stroke="#ef4444" stroke-width="2" filter="url(#shadow)"/>
  <text x="210" y="160" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">Stack</text>
  <text x="210" y="178" text-anchor="middle" font-size="10" fill="#dc2626">grows ↓ downward</text>
  <text x="55" y="150" text-anchor="middle" font-size="9" fill="#94a3b8">0x7FFF...</text>

  <!-- Stack annotations -->
  <text x="340" y="148" font-size="9" fill="#b91c1c">• Local variables</text>
  <text x="340" y="161" font-size="9" fill="#b91c1c">• Return addresses</text>
  <text x="340" y="174" font-size="9" fill="#b91c1c">• Function parameters</text>
  <text x="340" y="187" font-size="9" fill="#b91c1c">• Stack frames (LIFO)</text>

  <!-- Stack growth arrow -->
  <line x1="120" y1="195" x2="120" y2="235" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowDown)"/>
  <text x="85" y="218" font-size="8" fill="#ef4444" font-weight="600" transform="rotate(-90,85,218)">grows</text>

  <!-- Unmapped gap -->
  <rect x="106" y="240" width="208" height="70" fill="url(#unmapped)"/>
  <text x="210" y="280" text-anchor="middle" font-size="11" fill="#94a3b8" font-style="italic">Unmapped region</text>
  <text x="340" y="275" font-size="9" fill="#94a3b8">Memory-mapped files,</text>
  <text x="340" y="288" font-size="9" fill="#94a3b8">shared libraries (mmap)</text>

  <!-- Heap growth arrow -->
  <line x1="120" y1="355" x2="120" y2="315" stroke="#10b981" stroke-width="2" marker-end="url(#arrowUp)"/>
  <text x="85" y="340" font-size="8" fill="#10b981" font-weight="600" transform="rotate(-90,85,340)">grows</text>

  <!-- Heap -->
  <rect x="106" y="320" width="208" height="95" rx="6" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <text x="210" y="355" text-anchor="middle" font-size="14" font-weight="700" fill="#065f46">Heap</text>
  <text x="210" y="373" text-anchor="middle" font-size="10" fill="#059669">grows ↑ upward</text>

  <!-- Heap annotations -->
  <text x="340" y="342" font-size="9" fill="#047857">• malloc'd memory</text>
  <text x="340" y="355" font-size="9" fill="#047857">• Dynamic objects</text>
  <text x="340" y="368" font-size="9" fill="#047857">• new / calloc / realloc</text>
  <text x="340" y="381" font-size="9" fill="#047857">• Program break (brk)</text>

  <!-- BSS Segment -->
  <rect x="106" y="425" width="208" height="60" rx="6" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="210" y="453" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">BSS Segment</text>
  <text x="210" y="470" text-anchor="middle" font-size="10" fill="#b45309">.bss</text>

  <!-- BSS annotations -->
  <text x="340" y="447" font-size="9" fill="#b45309">• Uninitialized globals</text>
  <text x="340" y="460" font-size="9" fill="#b45309">• Static variables = 0</text>
  <text x="340" y="473" font-size="9" fill="#b45309">• Zero-filled at load</text>

  <!-- Data Segment -->
  <rect x="106" y="495" width="208" height="60" rx="6" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="210" y="523" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">Data Segment</text>
  <text x="210" y="540" text-anchor="middle" font-size="10" fill="#2563eb">.data / .rodata</text>

  <!-- Data annotations -->
  <text x="340" y="517" font-size="9" fill="#1d4ed8">• Initialized globals</text>
  <text x="340" y="530" font-size="9" fill="#1d4ed8">• Static variables ≠ 0</text>
  <text x="340" y="543" font-size="9" fill="#1d4ed8">• String literals (ro)</text>

  <!-- Text Segment -->
  <rect x="106" y="565" width="208" height="75" rx="6" fill="#8b5cf6" fill-opacity="0.12" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
  <text x="210" y="596" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">Text Segment</text>
  <text x="210" y="614" text-anchor="middle" font-size="10" fill="#7c3aed">.text (read-only + exec)</text>
  <text x="55" y="600" text-anchor="middle" font-size="9" fill="#94a3b8">0x0040...</text>

  <!-- Text annotations -->
  <text x="340" y="588" font-size="9" fill="#6d28d9">• Machine code</text>
  <text x="340" y="601" font-size="9" fill="#6d28d9">• Read-only</text>
  <text x="340" y="614" font-size="9" fill="#6d28d9">• Executable instructions</text>
  <text x="340" y="627" font-size="9" fill="#6d28d9">• Shared between procs</text>

  <!-- Low address label -->
  <text x="55" y="655" text-anchor="middle" font-size="9" fill="#94a3b8" font-style="italic">0x0000...</text>

  <!-- Address direction arrow on left -->
  <line x1="22" y1="630" x2="22" y2="110" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowUp)"/>
  <text x="14" y="370" font-size="9" fill="#475569" font-weight="600" transform="rotate(-90,14,370)">Higher addresses</text>

  <!-- Bottom note -->
  <text x="250" y="688" text-anchor="middle" font-size="10" fill="#64748b">64-bit Linux — user space spans 0x0000... to 0x7FFF...</text>
</svg>