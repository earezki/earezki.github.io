<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="800" height="550" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <marker id="arrowUp" markerWidth="8" markerHeight="6" refX="4" refY="0" orient="auto">
      <polygon points="0 6, 8 6, 4 0" fill="#475569"/>
    </marker>
    <marker id="arrowDown" markerWidth="8" markerHeight="6" refX="4" refY="6" orient="auto">
      <polygon points="0 0, 8 0, 4 6" fill="#475569"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="550" rx="12" fill="url(#bg)" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">The Memory Hierarchy: Speed vs. Capacity</text>
  <text x="400" y="53" text-anchor="middle" font-size="11" fill="#64748b">Each level trades capacity for speed — data moves between layers in cache lines</text>

  <!-- Column headers -->
  <text x="120" y="80" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">LATENCY</text>
  <text x="400" y="80" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">MEMORY LEVEL</text>
  <text x="680" y="80" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">CAPACITY</text>

  <!-- ===== PYRAMID LAYERS ===== -->

  <!-- CPU Registers (top, narrowest) -->
  <polygon points="400,92 340,92 310,132 490,132 460,92" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">CPU Registers</text>
  <!-- Latency -->
  <text x="120" y="116" text-anchor="middle" font-size="12" font-weight="600" fill="#ef4444">~1 cycle</text>
  <text x="120" y="130" text-anchor="middle" font-size="10" fill="#fca5a5">&lt; 1 ns</text>
  <!-- Capacity -->
  <text x="680" y="116" text-anchor="middle" font-size="12" font-weight="600" fill="#ef4444">~1 KB</text>
  <text x="680" y="130" text-anchor="middle" font-size="10" fill="#fca5a5">Few dozen registers</text>

  <!-- L1 Cache -->
  <polygon points="310,138 280,178 520,178 490,138" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="163" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">L1 Cache</text>
  <!-- Latency -->
  <text x="120" y="158" text-anchor="middle" font-size="12" font-weight="600" fill="#d97706">~3-4 cycles</text>
  <text x="120" y="172" text-anchor="middle" font-size="10" fill="#fbbf24">~1-2 ns</text>
  <!-- Capacity -->
  <text x="680" y="158" text-anchor="middle" font-size="12" font-weight="600" fill="#d97706">~64 KB</text>
  <text x="680" y="172" text-anchor="middle" font-size="10" fill="#fbbf24">per core (32K I + 32K D)</text>

  <!-- L2 Cache -->
  <polygon points="280,184 250,224 550,224 520,184" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="209" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">L2 Cache</text>
  <!-- Latency -->
  <text x="120" y="204" text-anchor="middle" font-size="12" font-weight="600" fill="#3b82f6">~10 cycles</text>
  <text x="120" y="218" text-anchor="middle" font-size="10" fill="#93c5fd">~3-5 ns</text>
  <!-- Capacity -->
  <text x="680" y="204" text-anchor="middle" font-size="12" font-weight="600" fill="#3b82f6">~256 KB</text>
  <text x="680" y="218" text-anchor="middle" font-size="10" fill="#93c5fd">per core</text>

  <!-- L3 Cache -->
  <polygon points="250,230 220,270 580,270 550,230" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="255" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">L3 Cache</text>
  <!-- Latency -->
  <text x="120" y="250" text-anchor="middle" font-size="12" font-weight="600" fill="#8b5cf6">~40 cycles</text>
  <text x="120" y="264" text-anchor="middle" font-size="10" fill="#c4b5fd">~10-20 ns</text>
  <!-- Capacity -->
  <text x="680" y="250" text-anchor="middle" font-size="12" font-weight="600" fill="#8b5cf6">8-32 MB</text>
  <text x="680" y="264" text-anchor="middle" font-size="10" fill="#c4b5fd">shared across cores</text>

  <!-- RAM -->
  <polygon points="220,276 190,316 610,316 580,276" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="301" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">Main Memory (RAM)</text>
  <!-- Latency -->
  <text x="120" y="296" text-anchor="middle" font-size="12" font-weight="600" fill="#10b981">~200 cycles</text>
  <text x="120" y="310" text-anchor="middle" font-size="10" fill="#6ee7b7">~50-100 ns</text>
  <!-- Capacity -->
  <text x="680" y="296" text-anchor="middle" font-size="12" font-weight="600" fill="#10b981">8-256 GB</text>
  <text x="680" y="310" text-anchor="middle" font-size="10" fill="#6ee7b7">DDR4/DDR5 DRAM</text>

  <!-- Disk / SSD -->
  <polygon points="190,322 160,362 640,362 610,322" fill="#94a3b8" fill-opacity="0.15" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="347" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Disk (SSD / HDD)</text>
  <!-- Latency -->
  <text x="120" y="337" text-anchor="middle" font-size="12" font-weight="600" fill="#64748b">100K+ cycles</text>
  <text x="120" y="351" text-anchor="middle" font-size="10" fill="#94a3b8">~25μs SSD / ~5ms HDD</text>
  <!-- Capacity -->
  <text x="680" y="337" text-anchor="middle" font-size="12" font-weight="600" fill="#64748b">TB+</text>
  <text x="680" y="351" text-anchor="middle" font-size="10" fill="#94a3b8">Persistent storage</text>

  <!-- ===== SIDE ARROWS ===== -->

  <!-- Left: "Faster" arrow pointing up -->
  <line x1="42" y1="350" x2="42" y2="100" stroke="#475569" stroke-width="2" marker-end="url(#arrowUp)"/>
  <text x="34" y="225" font-size="13" font-weight="700" fill="#475569" transform="rotate(-90,34,225)">Faster</text>

  <!-- Right: "Larger" arrow pointing down -->
  <line x1="758" y1="100" x2="758" y2="350" stroke="#475569" stroke-width="2" marker-end="url(#arrowDown)"/>
  <text x="766" y="225" font-size="13" font-weight="700" fill="#475569" transform="rotate(90,766,225)">Larger</text>

  <!-- ===== CACHE LINE DETAIL BOX ===== -->
  <rect x="110" y="390" width="580" height="140" rx="10" fill="white" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="415" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Cache Line Detail — 64 Bytes</text>
  <text x="400" y="432" text-anchor="middle" font-size="10" fill="#64748b">Data moves between levels in fixed-size blocks called cache lines</text>

  <!-- Cache line: 8 sequential 8-byte cells -->
  <rect x="140" y="445" width="65" height="40" rx="4" fill="#ef4444" fill-opacity="0.12" stroke="#ef4444" stroke-width="1.5"/>
  <text x="172" y="463" text-anchor="middle" font-size="9" font-weight="600" fill="#991b1b">Byte 0-7</text>
  <text x="172" y="477" text-anchor="middle" font-size="8" fill="#dc2626">8 bytes</text>

  <rect x="207" y="445" width="65" height="40" rx="4" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="239" y="463" text-anchor="middle" font-size="9" font-weight="600" fill="#92400e">Byte 8-15</text>
  <text x="239" y="477" text-anchor="middle" font-size="8" fill="#d97706">8 bytes</text>

  <rect x="274" y="445" width="65" height="40" rx="4" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="306" y="463" text-anchor="middle" font-size="9" font-weight="600" fill="#1e40af">Byte 16-23</text>
  <text x="306" y="477" text-anchor="middle" font-size="8" fill="#2563eb">8 bytes</text>

  <rect x="341" y="445" width="65" height="40" rx="4" fill="#8b5cf6" fill-opacity="0.12" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="373" y="463" text-anchor="middle" font-size="9" font-weight="600" fill="#5b21b6">Byte 24-31</text>
  <text x="373" y="477" text-anchor="middle" font-size="8" fill="#7c3aed">8 bytes</text>

  <rect x="408" y="445" width="65" height="40" rx="4" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="1.5"/>
  <text x="440" y="463" text-anchor="middle" font-size="9" font-weight="600" fill="#065f46">Byte 32-39</text>
  <text x="440" y="477" text-anchor="middle" font-size="8" fill="#059669">8 bytes</text>

  <rect x="475" y="445" width="65" height="40" rx="4" fill="#06b6d4" fill-opacity="0.12" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="507" y="463" text-anchor="middle" font-size="9" font-weight="600" fill="#155e75">Byte 40-47</text>
  <text x="507" y="477" text-anchor="middle" font-size="8" fill="#0891b2">8 bytes</text>

  <rect x="542" y="445" width="65" height="40" rx="4" fill="#ec4899" fill-opacity="0.12" stroke="#ec4899" stroke-width="1.5"/>
  <text x="574" y="463" text-anchor="middle" font-size="9" font-weight="600" fill="#9d174d">Byte 48-55</text>
  <text x="574" y="477" text-anchor="middle" font-size="8" fill="#db2777">8 bytes</text>

  <rect x="609" y="445" width="65" height="40" rx="4" fill="#64748b" fill-opacity="0.12" stroke="#64748b" stroke-width="1.5"/>
  <text x="641" y="463" text-anchor="middle" font-size="9" font-weight="600" fill="#334155">Byte 56-63</text>
  <text x="641" y="477" text-anchor="middle" font-size="8" fill="#475569">8 bytes</text>

  <!-- Cache line annotations -->
  <text x="400" y="510" text-anchor="middle" font-size="10" fill="#475569">← 64 bytes total — one cache line fetched at a time →</text>
  <text x="400" y="525" text-anchor="middle" font-size="10" fill="#64748b">Sequential access is fast because adjacent data is already loaded (spatial locality)</text>
</svg>