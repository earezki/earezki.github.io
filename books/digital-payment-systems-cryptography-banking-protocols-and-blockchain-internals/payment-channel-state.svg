<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="pa" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
    <marker id="pg" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="pr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="900" height="500" fill="#f8fafc" rx="8"/>
  <text x="450" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Payment Channel State Machine (Lightning Network)</text>

  <!-- States -->
  <!-- Open -->
  <circle cx="120" cy="130" r="40" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="120" y="127" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">Channel</text>
  <text x="120" y="142" text-anchor="middle" font-size="10" fill="#1e40af">Open</text>

  <!-- Funded -->
  <circle cx="320" cy="130" r="40" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="320" y="127" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">Funded</text>
  <text x="320" y="142" text-anchor="middle" font-size="10" fill="#065f46">(on-chain)</text>

  <!-- Active -->
  <circle cx="550" cy="130" r="50" fill="#16a34a" stroke="#15803d" stroke-width="2"/>
  <text x="550" y="127" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Active</text>
  <text x="550" y="145" text-anchor="middle" font-size="9" fill="#dcfce7">off-chain txns</text>

  <!-- Closing -->
  <circle cx="750" cy="130" r="40" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="750" y="127" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">Closing</text>
  <text x="750" y="142" text-anchor="middle" font-size="10" fill="#92400e">(on-chain)</text>

  <!-- Closed -->
  <circle cx="750" cy="300" r="40" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
  <text x="750" y="297" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">Closed</text>
  <text x="750" y="312" text-anchor="middle" font-size="10" fill="#991b1b">Settled</text>

  <!-- Disputed -->
  <circle cx="550" cy="300" r="45" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="550" y="297" text-anchor="middle" font-size="11" font-weight="700" fill="#9d174d">Disputed</text>
  <text x="550" y="312" text-anchor="middle" font-size="10" fill="#9d174d">Timelock</text>

  <!-- Transitions -->
  <!-- Open -> Funded -->
  <line x1="162" y1="130" x2="278" y2="130" stroke="#475569" stroke-width="1.5" marker-end="url(#pa)"/>
  <text x="220" y="120" text-anchor="middle" font-size="9" fill="#475569">Funding TX</text>
  <text x="220" y="150" text-anchor="middle" font-size="8" fill="#64748b">2-of-2 multisig</text>

  <!-- Funded -> Active -->
  <line x1="362" y1="130" x2="498" y2="130" stroke="#16a34a" stroke-width="1.5" marker-end="url(#pg)"/>
  <text x="430" y="120" text-anchor="middle" font-size="9" fill="#16a34a">Confirmed</text>
  <text x="430" y="150" text-anchor="middle" font-size="8" fill="#64748b">3-6 blocks</text>

  <!-- Active -> Active (self-loop for off-chain updates) -->
  <path d="M 550 78 C 590 40, 630 40, 600 78" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#pg)"/>
  <text x="600" y="55" text-anchor="middle" font-size="9" fill="#16a34a">Update state</text>
  <text x="600" y="68" text-anchor="middle" font-size="8" fill="#64748b">sign new commitment TX</text>

  <!-- Active -> Closing (cooperative) -->
  <line x1="602" y1="130" x2="708" y2="130" stroke="#475569" stroke-width="1.5" marker-end="url(#pa)"/>
  <text x="655" y="120" text-anchor="middle" font-size="9" fill="#475569">Cooperative</text>
  <text x="655" y="150" text-anchor="middle" font-size="8" fill="#64748b">mutual close</text>

  <!-- Closing -> Closed -->
  <line x1="750" y1="172" x2="750" y2="258" stroke="#475569" stroke-width="1.5" marker-end="url(#pa)"/>
  <text x="770" y="220" font-size="9" fill="#475569">Confirmed</text>

  <!-- Active -> Disputed (unilateral) -->
  <line x1="550" y1="182" x2="550" y2="253" stroke="#dc2626" stroke-width="1.5" marker-end="url(#pr)"/>
  <text x="510" y="220" text-anchor="end" font-size="9" fill="#dc2626">Unilateral</text>
  <text x="510" y="235" text-anchor="end" font-size="8" fill="#64748b">broadcast commit TX</text>

  <!-- Disputed -> Closed (timeout) -->
  <line x1="597" y1="300" x2="708" y2="300" stroke="#475569" stroke-width="1.5" marker-end="url(#pa)"/>
  <text x="650" y="290" text-anchor="middle" font-size="9" fill="#475569">Timelock expires</text>

  <!-- Disputed -> Penalty (fraud) -->
  <rect x="350" y="350" width="140" height="50" rx="8" fill="#dc2626" stroke="#991b1b" stroke-width="1.5"/>
  <text x="420" y="375" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Penalty TX</text>
  <text x="420" y="390" text-anchor="middle" font-size="9" fill="#fecaca">Funds to honest party</text>

  <line x1="520" y1="335" x2="490" y2="358" stroke="#dc2626" stroke-width="1.5" marker-end="url(#pr)"/>
  <text x="480" y="340" text-anchor="end" font-size="8" fill="#dc2626">Old state detected</text>

  <!-- State balance boxes -->
  <rect x="30" y="400" width="840" height="85" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="50" y="425" font-size="12" font-weight="700" fill="#0f172a">Off-chain State Updates (Commitment Transactions)</text>

  <rect x="50" y="435" width="150" height="40" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="125" y="452" text-anchor="middle" font-size="9" font-weight="600" fill="#1e40af">State 0</text>
  <text x="125" y="466" text-anchor="middle" font-size="9" fill="#334155">A: 1.0 | B: 0.0</text>

  <rect x="220" y="435" width="150" height="40" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="295" y="452" text-anchor="middle" font-size="9" font-weight="600" fill="#1e40af">State 1</text>
  <text x="295" y="466" text-anchor="middle" font-size="9" fill="#334155">A: 0.7 | B: 0.3</text>

  <rect x="390" y="435" width="150" height="40" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="465" y="452" text-anchor="middle" font-size="9" font-weight="600" fill="#1e40af">State 2</text>
  <text x="465" y="466" text-anchor="middle" font-size="9" fill="#334155">A: 0.4 | B: 0.6</text>

  <rect x="560" y="435" width="150" height="40" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="635" y="452" text-anchor="middle" font-size="9" font-weight="700" fill="#065f46">State N (latest)</text>
  <text x="635" y="466" text-anchor="middle" font-size="9" fill="#334155">A: 0.2 | B: 0.8</text>

  <text x="740" y="460" font-size="9" fill="#64748b">Old states revoked</text>
  <text x="740" y="475" font-size="9" fill="#64748b">via revocation keys</text>
</svg>
