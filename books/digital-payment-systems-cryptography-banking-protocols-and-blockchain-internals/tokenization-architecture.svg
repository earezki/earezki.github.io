<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 500" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="ta" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
    <marker id="tb" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="850" height="500" fill="#f8fafc" rx="8"/>
  <text x="425" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Payment Tokenization Architecture</text>

  <!-- PCI DSS Scope boundary -->
  <rect x="260" y="55" width="340" height="420" rx="12" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="430" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">PCI DSS Scope</text>

  <!-- Merchant (outside scope) -->
  <rect x="30" y="120" width="180" height="70" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="120" y="150" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">Merchant System</text>
  <text x="120" y="170" text-anchor="middle" font-size="10" fill="#b45309">Stores tokens only</text>

  <!-- Token Service Provider -->
  <rect x="280" y="105" width="300" height="100" rx="8" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
  <text x="430" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#f1f5f9">Token Service Provider (TSP)</text>
  <text x="430" y="150" text-anchor="middle" font-size="10" fill="#94a3b8">Visa VTS / Mastercard MDES</text>

  <!-- Sub-components -->
  <rect x="295" y="160" width="120" height="30" rx="4" fill="#2563eb"/>
  <text x="355" y="180" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">Token Vault</text>

  <rect x="440" y="160" width="120" height="30" rx="4" fill="#7c3aed"/>
  <text x="500" y="180" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">Cryptogram Gen</text>

  <!-- Token Vault DB -->
  <rect x="290" y="250" width="140" height="70" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="360" y="275" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">Token Vault DB</text>
  <text x="360" y="295" text-anchor="middle" font-size="9" fill="#3b82f6">PAN ↔ Token map</text>
  <text x="360" y="310" text-anchor="middle" font-size="9" fill="#3b82f6">AES-256 encrypted</text>

  <!-- Domain Restriction -->
  <rect x="450" y="250" width="140" height="70" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="520" y="275" text-anchor="middle" font-size="11" font-weight="600" fill="#3730a3">Domain Controls</text>
  <text x="520" y="295" text-anchor="middle" font-size="9" fill="#4f46e5">Merchant ID</text>
  <text x="520" y="310" text-anchor="middle" font-size="9" fill="#4f46e5">Channel + Amount</text>

  <!-- Arrows inside PCI scope -->
  <line x1="355" y1="190" x2="355" y2="248" stroke="#475569" stroke-width="1.2" marker-end="url(#ta)"/>
  <line x1="500" y1="190" x2="520" y2="248" stroke="#475569" stroke-width="1.2" marker-end="url(#ta)"/>

  <!-- Merchant -> TSP -->
  <line x1="210" y1="140" x2="278" y2="140" stroke="#475569" stroke-width="1.5" marker-end="url(#ta)"/>
  <text x="244" y="130" text-anchor="middle" font-size="9" fill="#475569">PAN</text>

  <!-- TSP -> Merchant (token) -->
  <line x1="278" y1="170" x2="210" y2="170" stroke="#dc2626" stroke-width="1.5" marker-end="url(#tb)"/>
  <text x="244" y="186" text-anchor="middle" font-size="9" fill="#dc2626">Token</text>

  <!-- Cardholder -->
  <rect x="30" y="260" width="180" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="120" y="285" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">Cardholder</text>
  <text x="120" y="302" text-anchor="middle" font-size="10" fill="#3b82f6">Card / Mobile wallet</text>

  <line x1="120" y1="260" x2="120" y2="192" stroke="#475569" stroke-width="1.2" marker-end="url(#ta)"/>

  <!-- Issuer -->
  <rect x="650" y="120" width="170" height="70" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="735" y="150" text-anchor="middle" font-size="13" font-weight="600" fill="#065f46">Issuer</text>
  <text x="735" y="170" text-anchor="middle" font-size="10" fill="#059669">Validates cryptogram</text>

  <line x1="580" y1="155" x2="648" y2="155" stroke="#475569" stroke-width="1.5" marker-end="url(#ta)"/>
  <text x="614" y="145" text-anchor="middle" font-size="9" fill="#475569">De-tokenize</text>

  <!-- Token format example -->
  <rect x="30" y="370" width="790" height="100" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="425" y="395" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Token Format Comparison</text>

  <!-- PAN -->
  <text x="60" y="425" font-size="11" font-weight="600" fill="#334155">Original PAN:</text>
  <rect x="180" y="410" width="40" height="25" rx="3" fill="#fecaca" stroke="#f87171" stroke-width="1"/>
  <text x="200" y="428" text-anchor="middle" font-size="10" fill="#991b1b">4532</text>
  <rect x="225" y="410" width="40" height="25" rx="3" fill="#fecaca" stroke="#f87171" stroke-width="1"/>
  <text x="245" y="428" text-anchor="middle" font-size="10" fill="#991b1b">8723</text>
  <rect x="270" y="410" width="40" height="25" rx="3" fill="#fecaca" stroke="#f87171" stroke-width="1"/>
  <text x="290" y="428" text-anchor="middle" font-size="10" fill="#991b1b">4591</text>
  <rect x="315" y="410" width="40" height="25" rx="3" fill="#fecaca" stroke="#f87171" stroke-width="1"/>
  <text x="335" y="428" text-anchor="middle" font-size="10" fill="#991b1b">0234</text>

  <!-- Token -->
  <text x="430" y="425" font-size="11" font-weight="600" fill="#334155">Token:</text>
  <rect x="500" y="410" width="40" height="25" rx="3" fill="#d1fae5" stroke="#6ee7b7" stroke-width="1"/>
  <text x="520" y="428" text-anchor="middle" font-size="10" fill="#065f46">4532</text>
  <rect x="545" y="410" width="40" height="25" rx="3" fill="#bbf7d0" stroke="#4ade80" stroke-width="1"/>
  <text x="565" y="428" text-anchor="middle" font-size="10" fill="#166534">9981</text>
  <rect x="590" y="410" width="40" height="25" rx="3" fill="#bbf7d0" stroke="#4ade80" stroke-width="1"/>
  <text x="610" y="428" text-anchor="middle" font-size="10" fill="#166534">7743</text>
  <rect x="635" y="410" width="40" height="25" rx="3" fill="#d1fae5" stroke="#6ee7b7" stroke-width="1"/>
  <text x="655" y="428" text-anchor="middle" font-size="10" fill="#065f46">0234</text>

  <text x="120" y="460" font-size="9" fill="#64748b">← Sensitive: full PAN in PCI scope</text>
  <text x="530" y="460" font-size="9" fill="#64748b">← BIN preserved, middle digits replaced, Luhn-valid</text>
</svg>
