<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="fa" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
  </defs>

  <rect width="900" height="520" fill="#f8fafc" rx="8"/>
  <text x="450" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Real-Time Fraud Detection Pipeline</text>

  <!-- Data Sources -->
  <rect x="20" y="70" width="140" height="180" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="90" y="95" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">Data Sources</text>

  <rect x="30" y="110" width="120" height="28" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="90" y="129" text-anchor="middle" font-size="10" fill="#1e40af">Card Transactions</text>

  <rect x="30" y="145" width="120" height="28" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="90" y="164" text-anchor="middle" font-size="10" fill="#1e40af">Device Fingerprint</text>

  <rect x="30" y="180" width="120" height="28" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="90" y="199" text-anchor="middle" font-size="10" fill="#1e40af">Geo / IP Data</text>

  <rect x="30" y="215" width="120" height="28" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="90" y="234" text-anchor="middle" font-size="10" fill="#1e40af">Account History</text>

  <!-- Stream ingestion -->
  <rect x="190" y="100" width="120" height="130" rx="8" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
  <text x="250" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#f1f5f9">Kafka</text>
  <text x="250" y="150" text-anchor="middle" font-size="10" fill="#94a3b8">Topics:</text>
  <text x="250" y="168" text-anchor="middle" font-size="9" fill="#64748b">txn.raw</text>
  <text x="250" y="183" text-anchor="middle" font-size="9" fill="#64748b">txn.enriched</text>
  <text x="250" y="198" text-anchor="middle" font-size="9" fill="#64748b">txn.scored</text>
  <text x="250" y="213" text-anchor="middle" font-size="9" fill="#64748b">alerts</text>

  <line x1="160" y1="160" x2="188" y2="160" stroke="#475569" stroke-width="1.5" marker-end="url(#fa)"/>

  <!-- Feature Engineering -->
  <rect x="340" y="70" width="170" height="120" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="425" y="95" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Feature Engine</text>
  <text x="425" y="115" text-anchor="middle" font-size="9" fill="#334155">(Flink / Spark Streaming)</text>

  <rect x="350" y="128" width="150" height="22" rx="3" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="425" y="143" text-anchor="middle" font-size="9" fill="#64748b">Velocity: txn/hr per card</text>

  <rect x="350" y="155" width="150" height="22" rx="3" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="425" y="170" text-anchor="middle" font-size="9" fill="#64748b">Geo: distance from last txn</text>

  <line x1="310" y1="150" x2="338" y2="140" stroke="#475569" stroke-width="1.5" marker-end="url(#fa)"/>

  <!-- Sliding Windows -->
  <rect x="340" y="210" width="170" height="80" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="425" y="235" text-anchor="middle" font-size="11" font-weight="600" fill="#854d0e">Sliding Windows</text>
  <text x="355" y="255" font-size="9" fill="#64748b">• 5 min tumbling</text>
  <text x="355" y="270" font-size="9" fill="#64748b">• 1 hr sliding</text>
  <text x="355" y="285" font-size="9" fill="#64748b">• 24 hr session</text>

  <line x1="425" y1="190" x2="425" y2="208" stroke="#475569" stroke-width="1.2" marker-end="url(#fa)"/>

  <!-- ML Model -->
  <rect x="550" y="100" width="150" height="100" rx="10" fill="#7c3aed" stroke="#6d28d9" stroke-width="2"/>
  <text x="625" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">ML Model</text>
  <text x="625" y="150" text-anchor="middle" font-size="10" fill="#e9d5ff">Gradient Boosted</text>
  <text x="625" y="168" text-anchor="middle" font-size="10" fill="#e9d5ff">Trees (XGBoost)</text>
  <text x="625" y="188" text-anchor="middle" font-size="9" fill="#c4b5fd">P50 latency: 5ms</text>

  <line x1="510" y1="140" x2="548" y2="150" stroke="#475569" stroke-width="1.5" marker-end="url(#fa)"/>

  <!-- Rules Engine -->
  <rect x="550" y="230" width="150" height="80" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="625" y="255" text-anchor="middle" font-size="12" font-weight="700" fill="#3730a3">Rules Engine</text>
  <text x="565" y="275" font-size="9" fill="#64748b">• Blocklist check</text>
  <text x="565" y="290" font-size="9" fill="#64748b">• Velocity limits</text>
  <text x="565" y="305" font-size="9" fill="#64748b">• Amount thresholds</text>

  <line x1="510" y1="260" x2="548" y2="265" stroke="#475569" stroke-width="1.5" marker-end="url(#fa)"/>

  <!-- Score Combiner -->
  <rect x="740" y="150" width="140" height="80" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="810" y="175" text-anchor="middle" font-size="12" font-weight="700" fill="#9d174d">Score Combiner</text>
  <text x="810" y="195" text-anchor="middle" font-size="10" fill="#db2777">Ensemble</text>
  <text x="810" y="215" text-anchor="middle" font-size="9" fill="#64748b">ML score × rule weight</text>

  <line x1="700" y1="160" x2="738" y2="175" stroke="#475569" stroke-width="1.5" marker-end="url(#fa)"/>
  <line x1="700" y1="270" x2="755" y2="230" stroke="#475569" stroke-width="1.5" marker-end="url(#fa)"/>

  <!-- Decision outcomes -->
  <rect x="30" y="340" width="840" height="160" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="450" y="370" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Decision Outcomes (by risk score threshold)</text>

  <!-- Approve -->
  <rect x="50" y="390" width="200" height="90" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="150" y="415" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">APPROVE</text>
  <text x="150" y="435" text-anchor="middle" font-size="10" fill="#334155">Score &lt; 0.3</text>
  <text x="150" y="455" text-anchor="middle" font-size="9" fill="#64748b">~95% of transactions</text>
  <text x="150" y="470" text-anchor="middle" font-size="9" fill="#64748b">Latency budget: &lt; 100ms</text>

  <!-- Review -->
  <rect x="280" y="390" width="200" height="90" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="380" y="415" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">REVIEW</text>
  <text x="380" y="435" text-anchor="middle" font-size="10" fill="#334155">0.3 ≤ Score &lt; 0.7</text>
  <text x="380" y="455" text-anchor="middle" font-size="9" fill="#64748b">~3% — step-up auth</text>
  <text x="380" y="470" text-anchor="middle" font-size="9" fill="#64748b">3DS challenge / OTP</text>

  <!-- Decline -->
  <rect x="510" y="390" width="200" height="90" rx="6" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/>
  <text x="610" y="415" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">DECLINE</text>
  <text x="610" y="435" text-anchor="middle" font-size="10" fill="#334155">Score ≥ 0.7</text>
  <text x="610" y="455" text-anchor="middle" font-size="9" fill="#64748b">~1.5% — hard block</text>
  <text x="610" y="470" text-anchor="middle" font-size="9" fill="#64748b">Alert to fraud team</text>

  <!-- Block -->
  <rect x="740" y="390" width="120" height="90" rx="6" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
  <text x="800" y="415" text-anchor="middle" font-size="12" font-weight="700" fill="#f87171">BLOCK</text>
  <text x="800" y="435" text-anchor="middle" font-size="10" fill="#f1f5f9">Score ≥ 0.95</text>
  <text x="800" y="455" text-anchor="middle" font-size="9" fill="#94a3b8">~0.5%</text>
  <text x="800" y="470" text-anchor="middle" font-size="9" fill="#94a3b8">Card freeze</text>

  <!-- Arrows to decisions -->
  <line x1="810" y1="230" x2="810" y2="338" stroke="#475569" stroke-width="1.5" marker-end="url(#fa)"/>
</svg>
