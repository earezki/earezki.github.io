<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" fill="#f8fafc" rx="8"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Four-Party Payment Model</text>

  <!-- Cardholder -->
  <rect x="40" y="70" width="160" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="120" y="105" text-anchor="middle" font-size="14" font-weight="600" fill="#1e40af">Cardholder</text>
  <text x="120" y="125" text-anchor="middle" font-size="11" fill="#3b82f6">Presents card / token</text>

  <!-- Merchant -->
  <rect x="370" y="70" width="160" height="80" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="450" y="105" text-anchor="middle" font-size="14" font-weight="600" fill="#92400e">Merchant</text>
  <text x="450" y="125" text-anchor="middle" font-size="11" fill="#b45309">POS / e-commerce</text>

  <!-- Acquirer -->
  <rect x="370" y="240" width="160" height="80" rx="10" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="450" y="270" text-anchor="middle" font-size="14" font-weight="600" fill="#3730a3">Acquirer</text>
  <text x="450" y="290" text-anchor="middle" font-size="11" fill="#4f46e5">Merchant's bank</text>

  <!-- Card Network -->
  <rect x="370" y="400" width="160" height="80" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="450" y="430" text-anchor="middle" font-size="14" font-weight="600" fill="#9d174d">Card Network</text>
  <text x="450" y="450" text-anchor="middle" font-size="11" fill="#db2777">Visa / Mastercard</text>

  <!-- Issuer -->
  <rect x="700" y="240" width="160" height="80" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="780" y="270" text-anchor="middle" font-size="14" font-weight="600" fill="#065f46">Issuer</text>
  <text x="780" y="290" text-anchor="middle" font-size="11" fill="#059669">Cardholder's bank</text>

  <!-- Payment Processor -->
  <rect x="40" y="240" width="160" height="80" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="120" y="270" text-anchor="middle" font-size="14" font-weight="600" fill="#5b21b6">Payment</text>
  <text x="120" y="290" text-anchor="middle" font-size="11" fill="#7c3aed">Processor / Gateway</text>

  <!-- Arrows with labels -->
  <!-- Cardholder -> Merchant -->
  <line x1="200" y1="110" x2="368" y2="110" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="284" y="100" text-anchor="middle" font-size="10" fill="#475569">1. Auth request</text>

  <!-- Merchant -> Acquirer -->
  <line x1="450" y1="152" x2="450" y2="238" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="500" y="200" text-anchor="start" font-size="10" fill="#475569">2. ISO 8583</text>

  <!-- Acquirer -> Card Network -->
  <line x1="450" y1="322" x2="450" y2="398" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="500" y="365" text-anchor="start" font-size="10" fill="#475569">3. Route</text>

  <!-- Card Network -> Issuer -->
  <line x1="532" y1="430" x2="700" y2="300" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="640" y="385" text-anchor="middle" font-size="10" fill="#475569">4. Auth request</text>

  <!-- Issuer -> Card Network (response) -->
  <line x1="700" y1="260" x2="532" y2="410" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowhead-green)"/>
  <text x="650" y="320" text-anchor="middle" font-size="10" fill="#16a34a">5. Approve/Decline</text>

  <!-- Card Network -> Acquirer (response) -->
  <line x1="430" y1="398" x2="430" y2="322" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowhead-green)"/>
  <text x="395" y="365" text-anchor="end" font-size="10" fill="#16a34a">6. Response</text>

  <!-- Acquirer -> Merchant (response) -->
  <line x1="430" y1="238" x2="430" y2="152" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowhead-green)"/>
  <text x="395" y="200" text-anchor="end" font-size="10" fill="#16a34a">7. Response</text>

  <!-- Merchant -> Payment Processor -->
  <line x1="370" y1="140" x2="200" y2="250" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowhead-blue)"/>
  <text x="260" y="175" text-anchor="middle" font-size="10" fill="#2563eb">via Gateway</text>

  <!-- Settlement box -->
  <rect x="40" y="400" width="260" height="80" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="170" y="425" text-anchor="middle" font-size="12" font-weight="600" fill="#854d0e">Settlement (T+1 / T+2)</text>
  <text x="170" y="445" text-anchor="middle" font-size="10" fill="#a16207">Clearing files exchanged</text>
  <text x="170" y="460" text-anchor="middle" font-size="10" fill="#a16207">Net positions calculated</text>
  <text x="170" y="475" text-anchor="middle" font-size="10" fill="#a16207">Funds transferred via ACH/RTGS</text>

  <!-- Legend -->
  <line x1="700" y1="420" x2="740" y2="420" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="750" y="424" font-size="10" fill="#475569">Request flow</text>
  <line x1="700" y1="445" x2="740" y2="445" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrowhead-green)"/>
  <text x="750" y="449" font-size="10" fill="#16a34a">Response flow</text>
  <line x1="700" y1="470" x2="740" y2="470" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowhead-blue)"/>
  <text x="750" y="474" font-size="10" fill="#2563eb">Gateway routing</text>
</svg>
