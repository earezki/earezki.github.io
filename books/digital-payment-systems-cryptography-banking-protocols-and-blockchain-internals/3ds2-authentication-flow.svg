<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="da" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
    <marker id="dg" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="dr" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="900" height="580" fill="#f8fafc" rx="8"/>
  <text x="450" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">3D Secure 2.0 — Authentication Protocol Flow</text>

  <!-- Swim lanes -->
  <rect x="30" y="55" width="130" height="500" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="95" y="78" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">Cardholder</text>
  <text x="95" y="92" text-anchor="middle" font-size="9" fill="#3b82f6">Browser/App</text>

  <rect x="180" y="55" width="150" height="500" rx="6" fill="#fefce8" stroke="#fde68a" stroke-width="1"/>
  <text x="255" y="78" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">3DS Server</text>
  <text x="255" y="92" text-anchor="middle" font-size="9" fill="#b45309">(Merchant side)</text>

  <rect x="350" y="55" width="150" height="500" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="425" y="78" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">Directory</text>
  <text x="425" y="92" text-anchor="middle" font-size="9" fill="#059669">Server (DS)</text>

  <rect x="520" y="55" width="170" height="500" rx="6" fill="#fdf2f8" stroke="#fbcfe8" stroke-width="1"/>
  <text x="605" y="78" text-anchor="middle" font-size="12" font-weight="700" fill="#9d174d">ACS</text>
  <text x="605" y="92" text-anchor="middle" font-size="9" fill="#db2777">Access Control Server</text>

  <rect x="710" y="55" width="170" height="500" rx="6" fill="#f3e8ff" stroke="#d8b4fe" stroke-width="1"/>
  <text x="795" y="78" text-anchor="middle" font-size="12" font-weight="700" fill="#7c3aed">Issuer</text>
  <text x="795" y="92" text-anchor="middle" font-size="9" fill="#8b5cf6">Risk Engine</text>

  <!-- Step 1: Checkout -->
  <rect x="40" y="110" width="110" height="35" rx="4" fill="#fff" stroke="#94a3b8" stroke-width="1"/>
  <text x="95" y="132" text-anchor="middle" font-size="10" fill="#334155">Checkout</text>
  <line x1="150" y1="127" x2="195" y2="127" stroke="#475569" stroke-width="1.5" marker-end="url(#da)"/>
  <text x="173" y="120" text-anchor="middle" font-size="8" fill="#475569">1</text>

  <!-- Step 2: AReq -->
  <rect x="195" y="155" width="120" height="35" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="255" y="177" text-anchor="middle" font-size="10" fill="#92400e">Build AReq</text>
  <line x1="315" y1="172" x2="365" y2="172" stroke="#475569" stroke-width="1.5" marker-end="url(#da)"/>
  <text x="340" y="165" text-anchor="middle" font-size="8" fill="#475569">2</text>

  <!-- Step 3: DS routes to ACS -->
  <rect x="365" y="195" width="120" height="35" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="1"/>
  <text x="425" y="217" text-anchor="middle" font-size="10" fill="#166534">Route by BIN</text>
  <line x1="485" y1="212" x2="535" y2="212" stroke="#475569" stroke-width="1.5" marker-end="url(#da)"/>
  <text x="510" y="205" text-anchor="middle" font-size="8" fill="#475569">3</text>

  <!-- Step 4: Risk Assessment -->
  <rect x="535" y="240" width="140" height="45" rx="4" fill="#fce7f3" stroke="#db2777" stroke-width="1"/>
  <text x="605" y="260" text-anchor="middle" font-size="10" font-weight="600" fill="#9d174d">Risk Assessment</text>
  <text x="605" y="275" text-anchor="middle" font-size="9" fill="#db2777">Device + Behavior data</text>
  <line x1="675" y1="262" x2="725" y2="262" stroke="#475569" stroke-width="1.5" marker-end="url(#da)"/>
  <text x="700" y="255" text-anchor="middle" font-size="8" fill="#475569">4</text>

  <rect x="725" y="245" width="140" height="35" rx="4" fill="#f3e8ff" stroke="#d8b4fe" stroke-width="1"/>
  <text x="795" y="267" text-anchor="middle" font-size="10" fill="#7c3aed">Score risk</text>

  <!-- Decision point -->
  <polygon points="605,320 640,345 605,370 570,345" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="605" y="349" text-anchor="middle" font-size="9" font-weight="700" fill="#92400e">RBA</text>

  <line x1="605" y1="285" x2="605" y2="318" stroke="#475569" stroke-width="1.2" marker-end="url(#da)"/>

  <!-- Frictionless path -->
  <line x1="640" y1="345" x2="750" y2="345" stroke="#16a34a" stroke-width="2" marker-end="url(#dg)"/>
  <text x="695" y="338" text-anchor="middle" font-size="9" font-weight="600" fill="#16a34a">LOW RISK</text>

  <rect x="535" y="385" width="140" height="35" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="605" y="407" text-anchor="middle" font-size="10" font-weight="600" fill="#065f46">ARes: Frictionless</text>
  <line x1="605" y1="370" x2="605" y2="383" stroke="#16a34a" stroke-width="1.5" marker-end="url(#dg)"/>

  <!-- Challenge path -->
  <line x1="570" y1="345" x2="95" y2="345" stroke="#dc2626" stroke-width="2" marker-end="url(#dr)"/>
  <text x="330" y="338" text-anchor="middle" font-size="9" font-weight="600" fill="#dc2626">HIGH RISK → Challenge</text>

  <rect x="40" y="380" width="110" height="45" rx="4" fill="#fecaca" stroke="#f87171" stroke-width="1.5"/>
  <text x="95" y="398" text-anchor="middle" font-size="10" font-weight="600" fill="#991b1b">OTP / Biometric</text>
  <text x="95" y="415" text-anchor="middle" font-size="9" fill="#b91c1c">Challenge UI</text>

  <!-- Challenge response -->
  <line x1="150" y1="402" x2="535" y2="440" stroke="#475569" stroke-width="1.2" marker-end="url(#da)"/>
  <text x="340" y="430" text-anchor="middle" font-size="8" fill="#475569">5. CReq (challenge response)</text>

  <rect x="535" y="430" width="140" height="30" rx="4" fill="#fce7f3" stroke="#db2777" stroke-width="1"/>
  <text x="605" y="450" text-anchor="middle" font-size="10" fill="#9d174d">Verify OTP</text>

  <!-- Final result -->
  <rect x="195" y="480" width="280" height="45" rx="6" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
  <text x="335" y="503" text-anchor="middle" font-size="12" font-weight="700" fill="#f1f5f9">Authentication Value (CAVV)</text>
  <text x="335" y="518" text-anchor="middle" font-size="9" fill="#94a3b8">Included in authorization message (DE 48)</text>

  <line x1="535" y1="460" x2="475" y2="490" stroke="#16a34a" stroke-width="1.5" marker-end="url(#dg)"/>
  <line x1="605" y1="420" x2="440" y2="490" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#dg)"/>

  <!-- ECI values -->
  <rect x="530" y="480" width="160" height="60" rx="4" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="610" y="500" text-anchor="middle" font-size="10" font-weight="600" fill="#334155">ECI Values</text>
  <text x="540" y="518" font-size="9" fill="#16a34a">05 — Fully authenticated</text>
  <text x="540" y="533" font-size="9" fill="#d97706">06 — Attempted (issuer)</text>
</svg>
