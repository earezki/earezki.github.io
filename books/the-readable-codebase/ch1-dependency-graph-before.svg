<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <rect width="900" height="600" fill="#0f172a"/>
  <text x="450" y="40" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="18" font-weight="bold">Logistics Platform: Module Dependency Graph (Before Restructuring)</text>

  <!-- Central model package -->
  <rect x="350" y="250" width="200" height="60" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <text x="450" y="275" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="14" font-weight="bold">model</text>
  <text x="450" y="295" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">87 public classes</text>

  <!-- Service package -->
  <rect x="50" y="120" width="180" height="55" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <text x="140" y="145" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="14" font-weight="bold">service</text>
  <text x="140" y="162" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">67 classes</text>

  <!-- Controller package -->
  <rect x="350" y="50" width="200" height="50" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="450" y="80" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="14" font-weight="bold">controller</text>
  <text x="450" y="95" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">42 classes</text>

  <!-- Repository package -->
  <rect x="670" y="120" width="180" height="55" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="760" y="145" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="14" font-weight="bold">repository</text>
  <text x="760" y="162" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">38 classes</text>

  <!-- DTO package -->
  <rect x="50" y="380" width="180" height="55" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="140" y="405" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="14" font-weight="bold">dto</text>
  <text x="140" y="422" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">54 classes</text>

  <!-- Util package -->
  <rect x="670" y="380" width="180" height="55" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <text x="760" y="405" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="14" font-weight="bold">util</text>
  <text x="760" y="422" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">23 classes</text>

  <!-- Exception package -->
  <rect x="350" y="460" width="200" height="50" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <text x="450" y="490" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="14" font-weight="bold">exception</text>
  <text x="450" y="505" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">15 classes</text>

  <!-- Dependency arrows - Everything depends on model (red/warning) -->
  <line x1="140" y1="175" x2="360" y2="255" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <line x1="450" y1="100" x2="450" y2="250" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <line x1="760" y1="175" x2="540" y2="255" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <line x1="140" y1="380" x2="360" y2="305" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <line x1="760" y1="380" x2="540" y2="305" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <!-- Cross-layer violations -->
  <path d="M 450 100 C 300 110 280 120 230 120" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#arrowRed)"/>
  <text x="310" y="108" fill="#ef4444" font-family="sans-serif" font-size="10">controller→service</text>

  <!-- Cyclic dependency: service ↔ service (self) -->
  <path d="M 50 147 C 20 147 20 100 50 100 L 50 120" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="8" y="95" fill="#ef4444" font-family="sans-serif" font-size="9" transform="rotate(-90, 8, 95)">cyclic</text>

  <!-- Cyclic: service ↔ repository -->
  <line x1="230" y1="147" x2="670" y2="147" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="450" y="140" text-anchor="middle" fill="#ef4444" font-family="sans-serif" font-size="10">cyclic dependency</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- Legend -->
  <rect x="30" y="520" width="840" height="55" rx="6" fill="#1e293b"/>
  <line x1="50" y1="547" x2="90" y2="547" stroke="#ef4444" stroke-width="2"/>
  <text x="95" y="551" fill="#94a3b8" font-family="sans-serif" font-size="11">Cyclic / problematic dependency</text>
  <line x1="320" y1="547" x2="360" y2="547" stroke="#ef4444" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="365" y="551" fill="#94a3b8" font-family="sans-serif" font-size="11">Layer violation</text>
  <text x="580" y="551" fill="#94a3b8" font-family="sans-serif" font-size="11">All 338 classes are public. No boundary enforcement.</text>
</svg>
