<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <rect width="900" height="500" fill="#0f172a"/>
  <text x="450" y="30" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="16" font-weight="bold">Package Restructuring: Layer-Based → Feature-Based</text>

  <!-- LEFT SIDE: Layer-based -->
  <text x="220" y="60" text-anchor="middle" fill="#ef4444" font-family="sans-serif" font-size="13" font-weight="bold">BEFORE: Layer-Based</text>
  <text x="220" y="78" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="10">Understanding tracking requires 6 packages</text>

  <rect x="30" y="90" width="380" height="360" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>

  <!-- Layer packages -->
  <rect x="50" y="105" width="140" height="35" rx="5" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="120" y="127" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="11">controller/ (42)</text>

  <rect x="220" y="105" width="140" height="35" rx="5" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="290" y="127" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="11">service/ (67)</text>

  <rect x="50" y="155" width="140" height="35" rx="5" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="120" y="177" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="11">repository/ (38)</text>

  <rect x="220" y="155" width="140" height="35" rx="5" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="290" y="177" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="11">model/ (87)</text>

  <rect x="50" y="205" width="140" height="35" rx="5" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="120" y="227" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="11">dto/ (54)</text>

  <rect x="220" y="205" width="140" height="35" rx="5" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="290" y="227" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="11">util/ (23)</text>

  <!-- Cross-cutting feature highlight -->
  <text x="220" y="268" text-anchor="middle" fill="#f59e0b" font-family="sans-serif" font-size="11" font-weight="bold">Tracking feature spans all packages:</text>

  <rect x="50" y="280" width="340" height="22" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="220" y="296" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="9">controller/TrackingController.java</text>

  <rect x="50" y="308" width="340" height="22" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="220" y="324" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="9">service/ShipmentTrackingService.java</text>

  <rect x="50" y="336" width="340" height="22" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="220" y="352" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="9">repository/TrackingEventRepository.java</text>

  <rect x="50" y="364" width="340" height="22" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="220" y="380" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="9">model/TrackingEvent.java, dto/TrackingDTO.java</text>

  <rect x="50" y="392" width="340" height="22" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="220" y="408" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="9">util/TrackingNumberParser.java</text>

  <!-- RIGHT SIDE: Feature-based -->
  <text x="670" y="60" text-anchor="middle" fill="#22c55e" font-family="sans-serif" font-size="13" font-weight="bold">AFTER: Feature-Based</text>
  <text x="670" y="78" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="10">Understanding tracking requires 1 package</text>

  <rect x="490" y="90" width="380" height="360" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="1"/>

  <!-- Feature packages -->
  <rect x="510" y="105" width="160" height="80" rx="5" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="590" y="122" text-anchor="middle" fill="#22c55e" font-family="sans-serif" font-size="11" font-weight="bold">shipment/</text>
  <text x="590" y="140" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="9">tracking/ (8 classes)</text>
  <text x="590" y="155" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="9">creation/ (6 classes)</text>
  <text x="590" y="170" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="9">labeling/ (5 classes)</text>

  <rect x="700" y="105" width="150" height="80" rx="5" fill="#0f172a" stroke="#22c55e" stroke-width="1"/>
  <text x="775" y="122" text-anchor="middle" fill="#22c55e" font-family="sans-serif" font-size="11" font-weight="bold">warehouse/</text>
  <text x="775" y="140" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="9">inventory/ (7 classes)</text>
  <text x="775" y="155" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="9">picking/ (5 classes)</text>

  <rect x="510" y="200" width="160" height="65" rx="5" fill="#0f172a" stroke="#22c55e" stroke-width="1"/>
  <text x="590" y="217" text-anchor="middle" fill="#22c55e" font-family="sans-serif" font-size="11" font-weight="bold">carrier/</text>
  <text x="590" y="235" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="9">integration/ (6 classes)</text>
  <text x="590" y="250" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="9">rating/ (4 classes)</text>

  <rect x="700" y="200" width="150" height="65" rx="5" fill="#0f172a" stroke="#22c55e" stroke-width="1"/>
  <text x="775" y="217" text-anchor="middle" fill="#22c55e" font-family="sans-serif" font-size="11" font-weight="bold">billing/</text>
  <text x="775" y="235" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="9">invoicing/ (5 classes)</text>
  <text x="775" y="250" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="9">reconciliation/ (4)</text>

  <rect x="600" y="285" width="160" height="45" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="680" y="305" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">shared/</text>
  <text x="680" y="320" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="9">address, events, notification</text>

  <!-- Dependency arrows (minimal, feature-to-shared) -->
  <line x1="590" y1="185" x2="650" y2="285" stroke="#38bdf8" stroke-width="1" marker-end="url(#arrowB)"/>
  <line x1="775" y1="265" x2="720" y2="285" stroke="#38bdf8" stroke-width="1" marker-end="url(#arrowB)"/>

  <!-- Metrics comparison -->
  <rect x="510" y="350" width="340" height="85" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1"/>
  <text x="680" y="370" text-anchor="middle" fill="#22c55e" font-family="sans-serif" font-size="11" font-weight="bold">Key Metric</text>
  <text x="530" y="390" fill="#94a3b8" font-family="sans-serif" font-size="10">Packages to read for tracking:</text>
  <text x="810" y="390" text-anchor="end" fill="#ef4444" font-family="sans-serif" font-size="10">6 → </text>
  <text x="830" y="390" text-anchor="end" fill="#22c55e" font-family="sans-serif" font-size="10" font-weight="bold">1</text>
  <text x="530" y="410" fill="#94a3b8" font-family="sans-serif" font-size="10">Largest package:</text>
  <text x="810" y="410" text-anchor="end" fill="#ef4444" font-family="sans-serif" font-size="10">67 → </text>
  <text x="830" y="410" text-anchor="end" fill="#22c55e" font-family="sans-serif" font-size="10" font-weight="bold">11</text>
  <text x="530" y="430" fill="#94a3b8" font-family="sans-serif" font-size="10">Circular dependencies:</text>
  <text x="810" y="430" text-anchor="end" fill="#ef4444" font-family="sans-serif" font-size="10">8 → </text>
  <text x="830" y="430" text-anchor="end" fill="#22c55e" font-family="sans-serif" font-size="10" font-weight="bold">0</text>

  <defs>
    <marker id="arrowB" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- Center arrow -->
  <text x="450" y="280" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="28">→</text>
</svg>
