<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420">
  <rect width="900" height="420" fill="#0f172a"/>
  <text x="450" y="35" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="16" font-weight="bold">Design Problems Revealed by Naming Difficulty</text>

  <!-- Left column: Naming Difficulty -->
  <rect x="40" y="70" width="300" height="300" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <text x="190" y="95" text-anchor="middle" fill="#ef4444" font-family="sans-serif" font-size="14" font-weight="bold">Naming Difficulty</text>

  <rect x="60" y="115" width="260" height="45" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="190" y="135" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="11">Method resists a single verb</text>
  <text x="190" y="152" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">processOrder(), handleData()</text>

  <rect x="60" y="175" width="260" height="45" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="190" y="195" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="11">Class resists a single noun</text>
  <text x="190" y="212" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">ShipmentManager, DataHelper</text>

  <rect x="60" y="235" width="260" height="45" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="190" y="255" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="11">Parameter resists a descriptive name</text>
  <text x="190" y="272" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">context, data, flag</text>

  <rect x="60" y="295" width="260" height="45" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
  <text x="190" y="315" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="11">Comment needed to explain the name</text>
  <text x="190" y="332" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">// this calculates the rate</text>

  <!-- Arrows -->
  <line x1="340" y1="137" x2="540" y2="137" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="340" y1="197" x2="540" y2="197" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="340" y1="257" x2="540" y2="257" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="340" y1="317" x2="540" y2="317" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Middle labels -->
  <text x="440" y="128" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="9">signals</text>
  <text x="440" y="188" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="9">signals</text>
  <text x="440" y="248" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="9">signals</text>
  <text x="440" y="308" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="9">signals</text>

  <!-- Right column: Design Problem -->
  <rect x="540" y="70" width="320" height="300" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
  <text x="700" y="95" text-anchor="middle" fill="#22c55e" font-family="sans-serif" font-size="14" font-weight="bold">Design Problem → Fix</text>

  <rect x="560" y="115" width="280" height="45" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1"/>
  <text x="700" y="135" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="11">Method does multiple things</text>
  <text x="700" y="152" text-anchor="middle" fill="#22c55e" font-family="sans-serif" font-size="10">→ Split until each piece has obvious name</text>

  <rect x="560" y="175" width="280" height="45" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1"/>
  <text x="700" y="195" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="11">Class spans multiple responsibilities</text>
  <text x="700" y="212" text-anchor="middle" fill="#22c55e" font-family="sans-serif" font-size="10">→ Extract responsibility clusters</text>

  <rect x="560" y="235" width="280" height="45" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1"/>
  <text x="700" y="255" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="11">Collapsed abstraction (data bag)</text>
  <text x="700" y="272" text-anchor="middle" fill="#22c55e" font-family="sans-serif" font-size="10">→ Split into cohesive records</text>

  <rect x="560" y="295" width="280" height="45" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1"/>
  <text x="700" y="315" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="11">Name describes implementation</text>
  <text x="700" y="332" text-anchor="middle" fill="#22c55e" font-family="sans-serif" font-size="10">→ Rename to describe purpose/contract</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- Bottom annotation -->
  <text x="450" y="400" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">The struggle to name is a compass pointing at the structural problem. Do not solve it with a thesaurus.</text>
</svg>
