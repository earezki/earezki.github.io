<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400">
  <rect width="900" height="400" fill="#0f172a"/>
  <text x="450" y="30" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="16" font-weight="bold">Module Boundary Enforcement: Public API Surface</text>

  <!-- Package boundary -->
  <rect x="200" y="55" width="500" height="300" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="450" y="80" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold">carrier/ package</text>

  <!-- Public API Surface -->
  <rect x="230" y="95" width="440" height="90" rx="8" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
  <text x="450" y="115" text-anchor="middle" fill="#22c55e" font-family="sans-serif" font-size="12" font-weight="bold">PUBLIC API SURFACE</text>

  <rect x="250" y="130" width="180" height="40" rx="5" fill="#1e293b" stroke="#22c55e" stroke-width="1"/>
  <text x="340" y="155" text-anchor="middle" fill="#22c55e" font-family="monospace" font-size="11">CarrierGateway</text>

  <rect x="460" y="130" width="190" height="40" rx="5" fill="#1e293b" stroke="#22c55e" stroke-width="1"/>
  <text x="555" y="155" text-anchor="middle" fill="#22c55e" font-family="monospace" font-size="11">CarrierEvent (sealed)</text>

  <!-- Package-private internals -->
  <rect x="230" y="200" width="440" height="140" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="450" y="220" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="bold">PACKAGE-PRIVATE INTERNALS</text>

  <rect x="245" y="232" width="130" height="30" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="310" y="252" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="9">ConnectionPool</text>

  <rect x="385" y="232" width="130" height="30" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="450" y="252" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="9">ResponseMapper</text>

  <rect x="525" y="232" width="130" height="30" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="590" y="252" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="9">CircuitBreaker</text>

  <rect x="280" y="272" width="110" height="30" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="335" y="292" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="9">UpsAdapter</text>

  <rect x="400" y="272" width="110" height="30" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="455" y="292" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="9">FedExAdapter</text>

  <rect x="520" y="272" width="110" height="30" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="575" y="292" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="9">DhlAdapter</text>

  <!-- External packages -->
  <rect x="30" y="120" width="140" height="40" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="100" y="145" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="11">billing/</text>

  <rect x="30" y="200" width="140" height="40" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="100" y="225" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="11">shipment/</text>

  <!-- Valid dependency arrows -->
  <line x1="170" y1="140" x2="248" y2="150" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <line x1="170" y1="220" x2="248" y2="150" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrowG)"/>

  <!-- Blocked dependency -->
  <rect x="730" y="160" width="140" height="40" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
  <text x="800" y="185" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="11">warehouse/</text>

  <line x1="730" y1="180" x2="660" y2="252" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="710" y="210" fill="#ef4444" font-family="sans-serif" font-size="10">✕ blocked</text>
  <text x="710" y="222" fill="#ef4444" font-family="sans-serif" font-size="9">(not public)</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowG" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#22c55e"/>
    </marker>
  </defs>

  <!-- Legend -->
  <rect x="200" y="365" width="500" height="28" rx="5" fill="#1e293b"/>
  <rect x="220" y="373" width="10" height="10" rx="2" fill="#22c55e"/>
  <text x="235" y="383" fill="#94a3b8" font-family="sans-serif" font-size="10">Public (accessible)</text>
  <rect x="380" y="373" width="10" height="10" rx="2" fill="#475569"/>
  <text x="395" y="383" fill="#94a3b8" font-family="sans-serif" font-size="10">Package-private (compiler-enforced)</text>
  <rect x="590" y="373" width="10" height="10" rx="2" fill="#ef4444"/>
  <text x="605" y="383" fill="#94a3b8" font-family="sans-serif" font-size="10">Blocked</text>
</svg>
