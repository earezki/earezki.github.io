<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350">
  <rect width="900" height="350" fill="#0f172a"/>
  <text x="450" y="35" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="16" font-weight="bold">Naming Clarity Spectrum</text>

  <!-- Arrow bar -->
  <defs>
    <linearGradient id="spectrumGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>
  <rect x="60" y="70" width="780" height="12" rx="6" fill="url(#spectrumGrad)" opacity="0.6"/>

  <!-- Labels -->
  <text x="60" y="60" fill="#ef4444" font-family="sans-serif" font-size="12" font-weight="bold">Opaque</text>
  <text x="420" y="60" text-anchor="middle" fill="#f59e0b" font-family="sans-serif" font-size="12" font-weight="bold">Context-Dependent</text>
  <text x="800" y="60" text-anchor="end" fill="#22c55e" font-family="sans-serif" font-size="12" font-weight="bold">Self-Documenting</text>

  <!-- Cost labels -->
  <text x="60" y="100" fill="#ef4444" font-family="sans-serif" font-size="10">1 working memory slot per variable</text>
  <text x="420" y="100" text-anchor="middle" fill="#f59e0b" font-family="sans-serif" font-size="10">0.5 slots (sometimes clear)</text>
  <text x="800" y="100" text-anchor="end" fill="#22c55e" font-family="sans-serif" font-size="10">0 slots (instantly understood)</text>

  <!-- Bad names -->
  <rect x="60" y="120" width="220" height="180" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <text x="170" y="145" text-anchor="middle" fill="#ef4444" font-family="sans-serif" font-size="13" font-weight="bold">Opaque Names</text>
  <text x="80" y="170" fill="#e2e8f0" font-family="monospace" font-size="12">d</text>
  <text x="80" y="190" fill="#e2e8f0" font-family="monospace" font-size="12">temp</text>
  <text x="80" y="210" fill="#e2e8f0" font-family="monospace" font-size="12">data</text>
  <text x="80" y="230" fill="#e2e8f0" font-family="monospace" font-size="12">val</text>
  <text x="80" y="250" fill="#e2e8f0" font-family="monospace" font-size="12">obj</text>
  <text x="80" y="270" fill="#e2e8f0" font-family="monospace" font-size="12">flag</text>
  <text x="80" y="290" fill="#e2e8f0" font-family="monospace" font-size="12">processData()</text>

  <!-- Medium names -->
  <rect x="340" y="120" width="220" height="180" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="450" y="145" text-anchor="middle" fill="#f59e0b" font-family="sans-serif" font-size="13" font-weight="bold">Context-Dependent</text>
  <text x="360" y="170" fill="#e2e8f0" font-family="monospace" font-size="12">result</text>
  <text x="360" y="190" fill="#e2e8f0" font-family="monospace" font-size="12">info</text>
  <text x="360" y="210" fill="#e2e8f0" font-family="monospace" font-size="12">status</text>
  <text x="360" y="230" fill="#e2e8f0" font-family="monospace" font-size="12">items</text>
  <text x="360" y="250" fill="#e2e8f0" font-family="monospace" font-size="12">config</text>
  <text x="360" y="270" fill="#e2e8f0" font-family="monospace" font-size="12">service</text>
  <text x="360" y="290" fill="#e2e8f0" font-family="monospace" font-size="12">getItems()</text>

  <!-- Good names -->
  <rect x="620" y="120" width="220" height="180" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
  <text x="730" y="145" text-anchor="middle" fill="#22c55e" font-family="sans-serif" font-size="13" font-weight="bold">Self-Documenting</text>
  <text x="640" y="170" fill="#e2e8f0" font-family="monospace" font-size="12">shipmentWeight</text>
  <text x="640" y="190" fill="#e2e8f0" font-family="monospace" font-size="12">carrierBaseRate</text>
  <text x="640" y="210" fill="#e2e8f0" font-family="monospace" font-size="12">deliveryDeadline</text>
  <text x="640" y="230" fill="#e2e8f0" font-family="monospace" font-size="12">inventoryItems</text>
  <text x="640" y="250" fill="#e2e8f0" font-family="monospace" font-size="12">carrierConfig</text>
  <text x="640" y="270" fill="#e2e8f0" font-family="monospace" font-size="12">warehouseSlot</text>
  <text x="640" y="290" fill="#e2e8f0" font-family="monospace" font-size="12">findActiveCarriers()</text>

  <!-- Bottom annotation -->
  <text x="450" y="330" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">Every name pushed rightward removes one chunk from the reader's working memory</text>
</svg>
