<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400">
  <rect width="900" height="400" fill="#0f172a"/>
  <text x="450" y="30" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="16" font-weight="bold">What Automation Catches vs What Human Review Catches</text>

  <!-- Left zone: Automation -->
  <rect x="30" y="55" width="400" height="300" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="230" y="80" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold">Automated Tools Catch</text>
  <text x="230" y="95" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="10">Necessary but insufficient</text>

  <rect x="50" y="110" width="360" height="35" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="60" y="128" fill="#38bdf8" font-family="sans-serif" font-size="10">✓</text>
  <text x="80" y="128" fill="#e2e8f0" font-family="sans-serif" font-size="11">Formatting violations</text>
  <text x="380" y="128" text-anchor="end" fill="#94a3b8" font-family="sans-serif" font-size="10">Checkstyle</text>

  <rect x="50" y="152" width="360" height="35" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="60" y="170" fill="#38bdf8" font-family="sans-serif" font-size="10">✓</text>
  <text x="80" y="170" fill="#e2e8f0" font-family="sans-serif" font-size="11">Cognitive complexity thresholds</text>
  <text x="380" y="170" text-anchor="end" fill="#94a3b8" font-family="sans-serif" font-size="10">SonarQube</text>

  <rect x="50" y="194" width="360" height="35" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="60" y="212" fill="#38bdf8" font-family="sans-serif" font-size="10">✓</text>
  <text x="80" y="212" fill="#e2e8f0" font-family="sans-serif" font-size="11">Known bug patterns</text>
  <text x="380" y="212" text-anchor="end" fill="#94a3b8" font-family="sans-serif" font-size="10">SpotBugs</text>

  <rect x="50" y="236" width="360" height="35" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="60" y="254" fill="#38bdf8" font-family="sans-serif" font-size="10">✓</text>
  <text x="80" y="254" fill="#e2e8f0" font-family="sans-serif" font-size="11">Dependency rule violations</text>
  <text x="380" y="254" text-anchor="end" fill="#94a3b8" font-family="sans-serif" font-size="10">ArchUnit</text>

  <rect x="50" y="278" width="360" height="35" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="60" y="296" fill="#38bdf8" font-family="sans-serif" font-size="10">✓</text>
  <text x="80" y="296" fill="#e2e8f0" font-family="sans-serif" font-size="11">Test failures</text>
  <text x="380" y="296" text-anchor="end" fill="#94a3b8" font-family="sans-serif" font-size="10">JUnit + CI</text>

  <rect x="50" y="320" width="360" height="25" rx="5" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="230" y="338" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="10">Pattern-matchable, structural, deterministic</text>

  <!-- Right zone: Human Review -->
  <rect x="470" y="55" width="400" height="300" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="670" y="80" text-anchor="middle" fill="#f59e0b" font-family="sans-serif" font-size="14" font-weight="bold">Only Human Review Catches</text>
  <text x="670" y="95" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="10">Where readability is defended or lost</text>

  <rect x="490" y="110" width="360" height="35" rx="5" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
  <text x="500" y="128" fill="#f59e0b" font-family="sans-serif" font-size="10">⚠</text>
  <text x="520" y="128" fill="#e2e8f0" font-family="sans-serif" font-size="11">Naming quality and intent clarity</text>

  <rect x="490" y="152" width="360" height="35" rx="5" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
  <text x="500" y="170" fill="#f59e0b" font-family="sans-serif" font-size="10">⚠</text>
  <text x="520" y="170" fill="#e2e8f0" font-family="sans-serif" font-size="11">Responsibility coherence and class scope</text>

  <rect x="490" y="194" width="360" height="35" rx="5" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
  <text x="500" y="212" fill="#f59e0b" font-family="sans-serif" font-size="10">⚠</text>
  <text x="520" y="212" fill="#e2e8f0" font-family="sans-serif" font-size="11">Abstraction fitness (needed or not?)</text>

  <rect x="490" y="236" width="360" height="35" rx="5" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
  <text x="500" y="254" fill="#f59e0b" font-family="sans-serif" font-size="10">⚠</text>
  <text x="520" y="254" fill="#e2e8f0" font-family="sans-serif" font-size="11">Design trajectory and precedent setting</text>

  <rect x="490" y="278" width="360" height="35" rx="5" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
  <text x="500" y="296" fill="#f59e0b" font-family="sans-serif" font-size="10">⚠</text>
  <text x="520" y="296" fill="#e2e8f0" font-family="sans-serif" font-size="11">Unnecessary complexity and indirection</text>

  <rect x="490" y="320" width="360" height="25" rx="5" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="670" y="338" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="10">Context-dependent, semantic, requires judgment</text>

  <!-- Divider -->
  <line x1="450" y1="70" x2="450" y2="340" stroke="#475569" stroke-width="1" stroke-dasharray="5,5"/>

  <!-- Bottom annotation -->
  <text x="450" y="380" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="12">A PR that passes all automated checks can still make the codebase harder to understand.</text>
</svg>
