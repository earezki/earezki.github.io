<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <rect width="900" height="500" fill="#0f172a"/>
  <text x="450" y="35" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="16" font-weight="bold">Cognitive Complexity Distribution: Logistics Platform Baseline</text>

  <!-- Y axis -->
  <line x1="80" y1="60" x2="80" y2="400" stroke="#475569" stroke-width="1"/>
  <text x="40" y="235" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="12" transform="rotate(-90, 40, 235)">Number of Methods</text>

  <!-- X axis -->
  <line x1="80" y1="400" x2="850" y2="400" stroke="#475569" stroke-width="1"/>
  <text x="465" y="445" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="12">Cognitive Complexity Score</text>

  <!-- Y axis labels -->
  <text x="72" y="404" text-anchor="end" fill="#94a3b8" font-family="sans-serif" font-size="10">0</text>
  <text x="72" y="340" text-anchor="end" fill="#94a3b8" font-family="sans-serif" font-size="10">50</text>
  <text x="72" y="280" text-anchor="end" fill="#94a3b8" font-family="sans-serif" font-size="10">100</text>
  <text x="72" y="220" text-anchor="end" fill="#94a3b8" font-family="sans-serif" font-size="10">150</text>
  <text x="72" y="160" text-anchor="end" fill="#94a3b8" font-family="sans-serif" font-size="10">200</text>
  <text x="72" y="100" text-anchor="end" fill="#94a3b8" font-family="sans-serif" font-size="10">250</text>

  <!-- Grid lines -->
  <line x1="80" y1="336" x2="850" y2="336" stroke="#475569" stroke-width="0.5" stroke-dasharray="3,3"/>
  <line x1="80" y1="272" x2="850" y2="272" stroke="#475569" stroke-width="0.5" stroke-dasharray="3,3"/>
  <line x1="80" y1="208" x2="850" y2="208" stroke="#475569" stroke-width="0.5" stroke-dasharray="3,3"/>
  <line x1="80" y1="144" x2="850" y2="144" stroke="#475569" stroke-width="0.5" stroke-dasharray="3,3"/>

  <!-- Bars: 0-5 range (good) -->
  <rect x="100" y="92" width="80" height="308" rx="3" fill="#22c55e" opacity="0.8"/>
  <text x="140" y="415" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="10">0-5</text>
  <text x="140" y="85" text-anchor="middle" fill="#22c55e" font-family="sans-serif" font-size="11" font-weight="bold">241</text>

  <!-- 6-10 range (acceptable) -->
  <rect x="210" y="260" width="80" height="140" rx="3" fill="#22c55e" opacity="0.6"/>
  <text x="250" y="415" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="10">6-10</text>
  <text x="250" y="253" text-anchor="middle" fill="#22c55e" font-family="sans-serif" font-size="11" font-weight="bold">109</text>

  <!-- 11-15 range (borderline) -->
  <rect x="320" y="340" width="80" height="60" rx="3" fill="#f59e0b" opacity="0.8"/>
  <text x="360" y="415" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="10">11-15</text>
  <text x="360" y="333" text-anchor="middle" fill="#f59e0b" font-family="sans-serif" font-size="11" font-weight="bold">47</text>

  <!-- Threshold line at 15 -->
  <line x1="365" y1="60" x2="365" y2="400" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="375" y="75" fill="#ef4444" font-family="sans-serif" font-size="11" font-weight="bold">Threshold: 15</text>

  <!-- 16-20 range (problematic) -->
  <rect x="430" y="370" width="80" height="30" rx="3" fill="#ef4444" opacity="0.7"/>
  <text x="470" y="415" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="10">16-20</text>
  <text x="470" y="363" text-anchor="middle" fill="#ef4444" font-family="sans-serif" font-size="11" font-weight="bold">14</text>

  <!-- 21-25 range (high risk) -->
  <rect x="540" y="386" width="80" height="14" rx="3" fill="#ef4444" opacity="0.8"/>
  <text x="580" y="415" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="10">21-25</text>
  <text x="580" y="380" text-anchor="middle" fill="#ef4444" font-family="sans-serif" font-size="11" font-weight="bold">9</text>

  <!-- 26-30 range (critical) -->
  <rect x="650" y="390" width="80" height="10" rx="3" fill="#ef4444" opacity="0.9"/>
  <text x="690" y="415" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="10">26-30</text>
  <text x="690" y="384" text-anchor="middle" fill="#ef4444" font-family="sans-serif" font-size="11" font-weight="bold">7</text>

  <!-- 31+ range (critical) -->
  <rect x="760" y="391" width="80" height="9" rx="3" fill="#ef4444"/>
  <text x="800" y="415" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="10">31+</text>
  <text x="800" y="385" text-anchor="middle" fill="#ef4444" font-family="sans-serif" font-size="11" font-weight="bold">7</text>

  <!-- Annotation -->
  <rect x="470" y="62" width="370" height="55" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
  <text x="655" y="80" text-anchor="middle" fill="#ef4444" font-family="sans-serif" font-size="11" font-weight="bold">23 methods above threshold</text>
  <text x="655" y="95" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="10">Account for 68% of bug fixes in the past 6 months</text>
  <text x="655" y="110" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="10">Median review time: 90 min (vs 25 min for others)</text>

  <!-- Legend -->
  <rect x="80" y="455" width="770" height="35" rx="6" fill="#1e293b"/>
  <rect x="100" y="467" width="14" height="14" rx="2" fill="#22c55e"/>
  <text x="120" y="479" fill="#94a3b8" font-family="sans-serif" font-size="10">Low complexity</text>
  <rect x="250" y="467" width="14" height="14" rx="2" fill="#f59e0b"/>
  <text x="270" y="479" fill="#94a3b8" font-family="sans-serif" font-size="10">Borderline</text>
  <rect x="380" y="467" width="14" height="14" rx="2" fill="#ef4444"/>
  <text x="400" y="479" fill="#94a3b8" font-family="sans-serif" font-size="10">Above threshold (predicts review difficulty)</text>
</svg>
