<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <rect width="900" height="500" fill="#0f172a"/>
  <text x="450" y="30" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="16" font-weight="bold">Incremental Improvement: Readability Metrics Over 6 Months</text>

  <!-- Y axis -->
  <line x1="80" y1="60" x2="80" y2="400" stroke="#475569" stroke-width="1"/>

  <!-- X axis -->
  <line x1="80" y1="400" x2="850" y2="400" stroke="#475569" stroke-width="1"/>
  <text x="465" y="440" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="12">Sprint</text>

  <!-- X axis labels (12 sprints) -->
  <text x="145" y="418" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="10">1</text>
  <text x="210" y="418" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="10">2</text>
  <text x="275" y="418" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="10">3</text>
  <text x="340" y="418" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="10">4</text>
  <text x="405" y="418" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="10">5</text>
  <text x="470" y="418" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="10">6</text>
  <text x="535" y="418" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="10">7</text>
  <text x="600" y="418" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="10">8</text>
  <text x="665" y="418" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="10">9</text>
  <text x="730" y="418" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="10">10</text>
  <text x="795" y="418" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="10">11</text>

  <!-- Y axis: left (count) -->
  <text x="72" y="404" text-anchor="end" fill="#94a3b8" font-family="sans-serif" font-size="10">0</text>
  <text x="72" y="340" text-anchor="end" fill="#94a3b8" font-family="sans-serif" font-size="10">5</text>
  <text x="72" y="276" text-anchor="end" fill="#94a3b8" font-family="sans-serif" font-size="10">10</text>
  <text x="72" y="212" text-anchor="end" fill="#94a3b8" font-family="sans-serif" font-size="10">15</text>
  <text x="72" y="148" text-anchor="end" fill="#94a3b8" font-family="sans-serif" font-size="10">20</text>
  <text x="72" y="84" text-anchor="end" fill="#94a3b8" font-family="sans-serif" font-size="10">25</text>

  <!-- Grid lines -->
  <line x1="80" y1="336" x2="850" y2="336" stroke="#475569" stroke-width="0.3" stroke-dasharray="3,3"/>
  <line x1="80" y1="272" x2="850" y2="272" stroke="#475569" stroke-width="0.3" stroke-dasharray="3,3"/>
  <line x1="80" y1="208" x2="850" y2="208" stroke="#475569" stroke-width="0.3" stroke-dasharray="3,3"/>
  <line x1="80" y1="144" x2="850" y2="144" stroke="#475569" stroke-width="0.3" stroke-dasharray="3,3"/>

  <!-- Phase annotations -->
  <rect x="85" y="60" width="185" height="20" rx="3" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
  <text x="177" y="75" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="9">Phase 1-2: Baseline + ArchUnit</text>

  <rect x="275" y="60" width="190" height="20" rx="3" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
  <text x="370" y="75" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="9">Phase 3: Naming improvements</text>

  <rect x="470" y="60" width="190" height="20" rx="3" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
  <text x="565" y="75" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="9">Phase 4: God class extraction</text>

  <rect x="665" y="60" width="180" height="20" rx="3" fill="#1e293b" stroke="#475569" stroke-width="0.5"/>
  <text x="755" y="75" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="9">Phase 5-6: Packages + Visibility</text>

  <!-- Line 1: Methods above complexity 15 (red/warning) -->
  <polyline points="145,104 210,104 275,155 340,168 405,195 470,240 535,280 600,310 665,330 730,348 795,374"
    fill="none" stroke="#ef4444" stroke-width="2.5"/>
  <circle cx="145" cy="104" r="4" fill="#ef4444"/>
  <circle cx="795" cy="374" r="4" fill="#ef4444"/>
  <text x="148" y="97" fill="#ef4444" font-family="sans-serif" font-size="10">23</text>
  <text x="798" y="370" fill="#ef4444" font-family="sans-serif" font-size="10">4</text>

  <!-- Line 2: Circular dependencies (yellow) -->
  <polyline points="145,192 210,192 275,192 340,240 405,280 470,336 535,375 600,394 665,394 730,394 795,394"
    fill="none" stroke="#f59e0b" stroke-width="2.5"/>
  <circle cx="145" cy="192" r="4" fill="#f59e0b"/>
  <circle cx="795" cy="394" r="4" fill="#f59e0b"/>
  <text x="148" y="185" fill="#f59e0b" font-family="sans-serif" font-size="10">8</text>
  <text x="798" y="390" fill="#f59e0b" font-family="sans-serif" font-size="10">0</text>

  <!-- Line 3: Public class % (scaled: 100%=84, 28%=310) -->
  <polyline points="145,84 210,84 275,84 340,84 405,84 470,84 535,110 600,180 665,240 730,295 795,310"
    fill="none" stroke="#38bdf8" stroke-width="2.5"/>
  <circle cx="145" cy="84" r="4" fill="#38bdf8"/>
  <circle cx="795" cy="310" r="4" fill="#38bdf8"/>
  <text x="120" y="80" fill="#38bdf8" font-family="sans-serif" font-size="10">100%</text>
  <text x="810" y="305" fill="#38bdf8" font-family="sans-serif" font-size="10">28%</text>

  <!-- Legend -->
  <rect x="100" y="453" width="700" height="35" rx="6" fill="#1e293b"/>
  <line x1="120" y1="470" x2="160" y2="470" stroke="#ef4444" stroke-width="2.5"/>
  <circle cx="140" cy="470" r="3" fill="#ef4444"/>
  <text x="165" y="474" fill="#94a3b8" font-family="sans-serif" font-size="10">Methods above complexity 15</text>

  <line x1="370" y1="470" x2="410" y2="470" stroke="#f59e0b" stroke-width="2.5"/>
  <circle cx="390" cy="470" r="3" fill="#f59e0b"/>
  <text x="415" y="474" fill="#94a3b8" font-family="sans-serif" font-size="10">Circular dependencies</text>

  <line x1="590" y1="470" x2="630" y2="470" stroke="#38bdf8" stroke-width="2.5"/>
  <circle cx="610" cy="470" r="3" fill="#38bdf8"/>
  <text x="635" y="474" fill="#94a3b8" font-family="sans-serif" font-size="10">Public class ratio</text>
</svg>
